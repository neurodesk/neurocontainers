builder: neurodocker

# Include after the OpenRecon server installation. Preserve its import path.
directives:
  - file:
      name: siemens_twix2mrd.py
      filename: siemens_twix2mrd.py
  - run:
      - cp {{ get_file("siemens_twix2mrd.py") }} /opt/code/python-ismrmrd-server/siemens_twix2mrd.py
  - run:
      - chmod {{ context.converter_mode }} /opt/code/python-ismrmrd-server/siemens_twix2mrd.py
    condition: context.converter_mode is defined
