builder: neurodocker

# Include after the OpenRecon server installation. Preserve its import path.
directives:
  - file:
      name: dicom2mrd.py
      filename: dicom2mrd.py
  - run:
      - cp {{ get_file("dicom2mrd.py") }} /opt/code/python-ismrmrd-server/dicom2mrd.py
  - run:
      - chmod {{ context.converter_mode }} /opt/code/python-ismrmrd-server/dicom2mrd.py
    condition: context.converter_mode is defined
