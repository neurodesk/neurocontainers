name: Setup Apptainer
description: Install and verify an exact Apptainer release on native Linux runners.

inputs:
  apptainer-version:
    description: Apptainer version to install.
    required: true

outputs:
  apptainer-version:
    description: Installed Apptainer version.
    value: ${{ steps.install.outputs.apptainer-version }}

runs:
  using: composite
  steps:
    - name: Set up Go for the native ARM64 build
      if: runner.os == 'Linux' && runner.arch == 'ARM64'
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.1'
        cache: false
    - name: Install Apptainer
      id: install
      shell: bash
      env:
        APPTAINER_VERSION: ${{ inputs.apptainer-version }}
        GH_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/install.sh"
