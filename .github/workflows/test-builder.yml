name: FreeSurfer 6 candidate Docker acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Workflow run containing the fixed candidate artifact
        required: true
        type: string
      candidate_head:
        description: Exact recipe commit that produced the candidate
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  docker-acceptance:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install YAML reader
        run: python -m pip install PyYAML==6.0.2
      - name: Download exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_HEAD: ${{ inputs.candidate_head }}
        run: |
          gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "candidate-freesurfer6-$CANDIDATE_HEAD" --dir candidate
      - name: Verify and execute Docker archive
        env:
          EXPECTED_HEAD: ${{ inputs.candidate_head }}
        run: python tools/fs6_docker_acceptance.py candidate recipes/freesurfer6/fulltest.yaml docker-results
      - name: Retain exact-image Docker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freesurfer6-docker-acceptance
          path: docker-results/
          if-no-files-found: warn
