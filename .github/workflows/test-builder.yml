name: test-builder

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    paths:
      - 'builder/**'
      - 'workflows/**'
      - 'dashboard/**'
      - 'recipes/**/OpenReconLabel.json'
      - 'recipes/OpenReconSchema_1.1.0.json'
      # A dependency change can break collection of the suites below, so it has
      # to re-run them.
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'uv.lock'
      # Changing this workflow should re-run it.
      - '.github/workflows/test-builder.yml'

jobs:
  test-builder:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create Virtual Environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install -e '.[boutiques]'

      - name: Run Unit Tests
        run: |
          source venv/bin/activate
          pytest builder/tests

      - name: Set up Buildx for OCI integration tests
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Test base image flattening with BuildKit
        env:
          NEUROCONTAINERS_TEST_BUILDKIT: '1'
        run: |
          source venv/bin/activate
          pytest builder/tests/test_image_flatten.py

      - name: Run Tests
        run: |
          source venv/bin/activate
          ./workflows/test_all.sh

  test-go:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.1'

      - name: Test dashboard
        working-directory: dashboard
        run: go test ./...

      - name: Test docker-save-to-simg
        working-directory: builder
        run: go test docker-save-to-simg.go docker-save-to-simg_test.go
