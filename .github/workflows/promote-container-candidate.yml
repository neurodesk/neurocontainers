name: Promote merged container candidate

on:
  # Promotion starts from the trusted main-branch commit created by merging a
  # recipe PR. Besides keeping secrets away from PR-authored workflow code, the
  # push identity is required by the AWS OIDC role used for the blocking S3
  # upload. The resolve job binds that merge commit back to its merged PR and
  # exact candidate head SHA without fetching or executing the PR head.
  #
  # Note the limit of that claim. The candidate bundle is still fork-produced
  # *data*: it is unzipped, `docker load`ed, and published under official names.
  # The manifest supplies both the artifact and its checksum, so that check
  # proves transit integrity, not provenance.
  push:
    branches: [main]
    paths:
      # The trusted resolve job runs the same release planner as the PR gate and
      # schedules artifact promotion only when that plan contains candidates.
      # This broad trigger also catches recipe-local build inputs such as scripts.
      - "recipes/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged recipe PR to recover or republish
        required: true
        type: number

permissions: {}

concurrency:
  group: promote-container-and-metadata
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      should_promote: ${{ steps.pr.outputs.should_promote }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      merge_sha: ${{ steps.pr.outputs.merge_sha }}
      recipes: ${{ steps.plan.outputs.recipes }}
      release_plan: ${{ steps.plan.outputs.release_plan }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve trusted main event to a merged recipe PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let pr;
            if (context.eventName === 'workflow_dispatch') {
              const prNumber = Number(context.payload.inputs.pr_number);
              if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
                throw new Error(`Invalid PR number: ${context.payload.inputs.pr_number}`);
              }
              const response = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: prNumber,
              });
              pr = response.data;
            } else {
              const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner, repo: context.repo.repo,
                commit_sha: context.sha,
              });
              const merged = response.data.filter(item =>
                item.merged_at && item.base.ref === 'main'
              );
              const exact = merged.filter(item => item.merge_commit_sha === context.sha);
              if (exact.length === 1) {
                pr = exact[0];
              } else if (merged.length === 1) {
                pr = merged[0];
              } else if (merged.length === 0) {
                core.notice(`No merged PR is associated with ${context.sha}; nothing to promote`);
                core.setOutput('should_promote', 'false');
                return;
              } else {
                throw new Error(`Could not uniquely resolve ${context.sha} to a merged PR`);
              }
            }
            if (!pr.merged_at || pr.base.ref !== 'main') {
              throw new Error(`PR #${pr.number} is not merged into main`);
            }
            const mergeSha = context.eventName === 'workflow_dispatch'
              ? pr.merge_commit_sha
              : context.sha;
            if (!mergeSha) {
              throw new Error(`PR #${pr.number} has no merge commit SHA`);
            }
            core.setOutput('should_promote', 'true');
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('merge_sha', mergeSha);
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install release planner dependencies
        run: pip install pyyaml
      - name: Plan merged recipe changes
        id: plan
        if: steps.pr.outputs.should_promote == 'true'
        env:
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
        run: |
          base_sha="$(git rev-parse "${MERGE_SHA}^1")"
          python tools/one_pr_release.py --repo-root . detect \
            --base "${base_sha}" --head "${MERGE_SHA}"

  await_candidate:
    needs: resolve
    if: >-
      needs.resolve.outputs.should_promote == 'true' &&
      needs.resolve.outputs.recipes != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
    outputs:
      artifacts: ${{ steps.candidate.outputs.artifacts }}
    steps:
      - name: Wait for the successful candidate run for the exact PR head
        id: candidate
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner, repo: context.repo.repo,
            });
            const workflow = workflows.data.workflows.find(
              item => item.path === '.github/workflows/pr-container-candidate.yml'
            );
            if (!workflow) throw new Error('Candidate workflow not found');

            // A maintainer can merge before the candidate gate finishes. Wait
            // on a GitHub-hosted runner so promotion does not race that build
            // or occupy the ARC publishing runner while it is still running.
            const deadline = Date.now() + (170 * 60 * 1000);
            while (Date.now() < deadline) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: workflow.id, head_sha: headSha,
                event: 'pull_request', per_page: 50,
              });
              const run = response.data.workflow_runs.find(item =>
                item.head_sha === headSha && item.event === 'pull_request'
              );
              if (run && run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error(
                    `Candidate run ${run.id} completed with ${run.conclusion}`
                  );
                }
                const artifacts = await github.paginate(
                  github.rest.actions.listWorkflowRunArtifacts,
                  {owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100}
                );
                const suffix = `-${headSha}`;
                const candidates = artifacts.filter(item =>
                  !item.expired && item.name.startsWith('candidate-') &&
                  !item.name.startsWith('candidate-report-') && item.name.endsWith(suffix)
                );
                if (candidates.length === 0) {
                  throw new Error(`Successful candidate run ${run.id} has no candidate artifacts`);
                }
                core.setOutput(
                  'artifacts',
                  JSON.stringify(candidates.map(item => ({id: item.id, name: item.name})))
                );
                return;
              }
              core.info(
                run
                  ? `Candidate run ${run.id} is ${run.status}; checking again in 30 seconds`
                  : `Candidate run for ${headSha} is not visible yet; checking again in 30 seconds`
              );
              await new Promise(resolve => setTimeout(resolve, 30_000));
            }
            throw new Error(`Timed out waiting for candidate run for ${headSha}`);

  promote:
    needs: [resolve, await_candidate]
    if: >-
      needs.resolve.outputs.should_promote == 'true' &&
      needs.resolve.outputs.recipes != '[]'
    runs-on: neurodesk-syd-arcrunner-neurocontainers
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
      pull-requests: read
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install promotion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt python-swiftclient python-keystoneclient
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gh jq unzip
          if ! command -v aws >/dev/null 2>&1; then
            aws_archive="${RUNNER_TEMP}/awscliv2.zip"
            aws_install_dir="${RUNNER_TEMP}/aws-cli"
            curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
              -o "${aws_archive}"
            unzip -q "${aws_archive}" -d "${aws_install_dir}"
            sudo "${aws_install_dir}/aws/install"
            rm -rf "${aws_archive}" "${aws_install_dir}"
          fi
          aws --version
      - name: Download candidate bundles without executing them
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS: ${{ needs.await_candidate.outputs.artifacts }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          mkdir -p promotion-bundle
          echo "${ARTIFACTS}" | jq -c '.[]' | while read -r artifact; do
            id="$(echo "${artifact}" | jq -r '.id')"
            name="$(echo "${artifact}" | jq -r '.name')"
            container="${name#candidate-}"
            container="${container%-${HEAD_SHA}}"
            mkdir -p "promotion-bundle/${container}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > artifact.zip
            unzip -q artifact.zip -d "promotion-bundle/${container}"
            rm artifact.zip
          done
      - name: Verify candidate against merged recipes and checksums
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: |
          python tools/one_pr_release.py verify --bundle promotion-bundle \
            --head-sha "${HEAD_SHA}" --pr-number "${PR_NUMBER}" \
            --output verified-manifests.json
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Log in to Nectar registry
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: registry.rc.nectar.org.au
          username: ${{ secrets.REGISTRY_RC_NECTAR_ORG_AU_USERNAME }}
          password: ${{ secrets.REGISTRY_RC_NECTAR_ORG_AU_CLI_KEY }}
      - name: Log in to Quay
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Publish the exact tested Docker archives
        env:
          GH_REGISTRY: ${{ secrets.GH_REGISTRY }}
          DOCKERHUB_ORG: ${{ secrets.DOCKERHUB_ORG }}
        run: |
          jq -c '.[]' verified-manifests.json | while read -r manifest; do
            container="$(echo "${manifest}" | jq -r '.container')"
            version="$(echo "${manifest}" | jq -r '.version')"
            build_date="$(echo "${manifest}" | jq -r '.build_date')"
            archive="$(echo "${manifest}" | jq -r '.docker_archive')"
            source="$(echo "${manifest}" | jq -r '.candidate_tag')"
            docker load --input "promotion-bundle/${container}/${archive}"

            legacy="${container}_${version}"
            legacy_ghcr="ghcr.io/${GH_REGISTRY}/${legacy}"
            docker tag "${source}" "${legacy_ghcr}:${build_date}"
            docker tag "${source}" "${legacy_ghcr}:latest"
            docker push "${legacy_ghcr}:${build_date}"
            docker push "${legacy_ghcr}:latest"

            ghcr="ghcr.io/${GH_REGISTRY}/${container}"
            for tag in "${version}_${build_date}" "${version}" latest; do
              docker tag "${source}" "${ghcr}:${tag}"
              docker push "${ghcr}:${tag}"
            done

            for destination in \
              "${DOCKERHUB_ORG}/${legacy}" \
              "registry.rc.nectar.org.au/ssdsorg/${legacy}"; do
              docker tag "${source}" "${destination}:${build_date}"
              docker tag "${source}" "${destination}:latest"
              published=false
              for attempt in 1 2 3; do
                if docker push "${destination}:${build_date}" && \
                   docker push "${destination}:latest"; then
                  published=true
                  break
                fi
                if [ "${attempt}" -lt 3 ]; then
                  sleep $((attempt * 30))
                fi
              done
              if [ "${published}" != true ]; then
                echo "::warning::Optional registry publish failed for ${destination}"
              fi
            done

            quay="quay.io/neurodesk/${container}"
            for tag in "${version}_${build_date}" "${version}" latest; do
              docker tag "${source}" "${quay}:${tag}"
              docker push "${quay}:${tag}" || \
                echo "::warning::Optional Quay publish failed for ${quay}:${tag}"
            done
          done
      # New Quay repositories default to private. The robot credentials used
      # for image pushes cannot change visibility, so retain the legacy
      # best-effort API step with the separately scoped admin token.
      - name: Make Quay repositories public
        env:
          QUAY_API_TOKEN: ${{ secrets.QUAY_API_TOKEN }}
        run: |
          jq -r '.[].container' verified-manifests.json | sort -u | while read -r container; do
            if [ -z "${QUAY_API_TOKEN:-}" ]; then
              echo "::warning::QUAY_API_TOKEN is not set; cannot confirm neurodesk/${container} is public"
              continue
            fi
            response="${RUNNER_TEMP}/quay-visibility-${container}.json"
            code="$(curl -sS -o "${response}" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${QUAY_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"visibility":"public"}' \
              "https://quay.io/api/v1/repository/neurodesk/${container}/changevisibility" || true)"
            if [ "${code}" = 200 ]; then
              echo "neurodesk/${container} is public"
            else
              echo "::warning::Could not set neurodesk/${container} public (HTTP ${code:-request-failed})"
              cat "${response}" 2>/dev/null || true
            fi
          done
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2
      - name: Publish tested SIFs to object storage
        env:
          OS_AUTH_URL: ${{ secrets.SWIFT_OS_AUTH_URL }}
          OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.SWIFT_OS_APPLICATION_CREDENTIAL_ID }}
          OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.SWIFT_OS_APPLICATION_CREDENTIAL_SECRET }}
          OS_AUTH_TYPE: v3applicationcredential
          OS_IDENTITY_API_VERSION: "3"
        run: |
          jq -c '.[]' verified-manifests.json | while read -r manifest; do
            container="$(echo "${manifest}" | jq -r '.container')"
            sif="$(echo "${manifest}" | jq -r '.sif')"
            path="promotion-bundle/${container}/${sif}"
            aws s3 cp "${path}" "s3://neurocontainers/${sif}"
            aws s3api head-object --bucket neurocontainers --key "${sif}" >/dev/null
            swift upload neurodesk "${path}" --object-name "${sif}" \
              --segment-size 1073741824 --segment-threads 10 || \
              echo "::warning::Nectar object upload failed for ${sif}"
          done
      - name: Attach tested SIFs to OCI images
        env:
          GH_REGISTRY: ${{ secrets.GH_REGISTRY }}
        run: |
          oras_archive="${RUNNER_TEMP}/oras_1.2.0_linux_amd64.tar.gz"
          curl -fsSL \
            https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            -o "${oras_archive}"
          echo "5b3f1cbb86d869eee68120b9b45b9be983f3738442f87ee5f06b00edd0bab336  ${oras_archive}" \
            | sha256sum -c -
          sudo tar -xzf "${oras_archive}" -C /usr/local/bin oras
          rm "${oras_archive}"
          jq -c '.[]' verified-manifests.json | while read -r manifest; do
            container="$(echo "${manifest}" | jq -r '.container')"
            version="$(echo "${manifest}" | jq -r '.version')"
            build_date="$(echo "${manifest}" | jq -r '.build_date')"
            sif="$(echo "${manifest}" | jq -r '.sif')"
            cp "promotion-bundle/${container}/${sif}" "${RUNNER_TEMP}/${sif}"
            cd "${RUNNER_TEMP}"
            oras attach --artifact-type application/vnd.sylabs.sif.layer.v1.sif \
              --annotation "org.opencontainers.image.title=${container}" \
              --annotation "org.opencontainers.image.version=${version}_${build_date}" \
              "ghcr.io/${GH_REGISTRY}/${container}:${version}_${build_date}" \
              "${sif}:application/vnd.sylabs.sif.layer.v1.sif"
            oras attach --artifact-type application/vnd.sylabs.sif.layer.v1.sif \
              --annotation "org.opencontainers.image.title=${container}" \
              --annotation "org.opencontainers.image.version=${version}_${build_date}" \
              "quay.io/neurodesk/${container}:${version}_${build_date}" \
              "${sif}:application/vnd.sylabs.sif.layer.v1.sif" || \
              echo "::warning::Optional Quay SIF attach failed for ${container}"
            cd "${GITHUB_WORKSPACE}"
          done
      # Candidate downloads and multi-registry publication can take longer than
      # a GitHub App installation token's one-hour lifetime. Mint the
      # ruleset-authorized token only when the metadata is ready to be pushed.
      - name: Create fresh release token for metadata push
        id: metadata-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.NEUROCONTAINERS_RELEASE_APP_ID }}
          private-key: ${{ secrets.NEUROCONTAINERS_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit generated release metadata directly to main
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          RELEASE_TOKEN: ${{ steps.metadata-token.outputs.token }}
        run: |
          python tools/one_pr_release.py materialize --bundle promotion-bundle \
            --manifests verified-manifests.json
          git config user.name "neurocontainers-release[bot]"
          git config user.email "neurocontainers-release[bot]@users.noreply.github.com"
          git add releases/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish tested container release metadata [skipci]"
          basic_auth="$(printf 'x-access-token:%s' "${RELEASE_TOKEN}" | base64 | tr -d '\n')"
          git_auth_header="AUTHORIZATION: basic ${basic_auth}"
          unset basic_auth
          for attempt in 1 2 3; do
            if ! git -c http.https://github.com/.extraheader="${git_auth_header}" \
                pull --rebase origin main; then
              git rebase --abort || true
              sleep $((attempt * 5))
              continue
            fi
            python tools/one_pr_release.py verify --bundle promotion-bundle \
              --head-sha "${HEAD_SHA}" --pr-number "${PR_NUMBER}" \
              --output verified-manifests.json
            if git -c http.https://github.com/.extraheader="${git_auth_header}" \
                push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Release metadata push failed after three attempts; artifacts are already published."
          exit 1
      - name: Sync OpenRecon metadata
        env:
          GH_TOKEN: ${{ secrets.NEURODESK_GITHUB_TOKEN_ISSUE_AUTOMATION }}
        run: |
          set -euo pipefail
          gh auth setup-git
          jq -c '.[] | select(.architecture == "x86_64" and .variant == "")' \
            verified-manifests.json | while IFS= read -r manifest; do
              recipe="$(echo "${manifest}" | jq -r '.recipe')"
              version="$(echo "${manifest}" | jq -r '.version')"
              python tools/sync_openrecon.py --recipe "${recipe}" --version "${version}" --dispatch-unchanged
            done

  report_promotion:
    needs: [resolve, await_candidate, promote]
    if: >-
      always() &&
      needs.resolve.outputs.should_promote == 'true' &&
      needs.resolve.outputs.pr_number != ''
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    steps:
      - name: Update the existing container lifecycle comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          AWAIT_RESULT: ${{ needs.await_candidate.result }}
          PROMOTION_RESULT: ${{ needs.promote.result }}
        with:
          script: |
            const issue_number = Number(process.env.PR_NUMBER);
            const marker = '<!-- one-pr-container-candidate -->';
            const lifecycleStart = '<!-- container-release-status:start -->';
            const lifecycleEnd = '<!-- container-release-status:end -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (!existing) {
              core.notice(
                `PR #${issue_number} has no candidate comment yet; ` +
                'the candidate reporter will include this promotion state when it creates one.'
              );
              return;
            }

            const startIndex = existing.body.indexOf(lifecycleStart);
            const endIndex = existing.body.indexOf(lifecycleEnd);
            const identity = existing.body.match(
              /<!-- container-release-identity: ([^\n]+) -->/
            )?.[1] || 'Container candidate';
            if (startIndex < 0 || endIndex < startIndex) {
              core.setFailed(`PR #${issue_number} candidate comment has no lifecycle status block`);
              return;
            }

            const runUrl =
              `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const awaitResult = process.env.AWAIT_RESULT;
            const promotionResult = process.env.PROMOTION_RESULT;
            let heading;
            let action;
            if (promotionResult === 'success') {
              heading = `## ✅ ${identity} published from the tested candidate`;
              action = '**Action required:** None. The PR is merged and automatic promotion completed successfully.';
            } else if (awaitResult === 'failure' || awaitResult === 'cancelled') {
              heading = `## ⚠️ ${identity} merged — candidate promotion is blocked`;
              action = `**Action required:** Inspect the candidate wait failure, then rerun \`Promote merged container candidate\` with \`pr_number=${issue_number}\`. Do not rebuild a candidate that has already passed.`;
            } else {
              const promotionOutcome = promotionResult === 'failure'
                ? 'failed'
                : promotionResult;
              heading = `## ⚠️ ${identity} candidate passed — promotion ${promotionOutcome}`;
              action = `**Action required:** Investigate the failed promotion, then rerun \`Promote merged container candidate\` with \`pr_number=${issue_number}\`. Do not rebuild the candidate.`;
            }
            const replacement = [
              lifecycleStart,
              heading,
              '',
              action,
              '',
              `**Promotion:** [run ${context.runNumber}](${runUrl}) — ${promotionResult}`,
              lifecycleEnd,
            ].join('\n');
            const updatedBody =
              existing.body.slice(0, startIndex) + replacement +
              existing.body.slice(endIndex + lifecycleEnd.length);
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: updatedBody,
            });
