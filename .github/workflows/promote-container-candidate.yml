name: Promote merged container candidate

on:
  # pull_request_target, not pull_request, for two reasons that both matter.
  #
  # Security: under `pull_request` the workflow file comes from the fork, so a
  # fork PR can rewrite this file (including the `merged == true` guard below)
  # and obtain a self-hosted runner. Under `pull_request_target` the definition
  # always comes from the base repo, which removes that path structurally rather
  # than relying on the fork-PR approval setting.
  #
  # Correctness: `pull_request` withholds secrets from fork PRs, so a merged
  # community recipe PR reached the publish steps with empty credentials and
  # could never promote.
  #
  # This is only safe because no step checks out or executes PR-authored *code*:
  # the checkout pins `ref: main`, candidate lookup binds artifacts to the event's
  # exact head SHA, and verification compares them with the merged recipe. Do not
  # add a step that fetches, checks out, or runs the pull request's head ref.
  #
  # Note the limit of that claim. The candidate bundle is still fork-produced
  # *data*: it is unzipped, `docker load`ed, and published under official names.
  # The manifest supplies both the artifact and its checksum, so that check
  # proves transit integrity, not provenance.
  pull_request_target:
    types: [closed]
    paths:
      # Must stay aligned with detect_recipes() in tools/one_pr_release.py, which
      # only treats a PR as a candidate PR when a recipes/*/build.yaml changed.
      # On "recipes/**" this fired for fulltest-, icon- and README-only PRs, which
      # build no candidate: detect returns [], the candidate job is skipped, the
      # gate short-circuits to success, and promote then threw "No unexpired
      # candidate artifacts found" on a PR that was never supposed to publish.
      # PR #2990 is the worked example. Every build.yaml sits at exactly this
      # depth, and GitHub's `*` does not cross `/`, so this matches all of them.
      - "recipes/*/build.yaml"

permissions:
  actions: read
  contents: write
  id-token: write
  packages: write

concurrency:
  group: promote-container-and-metadata
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  promote:
    if: github.event.pull_request.merged == true
    runs-on: neurodesk-syd-arcrunner-neurocontainers
    steps:
      - name: Create narrowly scoped release token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.NEUROCONTAINERS_RELEASE_APP_ID }}
          private-key: ${{ secrets.NEUROCONTAINERS_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # Intentionally retained for the final ruleset-authorized metadata push.
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install promotion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt python-swiftclient python-keystoneclient
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gh jq unzip
      - name: Locate the successful run for the exact PR head
        id: candidate
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner, repo: context.repo.repo,
            });
            const workflow = workflows.data.workflows.find(
              item => item.path === '.github/workflows/pr-container-candidate.yml'
            );
            if (!workflow) throw new Error('Candidate workflow not found');
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              // Coupled to pr-container-candidate.yml's trigger. If that
              // workflow ever moves to pull_request_target, this finds no runs
              // and promotion fails silently rather than loudly.
              workflow_id: workflow.id, head_sha: pr.head.sha,
              event: 'pull_request', status: 'completed', per_page: 50,
            });
            // Fork-originated runs can have an empty pull_requests array. The
            // API query and this explicit comparison bind the run to the head;
            // the downloaded manifest later binds it to the PR number.
            const run = response.data.workflow_runs.find(item =>
              item.conclusion === 'success' && item.head_sha === pr.head.sha
            );
            if (!run) throw new Error(`No successful candidate run for ${pr.head.sha}`);
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100}
            );
            const suffix = `-${pr.head.sha}`;
            const candidates = artifacts.filter(item =>
              !item.expired && item.name.startsWith('candidate-') && item.name.endsWith(suffix)
            );
            if (candidates.length === 0) throw new Error('No unexpired candidate artifacts found');
            core.setOutput('artifacts', JSON.stringify(candidates.map(item => ({id: item.id, name: item.name}))));
      - name: Download candidate bundles without executing them
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS: ${{ steps.candidate.outputs.artifacts }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p promotion-bundle
          echo "${ARTIFACTS}" | jq -c '.[]' | while read -r artifact; do
            id="$(echo "${artifact}" | jq -r '.id')"
            name="$(echo "${artifact}" | jq -r '.name')"
            container="${name#candidate-}"
            container="${container%-${HEAD_SHA}}"
            mkdir -p "promotion-bundle/${container}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > artifact.zip
            unzip -q artifact.zip -d "promotion-bundle/${container}"
            rm artifact.zip
          done
      - name: Verify candidate against merged recipes and checksums
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python tools/one_pr_release.py verify --bundle promotion-bundle \
            --head-sha "${HEAD_SHA}" --pr-number "${PR_NUMBER}" \
            --output verified-manifests.json
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Log in to Nectar registry
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: registry.rc.nectar.org.au
          username: ${{ secrets.REGISTRY_RC_NECTAR_ORG_AU_USERNAME }}
          password: ${{ secrets.REGISTRY_RC_NECTAR_ORG_AU_CLI_KEY }}
      - name: Log in to Quay
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Publish the exact tested Docker archives
        env:
          GH_REGISTRY: ${{ secrets.GH_REGISTRY }}
          DOCKERHUB_ORG: ${{ secrets.DOCKERHUB_ORG }}
        run: |
          jq -c '.[]' verified-manifests.json | while read -r manifest; do
            container="$(echo "${manifest}" | jq -r '.container')"
            version="$(echo "${manifest}" | jq -r '.version')"
            build_date="$(echo "${manifest}" | jq -r '.build_date')"
            archive="$(echo "${manifest}" | jq -r '.docker_archive')"
            source="$(echo "${manifest}" | jq -r '.candidate_tag')"
            docker load --input "promotion-bundle/${container}/${archive}"

            legacy="${container}_${version}"
            legacy_ghcr="ghcr.io/${GH_REGISTRY}/${legacy}"
            docker tag "${source}" "${legacy_ghcr}:${build_date}"
            docker tag "${source}" "${legacy_ghcr}:latest"
            docker push "${legacy_ghcr}:${build_date}"
            docker push "${legacy_ghcr}:latest"

            ghcr="ghcr.io/${GH_REGISTRY}/${container}"
            for tag in "${version}_${build_date}" "${version}" latest; do
              docker tag "${source}" "${ghcr}:${tag}"
              docker push "${ghcr}:${tag}"
            done

            for destination in \
              "${DOCKERHUB_ORG}/${legacy}" \
              "registry.rc.nectar.org.au/ssdsorg/${legacy}"; do
              docker tag "${source}" "${destination}:${build_date}"
              docker tag "${source}" "${destination}:latest"
              if ! docker push "${destination}:${build_date}" || \
                 ! docker push "${destination}:latest"; then
                echo "::warning::Optional registry publish failed for ${destination}"
              fi
            done

            quay="quay.io/neurodesk/${container}"
            for tag in "${version}_${build_date}" "${version}" latest; do
              docker tag "${source}" "${quay}:${tag}"
              docker push "${quay}:${tag}" || \
                echo "::warning::Optional Quay publish failed for ${quay}:${tag}"
            done
          done
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2
      - name: Publish tested SIFs to object storage
        env:
          OS_AUTH_URL: ${{ secrets.SWIFT_OS_AUTH_URL }}
          OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.SWIFT_OS_APPLICATION_CREDENTIAL_ID }}
          OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.SWIFT_OS_APPLICATION_CREDENTIAL_SECRET }}
          OS_AUTH_TYPE: v3applicationcredential
          OS_IDENTITY_API_VERSION: "3"
        run: |
          jq -c '.[]' verified-manifests.json | while read -r manifest; do
            container="$(echo "${manifest}" | jq -r '.container')"
            sif="$(echo "${manifest}" | jq -r '.sif')"
            path="promotion-bundle/${container}/${sif}"
            aws s3 cp "${path}" "s3://neurocontainers/${sif}"
            aws s3api head-object --bucket neurocontainers --key "${sif}" >/dev/null
            swift upload neurodesk "${path}" --object-name "${sif}" \
              --segment-size 1073741824 --segment-threads 10 || \
              echo "::warning::Nectar object upload failed for ${sif}"
          done
      - name: Attach tested SIFs to OCI images
        env:
          GH_REGISTRY: ${{ secrets.GH_REGISTRY }}
        run: |
          oras_archive="${RUNNER_TEMP}/oras_1.2.0_linux_amd64.tar.gz"
          curl -fsSL \
            https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            -o "${oras_archive}"
          echo "5b3f1cbb86d869eee68120b9b45b9be983f3738442f87ee5f06b00edd0bab336  ${oras_archive}" \
            | sha256sum -c -
          sudo tar -xzf "${oras_archive}" -C /usr/local/bin oras
          rm "${oras_archive}"
          jq -c '.[]' verified-manifests.json | while read -r manifest; do
            container="$(echo "${manifest}" | jq -r '.container')"
            version="$(echo "${manifest}" | jq -r '.version')"
            build_date="$(echo "${manifest}" | jq -r '.build_date')"
            sif="$(echo "${manifest}" | jq -r '.sif')"
            cp "promotion-bundle/${container}/${sif}" "${RUNNER_TEMP}/${sif}"
            cd "${RUNNER_TEMP}"
            oras attach --artifact-type application/vnd.sylabs.sif.layer.v1.sif \
              "ghcr.io/${GH_REGISTRY}/${container}:${version}_${build_date}" \
              "${sif}:application/vnd.sylabs.sif.layer.v1.sif"
            oras attach --artifact-type application/vnd.sylabs.sif.layer.v1.sif \
              "quay.io/neurodesk/${container}:${version}_${build_date}" \
              "${sif}:application/vnd.sylabs.sif.layer.v1.sif" || \
              echo "::warning::Optional Quay SIF attach failed for ${container}"
            cd "${GITHUB_WORKSPACE}"
          done
      - name: Commit generated release metadata directly to main
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python tools/one_pr_release.py materialize --bundle promotion-bundle \
            --manifests verified-manifests.json
          git config user.name "neurocontainers-release[bot]"
          git config user.email "neurocontainers-release[bot]@users.noreply.github.com"
          git add releases/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish tested container release metadata [skipci]"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              sleep $((attempt * 5))
              continue
            fi
            python tools/one_pr_release.py verify --bundle promotion-bundle \
              --head-sha "${HEAD_SHA}" --pr-number "${PR_NUMBER}" \
              --output verified-manifests.json
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Release metadata push failed after three attempts; artifacts are already published."
          exit 1
      - name: Sync OpenRecon metadata
        env:
          GH_TOKEN: ${{ secrets.NEURODESK_GITHUB_TOKEN_ISSUE_AUTOMATION }}
        run: |
          set -euo pipefail
          gh auth setup-git
          jq -c '.[] | select(.architecture == "x86_64" and .variant == "")' \
            verified-manifests.json | while IFS= read -r manifest; do
              recipe="$(echo "${manifest}" | jq -r '.recipe')"
              version="$(echo "${manifest}" | jq -r '.version')"
              python tools/sync_openrecon.py --recipe "${recipe}" --version "${version}"
            done
