name: Validate Recipe YAML

on:
  pull_request:
    paths:
      - 'recipes/**/*.yaml'
      - 'recipes/**/*.yml'
      - 'recipes/**/OpenReconLabel.json'
      - 'recipes/OpenReconSchema_1.1.0.json'
      - 'builder/**'
      - 'workflows/**'
      - 'tools/**'
      - 'macros/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-recipes:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -e '.[dev,boutiques]'

      - name: Require an update policy for every recipe
        run: python -m builder.audit_updates

      - name: Validate OpenRecon labels
        run: python workflows/validate_openrecon_labels.py --experimental-raw-return

      - name: Validate changed recipes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Validating changed recipe files..."
          
          validation_failed=false
          
          # NUL delimiters keep spaces, newlines and shell metacharacters in
          # filenames as data. Git errors fail this step before validation starts.
          git diff --name-only -z "$BASE_SHA...$HEAD_SHA" -- recipes/ > "$RUNNER_TEMP/changed-recipes"
          mapfile -d '' -t changed_files < "$RUNNER_TEMP/changed-recipes"
          for file in "${changed_files[@]}"; do
            recipe_file=""
            if [[ "$file" == *"/build.yaml" ]] || [[ "$file" == *"/build.yml" ]]; then
              recipe_file="$file"
            elif [[ "$file" == *"/fulltest.yaml" ]]; then
              recipe_file="${file%/fulltest.yaml}/build.yaml"
            fi

            if [[ -n "$recipe_file" ]] && [[ -f "$recipe_file" ]]; then
              echo "::group::Validating $recipe_file"
              if python builder/validation.py "$recipe_file" --verbose; then
                echo "✅ $recipe_file and its fulltest contract are valid"
              else
                echo "❌ $recipe_file failed validation"
                validation_failed=true
              fi
              echo "::endgroup::"
            fi
          done
          
          if [[ "$validation_failed" == "true" ]]; then
            echo "::error::One or more recipe files failed validation"
            exit 1
          else
            echo "✅ All changed recipe files are valid"
          fi

      - name: Validate all recipes (full validation)
        if: contains(github.event.pull_request.labels.*.name, 'validate-all')
        run: |
          echo "Running full validation on all recipes..."
          ./workflows/validate_all.sh
