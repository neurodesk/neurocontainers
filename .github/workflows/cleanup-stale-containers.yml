name: Cleanup stale container images

on:
  workflow_dispatch:
  schedule:
    - cron: '25 11 * * *'
  workflow_run:
    workflows:
      - Update neurocontainers
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: cleanup-stale-containers
  cancel-in-progress: false

jobs:
  cleanup:
    if: |
      github.repository == 'neurodesk/neurocontainers' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_run') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Fetch domain catalogs from Cloudflare
        env:
          CATALOG_BASE_URL: ${{ vars.APPS_CATALOG_URL || 'https://apps-json.scigetorg.workers.dev' }}
          CATALOG_DOMAINS: ${{ vars.APPS_CATALOG_DOMAINS || 'neuroimaging' }}
        run: |
          set -euo pipefail
          for domain in $CATALOG_DOMAINS; do
            mkdir -p "apps-catalog/$domain"
            curl -fsSL "$CATALOG_BASE_URL/$domain/apps.json" \
              -o "apps-catalog/$domain/apps.json"
          done
          python3 -c 'import json,pathlib; merged={}; [merged.update(json.loads((d/"apps.json").read_text())) for d in pathlib.Path("apps-catalog").iterdir() if d.is_dir() and (d/"apps.json").exists()]; print(json.dumps(merged))' > apps-catalog/apps.json
          python3 -c 'import json,pathlib; print(json.dumps({"domains":{d.name:{} for d in pathlib.Path("apps-catalog").iterdir() if d.is_dir() and (d/"apps.json").exists()}}))' > apps-catalog/domains.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          aws-region: us-east-2
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - name: Install storage clients
        run: |
          set -euo pipefail
          if ! command -v rclone >/dev/null; then
            curl -fsSL https://rclone.org/install.sh | sudo bash
          fi
          if ! command -v aws >/dev/null; then
            curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
              -o "$RUNNER_TEMP/awscliv2.zip"
            unzip -q "$RUNNER_TEMP/awscliv2.zip" -d "$RUNNER_TEMP"
            sudo "$RUNNER_TEMP/aws/install"
          fi
      - name: Remove old SIFs from Nectar and S3
        env:
          OS_AUTH_URL: ${{ secrets.SWIFT_OS_AUTH_URL }}
          OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.SWIFT_OS_APPLICATION_CREDENTIAL_ID }}
          OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.SWIFT_OS_APPLICATION_CREDENTIAL_SECRET }}
          OS_AUTH_TYPE: v3applicationcredential
          OS_IDENTITY_API_VERSION: '3'
        run: |
          set -euo pipefail
          rclone config create nectar swift env_auth true
          python3 tools/cleanup_stale_containers.py \
            --s3-bucket neurocontainers \
            --catalog-root apps-catalog \
            --retention-days 7 \
            --apply
