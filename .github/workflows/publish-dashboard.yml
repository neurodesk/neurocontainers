name: Publish Dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: dashboard-site
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'neurodesk/neurocontainers'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check out published domain catalogs
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.APPS_CATALOG_REPOSITORY || 'scigetorg/apps.json' }}
          path: apps-catalog
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.1"
          cache: true

      - name: Build static dashboard
        run: |
          cd dashboard
          go run . --out ../public --releases-dir ../releases --recipes-dir ../recipes --catalog-root ../apps-catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.repository == 'neurodesk/neurocontainers'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
