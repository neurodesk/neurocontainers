name: Publish Dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: dashboard-site
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'neurodesk/neurocontainers'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch domain catalogs from Cloudflare
        env:
          CATALOG_BASE_URL: ${{ vars.APPS_CATALOG_URL || 'https://apps-json.scigetorg.workers.dev' }}
          CATALOG_DOMAINS: ${{ vars.APPS_CATALOG_DOMAINS || 'neuroimaging' }}
        run: |
          set -euo pipefail
          for domain in $CATALOG_DOMAINS; do
            mkdir -p "apps-catalog/$domain"
            curl -fsSL "$CATALOG_BASE_URL/$domain/apps.json" \
              -o "apps-catalog/$domain/apps.json"
          done
          python3 -c 'import json,pathlib; merged={}; [merged.update(json.loads((d/"apps.json").read_text())) for d in pathlib.Path("apps-catalog").iterdir() if d.is_dir() and (d/"apps.json").exists()]; print(json.dumps(merged))' > apps-catalog/apps.json
          python3 -c 'import json,pathlib; print(json.dumps({"domains":{d.name:{} for d in pathlib.Path("apps-catalog").iterdir() if d.is_dir() and (d/"apps.json").exists()}}))' > apps-catalog/domains.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.1"
          cache: true

      - name: Build static dashboard
        run: |
          cd dashboard
          go run . --out ../public --releases-dir ../releases --recipes-dir ../recipes --catalog-root ../apps-catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.repository == 'neurodesk/neurocontainers'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
