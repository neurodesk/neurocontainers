name: PR container candidate

on:
  # No paths filter: "Container release gate" is a required status check, so it
  # has to report on every pull request. A path-filtered workflow never runs for
  # non-recipe changes, and a required check that never reports blocks the merge
  # forever. The gate short-circuits below when no recipes changed.
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: container-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect:
    runs-on: ubuntu-22.04
    outputs:
      recipes: ${{ steps.detect.outputs.recipes }}
      targets: ${{ steps.detect.outputs.targets }}
    steps:
      # Run detection from the trusted base revision. A fork cannot change the
      # policy script before it decides that the PR is recipe-only.
      - name: Checkout trusted base
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false
      - name: Checkout candidate source
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Detect recipe-only changes
        id: detect
        working-directory: source
        env:
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch "https://github.com/${BASE_REPOSITORY}.git" "${BASE_SHA}"
          python ../trusted/tools/one_pr_release.py --repo-root . detect \
            --base "${BASE_SHA}" --head "${HEAD_SHA}"

  candidate:
    name: candidate (${{ matrix.container }})
    needs: detect
    if: ${{ needs.detect.outputs.recipes != '[]' }}
    # ARC pods are ephemeral; untrusted recipe build commands never run on a
    # persistent self-hosted machine. The ARM64 pool must satisfy the same
    # property: Blacksmith runners are ephemeral cloud VMs, not persistent hosts.
    runs-on: ${{ matrix.architecture == 'aarch64' && 'blacksmith-8vcpu-ubuntu-2404-arm' || 'neurodesk-syd-arcrunner-neurocontainers' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.targets) }}
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install test data tooling
        run: |
          # fulltest suites declare required_files: from OpenNeuro, which
          # builder/run_tests.py fetches with datalad. Without this the runner
          # raises FileNotFoundError: 'datalad' and the candidate fails after a
          # full image build. Mirrors the install in run-fulltest.yml.
          uv pip install --system datalad datalad-installer
          datalad-installer --sudo ok git-annex -m datalad/packages
          git-annex version
          datalad --version
      - name: Configure git for DataLad
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install Apptainer
        uses: ./.github/actions/setup-apptainer
        with:
          apptainer-version: 1.4.3
      - name: Prepare Apptainer scratch directories
        run: |
          set -euo pipefail
          # Apptainer otherwise falls back to $HOME/.apptainer, which does not
          # exist on the ARC runner pods and fails the build with
          # "failed to create build parent dir".
          BASE_PATH="${RUNNER_TEMP:-/tmp}"
          mkdir -p "$BASE_PATH/apptainer/cache" "$BASE_PATH/apptainer/tmp"
          {
            echo "APPTAINER_CACHEDIR=$BASE_PATH/apptainer/cache"
            echo "APPTAINER_TMPDIR=$BASE_PATH/apptainer/tmp"
            echo "SINGULARITY_CACHEDIR=$BASE_PATH/apptainer/cache"
            echo "SINGULARITY_TMPDIR=$BASE_PATH/apptainer/tmp"
          } >> "$GITHUB_ENV"
      - name: Inspect recipe
        id: info
        env:
          RECIPE: ${{ matrix.recipe }}
          VARIANT: ${{ matrix.variant }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/one_pr_release.py inspect \
            --recipe "${RECIPE}" --variant "${VARIANT}" --head-sha "${HEAD_SHA}"
      - name: Stage and build candidate
        env:
          RECIPE: ${{ matrix.recipe }}
          VARIANT: ${{ matrix.variant }}
          ARCHITECTURE: ${{ matrix.architecture }}
          CONTAINER: ${{ matrix.container }}
          CANDIDATE_TAG: ${{ steps.info.outputs.candidate_tag }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m builder stage "${RECIPE}" --recreate --download \
            --architecture "${ARCHITECTURE}" --variant "${VARIANT}"
          dockerfile="$(find "build/${CONTAINER}" -maxdepth 1 -iname '*.Dockerfile' -print -quit)"
          test -n "${dockerfile}"
          docker buildx build "build/${CONTAINER}" --load \
            --file "${dockerfile}" --tag "${CANDIDATE_TAG}" \
            --build-context "neurocontainer-cache=build/${CONTAINER}/cache" \
            --label "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}" \
            --label "GITHUB_SHA=${HEAD_SHA}"
      - name: Create immutable candidate files
        env:
          CONTAINER: ${{ matrix.container }}
          CANDIDATE_TAG: ${{ steps.info.outputs.candidate_tag }}
          DOCKER_ARCHIVE: ${{ steps.info.outputs.docker_archive }}
          SIF: ${{ steps.info.outputs.sif }}
        run: |
          mkdir -p "candidate/${CONTAINER}"
          docker save "${CANDIDATE_TAG}" --output "candidate/${CONTAINER}/${DOCKER_ARCHIVE}"
          apptainer build "candidate/${CONTAINER}/${SIF}" "docker-archive://candidate/${CONTAINER}/${DOCKER_ARCHIVE}"
      - name: Run deploy and fulltest checks
        id: fulltest
        continue-on-error: true
        env:
          RECIPE: ${{ matrix.recipe }}
          CONTAINER: ${{ matrix.container }}
          VERSION: ${{ steps.info.outputs.version }}
          SIF: ${{ steps.info.outputs.sif }}
        run: |
          python -m workflows.release_test_runner \
            --recipe "${RECIPE}" \
            --version "${VERSION}" \
            --release-file "candidate/${CONTAINER}/${VERSION}.json" \
            --candidate-container "candidate/${CONTAINER}/${SIF}" \
            --test-config "recipes/${RECIPE}/fulltest.yaml" \
            --results-path "candidate/${CONTAINER}/test-results.json" \
            --output-dir "candidate/${CONTAINER}/test-output" \
            --repo-root . --verbose
      - name: Run Dive policy check
        id: dive
        continue-on-error: true
        env:
          CANDIDATE_TAG: ${{ steps.info.outputs.candidate_tag }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.github/.dive-ci.yml:/.dive-ci.yml:ro" \
            wagoodman/dive:latest "${CANDIDATE_TAG}" --ci --config /.dive-ci.yml
      - name: Generate manifest and release preview
        env:
          RECIPE: ${{ matrix.recipe }}
          VARIANT: ${{ matrix.variant }}
          CONTAINER: ${{ matrix.container }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python tools/one_pr_release.py manifest \
            --recipe "${RECIPE}" --variant "${VARIANT}" --head-sha "${HEAD_SHA}" \
            --pr-number "${PR_NUMBER}" --candidate-dir "candidate/${CONTAINER}"
      - name: Upload candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.container }}-${{ github.event.pull_request.head.sha }}
          path: candidate/${{ matrix.container }}/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Require candidate tests to pass
        env:
          FULLTEST_OUTCOME: ${{ steps.fulltest.outcome }}
          DIVE_OUTCOME: ${{ steps.dive.outcome }}
        run: |
          test "${FULLTEST_OUTCOME}" = success
          test "${DIVE_OUTCOME}" = success

  gate:
    name: Container release gate
    needs: [detect, candidate]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Require all candidates to pass
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          RECIPES: ${{ needs.detect.outputs.recipes }}
        run: |
          test "${DETECT_RESULT}" = success
          if [ "${RECIPES}" = "[]" ]; then
            echo "No recipe changes in this pull request; nothing to build."
            exit 0
          fi
          test "${CANDIDATE_RESULT}" = success
