name: Julia ARM IJulia diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: github.repository == 'neurodesk/neurocontainers'
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-apptainer
        with:
          apptainer-version: 1.4.3
      - name: Download exact candidate bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ijulia-diagnostic"
          gh api repos/neurodesk/neurocontainers/actions/artifacts/11773907482 > "$RUNNER_TEMP/ijulia-diagnostic/artifact.json"
          python3 -c 'import json,os; a=json.load(open(os.environ["RUNNER_TEMP"]+"/ijulia-diagnostic/artifact.json")); assert a["workflow_run"]["id"] == 38306507750 and not a["expired"]'
          gh api repos/neurodesk/neurocontainers/actions/artifacts/11773907482/zip > "$RUNNER_TEMP/candidate.zip"
          python3 tools/diagnose_julia_arm_ijulia.py extract "$RUNNER_TEMP/candidate.zip" "$RUNNER_TEMP/ijulia-diagnostic"
          rm "$RUNNER_TEMP/candidate.zip"
      - name: Run cold and warm imports
        run: python3 tools/diagnose_julia_arm_ijulia.py run "$RUNNER_TEMP/ijulia-diagnostic"
      - name: Retain all diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: julia-arm-ijulia-diagnostic
          path: |
            ${{ runner.temp }}/ijulia-diagnostic/**/*.json
            ${{ runner.temp }}/ijulia-diagnostic/**/*.log
            ${{ runner.temp }}/ijulia-diagnostic/**/*.txt
          if-no-files-found: warn
          retention-days: 14
