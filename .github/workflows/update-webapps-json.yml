name: Update webapps.json

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "releases/**/*.json"
      - "recipes/**/build.yaml"
      - "tools/generate_webapps_json.py"
      - ".github/workflows/update-webapps-json.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-webapps-json:
    if: github.repository == 'neurodesk/neurocontainers'
    runs-on: ubuntu-latest
    steps:
      - name: Request a consolidated app and webapp update
        env:
          GH_TOKEN: ${{ secrets.NEURODESK_GITHUB_TOKEN_ISSUE_AUTOMATION }}
        run: |
          gh api --method POST repos/neurodesk/neurocommand/dispatches \
            -f event_type=webapps-update
