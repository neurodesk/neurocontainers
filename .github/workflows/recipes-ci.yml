name: Recipes CI

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      debug:
        type: boolean
        default: false
      recipes:
        type: string
        required: true
      run-tests:
        type: boolean
        default: true
      architecture:
        type: string
        default: x86_64
      x86-runner:
        type: string
        default: neurodesk-syd-arcrunner-neurocontainers
  workflow_dispatch:
    inputs:
      debug:
        description: Run only niimath when no recipe list is supplied
        type: boolean
        default: true
      recipes:
        description: Comma-separated recipes; empty uses debug selection or all recipes
        type: string
        default: ''
      run-tests:
        description: Run deploy checks and fulltest.yaml against each newly built container
        type: boolean
        default: true
      architecture:
        description: Declared architectures to build
        type: choice
        required: true
        default: x86_64
        options: [x86_64, arm64, all]
      x86-runner:
        description: Runner pool for x86 builds in the NeuroDesk repository
        type: choice
        default: neurodesk-syd-arcrunner-neurocontainers
        options:
          - neurodesk-syd-arcrunner-neurocontainers
          - blacksmith-8vcpu-ubuntu-2404

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare-matrix:
    name: Select recipe builds
    runs-on: ubuntu-22.04
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install recipe discovery dependencies
        run: python -m pip install pyyaml
      - name: Expand selected recipes and variants
        id: matrix
        env:
          REQUESTED_RECIPES: ${{ inputs.recipes }}
          ARCHITECTURE: ${{ inputs.architecture }}
          DEBUG: ${{ inputs.debug }}
        run: |
          args=()
          if [ "$DEBUG" = true ]; then args+=(--debug); fi
          targets=$(python -m workflows.recipe_ci --recipes "$REQUESTED_RECIPES" \
            --architecture "$ARCHITECTURE" "${args[@]}")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  verify:
    name: ${{ matrix.container }} | ${{ matrix.architecture }}
    needs: prepare-matrix
    runs-on: ${{ github.repository == 'neurodesk/neurocontainers' && (matrix.architecture == 'aarch64' && 'blacksmith-8vcpu-ubuntu-2404-arm' || inputs.x86-runner) || (matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-22.04') }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.targets) }}
    env:
      RECIPE: ${{ matrix.recipe }}
      CONTAINER: ${{ matrix.container }}
      VARIANT: ${{ matrix.variant }}
      ARCHITECTURE: ${{ matrix.architecture }}
      VERSION: ${{ matrix.version }}
      NEURO_CI_IMAGE: neurocontainer-check/${{ matrix.container }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install builder from this checkout
        run: python -m pip install -e .
      - name: Install Apptainer
        if: inputs.run-tests
        uses: ./.github/actions/setup-apptainer
        with:
          apptainer-version: 1.4.3
      - name: Install runtime test data tooling
        if: inputs.run-tests
        run: |
          python -m pip install datalad
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-annex
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Prepare runtime scratch paths
        if: inputs.run-tests
        run: |
          mkdir -p "$RUNNER_TEMP/apptainer/cache" "$RUNNER_TEMP/apptainer/tmp"
          echo "APPTAINER_CACHEDIR=$RUNNER_TEMP/apptainer/cache" >> "$GITHUB_ENV"
          echo "APPTAINER_TMPDIR=$RUNNER_TEMP/apptainer/tmp" >> "$GITHUB_ENV"
      - name: Validate and stage recipe inputs
        run: |
          python builder/validation.py "recipes/$RECIPE/build.yaml"
          python -m builder stage "$RECIPE" --recreate --download \
            --architecture "$ARCHITECTURE" --variant "$VARIANT"
      - name: Set up Blacksmith Docker builder
        if: github.repository == 'neurodesk/neurocontainers' && (matrix.architecture == 'aarch64' || inputs.x86-runner == 'blacksmith-8vcpu-ubuntu-2404')
        uses: useblacksmith/setup-docker-builder@v1
      - name: Build the selected container
        run: |
          dockerfile=$(find "build/$CONTAINER" -maxdepth 1 -name '*.Dockerfile' -print -quit)
          test -n "$dockerfile"
          python -m builder staged-context-args "build/$CONTAINER" > "$RUNNER_TEMP/image-context-args"
          mapfile -d '' -t IMAGE_CONTEXT_ARGS < "$RUNNER_TEMP/image-context-args"
          docker buildx build "build/$CONTAINER" --load --file "$dockerfile" --tag "$NEURO_CI_IMAGE" \
            --build-context "neurocontainer-cache=build/$CONTAINER/cache" "${IMAGE_CONTEXT_ARGS[@]}"
      - name: Set up Go for image conversion
        if: inputs.run-tests
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.1'
          cache: false
      - name: Convert the freshly built image for runtime tests
        if: inputs.run-tests
        run: |
          set -euo pipefail
          mkdir -p "check/$CONTAINER/test-output/fulltest-containers"
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' \
            -o "$RUNNER_TEMP/docker-save-to-simg" builder/docker-save-to-simg.go
          candidate="check/$CONTAINER/test-output/fulltest-containers/${CONTAINER}_${VERSION}.simg"
          docker save "$NEURO_CI_IMAGE" | TMPDIR="$RUNNER_TEMP" "$RUNNER_TEMP/docker-save-to-simg" - "$candidate.tmp"
          mv "$candidate.tmp" "$candidate"
      - name: Run deploy checks and the recipe runtime suite
        if: inputs.run-tests
        run: |
          python -m workflows.release_test_runner \
            --recipe "$RECIPE" --version "$VERSION" \
            --release-file "check/$CONTAINER/$VERSION.json" \
            --candidate-container "check/$CONTAINER/test-output/fulltest-containers/${CONTAINER}_${VERSION}.simg" \
            --test-config "recipes/$RECIPE/fulltest.yaml" \
            --results-path "check/$CONTAINER/test-results.json" \
            --output-dir "check/$CONTAINER/test-output" --repo-root . --verbose
      - name: Record native runtime observation
        if: always() && inputs.run-tests
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, platform, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          directory = Path('check') / os.environ['CONTAINER'] / 'test-output'
          directory.mkdir(parents=True, exist_ok=True)
          result = {'container': os.environ['CONTAINER'], 'version': os.environ['VERSION'],
                    'machine': platform.machine(), 'status': 'passed' if os.environ['JOB_STATUS'] == 'success' else 'failed',
                    'observed_at': datetime.now(timezone.utc).isoformat(),
                    'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          result['recipe_sha256'] = hashlib.sha256((Path('recipes') / os.environ['RECIPE'] / 'build.yaml').read_bytes()).hexdigest()
          if result['status'] == 'passed':
              result['image_id'] = subprocess.check_output(['docker', 'image', 'inspect', '--format', '{{.Id}}', os.environ['NEURO_CI_IMAGE']], text=True).strip()
              candidate = Path('check') / os.environ['CONTAINER'] / 'test-output/fulltest-containers' / f"{os.environ['CONTAINER']}_{os.environ['VERSION']}.simg"
              digest = hashlib.sha256()
              with candidate.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              result['candidate_sha256'] = digest.hexdigest()
          (directory / 'native-result.json').write_text(json.dumps(result, indent=2))
          PYTHON
      - name: Retain runtime results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-check-${{ matrix.container }}-${{ github.sha }}
          path: |
            check/${{ matrix.container }}/test-results.json
            check/${{ matrix.container }}/test-output/*.json
            check/${{ matrix.container }}/test-output/*.jsonl
            check/${{ matrix.container }}/test-output/*.log
            check/${{ matrix.container }}/test-output/fulltest-run-*/*.json
            check/${{ matrix.container }}/test-output/fulltest-run-*/*.jsonl
            check/${{ matrix.container }}/test-output/fulltest-run-*/*.log
            check/${{ matrix.container }}/test-output/fulltest-run-*/*.yaml
          retention-days: 7
          if-no-files-found: ignore
