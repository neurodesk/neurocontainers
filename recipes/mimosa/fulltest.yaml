name: mimosa
version: 0.5.8
default_timeout: 240
arm_fsl_version: "6.0.7.22"

test_data:
  output_dir: test_output

setup:
  script: |
    set -e
    mkdir -p ${output_dir}

tests:
  - name: R and Rscript are deployed
    description: Verify R commands exposed by the recipe are available.
    command: |
      set -e
      which R
      which Rscript
      R --version | head -1
    expected_output_contains:
      - /usr/bin/R
      - R version

  - name: mimosa package loads
    description: Verify the main R package is installed and loadable.
    command: |
      R --slave - <<'RS'
      library(mimosa)
      cat("mimosa", as.character(packageVersion("mimosa")), "\n")
      RS
    expected_output_contains: mimosa

  - name: Core R dependencies load
    description: Verify major R dependencies from the recipe load.
    command: |
      R --slave - <<'RS'
      pkgs <- c("ANTsRCore", "dplyr", "extrantsr", "fslr", "neurobase", "oasis", "rlist", "WhiteStripe")
      for (pkg in pkgs) {
        suppressPackageStartupMessages(library(pkg, character.only = TRUE))
        cat(pkg, "ok\n")
      }
      RS
    expected_output_contains:
      - ANTsRCore ok
      - WhiteStripe ok

  - name: mimosa exports expected functions
    description: Verify package namespace exposes documented modeling functions.
    command: |
      R --slave - <<'RS'
      library(mimosa)
      exports <- getNamespaceExports("mimosa")
      needed <- c("count_stats", "get_weights", "mimosa_data", "mimosa_fit", "mimosa_formula", "mimosa_training")
      stopifnot(all(needed %in% exports))
      cat("exports", paste(needed, collapse = ","), "\n")
      RS
    expected_output_contains: mimosa_formula

  - name: Bundled mimosa model data loads
    description: Verify packaged model objects are present.
    command: |
      R --slave - <<'RS'
      library(mimosa)
      data("mimosa_model", package = "mimosa")
      data("mimosa_model_No_PD", package = "mimosa")
      data("mimosa_model_No_T2", package = "mimosa")
      stopifnot(exists("mimosa_model"))
      cat("model data ok\n")
      RS
    expected_output_contains: model data ok

  - name: mimosa formula includes expected terms
    description: Exercise formula construction with all modalities.
    command: |
      R --slave - <<'RS'
      library(mimosa)
      f <- mimosa_formula()
      txt <- paste(deparse(f), collapse = " ")
      stopifnot(grepl("FLAIR_10", txt), grepl("T2_10", txt), grepl("PD_10", txt))
      cat(txt, "\n")
      RS
    expected_output_contains: FLAIR_10

  - name: mimosa formula drops T2 terms
    description: Verify modality exclusion logic for T2 works.
    command: |
      R --slave - <<'RS'
      library(mimosa)
      txt <- paste(deparse(mimosa_formula(T2 = FALSE)), collapse = " ")
      stopifnot(!grepl("T2", txt))
      cat("no T2 terms\n")
      RS
    expected_output_contains: no T2 terms

  - name: mimosa formula drops PD terms
    description: Verify modality exclusion logic for PD works.
    command: |
      R --slave - <<'RS'
      library(mimosa)
      txt <- paste(deparse(mimosa_formula(PD = FALSE)), collapse = " ")
      stopifnot(!grepl("PD", txt))
      cat("no PD terms\n")
      RS
    expected_output_contains: no PD terms

  - name: weighted SLR synthetic regression works
    description: Exercise the weighted simple linear regression helper.
    command: |
      R --slave - <<'RS'
      library(mimosa)
      set.seed(5)
      n <- 200
      p <- 27
      x <- matrix(rnorm(n * p), ncol = p)
      y <- 2 + 3 * x + rnorm(n * p, sd = 0.05)
      wts <- rep(1, p)
      fit <- mimosa:::weighted_slr(x, y, wts = wts)
      stopifnot(all(c("beta0", "beta1", "r2") %in% names(fit)))
      stopifnot(mean(fit$beta1, na.rm = TRUE) > 2.8)
      cat("mean beta", round(mean(fit$beta1), 2), "\n")
      RS
    expected_output_contains: mean beta

  - name: package testthat regression passes
    description: Run the upstream weighted_slr regression test logic.
    command: |
      R --slave - <<'RS'
      library(mimosa)
      set.seed(5)
      n <- 1000
      p <- 27
      x <- matrix(rnorm(n * p), ncol = p)
      y <- x * 4 + 6 * x * (x > 0) + rnorm(n * p)
      wts <- c(-1, 0, 1)
      wts <- expand.grid(wts, wts, wts)
      sigma <- 2
      wts <- exp(-rowSums(wts^2) / (2 * sigma^2))
      slr <- mimosa:::weighted_slr(x, y, wts = wts)
      stopifnot(all(c("beta0", "beta1", "r2", "beta0_reverse", "beta1_reverse", "r2_reverse") %in% names(slr)))
      stopifnot(length(slr$beta0) == 27)
      cat("weighted_slr regression ok\n")
      RS
    expected_output_contains: weighted_slr regression ok

  - name: get_weights returns numeric kernel
    description: Verify neighborhood weight generation returns finite weights.
    command: |
      R --slave - <<'RS'
      library(mimosa)
      offsets <- as.matrix(expand.grid(-1:1, -1:1, -1:1))
      w <- get_weights(offsets = offsets, voxelDims = c(1, 1, 1), sigma = 2)
      stopifnot(is.numeric(w), length(w) > 0, all(is.finite(w)))
      cat("weights", length(w), "\n")
      RS
    expected_output_contains: weights

  - name: count_stats handles synthetic predictions
    description: Exercise classification count statistics helper on synthetic NIfTI masks.
    command: |
      R --slave - <<'RS'
      library(mimosa)
      library(oro.nifti)
      truth_arr <- array(0, dim = c(6, 6, 6))
      pred_arr <- array(0, dim = c(6, 6, 6))
      truth_arr[2:3, 2:3, 2:3] <- 1
      pred_arr[2:3, 2:3, 2:3] <- 1
      truth <- nifti(truth_arr)
      pred <- nifti(pred_arr)
      stats <- count_stats(truth, pred, k = 1, verbose = FALSE)
      stopifnot(length(stats) == 5)
      cat("count stats", paste(names(stats), collapse = ","), "\n")
      RS
    expected_output_contains: count stats

  - name: R NIfTI stack creates image
    description: Verify neurobase/oro.nifti can create and write a small image.
    command: |
      R --slave - <<'RS'
      library(neurobase)
      library(oro.nifti)
      img <- nifti(array(1, dim = c(4, 4, 4)))
      writenii(img, filename = "${output_dir}/synthetic_mimosa")
      stopifnot(file.exists("${output_dir}/synthetic_mimosa.nii.gz"))
      cat("nifti written\n")
      RS
    expected_output_contains: nifti written
    validate:
      - output_exists: ${output_dir}/synthetic_mimosa.nii.gz

  - name: ANTsRCore creates image
    description: Verify ANTsRCore can create an ANTs image from an array.
    command: |
      R --slave - <<'RS'
      library(ANTsRCore)
      img <- as.antsImage(array(1, dim = c(4, 4, 4)))
      stopifnot(length(dim(img)) == 3)
      cat("ants image", paste(dim(img), collapse = "x"), "\n")
      RS
    expected_output_contains: ants image 4x4x4

  - name: make_ants_image maps vector to image
    description: Exercise mimosa image helper with a synthetic reference image.
    command: |
      R --slave - <<'RS'
      library(mimosa)
      library(ANTsRCore)
      ref <- as.antsImage(array(0, dim = c(3, 3, 3)))
      img <- mimosa:::make_ants_image(1:3, mask_indices = c(1, 5, 9), reference = ref)
      stopifnot(length(dim(img)) == 3)
      cat("mapped image\n")
      RS
    expected_output_contains: mapped image

  - name: dplyr data manipulation works
    description: Verify tidyverse dependency used by mimosa workflows works.
    command: |
      R --slave - <<'RS'
      library(dplyr)
      df <- tibble::tibble(x = 1:5, y = c(1, 1, 2, 2, 2))
      out <- df %>% group_by(y) %>% summarise(mx = mean(x), .groups = "drop")
      stopifnot(nrow(out) == 2)
      cat("dplyr rows", nrow(out), "\n")
      RS
    expected_output_contains: dplyr rows 2

  - name: WhiteStripe normalization function loads
    description: Verify WhiteStripe dependency exposes normalization helpers.
    command: |
      R --slave - <<'RS'
      library(WhiteStripe)
      stopifnot("whitestripe" %in% getNamespaceExports("WhiteStripe"))
      cat("WhiteStripe exports ok\n")
      RS
    expected_output_contains: WhiteStripe exports ok

  - name: fslr sees FSL installation
    description: Verify FSL-backed R package can locate FSL commands from the container.
    command: |
      R --slave - <<'RS'
      library(fslr)
      cat("fsl path", fslr::fsldir(), "\n")
      stopifnot(nzchar(fslr::fsldir()))
      RS
    expected_output_contains: fsl path

  - name: R Markdown stack loads
    description: Verify reporting dependencies installed for mimosa documentation load.
    command: |
      R --slave - <<'RS'
      library(knitr)
      library(rmarkdown)
      library(testthat)
      cat("rmarkdown stack ok\n")
      RS
    expected_output_contains: rmarkdown stack ok

  - name: Session info can be written
    description: Verify runtime can write an R session artifact for debugging.
    command: |
      R --slave - <<'RS'
      writeLines(capture.output(sessionInfo()), "${output_dir}/mimosa_session.txt")
      cat("session written\n")
      RS
    validate:
      - output_exists: ${output_dir}/mimosa_session.txt

  - name: Analytical primary model training and prediction
    description: Fit the actual mimosa_fit API to600 known binomial trials, verify analytical log-odds coefficients and25 held-out probabilities, and serialize/reload the fitted model without losing predictions.
    timeout: 300
    command: |
      R --slave - <<'RS'
      suppressPackageStartupMessages(library(mimosa))
      # 200 trials at each x: probabilities1/5,1/2,4/5 imply exactly
      # intercept=-log(4) and slope=log(4). Both classes occur at every x.
      x <- rep(0:2, each = 200)
      y <- unlist(lapply(c(40, 100, 160), function(n) c(rep(1, n), rep(0, 200 - n))))
      fit <- mimosa_fit(data.frame(FLAIR = x, gold_standard = y), gold_standard ~ FLAIR)
      stopifnot(inherits(fit, 'glm'), fit$converged)
      stopifnot(max(abs(coef(fit) - c(-log(4), log(4)))) < 1e-8)
      held_out <- seq(-2, 4, length.out = 25)
      expected <- 1 / (1 + 4^(1 - held_out))
      observed <- as.numeric(predict(fit, data.frame(FLAIR = held_out), type = 'response'))
      stopifnot(max(abs(observed - expected)) < 1e-10)
      path <- tempfile(fileext = '.rds')
      saveRDS(fit, path)
      stopifnot(identical(observed, as.numeric(predict(readRDS(path), data.frame(FLAIR = held_out), type = 'response'))))
      unlink(path)
      if (Sys.info()[['machine']] == 'aarch64') {
          stopifnot(trimws(readLines(file.path(Sys.getenv('FSLDIR'), 'etc/fslversion'))[1]) == '${arm_fsl_version}')
      }
      cat('MIMoSA analytical training and held-out prediction passed', coef(fit), '\n')
      RS
    expected_exit_code: 0
    expected_output_contains: MIMoSA analytical training and held-out prediction passed

  - name: Full MRI features and bundled model probabilities
    description: Run documented full-volume tissue/candidate selection, normalization, native FSL smoothing, ANTsR neighborhood coupling and bundled two-modality model prediction on complete public MS MRIs. Compare every probability with an independent logistic oracle, preserve original geometry and inputs/model hashes. This does not claim clinical accuracy or verify a chosen lesion threshold.
    timeout: 7200
    command: |
      R --slave - <<'RS'
      suppressPackageStartupMessages(library(mimosa))
      suppressPackageStartupMessages(library(neurobase))
      suppressPackageStartupMessages(library(fslr))
      options(timeout = 120)
      fixtures <- list(
          flair = list(url = "https://raw.githubusercontent.com/muschellij2/open_ms_data/65704901f60650824565aa5a4818611aa89716f4/cross_sectional/MNI/patient01/FLAIR_N4_noneck_reduced_winsor_regtoFLAIR_brain_N4_regtoMNI.nii.gz", sha256 = "312253bbc7cea9adcd78a98c66e18ba1253b1a2183f31492f6a9f9ce5086e745"),
          reference = list(url = "https://raw.githubusercontent.com/muschellij2/open_ms_data/65704901f60650824565aa5a4818611aa89716f4/cross_sectional/MNI/patient01/GOLD_STANDARD_N4_noneck_reduced_winsor_regtoFLAIR_regtoMNI.nii.gz", sha256 = "f35bd723ac2af1b179522f53de48e45ce485c5864e4f6954d24d684140ba0533"),
          t1 = list(url = "https://raw.githubusercontent.com/muschellij2/open_ms_data/65704901f60650824565aa5a4818611aa89716f4/cross_sectional/MNI/patient01/T1_N4_noneck_reduced_winsor_regtoFLAIR_brain_N4_regtoMNI.nii.gz", sha256 = "904cdf44f2f0de750b30986dbc25cd7ee4ea2934830b454bf8c8538dcf59fdc0")
      )
      directory <- tempfile('mimosa-full-ms-')
      dir.create(directory)
      paths <- list()
      for (kind in names(fixtures)) {
          item <- fixtures[[kind]]
          path <- file.path(directory, paste0(kind, '.nii.gz'))
          download.file(item$url, path, mode = 'wb', quiet = TRUE)
          stopifnot(identical(digest::digest(file = path, algo = 'sha256'), item$sha256))
          paths[[kind]] <- path
      }
      before_inputs <- tools::md5sum(unlist(paths))
      model_files <- list.files(system.file('data', package = 'mimosa'), full.names = TRUE)
      stopifnot(length(model_files) > 0)
      before_models <- tools::md5sum(model_files)
      flair <- readnii(paths$flair, reorient = FALSE)
      t1 <- readnii(paths$t1, reorient = FALSE)
      reference <- readnii(paths$reference, reorient = FALSE)
      stopifnot(identical(dim(flair), c(182L, 218L, 182L)))
      stopifnot(identical(dim(t1), dim(flair)), identical(dim(reference), dim(flair)))
      stopifnot(all(is.finite(flair)), all(is.finite(t1)), sum(reference > 0) > 0)
      spatial_slots <- c('pixdim', 'qform_code', 'sform_code', 'quatern_b', 'quatern_c',
                         'quatern_d', 'qoffset_x', 'qoffset_y', 'qoffset_z',
                         'srow_x', 'srow_y', 'srow_z')
      for (slot_name in spatial_slots) {
          stopifnot(identical(slot(flair, slot_name), slot(t1, slot_name)))
      }
      # Follow the documented full-volume two-modality path: supplied preprocessed
      # MRIs, a brain mask from their union, default tissue/candidate selection and
      # z-score normalization. Do not crop, resample or remove difficult voxels.
      brain_mask <- datatyper((flair > 0) | (t1 > 0))
      started <- proc.time()[['elapsed']]
      features <- mimosa_data(brain_mask = brain_mask, FLAIR = flair, T1 = t1,
                             T2 = NULL, PD = NULL, tissue = FALSE,
                             normalize = 'Z', cores = 1, verbose = TRUE)
      frame <- features$mimosa_dataframe
      stopifnot(nrow(frame) == sum(features$top_voxels == 1), nrow(frame) > 0)
      data('mimosa_model_No_PD_T2', package = 'mimosa')
      model <- mimosa_model_No_PD_T2
      stopifnot(inherits(model, 'glm'))
      design <- model.matrix(delete.response(terms(model)), frame,
                             contrasts.arg = model$contrasts, xlev = model$xlevels)
      coefficients <- coef(model)
      stopifnot(all(is.finite(design)), all(is.finite(coefficients)))
      stopifnot(identical(colnames(design), names(coefficients)))
      # Compare every bundled-model prediction with the independent scalar logistic
      # definition and coefficient sum. This is a numerical, not clinical, oracle.
      linear <- rowSums(sweep(design, 2, coefficients, '*'))
      expected <- numeric(length(linear))
      positive <- linear >= 0
      expected[positive] <- 1 / (1 + exp(-linear[positive]))
      exp_linear <- exp(linear[!positive])
      expected[!positive] <- exp_linear / (1 + exp_linear)
      predictions <- as.numeric(predict(model, newdata = frame, type = 'response'))
      stopifnot(length(predictions) == nrow(frame), all(is.finite(predictions)))
      stopifnot(max(abs(predictions - expected)) < 1e-12)
      stopifnot(all(predictions >= 0 & predictions <= 1), any(predictions > 0))
      probability <- niftiarr(brain_mask, 0)
      probability[features$top_voxels == 1] <- predictions
      # Preserve the vignette's probability smoothing, including its mask correction.
      probability <- fslsmooth(probability, sigma = 1.25, mask = brain_mask,
                               retimg = TRUE, smooth_mask = TRUE)
      stopifnot(identical(dim(probability), dim(flair)), all(is.finite(probability)))
      # Float32 smoothing can differ from its mathematical [0,1] range by storage
      # roundoff. This bound does not change model predictions or lesion thresholds.
      storage_bound <- 8 * 2^-23
      stopifnot(min(probability) >= -storage_bound, max(probability) <= 1 + storage_bound)
      stopifnot(sum(probability > 0) > 0)
      output <- file.path(directory, 'probability')
      writenii(probability, filename = output)
      reloaded <- readnii(paste0(output, '.nii.gz'), reorient = FALSE)
      stopifnot(identical(dim(reloaded), dim(flair)))
      for (slot_name in spatial_slots) {
          stopifnot(identical(slot(reloaded, slot_name), slot(flair, slot_name)))
      }
      stopifnot(max(abs(as.numeric(reloaded) - as.numeric(probability))) <= storage_bound)
      stopifnot(identical(before_inputs, tools::md5sum(unlist(paths))))
      stopifnot(identical(before_models, tools::md5sum(model_files)))
      cat('full MIMoSA MRI probability workflow passed; candidates', nrow(frame),
          'known-lesion probability mean', mean(probability[reference > 0]),
          'range', range(probability), 'seconds', proc.time()[['elapsed']] - started, '\n')
      unlink(directory, recursive = TRUE)
      RS
    expected_exit_code: 0
    expected_output_contains: full MIMoSA MRI probability workflow passed
