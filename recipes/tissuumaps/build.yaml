name: tissuumaps
version: 3.2.1.14

copyright:
  - license: MIT
    url: https://github.com/TissUUmaps/TissUUmaps/blob/main/LICENSE

architectures:
  - x86_64

auto_update:
  method: pypi
  package: TissUUmaps

structured_readme:
  description: >-
    TissUUmaps is an open-source, browser- and QtWebEngine-based viewer for
    large whole-slide microscopy images and spatial omics / point-cloud
    annotations, supporting pyvips and OpenSlide image backends.
  example: |
    # Launch the TissUUmaps desktop GUI
    tissuumaps

    # Show CLI options
    tissuumaps --help
  documentation: https://tissuumaps.github.io/TissUUmaps-docs/
  citation: |-
    Pielawski, N., Andersson, A., Avenel, C., Behanova, A., Chelebian, E.,
    Klemm, A., Nysjö, F., Solorzano, L., & Wählby, C. (2023). TissUUmaps 3:
    Improvements in interactive visualization, exploration, and quality
    assessment of large-scale spatial omics data. Heliyon, 9(5), e15306.
    https://doi.org/10.1016/j.heliyon.2023.e15306

files:
  - name: tissuumaps-wrapper
    executable: true
    contents: |-
      #!/usr/bin/env bash
      set -euo pipefail

      E=/opt/miniconda/envs/tissuumaps
      cache_root="${TISSUUMAPS_CACHE_DIR:-${TMPDIR:-/tmp}/tissuumaps-$(id -u)}"
      export XDG_CACHE_HOME="${XDG_CACHE_HOME:-${cache_root}/cache}"
      export XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-${cache_root}/config}"
      export XDG_DATA_HOME="${XDG_DATA_HOME:-${cache_root}/data}"
      export MPLCONFIGDIR="${MPLCONFIGDIR:-${cache_root}/matplotlib}"
      mkdir -p "${XDG_CACHE_HOME}" "${XDG_CONFIG_HOME}" "${XDG_DATA_HOME}" "${MPLCONFIGDIR}"

      # Keep conda env's glib/vips first so PySide6's bundled Qt and pyvips share one glib
      export LD_LIBRARY_PATH="${E}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
      # GSettings schemas and icon themes for GTK file dialogs live in the conda env
      export XDG_DATA_DIRS="${E}/share:/usr/share"
      export LANG=C.UTF-8
      export LC_ALL=C.UTF-8
      # QtWebEngine's Chromium sandbox requires privileges unavailable in unprivileged containers
      export QTWEBENGINE_DISABLE_SANDBOX=1
      exec "${E}/bin/tissuumaps" "$@"

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        QTWEBENGINE_DISABLE_SANDBOX: "1"
        PATH: /usr/local/bin:/opt/miniconda/envs/tissuumaps/bin:/opt/miniconda/bin:$PATH
    - install:
        # Runtime X11/xcb/OpenGL/Chromium libs for PySide6 + QtWebEngine.
        # Intentionally omit system Qt packages so PySide6's bundled Qt 6.4 is always used.
        - ca-certificates
        - fonts-dejavu-core
        - libasound2t64
        - libcups2t64
        - libdbus-1-3
        - libdrm2
        - libegl-mesa0
        - libegl1
        - libfontconfig1
        - libfreetype6
        - libgbm1
        - libgl1
        - libgl1-mesa-dri
        - libglib2.0-0
        - libglu1-mesa
        - libnspr4
        - libnss3
        - libopengl0
        - libpci3
        - libx11-6
        - libx11-xcb1
        - libxcb-cursor0
        - libxcb-glx0
        - libxcb-icccm4
        - libxcb-image0
        - libxcb-keysyms1
        - libxcb-randr0
        - libxcb-render-util0
        - libxcb-shape0
        - libxcb-xfixes0
        - libxcb-xinerama0
        - libxcb-xkb1
        - libxcb1
        - libxcomposite1
        - libxcursor1
        - libxdamage1
        - libxext6
        - libxfixes3
        - libxi6
        - libxkbcommon-x11-0
        - libxkbcommon0
        - libxkbfile1
        - libxrandr2
        - libxrender1
        - libxshmfence1
        - libxss1
        - libxtst6
        - libxv1
        - xauth
        - xvfb
    - template:
        name: miniconda
        version: py312_25.5.1-0
        install_path: /opt/miniconda
        env_name: tissuumaps
        env_exists: "false"
        conda_opts: "--override-channels -c conda-forge"
        conda_install: >-
          python=3.11 "numpy<2" libvips pyvips openslide openslide-python pip
        pip_install: >-
          "TissUUmaps[full]=={{ context.version }}" "numpy<2"
    - run:
        - install -m 0755 {{ get_file("tissuumaps-wrapper") }} /usr/local/bin/tissuumaps

deploy:
  path: []
  bins:
    - tissuumaps

gui_apps:
  - name: "TissUUmaps"
    exec: "tissuumaps"

domains:
  - microscopy

categories:
  - visualization
  - molecular biology

icon: data:image/png;base64,
