name: nextpyp
version: 0.7.3

copyright:
  - license: BSD-3-Clause
    url: https://github.com/nextpyp/next/blob/{{ context.nextpyp_version }}/LICENSE

architectures:
  - x86_64

variables:
  nextpyp_version: "0.7.3"
  apptainer_version: "1.5.3"
  base_image_digest: "sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8"
  download_base: https://nextpyp.app/files/pyp/{{ context.nextpyp_version }}

auto_update:
  # The web server image, host processor and start script are published per
  # release under nextpyp.app/files/pyp/<version>/, with the same version as
  # the nextpyp/next tag. The launcher downloads pyp.sif for that version.
  method: sources
  container_version: nextpyp
  local: []
  sources:
    - id: nextpyp
      method: github_tags
      repo: nextpyp/next
      target:
        variable: nextpyp_version
        value: version
    - id: apptainer
      dependency: true
      method: github_release
      repo: apptainer/apptainer
      target:
        variable: apptainer_version
        value: version
    - id: base_image
      dependency: true
      method: oci_digest
      image: ubuntu
      tag: '24.04'
      target:
        variable: base_image_digest

build:
  kind: neurodocker
  base-image: ubuntu:24.04@{{ context.base_image_digest }}
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
    - install:
        - bash
        - ca-certificates
        - curl
        - procps
        - util-linux
        - fuse3
        - libglib2.0-0
        - libseccomp2
        - squashfs-tools
        - uidmap
    - run:
        - apt-get update
        - apt-get install -y {{ get_file("apptainer.deb") }}
        - rm -rf /var/lib/apt/lists/*
        - apptainer --version
    - run:
        - install -d /opt/nextpyp-dist/bin /opt/nextpyp-dist/workflows
        - install -m 644 {{ get_file("nextPYP.sif") }} /opt/nextpyp-dist/nextPYP.sif
        - install -m 755 {{ get_file("host-processor") }} /opt/nextpyp-dist/host-processor
        - install -m 644 {{ get_file("nextpyp-upstream") }} /opt/nextpyp-dist/nextpyp
        - install -m 644 {{ get_file("spr_tutorial.toml") }} /opt/nextpyp-dist/workflows/spr_tutorial.toml
        - install -m 644 {{ get_file("tomo_tutorial.toml") }} /opt/nextpyp-dist/workflows/tomo_tutorial.toml
        - install -m 644 {{ get_file("class_tutorial.toml") }} /opt/nextpyp-dist/workflows/class_tutorial.toml
        - sed 's/@NEXTPYP_VERSION@/{{ context.nextpyp_version }}/' {{ get_file("nextpyp.sh") }} > /opt/nextpyp-dist/bin/nextpyp
        - chmod 755 /opt/nextpyp-dist/bin/nextpyp
        - apptainer sif list /opt/nextpyp-dist/nextPYP.sif
    - environment:
        PATH: /opt/nextpyp-dist/bin:$PATH

files:
  - name: nextpyp.sh
    filename: nextpyp.sh
  - name: apptainer.deb
    url: https://github.com/apptainer/apptainer/releases/download/v{{ context.apptainer_version }}/apptainer_{{ context.apptainer_version }}_amd64.deb
  - name: nextPYP.sif
    url: "{{ context.download_base }}/nextPYP.sif"
  - name: host-processor
    url: "{{ context.download_base }}/host-processor"
  - name: nextpyp-upstream
    url: "{{ context.download_base }}/nextpyp"
  - name: spr_tutorial.toml
    url: "{{ context.download_base }}/workflows/spr_tutorial.toml"
  - name: tomo_tutorial.toml
    url: "{{ context.download_base }}/workflows/tomo_tutorial.toml"
  - name: class_tutorial.toml
    url: "{{ context.download_base }}/workflows/class_tutorial.toml"

deploy:
  bins:
    - nextpyp

domains:
  - neuroimaging
categories:
  - cryo EM

readme: |
  ## nextpyp/{{ context.version }}

  nextPYP (Bartesaghi lab, Duke University) is a web application for
  single-particle cryo-EM and cryo-electron tomography: pre-processing,
  particle picking, sub-tomogram averaging, constrained refinement and
  classification, run as projects in a browser. https://nextpyp.app

  nextPYP runs as two Apptainer images. This container includes the web server
  image (`nextPYP.sif`) and the `nextpyp` launcher. The processing image
  (`pyp.sif`, about 43 GB) is too large to include, so `nextpyp install`
  downloads it once into a directory you choose. The web server then runs from
  that directory in a nested Apptainer container.

  ### Install once
  Pick a writable directory with at least 50 GB free plus room for your
  projects (raw movies and tilt series need several TB). Every parent directory
  must be group- and world-executable (`chmod go+x`), which nextPYP enforces,
  so use project or scratch storage rather than a private home directory.
  ```
  nextpyp install --dir /path/to/nextpyp --bind /path/to/your/data
  ```
  This creates upstream's folder layout and `config.toml`, copies the tutorial
  workflows and downloads `pyp.sif` for nextPYP {{ context.version }}. Run the
  same command again to resume an interrupted download. If you already have
  `pyp.sif` for this version, link it instead of downloading:
  `nextpyp install --dir /path/to/nextpyp --pyp-sif /path/to/pyp.sif`.
  Options: `--port N` (default 8080), `--scratch PATH` for fast local scratch
  space, and `--bind PATH` (repeatable) for each folder with data. Run
  `nextpyp help` for all options.

  ### Run
  ```
  export NEXTPYP_DIR=/path/to/nextpyp
  nextpyp start       # keeps running; open http://localhost:8080 in a browser
  nextpyp status      # from another terminal
  nextpyp stop        # or press Ctrl-C where nextpyp start runs
  ```
  `nextpyp start` waits until the web server answers, then stays in the
  foreground until you stop nextPYP: keep its terminal open, or run it in
  `tmux` or a batch job. The server listens on localhost only; from another
  computer, use an SSH tunnel (`ssh -L 8080:localhost:8080 node`). Run the
  container with GPU access (`apptainer exec --nv`, or a GPU desktop in
  Neurodesk) for GPU jobs.

  ### Configuration
  Settings live in `/path/to/nextpyp/config.toml`; restart nextPYP after
  editing it. To change the port, edit `port` under `[web]`. To make more data
  folders visible, add them to `binds` under `[pyp]`. nextPYP refuses binds
  under system folders such as `/opt`, `/usr` or `/var`. Logs are in
  `/path/to/nextpyp/local/logs`. Configuration reference:
  https://nextpyp.app/files/pyp/latest/docs/reference/config.html

  ### Notes
  - Jobs run on the machine where nextPYP was started, using its CPUs and
    GPUs. On a cluster, start it on a compute node, not on a login node.
  - A newer `nextpyp` container upgrades an existing installation: run
    `nextpyp install --dir /path/to/nextpyp` with it to fetch the matching
    `pyp.sif`.
  - The host needs unprivileged user namespaces for nested Apptainer, as on
    most current Linux systems.

  Documentation: https://nextpyp.app/files/pyp/latest/docs/

  Citation: Liu, H.-F., Zhou, Y., Huang, Q., Piland, J., Jin, W., Mandel, J.,
  Du, X., Martin, J., Bartesaghi, A. nextPYP: a comprehensive and scalable
  platform for characterizing protein variability in situ using single-particle
  cryo-electron tomography. Nat Methods 20, 1909-1919 (2023).
  https://doi.org/10.1038/s41592-023-02045-0
