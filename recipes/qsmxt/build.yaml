  mni_template_sha256: 0585cd056bf5ccfb8bf97a5f6a66082d4e7caad525718fc11e40d80a827fcb92
  model_revision: 31b08225f3adf2d732dafad4e3c5a94c350ef51b
  niimath_version: "1.0.20261016"
  niimath_sha256: 0e5c48c7c301490d259c3e83ea213bfac8f3b0a28acc6a2e842ce25b474cfdc0
  antspyx_version: "0.6.3"
  qsmxt_tarball:
    try:
      - value: qsmxt_x86_64_tar_gz
        condition: arch == "x86_64"
      - value: qsmxt_aarch64_tar_gz
        condition: arch == "aarch64"

auto_update:
  container_version: "qsmxt"
  method: sources
  sources:
  - id: qsmxt
    method: github_release_asset
    asset: qsmxt-v{version}-x86_64-unknown-linux-gnu.tar.gz
    repo: QSMxT/QSMxT
    version_regex: v?(?P<version>\d+\.\d+\.\d+)
    target:
      variable: upstream_version
      value: version
      fulltest_variable: upstream_version
      variables:
        qsmxt_x86_64_sha256: sha256
  - id: qsmxt_aarch64
    dependency: true
    method: github_release_asset
    repo: QSMxT/QSMxT
    asset: qsmxt-v{version}-aarch64-unknown-linux-gnu.tar.gz
    target:
      variable: qsmxt_aarch64_url
      variables:
        qsmxt_aarch64_sha256: sha256
  - id: qsmxt_source
    dependency: true
    method: http_digest
    url: https://github.com/QSMxT/QSMxT/archive/refs/tags/v{{ context.upstream_version }}.tar.gz
    target:
      variable: qsmxt_source_sha256
      fulltest_variable: qsmxt_source_sha256
  - id: rust
    dependency: true
    method: github_tags
    repo: rust-lang/rust
    version_regex: (?P<version>\d+\.\d+\.\d+)
    target:
      variable: rust_version
      fulltest_variable: rust_version
  - id: rust_toolchain
    dependency: true
    method: http_digest
    url: https://static.rust-lang.org/dist/rust-{{ context.rust_version }}-x86_64-unknown-linux-gnu.tar.xz
    target:
      variable: rust_x86_64_sha256
  - id: openrecon_ismrmrd
    dependency: true
    method: github_release
    repo: ismrmrd/ismrmrd
    target:
      variable: openrecon_ismrmrd_version
      value: version
  - id: openrecon_siemens
    dependency: true
    method: github_commit
    repo: ismrmrd/siemens_to_ismrmrd
    ref: HEAD
    target:
      variable: openrecon_siemens_commit
  - id: openrecon_python_tools
    dependency: true
    method: github_commit
    repo: ismrmrd/ismrmrd-python-tools
    ref: HEAD
    target:
      variable: openrecon_python_tools_commit
  - id: openrecon_server
    dependency: true
    method: github_commit
    repo: astewartau/python-ismrmrd-server
    ref: fix/ismrmrd-compatibility
    target:
      variable: openrecon_server_commit
  - id: niimath
    dependency: true
    method: github_release_asset
    repo: rordenlab/niimath
    asset: niimath_lnx.zip
    version_regex: v?(?P<version>\d+\.\d+\.\d+)
    target:
      variable: niimath_version
      value: version
      fulltest_variable: niimath_version
      variables:
        niimath_sha256: sha256
  - id: antspyx
    dependency: true
    method: pypi
    package: antspyx
    target:
      variable: antspyx_version
  local:
  - macros/openrecon
  - macros/ep3d

build:
  kind: neurodocker
  # The release archive bundles a pinned dcm2niix for DICOM -> BIDS conversion.
  # ubuntu:24.04 provides glibc >= 2.39, which the prebuilt binary requires.
  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive

    - install:
        - ca-certificates
        - libgomp1
        - python3-dev
        - python-is-python3
        - python3-pip

    - variables:
        openrecon_ubuntu_version: "24.04"

    - include: macros/openrecon/neurodocker.yaml
    - include: macros/ep3d/helpers.yaml

    - workdir: /opt/qsmxt

    - run:
        - tar -xzf {{ get_file(context.qsmxt_tarball) }} -C /opt/qsmxt
        - chmod +x /opt/qsmxt/qsmxt /opt/qsmxt/dcm2niix

    - run:
        - mkdir -p /opt/qsmxt/models
        - install -m 644 {{ get_file("bfrnet.onnx") }} /opt/qsmxt/models/bfrnet.onnx
        - install -m 644 {{ get_file("xqsm.onnx") }} /opt/qsmxt/models/xqsm.onnx
        - install -m 644 {{ get_file("qsmnet.onnx") }} /opt/qsmxt/models/qsmnet.onnx
        - install -m 644 {{ get_file("qsmnet-plus.onnx") }} /opt/qsmxt/models/qsmnet-plus.onnx
        - install -m 644 {{ get_file("qsmgan.onnx") }} /opt/qsmxt/models/qsmgan.onnx
        - install -m 644 {{ get_file("lpcnn.onnx") }} /opt/qsmxt/models/lpcnn.onnx
        - install -m 644 {{ get_file("ir2qsm.onnx") }} /opt/qsmxt/models/ir2qsm.onnx
        - install -m 644 {{ get_file("autoqsm.onnx") }} /opt/qsmxt/models/autoqsm.onnx
        - install -m 644 {{ get_file("iqsm.onnx") }} /opt/qsmxt/models/iqsm.onnx
        - install -m 644 {{ get_file("iqsm-plus.onnx") }} /opt/qsmxt/models/iqsm-plus.onnx
        - install -m 644 {{ get_file("iqfm.onnx") }} /opt/qsmxt/models/iqfm.onnx
        - install -m 644 {{ get_file("nextqsm-bf.onnx") }} /opt/qsmxt/models/nextqsm-bf.onnx
        - install -m 644 {{ get_file("nextqsm-vjp.onnx") }} /opt/qsmxt/models/nextqsm-vjp.onnx
        - install -m 644 {{ get_file("modl-qsm.onnx") }} /opt/qsmxt/models/modl-qsm.onnx
        - install -m 644 {{ get_file("susep-net.onnx") }} /opt/qsmxt/models/susep-net.onnx
        - install -m 644 {{ get_file("chi-sepnet.onnx") }} /opt/qsmxt/models/chi-sepnet.onnx
        - install -m 644 {{ get_file("r2primenet.onnx") }} /opt/qsmxt/models/r2primenet.onnx
        - install -m 644 {{ get_file("hd-bet.onnx") }} /opt/qsmxt/models/hd-bet.onnx
        - mkdir -p /opt/qsmxt/test-data
        - install -m 644 {{ get_file("MNI152_T1_2mm.nii.gz") }} /opt/qsmxt/test-data/MNI152_T1_2mm.nii.gz
        - install -m 644 {{ get_file("synthseg.onnx") }} /opt/qsmxt/models/synthseg.onnx
        - install -m 644 {{ get_file("models.sha256") }} /opt/qsmxt/models/models.sha256
        - cd /opt/qsmxt/models && sha256sum -c models.sha256

    - environment:
        PATH: /opt/qsmxt:$PATH
        # qsmxt resolves dcm2niix via this env var first; the bundled copy sits
        # alongside the binary, so conversion works out of the box.
        QSMXT_DCM2NIIX: /opt/qsmxt/dcm2niix
        OPENRECON_SOFTWARE_VERSION: "{{ context.upstream_version }}"
        OPENRECON_CONTAINER_VERSION: "{{ context.version }}"
        QSM_MODEL_DIR: /opt/qsmxt/models
        QSM_MODEL_CACHE: /tmp/share/qsmxt_models

    - run:
        - python3 -m zipfile -e {{ get_file("niimath_zip") }} /tmp/niimath
        - install -m 755 /tmp/niimath/niimath /opt/qsmxt/niimath
        - rm -rf /tmp/niimath
        - python3 -m pip install --break-system-packages --no-cache-dir antspyx=={{ context.antspyx_version }}

    - run:
        - bash {{ get_file("build-native.sh") }} {{ get_file("qsmxt_source") }} {{ get_file("rust_toolchain") }} {{ get_file("reuse-single-echo-magnitude.patch") }} {{ context.upstream_version }} {{ context.rust_version }} {{ context.qsm_core_commit }} {{ context.native_patch_sha256 }} {{ context.native_build_script_sha256 }} {{ get_file("parallel-native-kernels.patch") }} {{ context.qsm_core_patch_sha256 }}

    - run:
        - cp {{ get_file("qsmxt.py") }} /opt/code/python-ismrmrd-server/qsmxt.py
        - cp {{ get_file("qsmxt_regional_report.py") }} /opt/code/python-ismrmrd-server/qsmxt_regional_report.py
        - cp {{ get_file("qsmxt_gre_motion.py") }} /opt/code/python-ismrmrd-server/qsmxt_gre_motion.py
        - cp {{ get_file("qsmxt_ep3d.py") }} /opt/code/python-ismrmrd-server/qsmxt_ep3d.py
        - cp {{ get_file("qsmxt_ep3d_denoise.py") }} /opt/code/python-ismrmrd-server/qsmxt_ep3d_denoise.py
        - cp {{ get_file("OpenReconLabel.json") }} /opt/code/python-ismrmrd-server/OpenReconLabel.json
        - cp {{ get_file("OpenReconREADME.md") }} /opt/code/python-ismrmrd-server/OpenReconREADME.md
        - chmod 644 /opt/code/python-ismrmrd-server/qsmxt.py /opt/code/python-ismrmrd-server/qsmxt_regional_report.py /opt/code/python-ismrmrd-server/qsmxt_gre_motion.py /opt/code/python-ismrmrd-server/qsmxt_ep3d.py /opt/code/python-ismrmrd-server/qsmxt_ep3d_denoise.py /opt/code/python-ismrmrd-server/OpenReconLabel.json /opt/code/python-ismrmrd-server/OpenReconREADME.md
        - mkdir -p /tmp/share/qsmxt_openrecon /tmp/share/qsmxt_models
        - chmod 1777 /tmp/share /tmp/share/qsmxt_openrecon /tmp/share/qsmxt_models

    - run:
        - install -m 644 {{ get_file("verify_v10_runtime.py") }} /opt/qsmxt/verify_v10_runtime.py
        - install -m 644 {{ get_file("verify_output_echoes.py") }} /opt/qsmxt/verify_output_echoes.py
        - install -m 644 {{ get_file("verify_ep3d_runtime.py") }} /opt/qsmxt/verify_ep3d_runtime.py

    - boutique:
        name: qsmxt
        description: Inspect the installed QSMxT version or command help.
        tool-version: '{{ context.upstream_version }}'
        schema-version: '0.5'
        command-line: qsmxt [ACTION]
        inputs:
          - id: action
            name: Information to show
            description: Print the installed version or top-level command help.
            type: String
            value-key: '[ACTION]'
            value-choices: ['--version', '--help']
            default-value: '--version'
            optional: true
    - boutique:
        name: qsmxt-run
        description: Run the default QSMxT pipeline on a BIDS dataset.
        tool-version: '{{ context.upstream_version }}'
        schema-version: '0.5'
        command-line: qsmxt run [BIDS_DIR] [OUTPUT_DIR]
        inputs:
          - id: bids_dir
            name: BIDS input directory
            description: BIDS dataset containing supported phase and magnitude images.
            type: File
            value-key: '[BIDS_DIR]'
          - id: output_dir
            name: Output directory
            description: Writable parent for derivatives/qsmxt output.
            type: String
            value-key: '[OUTPUT_DIR]'
    - deploy:
        path:
          - /opt/qsmxt
        bins:
          - qsmxt
          - dcm2niix
          - python
          - siemens_to_ismrmrd

tests:
  - name: qsmxt version and help
    script: |
      qsmxt --version
      qsmxt --help
      qsmxt run --help
      qsmxt dicom-convert --help

  - name: dcm2niix available
    script: |
      dcm2niix --version > /tmp/dcm2niix-version.txt 2>&1 || [ "$?" -eq 3 ]
      grep -iq dcm2niix /tmp/dcm2niix-version.txt

  - name: OpenRecon runtime import
    script: |
      python /opt/code/python-ismrmrd-server/main.py -h 2>&1 | grep 'Example server for MRD streaming format'
      PYTHONPATH=/opt/code/python-ismrmrd-server python -c "import qsmxt, ismrmrd, nibabel, scipy, skimage; print(qsmxt.__file__)" | grep -x '/opt/code/python-ismrmrd-server/qsmxt.py'
      test -f /opt/code/python-ismrmrd-server/OpenReconLabel.json

categories:
  - image reconstruction
  - phase processing
  - quantitative imaging
  - structural imaging
  - workflows

structured_readme:
  description: QSMxT is an end-to-end software toolbox for Quantitative Susceptibility Mapping (QSM), rebuilt in Rust as a single self-contained binary. This container packages upstream QSMxT {{ context.upstream_version }}. It reconstructs QSM from BIDS datasets, converts DICOMs to BIDS, and provides an interactive TUI.
  example: |-
    ml qsmxt/{{ context.version }}

    # Easiest: do everything interactively (convert, configure, run)
    qsmxt tui

    # Or non-interactively on the command line:
    qsmxt dicom-convert <INPUT_DICOM_DIR> <OUTPUT_BIDS_DIR>
    qsmxt run <INPUT_BIDS_DIR> [<OPTIONAL_OUTPUT_DIR>]
    qsmxt --help
  documentation: https://qsmxt.github.io/QSMxT/
  citation: "Stewart AW, Robinson SD, O’Brien K, Jin J, Widhalm G, Hangel G, Walls A, Goodwin J, Eckstein K, Tourell M, Morgan C, Narayanan A, Barth M, Bollmann S. “QSMxT: Robust masking and artifact reduction for quantitative susceptibility mapping”. Magnetic resonance in medicine 87.3 (2022): 1289-1300. https://doi.org/10.1002/mrm.29048"

readme: |-
  ----------------------------------
  ## qsmxt/{{ context.version }} ##

  QSMxT is an end-to-end software toolbox for Quantitative Susceptibility Mapping
  (QSM). This container packages upstream QSMxT {{ context.upstream_version }}.
  QSMxT is implemented in Rust as a single
  self-contained binary that reconstructs QSM from BIDS datasets, converts DICOMs
  to BIDS, and includes an interactive TUI. A pinned dcm2niix is bundled.

  Example:
  ```
  ml qsmxt/{{ context.version }}

  # Easiest: do everything interactively (convert, configure, run)
  qsmxt tui

  # Or non-interactively:
  qsmxt dicom-convert <INPUT_DICOM_DIR> <OUTPUT_BIDS_DIR>
  qsmxt run <INPUT_BIDS_DIR> [<OPTIONAL_OUTPUT_DIR>]
  qsmxt --help
  ```

  More documentation can be found here: https://qsmxt.github.io/QSMxT/

  Citation:
  ```
  Stewart AW, Robinson SD, O’Brien K, Jin J, Widhalm G, Hangel G, Walls A, Goodwin J, Eckstein K, Tourell M, Morgan C, Narayanan A, Barth M, Bollmann S. “QSMxT: Robust masking and artifact reduction for quantitative susceptibility mapping”. Magnetic resonance in medicine 87.3 (2022): 1289-1300. https://doi.org/10.1002/mrm.29048
  ```

  To run container outside of this environment: ml qsmxt/{{ context.version }}

  ----------------------------------
