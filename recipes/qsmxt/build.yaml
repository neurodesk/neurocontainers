  - x86_64

variables:
  openrecon_server_commit: "33362f2139701fbf5ea855808a325eb59b7db2ae"
  openrecon_python_tools_commit: "17fe6fbf1bb645112e2ad0023eb4f42afb36421e"
  openrecon_siemens_commit: "055eefc09dfa77fbf11fff85979dea9ef2879ba5"
  openrecon_ismrmrd_version: "1.14.2"
  upstream_version: "10.0.0"
  qsmxt_source_sha256: 6a839d0c617426c48f48f4e4a2c67a4283e3e814912a1aa21a1537170a8d6a00
  qsm_core_commit: "42ab620190ad315c9dcf7aa8ec4a036402002b7e"
  qsm_core_patch_sha256: a714c9e2c6b7f730cd5337c77da1d5657c9dee302e61f8df3b05f2048b169053
  native_patch_sha256: 5a01558691a210d8b3a472f96a3dcde932bedf3cb20c7b451dc60972dd9ba652
  native_build_script_sha256: 30f4ea2bad991cc00e067f47efe16bcd71e4509e25f0bc5ff0f152de42367b99
  rust_version: "1.98.0"
  rust_x86_64_sha256: ed8ee2df70909c88cbaf87a6cfa3920dac00b537de12a6abe6906641e0f5952f
