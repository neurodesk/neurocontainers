name: qsmxt
version: "9.21.0"

test_data:
  output_dir: test_output
  fake_qsmxt: test_output/fake-qsmxt

setup:
  script: |
    #!/usr/bin/env bash
    set -euo pipefail
    mkdir -p "${output_dir}"
    cat > "${fake_qsmxt}" <<'PY'
    #!/usr/bin/env python3
    import sys
    from pathlib import Path

    import nibabel as nib
    import numpy as np

    if len(sys.argv) < 4 or sys.argv[1] != "run":
        raise SystemExit(2)
    try:
        nprocs_index = sys.argv.index("--n-procs")
    except ValueError:
        raise SystemExit("qsmxt OpenRecon should pass --n-procs 24")
    if nprocs_index + 1 >= len(sys.argv) or sys.argv[nprocs_index + 1] != "24":
        raise SystemExit("qsmxt OpenRecon should pass --n-procs 24")
    for flag, expected in (
        ("--qsm-algorithm", "hdqsm"),
        ("--unwrapping-algorithm", "romeo"),
        ("--bf-algorithm", "ismv"),
    ):
        try:
            flag_index = sys.argv.index(flag)
        except ValueError:
            raise SystemExit(f"qsmxt OpenRecon should pass {flag} {expected}")
        if flag_index + 1 >= len(sys.argv) or sys.argv[flag_index + 1] != expected:
            raise SystemExit(f"qsmxt OpenRecon should pass {flag} {expected}")
    if "--mask" in sys.argv:
        mask_index = sys.argv.index("--mask")
        expected_mask = "magnitude,bet:0.5,close:1,fill-holes:0"
        if mask_index + 1 >= len(sys.argv) or sys.argv[mask_index + 1] != expected_mask:
            raise SystemExit(f"qsmxt OpenRecon should pass --mask {expected_mask}")

    bids = Path(sys.argv[2])
    output = Path(sys.argv[3])
    phase = sorted(bids.glob("sub-*/anat/*_echo-1_part-phase_MEGRE.nii.gz"))[0]
    image = nib.load(str(phase))
    data = np.zeros(image.shape, dtype=np.float32) + 1.5
    name = phase.name.replace("_echo-1_part-phase_MEGRE.nii.gz", "_Chimap.nii")
    destination = output / "derivatives" / "qsmxt" / "sub-01" / "anat" / name
    destination.parent.mkdir(parents=True, exist_ok=True)
    nib.save(nib.Nifti1Image(data, image.affine), str(destination))
    print(destination)
    PY
    chmod +x "${fake_qsmxt}"

tests:
  - name: QSMxT command line tools
    description: Verify the packaged QSMxT and bundled dcm2niix entrypoints start
    script: |
      set -euo pipefail
      command -v qsmxt | grep -x /opt/qsmxt/qsmxt
      command -v dcm2niix | grep -x /opt/qsmxt/dcm2niix
      qsmxt --version | grep -F '${upstream_version}'
      qsmxt --help >/dev/null
      qsmxt run --help >/dev/null
      dcm2niix --version > "${output_dir}/dcm2niix-version.txt" 2>&1 || [ "$?" -eq 3 ]
      grep -i dcm2niix "${output_dir}/dcm2niix-version.txt"

  - name: QSMxT release version
    command: qsmxt --version
    expected_output_contains: "${upstream_version}"

  - name: T2 star fitting and scanner display
    description: Fit synthetic echoes and verify millisecond scaling and a shared robust window
    script: |
      set -euo pipefail
      python - <<'PYCODE'
      import subprocess
      import sys
      import tempfile
      from pathlib import Path

      import ismrmrd
      import nibabel as nib
      import numpy as np

      sys.path.insert(0, "/opt/code/python-ismrmrd-server")
      import qsmxt

      with tempfile.TemporaryDirectory() as work:
          root = Path(work)
          truth = np.full((10, 10, 10), 0.05)
          truth[0, :2, :] = 12.0
          mask = root / "mask.nii.gz"
          nib.save(nib.Nifti1Image(np.ones(truth.shape, dtype=np.uint8), np.eye(4)), mask)
          echoes = []
          for index, te in enumerate([0.01, 0.02, 0.03]):
              path = root / f"echo-{index}.nii.gz"
              signal = (1000 * np.exp(-te / truth)).astype(np.float32)
              nib.save(nib.Nifti1Image(signal, np.eye(4)), path)
              echoes.append(str(path))
          result = root / "T2starmap.nii.gz"
          subprocess.run([
              "qsmxt", "t2star", *echoes, "--mask", str(mask),
              "--output", str(result), "--echo-times", "0.01", "0.02", "0.03",
          ], check=True)
          fitted = nib.load(result).get_fdata()
          np.testing.assert_allclose(fitted, truth, rtol=0.001)
          anchor = ismrmrd.Image.from_array(np.ones((1, 10, 10), dtype=np.float32))
          images = qsmxt._nifti_to_mrd_images(
              result, anchor, qsmxt.OUTPUT_SERIES_START,
              "QSMxT T2star", "QSMXT_T2STAR", "t2star", "s",
          )
          qsmxt._validate_output_images(images, [anchor])
          assert len(images) == 10
          for image in images:
              meta = ismrmrd.Meta.deserialize(image.attribute_string)
              assert meta["QSMxTWindowDomain"] == "ms"
              assert float(meta["RescaleSlope"]) == 1
              assert float(meta["WindowCenter"]) == 25
              assert float(meta["WindowWidth"]) == 50
              assert int(meta["QSMxTDisplayClippedVoxels"]) == 20
              pixels = image.data.reshape(10, 10)
              assert np.count_nonzero(pixels == 50) == 98
              assert np.count_nonzero(pixels == 4095) == 2
          np.testing.assert_array_equal(nib.load(result).get_fdata(), fitted)
      print("T2 star fit, millisecond scaling, and scanner window verified")
      PYCODE

  - name: GRE source separation and scanner maps
    description: Run both GRE-only methods on synthetic echoes and verify source maps and scanner units
    script: |
      set -euo pipefail
      python - <<'PYCODE'
      import json
      import sys
      import tempfile
      from pathlib import Path

      import ismrmrd
      import nibabel as nib
      import numpy as np

      sys.path.insert(0, '/opt/code/python-ismrmrd-server')
      import qsmxt

      with tempfile.TemporaryDirectory() as work:
          root = Path(work)
          bids = root / 'bids'
          anat = bids / 'sub-01' / 'anat'
          anat.mkdir(parents=True)
          (bids / 'dataset_description.json').write_text(json.dumps({
              'Name': 'GRE source separation smoke test', 'BIDSVersion': '1.9.0',
          }))
          shape = (24, 24, 24)
          xyz = np.indices(shape) - 11.5
          brain = np.sum(xyz ** 2, axis=0) < 100
          chi = np.zeros(shape)
          chi[np.sum(xyz ** 2, axis=0) < 16] = 0.08
          k = np.meshgrid(*(np.fft.fftfreq(n) for n in shape), indexing='ij')
          k2 = sum(axis ** 2 for axis in k)
          dipole = 1 / 3 - np.divide(k[2] ** 2, k2, out=np.zeros(shape), where=k2 > 0)
          dipole[0, 0, 0] = 0
          field = np.fft.ifftn(np.fft.fftn(chi) * dipole).real
          for echo, te in enumerate([0.005, 0.01, 0.015, 0.02, 0.025], 1):
              magnitude = brain * 1000 * np.exp(-30 * te)
              phase = np.angle(np.exp(1j * field * 2 * np.pi * 42.57747892 * 3 * te))
              for part, data in [('mag', magnitude), ('phase', (phase + np.pi) * 4096 / (2 * np.pi))]:
                  stem = f'sub-01_echo-{echo}_part-{part}_MEGRE'
                  nib.save(nib.Nifti1Image(data.astype(np.float32), np.eye(4)), anat / f'{stem}.nii.gz')
                  (anat / f'{stem}.json').write_text(json.dumps({
                      'EchoTime': te, 'MagneticFieldStrength': 3.0, 'B0_dir': [0, 0, 1],
                  }))
          anchor = ismrmrd.Image.from_array(np.ones((1, 24, 24), dtype=np.float32))
          for method in ['r2star-qsm', 'decompose']:
              settings = qsmxt._settings_from_config({'parameters': {
                  'sourceseparation': method, 'maskpreset': 'robust-threshold',
                  'maskcleanup': 'none', 'qsmalgorithm': 'tkd',
              }})
              output = root / method
              qsmxt._run_qsmxt(bids, output, settings)
              specs = qsmxt._find_qsmxt_outputs(output, {'subject': '01'}, settings)
              assert {item[0] for item in specs} == {'qsm', *qsmxt.SOURCE_SEPARATION_OUTPUTS}
              maps = {}
              for index, (output_id, spec, path) in enumerate(specs):
                  data = nib.load(path).get_fdata()
                  assert np.isfinite(data).all()
                  assert np.any(data != 0), (method, output_id)
                  maps[output_id] = data
                  images = qsmxt._nifti_to_mrd_images(
                      path, anchor, qsmxt.OUTPUT_SERIES_START + index,
                      spec['series'], spec['token'], output_id, spec['units'],
                  )
                  qsmxt._validate_output_images(images, [anchor])
                  assert len(images) == 24
                  for image in images:
                      meta = ismrmrd.Meta.deserialize(image.attribute_string)
                      assert meta['QSMxTWindowDomain'] == 'ppb'
                      assert meta['QSMxTUnits'] == 'ppm'
              assert np.min(maps['paramagnetic']) >= 0
              assert np.min(maps['diamagnetic']) >= 0
              np.testing.assert_allclose(
                  maps['separated-total'], maps['paramagnetic'] - maps['diamagnetic'], atol=1e-6,
              )
              print(f'{method}: GRE reconstruction, distinct source maps, and scanner conversion passed')
      PYCODE

  - name: SWI scanner window
    description: Verify integer windows shared by tissue and empty slices
    script: |
      set -euo pipefail
      python - <<'PYCODE'
      import sys
      import tempfile
      from pathlib import Path

      import ismrmrd
      import nibabel as nib
      import numpy as np

      sys.path.insert(0, "/opt/code/python-ismrmrd-server")
      import qsmxt

      with tempfile.TemporaryDirectory() as work:
          data = np.zeros((32, 32, 2), dtype=np.float32)
          data[:, :, 1] = np.linspace(0.1, 1.0, 1024).reshape(32, 32)
          data[-1, -1, 1] = 3.269
          path = Path(work) / "swi.nii.gz"
          nib.save(nib.Nifti1Image(data, np.eye(4)), path)
          anchor = ismrmrd.Image.from_array(np.ones((1, 32, 32), dtype=np.float32))
          images = qsmxt._nifti_to_mrd_images(
              path, anchor, qsmxt.OUTPUT_SERIES_START,
              "QSMxT SWI", "QSMXT_SWI", "swi", "a.u.",
          )
          qsmxt._validate_output_images(images, [anchor])
          assert len(images) == 2
          windows = set()
          for image in images:
              meta = ismrmrd.Meta.deserialize(image.attribute_string)
              assert meta["QSMxTWindowDomain"] == "scaled-a.u."
              assert float(meta["RescaleSlope"]) == 1
              assert float(meta["RescaleIntercept"]) == 0
              center, width = int(meta["WindowCenter"]), int(meta["WindowWidth"])
              assert width > 2
              high = np.percentile(data[data > 0], 99)
              assert abs(width - high * float(meta["QSMxTDisplayScale"])) <= 1
              assert abs(center - width / 2) <= 1
              windows.add((center, width))
          assert len(windows) == 1
          np.testing.assert_array_equal(nib.load(path).get_fdata(), data)
      print("SWI scaling and shared integer scanner window verified")
      PYCODE

  - name: OpenRecon algorithm coverage
    description: Compare GUI algorithm choices with the installed QSMxT CLI
    script: |
      set -euo pipefail
      python - <<'PYCODE'
      import json
      import os
      import re
      import subprocess
      from pathlib import Path

      label = json.loads(Path("/opt/code/python-ismrmrd-server/OpenReconLabel.json").read_text())
      parameters = {item["id"]: item for item in label["parameters"]}
      help_text = subprocess.check_output(["qsmxt", "run", "--help"], text=True)
      for parameter, flag in (
          ("qsmalgorithm", "qsm-algorithm"),
          ("unwrappingalgorithm", "unwrapping-algorithm"),
          ("bfalgorithm", "bf-algorithm"),
      ):
          section = help_text.split(f"--{flag} <", 1)[1].split("\n      --", 1)[0]
          inline = re.search(r"\[possible values: ([^]]+)\]", section)
          supported = (
              set(inline.group(1).split(", ")) if inline
              else set(re.findall(r"^          - ([a-z0-9-]+)", section, re.MULTILINE))
          )
          exposed = {value["id"] for value in parameters[parameter]["values"]} - {"default"}
          assert supported, f"Cannot read choices for {flag}"
          assert exposed == supported, f"{flag}: missing={supported - exposed}, unsupported={exposed - supported}"
          print(f"{flag}: all {len(supported)} algorithms exposed")
      cache = Path(os.environ["QSM_MODEL_CACHE"])
      cache.mkdir(parents=True, exist_ok=True)
      import tempfile
      with tempfile.TemporaryFile(dir=cache) as probe:
          probe.write(b"writable model cache")
      assert not str(cache).startswith("/home/")
      PYCODE

  - name: Bundled neural-network weights and offline inference
    description: Verify every model checksum and run xQSM using the packaged weights
    script: |
      set -euo pipefail
      cd /opt/qsmxt/models
      sha256sum -c models.sha256
      python - <<'PYCODE'
      import os
      import subprocess
      import tempfile
      from pathlib import Path

      import nibabel as nib
      import numpy as np

      assert os.environ["QSM_MODEL_DIR"] == "/opt/qsmxt/models"
      with tempfile.TemporaryDirectory() as directory:
          root = Path(directory)
          x, y, z = np.indices((16, 16, 16))
          radius = (x - 7.5)**2 + (y - 7.5)**2 + (z - 7.5)**2
          field = (0.01 * np.exp(-radius / 20)).astype(np.float32)
          mask = (radius < 40).astype(np.uint8)
          for name, data in (("field", field), ("mask", mask)):
              nib.save(nib.Nifti1Image(data, np.eye(4)), root / f"{name}.nii.gz")
          subprocess.run([
              "qsmxt", "invert", "xqsm", str(root / "field.nii.gz"),
              "--mask", str(root / "mask.nii.gz"),
              "--output", str(root / "chi.nii.gz"),
          ], check=True)
          result = nib.load(root / "chi.nii.gz").get_fdata()
          assert result.shape == field.shape
          assert np.isfinite(result).all() and np.ptp(result) > 0
          print("xQSM produced a finite, nonconstant susceptibility map")
      PYCODE

  - name: OpenRecon server entrypoints
    description: Verify the OpenRecon server and deployed qsmxt module are present
    script: |
      set -euo pipefail
      python /opt/code/python-ismrmrd-server/main.py -h > "${output_dir}/openrecon-help.txt" 2>&1
      grep 'Example server for MRD streaming format' "${output_dir}/openrecon-help.txt"
      test -f /opt/code/python-ismrmrd-server/qsmxt.py
      test -f /opt/code/python-ismrmrd-server/OpenReconLabel.json
      test -f /opt/code/python-ismrmrd-server/OpenReconREADME.md

  - name: OpenRecon label contract
    description: Verify the installed OpenRecon metadata exposes the expected qsmxt controls
    script: |
      set -euo pipefail
      python - <<'PY'
      import json
      from pathlib import Path

      label = Path("/opt/code/python-ismrmrd-server/OpenReconLabel.json")
      data = json.loads(label.read_text())
      assert data["general"]["id"] == "qsmxt"
      assert data["reconstruction"]["emitter"] == "image"
      assert data["reconstruction"]["injector"] == "image"
      parameter_ids = {parameter["id"] for parameter in data["parameters"]}
      expected = {
          "config",
          "sendoutputs",
          "sourceseparation",
          "maskthresholdpercentile",
          "pipelinepreset",
          "qsmalgorithm",
          "unwrappingalgorithm",
          "bfalgorithm",
          "maskpreset",
      }
      assert expected <= parameter_ids
      parameters = {parameter["id"]: parameter for parameter in data["parameters"]}
      pipeline_preset = parameters["pipelinepreset"]
      assert pipeline_preset["type"] == "choice"
      assert pipeline_preset["default"] == "custom"
      import sys
      sys.path.insert(0, "/opt/code/python-ismrmrd-server")
      import qsmxt
      assert {value["id"] for value in pipeline_preset["values"]} == {
          "custom", *qsmxt.ALGORITHM_PIPELINE_PRESETS,
      }
      assert parameters["sourceseparation"]["default"] == "off"
      assert {value["id"] for value in parameters["sourceseparation"]["values"]} == set(qsmxt.SOURCE_SEPARATION_METHODS)
      assert parameters["qsmalgorithm"]["default"] == "hdqsm"
      assert "whqsm" in {
          value["id"] for value in parameters["qsmalgorithm"]["values"]
      }
      assert parameters["unwrappingalgorithm"]["default"] == "romeo"
      assert parameters["bfalgorithm"]["default"] == "ismv"
      if "inputseries" in parameters:
          assert parameters["inputseries"]["default"] == "distortion-corrected"
          assert [
              value["id"] for value in parameters["inputseries"]["values"]
          ] == [
              "distortion-corrected",
              "non-distortion-corrected",
              "both",
          ]
      if "maskcleanup" in parameter_ids:
          assert parameters["maskpreset"]["default"] == "bet"
          assert parameters["maskinginput"]["default"] == "magnitude"
          assert parameters["betfractionalintensity"]["default"] == 0.5
          assert parameters["maskcleanup"]["default"] == "close-fill"
      assert "sendoriginal" not in parameter_ids
      assert parameters["maskthresholdpercentile"]["default"] == 65.0
      assert "minip" not in parameter_ids
      print(label)
      PY

  - name: OpenRecon bridge imports and display scaling
    description: Verify the Python bridge imports with runtime dependencies and preserves scanner display scaling
    script: |
      set -euo pipefail
      PYTHONPATH=/opt/code/python-ismrmrd-server python - <<'PY'
      import numpy as np
      import ismrmrd
      import nibabel
      import scipy
      import skimage
      import qsmxt

      display, meta = qsmxt._scanner_display_volume(
          np.asarray([[[-0.01, 0.0, 0.01]]], dtype=np.float32),
          "qsm",
          "ppm",
      )

      assert display.dtype == np.uint16
      assert display.tolist() == [[[1048, 2048, 3048]]]
      assert meta["scale"] == 100000.0
      assert meta["offset"] == 2048.0
      assert meta["rescale_slope"] == 0.00001
      assert meta["rescale_intercept"] == -0.02048
      assert meta["padding_value"] == 0
      assert meta["formula"] == "ppm = (display - 2048) / 100000"
      assert qsmxt.DEFAULT_QSMXT_BINARY == "/opt/qsmxt/qsmxt"
      print(qsmxt.__file__)
      PY

  - name: OpenRecon bridge sends derived QSM images
    description: Run the qsmxt OpenRecon bridge against generated MRD images with a fake QSMxT derivative writer
    timeout: 180
    script: |
      set -euo pipefail
      FAKE_QSMXT="${fake_qsmxt}" OUTPUT_DIR="${output_dir}" PYTHONPATH=/opt/code/python-ismrmrd-server python - <<'PY'
      import os
      from pathlib import Path

      import ismrmrd
      import numpy as np
      import qsmxt

      class FakeAcquisitionSystemInformation:
          systemFieldStrength_T = 7.0

      class FakeMeasurementInformation:
          protocolName = "gre_qsm"

      class FakeSequenceParameters:
          TE = [20.0]

      class FakeMetadata:
          acquisitionSystemInformation = FakeAcquisitionSystemInformation()
          measurementInformation = FakeMeasurementInformation()
          sequenceParameters = FakeSequenceParameters()

      class FakeConnection:
          def __init__(self, images):
              self.images = images
              self.sent_batches = []
              self.logs = []
              self.closed = False

          def __iter__(self):
              yield from self.images
              yield None

          def send_image(self, images):
              self.sent_batches.append(images if isinstance(images, list) else [images])

          def send_logging(self, level, contents):
              self.logs.append((level, contents))

          def send_close(self):
              self.closed = True

      def set_header_vector(header, field_name, values):
          target = getattr(header, field_name)
          for index, value in enumerate(values):
              target[index] = value

      def image(series_index, image_index, sequence, data, image_type=ismrmrd.IMTYPE_MAGNITUDE):
          mrd_image = ismrmrd.Image.from_array(data.astype(np.float32), transpose=False)
          header = mrd_image.getHead()
          header.image_series_index = series_index
          header.image_index = image_index
          header.image_type = image_type
          set_header_vector(header, "matrix_size", [data.shape[2], data.shape[1], data.shape[0]])
          set_header_vector(header, "field_of_view", [4.0, 3.0, 2.0])
          set_header_vector(header, "position", [0.0, 0.0, 0.0])
          set_header_vector(header, "read_dir", [1.0, 0.0, 0.0])
          set_header_vector(header, "phase_dir", [0.0, 1.0, 0.0])
          set_header_vector(header, "slice_dir", [0.0, 0.0, 1.0])
          mrd_image.setHead(header)

          meta = ismrmrd.Meta()
          meta["SequenceDescription"] = sequence
          mrd_image.attribute_string = meta.serialize()
          return mrd_image

      shape_zyx = (2, 3, 4)
      images = [
          image(1, 1, "gre_qsm", np.full(shape_zyx, 1001, dtype=np.float32)),
          image(1, 2, "gre_qsm", np.full(shape_zyx, 1002, dtype=np.float32)),
          image(2, 1, "gre_qsm_Pha", np.full(shape_zyx, 2001, dtype=np.float32), getattr(ismrmrd, "IMTYPE_PHASE", 2)),
          image(2, 2, "gre_qsm_Pha", np.full(shape_zyx, 2002, dtype=np.float32), getattr(ismrmrd, "IMTYPE_PHASE", 2)),
      ]
      connection = FakeConnection(images)
      qsmxt.OPENRECON_WORK_ROOT = Path(os.environ["OUTPUT_DIR"]) / "openrecon-work"

      qsmxt.process(
          connection,
          {
              "parameters": {
                  "qsmxtbinary": os.environ["FAKE_QSMXT"],
                  "echotimesms": "10,20",
                  "maxechoes": "2",
                  "sendoutputs": "qsm",
                  "sendoriginal": "false",
              }
          },
          FakeMetadata(),
      )

      assert connection.closed is True
      assert connection.logs == []
      assert len(connection.sent_batches) == 3
      assert len(connection.sent_batches[-1]) == 2

      for original, source in zip(
          [image for batch in connection.sent_batches[:2] for image in batch], images,
      ):
          np.testing.assert_array_equal(original.data, source.data)
      first = connection.sent_batches[-1][0]
      first_header = first.getHead()
      first_meta = ismrmrd.Meta.deserialize(first.attribute_string)
      assert int(first_header.image_series_index) == qsmxt.OUTPUT_SERIES_START
      assert int(first_header.image_index) == 1
      assert int(first_header.slice) == 0
      assert first.data.shape == (1, 1, 3, 4)
      assert first.data.dtype == np.uint16
      assert np.all(first.data == 3548)
      assert first_meta["QSMxTOutput"] == "qsm"
      assert first_meta["ImageType"] == "DERIVED\\PRIMARY\\M\\QSMXT_CHIMAP"
      assert first_meta["QSMxTDisplayFormula"] == "ppm = (display - 2048) / 1000"
      assert first_meta["DataRole"] == ["Image", "Quantitative"]
      assert first_meta["PixelPaddingValue"] == "0"
      window_domain = first_meta.get("QSMxTWindowDomain")
      if window_domain == "ppb":
          assert float(first_meta["RescaleSlope"]) == 1.0
          assert float(first_meta["RescaleIntercept"]) == -2048.0
          assert first_meta["RescaleType"] == "US"
          assert float(first_meta["WindowCenter"]) == 1500.0
          assert float(first_meta["WindowWidth"]) == 1000.0
          assert float(first_meta["QSMxTPhysicalWindowCenter"]) == 1.5
          assert float(first_meta["QSMxTPhysicalWindowWidth"]) == 1.0
      elif window_domain == "stored":
          assert float(first_meta["RescaleSlope"]) == 0.001
          assert float(first_meta["RescaleIntercept"]) == -2.048
          assert first_meta["RescaleType"] == "US"
          assert first_meta["PixelPaddingRangeLimit"] == "0"
          assert float(first_meta["WindowCenter"]) == 3548.0
          assert float(first_meta["WindowWidth"]) == 1000.0
          assert float(first_meta["QSMxTPhysicalWindowCenter"]) == 1.5
          assert float(first_meta["QSMxTPhysicalWindowWidth"]) == 1.0
      elif "WindowCenter" in first_meta:
          assert float(first_meta["RescaleSlope"]) == 0.001
          assert float(first_meta["RescaleIntercept"]) == -2.048
          assert first_meta["RescaleType"] == "US"
          assert float(first_meta["WindowCenter"]) == 1.5
          assert float(first_meta["WindowWidth"]) == 1.0
      else:
          assert float(first_meta["RescaleSlope"]) == 0.001
          assert float(first_meta["RescaleIntercept"]) == -2.048
