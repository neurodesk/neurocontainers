name: eman2
version: 2.99.85
copyright:
  - license: GPL-2.0-or-later
    url: https://github.com/cryoem/eman2/blob/v2.99.85/libEM/emdata.h
architectures:
  - x86_64
variables:
  upstream_version: 2.99.85
auto_update:
  method: sources
  container_version: eman2
  sources:
    - id: eman2
      method: webpage
      url: https://api.anaconda.org/package/cryoem/eman-dev
      version_regex: 'linux-64/eman-dev-(?P<version>\d+\.\d+\.\d+)-gui_'
      target:
        variable: upstream_version
        fulltest_variable: upstream_version
    - id: micromamba
      method: http_digest
      url: https://micro.mamba.pm/api/micromamba/linux-64/2.3.2
      dependency: true
      target:
        file: micromamba
build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
    - install:
        - bzip2
        - ca-certificates
        - fontconfig
        - libdbus-1-3
        - libegl1
        - libgl1
        - libglu1-mesa
        - libglx-mesa0
        - libxkbcommon-x11-0
        - libxcb-cursor0
        - libxcb-icccm4
        - libxcb-image0
        - libxcb-keysyms1
        - libxcb-randr0
        - libxcb-render-util0
        - libxcb-shape0
        - libxcb-xinerama0
        - libxcb-xkb1
    - run:
        - mkdir -p /tmp/micromamba
        - tar -xjf {{ get_file("micromamba") }} -C /tmp/micromamba bin/micromamba
        - >-
          MAMBA_ROOT_PREFIX=/tmp/mamba /tmp/micromamba/bin/micromamba create -y -p /opt/eman2
          --override-channels -c cryoem -c conda-forge
          "eman-dev={{ context.upstream_version }}=gui_*"
        - rm -rf /tmp/mamba /tmp/micromamba
        - /opt/eman2/bin/fc-cache -f
        - mkdir -p /opt/eman2-bin
        - for script in /opt/eman2/bin/e2*.py; do ln -s "$script" /opt/eman2-bin/; done
        - test -x /opt/eman2-bin/e2version.py
        - test -x /opt/eman2-bin/e2projectmanager.py
    - environment:
        PATH: /opt/eman2-bin:/opt/eman2/bin:$PATH
files:
  - name: micromamba
    url: https://micro.mamba.pm/api/micromamba/linux-64/2.3.2
    sha256: 5512233cdd8564a671626081026dc861537a963baa06706baab08fac6f3bb9d2
deploy:
  path:
    - /opt/eman2-bin
gui_apps:
  - name: e2projectmanagerGUI
    exec: e2projectmanager.py
  - name: e2displayGUI
    exec: e2display.py
categories:
  - cryo EM
readme: |
  ## eman2/{{ context.version }}

  EMAN2 is a scientific image processing suite for single particle cryo-EM
  reconstruction, subtomogram averaging and related electron microscopy workflows.
  Release {{ context.upstream_version }} of the official `eman-dev` conda package
  (cryoem and conda-forge channels, Qt GUI build) is installed in /opt/eman2.

  All `e2*.py` programs are on the PATH. Examples:
  ```
  e2version.py
  e2proc2d.py input.hdf output.mrc --process filter.lowpass.gauss:cutoff_freq=0.1
  e2proc3d.py map.mrc map_small.mrc --clip 64
  e2projectmanager.py   # GUI workflow manager
  e2display.py map.mrc  # image and volume viewer
  ```

  The GUI programs (e2projectmanager.py, e2display.py, e2boxer.py and others) use
  Qt5 and OpenGL and need a desktop session such as Neurodesktop. They store
  preferences in `$HOME/.eman2`, so HOME must be writable when they run.
  Projects, logs and outputs are written to the current working directory, so run
  EMAN2 from a writable mounted project directory. No GPU is required; the bundled
  TensorFlow runs on the CPU when no GPU is available.

  Documentation: https://blake.bcm.edu/emanwiki/EMAN2

  To run container outside of this environment: ml eman2/{{ context.version }}

  Citation:
  ```
  Tang G, Peng L, Baldwin PR, Mann DS, Jiang W, Rees I, Ludtke SJ.
  EMAN2: an extensible image processing suite for electron microscopy.
  J Struct Biol. 2007;157(1):38-46. doi:10.1016/j.jsb.2006.05.009
  ```

  License: EMAN2 is issued under a joint BSD/GNU license (GPL-2.0-or-later, or BSD
  at your option); the complete package includes GPL dependencies.
icon: data:image/png;base64,
