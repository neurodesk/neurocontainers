name: tgvqsm
version: 1.0.0

architectures:
  - x86_64

auto_update:
  method: sources
  sources:
  - id: cmake
    method: github_release
    repo: Kitware/CMake
    version_regex: '^v(?P<version>3[.][0-9]+[.][0-9]+)$'
    target:
      variable: cmake_version
  - id: binary
    method: http_digest
    url: https://www.neuroimaging.at/media/qsm/TGVQSM-plus.zip
    target:
      file: source
  - id: bet2
    method: github_commit
    repo: liangfu/bet2
    target:
      variable: bet2_revision
  - id: dcm2niix
    method: github_release
    repo: rordenlab/dcm2niix
    target:
      variable: dcm2niix_version
      fulltest_variable: dcm2niix_version
      value: tag
build:
  kind: neurodocker
  base-image: ubuntu:16.04
  pkg-manager: apt
  directives:
    - install:
      - build-essential
      - zlib1g-dev
      - libopenjp2-7-dev
      - pkg-config
      - cmake
      - git
      - unzip
      - wget
    - run:
      - mkdir -p /bet2/build
      - tar -xzf {{ get_file("bet2") }} --strip-components 1 -C /bet2
    - workdir: /bet2/build
    - run:
      - cmake .. && make
    - run:
        - mkdir -p /opt/dcm2niix-{{ context.dcm2niix_version }}
        - mkdir -p /tmp/dcm2niix-cmake
        - tar -xzf {{ get_file("cmake") }} -C /tmp/dcm2niix-cmake --strip-components=1
        - export PATH=/tmp/dcm2niix-cmake/bin:$PATH
        - mkdir -p /tmp/dcm2niix/build
        - tar -xzf {{ get_file("dcm2niix_source") }} -C /tmp/dcm2niix --strip-components=1
        - cd /tmp/dcm2niix/build
        - cmake -DZLIB_IMPLEMENTATION=System -DUSE_OPENJPEG=System ..
        - make -j2
        - install -m755 bin/dcm2niix /opt/dcm2niix-{{ context.dcm2niix_version }}/dcm2niix
        - /opt/dcm2niix-{{ context.dcm2niix_version }}/dcm2niix -h
        - cd / && rm -rf /tmp/dcm2niix /tmp/dcm2niix-cmake
    - environment:
        PATH: /opt/dcm2niix-{{ context.dcm2niix_version }}:$PATH
    - workdir: /
    - run:
      - cp {{ get_file("miniconda") }} /Miniconda2-4.6.14-Linux-x86_64.sh
    - environment:
        PATH: /miniconda2/bin:$PATH
    - run:
      - bash Miniconda2-4.6.14-Linux-x86_64.sh -b -p /miniconda2/
      - /miniconda2/bin/conda install -c anaconda cython==0.29.14
      - /miniconda2/bin/conda install numpy
      - /miniconda2/bin/conda install pyparsing
      - /miniconda2/bin/pip install scipy==0.17.1 nibabel==2.1.0
      - unzip -q {{ get_file("source") }} -d /tmp/tgvqsm
      - mv /tmp/tgvqsm/* /opt/tgvqsm-source
      - rmdir /tmp/tgvqsm
    - workdir: /opt/tgvqsm-source
    - copy: setup.py /opt/tgvqsm-source
    - run:
      - /miniconda2/bin/python setup.py install
    - workdir: /opt/tgvqsm-{{ context.upstream_version }}
    - run:
      - cp /miniconda2/bin/tgv_qsm .
deploy:
  path:
    - /opt/tgvqsm-{{ context.upstream_version }}/
    - /bet2/
    - /opt/dcm2niix-{{ context.dcm2niix_version }}

readme: |-
  
  ----------------------------------
  ## tgvqsm/1.0.0 ##
  Quantitative susceptibility mapping allows the determination magnetic susceptibility from MRI phase data. TGV QSM is a python implementation to compute this.
  
  This container also includes bet2 for brain extraction and dcm2niix to convert dicom data to NiFTI files.
  
  Example:
  ```
  dcm2niix -o ./ -f magnitude GR_M_5_QSM_p2_1mmIso_TE20/
  dcm2niix -o ./ -f phase GR_P_6_QSM_p2_1mmIso_TE20/
  
  bet2 magnitude.nii magnitude_bet2
  
  tgv_qsm \
    -p phase.nii \
    -m magnitude_bet2_mask.nii.gz \
    -f 2.89 \
    -t 0.02 \
    -s \
    -o qsm
  ```
  
  More documentation can be found here: http://www.neuroimaging.at/pages/qsm.php
  
  To run container outside of this environment: ml tgvqsm/1.0.0
  
  Citation:
  ```
  Langkammer, C; Bredies, K; Poser, BA; Barth, M; Reishofer, G; Fan, AP; Bilgic, B; Fazekas, F; Mainero; C; Ropele, S
  Fast Quantitative Susceptibility Mapping using 3D EPI and Total Generalized Variation.
  Neuroimage. 2015 May 1;111:622-30. doi: 10.1016/j.neuroimage.2015.02.041
  ```
  
  ----------------------------------

categories:
  - quantitative imaging
  - phase processing
icon: data:image/png;base64,
variables:
  cmake_version: "3.31.12"
  upstream_version: 1.0.0
  bet2_revision: adec315977486917d995ae2d1449f3efc616e2bc
  dcm2niix_version: "v1.0.20260724"
files:
- name: cmake
  url: https://github.com/Kitware/CMake/releases/download/v{{ context.cmake_version }}/cmake-{{ context.cmake_version }}-linux-x86_64.tar.gz
- name: dcm2niix_source
  url: https://github.com/rordenlab/dcm2niix/archive/refs/tags/{{ context.dcm2niix_version }}.tar.gz
- name: source
  url: https://www.neuroimaging.at/media/qsm/TGVQSM-plus.zip
  sha256: 70e6457c01346444d43c6ad31f5b03df10411aaaa9f50db5c13e9b3d1dd1594c
- name: bet2
  url: https://github.com/liangfu/bet2/archive/{{ context.bet2_revision }}.tar.gz
- name: miniconda
  url: https://repo.anaconda.com/miniconda/Miniconda2-4.6.14-Linux-x86_64.sh
