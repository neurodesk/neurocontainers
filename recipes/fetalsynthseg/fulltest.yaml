name: fetalsynthseg
version: 1.0.0
source_commit: 03c439edef02fc830e31a38169c5aa09ca98eeb4
default_timeout: 120

tests:
  - name: fetalsynthseg launcher available
    description: Verify the fetalsynthseg inference launcher is deployed on PATH.
    command: command -v fetalsynthseg
    expected_output_contains: fetalsynthseg
  - name: fetalsynthseg help
    description: Verify the inference entrypoint runs and prints its usage.
    command: fetalsynthseg --help
    expected_output_contains: ["--chkp_path", "--input", "--output", "--gpu"]
  - name: CPU framework and official checkpoint closure
    command: |
      set -eu
      python3 - <<'PY'
      from pathlib import Path
      import hashlib,importlib.metadata as md,subprocess
      import torch,monai,lightning,src.models.UnetModule as module
      assert md.version('torch').split('+')[0]=='2.1.2' and not torch.cuda.is_available()
      assert md.version('monai')=='1.3.0' and md.version('lightning')=='2.1.3'
      assert Path(module.__file__).resolve().is_relative_to('/opt/fetalsynthseg')
      p=Path('/opt/fetalsynthseg/weights/KISPI-all_fss.ckpt')
      assert hashlib.sha256(p.read_bytes()).hexdigest()=='d991edbb1295797f59973867ec3724ba6ebaddb44387f09da38bc5ab98b2fe52'
      subprocess.run(['python3','-m','pip','check'],check=True)
      print('Actual official FetalSynthSeg CPU/source/framework/checkpoint closure verified')
      PY
    expected_exit_code: 0
    expected_output_contains: "Actual official FetalSynthSeg CPU/source/framework/checkpoint closure verified"
    timeout: 120
  - name: Real trained fetal MRI tissue segmentation
    command: |
      set -eu
      python3 -u - <<'PY'
      from pathlib import Path
      import os,hashlib,tempfile,subprocess,time,signal
      import numpy as np
      import nibabel as nib
      root=Path('/opt/fetalsynthseg')
      source=root/'data/sub-sta30/anat/sub-sta30_rec-irtk_T2w.nii.gz'
      reference=root/'data/sub-sta30/anat/sub-sta30_rec-irtk_T2w_dseg.nii.gz'
      checkpoint=root/'weights/KISPI-all_fss.ckpt'
      def digest(p):
       h=hashlib.sha256()
       with p.open('rb') as f:
        for b in iter(lambda:f.read(1048576),b''):h.update(b)
       return h.hexdigest()
      before=[digest(p) for p in [source,reference,checkpoint]]
      with tempfile.TemporaryDirectory(prefix='fetal-inference-') as tmp:
       work=Path(tmp);out=work/'segmentation.nii.gz';home=work/'home';home.mkdir()
       env={**os.environ,'HOME':str(home),'MPLCONFIGDIR':str(work/'mpl'),'XDG_CACHE_HOME':str(work/'cache'),'OMP_NUM_THREADS':'2','MKL_NUM_THREADS':'2','CUDA_VISIBLE_DEVICES':'','PYTHONUNBUFFERED':'1'}
       start=time.monotonic();log_path=work/'inference.log'
       with log_path.open('w') as log:
        proc=subprocess.Popen(['fetalsynthseg','--chkp_path',str(checkpoint),'--input',str(source),'--output',str(out)],env=env,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
        try:
         while proc.poll() is None:
          elapsed=time.monotonic()-start
          assert elapsed<10800,'Real unmodified fetal inference exceeded3-hour CPU allowance'
          print(f'Official full fetal MRI inference running after{elapsed:.0f}s',flush=True)
          try:proc.wait(timeout=300)
          except subprocess.TimeoutExpired:pass
         assert proc.returncode==0,'Official CPU inference failed:\n'+'\n'.join(log_path.read_text(errors='replace').splitlines()[-100:])
        finally:
         try:os.killpg(proc.pid,signal.SIGTERM)
         except ProcessLookupError:pass
         if proc.poll() is None:
          try:proc.wait(timeout=15)
          except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);proc.wait(timeout=10)
       assert out.is_file() and out.stat().st_size>352
       image=nib.load(source);seg=nib.load(out);truth=nib.load(reference)
       data=seg.get_fdata();atlas=truth.get_fdata()
       assert seg.shape==image.shape==truth.shape and np.isfinite(data).all()
       assert np.isin(data,np.arange(8)).all(),'Segmentation contains invalid labels'
       labels=np.unique(data);assert len(labels)>=3 and np.count_nonzero(data)>0
       assert np.count_nonzero((data>0)&(atlas>0))>0
       # Written NIfTI affine precision, not a registration/clinical accuracy tolerance.
       bound=4*np.finfo(np.float32).eps*max(np.abs(image.affine).max(),1)
       np.testing.assert_allclose(seg.affine,image.affine,rtol=0,atol=bound)
       np.testing.assert_allclose(seg.header.get_zooms(),image.header.get_zooms(),rtol=0,atol=4*np.finfo(np.float32).eps*max(image.header.get_zooms()))
       assert [digest(p) for p in [source,reference,checkpoint]]==before
       print(f'Actual FetalSynthSeg trained CPU inference on full official fetal MRI verified in{time.monotonic()-start:.1f}s; shape{data.shape}, labels{labels.tolist()}, unchanged image/reference/checkpoint hashes')
      PY
    expected_exit_code: 0
    expected_output_contains: "Actual FetalSynthSeg trained CPU inference"
    timeout: 11000
