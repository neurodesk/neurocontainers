name: brainstemnavigator
version: 1.0.0
tests:
  - name: atlas inspection help
    command: brainstemnavigator --help
    expected_output_contains: user-supplied Brainstem Navigator
  - name: registration tools
    command: antsRegistration --version && command -v antsApplyTransforms
    expected_output_contains: antsApplyTransforms
  - name: synthetic mounted atlas inspection
    command: |-
      python - <<'PYTHON'
      import tempfile
      import subprocess
      from pathlib import Path
      import nibabel as nib
      import numpy as np
      with tempfile.TemporaryDirectory() as directory:
          path = Path(directory)
          nib.save(nib.Nifti1Image(np.ones((4, 5, 6), dtype=np.int16), np.eye(4)), path / 'synthetic-labels.nii.gz')
          subprocess.run(['brainstemnavigator', directory], check=True)
      PYTHON
    expected_output_contains: Validated 1 NIfTI images
  - name: rejects invalid user atlas
    command: |-
      python - <<'PYTHON'
      import tempfile
      import subprocess
      from pathlib import Path
      import nibabel as nib
      import numpy as np
      with tempfile.TemporaryDirectory() as directory:
          missing = subprocess.run(['brainstemnavigator', str(Path(directory) / 'missing')], capture_output=True, text=True)
          assert missing.returncode == 2 and 'existing directory' in missing.stderr
          empty = subprocess.run(['brainstemnavigator', directory], capture_output=True, text=True)
          assert empty.returncode == 2 and 'no NIfTI images' in empty.stderr
          data = np.ones((4, 5, 6), dtype=np.float32)
          data[0, 0, 0] = np.nan
          nib.save(nib.Nifti1Image(data, np.eye(4)), Path(directory) / 'invalid.nii.gz')
          invalid = subprocess.run(['brainstemnavigator', directory], capture_output=True, text=True)
          assert invalid.returncode == 2 and 'invalid volume' in invalid.stderr
      print('invalid atlases rejected')
      PYTHON
    expected_output_contains: invalid atlases rejected
