variables:
  cloudcompare_amd64_version: "2.13.2+git20240821+ds-4"
  cloudcompare_arm64_version: "2.13.2+git20240821+ds-4"
  package_version:
    try:
      - value: "{{ context.cloudcompare_amd64_version }}"
        condition: arch=="x86_64"
      - value: "{{ context.cloudcompare_arm64_version }}"
        condition: arch=="aarch64"

name: cloudcompare
version: "2.13.2"

description: 3D point-cloud and triangular mesh ICP registration, comparison, and longitudinal surface change detection for 3D total-body photography and wound tracking.

copyright:
  - license: GPL-2.0-or-later
    name: CloudCompare license
    url: https://github.com/CloudCompare/CloudCompare/blob/v{{ context.version }}/license.txt

architectures:
  - x86_64
  - aarch64

auto_update:
  method: sources
  container_version: cloudcompare-amd64
  local: []
  sources:
    - id: cloudcompare-amd64
      method: apt
      package: cloudcompare
      urls:
        - https://archive.ubuntu.com/ubuntu/dists/resolute/universe/binary-amd64/Packages.gz
        - https://archive.ubuntu.com/ubuntu/dists/resolute-updates/universe/binary-amd64/Packages.gz
        - https://security.ubuntu.com/ubuntu/dists/resolute-security/universe/binary-amd64/Packages.gz
      target:
        variable: cloudcompare_amd64_version
        fulltest_variable: cloudcompare_amd64_version
    - id: cloudcompare-arm64
      method: apt
      package: cloudcompare
      urls:
        - https://ports.ubuntu.com/ubuntu-ports/dists/resolute/universe/binary-arm64/Packages.gz
        - https://ports.ubuntu.com/ubuntu-ports/dists/resolute-updates/universe/binary-arm64/Packages.gz
        - https://ports.ubuntu.com/ubuntu-ports/dists/resolute-security/universe/binary-arm64/Packages.gz
      target:
        variable: cloudcompare_arm64_version
        fulltest_variable: cloudcompare_arm64_version

build:
  kind: neurodocker

  base-image: ubuntu:26.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive

    - install:
        - "cloudcompare={{ context.package_version }}"
        - libegl-mesa0
        - libgl1
        - libgl1-mesa-dri
        - libglx-mesa0
        - xauth
        - xvfb

    - run:
        # Download the exact APT-verified Ubuntu source package (.dsc, .orig.tar.*,
        # and .debian.tar.* with Ubuntu packaging/patches) directly into the image.
        - mkdir -p /opt/cloudcompare/share/src /opt/cloudcompare/share/licenses
        - "sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources"
        - apt-get update -qq
        - cd /opt/cloudcompare/share/src && apt-get source --download-only "cloudcompare={{ context.package_version }}"
        - "sed -i 's/^Types: deb deb-src$/Types: deb/' /etc/apt/sources.list.d/ubuntu.sources"
        - rm -rf /var/lib/apt/lists/*
        - install -m 0644 /usr/share/common-licenses/GPL-2 /opt/cloudcompare/share/licenses/GPL-2.0.txt
        - install -m 0644 {{ get_file("gpl_source_notice") }} /opt/cloudcompare/share/licenses/GPL-SOURCE-NOTICE.txt
        - chmod -R a+rX /opt/cloudcompare

files:
  - name: gpl_source_notice
    contents: |
      CloudCompare {{ context.version }} Container — License & Corresponding Source Notice
      ====================================================================================
      This container installs Ubuntu 26.04 (resolute) package:
        cloudcompare={{ context.package_version }}

      The exact APT-verified Ubuntu corresponding source package (including upstream
      orig tarball, .dsc descriptor, and Ubuntu/Debian packaging and patches) is
      bundled inside this image under /opt/cloudcompare/share/src/:
        - cloudcompare_{{ context.package_version }}.dsc
        - cloudcompare_*.orig.tar.*
        - cloudcompare_{{ context.package_version }}.debian.tar.*

      License notices are installed at /usr/share/doc/cloudcompare/copyright and
      /opt/cloudcompare/share/licenses/GPL-2.0.txt.

      The same Ubuntu source package can also be retrieved directly from Ubuntu's
      resolute archive with `apt-get source cloudcompare={{ context.package_version }}`
      (after enabling `deb-src` for `resolute`, `resolute-updates`, and
      `resolute-security`), or from https://archive.ubuntu.com/ubuntu/pool/universe/c/cloudcompare/.

deploy:
  bins:
    - CloudCompare
    - ccViewer

gui_apps:
  - name: "CloudCompare"
    exec: "CloudCompare"

domains:
  - microscopy
  - dermatology

categories:
  - "visualization"
  - "image registration"
  - "shape analysis"
  - "body"

readme: |-
  ----------------------------------
  ## cloudcompare/{{ context.version }} ##

  CloudCompare is a 3D point-cloud and triangular mesh processing suite
  supporting ICP registration, cloud-to-mesh distance mapping, and headless
  batch operations (`-SILENT`) for longitudinal 3D total-body photography
  (3D-TBP) and 3D wound surface tracking.

  ### Included Tools
  ```
  CloudCompare    Interactive 3D point-cloud/mesh GUI and headless batch CLI (-SILENT)
  ccViewer        Lightweight 3D viewer companion
  ```

  ### Examples
  ```
  ml cloudcompare/{{ context.version }}
  CloudCompare visit1.ply visit2.ply

  # Headless batch processing (under Xvfb when no X display is attached)
  xvfb-run -a CloudCompare -SILENT -O visit1.asc -C_EXPORT_FMT PLY -SAVE_CLOUDS
  ```

  In headless or software-rendered desktop environments, set
  `LIBGL_ALWAYS_SOFTWARE=1` if hardware OpenGL acceleration is unavailable.

  Documentation: https://www.danielgm.net/cc/
  Debian/Ubuntu copyright and license notices are installed at
  `/usr/share/doc/cloudcompare/copyright` and `/opt/cloudcompare/share/licenses/`.
  The exact Ubuntu source package (`.dsc`, `.orig.tar.*`, and `.debian.tar.*`
  including Debian/Ubuntu packaging and patches) is bundled under
  `/opt/cloudcompare/share/src/`.
  ----------------------------------

