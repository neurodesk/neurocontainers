name: uhcfire
version: 1.1.0
architectures:
- x86_64
icon: data:image/svg+xml;base64,
files:
- name: uhcfire.py
  filename: uhcfire.py
- name: make_dsir.py
  filename: make_dsir.py
- name: rigid2.py
  filename: rigid2.py
- name: smoke_test.py
  filename: smoke_test.py
- name: uhcfire
  contents: '#!/bin/sh

    cd /opt/code/python-ismrmrd-server

    exec python3 main.py -d uhcfire -r -H=0.0.0.0 -p=9002 "$@"

    '
- name: OpenReconLabel.json
  filename: OpenReconLabel.json
- name: README.md
  filename: README.md
variables:
  openrecon_server_commit: 33362f2139701fbf5ea855808a325eb59b7db2ae
  openrecon_python_tools_commit: 17fe6fbf1bb645112e2ad0023eb4f42afb36421e
  openrecon_siemens_commit: 055eefc09dfa77fbf11fff85979dea9ef2879ba5
  openrecon_ismrmrd_version: 1.14.2
  base_image_digest: sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc
  numpy_version: 1.26.4
  scipy_version: 1.13.1
auto_update:
  container_version: false
  method: sources
  local:
  - macros/openrecon
  sources:
  - id: base_image
    method: oci_digest
    image: ubuntu
    tag: '22.04'
    target:
      variable: base_image_digest
  - id: openrecon_ismrmrd
    method: github_release
    repo: ismrmrd/ismrmrd
    target:
      variable: openrecon_ismrmrd_version
      value: version
  - id: openrecon_siemens
    method: github_commit
    repo: ismrmrd/siemens_to_ismrmrd
    ref: HEAD
    target:
      variable: openrecon_siemens_commit
  - id: openrecon_python_tools
    method: github_commit
    repo: ismrmrd/ismrmrd-python-tools
    ref: HEAD
    target:
      variable: openrecon_python_tools_commit
  - id: openrecon_server
    method: github_commit
    repo: astewartau/python-ismrmrd-server
    ref: fix/ismrmrd-compatibility
    target:
      variable: openrecon_server_commit
  - id: numpy
    method: pypi
    package: numpy
    dependency: true
    target:
      variable: numpy_version
  - id: scipy
    method: pypi
    package: scipy
    dependency: true
    target:
      variable: scipy_version
build:
  kind: neurodocker
  base-image: ubuntu:22.04@{{ context.base_image_digest }}
  pkg-manager: apt
  directives:
  - environment:
      DEBIAN_FRONTEND: noninteractive
  - install: bzip2 ca-certificates git build-essential python3-pip python-is-python3
  - include: macros/openrecon/neurodocker.yaml
  - run:
    - python3 -m pip install numpy=={{ context.numpy_version }} scipy=={{ context.scipy_version }}
    - cp {{ get_file("uhcfire.py") }} /opt/code/python-ismrmrd-server/uhcfire.py
    - cp {{ get_file("make_dsir.py") }} /opt/code/python-ismrmrd-server/make_dsir.py
    - cp {{ get_file("rigid2.py") }} /opt/code/python-ismrmrd-server/rigid2.py
    - cp {{ get_file("smoke_test.py") }} /opt/code/python-ismrmrd-server/smoke_test.py
  - environment:
      UHC_DATA_DIR: /tmp/share/uhcfire
      PYTHONPATH: /opt/code/python-ismrmrd-server
  - run:
    - install -m 0755 {{ get_file("uhcfire") }} /usr/local/bin/uhcfire
  - run:
    - cp {{ get_file("OpenReconLabel.json") }} /opt/code/python-ismrmrd-server/OpenReconLabel.json
    - cp {{ get_file("README.md") }} /opt/code/python-ismrmrd-server/UHC_README.md
    - mkdir -p /tmp/share/uhcfire
    - chmod 1777 /tmp/share /tmp/share/uhcfire
    - python3 -m pip check
deploy:
  bins:
  - uhcfire
domains:
- neuroimaging
categories:
- image reconstruction
readme: 'UHC FIRE {{ context.version }} stores separate inversion-time acquisitions and computes dSIR,
  lSIR and aSIR for every short/long pair when the configured trigger TI arrives. Scanner defaults: expected
  TIs 300,500,778 ms; trigger 778 ms. Mount persistent storage at /tmp/share/uhcfire. See README.md for
  configuration.'
