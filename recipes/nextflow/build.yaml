name: nextflow
version: 26.10.7

copyright:
  - license: Apache-2.0
    url: https://github.com/nextflow-io/nextflow/blob/v{{ context.version }}/COPYING

architectures:
  - x86_64
  - aarch64

variables:
  upstream_version: "26.10.7"

auto_update:
  method: sources
  container_version: nextflow_dist
  sources:
    - id: nextflow_dist
      method: github_release_asset
      repo: nextflow-io/nextflow
      asset: nextflow-{version}-dist
      target:
        file: nextflow_dist
        variables:
          upstream_version: version

structured_readme:
  description: >-
    Nextflow is a workflow management system for scalable and reproducible
    scientific data analysis pipelines across local, HPC, and cloud environments.
    This container bundles the self-contained Nextflow distribution with OpenJDK 21.
  example: |
    # Check Nextflow and Java runtime versions
    nextflow -version

    # Run a Nextflow pipeline
    nextflow run main.nf
  documentation: https://www.nextflow.io/docs/latest/
  citation: |-
    Di Tommaso, P., Chatzou, M., Floden, E. W., Barja, P. P., Palumbo, E., &
    Notredame, C. (2017). Nextflow enables reproducible computational workflows.
    Nature Biotechnology, 35(4), 316-319. https://doi.org/10.1038/nbt.3820

files:
  - name: nextflow_dist
    url: https://github.com/nextflow-io/nextflow/releases/download/v26.10.7/nextflow-26.10.7-dist
    sha256: c54cd4b7be058e8954180b378a8efa6d61085bc433d7d9b06ec2cad2ad6580a6
  - name: nextflow-wrapper
    executable: true
    contents: |-
      #!/usr/bin/env bash
      set -euo pipefail

      is_writable_dir() {
        local dir="$1"
        [ -n "${dir}" ] && [ -d "${dir}" ] || return 1
        local probe
        probe="$(mktemp "${dir}/.writable.XXXXXX" 2>/dev/null)" || return 1
        rm -f "${probe}"
      }

      if [ -z "${NXF_HOME:-}" ]; then
        if is_writable_dir "${HOME:-}"; then
          export NXF_HOME="${HOME}/.nextflow"
        else
          export NXF_HOME="${XDG_CACHE_HOME:-${TMPDIR:-/tmp}/nextflow-$(id -u)}/nextflow"
        fi
      fi
      mkdir -p "${NXF_HOME}"

      if ! is_writable_dir "${HOME:-}"; then
        export HOME="${NXF_HOME}"
      fi

      exec /opt/nextflow/nextflow "$@"

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        NXF_VER: "{{ context.version }}"
    - install:
        - ca-certificates
        - curl
        - git
        - graphviz
        - openjdk-21-jre-headless
        - procps
    - run:
        - install -d -m 0755 /opt/nextflow
        - install -m 0755 {{ get_file("nextflow_dist") }} /opt/nextflow/nextflow
        - install -m 0755 {{ get_file("nextflow-wrapper") }} /usr/local/bin/nextflow

deploy:
  path: []
  bins:
    - nextflow

domains:
  - microscopy
  - neuroimaging
  - datascience
  - dermatology

categories:
  - workflows
  - programming

icon: data:image/svg+xml;base64,
