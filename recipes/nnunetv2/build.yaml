readme: |-
  ----------------------------------
  ## nnunetv2/{{ context.version }} ##

  nnU-Net v2 (CPU PyTorch {{ context.torch_version }} build, code-only — no model
  weights baked) is a self-configuring deep-learning segmentation framework for
  2D and 3D biomedical images including dermoscopy, OCT, HFUS, and histopathology.

  ### Included CLI Tools
  ```
  nnUNetv2_plan_and_preprocess   Fingerprint, plan, and preprocess a dataset
  nnUNetv2_train                 Train a 2D/3D nnU-Net v2 fold
  nnUNetv2_predict               Run segmentation inference
  nnUNetv2_find_best_configuration  Select best configuration/ensemble
  nnUNetv2_evaluate_folder       Evaluate predictions against ground truth
  ```

  ### Example
  ```
  ml nnunetv2/{{ context.version }}
  export nnUNet_raw=/data/nnUNet_raw
  export nnUNet_preprocessed=/data/nnUNet_preprocessed
  export nnUNet_results=/data/nnUNet_results
  nnUNetv2_plan_and_preprocess -d 501 --verify_dataset_integrity -c 2d
  ```

  Documentation: https://github.com/MIC-DKFZ/nnUNet/tree/v{{ context.upstream_version }}/documentation
  License texts (`NNUNETV2-LICENSE.txt`, `CC3D-LGPL-3.0.txt`, `GPL-3.0.txt`) are
  installed under `/opt/nnunetv2/share/licenses/`, and the matching
  `connected-components-3d` LGPL-3.0 corresponding source archive is bundled
  under `/opt/nnunetv2/share/src/`.
  ----------------------------------

