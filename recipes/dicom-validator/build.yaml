name: dicom-validator
version: 0.9.0

description: Validate DICOM IOD conformance (including Supplement 221 Dermoscopic Photography and Supplement 145 WSI) against PS3.3 definitions, paired with highdicom for DICOM segmentation, SR, and annotation workflows.

copyright:
  - license: MIT
    name: dicom-validator license
    url: https://github.com/pydicom/dicom-validator/blob/v{{ context.upstream_version }}/LICENSE
  - license: MIT
    name: highdicom license
    url: https://github.com/ImagingDataCommons/highdicom/blob/v{{ context.highdicom_version }}/LICENSE
  - license: MIT
    name: pyjpegls license
    url: https://github.com/pydicom/pyjpegls/blob/v{{ context.pyjpegls_version }}/license.txt
  - license: BSD-3-Clause
    name: CharLS license
    url: https://github.com/team-charls/charls/blob/{{ context.charls_commit }}/LICENSE.md

architectures:
  - x86_64
  - aarch64

variables:
  upstream_version: "0.9.0"
  highdicom_version: "0.29.0"
  # Keep pyjpegls_version and charls_commit aligned; inspect pydicom/pyjpegls
  # submodule ref when updating pyjpegls.
  pyjpegls_version: "1.5.1"
  charls_commit: "36dd3307e070d8fbc765c3ba890b7e681046fa39"

auto_update:
  method: sources
  container_version: dicom-validator
  sources:
    - id: dicom-validator
      method: pypi
      package: dicom-validator
      target:
        variable: upstream_version
        fulltest_variable: upstream_version
    - id: highdicom
      method: pypi
      package: highdicom
      dependency: true
      target:
        variable: highdicom_version
        fulltest_variable: highdicom_version

build:
  kind: neurodocker

  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        PIP_NO_CACHE_DIR: "1"
        PATH: /opt/dicom-validator/wrappers:/opt/dicom-validator/bin:$PATH

    - install:
        - ca-certificates
        - python3
        - python3-venv

    - run:
        - python3 -m venv /opt/dicom-validator
        - /opt/dicom-validator/bin/python -m pip install --no-cache-dir "dicom-validator=={{ context.upstream_version }}" "highdicom=={{ context.highdicom_version }}" "pyjpegls=={{ context.pyjpegls_version }}"
        - /opt/dicom-validator/bin/python -m pip check
        - mkdir -p /opt/dicom-validator/wrappers /opt/dicom-validator/share/licenses
        - install -m 0755 {{ get_file("validate_iods_wrapper") }} /opt/dicom-validator/wrappers/validate_iods
        - install -m 0755 {{ get_file("dump_dcm_info_wrapper") }} /opt/dicom-validator/wrappers/dump_dcm_info
        - install -m 0644 /opt/dicom-validator/lib/python*/site-packages/dicom_validator-{{ context.upstream_version }}.dist-info/licenses/LICENSE /opt/dicom-validator/share/licenses/DICOM-VALIDATOR-LICENSE.txt
        - install -m 0644 /opt/dicom-validator/lib/python*/site-packages/highdicom-{{ context.highdicom_version }}.dist-info/licenses/LICENSE /opt/dicom-validator/share/licenses/HIGHDICOM-LICENSE.txt
        - install -m 0644 {{ get_file("pyjpegls_license") }} /opt/dicom-validator/share/licenses/PYJPEGLS-LICENSE.txt
        - install -m 0644 {{ get_file("charls_license") }} /opt/dicom-validator/share/licenses/CHARLS-LICENSE.md
        - chmod -R a+rX /opt/dicom-validator
        - rm -rf /root/.cache/pip

files:
  - name: pyjpegls_license
    url: https://raw.githubusercontent.com/pydicom/pyjpegls/v{{ context.pyjpegls_version }}/license.txt
  - name: charls_license
    url: https://raw.githubusercontent.com/team-charls/charls/{{ context.charls_commit }}/LICENSE.md
  - name: validate_iods_wrapper
    executable: true
    contents: |
      #!/opt/dicom-validator/bin/python
      """Run validate_iods with a non-/home, private default standard cache."""

      from __future__ import annotations

      import os
      import shutil
      import signal
      import subprocess
      import sys
      import tempfile


      def has_standard_or_help_flag(argv: list[str]) -> bool:
          for arg in argv:
              if arg == "--":
                  return False
              if arg in ("--standard-path", "-src", "-h", "--help"):
                  return True
              if arg.startswith(("--standard-path=", "-src=")):
                  return True
          return False


      def main() -> int:
          target = "/opt/dicom-validator/bin/validate_iods"
          argv = sys.argv[1:]
          if has_standard_or_help_flag(argv):
              os.execv(target, [target, *argv])

          env_std = os.environ.get("DICOM_VALIDATOR_STANDARD_PATH", "")
          if env_std:
              os.execv(target, [target, "--standard-path", env_std, *argv])

          tmp_std: str | None = None
          proc: subprocess.Popen[bytes] | None = None
          received_signal: int | None = None
          pending_signal: int | None = None

          def handle_signal(signum: int, _frame: object) -> None:
              nonlocal received_signal, pending_signal
              received_signal = signum
              if proc is None:
                  pending_signal = signum
              elif proc.poll() is None:
                  proc.send_signal(signum)

          try:
              # Install signal handlers BEFORE creating tmp_std so an early
              # SIGHUP/SIGINT/SIGTERM can never terminate the wrapper and leak scratch,
              # while preserving inherited SIG_IGN (e.g. under nohup or background &).
              for sig in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP):
                  if signal.getsignal(sig) != signal.SIG_IGN:
                      signal.signal(sig, handle_signal)
              if received_signal is not None:
                  return 128 + received_signal

              tmp_std = tempfile.mkdtemp(prefix="dicom-validator.")
              if received_signal is not None:
                  return 128 + received_signal
              proc = subprocess.Popen([target, "--standard-path", tmp_std, *argv])
              sig_to_replay, pending_signal = pending_signal, None
              if sig_to_replay is not None and proc.poll() is None:
                  proc.send_signal(sig_to_replay)
              while True:
                  try:
                      rc = proc.wait()
                      break
                  except InterruptedError:
                      continue
              if received_signal is not None:
                  return 128 + received_signal
              return 128 - rc if rc < 0 else rc
          finally:
              if tmp_std is not None:
                  shutil.rmtree(tmp_std, ignore_errors=True)


      if __name__ == "__main__":
          raise SystemExit(main())
