deploy:
  bins:
    - validate_iods
    - dump_dcm_info

domains:
  - microscopy
  - dermatology

categories:
  - "optical imaging"
  - "quality control"
  - "data organisation"

readme: |-
  ----------------------------------
  ## dicom-validator/{{ context.version }} ##

  `dicom-validator` ({{ context.upstream_version }}) validates DICOM files
  against DICOM PS3.3/PS3.4/PS3.6 standard IOD definitions — including
  Supplement 221 Dermoscopic Photography (`1.2.840.10008.5.1.4.1.1.77.1.7`) and
  Supplement 145 VL Whole Slide Microscopy (`1.2.840.10008.5.1.4.1.1.77.1.6`).
  This container also includes `highdicom` ({{ context.highdicom_version }})
  for DICOM segmentation, structured reporting (SR), and microscopy/clinical
  annotation workflows (note: `highdicom` does not provide dedicated image
  constructors for the Dermoscopic Photography or WSI image IODs).

  ### Included CLI Tools
  ```
  validate_iods    Validate DICOM files against PS3.3 IOD definitions
  dump_dcm_info    Display DICOM tags annotated with standard descriptions
  ```

  ### Example
  ```
  ml dicom-validator/{{ context.version }}
  validate_iods --standard-path /path/to/dicom-cache --edition 2026d dermoscopy.dcm
  ```

  NEMA DICOM standard files are not bundled in the image. By default, when
  neither `--standard-path` nor `DICOM_VALIDATOR_STANDARD_PATH` is given, the
  wrappers create an atomic private (`0700`) temporary directory so validation
  neither touches `/home` nor trusts a shared `/tmp` cache. For persistent or offline HPC runs, point `--standard-path` or
  `DICOM_VALIDATOR_STANDARD_PATH` at a trusted bind-mounted cache containing
  `editions.json`, all three DocBook XML parts (`<edition>/docbook/part03.xml`,
  `part04.xml`, `part06.xml`), and the JSON files generated by the matching
  `dicom-validator` version (`<edition>/json/`), then pass `--edition local`.

  Note: Upstream describes `dicom-validator` as beta-stage software.
  Documentation: https://dicom-validator.readthedocs.io
  License texts (including `dicom-validator`, `highdicom`, `pyjpegls`, and
  `CharLS`) are installed under `/opt/dicom-validator/share/licenses`.
  ----------------------------------

