                  proc.send_signal(signum)

          try:
              # Install signal handlers BEFORE creating tmp_std so an early
              # SIGHUP/SIGINT/SIGTERM can never terminate the wrapper and leak scratch,
              # while preserving inherited SIG_IGN (e.g. under nohup or background &).
              for sig in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP):
                  if signal.getsignal(sig) != signal.SIG_IGN:
                      signal.signal(sig, handle_signal)
              if received_signal is not None:
                  return 128 + received_signal

              tmp_std = tempfile.mkdtemp(prefix="dicom-validator.")
              if received_signal is not None:
                  return 128 + received_signal
              proc = subprocess.Popen([target, "--standard-path", tmp_std, *argv])
              sig_to_replay, pending_signal = pending_signal, None
              if sig_to_replay is not None and proc.poll() is None:
