name: deepisles
version: "1.1.0"

variables:
  upstream_version: "1.1"
  atlas_sha256: d24f9d17dc62643779330bebfd80dea28821413f0a56c8396f6a26a8fbb632ca
  weights_sha256: 74935bf9511dcb9f556c0a6ab7f6674f2da84214cab748c9fb986f33b6f3b3e7
  weights_md5: be5b6dfcd66b55c2e6dc6db9a5880f7f
  hdbet_fold0_md5: 46ed703cae7611c4f3a60d7b9d8fd666

copyright:
  - license: Apache-2.0
    url: https://github.com/ezequieldlrosa/DeepIsles/blob/main/LICENSE
  - license: CC-BY-4.0
    url: https://zenodo.org/records/3379848

architectures:
  - x86_64

structured_readme:
  description: DeepISLES is an out-of-the-box software tool for processing MRI scans and segmenting ischemic stroke lesions, developed in collaboration with leading teams from the ISLES'22 MICCAI Challenge. Includes weights.
  example: deepisles --dwi dwi.nii.gz --adc adc.nii.gz --flair flair.nii.gz -o results --fast
