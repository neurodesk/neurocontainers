    de la Rosa, E., Reyes, M., Liew, S. L., Hutton, A., Wiest, R., Kaesmacher, J., ... & Wiestler, B. (2025).
    DeepISLES: A clinically validated ischemic stroke segmentation model from the ISLES'22 challenge
    Nature Communications

    Hernandez Petzsche, M. R., de la Rosa, E., Hanning, U., Wiest, R., Valenzuela, W., Reyes, M., ... & Kirschke, J. S. (2022).
    ISLES 2022: A multi-center magnetic resonance imaging stroke lesion segmentation dataset.
    Scientific Data, 9(1), 762

readme: |-
  ----------------------------------
  ## deepisles/{{ context.version }} ##

  DeepISLES is an out-of-the-box software tool for processing MRI scans and segmenting ischemic stroke lesions, developed in collaboration with leading teams from the ISLES'22 MICCAI Challenge. Includes weights.

  Example:
  ```
  deepisles --dwi dwi.nii.gz --adc adc.nii.gz --flair flair.nii.gz -o results
  ```

  The lesion mask is written to `results/lesion_msk.nii.gz`. Add `--skull-strip`
  if the inputs still contain the skull, and `--save-team-outputs` or
  `--results-mni` for the per-model and MNI-space results. MNI results require
  `--flair`. Use a fresh output directory for each run.

  The bundled MNI FLAIR atlas is licensed CC-BY-4.0. If used, cite Schirmer,
  Markus D., et al. "Spatial signature of white matter hyperintensities in
  stroke patients." Frontiers in Neurology 10 (2019), 208.
  https://zenodo.org/records/3379848

  Without a GPU, inference runs on the CPU. The full FLAIR ensemble includes a
  CUDA-only model, so CPU runs with `--flair` need `--fast`, which uses only the
  ISLES'22 winning model (SEALS).

  More documentation can be found here: https://github.com/ezequieldlrosa/DeepIsles

  Citation:
  ```
  de la Rosa, E., Reyes, M., Liew, S. L., Hutton, A., Wiest, R., Kaesmacher, J., ... & Wiestler, B. (2025).
  DeepISLES: A clinically validated ischemic stroke segmentation model from the ISLES'22 challenge
  Nature Communications

  Hernandez Petzsche, M. R., de la Rosa, E., Hanning, U., Wiest, R., Valenzuela, W., Reyes, M., ... & Kirschke, J. S. (2022).
  ISLES 2022: A multi-center magnetic resonance imaging stroke lesion segmentation dataset.
  Scientific Data, 9(1), 762
  ```

  To run container outside of this environment: ml deepisles/{{ context.version }}

  ----------------------------------

auto_update:
  method: sources
  container_version: deepisles
  sources:
    - id: deepisles
      method: github_release
      repo: ezequieldlrosa/DeepIsles
      target:
        variable: upstream_version
        fulltest_variable: upstream_version
    - id: mni_atlas
      method: http_digest
      url: https://zenodo.org/records/3379848/files/caa_flair_in_mni_template_smooth_brain_intres.nii.gz?download=1
      dependency: true
      target:
        variable: atlas_sha256

build:
  kind: neurodocker

  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - file:
        name: weights.7z
        url: https://zenodo.org/records/14026715/files/stroke_ensemble_weights.7z?download=1
        sha256: "{{ context.weights_sha256 }}"
    - run:
        - echo "{{ context.weights_md5 }}  {{ get_file("weights.7z") }}" | md5sum --check --status

    - install: git libgl1

    - group:
        - workdir: /opt

        - run:
            - git clone --depth 1 --branch v{{ context.upstream_version }} https://github.com/ezequieldlrosa/DeepIsles.git

        - workdir: /opt/DeepIsles

        - environment:
            CONDA_DIR: /opt/miniconda
            PATH: /opt/miniconda/bin:${PATH}

        - install: bzip2 ca-certificates curl

        - file:
            name: miniconda.sh
            url: https://repo.continuum.io/miniconda/Miniconda3-py38_23.11.0-2-Linux-x86_64.sh

        - run:
            # Install dependencies.
            - export PATH="/opt/miniconda/bin:$PATH"
            - bash "{{ get_file("miniconda.sh") }}" -b -p /opt/miniconda
            # Prefer packages in conda-forge
            - conda config --system --prepend channels conda-forge
            # Packages in lower-priority channels not considered if a package with the same
            # name exists in a higher priority channel. Can dramatically speed up installations.
            # Conda recommends this as a default
            # https://docs.conda.io/projects/conda/en/latest/user-guide/tasks/manage-channels.html
            - conda config --set channel_priority strict
            - conda config --system --set auto_update_conda false
            - conda config --system --set show_channel_urls true
            # Enable `conda activate`
            - conda init bash
            # Clean up
            - sync && conda clean --all --yes && sync
            - rm -rf ~/.cache/pip/*

        - run:
            - conda config --set channel_priority flexible

        - run:
            - . /root/.bashrc
            - conda create --name deepisles python=3.8.* pip=23.3.1 -y
            - conda activate deepisles
            - conda install pytorch=1.11 torchvision=0.12 cudatoolkit=11.3 -c pytorch -c conda-forge
            - conda install -c conda-forge openslide-python libffi=3.2.1

        - run:
            - . /root/.bashrc
            - conda activate deepisles
            - conda install -y -c conda-forge gdcm

        - run:
            - . /root/.bashrc
            - conda activate deepisles
            - pip install --no-deps dicom2nifti==2.4.8
            - pip install --no-deps nnunet==1.7.0

        - run:
            - . /root/.bashrc
            - conda activate deepisles
            - pip install -e ./src/SEALS/ --no-build-isolation --no-deps

        - run:
            - . /root/.bashrc
            - conda activate deepisles
            - pip install -e ./src/FACTORIZER/model/factorizer/

        - install: build-essential cmake ninja-build

        - run:
            - . /root/.bashrc
            - conda activate deepisles
            - pip install -r requirements.txt
            - pip install -e ./src/HD-BET

        - run:
            - . /root/.bashrc
            - conda activate deepisles
            - python -c "import dicom2nifti; import openslide"

        - environment:
            CONDA_DEFAULT_ENV: deepisles
            PATH: /opt/miniconda/envs/deepisles/bin:$PATH

        - run:
            - echo "conda activate deepisles" >> ~/.bashrc

    - install: p7zip-full wget

    - run:
        - 7za x {{ get_file("weights.7z") }}

    - file:
        name: hdbet_fold0.model
        url: https://zenodo.org/record/2540695/files/0.model?download=1

    - file:
        name: flair_mni.nii.gz
        url: https://zenodo.org/records/3379848/files/caa_flair_in_mni_template_smooth_brain_intres.nii.gz?download=1
        sha256: "{{ context.atlas_sha256 }}"

    - run:
        - python {{ get_file("patch_runtime.py") }} /opt/DeepIsles
        - mkdir -p /opt/DeepIsles/data/atlas
        - cp {{ get_file("flair_mni.nii.gz") }} /opt/DeepIsles/data/atlas/flair_mni.nii.gz
        # HD-BET downloads its parameters into the home directory on first use,
        # which is not available at runtime; ship the fast-mode fold instead.
        - sed -i "s|^folder_with_parameter_files = .*|folder_with_parameter_files = '/opt/hd-bet_params'|" /opt/DeepIsles/src/HD-BET/HD_BET/paths.py
        - grep -q "^folder_with_parameter_files = '/opt/hd-bet_params'" /opt/DeepIsles/src/HD-BET/HD_BET/paths.py
        - mkdir -p /opt/hd-bet_params
        - echo "{{ context.hdbet_fold0_md5 }}  {{ get_file("hdbet_fold0.model") }}" | md5sum --check --status
        - cp {{ get_file("hdbet_fold0.model") }} /opt/hd-bet_params/0.model
        - cp {{ get_file("deepisles.py") }} /opt/DeepIsles/deepisles.py
        - cp {{ get_file("deepisles") }} /usr/local/bin/deepisles
        - chmod 0755 /usr/local/bin/deepisles
        - chmod -R a+rX /opt/DeepIsles /opt/hd-bet_params

    - deploy:
        path: []
        bins:
          - deepisles
          - python

    - test:
        name: Simple Deploy Bins/Path Test
        builtin: test_deploy.sh

files:
  - name: patch_runtime.py
    filename: patch_runtime.py
  - name: deepisles.py
    filename: deepisles.py
  - name: deepisles
    contents: |
      #!/bin/sh
      exec /opt/miniconda/envs/deepisles/bin/python /opt/DeepIsles/deepisles.py "$@"

categories:
  - structural imaging
  - image segmentation

icon: data:image/png;base64,
