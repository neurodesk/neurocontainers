name: alpaca
version: 1.1.4

variables:
  upstream_version: 1.1.4
  upstream_tag: 1.1.4
  itkr_commit: c80f2ba3429551c4a752fb6d79079fcb45680094
  antsrcore_commit: 9a875df253d48e700d0cdf6be14bd60eba62fb6f
  antsr_commit: 325a3036c60fefd5967fb64a8bad887ef2ba3db7
  extrantsr_commit: 428830eadd90b997549eab1ae8900e8acc295329
  oasis_commit: 7ba21f83546f3f2bcf5c1699225f3f6a2e3ed14f
  mimosa_commit: 9f67d1a5698f45ead4f8b4cfd48e5823c0e55f00

copyright:
  - license: MIT
    url: https://github.com/hufengling/ALPaCA/blob/main/LICENSE.md

architectures:
  - x86_64

auto_update:
  method: sources
  container_version: models_1_5
  sources:
    - id: models_1_5
      method: github_release_asset
      repo: hufengling/ALPaCA
      asset: models_1_5.zip
      version_regex: 'v?(?P<version>\d+\.\d+\.\d+)'
      target:
        file: models_1_5_zip
        variables:
          upstream_version: version
          upstream_tag: tag
    - id: models_6_10
      method: github_release_asset
      repo: hufengling/ALPaCA
      asset: models_6_10.zip
      version_regex: 'v?(?P<version>\d+\.\d+\.\d+)'
      target:
        file: models_6_10_zip
    - id: itkr
      dependency: true
      method: github_commit
      repo: ANTsX/ITKR
      ref: HEAD
      target:
        variable: itkr_commit
    - id: antsrcore
      dependency: true
      method: github_commit
      repo: ANTsX/ANTsRCore
      ref: HEAD
      target:
        variable: antsrcore_commit
    - id: antsr
      dependency: true
      method: github_commit
      repo: ANTsX/ANTsR
      ref: HEAD
      target:
        variable: antsr_commit
    - id: extrantsr
      dependency: true
      method: github_commit
      repo: muschellij2/extrantsr
      ref: HEAD
      target:
        variable: extrantsr_commit
    - id: oasis
      dependency: true
      method: github_commit
      repo: neuroconductor/oasis
      ref: HEAD
      target:
        variable: oasis_commit
    - id: mimosa
      dependency: true
      method: github_commit
      repo: neuroconductor-devel/mimosa
      ref: HEAD
      target:
        variable: mimosa_commit

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive

    # fslr and extrantsr call FSL (bet, fslmaths) during preprocessing.
    - template:
        name: fsl
        version: 6.0.7.18

    - install:
        - build-essential
        - cmake
        - git
        - unzip
        - wget
        - ca-certificates
        - gnupg
        - libcurl4-openssl-dev
        - libssl-dev
        - libxml2-dev
        - libfontconfig1-dev
        - libfreetype6-dev
        - libharfbuzz-dev
        - libfribidi-dev
        - libpng-dev
        - libjpeg-dev
        - libtiff5-dev
        - zlib1g-dev
        - libbz2-dev
        - liblzma-dev

    - environment:
        R_REPOS: https://packagemanager.posit.co/cran/__linux__/noble/2026-09-28
        R_DEFAULT_INTERNET_TIMEOUT: "1800"

    - run:
        - wget -qO- https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc > /etc/apt/trusted.gpg.d/cran_ubuntu_key.asc
        - echo "deb https://cloud.r-project.org/bin/linux/ubuntu noble-cran40/" > /etc/apt/sources.list.d/cran-r40.list
        - apt-get update -qq
        - apt-get install -y --no-install-recommends r-base r-base-dev
        - rm -rf /var/lib/apt/lists/*

    # Posit Package Manager serves prebuilt binaries only when the user agent names the R version.
    - run:
        - R --slave -e "options(repos = c(CRAN = Sys.getenv('R_REPOS')), HTTPUserAgent = sprintf('R/%s R (%s)', getRversion(), paste(getRversion(), R.version['platform'], R.version['arch'], R.version['os'])), timeout = as.integer(Sys.getenv('R_DEFAULT_INTERNET_TIMEOUT')), Ncpus = parallel::detectCores()); pkgs <- c('Rcpp', 'RcppEigen', 'magrittr', 'dplyr', 'ggplot2', 'purrr', 'reshape2', 'reticulate', 'stringr', 'tibble', 'rsvd', 'GPArotation', 'glmnet', 'oro.nifti', 'RNifti', 'neurobase', 'fslr', 'WhiteStripe', 'matrixStats', 'R.matlab', 'R.utils', 'plyr', 'stapler', 'mmand', 'rlist', 'Rfast', 'torch'); install.packages(pkgs); missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]; if (length(missing)) stop('CRAN install failed for ', paste(missing, collapse = ', '))"
        - R --slave -e "options(timeout = as.integer(Sys.getenv('R_DEFAULT_INTERNET_TIMEOUT'))); torch::install_torch()"
        - Rscript -e "library(torch); print(torch_ones(2) + 1)"

    - workdir: /tmp/rbuild
    - run:
        - git clone https://github.com/ANTsX/ITKR.git && git -C ITKR checkout {{ context.itkr_commit }} && R CMD INSTALL ITKR
        - git clone https://github.com/ANTsX/ANTsRCore.git && git -C ANTsRCore checkout {{ context.antsrcore_commit }} && R CMD INSTALL ANTsRCore
        - git clone https://github.com/ANTsX/ANTsR.git && git -C ANTsR checkout {{ context.antsr_commit }} && R CMD INSTALL ANTsR
        - git clone https://github.com/muschellij2/extrantsr.git && git -C extrantsr checkout {{ context.extrantsr_commit }} && R CMD INSTALL extrantsr
        - git clone https://github.com/neuroconductor/oasis.git && git -C oasis checkout {{ context.oasis_commit }} && R CMD INSTALL oasis
        - git clone https://github.com/neuroconductor-devel/mimosa.git && git -C mimosa checkout {{ context.mimosa_commit }} && R CMD INSTALL mimosa
        - cd / && rm -rf /tmp/rbuild /tmp/Rtmp*

    - workdir: /tmp/rbuild
    - run:
        - git clone --depth 1 --branch {{ context.upstream_tag }} https://github.com/hufengling/ALPaCA.git
        - mkdir -p ALPaCA/inst/extdata
        - unzip -j -o {{ get_file("models_1_5_zip") }} '*.pt' -d ALPaCA/inst/extdata
        - unzip -j -o {{ get_file("models_6_10_zip") }} '*.pt' -d ALPaCA/inst/extdata
        - test "$(ls ALPaCA/inst/extdata/autoencoder_*.pt ALPaCA/inst/extdata/predictor_*.pt | wc -l)" -eq 20
        - R CMD INSTALL ALPaCA
        - cd / && rm -rf /tmp/rbuild /tmp/Rtmp*

    - workdir: /
    - run:
        - install -m 0755 {{ get_file("alpaca") }} /usr/local/bin/alpaca

deploy:
  bins:
    - alpaca
    - R
    - Rscript

files:
  - name: alpaca
    filename: alpaca
  - name: models_1_5_zip
    url: https://github.com/hufengling/ALPaCA/releases/download/1.1.4/models_1_5.zip
    sha256: dfaa8746e5c3c56cc9653452bd3f09fef399d4667058410078605ec5140648ca
  - name: models_6_10_zip
    url: https://github.com/hufengling/ALPaCA/releases/download/1.1.4/models_6_10.zip
    sha256: 85e56051bed034121413a6d7ba35806abe5eee59641a551cbe9f9ee196763512

categories:
  - image segmentation
  - structural imaging
  - machine learning

readme: |
  ----------------------------------
  ## alpaca/{{ context.version }} ##
  ALPaCA (Automated Lesion, PRL, and CVS Analysis) segments multiple sclerosis
  lesions and classifies each lesion candidate for a paramagnetic rim (PRL) and
  a central vein sign (CVS). It uses a multi-contrast 3D convolutional neural
  network on T1-weighted, FLAIR, T2*-weighted EPI magnitude and phase images.
  Lesion candidates come from MIMoSA. The container runs on CPU.

  Run the full pipeline:
  ```
  alpaca --t1 t1.nii.gz --flair flair.nii.gz --epi epi.nii.gz --phase phase.nii.gz --output alpaca_out --cores 4
  ```

  The output directory holds the preprocessed images in EPI space, the MIMoSA
  probability map (`prob.nii.gz`), labeled lesion candidates, `alpaca_mask.nii.gz`,
  `predictions.csv` and `probabilities.csv`. Values in `alpaca_mask.nii.gz`:
  1 lesion, 3 lesion and PRL, 5 lesion and CVS, 7 lesion, PRL and CVS.
  Run `alpaca --help` for thresholds, a custom brain mask and raw probability maps.

  The R functions are also available directly:
  ```
  Rscript -e 'library(ALPaCA); images <- preprocess_images("t1.nii.gz", "flair.nii.gz", "epi.nii.gz", "phase.nii.gz", "out"); make_predictions(images, output_dir = "out")'
  ```

  Documentation: https://github.com/hufengling/ALPaCA

  Citation:
  ```
  Hu F, Ren Z, Chen L, Valcarcel AM, Dworkin J, et al., Shinohara RT. Automated
  segmentation of multiple sclerosis lesions, paramagnetic rims, and central vein
  sign on MRI provides reliable diagnostic biomarkers. Imaging Neuroscience. 2025;3.
  https://doi.org/10.1162/IMAG.a.932
  ```

  To run container outside of this environment: ml alpaca/{{ context.version }}
  ----------------------------------

