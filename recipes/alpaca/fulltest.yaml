name: alpaca
version: 1.1.4
default_timeout: 900
env:
  HOME: /nonexistent

test_data:
  output_dir: test_output

setup:
  script: |
    set -e
    mkdir -p ${output_dir}

tests:
  - name: launcher documents the pipeline
    command: alpaca --help
    expected_output_contains:
      - --t1
      - --phase
      - 7 lesion+PRL+CVS

  - name: launcher rejects incomplete input
    command: alpaca --t1 t1.nii.gz --output out 2>&1; echo "exit=$?"
    expected_output_contains:
      - "missing required arguments: --flair --epi --phase"
      - exit=1

  - name: package exports the pipeline functions
    command: |
      Rscript -e 'library(ALPaCA); cat(sort(getNamespaceExports("ALPaCA")), sep = "\n")'
    expected_output_contains:
      - make_predictions
      - preprocess_images
      - split_confluent

  - name: all ten cross-validation models are installed
    command: |
      Rscript -e 'd <- system.file("extdata", package = "ALPaCA"); f <- file.path(d, c(sprintf("autoencoder_%d.pt", 1:10), sprintf("predictor_%d.pt", 1:10))); stopifnot(all(file.size(f) > 0)); cat(length(f), "models\n")'
    expected_output_contains: 20 models

  - name: FSL is visible to fslr for brain extraction
    command: Rscript -e 'library(fslr); stopifnot(have.fsl()); cat(file.exists(file.path(fsldir(), "bin", "bet")), "\n")'
    expected_output_contains: "TRUE"

  - name: CNN predicts lesion, PRL and CVS on synthetic candidates
    command: |
      Rscript - <<'RS'
      suppressPackageStartupMessages({ library(ALPaCA); library(ANTsR) })
      set.seed(1)
      out <- "${output_dir}/predict"
      dir.create(out, recursive = TRUE, showWarnings = FALSE)
      dims <- c(48, 48, 48)
      labels <- array(0, dims)
      labels[10:16, 10:16, 10:16] <- 1
      labels[30:37, 28:35, 30:36] <- 2
      eroded <- array(0, dims)
      eroded[12:14, 12:14, 12:14] <- 1
      eroded[32:35, 30:33, 32:34] <- 2
      noise <- function(boost) as.antsImage(array(rnorm(prod(dims)), dims) + boost * (labels > 0))
      result <- make_predictions(
        t1 = noise(-1), flair = noise(2), epi = noise(1), phase = noise(0),
        labeled_candidates = as.antsImage(labels),
        eroded_candidates = as.antsImage(eroded),
        output_dir = out, n_patches = 3, model_ids = 1:2
      )
      probs <- as.matrix(result$probabilities[, 1:3])
      stopifnot(nrow(probs) == 2, all(is.finite(probs)), all(probs >= 0 & probs <= 1))
      cat("candidates", nrow(probs), "\n")
      RS
    expected_output_contains:
      - "Using device: cpu"
      - candidates 2
    validate:
      - output_exists: ${output_dir}/predict/alpaca_mask.nii.gz
      - output_exists: ${output_dir}/predict/predictions.csv
      - output_exists: ${output_dir}/predict/probabilities.csv
