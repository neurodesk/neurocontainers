name: cellpose
version: "4.2.1.1"

copyright:
  - license: BSD-3-Clause
    url: https://github.com/MouseLand/cellpose/blob/v{{ context.version }}/LICENSE

architectures:
  - x86_64
  - aarch64

variables:
  cellpose_version: "4.2.1.1"
  venv_path: /opt/cellpose-{{ context.version }}/venv
  pip_version: "26.1.1"
  setuptools_version: "82.0.1"
  wheel_version: "0.47.0"
  torch_version: "2.14.1"
  torchvision_version: "0.29.1"
  pytorch_wheel_channel:
    try:
      - value: cu126
        condition: arch == "x86_64"
      - value: cpu
        condition: arch == "aarch64"

auto_update:
  method: sources
  container_version: cellpose
  sources:
    - id: cellpose
      method: pypi
      package: cellpose
      target:
        variable: cellpose_version
    - id: torch
      dependency: true
      method: webpage
      url: https://download.pytorch.org/whl/cu126/torch/
      version_regex: 'torch-(?P<version>\d+\.\d+\.\d+)(?:\+|%2B)cu126-cp312-cp312-manylinux_2_28_x86_64\.whl'
      target:
        variable: torch_version
        fulltest_variable: torch_version
    - id: torchvision
      dependency: true
      method: webpage
      url: https://download.pytorch.org/whl/cu126/torchvision/
      version_regex: 'torchvision-(?P<version>\d+\.\d+\.\d+)(?:\+|%2B)cu126-cp312-cp312-manylinux_2_28_x86_64\.whl'
      target:
        variable: torchvision_version
        fulltest_variable: torchvision_version

structured_readme:
  description: >-
    Cellpose 4 (Cellpose-SAM) is a generalist deep-learning algorithm and
    interactive Qt6 GUI for 2D and 3D cellular and nuclear segmentation in
    microscopy images. This container includes CUDA-enabled PyTorch on x86_64
    (CPU wheels on ARM64) and covers both 2D (`cellpose`) and 3D Z-stack
    (`cellpose-3d` / `cellpose --Zstack`) workflows.
  example: |
    # Launch the Cellpose GUI (2D)
    cellpose

    # Launch the Cellpose 3D Z-stack GUI
    cellpose-3d

    # Run headless batch segmentation via CLI
    cellpose --dir /path/to/images --pretrained_model cpsam --save_tif --use_gpu
  documentation: https://cellpose.readthedocs.io/en/latest/
  citation: |-
    Pachitariu, M., Rariden, M., & Stringer, C. (2025). Cellpose-SAM:
    superhuman generalization for cellular segmentation. bioRxiv.
    https://doi.org/10.1101/2025.04.28.651001

    Stringer, C., Wang, T., Michaelos, M., & Pachitariu, M. (2021).
    Cellpose: a generalist algorithm for cellular segmentation. Nature Methods,
    18(1), 100-106. https://doi.org/10.1038/s41592-020-01018-x

files:
  - name: cellpose-wrapper
    executable: true
    contents: |-
      #!/usr/bin/env bash
      set -euo pipefail

      cache_root="${CELLPOSE_CACHE_DIR:-${TMPDIR:-/tmp}/cellpose-$(id -u)}"
      export XDG_CACHE_HOME="${XDG_CACHE_HOME:-${cache_root}/cache}"
      export XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-${cache_root}/config}"
      export XDG_DATA_HOME="${XDG_DATA_HOME:-${cache_root}/data}"
      export CELLPOSE_LOCAL_MODELS_PATH="${CELLPOSE_LOCAL_MODELS_PATH:-${cache_root}/models}"
      export TORCH_HOME="${TORCH_HOME:-${cache_root}/torch}"
      export HF_HOME="${HF_HOME:-${cache_root}/huggingface}"
      export MPLCONFIGDIR="${MPLCONFIGDIR:-${cache_root}/matplotlib}"
      export NUMBA_CACHE_DIR="${NUMBA_CACHE_DIR:-${cache_root}/numba}"

      mkdir -p \
        "${XDG_CACHE_HOME}" \
        "${XDG_CONFIG_HOME}" \
        "${XDG_DATA_HOME}" \
        "${CELLPOSE_LOCAL_MODELS_PATH}" \
        "${TORCH_HOME}" \
        "${HF_HOME}" \
        "${MPLCONFIGDIR}" \
        "${NUMBA_CACHE_DIR}"

      is_writable_dir() {
        local dir="$1"
        [ -n "${dir}" ] && [ -d "${dir}" ] || return 1
        local probe
        probe="$(mktemp "${dir}/.writable.XXXXXX" 2>/dev/null)" || return 1
        rm -f "${probe}"
      }

      if ! is_writable_dir "${HOME:-}"; then
        export HOME="${cache_root}"
      fi
      mkdir -p "${HOME}/.cellpose"

      launcher="$(basename "$0")"
      if [ "${launcher}" = "cellpose-3d" ]; then
        exec "{{ context.venv_path }}/bin/cellpose" --Zstack "$@"
      else
        exec "{{ context.venv_path }}/bin/cellpose" "$@"
      fi

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        PYTHONNOUSERSITE: "1"
        PATH: /usr/local/bin:{{ context.venv_path }}/bin:$PATH
    - install:
        - ca-certificates
        - fonts-dejavu-core
        - libdbus-1-3
        - libegl1
        - libfontconfig1
        - libfreetype6
        - libgl1
        - libgl1-mesa-dri
        - libglib2.0-0
        - libice6
        - libopengl0
        - libsm6
        - libx11-6
        - libx11-xcb1
        - libxcb-cursor0
        - libxcb-glx0
        - libxcb-icccm4
        - libxcb-image0
        - libxcb-keysyms1
        - libxcb-randr0
        - libxcb-render-util0
        - libxcb-render0
        - libxcb-shape0
        - libxcb-shm0
        - libxcb-sync1
        - libxcb-util1
        - libxcb-xfixes0
        - libxcb-xinerama0
        - libxcb-xkb1
        - libxcb1
        - libxext6
        - libxi6
        - libxkbcommon-x11-0
        - libxkbcommon0
        - libxrandr2
        - libxrender1
        - libxtst6
        - python3
        - python3-venv
        - xauth
        - xvfb
    - run:
        - python3 -m venv "{{ context.venv_path }}"
        - . "{{ context.venv_path }}/bin/activate"
        - python -m pip install --no-cache-dir --upgrade pip=={{ context.pip_version }} setuptools=={{ context.setuptools_version }} wheel=={{ context.wheel_version }}
        - python -m pip install --no-cache-dir torch=={{ context.torch_version }} torchvision=={{ context.torchvision_version }} --index-url https://download.pytorch.org/whl/{{ context.pytorch_wheel_channel }}
        - python -m pip install --no-cache-dir "cellpose[gui]=={{ context.cellpose_version }}"
        - python -m pip check
        - install -m 0755 {{ get_file("cellpose-wrapper") }} /usr/local/bin/cellpose
        - ln -sf cellpose /usr/local/bin/cellpose-3d

deploy:
  path: []
  bins:
    - cellpose
    - cellpose-3d

gui_apps:
  - name: "Cellpose"
    exec: "cellpose"
  - name: "Cellpose 3D"
    exec: "cellpose-3d"

domains:
  - microscopy
  - dermatology

categories:
  - image segmentation
  - machine learning
  - visualization

icon: data:image/png;base64,
