name: bcbtoolkit
version: 5.4.1
copyright:
  - license: BSD-3-Clause
    url: https://github.com/chrisfoulon/BCBToolKit?tab=BSD-3-Clause-1-ov-file
architectures:
  - x86_64
structured_readme:
  description: |-
    Python edition of the Brain Connectivity and Behaviour toolkit for lesion
    analysis, including Tractotron, disconnectome maps and AnaCOM2. Includes
    NumPy, NiBabel, the upstream data bundle and a browser-based interface.
    The supplementary HCP-1065 probabilistic tract atlas is available at
    /opt/BCBToolKit/Tools/HCP1065/prob.

    ANTs and dcm2niix are bundled for the registration, cortical thickness,
    template, MPM and diffusion workflows. FSL and ICA-AROMA (resting-state,
    enantiomorphic filling, topup/eddy) are not; install them with
    `bcbtoolkit install fsl` / `install aroma` into BCBTOOLKIT_HOME, or
    configure their paths through the environment or Settings.
  example: |-
    # Disconnectome maps from MNI-space lesion masks
    bcbtoolkit disconnectome -l /data/lesions -r /data/disco_out

    # Tractotron with the bundled atlas
    bcbtoolkit tractotron -l /data/lesions -r /data/tractotron_out

    # Tractotron with the supplementary HCP-1065 atlas
    bcbtoolkit tractotron -l /data/lesions_2mm -t /opt/BCBToolKit/Tools/HCP1065/prob -r /data/tractotron_out

    # Browser interface (open the printed URL)
    bcbtoolkit gui --no-browser --port 8765

    # The historical GUI launcher name also opens the new interface
    BCBToolKit.sh
  documentation: https://storage.googleapis.com/bcblabweb/index.html
  citation: |-
    Foulon C. et al. (2018) Advanced lesion symptom mapping analyses and implementation as BCBtoolkit. GigaScience 7, 1–17.
    Thiebaut de Schotten M. et al. (2014) Damage to white matter pathways in subacute and chronic spatial neglect: a group study and 2 single-case studies with complete virtual "in vivo" tractography dissection. Cereb Cortex 24, 691–706.
    Thiebaut de Schotten M. et al. (2011) Atlasing location, asymmetry and inter-subject variability of white matter tracts in the human brain with MR diffusion tractography. Neuroimage 54, 49–59.
    Thiebaut de Schotten M. et al. (2012) Monkey to human comparative anatomy of the frontal lobe association tracts. Cortex 48, 82–96.
    Catani M. et al. (2012) Short frontal lobe connections of the human brain. Cortex 48, 273–291.
readme: |-
  ## bcbtoolkit/{{ context.version }}

  Python edition of the Brain Connectivity and Behaviour toolkit for lesion
  analysis, including Tractotron, disconnectome maps and AnaCOM2. Includes
  NumPy, NiBabel, the upstream data bundle and a browser-based interface.
  The supplementary HCP-1065 probabilistic tract atlas is available at
  /opt/BCBToolKit/Tools/HCP1065/prob.

  ANTs and dcm2niix are bundled for the registration, cortical thickness,
  template, MPM and diffusion workflows. FSL and ICA-AROMA (resting-state,
  enantiomorphic filling, topup/eddy) are not; install them with
  `bcbtoolkit install fsl` / `install aroma` into BCBTOOLKIT_HOME, or
  configure their paths through the environment or Settings.

  ```bash
  # Disconnectome maps from MNI-space lesion masks
  bcbtoolkit disconnectome -l /data/lesions -r /data/disco_out

  # Tractotron with the bundled atlas
  bcbtoolkit tractotron -l /data/lesions -r /data/tractotron_out

  # Tractotron with the supplementary HCP-1065 atlas
  bcbtoolkit tractotron -l /data/lesions_2mm -t /opt/BCBToolKit/Tools/HCP1065/prob -r /data/tractotron_out

  # Browser interface (open the printed URL)
  bcbtoolkit gui --no-browser --port 8765

  # The historical GUI launcher name also opens the new interface
  BCBToolKit.sh
  ```

  This Python release replaces the Java GUI and the run_disco.sh and
  tractotron_cli.sh wrappers. Use the disconnectome and tractotron
  subcommands above; output directories now use -r. The old wrappers'
  BIDS discovery flags are not supported by the new command line interface.

  Application code and bundled data live under /opt/BCBToolKit. Settings
  and optional downloaded resources default to ${TMPDIR:-/tmp}/bcbtoolkit-<uid>.
  Set BCBTOOLKIT_HOME to a writable persistent directory to retain them.
  The bundled manual is /opt/BCBToolKit/BCBToolKit_manual.pdf.

  More documentation: https://storage.googleapis.com/bcblabweb/index.html

  Citation:
  Foulon C. et al. (2018) Advanced lesion symptom mapping analyses and implementation as BCBtoolkit. GigaScience 7, 1–17.
  Thiebaut de Schotten M. et al. (2014) Damage to white matter pathways in subacute and chronic spatial neglect: a group study and 2 single-case studies with complete virtual "in vivo" tractography dissection. Cereb Cortex 24, 691–706.
  Thiebaut de Schotten M. et al. (2011) Atlasing location, asymmetry and inter-subject variability of white matter tracts in the human brain with MR diffusion tractography. Neuroimage 54, 49–59.
  Thiebaut de Schotten M. et al. (2012) Monkey to human comparative anatomy of the frontal lobe association tracts. Cortex 48, 82–96.
  Catani M. et al. (2012) Short frontal lobe connections of the human brain. Cortex 48, 273–291.

files:
  - name: bcbtoolkit_archive
    url: "https://www.dropbox.com/scl/fi/cgolrdgqjxuqx4rxcgt70/BCBToolKit_{{ context.version }}_standalone.zip?rlkey=8wit9z2wlvjcvfh14iwek0sdz&dl=1"
    sha256: 3e51605a19991ea84c7c480a739cdb8b12d4be6c3c36536522424cd2b3f9b119
  - name: bcbtoolkit_launcher
    contents: |
      #!/bin/sh
      set -eu

      # Keep settings and optional downloads writable without requiring a home mount.
      export BCBTOOLKIT_HOME="${BCBTOOLKIT_HOME:-${TMPDIR:-/tmp}/bcbtoolkit-$(id -u)}"
      export PYTHONPATH="/opt/BCBToolKit${PYTHONPATH:+:$PYTHONPATH}"
      export PYTHONNOUSERSITE=1

      exec /usr/bin/python3 -m bcbtoolkit "$@"
  - name: hcp_atlas_zip
    url: https://github.com/data-others/atlas/releases/download/hcp1065/hcp1065_prob_coverage_nifti.zip
  - name: ants_zip
    url: https://github.com/ANTsX/ANTs/releases/download/v{{ context.ants_version }}/ants-{{ context.ants_version }}-ubuntu-24.04-X64-gcc.zip
  - name: dcm2niix_lnx_zip
    url: https://github.com/rordenlab/dcm2niix/releases/download/v1.0.20260724/dcm2niix_lnx.zip
    sha256: 2916a7bc64511eb20fb976a994799183cc1bfdd03395bf5d8edef54a58dee06f

auto_update:
  container_version: binary
  method: sources
  sources:
    - id: binary
      method: http_digest
      # Dropbox's file-ID URL stays valid when the displayed filename changes.
      url: https://www.dropbox.com/scl/fi/cgolrdgqjxuqx4rxcgt70?rlkey=8wit9z2wlvjcvfh14iwek0sdz&dl=1
      version_member: BCBToolKit_standalone/bcbtoolkit/__init__.py
      version_regex: '__version__ = "(?P<version>\d+\.\d+\.\d+)"'
      target:
        file: bcbtoolkit_archive
        variables:
          upstream_version: version
    - id: ants
      dependency: true
      method: github_release
      repo: ANTsX/ANTs
      target:
        variable: ants_version
    - id: dcm2niix
      dependency: true
      method: github_release_asset
      repo: rordenlab/dcm2niix
      asset: dcm2niix_lnx.zip
      target:
        file: dcm2niix_lnx_zip

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        PYTHONPATH: /opt/BCBToolKit
        PYTHONNOUSERSITE: "1"
        BCBTOOLKIT_DATA: /opt/BCBToolKit/data
    - install:
        - ca-certificates
        - python3
        - python3-numpy
        - python3-nibabel
        - python3-tk
        - unzip
    # ANTs (normalisation, cortical thickness, template) and dcm2niix (MPM,
    # diffusion) are found by the toolkit on PATH/ANTSPATH.
    - run:
        - unzip -q {{ get_file("ants_zip") }} -d /opt
        - test -x /opt/ants-{{ context.ants_version }}/bin/antsRegistration
        - mkdir -p /opt/dcm2niix
        - unzip -q {{ get_file("dcm2niix_lnx_zip") }} -d /opt/dcm2niix
        - chmod 0755 /opt/dcm2niix/dcm2niix
    - environment:
        ANTSPATH: /opt/ants-{{ context.ants_version }}/bin/
        PATH: /opt/ants-{{ context.ants_version }}/bin:/opt/dcm2niix:$PATH
    - run:
        - unzip -q {{ get_file("bcbtoolkit_archive") }} -d /opt
        - mv /opt/BCBToolKit_standalone /opt/BCBToolKit
        - mkdir -p /opt/BCBToolKit/Tools/HCP1065
        - unzip -q {{ get_file("hcp_atlas_zip") }} -d /opt/BCBToolKit/Tools/HCP1065
        - cp {{ get_file("bcbtoolkit_launcher") }} /usr/local/bin/bcbtoolkit
        - chmod 0755 /usr/local/bin/bcbtoolkit
        - ln -s /usr/local/bin/bcbtoolkit /usr/local/bin/BCBToolKit.sh
        - chown -R root:root /opt/BCBToolKit
        - chmod -R a+rX /opt/BCBToolKit

deploy:
  bins:
    - bcbtoolkit
    - BCBToolKit.sh
categories:
  - structural imaging
icon: data:image/png;base64,
variables:
  upstream_version: 5.4.1
  ants_version: 2.6.5
