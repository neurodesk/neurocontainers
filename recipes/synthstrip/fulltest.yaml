- name: Conform then strip
  description: Test conforming image before skull-stripping
  command: |
    nib-conform ${t1w} test_output/t1w_preconform.nii.gz --out-shape 256 256 256 --voxel-size 1 1 1 -f && \
    mri_synthstrip -i test_output/t1w_preconform.nii.gz -o test_output/t1w_preconform_stripped.nii.gz -m test_output/t1w_preconform_mask.nii.gz 2>&1
  validate:
  - output_exists: ${output_dir}/t1w_preconform.nii.gz
  - output_exists: ${output_dir}/t1w_preconform_stripped.nii.gz
  - output_exists: ${output_dir}/t1w_preconform_mask.nii.gz
  timeout: 900
- name: Strip then analyze
  description: Test skull-stripping followed by nib-stats analysis
  command: |
    mri_synthstrip -i ${t1w} -m test_output/t1w_strip_analyze_mask.nii.gz 2>&1 && \
    nib-stats -V --units mm3 test_output/t1w_strip_analyze_mask.nii.gz && \
    nib-ls -s test_output/t1w_strip_analyze_mask.nii.gz
  expected_exit_code: 0
  timeout: 600
- name: Compare T1w and T2 masks
  description: Compare brain masks from T1w and T2 modalities
  command: |
    mri_synthstrip -i ${t1w} -m test_output/t1w_modality_compare.nii.gz 2>&1 && \
    mri_synthstrip -i ${t2} -m test_output/t2_modality_compare.nii.gz 2>&1 && \
    python3 -c "import nibabel as nib; import numpy as np; \
      t1_mask = nib.load('test_output/t1w_modality_compare.nii.gz').get_fdata(); \
      t2_mask = nib.load('test_output/t2_modality_compare.nii.gz').get_fdata(); \
      t1_vol = np.sum(t1_mask > 0); \
      t2_vol = np.sum(t2_mask > 0); \
      print(f'T1w mask volume: {t1_vol} voxels'); \
      print(f'T2 mask volume: {t2_vol} voxels')"
  expected_output_contains: mask volume
  timeout: 1200
- name: Reproducibility check
  description: Verify running synthstrip twice produces identical results
  command: |
    mri_synthstrip -i ${t1w} -m test_output/t1w_repro_run1.nii.gz 2>&1 && \
    mri_synthstrip -i ${t1w} -m test_output/t1w_repro_run2.nii.gz 2>&1 && \
    python3 -c "
    import nibabel as nib, numpy as np
    run1 = nib.load('test_output/t1w_repro_run1.nii.gz').get_fdata()
    run2 = nib.load('test_output/t1w_repro_run2.nii.gz').get_fdata()
    np.testing.assert_array_equal(run1,run2)
    print('Results are reproducible: runs are identical')
    "
  expected_output_contains: reproducible
  timeout: 1200
- name: Pinned CPU runtime and dependency closure
  command: |
    python3 -m pip check
    python3 - <<'PYTHON'
    import torch
    from importlib.metadata import version
    assert version('torch').split('+')[0]=='2.2.2'
    assert torch.ones(3,device='cpu').sum().item()==3
    print('SynthStrip torch2.2.2 and native CPU dependency closure passed')
    PYTHON
  expected_exit_code: 0
  expected_output_contains:
  - No broken requirements found
  - SynthStrip torch2.2.2 and native CPU dependency closure passed
- name: All-voxel trained-model image and mask consistency
  description: Check actual default, no-CSF and T2 trained model outputs against every original voxel and binary mask with
    only output storage precision allowance, exact voxel spacing, NIfTI affine precision, and unchanged inputs/both checkpoints.
    Existing scientific thresholds remain unchanged; no extra model invocation.
  command: |
    python3 - <<'PYTHON'
    import hashlib
    import json
    from pathlib import Path
    import nibabel as nib
    import numpy as np

    root=Path('${output_dir}')
    for input_path,image_name,mask_name in [
        ('${t1w}','t1w_stripped_with_mask.nii.gz','t1w_brain_mask.nii.gz'),
        ('${t1w}','t1w_no_csf.nii.gz','t1w_no_csf_mask.nii.gz'),
        ('${t2}','t2_stripped.nii.gz','t2_mask.nii.gz')]:
        source=nib.load(input_path);image=nib.load(root/image_name);mask=nib.load(root/mask_name)
        data=source.get_fdata();stripped=image.get_fdata();binary=mask.get_fdata()
        assert data.shape==stripped.shape==binary.shape
        assert np.isfinite(stripped).all() and np.isfinite(binary).all()
        assert np.isin(binary,[0,1]).all()
        assert np.count_nonzero(binary)>1000 and np.count_nonzero(binary==0)>1000
        fill=min(float(data.min()),0.0)
        expected=np.where(binary!=0,data,fill)
        # Account only for the written NIfTI's integer scaling or float32 rounding.
        dtype=image.get_data_dtype()
        quantization=0.5*abs(float(image.dataobj.slope)) if np.issubdtype(dtype,np.integer) else 0.0
        roundoff=4*np.finfo(np.float32).eps*np.maximum(1,np.abs(expected))
        assert np.all(np.abs(stripped-expected)<=quantization+roundoff),(image_name,float(np.max(np.abs(stripped-expected))),quantization)
        for result in [image,mask]:
            precision=4*np.finfo(np.float32).eps*max(1,float(np.max(np.abs(source.affine))))
            np.testing.assert_allclose(result.affine,source.affine,rtol=0,atol=precision)
            np.testing.assert_array_equal(result.header.get_zooms(),source.header.get_zooms())
        print(image_name,'every voxel matches the actual binary-mask/fill operation',int(np.count_nonzero(binary)))
    hashes=json.loads((root/'synthstrip-original-hashes.json').read_text())
    assert all(hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest for path,digest in hashes.items())
    print('Actual default/no-CSF/T2 SynthStrip outputs match every masked voxel and preserve physical geometry, source images and both trained checkpoints')
    PYTHON
  expected_exit_code: 0
  expected_output_contains: Actual default/no-CSF/T2 SynthStrip outputs match every masked voxel and preserve physical geometry,
    source images and both trained checkpoints
  timeout: 120
