name: pypet2bids
version: 1.6.0

description: Convert source PET imaging (DICOM and ECAT) and blood data to the Brain Imaging Data Structure (BIDS).

copyright:
  - license: MIT
    name: PET2BIDS license
    url: https://github.com/openneuropet/PET2BIDS/blob/main/LICENSE
  - license: BSD-2-Clause
    name: dcm2niix license
    url: https://github.com/rordenlab/dcm2niix/blob/master/license.txt

architectures:
  - x86_64
  - aarch64

variables:
  upstream_version: "1.6.0"
  dcm2niix_tag: "v1.0.20261029"

auto_update:
  method: sources
  container_version: pypet2bids
  sources:
    - id: pypet2bids
      method: pypi
      package: pypet2bids
      target:
        variable: upstream_version
        fulltest_variable: upstream_version
    - id: dcm2niix
      method: github_release
      repo: rordenlab/dcm2niix
      dependency: true
      target:
        variable: dcm2niix_tag
        value: tag
        fulltest_variable: dcm2niix_tag

build:
  kind: neurodocker

  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        PIP_NO_CACHE_DIR: "1"
        PET2BIDS_TELEMETRY_ENABLED: "false"
        PATH: /opt/pypet2bids/bin:/opt/dcm2niix-{{ context.dcm2niix_tag }}/bin:$PATH

    - install:
        - pigz
        - python3
        - python3-venv

    - run:
        - apt-get update -qq
        - apt-get install -y -q --no-install-recommends cmake g++ make zlib1g-dev
        - mkdir -p /tmp/dcm2niix-src/build
        - tar -xz -C /tmp/dcm2niix-src --strip-components 1 -f {{ get_file("dcm2niix_source") }}
        - cmake -S /tmp/dcm2niix-src/console -B /tmp/dcm2niix-src/build -DCMAKE_INSTALL_PREFIX=/opt/dcm2niix-{{ context.dcm2niix_tag }}
        - cmake --build /tmp/dcm2niix-src/build -j "$(nproc)"
        - cmake --install /tmp/dcm2niix-src/build
        - chmod -R a+rX /opt/dcm2niix-{{ context.dcm2niix_tag }}
        - rm -rf /tmp/dcm2niix-src
        - apt-get purge -y --auto-remove cmake g++ make zlib1g-dev
        - rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*

    - run:
        - python3 -m venv /opt/pypet2bids
        - /opt/pypet2bids/bin/python -m pip install --no-cache-dir "pypet2bids=={{ context.upstream_version }}"
        - chmod -R a+rX /opt/pypet2bids
        - rm -rf /root/.cache/pip

files:
  - name: dcm2niix_source
    url: https://github.com/rordenlab/dcm2niix/archive/refs/tags/{{ context.dcm2niix_tag }}.tar.gz

deploy:
  bins:
    - dcm2niix
    - dcm2niix4pet
    - ecatpet2bids
    - convert-pmod-to-blood
    - ispet
    - updatepetjsonfromdicom
    - updatepetjsonfromecat
    - updatepetjson
    - ecatheaderupdate

domains:
  - neuroimaging

categories:
  - "molecular imaging"
  - "data organisation"
  - "bids apps"

readme: |-
  ----------------------------------
  ## pypet2bids/{{ context.version }} ##

  pypet2bids (OpenNeuroPET/PET2BIDS) converts source Positron Emission Tomography
  (PET) imaging data (DICOM and ECAT) and blood radioactivity measurements into
  the Brain Imaging Data Structure (BIDS). It bundles a modern `dcm2niix`
  ({{ context.dcm2niix_tag }}) so DICOM-to-BIDS conversion works out of the box.

  ### Included CLI Tools
  ```
  dcm2niix4pet                 Convert PET DICOMs to BIDS NIfTI + JSON via dcm2niix
  ecatpet2bids                 Convert ECAT7 PET data to BIDS NIfTI + JSON
  convert-pmod-to-blood        Convert PMOD blood (.bld) files to BIDS TSV + JSON
  ispet                        Inspect files/directories for PET DICOM or ECAT data
  updatepetjson                Update a PET BIDS JSON sidecar from args or spreadsheet
  updatepetjsonfromdicom       Populate PET JSON sidecar fields from a DICOM header
  updatepetjsonfromecat        Populate PET JSON sidecar fields from an ECAT header
  ecatheaderupdate             Update fields in an ECAT file header
  dcm2niix                     DICOM to NIfTI converter ({{ context.dcm2niix_tag }})
  ```

  ### Example
  ```
  ml pypet2bids/{{ context.version }}
  dcm2niix4pet /path/to/pet_dicoms -d /path/to/bids_output
  ```

  Telemetry is disabled by default inside the container (`PET2BIDS_TELEMETRY_ENABLED=false`)
  for offline and HPC compatibility.

  Documentation: https://pet2bids.readthedocs.io
  Source: https://github.com/openneuropet/PET2BIDS

  ### Citation
  ```
  Galassi A, Norgaard M, Gonzalez-Escamilla G, Svarer C, Rorden C, Matheson GJ, Knudsen GM, Innis RB, Ganz M, Eierud C, Bilgel M, Pernet C. PET2BIDS: a library for converting Positron Emission Tomography data to BIDS. Journal of Open Source Software. 2024;9(100):6067. doi:10.21105/joss.06067

  Li X, Morgan PS, Ashburner J, Smith J, Rorden C. The first step for neuroimaging data analysis: DICOM to NIfTI conversion. J Neurosci Methods. 2016;264:47-56. doi:10.1016/j.jneumeth.2016.03.001
  ```
  ----------------------------------

