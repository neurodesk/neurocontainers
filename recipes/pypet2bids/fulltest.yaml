name: pypet2bids
version: 1.6.0
upstream_version: "1.6.0"
dcm2niix_tag: "v1.0.20261029"

tests:
  - name: deployed binaries available on PATH
    description: Verify all deployed pypet2bids and dcm2niix CLI entrypoints resolve on PATH.
    command: |
      for cmd in dcm2niix dcm2niix4pet ecatpet2bids convert-pmod-to-blood ispet updatepetjsonfromdicom updatepetjsonfromecat updatepetjson ecatheaderupdate; do
        command -v "$cmd" || exit 1
      done
    expected_output_contains: "dcm2niix4pet"

  - name: pypet2bids package version matches recipe
    description: Verify installed pypet2bids distribution metadata matches upstream_version.
    command: /opt/pypet2bids/bin/python -c "import importlib.metadata as md, pypet2bids; print(md.version('pypet2bids'))"
    expected_output_contains: "${upstream_version}"

  - name: dcm2niix version matches pinned tag
    description: Verify bundled dcm2niix binary runs and matches dcm2niix_tag.
    command: dcm2niix --version 2>&1 || true
    expected_output_contains: "${dcm2niix_tag}"

  - name: dcm2niix4pet discovers bundled dcm2niix
    description: Verify pypet2bids resolves the bundled dcm2niix executable from PATH without relying on HOME.
    command: /opt/pypet2bids/bin/python -c "from pypet2bids.dcm2niix4pet import Dcm2niix4PET; p = Dcm2niix4PET.check_posix(); assert p and 'dcm2niix' in str(p), p; print(p)"
    expected_output_contains: "/opt/dcm2niix-${dcm2niix_tag}/bin/dcm2niix"

  - name: dcm2niix4pet help output
    description: Verify dcm2niix4pet CLI starts cleanly and reports usage.
    command: dcm2niix4pet --help
    expected_output_contains: "usage: dcm2niix4pet"

  - name: ecatpet2bids help output
    description: Verify ecatpet2bids CLI starts cleanly and reports usage.
    command: ecatpet2bids --help
    expected_output_contains: "usage: ecatpet2bids"

  - name: convert-pmod-to-blood help output
    description: Verify convert-pmod-to-blood CLI starts cleanly and reports usage.
    command: convert-pmod-to-blood --help
    expected_output_contains: "usage: convert-pmod-to-blood"

  - name: ispet help output
    description: Verify ispet CLI starts cleanly and reports usage.
    command: ispet --help
    expected_output_contains: "usage: ispet"

  - name: updatepetjson functional test
    description: Create a synthetic PET JSON sidecar in a temporary directory and update it via updatepetjson.
    command: |
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      cat > "$tmpdir/sub-01_pet.json" <<'EOF'
      {
        "Manufacturer": "Siemens",
        "TimeZero": "12:00:00",
        "FrameTimesStart": [0, 60, 120],
        "FrameDuration": [60, 60, 60]
      }
      EOF
      updatepetjson -j "$tmpdir/sub-01_pet.json" -k TracerName=FDG InjectedRadioactivity=185.0 InjectedRadioactivityUnits=MBq
      /opt/pypet2bids/bin/python -c "
      import json, sys
      data = json.load(open(sys.argv[1]))
      assert data['TracerName'] == 'FDG', data
      assert float(data['InjectedRadioactivity']) == 185.0, data
      assert data['InjectedRadioactivityUnits'] == 'MBq', data
      print('updatepetjson ok:', data['TracerName'], data['InjectedRadioactivity'], data['InjectedRadioactivityUnits'])
      " "$tmpdir/sub-01_pet.json"
    expected_output_contains: "updatepetjson ok: FDG 185.0 MBq"

  - name: convert-pmod-to-blood functional test
    description: Convert synthetic PMOD whole-blood, plasma, and parent-fraction .bld files to BIDS blood TSV and JSON.
    command: |
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      mkdir -p "$tmpdir/sub-01/pet"
      printf 'time[seconds]\twhole_blood[kBq/cc]\n0.0\t0.0\n30.0\t12.5\n60.0\t45.0\n120.0\t22.0\n' > "$tmpdir/whole_blood.bld"
      printf 'time[seconds]\tparent_fraction[1/1]\n0.0\t1.0\n30.0\t0.95\n60.0\t0.85\n120.0\t0.70\n' > "$tmpdir/parent_fraction.bld"
      printf 'time[seconds]\tplasma[kBq/cc]\n0.0\t0.0\n30.0\t15.0\n60.0\t52.0\n120.0\t26.0\n' > "$tmpdir/plasma.bld"
      printf 'M\nM\nM\n' | convert-pmod-to-blood \
        --whole-blood-path "$tmpdir/whole_blood.bld" \
        --parent-fraction-path "$tmpdir/parent_fraction.bld" \
        --plasma-activity-path "$tmpdir/plasma.bld" \
        --output-path "$tmpdir/sub-01/pet"
      tsv="$(find "$tmpdir/sub-01/pet" -maxdepth 1 -name '*_blood.tsv' -print -quit)"
      jsn="$(find "$tmpdir/sub-01/pet" -maxdepth 1 -name '*_blood.json' -print -quit)"
      test -f "$tsv"
      test -f "$jsn"
      head -n 2 "$tsv"
    expected_output_contains: "whole_blood_radioactivity"
