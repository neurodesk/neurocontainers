name: romeo
version: 4.9.0

variables:
  compilemri_version: 4.9.0
  julia_version: 1.10.12

copyright:
  - license: MIT
    url: https://github.com/korbinian90/ROMEO.jl/blob/master/LICENSE

architectures:
  - x86_64
  - aarch64

auto_update:
  method: sources
  container_version: compilemri
  sources:
  - id: compilemri
    method: github_release
    repo: korbinian90/CompileMRI.jl
    target:
      variable: compilemri_version
    assets:
      v: mritools_linux_x64_[0-9.]+\.tar\.gz
  - id: compilemri_source_digest
    dependency: true
    method: http_digest
    url: https://github.com/korbinian90/CompileMRI.jl/archive/refs/tags/v{{ context.compilemri_version
      }}.tar.gz
    target:
      file: compilemri_source
  - id: julia
    dependency: true
    method: webpage
    url: https://julialang-s3.julialang.org/bin/versions.json
    version_regex: '"(?P<version>1\.10\.\d+)"\s*:\s*\{'
    target:
      variable: julia_version
  - id: julia_digest
    dependency: true
    method: http_digest
    url: https://julialang-s3.julialang.org/bin/linux/aarch64/1.10/julia-{{ context.julia_version
      }}-linux-aarch64.tar.gz
    target:
      file: julia

build:
  kind: neurodocker

  base-image: ubuntu:20.04
  pkg-manager: apt

  directives:
    - install:
        - curl
        - ca-certificates

    - condition: arch == "aarch64"
      install:
        - build-essential
        - git

    - workdir: /opt/romeo-{{ context.version }}/

    - condition: arch == "x86_64"
      run:
        - tar -xz -C /opt/romeo-{{ context.version }}/ --strip-components 1 -f {{ get_file("v") }}

    - condition: arch == "aarch64"
      run:
        - mkdir -p /opt/romeo-{{ context.version }}/source
        - tar -xz -C /opt/romeo-{{ context.version }}/source --strip-components 1 -f {{ get_file("compilemri_source") }}
        - tar -xz -C /opt -f {{ get_file("julia") }}
        - /opt/julia-{{ context.julia_version }}/bin/julia --project=/opt/romeo-{{ context.version }}/source -e 'using Pkg; Pkg.instantiate(); Pkg.build("CompileMRI")'
        - /opt/julia-{{ context.julia_version }}/bin/julia --project=/opt/romeo-{{ context.version }}/source -e 'using CompileMRI; CompileMRI.compile("/tmp/romeo-compiled")'
        - cp -a /tmp/romeo-compiled/. /opt/romeo-{{ context.version }}/
        - rm -rf /opt/romeo-{{ context.version }}/source /opt/julia-{{ context.julia_version }} /tmp/romeo-compiled

    - environment:
        PATH: /opt/romeo-{{ context.version }}/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:~/.local/bin

deploy:
  path:
    - /opt/romeo-{{ context.version }}/bin

readme: |
  ----------------------------------
  ## romeo/{{ context.version }} ##
  Unwrapping of 3D and 4D datasets. Coil combination of 5D datasets.



  Example:
  ```
  ROMEO is a command line application.

  Example usage for single-echo or multiple time points with identical echo time (fMRI):
  $ romeo ph.nii -m mag.ii -k nomask -o outputdir

  Example usage for a 3-echo Scan with TE = [3,6,9] ms:
  $ romeo ph.nii -m mag.ii -k nomask -t [3,6,9] -o outputdir

  Note that echo times are required for unwrapping multi-echo data.
  ```

  More documentation can be found here: https://github.com/korbinian90/ROMEO

  To run applications outside of this container: ml romeo/{{ context.version }}

  Citation:
  ```
  ROMEO: Dymerska, B., Eckstein, K., Bachrata, B., Siow, B., Trattnig, S., Shmueli, K., Robinson, S.D., 2020. Phase Unwrapping with a Rapid Opensource Minimum Spanning TreE AlgOrithm (ROMEO). Magnetic Resonance in Medicine. https://doi.org/10.1002/mrm.28563

  MCPC-3D-S Coil Combination: Eckstein, K., Dymerska, B., Bachrata, B., Bogner, W., Poljanc, K., Trattnig, S., Robinson, S.D., 2018. Computationally Efficient Combination of Multi-channel Phase Data From Multi-echo Acquisitions (ASPIRE). Magnetic Resonance in Medicine 79, 2996\u20133006. https://doi.org/10.1002/mrm.26963
  ```

  ----------------------------------

categories:
  - "phase processing"
icon: data:image/png;base64,

files:
  - name: v
    condition: arch == "x86_64"
    url: https://github.com/korbinian90/CompileMRI.jl/releases/download/v{{ context.compilemri_version }}/mritools_linux_x64_{{ context.compilemri_version }}.tar.gz
  - name: compilemri_source
    condition: arch == "aarch64"
    url: https://github.com/korbinian90/CompileMRI.jl/archive/refs/tags/v{{ context.compilemri_version }}.tar.gz
    sha256: 0810bc99b08536757330f8dc52e5abb8acc22dd99fda6aaea91a74fe2b826fe5
  - name: julia
    condition: arch == "aarch64"
    url: https://julialang-s3.julialang.org/bin/linux/aarch64/1.10/julia-{{ context.julia_version }}-linux-aarch64.tar.gz
    sha256: cc257b21967049642bfe17de1aff7dae17477eba4f423f98cb400c002080e5a2
