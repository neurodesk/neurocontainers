  expected_output_contains: '4'
- name: Analytical wrapped phase ramp and exact spatial geometry
  description: Execute the actual ROMEO CLI on729 wrapped voxels with a known3D phase ramp and require all relative phase
    values within32float32 eps, unchanged physical geometry/input bytes and a recovered span greater than2pi; no existing
    numerical criterion changes
  command: |
    env -u HOME julia - <<'JULIA'
    using MriResearchTools
    mktempdir() do scratch
        phase = Float32[0.8f0*(i-5) + 0.35f0*(j-5) - 0.2f0*(k-5)
                        for i in 1:9, j in 1:9, k in 1:9]
        wrapped = atan.(sin.(phase), cos.(phase))
        source = joinpath(scratch, "wrapped.nii")
        target = joinpath(scratch, "unwrapped.nii")
        savenii(wrapped, source; voxel_size=(1.5, 2.0, 2.5))
        before = read(source)
        run(`romeo -p $source -k nomask --no-phase-rescale -o $target`)
        @assert isfile(target)
        result = niread(target)
        actual = Float32.(result)
        @assert size(actual) == size(phase)
        @assert all(isfinite, actual)
        # Spatial unwrapping is defined up to one constant multiple of 2pi.
        # Compare all729 voxels after subtracting that single center offset.
        offset = Float64(actual[5,5,5]) - Float64(phase[5,5,5])
        bound = 32 * eps(Float32) * max(1.0, maximum(abs, phase))
        @assert maximum(abs, Float64.(actual) .- Float64.(phase) .- offset) <= bound
        @assert maximum(actual) - minimum(actual) > 2pi
        input = niread(source)
        for field in (:pixdim, :qform_code, :sform_code, :quatern_b, :quatern_c,
                      :quatern_d, :qoffset_x, :qoffset_y, :qoffset_z, :srow_x, :srow_y, :srow_z)
            @assert getfield(result.header, field) == getfield(input.header, field)
        end
        @assert read(source) == before
        println("ROMEO analytical729-voxel unwrapping and spatial metadata passed")
    end
    JULIA
  timeout: 300
  expected_exit_code: 0
  expected_output_contains: ROMEO analytical729-voxel unwrapping and spatial metadata passed
