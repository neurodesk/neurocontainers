# DeepWMH container test suite
#
# DeepWMH segments white matter hyperintensities from a single T2-FLAIR image
# without requiring manual annotations for training. The container bundles the
# authors' pre-trained model, their nnU-Net fork, ROBEX and ANTs.
#
# The suite verifies the interfaces, the installed model tree and the external
# tools, and then runs one real segmentation on a small synthetic phantom.
# That last test is slow, but every earlier suite stopped at --help and a file
# listing, which is why a container that could not run a single inference at
# all -- and one that wrote unreadable previews -- both shipped.

name: deepwmh
version: 1.0.1
default_timeout: 300

env:
  PYTHONNOUSERSITE: "1"
  MPLCONFIGDIR: /tmp/deepwmh-matplotlib

tests:
  # ==========================================================================
  # ENTRYPOINTS
  # ==========================================================================
  - name: deepwmh wrapper is on PATH
    description: The convenience wrapper that preselects the bundled model.
    command: command -v deepwmh
    expected_output_contains: deepwmh

  - name: DeepWMH_predict is on PATH
    command: command -v DeepWMH_predict
    expected_output_contains: DeepWMH_predict

  - name: DeepWMH_predict renders help
    description: Exercises the full import chain, including the nnU-Net fork.
    command: DeepWMH_predict -h
    expected_output_contains: "--skip-bfc"

  - name: DeepWMH_install renders help
    command: DeepWMH_install -h
    expected_output_contains: "-m"

  - name: DeepWMH_train exists but is not exported
    description: >-
      The entry point is installed by upstream's setup.py, but it is left out
      of deploy.bins: its first action is check_system_integrity with every
      check enabled, including FSL and FreeSurfer, neither of which is in this
      image, so the module would advertise a command that can only ever fail.
      Upstream needs them for training only; this container does inference.
    command: command -v DeepWMH_train
    expected_output_contains: DeepWMH_train

  - name: antsGroupRegistration is installed
    command: command -v antsGroupRegistration
    expected_output_contains: antsGroupRegistration

  # ==========================================================================
  # PYTHON RUNTIME
  # ==========================================================================
  - name: Python runtime is 3.9
    description: >-
      DeepWMH's pinned dependencies only publish wheels up to cp39; a newer
      interpreter silently reintroduces source builds.
    command: python -c 'import sys; assert sys.version_info[:2] == (3, 9)'

  - name: Python does not load user packages
    description: Ensure results come from the container, not a bound user site.
    command: python -c 'import site; assert site.ENABLE_USER_SITE is False'

  - name: deepwmh package imports
    command: python -c 'import deepwmh; print(deepwmh.__name__)'

  - name: deepwmh reports its version
    command: python -c 'import deepwmh.pkginfo as p; print(p.__version__)'
    expected_output_contains: "1.0"

  - name: DeepWMH prediction module imports
    command: python -c 'import deepwmh.main.predict, deepwmh.main.install_model'

  - name: DeepWMH pipeline module imports
    command: python -c 'import deepwmh.pipeline.DCNN_multistage'

  - name: DeepWMH analysis modules import
    command: python -c 'import deepwmh.analysis.lesion_analysis, deepwmh.analysis.metrics, deepwmh.analysis.image_ops'

  - name: nnU-Net fork is the installed one
    description: >-
      DeepWMH requires lchdl/nnUNet_for_DeepWMH, not upstream MIC-DKFZ/nnUNet.
      The fork is installed editable from /opt/nnunet_for_deepwmh.
    command: python -c 'import nnunet, os; print(os.path.realpath(os.path.dirname(nnunet.__file__)))'
    expected_output_contains: /opt/nnunet_for_deepwmh

  - name: PyTorch CPU runtime works
    command: python -c 'import torch; x=torch.tensor([1.,2.,3.]); assert torch.dot(x,x).item() == 14'

  - name: PyTorch is the cu118 build
    command: python -c 'import torch; print(torch.__version__)'
    expected_output_contains: "2.5.0"

  - name: NiBabel runtime works
    command: python -c 'import nibabel as nib, numpy as np; img=nib.Nifti1Image(np.zeros((2,3,4)), np.eye(4)); assert img.shape == (2,3,4)'

  - name: SimpleITK image runtime works
    command: python -c 'import SimpleITK as sitk; img=sitk.Image([3,4,5], sitk.sitkFloat32); assert img.GetSize() == (3,4,5)'

  # ==========================================================================
  # BUNDLED PRE-TRAINED MODEL
  # ==========================================================================
  - name: Model directory environment variable is set
    command: bash -lc 'test -n "$DEEPWMH_MODEL_DIR" && echo "DEEPWMH_MODEL_DIR=$DEEPWMH_MODEL_DIR"'
    expected_output_contains: DEEPWMH_MODEL_DIR=/opt/deepwmh-model

  - name: Installed model tree contains network weights
    description: >-
      DeepWMH_install lays out an nnU-Net fold containing model_best.model.
      Without this the container builds but every prediction fails at runtime.
    command: bash -lc 'find "$DEEPWMH_MODEL_DIR" -name "model_best.model" | head -n 1'
    expected_output_contains: model_best.model

  - name: Model weights are a plausible size
    command: bash -lc 'test "$(find "$DEEPWMH_MODEL_DIR" -name "model_best.model" -size +10M | wc -l)" -ge 1'

  - name: Installed model tree contains nnU-Net plans
    command: bash -lc 'find "$DEEPWMH_MODEL_DIR" -name "plans.pkl" | head -n 1'
    expected_output_contains: plans.pkl

  - name: nnU-Net plans deserialise
    command: |
      python - <<'PY'
      import os, pickle, pathlib
      root = pathlib.Path(os.environ["DEEPWMH_MODEL_DIR"])
      plans = next(root.rglob("plans.pkl"))
      with plans.open("rb") as handle:
          data = pickle.load(handle)
      assert isinstance(data, dict) and data, "plans.pkl did not load as a dict"
      print("plans keys:", len(data))
      PY

  # ==========================================================================
  # EXTERNAL TOOLS
  # ==========================================================================
  - name: ROBEX_DIR is set
    command: bash -lc 'test -n "$ROBEX_DIR" && echo "ROBEX_DIR=$ROBEX_DIR"'
    expected_output_contains: ROBEX_DIR=/opt/robex

  - name: ROBEX launcher is executable
    description: Skull stripping step of the DeepWMH pipeline.
    command: bash -lc 'test -x "$ROBEX_DIR/runROBEX.sh" && echo robex-ok'
    expected_output_contains: robex-ok

  - name: ROBEX binary is present
    command: bash -lc 'test -x "$ROBEX_DIR/ROBEX" && echo robex-bin-ok'
    expected_output_contains: robex-bin-ok

  - name: ANTs N4 bias correction is available
    description: Without ANTs, users must pass --skip-bfc and accuracy degrades.
    command: command -v N4BiasFieldCorrection
    expected_output_contains: N4BiasFieldCorrection

  - name: ANTs registration is available
    command: command -v antsRegistration
    expected_output_contains: antsRegistration

  - name: ANTs random seed is pinned
    description: The pipeline is only reproducible when ANTs is seeded.
    command: bash -lc 'echo "ANTS_RANDOM_SEED=$ANTS_RANDOM_SEED"'
    expected_output_contains: ANTS_RANDOM_SEED=0

  # ==========================================================================
  # SANITY
  # ==========================================================================
  - name: NIfTI file round trip preserves data and affine
    command: |
      python - <<'PY'
      import tempfile
      from pathlib import Path
      import nibabel as nib
      import numpy as np
      with tempfile.TemporaryDirectory(dir="/tmp") as tmp:
          path = Path(tmp) / "flair.nii.gz"
          data = np.arange(24, dtype=np.float32).reshape(2, 3, 4)
          affine = np.diag([1.0, 1.0, 1.0, 1.0])
          nib.save(nib.Nifti1Image(data, affine), path)
          loaded = nib.load(path)
          assert np.array_equal(loaded.get_fdata(), data)
          assert np.array_equal(loaded.affine, affine)
      PY

  - name: DeepWMH_predict rejects a missing input image
    description: Confirms argument handling fails cleanly rather than hanging.
    command: bash -lc 'DeepWMH_predict -i /tmp/does-not-exist.nii.gz -n s1 -o /tmp/out -g -1 >/dev/null 2>&1; test $? -ne 0 && echo rejected'
    expected_output_contains: rejected

  - name: nnU-Net tolerates a read-only model directory
    description: >-
      The fork opens a training log in the model folder even during inference,
      and that path comes from the model pickle, so it points into the read-only
      image. Unpatched, prediction dies after N4 with Errno 30. This asserts the
      patch is present in the shipped image.
    command: >-
      grep -c "neurocontainers. fall back to a writable log dir"
      /opt/nnunet_for_deepwmh/nnunet/training/network_training/network_trainer.py
    expected_output_contains: "1"

  - name: the log fallback resolves to a writable directory
    description: Exercises the fallback against the real read-only model directory.
    command: |
      python -c "
      import os
      d = os.environ.get('DEEPWMH_MODEL_DIR', '/opt/deepwmh-model')
      ok = os.access(d, os.W_OK)
      fb = os.path.join(os.environ.get('TMPDIR', '/tmp'), 'deepwmh-nnunet-logs')
      os.makedirs(fb, exist_ok=True)
      print('model-dir-writable', ok, 'fallback-writable', os.access(fb, os.W_OK))
      "
    expected_output_contains: "fallback-writable True"

  # ==========================================================================
  # OUTPUT CORRECTNESS
  # ==========================================================================
  - name: masks are written as 0/1, not 0/255
    description: >-
      save_nifti casts data to float32 but reused the caller's header, which
      for the segmentation stages declares uint8. nibabel then stored 255 and
      set scl_slope=1/255, so the declared final mask read back as
      {0, 1.00000006} and `mask == 1` silently selected nothing, while code
      reading raw integers saw 255 -- and 001_raw in the same run wrote a true
      {0, 1}, so the encoding was not even self-consistent. Nothing errored and
      the mask looked correct in a viewer.
    command: |
      python -c "
      import numpy as np, nibabel as nib, tempfile, os
      from deepwmh.utilities.data_io import save_nifti
      d = tempfile.mkdtemp(); q = os.path.join(d, 'm.nii.gz')
      base = nib.Nifti1Image(np.zeros((8,8,4), np.uint8), np.eye(4))
      base.header.set_data_dtype(np.uint8)
      m = np.zeros((8,8,4), 'float32'); m[2:5,2:5,1:3] = 1
      save_nifti(m, base.header, q)
      img = nib.load(q); dat = img.get_fdata()
      print('dtype', img.get_data_dtype(), 'slope', img.dataobj.slope)
      print('equals-one', int((dat == 1).sum()), 'greater-zero', int((dat > 0).sum()))
      "
    expected_output_contains: "equals-one 18 greater-zero 18"

  - name: a generated GIF preview can be read back
    description: >-
      003_Previews/*.gif is the only built-in QC artifact. Written through the
      pinned imageio 2.13.2 they came out unreadable for several geometries --
      by every decoder tried, including imageio's own reader inside this same
      image -- while deepwmh still exited 0, so the failure was silent. The
      frames are now written with Pillow.
    timeout: 600
    command: |
      python -c "
      import numpy as np, nibabel as nib, tempfile, os
      from deepwmh.utilities.nii_preview import nii_as_gif
      from deepwmh.utilities.data_io import try_load_gif
      d = tempfile.mkdtemp()
      v = os.path.join(d, 'v.nii.gz'); g = os.path.join(d, 'v.gif')
      nib.save(nib.Nifti1Image(np.random.rand(32,32,8).astype('float32'), np.eye(4)), v)
      nii_as_gif(v, g)
      print('gif-readable', try_load_gif(g), os.path.getsize(g) > 0)
      "
    expected_output_contains: "gif-readable True True"

  # ==========================================================================
  # CLI SURFACE
  # ==========================================================================
  - name: deepwmh --help describes deepwmh, not DeepWMH_predict
    description: >-
      The wrapper exec'd DeepWMH_predict, so --help printed that tool's usage:
      the wrong program name, and "-m TRAINED_MODEL" listed as required, which
      contradicts every example in the readme -- none of which pass -m, because
      the wrapper supplies it.
    command: deepwmh --help
    expected_output_contains: "usage: deepwmh"

  - name: deepwmh --help does not demand -m
    command: |
      deepwmh --help | grep -q 'TRAINED_MODEL' && echo "STILL-DEMANDS-M" || echo "no-m-required"
    expected_output_contains: "no-m-required"

  - name: deepwmh --help names the final output directory
    description: >-
      Nothing documented which of the three segmentation directories is the
      result; a user taking 001_raw gets an unmasked, un-postprocessed mask.
    command: deepwmh --help
    expected_output_contains: "003_postproc_fov"

  - name: ROBEX resolves through PATH
    description: >-
      ROBEX is exported as a command and transparent-singularity resolves its
      wrappers through the container's PATH. /opt/robex was on deploy.path but
      not on PATH, so `ROBEX` and `runROBEX.sh` were both advertised by the
      module and both failed with "executable file not found in $PATH".
    command: bash -lc 'command -v ROBEX && command -v runROBEX.sh'
    expected_output_contains: /opt/robex/ROBEX

  # ==========================================================================
  # END-TO-END
  # ==========================================================================
  - name: segments a synthetic phantom end to end
    description: >-
      The test the suite never had: it stopped at --help and file listings,
      which is why a container that could not run a single inference shipped.
      Runs the documented invocation on a small phantom and checks the declared
      final mask exists and is labelled 0/1.

      The runner reports only a test's exit code, never its output, so the
      failure stage is encoded in the code. 41/42 mean ROBEX cannot skull-strip
      the synthetic phantom, which is a limit of the phantom rather than the
      container: ROBEX fits a trained shape model and a geometric blob is not a
      brain. 30 read-only filesystem, 32 nnU-Net or torch, 33 out of memory, 34
      unclassified, 20 no final mask, 21 unexpected labels. Classification reads
      only the tail of the log, because every stage name also appears in the
      normal progress output -- grepping the whole log cannot tell a stage that
      failed from one that merely ran.
    timeout: 3600
    command: |
      cd "$(mktemp -d)"
      python -c "
      import numpy as np, nibabel as nib
      rng = np.random.default_rng(0)
      shape = (64, 64, 48)
      zz, yy, xx = np.mgrid[0:shape[0], 0:shape[1], 0:shape[2]]
      c = (shape[0]/2, shape[1]/2, shape[2]/2)
      r = ((zz-c[0])/26.0)**2 + ((yy-c[1])/26.0)**2 + ((xx-c[2])/20.0)**2
      brain = r <= 1.0
      vol = np.zeros(shape, 'float32')
      vol[brain] = 100 + rng.normal(0, 4, brain.sum())
      for off in (-6, 0, 6):
          vol[30:34, 30+off:34+off, 22:26] = 220
      nib.save(nib.Nifti1Image(vol, np.eye(4)), 'flair.nii.gz')
      "
      # ROBEX on its own first, so a phantom it cannot strip is distinguishable
      # from a genuine failure further down the pipeline.
      "$ROBEX_DIR/runROBEX.sh" flair.nii.gz stripped.nii.gz mask.nii.gz > robex.log 2>&1 || exit 41
      test -s stripped.nii.gz || exit 42

      deepwmh -i flair.nii.gz -n phantom -o out -g -1 --skip-bfc > run.log 2>&1 || rc=$?
      if [ -n "${rc:-}" ]; then
          tail -40 run.log
          tail -25 run.log > tail.log
          grep -qi 'read-only file system\|Errno 30' tail.log && exit 30
          grep -qi 'nnunet\|torch\|cuda' tail.log && exit 32
          grep -qi 'memoryerror\|out of memory\|killed' tail.log && exit 33
          exit 34
      fi
      python -c "
      import glob, sys, numpy as np, nibabel as nib
      hits = glob.glob('out/002_Segmentations/003_postproc_fov/*.nii*')
      if not hits:
          print('tree:', sorted(glob.glob('out/**', recursive=True))[:40]); sys.exit(20)
      dat = nib.load(hits[0]).get_fdata()
      vals = set(np.unique(dat).tolist())
      if not vals <= {0.0, 1.0}:
          print('labels', sorted(vals)); sys.exit(21)
      print('segmentation-ok labels', sorted(vals))
      "
    expected_output_contains: "segmentation-ok"
