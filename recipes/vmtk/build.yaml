name: vmtk
version: 1.5.2

copyright:
  - license: BSD-3-Clause
    url: https://github.com/vmtk/vmtk
  - license: LicenseRef-TetGen-1.4.3
    url: https://github.com/vmtk/vmtk/blob/v1.5.2/vtkVmtk/Utilities/tetgen1.4.3/LICENSE

architectures:
  - x86_64

variables:
  miniforge_version: 24.7.1-2
  miniforge_sha256: 636f7faca2d51ee42b4640ce160c751a46d57621ef4bf14378704c87c5db4fe3
  upstream_tag: v1.5.2
  source_commit: 66b068a39521f29d01960d807bca8e87fe03a627
  source_sha256: 8a72462669a637d3e3dd85ba6ecdcee9e7ec698f32d479b97440506c005cb2fd
  vtkaddon_commit: cf1126568415179fb5b1c16121087bd2494e2e0e
  python_version: "3.12.15"
  vtk_version: "9.6.2"
  itk_version: "5.4.5"

  python_build: h5f976f7_2_cpython
  python_sha256: f8a38c33f627c68e35d02cc5a11eff25eadb853791ac40bf9cc569315d25bc54
  vtk_build: py312hbc9d26b_7
  vtk_sha256: d29cc350656ab5d4c032f0c31480154504d6ca73f7e210e2c0cb3566b4aa646d
  itk_build: hd217e58_0
  itk_sha256: 92e5f26de0ee1b1dbaaaf9a6c7a51be3c48ac3567243f6a6d90d0b836daeadf5
  itk_devel_build: h77c023d_0
  itk_devel_sha256: bb69c5372f3af02d2493dc67e9441bb25e6bdcaff10a0e93afa3996418433b7d

auto_update:
  method: sources
  container_version: vmtk
  sources:
    - id: vmtk
      method: github_tags
      repo: vmtk/vmtk
      target:
        variable: upstream_tag
        value: tag
    - id: vmtk-source
      method: http_digest
      url: https://github.com/vmtk/vmtk/archive/refs/tags/{{ context.upstream_tag }}.tar.gz
      target:
        variable: source_sha256
    - id: miniforge
      method: http_digest
      dependency: true
      url: https://github.com/conda-forge/miniforge/releases/download/{{ context.miniforge_version }}/Miniforge3-Linux-x86_64.sh
      target:
        variable: miniforge_sha256

    - id: python-sdk
      method: http_digest
      dependency: true
      url: https://conda.anaconda.org/conda-forge/linux-64/python-{{ context.python_version }}-{{ context.python_build }}.conda
      target:
        variable: python_sha256
    - id: vtk-sdk
      method: http_digest
      dependency: true
      url: https://conda.anaconda.org/conda-forge/linux-64/vtk-base-{{ context.vtk_version }}-{{ context.vtk_build }}.conda
      target:
        variable: vtk_sha256
    - id: itk-sdk
      method: http_digest
      dependency: true
      url: https://conda.anaconda.org/conda-forge/linux-64/libitk-{{ context.itk_version }}-{{ context.itk_build }}.conda
      target:
        variable: itk_sha256
    - id: itk-devel-sdk
      method: http_digest
      dependency: true
      url: https://conda.anaconda.org/conda-forge/linux-64/libitk-devel-{{ context.itk_version }}-{{ context.itk_devel_build }}.conda
      target:
        variable: itk_devel_sha256
    - id: vtkaddon-macro
      method: http_digest
      dependency: true
      url: https://raw.githubusercontent.com/Slicer/vtkAddon/{{ context.vtkaddon_commit }}/CMake/vtkMacroKitPythonWrap.cmake
      target:
        file: vtkaddon_macro
    - id: vtkaddon-hierarchy
      method: http_digest
      dependency: true
      url: https://raw.githubusercontent.com/Slicer/vtkAddon/{{ context.vtkaddon_commit }}/CMake/vtkWrapHierarchy.cmake
      target:
        file: vtkaddon_hierarchy
    - id: vtkaddon-python
      method: http_digest
      dependency: true
      url: https://raw.githubusercontent.com/Slicer/vtkAddon/{{ context.vtkaddon_commit }}/CMake/vtkWrapPython.cmake
      target:
        file: vtkaddon_python
    - id: vtkaddon-init
      method: http_digest
      dependency: true
      url: https://raw.githubusercontent.com/Slicer/vtkAddon/{{ context.vtkaddon_commit }}/CMake/vtkWrapperInit.data.in
      target:
        file: vtkaddon_init

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - install:
        - libgl1
        - libglu1-mesa
        - ca-certificates
        - bzip2

    - run:
        - printf '#!/bin/bash\nls -la' > /usr/bin/ll
        - chmod +x /usr/bin/ll
        - mkdir -p /neurodesktop-storage /neurodesktop-home /neurodesktop-share /neurodesktop-trash

    - run:
        - bash {{ get_file("miniforge_installer") }} -b -p /tmp/miniforge
        - cp {{ get_file("python_sdk") }} /tmp/miniforge/pkgs/
        - cp {{ get_file("vtk_sdk") }} /tmp/miniforge/pkgs/
        - cp {{ get_file("itk_sdk") }} /tmp/miniforge/pkgs/
        - cp {{ get_file("itk_devel_sdk") }} /tmp/miniforge/pkgs/
        - /tmp/miniforge/bin/mamba create -y -p /opt/miniforge3 --file {{ get_file("sdk_lock") }}
        - cd /tmp/miniforge/pkgs && sha256sum --check {{ get_file("sdk_hashes") }}
        - mkdir -p /opt/miniforge3/share/vmtk /opt/miniforge3/share/licenses/conda
        - cp {{ get_file("sdk_lock") }} /opt/miniforge3/share/vmtk/conda-linux-64.lock
        - cp {{ get_file("sdk_hashes") }} /opt/miniforge3/share/vmtk/conda-linux-64.sha256
        - for package in /tmp/miniforge/pkgs/*; do if [ -d "$package/info/licenses" ]; then cp -a "$package/info/licenses" "/opt/miniforge3/share/licenses/conda/$(basename "$package")"; fi; done
        - /tmp/miniforge/bin/conda list -p /opt/miniforge3 --json > /opt/miniforge3/share/vmtk/conda-packages.json
        - rm -rf /tmp/miniforge /root/.cache /root/.conda

    - environment:
        PATH: /opt/miniforge3/bin:$PATH
        CONDA_PATH: /opt/miniforge3

    - run:
        - mkdir -p /tmp/vmtk-src /tmp/vmtk-build/CMake
        - tar -xzf {{ get_file("vmtk_source") }} -C /tmp/vmtk-src --strip-components=1
        - cp {{ get_file("vtkaddon_macro") }} /tmp/vmtk-build/CMake/vtkMacroKitPythonWrap.cmake
        - cp {{ get_file("vtkaddon_hierarchy") }} /tmp/vmtk-build/CMake/vtkWrapHierarchy.cmake
        - cp {{ get_file("vtkaddon_python") }} /tmp/vmtk-build/CMake/vtkWrapPython.cmake
        - cp {{ get_file("vtkaddon_init") }} /tmp/vmtk-build/CMake/vtkWrapperInit.data.in
        - python {{ get_file("verify_source") }} {{ get_file("vmtk_source") }} {{ context.version }} {{ context.vtkaddon_commit }} /tmp/vmtk-build/CMake /opt/miniforge3/share/vmtk/source.json /tmp/vmtk-src {{ get_file("sizing_patch") }} {{ get_file("sizing_manifest") }} {{ context.source_commit }}
        - cp {{ get_file("sizing_patch") }} /opt/miniforge3/share/vmtk/tetgen-sizing.patch
        - cp {{ get_file("sizing_manifest") }} /opt/miniforge3/share/vmtk/tetgen-sizing.json
        - >-
          cmake -S /tmp/vmtk-src -B /tmp/vmtk-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=/opt/miniforge3/bin/x86_64-conda-linux-gnu-cc
          -DCMAKE_CXX_COMPILER=/opt/miniforge3/bin/x86_64-conda-linux-gnu-c++
          -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCMAKE_INSTALL_PREFIX=/opt/miniforge3 -DCMAKE_PREFIX_PATH=/opt/miniforge3
          -DPython3_ROOT_DIR=/opt/miniforge3 -DPython3_EXECUTABLE=/opt/miniforge3/bin/python
          -DPYTHON_LIBRARY=/opt/miniforge3/lib/libpython3.12.so
          -DVMTK_PYTHON_VERSION=python3.12
          -DVMTK_USE_SUPERBUILD=OFF -DUSE_SYSTEM_VTK=ON -DUSE_SYSTEM_ITK=ON
          -DVMTK_WHEEL_BUILD=OFF -DVMTK_USE_VTK9=ON -DVMTK_USE_ITK5=ON
          -DBUILD_SHARED_LIBS=ON -DVTK_VMTK_WRAP_PYTHON=ON
          -DVMTK_SCRIPTS_ENABLED=ON -DVMTK_MINIMAL_INSTALL=OFF
          -DVMTK_CONTRIB_SCRIPTS=ON -DVTK_VMTK_CONTRIB=ON
          -DVMTK_BUILD_TETGEN=ON -DVTK_VMTK_BUILD_TETGEN=ON
          -DVMTK_USE_RENDERING=ON -DVMTK_RENDERING_BACKEND=OpenGL2
          -DVTK_VMTK_BUILD_STREAMTRACER=ON
          -DVMTK_BUILD_TESTING=OFF -DVMTK_TEST_DATA_SOURCE=in-place
          -DCMAKE_INSTALL_RPATH=/opt/miniforge3/lib
          -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON
        - cmake --build /tmp/vmtk-build --parallel 4
        - cmake --install /tmp/vmtk-build
        - cp /tmp/vmtk-build/CMakeCache.txt /opt/miniforge3/share/vmtk/CMakeCache.txt
        - mkdir -p /opt/miniforge3/share/licenses/vmtk
        - cp /tmp/vmtk-src/LICENSE /opt/miniforge3/share/licenses/vmtk/LICENSE
        - cp /tmp/vmtk-src/vtkVmtk/Utilities/tetgen1.4.3/LICENSE /opt/miniforge3/share/licenses/vmtk/TetGen-1.4.3-LICENSE
        - rm -rf /tmp/vmtk-src /tmp/vmtk-build
        - python -c "import platform, vtk; from vmtk import vtkvmtk; assert platform.python_version() == '{{ context.python_version }}'; assert vtk.vtkVersion.GetVTKVersion() == '{{ context.vtk_version }}'; assert vtkvmtk.vtkvmtkTetGenWrapper().IsA('vtkUnstructuredGridAlgorithm')"

deploy:
  path:
    - /opt/miniforge3/bin

categories:
  - image segmentation
  - visualization
  - shape analysis

readme: |-
  ----------------------------------
  ## vmtk/{{ context.version }} ##

  The Vascular Modeling Toolkit is a collection of libraries and tools for 3D reconstruction, geometric analysis, mesh generation, and surface data analysis for image-based modeling of blood vessels.

  VMTK can be used through its command line tools, as Python/C++ libraries, or as part of 3D Slicer workflows. This container builds upstream VMTK {{ context.version }} from source with its individual command launchers and TetGen support. The locked conda-forge development environment supplies VTK {{ context.vtk_version }}, ITK {{ context.itk_version }}, and Python {{ context.python_version }}.

  Homepage: http://www.vmtk.org/
  Documentation: http://www.vmtk.org/documentation/

  Example:
  ```sh
  vmtkcenterlines -ifile foo.vtp -ofile foo_centerlines.vtp
  vmtksurfacereader -ifile foo.vtp --pipe vmtkcenterlines --pipe vmtkrenderer --pipe vmtksurfaceviewer -opacity 0.25 --pipe vmtksurfaceviewer -i @vmtkcenterlines.o -array MaximumInscribedSphereRadius
  ```

  To make VMTK commands available in Neurodesk environments, run:
  ```sh
  ml vmtk/{{ context.version }}
  ```

  VMTK uses BSD-3-Clause. Vendored TetGen 1.4.3 has separate license terms. The original VMTK and TetGen texts are installed in `/opt/miniforge3/share/licenses/vmtk`. Conda dependency license texts are in `/opt/miniforge3/share/licenses/conda`.

  ----------------------------------

