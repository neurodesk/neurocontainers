name: gautomatch
version: 0.56.0

copyright:
  - name: Gautomatch freeware binary (Kai Zhang, MRC-LMB); no licence published
    url: https://web.archive.org/web/20230429192932/https://www2.mrc-lmb.cam.ac.uk/download/gautomatch-056/
  - name: NVIDIA CUDA Toolkit EULA (redistributable cuFFT, cuBLAS, cuRAND, NPP runtime libraries)
    url: https://docs.nvidia.com/cuda/archive/10.1/eula/index.html

architectures:
  - x86_64

variables:
  upstream_version: "0.56"
  gautomatch_binary: Gautomatch_v0.56_sm30-75_cu10.1
  cuda_libs: /opt/gautomatch-{{ context.upstream_version }}/lib

auto_update:
  frozen: true
  reason: >-
    Gautomatch is unmaintained: v0.56 is the final release and the MRC-LMB
    download page was withdrawn. The binary comes from the Scipion mirror and
    links against CUDA 10.1 libraries, so both stay pinned.
  method: sources
  container_version: gautomatch
  sources:
    - id: gautomatch
      method: artifact_listing
      url: https://scipion.cnb.csic.es/downloads/scipion/software/em/
      download_base: https://scipion.cnb.csic.es/downloads/scipion/software/em/
      version_regex: '[Gg]automatch_v(?P<version>\d+\.\d+)\.tgz'
      target:
        file: gautomatch_archive
        variables:
          upstream_version: version
    - id: cufft
      method: http_digest
      url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu1804/x86_64/cuda-cufft-10-1_10.1.243-1_amd64.deb
      dependency: true
      target:
        file: cufft_deb
    - id: curand
      method: http_digest
      url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu1804/x86_64/cuda-curand-10-1_10.1.243-1_amd64.deb
      dependency: true
      target:
        file: curand_deb
    - id: npp
      method: http_digest
      url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu1804/x86_64/cuda-npp-10-1_10.1.243-1_amd64.deb
      dependency: true
      target:
        file: npp_deb
    - id: cublas
      method: http_digest
      url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu1804/x86_64/libcublas10_10.2.1.243-1_amd64.deb
      dependency: true
      target:
        file: cublas_deb

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive

    - run:
        - mkdir -p /opt/gautomatch-{{ context.upstream_version }}/bin {{ context.cuda_libs }} /tmp/gautomatch-build/cuda
        - tar -xzf {{ get_file("gautomatch_archive") }} -C /tmp/gautomatch-build
        - install -m 0755 /tmp/gautomatch-build/gautomatch_v{{ context.upstream_version }}/bin/{{ context.gautomatch_binary }} /opt/gautomatch-{{ context.upstream_version }}/bin/
        - ln -s {{ context.gautomatch_binary }} /opt/gautomatch-{{ context.upstream_version }}/bin/Gautomatch
        - dpkg-deb -x {{ get_file("cufft_deb") }} /tmp/gautomatch-build/cuda
        - dpkg-deb -x {{ get_file("curand_deb") }} /tmp/gautomatch-build/cuda
        - dpkg-deb -x {{ get_file("npp_deb") }} /tmp/gautomatch-build/cuda
        - dpkg-deb -x {{ get_file("cublas_deb") }} /tmp/gautomatch-build/cuda
        - cp -a /tmp/gautomatch-build/cuda/usr/local/cuda-10.1/targets/x86_64-linux/lib/libcufft.so.10* /tmp/gautomatch-build/cuda/usr/local/cuda-10.1/targets/x86_64-linux/lib/libcurand.so.10* /tmp/gautomatch-build/cuda/usr/local/cuda-10.1/targets/x86_64-linux/lib/libnpps.so.10* /tmp/gautomatch-build/cuda/usr/local/cuda-10.1/targets/x86_64-linux/lib/libnppc.so.10* {{ context.cuda_libs }}/
        - cp -a /tmp/gautomatch-build/cuda/usr/lib/x86_64-linux-gnu/libcublas.so.10* /tmp/gautomatch-build/cuda/usr/lib/x86_64-linux-gnu/libcublasLt.so.10* {{ context.cuda_libs }}/
        - rm -rf /tmp/gautomatch-build

    - environment:
        PATH: /opt/gautomatch-{{ context.upstream_version }}/bin:$PATH
        LD_LIBRARY_PATH: "{{ context.cuda_libs }}"

deploy:
  bins:
    - Gautomatch
    - "{{ context.gautomatch_binary }}"

files:
  - name: gautomatch_archive
    url: https://scipion.cnb.csic.es/downloads/scipion/software/em/gautomatch_v0.56.tgz
    sha256: f975fc2837222d88571851343663cf91acf83a7a04bec7f758a9aae910a6389f
  - name: cufft_deb
    url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu1804/x86_64/cuda-cufft-10-1_10.1.243-1_amd64.deb
    sha256: 7d61cd423774bf6fd601b063697b5728c3fd2183ef8287d203f7ae5b1ae9a4fd
  - name: curand_deb
    url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu1804/x86_64/cuda-curand-10-1_10.1.243-1_amd64.deb
    sha256: c6910b07716e1eef5758f8aa275121dc1705d37de1d01271189bfebb52379ac2
  - name: npp_deb
    url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu1804/x86_64/cuda-npp-10-1_10.1.243-1_amd64.deb
    sha256: 5efd2d20b435204189d5269a86e8a9bf840371861907ed6bb7b5f96bf3041a80
  - name: cublas_deb
    url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu1804/x86_64/libcublas10_10.2.1.243-1_amd64.deb
    sha256: 038fca37eaa299f43e2d48f2ba2d9738d8206da36f91cc5e4ddde0b9c784065c

categories:
  - cryo EM

readme: |
  ----------------------------------
  ## gautomatch/{{ context.version }} ##

  Gautomatch is a GPU-accelerated program by Kai Zhang (MRC Laboratory of Molecular Biology)
  for fully automatic particle picking in cryo-EM micrographs, with or without 2D templates.

  This container installs Gautomatch v{{ context.upstream_version }}, binary `{{ context.gautomatch_binary }}`.
  The binary was compiled for CUDA 10.1 and compute capabilities sm_30 to sm_75. It also embeds sm_75 PTX,
  which the NVIDIA driver JIT-compiles for newer GPUs. The CUDA 10.1 runtime libraries it links against
  (cuFFT, cuBLAS, cuRAND and NPP) are bundled in {{ context.cuda_libs }}.
  The host must provide an NVIDIA GPU and a driver that supports CUDA 10.1 or newer (418.39+).
  Run Apptainer/Singularity with `--nv`.

  Example:
  ```
  Gautomatch --help
  Gautomatch --apixM 1.34 --diameter 400 --T templates.mrcs --apixT 3.2 Micrographs/*.mrc
  ```

  Outputs (`*_automatch.box`, `*_automatch.star`) are written next to the input micrographs.
  Keep data in a writable mounted directory.

  Upstream is no longer maintained. The original MRC-LMB download page is offline. This build uses the
  archive that the Scipion project (I2PC, CNB-CSIC) redistributes for its Gautomatch plugin:
  https://scipion.cnb.csic.es/downloads/scipion/software/em/gautomatch_v0.56.tgz

  Licence: Gautomatch is closed-source freeware that the author distributed publicly at no cost.
  The author never published licence terms.
  The bundled CUDA libraries are redistributable under the NVIDIA CUDA Toolkit EULA.

  Citation (Gautomatch has no journal publication; cite the software):
  ```
  Zhang, K. Gautomatch. Unpublished software, MRC Laboratory of Molecular Biology.
  https://www2.mrc-lmb.cam.ac.uk/research/locally-developed-software/zhang-software/#gauto
  ```

  To run container outside of this environment: ml gautomatch/{{ context.version }}

  ----------------------------------

