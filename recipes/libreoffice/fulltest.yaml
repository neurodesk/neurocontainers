name: libreoffice
version: "26.8.1.1"
upstream_version: "26.8.1.1"
default_timeout: 120

tests:
  - name: LibreOffice version check
    description: Verify LibreOffice starts in CLI mode and reports its version.
    command: libreoffice --version
    expected_output_contains: LibreOffice ${upstream_version}

  - name: LibreOffice GUI launch targets
    description: Verify the GUI launcher commands for the main LibreOffice applications are available.
    command: |
      command -v libreoffice
      command -v lowriter
      command -v localc
      command -v loimpress
      command -v lodraw
      command -v lobase
      command -v lomath
    expected_exit_code: 0

  - name: Headless document conversion preserves text and exports PDF
    description: Convert a real document with a private writable profile and assert its content and PDF output.
    command: |
      set -eu
      conversion_dir=$(mktemp -d /tmp/libreoffice-fulltest.XXXXXX)
      trap 'rm -rf "$conversion_dir"' EXIT
      printf '%s\n' 'NeuroContainers document conversion probe.' > "$conversion_dir/probe.txt"
      libreoffice "-env:UserInstallation=file://$conversion_dir/profile" --headless \
        --convert-to odt --outdir "$conversion_dir" "$conversion_dir/probe.txt"
      test -s "$conversion_dir/probe.odt"
      libreoffice "-env:UserInstallation=file://$conversion_dir/profile" --headless \
        --cat "$conversion_dir/probe.odt" > "$conversion_dir/roundtrip.txt"
      # Text export may start with the optional UTF-8 byte-order mark.
      LC_ALL=C sed '1s/^\xEF\xBB\xBF//' "$conversion_dir/roundtrip.txt" > "$conversion_dir/normalized.txt"
      if ! grep -Fxq 'NeuroContainers document conversion probe.' "$conversion_dir/normalized.txt"; then
        od -An -tx1c "$conversion_dir/roundtrip.txt" >&2
        exit 1
      fi
      libreoffice "-env:UserInstallation=file://$conversion_dir/profile" --headless \
        --convert-to pdf --outdir "$conversion_dir" "$conversion_dir/probe.odt"
      test -s "$conversion_dir/probe.pdf"
      test "$(head -c 5 "$conversion_dir/probe.pdf")" = '%PDF-'
      tail -c 1024 "$conversion_dir/probe.pdf" | grep -aq '%%EOF'
      echo 'LibreOffice document text and PDF verified'
    expected_output_contains: LibreOffice document text and PDF verified
