name: freesurfer6
version: 6.0.0

copyright:
  - name: FreeSurfer Software License Agreement
    url: https://surfer.nmr.mgh.harvard.edu/fswiki/FreeSurferSoftwareLicense

architectures:
  - x86_64

variables:
  upstream_version: 6.0.0
  # Published checksum from EasyBuild's archived FreeSurfer 6.0.0 recipe:
  # https://github.com/easybuilders/easybuild-easyconfigs/blob/fad15f942d964eb9593d4cc74e25c8aa2e4a913d/easybuild/easyconfigs/f/FreeSurfer/FreeSurfer-6.0.0-centos6_x86_64.eb
  freesurfer_sha256: 9e68ee3fbdb80ab73d097b9c8e99f82bf4674397a1e59593f42bb78f1c1ad449
  matlab_runtime_version: R2012b
  matlab_runtime_sha256: 42e8bea39bc039d767257ab62469018003411de2e3e7fbfad88a75cb58f3a6e7
  install_path: /opt/freesurfer-{{ context.upstream_version }}

auto_update:
  method: sources
  container_version: {variable: upstream_version}
  frozen: true
  reason: >-
    This recipe preserves FreeSurfer 6.0.0 for workflows that require this
    historical release. Newer releases are provided by the freesurfer recipe.
  sources:
    - id: freesurfer
      method: github_tags
      repo: freesurfer/freesurfer
      version_regex: 'v(?P<version>6\.0\.0)'
      target:
        variable: upstream_version
        value: version
        fulltest_variable: upstream_version
    - id: freesurfer_archive
      method: http_digest
      url: https://surfer.nmr.mgh.harvard.edu/pub/dist/freesurfer/6.0.0/freesurfer-Linux-centos6_x86_64-stable-pub-v6.0.0.tar.gz
      target:
        variable: freesurfer_sha256
    - id: matlab_runtime
      method: http_digest
      dependency: true
      url: https://ssd.mathworks.com/supportfiles/MCR_Runtime/R2012b/MCR_R2012b_glnxa64_installer.zip
      target:
        variable: matlab_runtime_sha256

build:
  kind: neurodocker
  # Python 2 and Qt 4 support the original CentOS 6 binaries and scripts.
  base-image: ubuntu:16.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive

    - install:
        - bc
        - binutils
        - ca-certificates
        - file
        - libgomp1
        - libjpeg62
        - libncurses5
        - libqt4-network
        - libqt4-opengl
        - libqt4-svg
        - libqtgui4
        - libglu1-mesa
        - libsm6
        - libxext6
        - libxmu6
        - libxrender1
        - libxss1
        - libxt6
        - locales
        - perl
        - psmisc
        - python
        - tar
        - tcsh
        - unzip
        - xauth
        - xvfb

    - run:
        - locale-gen en_US.UTF-8
        - mkdir -p {{ context.install_path }}
        - tar -xzf {{ get_file("freesurfer_archive") }} -C {{ context.install_path }} --strip-components=1 --no-same-owner

    - run:
        - mkdir -p /tmp/mcr-installer
        - unzip -q {{ get_file("matlab_runtime") }} -d /tmp/mcr-installer
        - /tmp/mcr-installer/install -mode silent -agreeToLicense yes -destinationFolder /opt/matlab-runtime
        - ln -s /opt/matlab-runtime/v80 {{ context.install_path }}/MCRv80
        - rm -rf /tmp/mcr-installer

    - copy:
        - license.txt
        - "{{ context.install_path }}/license.txt"

    - environment:
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
        OS: Linux
        FREESURFER_HOME: "{{ context.install_path }}"
        FREESURFER: "{{ context.install_path }}"
        FS_LICENSE: "{{ context.install_path }}/license.txt"
        SUBJECTS_DIR: "{{ context.install_path }}/subjects"
        LOCAL_DIR: "{{ context.install_path }}/local"
        FSFAST_HOME: "{{ context.install_path }}/fsfast"
        FMRI_ANALYSIS_DIR: "{{ context.install_path }}/fsfast"
        FUNCTIONALS_DIR: "{{ context.install_path }}/sessions"
        FS_OVERRIDE: "0"
        FIX_VERTEX_AREA: ""
        FSF_OUTPUT_FORMAT: nii.gz
        FS_MCRROOT: "{{ context.install_path }}/MCRv80"
        MNI_DIR: "{{ context.install_path }}/mni"
        MINC_BIN_DIR: "{{ context.install_path }}/mni/bin"
        MINC_LIB_DIR: "{{ context.install_path }}/mni/lib"
        MNI_DATAPATH: "{{ context.install_path }}/mni/data"
        MNI_PERL5LIB: "{{ context.install_path }}/mni/share/perl5"
        PERL5LIB: "{{ context.install_path }}/mni/share/perl5"
        PATH: "{{ context.install_path }}/bin:{{ context.install_path }}/fsfast/bin:{{ context.install_path }}/tktools:{{ context.install_path }}/mni/bin:$PATH"
        LD_LIBRARY_PATH: "{{ context.install_path }}/lib/qt/lib:{{ context.install_path }}/lib/vtk:$LD_LIBRARY_PATH"
        QT_X11_NO_MITSHM: "1"
        DEPLOY_ENV_FREESURFER_HOME: "BASEPATH{{ context.install_path }}"
        DEPLOY_TEST_MAX_PATH_FILES: "60"

    - workdir: /data

deploy:
  path:
    - "{{ context.install_path }}/bin"
    - "{{ context.install_path }}/fsfast/bin"
  bins:
    - recon-all
    - freeview

files:
  - name: freesurfer_archive
    url: https://surfer.nmr.mgh.harvard.edu/pub/dist/freesurfer/{{ context.upstream_version }}/freesurfer-Linux-centos6_x86_64-stable-pub-v{{ context.upstream_version }}.tar.gz
    sha256: "{{ context.freesurfer_sha256 }}"
  - name: matlab_runtime
    url: https://ssd.mathworks.com/supportfiles/MCR_Runtime/{{ context.matlab_runtime_version }}/MCR_{{ context.matlab_runtime_version }}_glnxa64_installer.zip
    sha256: "{{ context.matlab_runtime_sha256 }}"

  - name: license.txt
    contents: |-
      s.bollmann@uq.edu.au
      53024
       *CgH0liqb0e9g
       FSVt2Z862iDJk

categories:
  - structural imaging
  - image segmentation

gui_apps:
  - name: Freeview (FreeSurfer 6)
    exec: freeview

readme: |
  ## freesurfer6/{{ context.version }}

  FreeSurfer {{ context.upstream_version }} provides tools for volume and surface
  analysis of brain MRI, including recon-all, Freeview, FSFAST, hippocampal
  subfield segmentation, and brainstem segmentation. MATLAB Runtime
  {{ context.matlab_runtime_version }} (MCRv80) is included for the compiled
  segmentation tools. This recipe preserves the original 6.0.0 release without
  later patches; use the freesurfer recipe for newer releases.

  Set SUBJECTS_DIR to a writable output directory before processing:

  ```bash
  module load freesurfer6/{{ context.version }}
  mkdir -p /data/freesurfer-subjects
  export SUBJECTS_DIR=/data/freesurfer-subjects
  export SINGULARITYENV_SUBJECTS_DIR=$SUBJECTS_DIR
  export APPTAINERENV_SUBJECTS_DIR=$SUBJECTS_DIR
  recon-all -subject subjectname -i /data/T1w.nii.gz -all
  ```

  The bundled subjects directory contains the reference templates. The existing
  NeuroContainers FreeSurfer license is included; FS_LICENSE can select another
  license file when needed.

  Documentation: https://surfer.nmr.mgh.harvard.edu/fswiki/rel6downloads
  Runtime: https://surfer.nmr.mgh.harvard.edu/fswiki/MatlabRuntime
  Citation: https://surfer.nmr.mgh.harvard.edu/fswiki/FreeSurferMethodsCitation
  License: https://surfer.nmr.mgh.harvard.edu/fswiki/FreeSurferSoftwareLicense

icon: data:image/png;base64,
