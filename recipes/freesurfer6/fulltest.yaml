name: freesurfer6
version: 6.0.0
upstream_version: 6.0.0

tests:
  - name: MATLAB launchers preserve status arguments and cache cleanup
    description: Exercise all five installed wrappers with controlled success and failure programs, including paths and arguments containing spaces.
    command: |
      set -eu
      test_dir=$(mktemp -d)
      trap 'rm -rf "$test_dir"' EXIT
      mkdir -p "$test_dir/bin with spaces" "$test_dir/cache root"
      export TMPDIR="$test_dir/cache root"
      export PROBE_RECORD="$test_dir/cache-path"
      for launcher in run_SegmentSubject.sh run_SegmentSubfieldsT1Longitudinal.sh \
        run_segmentSubjectT1_autoEstimateAlveusML.sh \
        run_segmentSubjectT1T2_autoEstimateAlveusML.sh \
        run_segmentSubjectT2_autoEstimateAlveusML.sh; do
        case "$launcher" in
          run_SegmentSubject.sh) application=segmentSubject ;;
          *) application=${launcher#run_}; application=${application%.sh} ;;
        esac
        cp "$FREESURFER_HOME/bin/$launcher" "$test_dir/bin with spaces/$launcher"
        cat > "$test_dir/bin with spaces/$application" <<'PROBE'
      #!/bin/sh
      [ "$#" -eq 3 ] || exit 91
      [ "$1" = 'one two' ] && [ "$2" = '*' ] && [ "$3" = '' ] || exit 92
      [ -d "$MCR_CACHE_ROOT" ] || exit 93
      [ "${JAVA_TOOL_OPTIONS+x}" != x ] || exit 94
      printf '%s\n' "$MCR_CACHE_ROOT" > "$PROBE_RECORD"
      exit "$PROBE_CODE"
      PROBE
        chmod +x "$test_dir/bin with spaces/$application"
        for expected in 0 37; do
          status=0
          PROBE_CODE=$expected JAVA_TOOL_OPTIONS=invalid \
            "$test_dir/bin with spaces/$launcher" '/mock runtime' 'one two' '*' '' || status=$?
          test "$status" -eq "$expected"
          cache_path=$(cat "$PROBE_RECORD")
          test ! -e "$cache_path"
        done
        status=0
        "$test_dir/bin with spaces/$launcher" || status=$?
        test "$status" -eq 64
      done
    expected_exit_code: 0

  - name: brainstem MATLAB application failures reach the caller
    description: Initialize the real MCR application and require a nonzero status for missing application arguments.
    command: run_SegmentSubject.sh "$FS_MCRROOT"
    expected_exit_code_not: 0
    expected_output_contains: "Not enough input arguments"

  - name: hippocampal MATLAB application failures reach the caller
    description: Initialize the real hippocampal program and require a nonzero status for missing application arguments.
    command: run_segmentSubjectT1_autoEstimateAlveusML.sh "$FS_MCRROOT"
    expected_exit_code_not: 0
    expected_output_contains: "Not enough input arguments"

  - name: recon-all reports the upstream version
    description: Verify the reconstruction driver belongs to the requested release.
    command: recon-all -version
    expected_output_contains: "v${upstream_version}"

  - name: runtime launchers are available
    description: Verify the main CLI and segmentation entrypoints are exposed.
    command: >-
      command -v recon-all && command -v mri_convert && command -v mri_info &&
      command -v freeview && command -v segmentSF_T1.sh && command -v segmentBS.sh
    expected_exit_code: 0

  - name: reference templates and MATLAB runtime are installed
    description: Verify runtime assets are readable from the installed software directory.
    command: >-
      test -r "$FREESURFER_HOME/FreeSurferColorLUT.txt" &&
      test -r "$FREESURFER_HOME/subjects/fsaverage/mri/orig.mgz" &&
      test -r "$FREESURFER_HOME/average/RB_all_2016-05-10.vc700.gca" &&
      test -r "$FS_LICENSE" &&
      test -r "$FREESURFER_HOME/MCRv80/runtime/glnxa64/libmwmclmcrrt.so.8.0"
    expected_exit_code: 0

  - name: convert and inspect a reference volume
    description: Exercise image conversion and metadata reading with the bundled fsaverage volume.
    command: |
      set -eu
      test_dir=$(mktemp -d)
      trap 'rm -rf "$test_dir"' EXIT
      mri_convert "$FREESURFER_HOME/subjects/fsaverage/mri/orig.mgz" "$test_dir/orig.nii.gz"
      test -s "$test_dir/orig.nii.gz"
      mri_info --dim "$test_dir/orig.nii.gz"
    expected_output_contains: "256 256 256"

  - name: Freeview starts with a virtual display
    description: Check GUI library resolution and startup with a virtual display supporting legacy GLX contexts.
    command: |
      set -eu
      library_report=$(ldd "$FREESURFER_HOME/bin/freeview.bin")
      printf '%s\n' "$library_report"
      if printf '%s\n' "$library_report" | grep -q 'not found'; then
        exit 1
      fi
      LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
        -s "-screen 0 1280x1024x24 +iglx" freeview -quit
    expected_exit_code: 0
