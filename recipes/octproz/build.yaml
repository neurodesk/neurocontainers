variables:
  upstream_version: "1.8.0"
  cuda_version: "12.8"
  cuda_package_suffix: "12-8"
  base_image_digest: sha256:133c78a0575303be34164d0b90137a042172bdf60696af01a3c424ab402d86e2
  install_dir: /opt/octproz-{{ context.upstream_version }}

name: octproz
version: "1.8.0"

description: GPU-accelerated open-source optical coherence tomography (OCT) raw interferogram reconstruction and 2D/3D visualization software with bundled Virtual OCT System plugin.

copyright:
  - license: GPL-3.0-or-later
    name: GNU General Public License v3.0 or later
    url: https://github.com/spectralcode/OCTproZ/blob/v{{ context.upstream_version }}/LICENSE

architectures:
  - x86_64

auto_update:
  method: sources
  container_version: octproz
  sources:
    - id: octproz
      method: github_release
      repo: spectralcode/OCTproZ
      target:
        variable: upstream_version
        fulltest_variable: upstream_version
    - id: cuda_base_image
      method: oci_digest
      dependency: true
      image: nvidia/cuda
      tag: 12.8.1-base-ubuntu24.04
      target:
        variable: base_image_digest

build:
  kind: neurodocker
  base-image: nvidia/cuda:12.8.1-base-ubuntu24.04@{{ context.base_image_digest }}
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        QT_X11_NO_MITSHM: "1"

    # Runtime libraries OCTproZ links against. libcuda.so.1 is not installed:
    # the host NVIDIA driver supplies it (apptainer --nv or NVIDIA container
    # runtime). cuobjdump and the driver stub let fulltest verify the GPU
    # kernels and headless startup without a GPU.
    - install:
        - ca-certificates
        - libcufft-{{ context.cuda_package_suffix }}
        - cuda-cuobjdump-{{ context.cuda_package_suffix }}
        - cuda-driver-dev-{{ context.cuda_package_suffix }}
        - libqt5core5t64
        - libqt5gui5t64
        - libqt5widgets5t64
        - libqt5opengl5t64
        - libqt5printsupport5t64
        - libgl1
        - libgl1-mesa-dri
        - libglu1-mesa
        - libx11-6
        - libxcb-xinerama0
        - libxcb-icccm4
        - libxcb-image0
        - libxcb-keysyms1
        - libxcb-randr0
        - libxcb-render-util0
        - libxcb-shape0
        - libxcb-xkb1
        - libxkbcommon-x11-0
        - libdbus-1-3
        - libfontconfig1
        - python3
        - xvfb

    - run:
        - apt-get update -qq
        - >-
          apt-get install -y -q --no-install-recommends
          cuda-nvcc-{{ context.cuda_package_suffix }}
          cuda-cudart-dev-{{ context.cuda_package_suffix }}
          cuda-profiler-api-{{ context.cuda_package_suffix }}
          libcufft-dev-{{ context.cuda_package_suffix }}
          qtbase5-dev
          qt5-qmake
          libqt5opengl5-dev
          libgl1-mesa-dev
          libglu1-mesa-dev
          libx11-dev
          g++
          make
        - mkdir -p /tmp/octproz
        - tar -xzf {{ get_file("octproz_source") }} --strip-components=1 -C /tmp/octproz
        - sed -i 's/^CUDA_DEFINES_FLAGS = .*/CUDA_DEFINES_FLAGS = -DENABLE_CUDA_ZERO_COPY/' /tmp/octproz/octproz_project/octproz/pri/cuda.pri
        - sed -i 's/-std=c++11/-std=c++17/' /tmp/octproz/octproz_project/octproz/pri/cuda.pri
        - sed -i 's/-lglut//g' /tmp/octproz/octproz_project/octproz/octproz.pro
        - mkdir -p /tmp/octproz/octproz_project/octproz_share_dev/release /tmp/octproz/octproz_project/octproz_share_dev/plugins/release
        - >-
          cd /tmp/octproz/octproz_project/octproz_devkit
          && qmake CONFIG+=release QMAKE_CXXFLAGS+=-fPIC QMAKE_CFLAGS+=-fPIC octproz_devkit.pro
          && make -j4
        - >-
          for p in octproz-virtual-oct-system octproz-demo-extension; do
          (cd "/tmp/octproz/octproz_project/octproz_plugins/$p"
          && qmake CONFIG+=release QMAKE_CXXFLAGS+=-fPIC QMAKE_CFLAGS+=-fPIC "${p}.pro"
          && make -j4) || exit 1;
          done
        - >-
          cd /tmp/octproz/octproz_project/octproz
          && LIBRARY_PATH=/usr/local/cuda-{{ context.cuda_version }}/lib64/stubs
          qmake CONFIG+=release
          QMAKE_CXXFLAGS+=-fPIC
          QMAKE_CFLAGS+=-fPIC
          QMAKE_LIBDIR+=/usr/local/cuda-{{ context.cuda_version }}/lib64/stubs
          QMAKE_LFLAGS+=-Wl,-rpath,/usr/local/cuda-{{ context.cuda_version }}/lib64
          octproz.pro
          && LIBRARY_PATH=/usr/local/cuda-{{ context.cuda_version }}/lib64/stubs make -j4
        - install -D -m 755 /tmp/octproz/octproz_project/octproz/OCTproZ {{ context.install_dir }}/lib/OCTproZ
        - mkdir -p {{ context.install_dir }}/lib/plugins
        - cp -a /tmp/octproz/octproz_project/octproz_share_dev/plugins/release/*.so {{ context.install_dir }}/lib/plugins/
        - cp -a /tmp/octproz/octproz_project/octproz/luts {{ context.install_dir }}/lib/luts
        - cp -a /tmp/octproz/octproz_project/octproz/docs {{ context.install_dir }}/lib/docs
        - install -D -m 644 /tmp/octproz/LICENSE {{ context.install_dir }}/LICENSE
        - install -D -m 755 {{ get_file("octproz_launcher.py") }} {{ context.install_dir }}/bin/OCTproZ
        - ln -sf OCTproZ {{ context.install_dir }}/bin/octproz
        - cd /
        - rm -rf /tmp/octproz
        - >-
          apt-get purge -y -q --auto-remove
          cuda-nvcc-{{ context.cuda_package_suffix }}
          cuda-cudart-dev-{{ context.cuda_package_suffix }}
          cuda-profiler-api-{{ context.cuda_package_suffix }}
          libcufft-dev-{{ context.cuda_package_suffix }}
          qtbase5-dev
          qt5-qmake
          libqt5opengl5-dev
          libgl1-mesa-dev
          libglu1-mesa-dev
          libx11-dev
          g++
          make
        - rm -rf /var/lib/apt/lists/*

    - environment:
        PATH: "{{ context.install_dir }}/bin:$PATH"

deploy:
  bins:
    - OCTproZ
    - octproz

gui_apps:
  - name: "OCTproZ"
    exec: "OCTproZ"

files:
  - name: octproz_source
    url: https://github.com/spectralcode/OCTproZ/archive/refs/tags/v{{ context.upstream_version }}.tar.gz
  - name: octproz_launcher.py
    contents: |
      #!/usr/bin/env python3
      import os
      import shutil
      import signal
      import subprocess
      import sys
      import tempfile


      def _is_writable_dir(path: str) -> bool:
          if not path:
              return False
          if os.path.isdir(path):
              return os.access(path, os.W_OK | os.X_OK)
          parent = os.path.dirname(os.path.abspath(path))
          return bool(parent) and os.path.isdir(parent) and os.access(parent, os.W_OK | os.X_OK)


      def main() -> int:
          script_dir = os.path.dirname(os.path.realpath(__file__))
          binary = os.path.join(os.path.dirname(script_dir), "lib", "OCTproZ")
          env = os.environ.copy()
          tmpdir = None
          proc = None

          try:
              for var, sub in (
                  ("XDG_CONFIG_HOME", "config"),
                  ("XDG_CACHE_HOME", "cache"),
                  ("XDG_DATA_HOME", "data"),
                  ("XDG_RUNTIME_DIR", "runtime"),
              ):
                  current = env.get(var, "")
                  if not _is_writable_dir(current):
                      if tmpdir is None:
                          tmpdir = tempfile.mkdtemp(prefix="octproz-xdg-")
                      target = os.path.join(tmpdir, sub)
                      os.makedirs(target, mode=0o700, exist_ok=True)
                      env[var] = target

              def _forward(signum, _frame):
                  if proc is not None and proc.poll() is None:
                      try:
                          proc.send_signal(signum)
                      except ProcessLookupError:
                          pass

              for sig in (signal.SIGTERM, signal.SIGINT, signal.SIGHUP):
                  if signal.getsignal(sig) != signal.SIG_IGN:
                      signal.signal(sig, _forward)

              proc = subprocess.Popen([binary, *sys.argv[1:]], env=env)
              rc = proc.wait()
              return (128 + (-rc)) if rc < 0 else rc
          finally:
              if tmpdir is not None:
                  shutil.rmtree(tmpdir, ignore_errors=True)


      if __name__ == "__main__":
          sys.exit(main())

categories:
  - "optical imaging"
  - "image reconstruction"
  - "visualization"
domains:
  - dermatology
  - microscopy
  - preclinical

readme: |-
  ----------------------------------
  ## octproz/{{ context.version }} ##

  OCTproZ is GPU-accelerated open-source software (GPL-3.0-or-later) for raw
  optical coherence tomography (OCT) interferogram reconstruction and real-time
  2D B-scan, en face, and 3D volume visualization.

  This container builds OCTproZ {{ context.upstream_version }} (`v{{ context.upstream_version }}`)
  from source with CUDA {{ context.cuda_version }} (native kernels for compute
  capability 5.2 through 12.0 plus PTX for newer GPUs) and bundles the in-repo
  Virtual OCT System and Demo Extension plugins, color lookup tables, and offline
  documentation.

  Requirements:
  - An NVIDIA GPU with a CUDA 12 capable driver (525 or newer). The driver library
    (`libcuda.so.1`) comes from the host, so launch with GPU passthrough (for
    example `apptainer exec --nv`).
  - Open test dataset for the Virtual OCT System:
    https://doi.org/10.6084/m9.figshare.12356705

  Example:
  ```
  OCTproZ
  ```

  More documentation: https://github.com/spectralcode/OCTproZ

  To run container outside of this environment: `ml octproz/{{ context.version }}`
  ----------------------------------

