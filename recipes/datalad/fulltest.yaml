datalad_version: "1.7.1"
git_annex_version: 10.20230126-3
venv: /opt/datalad
name: datalad
version: "1.7.1"
test_data:
  output_dir: test_output
setup:
  script: "#!/usr/bin/env bash\nset -e\nmkdir -p ${output_dir}\ngit config --global user.email \"user@neurodesk.github.io\"\
    \ngit config --global user.name \"Neurodesk User\"\nif [ -e /tmp/datalad-fulltest-dataset ] || [ -L /tmp/datalad-fulltest-dataset\
    \ ]; then\n  mv /tmp/datalad-fulltest-dataset \"/tmp/datalad-fulltest-dataset.stale.$$\" || true\nfi\nfresh_dataset_dir=\"\
    $(mktemp -d /tmp/datalad-fulltest-dataset.XXXXXX)\"\nln -sfn \"${fresh_dataset_dir}\" /tmp/datalad-fulltest-dataset\n"
tests:
- name: DataLad version check
  description: Verify the datalad CLI reports the version this container ships
  command: datalad --version 2>&1
  expected_output_contains: ${datalad_version}
- name: DataLad help output
  description: Verify the main help text renders
  command: datalad --help 2>&1 | head -20
  expected_output_contains: Comprehensive data management solution
- name: DataLad create dataset
  description: Create a new dataset from scratch
  command: datalad create /tmp/datalad-fulltest-dataset 2>&1
  expected_output_contains: create(ok)
- name: DataLad save file
  description: Save a tracked file into the dataset
  command: 'cd /tmp/datalad-fulltest-dataset

    printf ''hello\n'' > note.txt

    datalad save -m "add note" 2>&1

    '
  depends_on: DataLad create dataset
  expected_output_contains: save(ok)
- name: DataLad clean status
  description: Verify the dataset is clean after saving
  command: 'cd /tmp/datalad-fulltest-dataset

    datalad status 2>&1

    '
  depends_on: DataLad save file
  expected_output_contains: nothing to save, working tree clean
- name: installed distribution version
  description: Verify the venv holds the datalad release this container declares
  command: ${venv}/bin/python -m pip show datalad
  expected_output_contains: ${datalad_version}
- name: git-annex backend version
  description: Verify the pinned git-annex DataLad stores its data with
  command: dpkg-query -W -f='${Version}\n' git-annex
  expected_output_contains: ${git_annex_version}
- name: DataLad entry points resolve outside the venv
  description: A login shell resets PATH and git-annex resolves helpers by name
  command: bash -lc 'command -v datalad; command -v git-annex-remote-ora'
  expected_output_contains: /usr/local/bin/datalad
- name: git-annex is usable by datalad
  description: Verify datalad finds a working git-annex
  command: git annex version 2>&1 | head -1
  expected_output_contains: git-annex version

- name: clone and retrieve real annex content offline
  description: Retrieve an annexed binary from a local dataset clone and require exact bytes and matching content keys
  command: |
    set -euo pipefail
    task_dir=$(mktemp -d "${output_dir}/annex.XXXXXX")
    task_dir=$(cd "$task_dir" && pwd)
    datalad create "$task_dir/source"
    python - "$task_dir/source/signal.bin" <<'PYTHON'
    import sys
    from pathlib import Path
    Path(sys.argv[1]).write_bytes(bytes(range(256)) * 256)
    PYTHON
    # Force annex storage so this tests content retrieval, not plain Git data.
    git -C "$task_dir/source" annex add --force-large signal.bin
    datalad save -d "$task_dir/source" -m 'Add deterministic binary signal' signal.bin
    source_key=$(git -C "$task_dir/source" annex lookupkey signal.bin)
    test -n "$source_key"
    datalad clone "$task_dir/source" "$task_dir/clone"
    clone_key=$(git -C "$task_dir/clone" annex lookupkey signal.bin)
    test "$source_key" = "$clone_key"
    # A normal clone has the annex pointer, but has not fetched its content.
    test ! -f "$task_dir/clone/signal.bin"
    datalad get -d "$task_dir/clone" signal.bin
    cmp "$task_dir/source/signal.bin" "$task_dir/clone/signal.bin"
    python - "$task_dir/clone/signal.bin" <<'PYTHON'
    import sys
    from pathlib import Path
    data = Path(sys.argv[1]).read_bytes()
    assert data == bytes(range(256)) * 256
    assert len(data) == 65536
    PYTHON
    echo 'Offline annex clone and exact signal retrieval verified'
  expected_output_contains: Offline annex clone and exact signal retrieval verified
  expected_exit_code: 0
  timeout: 120
