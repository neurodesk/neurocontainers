variables:
  mricron_package_version: 1.2.20211006+dfsg-5
  dcm2niix_package_version: 1.0.20220720-1build1

name: mricron
version: 1.2.20211006
copyright:
  - license: BSD-2-Clause
    url: https://github.com/neurolabusc/MRIcron/blob/master/license.txt
architectures:
  - x86_64
  - aarch64
auto_update:
  method: sources
  local: []
  sources:
    - id: mricron
      method: apt
      package: mricron
      urls:
        - https://archive.ubuntu.com/ubuntu/dists/noble/universe/binary-amd64/Packages.gz
        - https://archive.ubuntu.com/ubuntu/dists/noble-updates/universe/binary-amd64/Packages.gz
        - https://ports.ubuntu.com/ubuntu-ports/dists/noble/universe/binary-arm64/Packages.gz
        - https://ports.ubuntu.com/ubuntu-ports/dists/noble-updates/universe/binary-arm64/Packages.gz
      target:
        variable: mricron_package_version
        fulltest_variable: mricron_package_version
    - id: dcm2niix
      method: apt
      package: dcm2niix
      urls:
        - https://archive.ubuntu.com/ubuntu/dists/noble/universe/binary-amd64/Packages.gz
        - https://archive.ubuntu.com/ubuntu/dists/noble-updates/universe/binary-amd64/Packages.gz
        - https://ports.ubuntu.com/ubuntu-ports/dists/noble/universe/binary-arm64/Packages.gz
        - https://ports.ubuntu.com/ubuntu-ports/dists/noble-updates/universe/binary-arm64/Packages.gz
      target:
        variable: dcm2niix_package_version
        fulltest_variable: dcm2niix_package_version

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
    - install:
        - ca-certificates
        - "dcm2niix={{ context.dcm2niix_package_version }}"
        - file
        - "mricron={{ context.mricron_package_version }}"
        - pigz
        - xauth
        - xvfb
    - run:
        - mkdir -p /opt/mricron
        - ln -s /usr/bin/mricron /opt/mricron/MRIcron
        - ln -s /usr/bin/dcm2niix /opt/mricron/dcm2niix
        - ln -s /usr/bin/pigz /opt/mricron/pigz_mricron
        - ln -s /usr/share/mricron /opt/mricron/Resources
    - environment:
        PATH: /opt/mricron:$PATH
    - environment:
        LC_ALL: C.UTF-8
        LANG: C.UTF-8
    - deploy:
        path:
          - /opt/mricron
        bins:
          - MRIcron
          - dcm2niix
    - boutique:
        name: mricron
        description: MRIcron is a cross-platform NIfTI format image viewer. It can load  multiple layers of images, generate volume renderings and draw regions  of interest. It also provides dcm2niix for converting DICOM images to  NIfTI format.
        tool-version: '{{ context.mricron_package_version }}'
        schema-version: '0.5'
        command-line: MRIcron [OPTIONS] [IMAGE_FILE]
        inputs:
          - name: image_file
            id: image_file
            description: NIfTI format image file to view
            type: File
            optional: true
            value-key: '[IMAGE_FILE]'
categories:
  - visualization
  - structural imaging
  - data organisation
structured_readme:
  description: MRIcron is a cross-platform NIfTI format image viewer. It can load multiple  layers of images, generate volume renderings and draw regions of interest.  It also includes dcm2niix for converting DICOM images to NIfTI format.
  example: |-
    ml mricron/{{ context.version }}
    MRIcron
    dcm2niix -h
  documentation: https://www.nitrc.org/plugins/mwiki/index.php/mricron:MainPage
  citation: 'Rorden C, Brett M. Stereotaxic display of brain lesions.  Behav Neurol. 2000;12(4):191-200. doi: 10.1155/2000/421719'
icon: data:image/png;base64,
readme: |-
  ----------------------------------
  ## mricron/{{ context.version }} ##

  MRIcron is a cross-platform NIfTI format image viewer. It can load multiple  layers of images, generate volume renderings and draw regions of interest.  It also includes dcm2niix for converting DICOM images to NIfTI format.

  Example:
  ```
  ml mricron/{{ context.version }}
  MRIcron
  dcm2niix -h
  ```

  More documentation can be found here: https://www.nitrc.org/plugins/mwiki/index.php/mricron:MainPage

  Citation:
  ```
  Rorden C, Brett M. Stereotaxic display of brain lesions.  Behav Neurol. 2000;12(4):191-200. doi: 10.1155/2000/421719
  ```

  To run container outside of this environment: ml mricron/{{ context.version }}

  ----------------------------------
