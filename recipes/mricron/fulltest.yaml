# mricron container test suite
# Tests for MRIcron and dcm2niix - DICOM/NIfTI viewer and converter
#
# MRIcron package includes:
#   - dcm2niix: DICOM to NIfTI converter (primary CLI tool)
#   - MRIcron: GUI viewer (requires X11 display)
#   - pigz_mricron: Compatibility name for parallel gzip compression
#   - Brain templates and lookup tables
#
# Test data: ds000001/sub-01 (OpenNeuro Balloon Analog Risk-taking Task)
#   - T1w: 160x192x192, 1x1.33x1.33mm (3D structural)
#   - inplaneT2: 2D T2 images
#   - BOLD: 64x64x33x300, 3.125x3.125x4mm, TR=2s (4D functional)
#
# Citation:
#   Rorden C, Brett M. Stereotaxic display of brain lesions.
#   Behav Neurol. 2000;12(4):191-200. doi: 10.1155/2000/421719
#
# Documentation: https://www.nitrc.org/plugins/mwiki/index.php/mricrogl:MainPage

name: mricron
version: "1.2.20211006"
mricron_amd64_version: 1.2.20211006+dfsg-5
mricron_arm64_version: 1.2.20211006+dfsg-5
dcm2niix_amd64_version: 1.0.20220720-1build1
dcm2niix_arm64_version: 1.0.20220720-1build1

required_files:
  - dataset: ds000001
    files:
      - sub-01/anat/sub-01_T1w.nii.gz
      - sub-01/anat/sub-01_inplaneT2.nii.gz
      - sub-01/func/sub-01_task-balloonanalogrisktask_run-01_bold.nii.gz

test_data:
  t1w: ds000001/sub-01/anat/sub-01_T1w.nii.gz
  t2: ds000001/sub-01/anat/sub-01_inplaneT2.nii.gz
  bold: ds000001/sub-01/func/sub-01_task-balloonanalogrisktask_run-01_bold.nii.gz
  output_dir: test_output

setup:
  host_script: |
    python3 - <<'PYTHON'
    from pathlib import Path
    import struct

    root = Path('${output_dir}') / 'dicom-phantom'
    source = root / 'dicom'
    source.mkdir(parents=True, exist_ok=True)
    (root / 'converted').mkdir(exist_ok=True)

    def element(group, tag, vr, value):
        if vr == 'US':
            raw = struct.pack('<H', value)
        elif isinstance(value, bytes):
            raw = value
        else:
            raw = str(value).encode('ascii')
        if len(raw) % 2:
            raw += b'\0' if vr in ('UI', 'OB', 'OW') else b' '
        prefix = struct.pack('<HH', group, tag) + vr.encode('ascii')
        if vr in ('OB', 'OW'):
            return prefix + b'\0\0' + struct.pack('<I', len(raw)) + raw
        return prefix + struct.pack('<H', len(raw)) + raw

    sop = '1.2.840.10008.5.1.4.1.1.4'
    for index in range(2):
        uid = '1.2.826.0.1.3680043.10.543.1.' + str(index + 1)
        meta = b''.join([
            element(2, 1, 'OB', b'\0\1'),
            element(2, 2, 'UI', sop),
            element(2, 3, 'UI', uid),
            element(2, 0x10, 'UI', '1.2.840.10008.1.2.1'),
            element(2, 0x12, 'UI', '1.2.826.0.1.3680043.10.543'),
        ])
        # Synthetic MR storage, explicit VR little endian, unsigned16-bit pixels.
        records = [
            (8, 8, 'CS', 'ORIGINAL\\PRIMARY\\M'),
            (8, 0x16, 'UI', sop), (8, 0x18, 'UI', uid),
            (8, 0x20, 'DA', '20260101'), (8, 0x30, 'TM', '120000'),
            (8, 0x60, 'CS', 'MR'), (8, 0x70, 'LO', 'Synthetic'),
            (8, 0x103e, 'LO', 'Native conversion phantom'),
            (0x10, 0x10, 'PN', 'Synthetic^Phantom'), (0x10, 0x20, 'LO', 'SYNTHETIC'),
            (0x18, 0x50, 'DS', '3'), (0x18, 0x80, 'DS', '1000'),
            (0x18, 0x81, 'DS', '10'), (0x18, 0x87, 'DS', '3'),
            (0x18, 0x88, 'DS', '3'),
            (0x20, 0xd, 'UI', '1.2.826.0.1.3680043.10.543.2'),
            (0x20, 0xe, 'UI', '1.2.826.0.1.3680043.10.543.3'),
            (0x20, 0x11, 'IS', '1'), (0x20, 0x13, 'IS', str(index + 1)),
            (0x20, 0x32, 'DS', '0\\0\\' + str(index * 3)),
            (0x20, 0x37, 'DS', '1\\0\\0\\0\\1\\0'),
            (0x20, 0x52, 'UI', '1.2.826.0.1.3680043.10.543.4'),
            (0x28, 2, 'US', 1), (0x28, 4, 'CS', 'MONOCHROME2'),
            (0x28, 0x10, 'US', 2), (0x28, 0x11, 'US', 3),
            (0x28, 0x30, 'DS', '2\\1.5'),
            (0x28, 0x100, 'US', 16), (0x28, 0x101, 'US', 16),
            (0x28, 0x102, 'US', 15), (0x28, 0x103, 'US', 0),
            (0x7fe0, 0x10, 'OW', struct.pack('<6H', *range(index * 6 + 1, index * 6 + 7))),
        ]
        payload = b''.join(element(*record) for record in records)
        (source / f'slice-{index}.dcm').write_bytes(
            bytes(128) + b'DICM' + element(2, 0, 'UL', struct.pack('<I', len(meta))) + meta + payload
        )
    # NIfTI y-axis row flip preserves the DICOM physical orientation.
    (root / 'expected-pixels.bin').write_bytes(struct.pack('<12H', 4,5,6,1,2,3,10,11,12,7,8,9))
    PYTHON

    python3 - <<'PYTHON'
    from pathlib import Path
    p=Path('${output_dir}') / 'mricron-gui-check.sh'
    p.write_text('#!/usr/bin/env bash\nset -euo pipefail\nimage=$(realpath "$1")\noutput=$(realpath "$2")\nmkdir -p "$output"\nsha256sum "$image" > "$output/input.sha256"\nexport XDG_CONFIG_HOME="$output/config"\nexport XDG_CACHE_HOME="$output/cache"\nmkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"\n# The released CLI disables preference saving for scripted display options.\n# Unset HOME to prevent reading or writing the caller\'s MRIcron preferences.\nenv -u HOME MRIcron "$image" -c -0 > "$output/application.log" 2>&1 &\napp_pid=$!\ncleanup() {\n  status=$?\n  trap - EXIT\n  if kill -0 "$app_pid" 2>/dev/null; then\n    kill "$app_pid"\n    if wait "$app_pid"; then :; else :; fi\n  fi\n  if [ "$status" -ne 0 ]; then cat "$output/application.log"; fi\n  exit "$status"\n}\ntrap cleanup EXIT\nmain_window=\'\'\nfor attempt in $(seq 1 100); do\n  kill -0 "$app_pid"\n  if windows=$(xdotool search --onlyvisible --pid "$app_pid" 2>/dev/null); then\n    for window in $windows; do\n      geometry=$(xdotool getwindowgeometry --shell "$window")\n      width=$(printf \'%s\\n\' "$geometry" | sed -n \'s/^WIDTH=//p\')\n      height=$(printf \'%s\\n\' "$geometry" | sed -n \'s/^HEIGHT=//p\')\n      if [ "$width" -ge 400 ] && [ "$height" -ge 300 ]; then\n        main_window=$window\n        break\n      fi\n    done\n  fi\n  if [ -n "$main_window" ]; then break; fi\n  sleep 0.2\ndone\ntest -n "$main_window"\nxdotool windowfocus --sync "$main_window"\nxdotool key --clearmodifiers ctrl+h\nhistogram=\'\'\nfor attempt in $(seq 1 100); do\n  kill -0 "$app_pid"\n  if windows=$(xdotool search --onlyvisible --pid "$app_pid" 2>/dev/null); then\n    for window in $windows; do\n      title=$(xdotool getwindowname "$window")\n      # MRIcron sets this title from the actually loaded image header filename.\n      case "$title" in\n        "Histogram: "*sub-01_T1w*) histogram=$window; break ;;\n      esac\n    done\n  fi\n  if [ -n "$histogram" ]; then break; fi\n  sleep 0.2\ndone\ntest -n "$histogram"\nxdotool getwindowname "$histogram" > "$output/histogram-title.txt"\nimport -window "$main_window" "$output/loaded-image.png"\n# Exclude window borders and toolbars: require image intensities in the center.\nconvert "$output/loaded-image.png" -gravity center -crop 60%x60%+0+0 +repage \\\n  -colorspace gray "$output/image-center.png"\ncolors=$(identify -format \'%k\' "$output/image-center.png")\ntest "$colors" -ge 16\nconvert "$output/image-center.png" -format \'%[fx:maxima-minima]\' info: | \\\n  awk \'{ if (($1 + 0) < 0.1) exit 1; found=1 } END { if (!found) exit 1 }\'\nxdotool windowfocus --sync "$histogram"\nxdotool key --clearmodifiers ctrl+w\nxdotool windowfocus --sync "$main_window"\nxdotool key --clearmodifiers alt+f\nxdotool key --clearmodifiers x\nfor attempt in $(seq 1 100); do\n  if ! kill -0 "$app_pid" 2>/dev/null; then break; fi\n  sleep 0.2\ndone\nif kill -0 "$app_pid" 2>/dev/null; then\n  echo \'MRIcron did not exit after its File/Exit command\' >&2\n  exit 1\nfi\nwait "$app_pid"\nsha256sum -c "$output/input.sha256"\necho \'MRIcron loaded the requested image, displayed its histogram and nonblank slices, and exited successfully\'\n')
    PYTHON
  script: |
    #!/usr/bin/env bash
    set -e
    mkdir -p test_output
    mkdir -p test_output/dcm2niix
    mkdir -p test_output/dicom_simulated

tests:
  # ==========================================================================
  # BASIC FUNCTIONALITY - Version and Help
  # ==========================================================================
  - name: dcm2niix version check
    description: Verify dcm2niix reports the upstream version encoded in its tracked package
    command: |
      set -eu
      expected=$(dpkg-query -W -f='${Version}' dcm2niix | sed 's/[+-].*//')
      set +e
      output=$(dcm2niix --version 2>&1)
      status=$?
      set -e
      test "$status" -eq 3
      printf '%s\n' "$output"
      printf '%s\n' "$output" | grep -F "v${expected}"
      echo "version matches package"
    expected_output_contains: version matches package
  - name: installed package versions
    description: Verify the installed packages match the automatically tracked versions
    command: |
      case "$(dpkg --print-architecture)" in
        amd64)
          mricron_expected="${mricron_amd64_version}"
          dcm2niix_expected="${dcm2niix_amd64_version}"
          ;;
        arm64)
          mricron_expected="${mricron_arm64_version}"
          dcm2niix_expected="${dcm2niix_arm64_version}"
          ;;
        *) exit 1 ;;
      esac
      test "$(dpkg-query -W -f='${Version}' mricron)" = "$mricron_expected" || exit 1
      test "$(dpkg-query -W -f='${Version}' dcm2niix)" = "$dcm2niix_expected" || exit 1
      echo "Installed package versions match this architecture"
    expected_output_contains: "Installed package versions match this architecture"

  - name: native executable architectures
    description: Verify MRIcron and dcm2niix executables match the container architecture
    command: |
      case "$(dpkg --print-architecture)" in
        amd64) expected='x86-64' ;;
        arm64) expected='ARM aarch64' ;;
        *) exit 1 ;;
      esac
      count=$(file /usr/lib/mricron/mricron /usr/bin/dcm2niix | grep -Fc "$expected")
      if [ "$count" -ne 2 ]; then
        file /usr/lib/mricron/mricron /usr/bin/dcm2niix
        exit 1
      fi
      echo "native executables"
    expected_output_contains: "native executables"

  - name: dcm2niix help
    description: Verify dcm2niix help is accessible
    command: dcm2niix -h 2>&1
    expected_output_contains: dcm2niiX
  - name: dcm2niix usage without args
    description: Verify dcm2niix shows usage when run without arguments
    command: dcm2niix 2>&1
    expected_output_contains: 'usage: dcm2niix'
  - name: pigz_mricron version check
    description: Verify pigz_mricron utility is available
    command: pigz_mricron --help 2>&1
    expected_output_contains: pigz

  # ==========================================================================
  # DCM2NIIX - NIfTI Conversion Tests (using existing NIfTI files)
  # ==========================================================================
  - name: dcm2niix generates defaults file
    description: Test -g option to generate defaults file
    command: dcm2niix -g o 2>&1
    expected_output_contains: dcm2niiX
  - name: dcm2niix defaults file info
    description: Test -g i option to show defaults info
    command: dcm2niix -g i 2>&1
    expected_output_contains: dcm2niiX

  # ==========================================================================
  # DCM2NIIX - Output Format Tests
  # Empty-input checks exercise option parsing; the synthetic DICOM test below verifies real conversion
  # ==========================================================================
  - name: dcm2niix filename pattern info
    description: Display filename format options
    command: dcm2niix -f "%p_%s_%d" 2>&1
    expected_output_contains: dcm2niiX
  - name: dcm2niix compression level 1
    description: Test fastest compression option syntax
    command: dcm2niix -1 -h 2>&1
    expected_output_contains: dcm2niiX
  - name: dcm2niix compression level 9
    description: Test smallest compression option syntax
    command: dcm2niix -9 -h 2>&1
    expected_output_contains: dcm2niiX
  - name: dcm2niix BIDS sidecar only mode
    description: Test -b o option for BIDS-only conversion
    command: dcm2niix -b o -h 2>&1
    expected_output_contains: dcm2niiX
  - name: dcm2niix verbose mode
    description: Test verbose output option
    command: dcm2niix -v 2 -h 2>&1
    expected_output_contains: dcm2niiX
  - name: dcm2niix XML features
    description: Test Slicer-format XML output
    command: dcm2niix --xml 2>&1
    expected_output_contains: xml

  # ==========================================================================
  # DCM2NIIX - Empty/Invalid Directory Handling
  # ==========================================================================
  - name: dcm2niix empty directory handling
    description: Test behavior with empty directory
    command: dcm2niix test_output/dcm2niix 2>&1
    expected_output_contains:
    - dcm2niiX
    - Unable to find any DICOM
    expected_exit_code: 2
  - name: dcm2niix output directory option
    description: Test -o output directory specification
