    expected_output_contains: "pigz_mricron"

  - name: Resources directory in PATH
    description: Verify Resources directory is in PATH for dcm2niix
    command: case ":$PATH:" in *:/opt/mricron:*) echo "mricron path present" ;; *) exit 1 ;; esac
    expected_output_contains: mricron path present

  # ==========================================================================
  # GUI RUNTIME VALIDATION
  # ==========================================================================
  - name: MRIcron opens an image
    description: Open the real T1 image, require its named histogram and nonblank slice pixels, then exit through File/Exit with the input unchanged
    command: |
      set -eu
      mkdir -p "${output_dir}/mricron-gui"
      timeout 90s xvfb-run -a -s '-screen 0 1280x1024x24' bash "${output_dir}/mricron-gui-check.sh" "${t1w}" "${output_dir}/mricron-gui"
    expected_exit_code: 0
    timeout: 120
    expected_output_contains: MRIcron loaded the requested image, displayed its histogram and nonblank slices, and exited successfully
  - name: Convert a synthetic MR series with exact pixels and physical geometry
    description: Convert two real DICOM slices through internal gzip and verify NIfTI voxel values, dimensions, RAS affine and BIDS timing units
    command: "set -euo pipefail\nroot=\"${output_dir}/dicom-phantom\"\ndcm2niix -b y -z i -f phantom -o \"$root/converted\" \"$root/dicom\"\nimage=\"$root/converted/phantom.nii\"\ngzip -dc \"$image.gz\" > \"$image\"\ntest \"$(od -An -v -tu4 -j0 -N4 \"$image\" | xargs)\" = \"348\"\ntest \"$(od -An -v -tu2 -j40 -N8 \"$image\" | xargs)\" = \"3 3 2 2\"\ntest \"$(od -An -v -tu2 -j70 -N4 \"$image\" | xargs)\" = \"512 16\"\nod -An -v -tf4 -j80 -N12 \"$image\" | awk 'NF { ok = (NF == 3 && $1 == 1.5 && $2 == 2 && $3 == 3) } END { exit !ok }'\nod -An -v -tf4 -j108 -N4 \"$image\" | awk 'NF { ok = (NF == 1 && $1 == 352) } END { exit !ok }'\nod -An -v -tf4 -j280 -N48 \"$image\" | awk '\n  BEGIN { split(\"-1.5 0 0 0 0 2 0 -2 0 0 3 0\", expected, \" \") }\n  { for (i = 1; i <= NF; i++) { n++; if (($i + 0) != (expected[n] + 0)) exit 1 } }\n  END { if (n != 12) exit 1 }\n'\ndd if=\"$image\" of=\"$root/actual-pixels.bin\" bs=1 skip=352 status=none\ncmp \"$root/expected-pixels.bin\" \"$root/actual-pixels.bin\"\
      \nsidecar=\"$root/converted/phantom.json\"\ngrep -Eq '\"Modality\":[[:space:]]*\"MR\"' \"$sidecar\"\ngrep -Eq '\"MagneticFieldStrength\":[[:space:]]*3,' \"$sidecar\"\ngrep -Eq '\"EchoTime\":[[:space:]]*0[.]01,' \"$sidecar\"\ngrep -Eq '\"RepetitionTime\":[[:space:]]*1,' \"$sidecar\"\necho \"Synthetic DICOM conversion pixels, geometry and BIDS timing verified\"\n"
    expected_output_contains: Synthetic DICOM conversion pixels, geometry and BIDS timing verified
    expected_exit_code: 0
    timeout: 120

