variables:
  mne_version: 1.1.0
  vscode_version: "1.136.1"
  pipeline_commit: a792f818dda95bfe63e0ab0f0011d54c9818f1ad

name: mneextended
version: 1.1.0

architectures:
  - x86_64

auto_update:
  method: sources
  local: []
  sources:
  - id: mne
    method: webpage
    url: https://api.anaconda.org/package/conda-forge/mne
    version_regex: '"latest_version":\s*"(?P<version>\d+(?:\.\d+)+)"'
    target:
      variable: mne_version
      fulltest_variable: mne_version
  - id: vscode
    method: webpage
    target:
      variable: vscode_version
    url: https://update.code.visualstudio.com/api/update/linux-x64/stable/latest
    version_regex: '"productVersion":\s*"(?P<version>\d+(?:\.\d+)+)"'
  - id: mne-bids-pipeline
    method: github_commit
    repo: mne-tools/mne-bids-pipeline
    ref: main
    target:
      variable: pipeline_commit

build:
  kind: neurodocker
  base-image: debian:bullseye
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
    - install:
        - xdg-utils
        - unzip
        - git
        - apt-transport-https
        - ca-certificates
        - coreutils
        - curl
        - gnome-keyring
        - gnupg
        - libnotify4
        - wget
        - libnss3
        - libxkbfile1
        - libsecret-1-0
        - libgtk-3-0
        - libxss1
        - libgbm1
        - libxshmfence1
        - libasound2
        - libglu1-mesa
        - libgl1-mesa-dri
        - mesa-utils
        - libgl1-mesa-glx
    - run:
        - cp {{ get_file("mne_extended_yml") }} /opt/mne-extended.yml
    - template:
        name: miniconda
        version: py310_25.5.1-0
        install_path: /opt/miniconda
        env_name: mne-extended
        mamba: "true"
        yaml_file: /opt/mne-extended.yml
    - run:
        - /opt/miniconda/envs/mne-extended/bin/python -c "import autoreject; import mne; import mne_bids; import mnelab"
        - cp {{ get_file("vscode_deb") }} vscode.deb
        - apt install ./vscode.deb
        - rm -rf ./vscode.deb
        - code --extensions-dir=/opt/vscode-extensions --user-data-dir=/opt/vscode-data --install-extension ms-python.python && code --extensions-dir=/opt/vscode-extensions --user-data-dir=/opt/vscode-data --install-extension ms-python.vscode-pylance && code --extensions-dir=/opt/vscode-extensions --user-data-dir=/opt/vscode-data --install-extension ms-toolsai.jupyter && code --extensions-dir=/opt/vscode-extensions --user-data-dir=/opt/vscode-data --install-extension ms-toolsai.jupyter-keymap && code --extensions-dir=/opt/vscode-extensions --user-data-dir=/opt/vscode-data --install-extension ms-toolsai.jupyter-renderers
    - environment:
        DONT_PROMPT_WSL_INSTALL: "1"
    - workdir: /opt/
    - run:
        - mkdir -p /opt/mne-bids-pipeline

        - tar xz -f {{ get_file("mne_bids_pipeline_tar_gz") }} --strip-components=1 -C /opt/mne-bids-pipeline
        - chmod a+rwx /opt/mne-bids-pipeline -R
    - copy: code /usr/local/sbin/code
    - run:
        - chmod a+x /usr/local/sbin/code
        - chmod a+rwx /opt/vscode-extensions -R
    - environment:
        XDG_RUNTIME_DIR: /neurodesktop-storage
        RUNLEVEL: "3"
    - user: neuro

deploy:
  bins:
    - code

readme: |-

  ----------------------------------
  ## mneextended/{{ context.version }} ##
  Python MNE environment with VScode

  This environment contains MNE Python and some additional tools with dependencies (MNE BIDS Pipeline, MNE-connectivity, MNE-icalabel, Neurokit2)

  Example:
  ```
  source /opt/miniconda/etc/profile.d/conda.sh
  conda activate mne-extended
  ```

  More documentation can be found here: https://mne.tools/stable/index.html
  To cite MNE Python see here: https://mne.tools/stable/overview/cite.html


  To use the MNE BIDS Pipeline (https://mne.tools/mne-bids-pipeline/)
  ```
  python /opt/mne-bids-pipeline/run.py --config=/path/to/your/custom_config.py
  ```

  To run applications outside of this container: ml mneextended/{{ context.version }}
  Note the use of the module system does not currently interface with MNE and conda environments in this container

  ----------------------------------

files:
- name: mne_extended_yml
  contents: |
    name: mne-extended
    channels:
      - conda-forge

    dependencies:
      - python=3.12
      - setuptools<81
      - mne={{ context.mne_version }}
      - jupyter
      - mne-bids
      - mnelab
      - nb_conda_kernels
      - pytables
      - h5py
      - h5io
      - pymatreader
      - seaborn
      - statsmodels
      - pybv
      - scikit-learn
      - pyxdf
      - pyEDFlib
      - neurokit2
      - autoreject
      - coloredlogs
      - pandas
      - openpyxl
      - json_tricks
      - fire
      - typing_extensions
      - python-picard
      - dask
      - distributed
      - psutil
      - joblib
      - jupyter-server-proxy
      - pyqt
      - pyvista
      - pyvistaqt
      - hdf5
      - mne-icalabel
- name: code
  filename: code
- name: vscode_deb
  url: https://update.code.visualstudio.com/{{ context.vscode_version }}/linux-deb-x64/stable
- name: mne_bids_pipeline_tar_gz
  url: https://github.com/mne-tools/mne-bids-pipeline/archive/{{ context.pipeline_commit }}.tar.gz

categories:
  - electrophysiology
  - programming

icon: data:image/png;base64,
