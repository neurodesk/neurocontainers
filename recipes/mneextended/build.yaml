variables:
  debian_security_snapshot: 20260901T000000Z
  mne_version: "1.13.2"
  autoreject_version: "0.5.1"
  mne_bids_version: "0.20.0"
  mnelab_version: 1.5.4
  vscode_version: "1.140.0"
  flux_commit: "6310101dc1957c2cf5370e1c0d21c6ff94e3457e"
  openneuro_version: "2026.9.1"
  pipeline_commit: "e256fa9be6d826b968d3b536710375b2d5f15fa1"

name: mneextended
version: "1.2.0"

architectures:
  - x86_64

auto_update:
  container_version: false
  method: sources
  local: []
  sources:
  - id: mne
    method: webpage
    url: https://api.anaconda.org/package/conda-forge/mne
    version_regex: '"latest_version":\s*"(?P<version>\d+(?:\.\d+)+)"'
    target:
      variable: mne_version
      fulltest_variable: mne_version
  - id: autoreject
    method: webpage
    url: https://api.anaconda.org/package/conda-forge/autoreject
    version_regex: '"latest_version":\s*"(?P<version>\d+(?:\.\d+)+)"'
    target:
      variable: autoreject_version
      fulltest_variable: autoreject_version
  - id: mne-bids
    method: webpage
    url: https://api.anaconda.org/package/conda-forge/mne-bids
    version_regex: '"latest_version":\s*"(?P<version>\d+(?:\.\d+)+)"'
    target:
      variable: mne_bids_version
      fulltest_variable: mne_bids_version
  - id: mnelab
    method: webpage
    url: https://api.anaconda.org/package/conda-forge/mnelab
    version_regex: '"latest_version":\s*"(?P<version>\d+(?:\.\d+)+)"'
    target:
      variable: mnelab_version
      fulltest_variable: mnelab_version
  - id: vscode
    dependency: true
    method: webpage
    target:
      variable: vscode_version
      fulltest_variable: vscode_version
    url: https://update.code.visualstudio.com/api/update/linux-x64/stable/latest
    version_regex: '"productVersion":\s*"(?P<version>\d+(?:\.\d+)+)"'
  - id: mne-bids-pipeline
    method: github_commit
    repo: mne-tools/mne-bids-pipeline
    ref: main
    target:
      variable: pipeline_commit
      fulltest_variable: pipeline_commit

  - id: flux
    method: github_commit
    repo: Neuronal-Oscillations/FLUX
    ref: main
    target:
      variable: flux_commit
      fulltest_variable: flux_commit
  - id: openneuro-py
    method: pypi
    package: openneuro-py
    dependency: true
    target:
      variable: openneuro_version
      fulltest_variable: openneuro_version

copyright:
  - license: BSD-3-Clause
    url: https://github.com/Neuronal-Oscillations/FLUX/blob/{{ context.flux_commit }}/LICENSE

build:
  kind: neurodocker
  base-image: debian:bullseye
  pkg-manager: apt
  add-default-template: false
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
        TZ: UTC
    - run:
        - mkdir -p /tmp/debian-ca-certificates /etc/ssl/certs
        - dpkg-deb --extract {{ get_file("debian_ca_certificates") }} /tmp/debian-ca-certificates
        - cat /tmp/debian-ca-certificates/usr/share/ca-certificates/mozilla/*.crt > /etc/ssl/certs/ca-certificates.crt
        - rm -rf /tmp/debian-ca-certificates
        - sed -i 's|^deb http://deb.debian.org/debian-security |deb [check-valid-until=no] https://snapshot.debian.org/archive/debian-security/{{ context.debian_security_snapshot }}/ |; s|http://|https://|g' /etc/apt/sources.list

    - copy: mneextended-run /usr/local/bin/mneextended-run
    - copy: container_entrypoint /usr/local/bin/container-entrypoint
    - run:
        - chmod a+x /usr/local/bin/mneextended-run

    - entrypoint: /usr/local/bin/container-entrypoint

    - install:
        - apt-utils
        - bzip2
        - locales
        - tzdata
        - xdg-utils
        - unzip
        - git
        - apt-transport-https
        - ca-certificates
        - coreutils
        - curl
        - gnome-keyring
        - gnupg
        - libnotify4
        - wget
        - libnss3
        - libxkbfile1
        - libsecret-1-0
        - libgtk-3-0
        - libxss1
        - libgbm1
        - libxshmfence1
        - libasound2
        - libglu1-mesa
        - libgl1-mesa-dri
        - mesa-utils
        - libgl1-mesa-glx
    - run:
        - sed -i 's/^# *en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen
        - locale-gen en_US.UTF-8
        - update-locale LANG=en_US.UTF-8
        - ln -snf /usr/share/zoneinfo/UTC /etc/localtime
        - echo UTC > /etc/timezone
        - chmod 777 /opt

    - run:
        - cp {{ get_file("mne_extended_yml") }} /opt/mne-extended.yml
    - template:
        name: miniconda
        version: py310_25.5.1-0
        install_path: /opt/miniconda
        env_name: mne-extended
        mamba: "true"
        yaml_file: /opt/mne-extended.yml
    - run:
        - /opt/miniconda/envs/mne-extended/bin/python -c "import autoreject; import mne; import mne_bids; import mnelab"
        - /opt/miniconda/envs/mne-extended/bin/python -m pip check
        - cp {{ get_file("vscode_deb") }} vscode.deb
        - apt install ./vscode.deb
        - rm -rf ./vscode.deb
        - code --extensions-dir=/opt/vscode-extensions --user-data-dir=/opt/vscode-data --install-extension ms-python.python && code --extensions-dir=/opt/vscode-extensions --user-data-dir=/opt/vscode-data --install-extension ms-python.vscode-pylance && code --extensions-dir=/opt/vscode-extensions --user-data-dir=/opt/vscode-data --install-extension ms-toolsai.jupyter && code --extensions-dir=/opt/vscode-extensions --user-data-dir=/opt/vscode-data --install-extension ms-toolsai.jupyter-keymap && code --extensions-dir=/opt/vscode-extensions --user-data-dir=/opt/vscode-data --install-extension ms-toolsai.jupyter-renderers
    - environment:
        DONT_PROMPT_WSL_INSTALL: "1"
    - workdir: /opt/
    - run:
        - mkdir -p /opt/mne-bids-pipeline

        - tar xz -f {{ get_file("mne_bids_pipeline_tar_gz") }} --strip-components=1 -C /opt/mne-bids-pipeline
        # Upstream dc6d61b passes a tuple as the --logger-level help, which makes --help crash
        - sed -i 's/"Default will use the value in the configuration file\.",$/"Default will use the value in the configuration file."/' /opt/mne-bids-pipeline/mne_bids_pipeline/_main.py
        - /opt/miniconda/envs/mne-extended/bin/python -m pip install --no-cache-dir 'mne=={{ context.mne_version }}' 'autoreject=={{ context.autoreject_version }}' 'mne-bids=={{ context.mne_bids_version }}' 'mnelab=={{ context.mnelab_version }}' /opt/mne-bids-pipeline
        - /opt/miniconda/envs/mne-extended/bin/python -m pip check
        - chmod a+rwx /opt/mne-bids-pipeline -R
    - run:
        - mkdir -p /tmp/flux-source /opt/flux
        - tar -xzf {{ get_file("flux_source") }} -C /tmp/flux-source --strip-components=1
        - cp -a /tmp/flux-source/MNEPython /tmp/flux-source/LICENSE /opt/flux/
        - printf '%s\n' '{{ context.flux_commit }}' > /opt/flux/SOURCE_COMMIT
        - rm -rf /tmp/flux-source
        - /opt/miniconda/envs/mne-extended/bin/python -m pip install --no-cache-dir 'openneuro-py=={{ context.openneuro_version }}'
        - /opt/miniconda/envs/mne-extended/bin/python -m pip check
    - copy: flux-smoke-test.py /opt/flux/flux-smoke-test.py
    - copy: FLUX.md /opt/flux/README.md
    - copy: code /usr/local/sbin/code
    - run:
        - chmod a+x /usr/local/sbin/code
        - chmod a+rwx /opt/vscode-extensions -R
    - environment:
        XDG_RUNTIME_DIR: /neurodesktop-storage
        NUMBA_CACHE_DIR: /tmp/numba-mneextended
        RUNLEVEL: "3"
    - user: neuro

deploy:
  bins:
    - code

readme: |-
  ## FLUX MNE notebooks

  The maintained FLUX MNE notebooks and their images are in `/opt/flux/MNEPython`.
  Copy that directory into a writable project and open it with `code` or Jupyter
  using the MNE extended Python environment. Read `/opt/flux/README.md` for the
  pinned reference dataset, first-look smoke command, and external tool requirements.


  ----------------------------------
  ## mneextended/{{ context.version }} ##
  Python MNE environment with VScode

  This environment contains MNE Python and some additional tools with dependencies (MNE BIDS Pipeline, MNE-connectivity, MNE-icalabel, Neurokit2)

  Example:
  ```
  source /opt/miniconda/etc/profile.d/conda.sh
  conda activate mne-extended
  ```

  More documentation can be found here: https://mne.tools/stable/index.html
  To cite MNE Python see here: https://mne.tools/stable/overview/cite.html


  To use the MNE BIDS Pipeline (https://mne.tools/mne-bids-pipeline/)
  ```
  mne_bids_pipeline --config=/path/to/your/custom_config.py
  ```

  To run applications outside of this container: ml mneextended/{{ context.version }}
  Note the use of the module system does not currently interface with MNE and conda environments in this container

  ----------------------------------

files:
- name: flux_source
  url: https://github.com/Neuronal-Oscillations/FLUX/archive/{{ context.flux_commit }}.tar.gz
- name: flux-smoke-test.py
  filename: flux-smoke-test.py
- name: FLUX.md
  filename: FLUX.md
- name: mneextended-run
  filename: mneextended-run
  executable: true
- name: container_entrypoint
  executable: true
  contents: |
    #!/bin/sh
    set -e
    export USER="${USER:-$(id -un)}"
    if [ "$#" -eq 0 ]; then
      set -- /bin/bash
    fi
    exec /usr/local/bin/mneextended-run "$@"
- name: debian_ca_certificates
  url: https://snapshot.debian.org/archive/debian-security/{{ context.debian_security_snapshot }}/pool/updates/main/c/ca-certificates/ca-certificates_20250419~deb12u1~deb11u1_all.deb
  sha256: a588acf469f96e272fe3e83225f68ddcda72a95e2dd139086d5edc165d3939e3
- name: mne_extended_yml
  contents: |
    name: mne-extended
    channels:
      - conda-forge

    dependencies:
      - python=3.12
      - setuptools<81
      - mne={{ context.mne_version }}
      - jupyter
      - mne-bids={{ context.mne_bids_version }}
      - mnelab={{ context.mnelab_version }}
      - nb_conda_kernels
      - pytables
      - h5py
      - h5io
      - pymatreader
      - seaborn
      - statsmodels
      - pybv
      - scikit-learn
      - pyxdf
      - pyEDFlib
      - neurokit2
      - autoreject={{ context.autoreject_version }}
      - coloredlogs
      - pandas<3
      - openpyxl
      - json_tricks
      - fire
      - typing_extensions
      - python-picard
      - dask
      - distributed
      - psutil
      - joblib
      - jupyter-server-proxy
      - pyqt
      - pyvista
      - pyvistaqt
      - hdf5
      - mne-icalabel
- name: code
  filename: code
- name: vscode_deb
  url: https://update.code.visualstudio.com/{{ context.vscode_version }}/linux-deb-x64/stable
- name: mne_bids_pipeline_tar_gz
  url: https://github.com/mne-tools/mne-bids-pipeline/archive/{{ context.pipeline_commit }}.tar.gz

categories:
  - electrophysiology
  - programming

icon: data:image/png;base64,
