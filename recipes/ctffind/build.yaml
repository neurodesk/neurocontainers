name: ctffind
version: 4.1.14
copyright:
  - name: Janelia Research Campus Software License 1.2
    url: https://www.janelia.org/open-science/software-licensing
architectures:
  - x86_64
variables:
  upstream_version: 4.1.14
auto_update:
  method: sources
  container_version: ctffind
  sources:
    - id: ctffind
      method: artifact_listing
      url: https://grigoriefflab.umassmed.edu/ctf_estimation_ctffind_ctftilt
      download_base: https://grigoriefflab.umassmed.edu/system/
      version_regex: https://grigoriefflab\.umassmed\.edu/system/tdf\?path=ctffind-(?P<version>4\.\d+\.\d+)\.tar\.gz&file=1
      target:
        file: ctffind_source
        variables:
          upstream_version: version
build:
  kind: neurodocker
  base-image: ubuntu:22.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
    - install:
        - libwxbase3.0-0v5
        - libfftw3-single3
        - libtiff5
        - libjpeg-turbo8
        - zlib1g
        - libgomp1
        - python3-numpy
    - workdir: /tmp
    - run:
        - apt-get update -qq
        - apt-get install -y -q --no-install-recommends g++ make libwxbase3.0-dev libfftw3-dev libtiff-dev libjpeg-dev zlib1g-dev
        - mkdir /tmp/ctffind-src
        - tar -xzf {{ get_file("ctffind_source") }} -C /tmp/ctffind-src --strip-components=1
        - cd /tmp/ctffind-src
        - sed -i -E 's/^bool (ComputeRotationalAverageOfPowerSpectrum|RescaleSpectrumAndRotationalAverage)\(/void \1(/' src/programs/ctffind/ctffind.cpp
        - test "$(grep -cE '^void (ComputeRotationalAverageOfPowerSpectrum|RescaleSpectrumAndRotationalAverage)\(' src/programs/ctffind/ctffind.cpp)" -eq 4
        - ./configure --disable-debugmode --enable-openmp --prefix=/opt/ctffind-{{ context.upstream_version }}
        - make -j4
        - make install
        - install -D -m 644 COPYING /opt/ctffind-{{ context.upstream_version }}/share/doc/ctffind/COPYING
        - cd /
        - rm -rf /tmp/ctffind-src
        - apt-get purge -y -q --auto-remove g++ make libwxbase3.0-dev libfftw3-dev libtiff-dev libjpeg-dev zlib1g-dev
        - rm -rf /var/lib/apt/lists/*
        - "! ldd /opt/ctffind-{{ context.upstream_version }}/bin/ctffind | grep 'not found'"
    - environment:
        PATH: /opt/ctffind-{{ context.upstream_version }}/bin:$PATH
files:
  - name: ctffind_source
    url: https://grigoriefflab.umassmed.edu/system/tdf?path=ctffind-4.1.14.tar.gz&file=1
    sha256: db17b2ebeb3c3b2b3764e42b820cd50d19ccccf6956c64257bfe5d5ba6b40cb5
deploy:
  bins:
    - ctffind
categories:
  - cryo EM
readme: |
  ## ctffind/{{ context.version }}

  CTFFIND estimates the defocus, astigmatism and optional phase shift of
  electron micrographs by fitting the contrast transfer function (CTF) to
  their amplitude spectra. This container builds CTFFIND
  {{ context.upstream_version }} from the official source release with
  FFTW and OpenMP threading. It runs on the CPU and needs no GPU.

  CTFFIND {{ context.upstream_version }} is the release that RELION drives
  through its "Use CTFFIND-4.1?" option. CTFFIND 5 adds an extra
  "Determine sample thickness?" prompt that RELION does not answer, so
  RELION jobs stop at the expert-options prompt.

  Run `ctffind` and answer the prompts, or script them from standard input:

  ```
  ctffind <<EOF
  micrograph.mrc
  diagnostic_output.mrc
  1.0
  300
  2.7
  0.07
  512
  30
  5
  5000
  50000
  100
  no
  yes
  yes
  500
  no
  no
  EOF
  ```

  The answers are: input micrograph, diagnostic output, pixel size (A),
  voltage (kV), spherical aberration (mm), amplitude contrast, spectrum
  size, minimum and maximum resolution (A), minimum and maximum defocus (A),
  defocus step (A), known astigmatism, exhaustive search, astigmatism
  restraint, tolerated astigmatism (A), phase shift and expert options.
  CTFFIND writes `diagnostic_output.txt` with the fitted defocus values
  and `diagnostic_output_avrot.txt` with the 1D fit profiles.

  To run CTFFIND from a RELION container, set
  `RELION_CTFFIND_EXECUTABLE` to this container's `ctffind` executable.

  CTFFIND is distributed under the Janelia Research Campus Software
  License 1.2. The licence text is installed at
  `/opt/ctffind-{{ context.upstream_version }}/share/doc/ctffind/COPYING`.

  Citation: Rohou A, Grigorieff N. CTFFIND4: Fast and accurate defocus
  estimation from electron micrographs. J Struct Biol. 2015;192(2):216-221.
  https://doi.org/10.1016/j.jsb.2015.08.008

  Documentation: https://grigoriefflab.umassmed.edu/ctffind4
icon: data:image/png;base64,
