name: petu
version: 0.0.7

description: PeTu segments paediatric brain tumours into T2-hyperintense, enhancing and cystic components from multi-parametric MRI.

copyright:
  - license: Apache-2.0
    url: https://github.com/BrainLesion/PeTu/blob/main/LICENSE

architectures:
  - x86_64

variables:
  # Version of the model weights baked into the image. Bumping this is a
  # deliberate act: the build asserts the archive Zenodo serves matches, so new
  # upstream weights fail the build here instead of silently changing results.
  weights_version: "1.0.0"
  venv: /opt/petu-0.0.7

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        VENV: "{{ context.venv }}"
        # These default under $HOME, which does not exist at container runtime.
        MPLCONFIGDIR: /tmp/mpl-petu
        XDG_CACHE_HOME: /tmp/cache-petu
        PYTHONNOUSERSITE: "1"
        PATH: "{{ context.venv }}/bin:$PATH"

    - install:
        - ca-certificates
        - fonts-dejavu-core
        - libgl1
        - libglib2.0-0t64
        - libgomp1
        - python3
        - unzip
        - python3-pip
        - python3-venv

    - run:
        - python3 -m venv "${VENV}"
        - . "${VENV}/bin/activate" && python -m pip install --no-cache-dir --upgrade pip setuptools wheel
        # CUDA wheels: these are GPU inference tools and the default index
        # already resolves to CUDA builds, so pin the index explicitly rather
        # than letting the resolver choose a different one on a rebuild.
        - . "${VENV}/bin/activate" && python -m pip install --no-cache-dir
          --extra-index-url https://download.pytorch.org/whl/cu124 torch
        - . "${VENV}/bin/activate" && python -m pip install --no-cache-dir "petu==0.0.7"
        # Import at build time so a broken resolve fails here rather than on
        # first use; read the version from distribution metadata because these
        # packages do not all define __version__.
        - . "${VENV}/bin/activate" && python -c "import importlib.metadata as md; import petu; print('petu', md.version('petu'))"
        # Bake the model weights into the image so inference runs offline and every
        # run uses the same weights. Adds ~2.8GB to the image.
        #
        # Upstream's own downloader cannot be used: it fetches Zenodo's
        # files-archive endpoint, which now returns HTTP 400, so it creates the
        # version directory and then bails, leaving it empty. The archive is
        # fetched directly from the pinned record instead, which also gets the
        # builder's download cache.
        - WDIR="$(. "${VENV}/bin/activate" && python -c "import petu,pathlib; print(pathlib.Path(petu.__file__).parent/'weights'/'weights_v{{ context.weights_version }}')")"
        - mkdir -p "${WDIR}"
        - unzip -q {{ get_file("weights.zip") }} -d "${WDIR}"
        # Upstream unpacks a nested zip if the archive contains one; do the same.
        - find "${WDIR}" -maxdepth 1 -name '*.zip' -exec sh -c 'unzip -q "$1" -d "$(dirname "$1")" && rm -f "$1"' _ {} \;
        # Fail the build rather than ship an image that silently re-downloads.
        - . "${VENV}/bin/activate" && python -c "import pathlib,petu as _m; root=pathlib.Path(_m.__file__).parent; dirs=[x for x in root.rglob('weights_v*') if x.is_dir()]; assert dirs, 'no weights baked into the image'; n=sum(f.stat().st_size for x in dirs for f in x.rglob('*') if f.is_file()); print('baked', dirs[0].name, round(n/1e6), 'MB'); assert n > 2000*1e6, 'weights look truncated'"
        # The baked weights must be the version this recipe declares.
        - . "${VENV}/bin/activate" && python -c "import pathlib,petu as _m; root=pathlib.Path(_m.__file__).parent; dirs=[x.name for x in root.rglob('weights_v*') if x.is_dir()]; want='weights_v{{ context.weights_version }}'; assert want in dirs, 'expected '+want+', found '+str(dirs)+' -- upstream published new weights, bump weights_version'"
        # Pin: stop the package querying Zenodo at run time so the image cannot
        # swap its weights underneath a user. Upstream already handles an
        # unreachable Zenodo by falling back to the local copy, so this reuses
        # that supported path rather than adding new behaviour. Newer weights now
        # require a rebuild with weights_version bumped.
        # Locate the module by path rather than importing it: a failed command
        # substitution would silently expand to "" and cat into nothing.
        - WMOD="$(. "${VENV}/bin/activate" && python -c "import petu,pathlib; print(pathlib.Path(petu.__file__).parent/'weights.py')")"
        - test -f "${WMOD}"
        - cat {{ get_file("pin_weights.py") }} >> "${WMOD}"
        - . "${VENV}/bin/activate" && python -c "from petu.weights import _get_zenodo_metadata_and_archive_url as f; m,_u=f(); assert m['version']=='{{ context.weights_version }}', m; print('zenodo lookup pinned to', m['version'])"
        # Prove the pinned lookup still resolves the baked weights.
        - . "${VENV}/bin/activate" && python -c "from petu.weights import check_weights_path; p=str(check_weights_path()); assert p.endswith('weights_v{{ context.weights_version }}'), p; print('resolves offline to', p)"
        # Upstream ships no console_scripts, so the container provides one: a thin
        # argparse front-end over the documented Python API. It adds no logic of
        # its own beyond argument validation.
        - install -m 0755 {{ get_file("petu") }} /usr/local/bin/petu
        - . "${VENV}/bin/activate" && petu --help > /dev/null && echo "petu CLI ok"
        - chmod -R a+rX "${VENV}"
        - rm -rf /root/.cache/pip /tmp/mpl-petu /tmp/cache-petu

    - workdir: /opt

    - test:
        name: Simple Deploy Bins/Path Test
        builtin: test_deploy.sh

files:
  - name: weights.zip
    url: https://zenodo.org/api/records/14864231/files/weights.zip/content
  - name: petu
    contents: |
      #!{{ context.venv }}/bin/python3
      """Command line front-end for PeTu.

      Upstream ships no console_scripts; this wraps petu.Inferer.infer, which returns
      three components and writes each to its own file.
      """
      import argparse
      import os
      import sys


      def main(argv=None):
          p = argparse.ArgumentParser(
              prog="petu",
              description="Segment paediatric brain tumours into enhancing tumour, "
                          "cystic component and T2-hyperintense regions.",
          )
          p.add_argument("-t1c", "--t1c", help="T1 contrast-enhanced image (NIfTI)")
          p.add_argument("-fla", "--fla", help="FLAIR image (NIfTI)")
          p.add_argument("-t1", "--t1", help="T1 image (NIfTI)")
          p.add_argument("-t2", "--t2", help="T2 image (NIfTI)")
          p.add_argument("--et", help="Output file for the enhancing tumour component")
          p.add_argument("--cc", help="Output file for the cystic component")
          p.add_argument("--t2h", help="Output file for the T2-hyperintense component")
          p.add_argument("--et-dust-threshold", type=int, default=0,
                         help="Drop enhancing-tumour components smaller than this, "
                              "in voxels (26-connectivity)")
          p.add_argument("--cc-dust-threshold", type=int, default=0,
                         help="Drop cystic components smaller than this, "
                              "in voxels (26-connectivity)")
          p.add_argument("--t2h-dust-threshold", type=int, default=0,
                         help="Drop T2-hyperintense components smaller than this, "
                              "in voxels (26-connectivity)")
          p.add_argument("--device", default=None,
                         help="torch device. Defaults to cuda when a GPU is present, "
                              "otherwise cpu.")
          p.add_argument("--threads", type=int, default=None,
                         help="CPU threads. Defaults to $SLURM_CPUS_PER_TASK, then "
                              "$OMP_NUM_THREADS, then every core on the machine.")
          a = p.parse_args(argv)

          if not any([a.t1c, a.fla, a.t1, a.t2]):
              p.error("at least one of -t1c/-fla/-t1/-t2 is required")
          if not any([a.et, a.cc, a.t2h]):
              p.error("at least one output of --et/--cc/--t2h is required")

          import torch

          # Upstream defaults to device="cuda" and never falls back:
          # _configure_device builds torch.device(requested) and only consults
          # torch.cuda.is_available() to decide whether to call empty_cache().
          # On a node with no NVIDIA driver inference dies inside nnU-Net with
          # "Found no NVIDIA driver on your system", after the model has loaded.
          # Most NeuroDesk nodes have no GPU, so detect rather than assume.
          device = a.device or ("cuda" if torch.cuda.is_available() else "cpu")

          # torch and nnU-Net otherwise use every core on the machine rather than
          # the cores this job was allocated, which oversubscribes shared nodes.
          threads = a.threads
          if threads is None:
              for _var in ("SLURM_CPUS_PER_TASK", "OMP_NUM_THREADS"):
                  _value = os.environ.get(_var, "")
                  if _value.isdigit():
                      threads = int(_value)
                      break
          if threads:
              os.environ["OMP_NUM_THREADS"] = str(threads)
              torch.set_num_threads(threads)

          from petu import Inferer

          print(f"running on {device} with {torch.get_num_threads()} thread(s)", flush=True)
          Inferer(device=device).infer(
              t1c=a.t1c, fla=a.fla, t1=a.t1, t2=a.t2,
              ET_segmentation_file=a.et,
              CC_segmentation_file=a.cc,
              T2H_segmentation_file=a.t2h,
              et_dust_threshold=a.et_dust_threshold,
              cc_dust_threshold=a.cc_dust_threshold,
              t2h_dust_threshold=a.t2h_dust_threshold,
          )
          for f in (a.et, a.cc, a.t2h):
              if f:
                  print(f"wrote {f}")
          return 0


      if __name__ == "__main__":
          sys.exit(main())

  - name: pin_weights.py
    contents: |
      # Appended to upstream's weights module by the neurocontainers recipe.
      # Redefining the lookup shadows the original, so the package takes its own
      # "Zenodo unreachable -> use the local weights" branch and never downloads
      # at run time. This image ships weights_v1.0.0; to move to newer weights,
      # bump weights_version in build.yaml and rebuild the container.
      def _get_zenodo_metadata_and_archive_url():
          # Returning None would be upstream's "Zenodo unreachable" path, but
          # check_weights_path only binds zenodo_metadata inside "if zenodo_data:"
          # and then reads it unconditionally, so None raises UnboundLocalError.
          # Returning metadata whose version matches the baked weights takes the
          # "latest weights are already present" branch instead: no network, no
          # download, and the local weights are returned.
          return ({"version": "1.0.0"}, "")

deploy:
  # Only the tool is exported. Putting the venv bin on the deploy path also
  # exported python, python3 and python3.12, which then shadowed the user's own
  # interpreter for the rest of the shell: unrelated analysis code in the same
  # script silently ran against this container's python 3.12 instead.
  bins:
    - petu

categories:
  - image segmentation
  - structural imaging
  - machine learning

icon: data:image/png;base64,

readme: |-
  ----------------------------------
  ## petu/{{ context.version }} ##

  PeTu segments paediatric brain tumours into enhancing tumour (ET), cystic
  component (CC) and T2-hyperintense (T2H) regions from multi-parametric MRI.

  ### Input requirements

  Inputs must already be skull-stripped, co-registered and resampled to the
  BraTS/SRI24 atlas grid: **exactly 240x240x155 at 1 mm**. PeTu asserts this and
  rejects anything else with "Invalid shape for input data". Ordinary
  preprocessed images, including MNI152 1 mm at 182x218x182, are refused. Use
  brainles-preprocessing to produce conforming images.

  ### Example

  ```
  ml petu/{{ context.version }}

  petu -t1c t1c.nii.gz -fla flair.nii.gz -t1 t1.nii.gz -t2 t2.nii.gz \
       --et et.nii.gz --cc cc.nii.gz --t2h t2h.nii.gz
  ```

  Fewer sequences are supported and select a different bundled model (t1c alone,
  t1c+t1, flair+t1+t2 and others); all four is recommended. Outputs are three
  separate binary masks, each on the same grid and affine as the input.

  ### GPU and CPU

  A GPU is used when present. On a CPU-only node the tool selects CPU
  automatically; expect roughly 9 minutes per case on 4 cores, within 12 GB.

  On a shared or HPC node the thread count defaults to $SLURM_CPUS_PER_TASK,
  then $OMP_NUM_THREADS, so the job stays inside its allocation. Override with
  `--threads`. Force a device with `--device cpu` or `--device cuda`.

  ### From Python

  ```
  from petu import Inferer
  Inferer(device="cpu").infer(
      t1c="t1c.nii.gz", fla="flair.nii.gz",
      ET_segmentation_file="et.nii.gz",
      CC_segmentation_file="cc.nii.gz",
      T2H_segmentation_file="t2h.nii.gz",
  )
  ```

  Note that Inferer defaults to device="cuda" and does not fall back, so pass
  device explicitly when scripting against the API on a CPU node. The `petu`
  command does this for you.

  ### Notes

  Upstream ships no console_scripts, so this container adds a thin `petu` CLI
  over the documented Python API. nnU-Net v2 is pinned by upstream to 2.5.2.

  Model weights **v1.0.0** are bundled in the image. The Zenodo lookup is
  disabled, so the container never downloads weights at run time: it works
  offline, and every run uses the same weights. Picking up newer upstream
  weights requires a rebuild of this container.

  The dust-threshold options are in voxels, with 26-connectivity.

  More documentation can be found here: https://github.com/BrainLesion/PeTu
