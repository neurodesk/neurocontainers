name: colmap
version: "3.12.6"
colmap_amd64_version: "3.12.6-4"
colmap_arm64_version: "3.12.6-4"
libposelib_amd64_version: "2.0.5-1"
libposelib_arm64_version: "2.0.5-1"

tests:
  - name: colmap wrapper available on PATH
    description: Verify the deployed colmap wrapper resolves on PATH.
    command: command -v colmap
    expected_output_contains: "/opt/colmap/wrappers/colmap"

  - name: installed APT package versions match recipe and shared libraries resolve
    description: Verify dpkg reports the pinned colmap and libposelib package versions and ldd finds no missing shared libraries.
    command: |
      set -e
      arch="$(dpkg --print-architecture)"
      case "$arch" in
        amd64)
          expected="${colmap_amd64_version}"
          expected_poselib="${libposelib_amd64_version}"
          ;;
        arm64)
          expected="${colmap_arm64_version}"
          expected_poselib="${libposelib_arm64_version}"
          ;;
        *) echo "unexpected arch: $arch" >&2; exit 1 ;;
      esac
      actual="$(dpkg-query -W -f='${Version}\n' colmap)"
      actual_poselib="$(dpkg-query -W -f='${Version}\n' libposelib)"
      test "$actual" = "$expected"
      test "$actual_poselib" = "$expected_poselib"
      ! ldd /usr/bin/colmap | grep -q "not found"
      echo "colmap=$actual libposelib=$actual_poselib"
    expected_output_contains: "colmap=${version}"

  - name: license notice installed
    description: Verify COLMAP copyright and BSD-3-Clause notice is installed.
    command: |
      set -e
      test -s /usr/share/doc/colmap/copyright
      test -s /opt/colmap/share/licenses/COLMAP-COPYRIGHT.txt
      grep -q "BSD" /opt/colmap/share/licenses/COLMAP-COPYRIGHT.txt
      echo "license ok"
    expected_output_contains: "license ok"

  - name: wrapper isolates process-group signals, cleans up on SIGHUP, and preserves piped and PTY stdin
    description: Verify the installed colmap wrapper handles SIGINT/SIGHUP cleanup, noexec /tmp, and foreground PTY stdin cleanly.
    command: |
      set -e
      /usr/bin/python3 - <<'PY'
      import fcntl, os, pty, select, signal, subprocess, sys, tempfile, termios, time

      src = open("/opt/colmap/wrappers/colmap").read()
      py = sys.executable

      def make_wrapper(path, stub_path):
          patched = src.replace(
              'cmd = ["/usr/bin/colmap", *sys.argv[1:]]',
              f'cmd = [{py!r}, {stub_path!r}, *sys.argv[1:]]',
          )
          assert patched != src
          open(path, "w").write(patched)

      def run_in_pty(argv, env, on_ready=None, send_bytes=None):
          master, slave = pty.openpty()
          def preexec():
              os.setsid()
              fcntl.ioctl(slave, termios.TIOCSCTTY, 0)
          p = subprocess.Popen(argv, env=env, stdin=slave, stdout=slave, stderr=slave, preexec_fn=preexec, close_fds=True)
          os.close(slave)
          if on_ready:
              on_ready()
          if send_bytes:
              os.write(master, send_bytes)
          out = bytearray()
          deadline = time.time() + 6.0
          while time.time() < deadline:
              r, _, _ = select.select([master], [], [], 0.1)
              if r:
                  try:
                      chunk = os.read(master, 4096)
                      if not chunk:
                          break
                      out += chunk
                  except OSError:
                      break
              if p.poll() is not None and not r:
                  break
          rc = p.wait(timeout=5)
          os.close(master)
          return rc, out.decode("utf-8", "replace")

      with tempfile.TemporaryDirectory() as td:
          stub = os.path.join(td, "stub.py")
          open(stub, "w").write(
              "import os, signal, sys, time\n"
              "if sys.argv[1] == 'stdin':\n"
              "    print('GOT:' + sys.stdin.readline().strip(), flush=True)\n"
              "    raise SystemExit(0)\n"
              "log, ready = sys.argv[2], sys.argv[3]\n"
              "seen = []\n"
              "def h(sig, _):\n"
              "    seen.append(sig)\n"
              "    open(log, 'a').write(f'{sig}\\n')\n"
              "signal.signal(signal.SIGINT, h)\n"
              "signal.signal(signal.SIGHUP, h)\n"
              "open(ready, 'w').write(os.environ.get('XDG_CONFIG_HOME', '') + '\\n')\n"
              "deadline = time.time() + 5.0\n"
              "while not seen and time.time() < deadline:\n"
              "    time.sleep(0.02)\n"
              "time.sleep(0.25)\n"
              "raise SystemExit(128 + seen[0] if seen else 0)\n"
          )
          wrapper = os.path.join(td, "wrapper.py")
          make_wrapper(wrapper, stub)

          env = os.environ.copy()
          for k in ("XDG_CONFIG_HOME", "XDG_CACHE_HOME", "XDG_DATA_HOME", "XDG_RUNTIME_DIR"):
              env.pop(k, None)

          r = subprocess.run([py, wrapper, "stdin"], input="colmap-pipe\n", capture_output=True, text=True, env=env, timeout=10)
          assert r.returncode == 0 and r.stdout.strip() == "GOT:colmap-pipe", (r.returncode, r.stdout, r.stderr)

          rc, out = run_in_pty([py, wrapper, "stdin"], env=env, send_bytes=b"colmap-pty\n")
          assert rc == 0 and "GOT:colmap-pty" in out, (rc, out)

          log_hup, ready_hup = os.path.join(td, "hup.log"), os.path.join(td, "hup.ready")
          p_hup = subprocess.Popen([py, wrapper, "sig", log_hup, ready_hup], env=env, start_new_session=True)
          dl = time.time() + 5.0
          while not os.path.exists(ready_hup) and time.time() < dl:
              time.sleep(0.02)
          assert os.path.exists(ready_hup), "hup stub did not become ready"
          scratch_dir = open(ready_hup).read().strip()
          assert scratch_dir and os.path.isdir(scratch_dir), scratch_dir
          os.kill(p_hup.pid, signal.SIGHUP)
          rc_hup = p_hup.wait(timeout=10)
          sigs_hup = [int(x) for x in open(log_hup).read().splitlines() if x.strip()]
          assert rc_hup == 128 + signal.SIGHUP.value and sigs_hup == [signal.SIGHUP.value], (rc_hup, sigs_hup)
          assert not os.path.exists(os.path.dirname(scratch_dir)), scratch_dir
      print("wrapper signal and stdin ok")
      PY
    expected_output_contains: "wrapper signal and stdin ok"

  - name: offline CPU SIFT feature extraction and exhaustive matching on synthetic stereo pair
    description: Run colmap feature_extractor and exhaustive_matcher offline on CPU with read-only or unset HOME and verify keypoints and matches in SQLite database.
    command: |
      set -e
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      mkdir -p "$tmpdir/images"

      env -u HOME -u USER -u LOGNAME -u XDG_CONFIG_HOME -u XDG_CACHE_HOME -u XDG_DATA_HOME -u XDG_RUNTIME_DIR \
        colmap -h | grep -q "COLMAP ${version}"

      # Synthesize two overlapping textured PPM views (slightly shifted) so SIFT finds rich features and matches
      /usr/bin/python3 - "$tmpdir/images" <<'PY'
      import math, os, sys
      out_dir = sys.argv[1]
      w, h = 256, 256
      for idx, dx in enumerate((0, 6)):
          buf = bytearray()
          for y in range(h):
              for x in range(w):
                  sx = x + dx
                  v = 128
                  if ((sx // 16) + (y // 16)) % 2 == 0:
                      v += 55
                  else:
                      v -= 45
                  v += int(30 * math.sin(sx * 0.23) * math.cos(y * 0.19))
                  # Add high-contrast circular fiducials
                  for cx, cy, r in ((80, 90, 14), (170, 80, 12), (120, 180, 16), (190, 175, 11)):
                      if (sx - cx) ** 2 + (y - cy) ** 2 < r * r:
                          v = 20
                  v = max(0, min(255, v))
                  buf.extend((v, max(0, v - 15), max(0, v - 30)))
          with open(os.path.join(out_dir, f"view_{idx}.ppm"), "wb") as f:
              f.write(f"P6\n{w} {h}\n255\n".encode("ascii"))
              f.write(buf)
      PY

      HOME=/sys XDG_CONFIG_HOME=/sys/unwritable-cfg XDG_CACHE_HOME=/sys/unwritable-cache \
        colmap feature_extractor \
        --database_path "$tmpdir/database.db" \
        --image_path "$tmpdir/images" \
        --SiftExtraction.use_gpu 0

      HOME=/sys colmap exhaustive_matcher \
        --database_path "$tmpdir/database.db" \
        --SiftMatching.use_gpu 0

      /usr/bin/python3 - "$tmpdir/database.db" <<'PY'
      import sqlite3, sys
      con = sqlite3.connect(sys.argv[1])
      n_imgs = con.execute("SELECT COUNT(*) FROM images").fetchone()[0]
      kps = [r[0] for r in con.execute("SELECT rows FROM keypoints").fetchall()]
      matches = [r[0] for r in con.execute("SELECT rows FROM matches").fetchall()]
      assert n_imgs == 2, n_imgs
      assert len(kps) == 2 and all(k > 10 for k in kps), kps
      assert matches and sum(matches) > 5, matches
      print(f"colmap sfm ok images={n_imgs} kps={kps} matches={matches}")
      PY
    expected_output_contains: "colmap sfm ok"
