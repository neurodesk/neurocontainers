name: chimera-brainparcellation
version: 0.4.1
upstream_version: 0.4.1
tests:
  - name: software version
    command: python -c "from importlib.metadata import version; import sys; assert sys.version_info >= (3, 11);
      print(version('chimera-brainparcellation'))"
    expected_output_contains: ${upstream_version}
  - name: CLI help
    command: chimera --help
    expected_output_contains: --parcodes
  - name: region catalogue
    command: chimera --regions
    expected_output_contains: Available parcellations
  - name: packaged atlas assets
    command: |-
      python - <<'PY'
      from pathlib import Path
      import chimera
      from chimera.config_manager import load_parcellations_info
      parcels, regions = load_parcellations_info()
      assert len(parcels) == 10 and regions
      root = Path(chimera.__file__).parent
      assert list((root / 'data' / 'annot_atlases').glob('*.annot'))
      assert list((root / 'data' / 'gcs_atlases').glob('*.gcs'))
      assert list((root / 'config' / 'supraregions').glob('*.tsv'))
      assert parcels['Cortical']['H']['source'] == 'local'
      print('atlas and region resources load')
      PY
    expected_output_contains: atlas and region resources load
  - name: imaging dependencies
    command: command -v recon-all && command -v antsRegistration && command -v fslmaths
    expected_output_contains: fslmaths
  - name: hypothalamus morphology in physical coordinates
    command: |-
      python - <<'PY'
      import numpy as np
      from clabtoolkit.imagetools import MorphologicalOperations
      mask = np.zeros((15, 15, 15), dtype=np.int16)
      mask[7, 7, 7] = 14
      affine = np.diag([1., 2., 3., 1.])
      result = MorphologicalOperations().dilate_mm(
          mask, affine, shape="ball", dilation_mm=5)
      grid = np.indices(mask.shape) - 7
      distance_squared = sum((grid[axis] * affine[axis, axis]) ** 2 for axis in range(3))
      np.testing.assert_array_equal(result, distance_squared <= 25)
      print('physical-coordinate hypothalamus dilation passed')
      PY
    expected_output_contains: physical-coordinate hypothalamus dilation passed
