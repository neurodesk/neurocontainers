name: spectral
version: 0.26.0
upstream_version: "0.26"

tests:
  - name: spectral-cube wrapper available on PATH
    description: Verify the deployed spectral-cube wrapper resolves on PATH.
    command: command -v spectral-cube
    expected_output_contains: "/opt/spectral/wrappers/spectral-cube"

  - name: package version matches recipe, system APT libs used, and zero bundled .so files
    description: Verify spectral matches upstream_version, pip check passes, numpy/scipy/matplotlib come from Ubuntu APT, and zero native .so libraries are bundled under /opt/spectral.
    command: |
      set -e
      /opt/spectral/bin/python -m pip check
      /opt/spectral/bin/python - <<'PY'
      import importlib.metadata as md
      import pathlib
      import matplotlib
      import numpy
      import scipy
      import spectral

      assert md.version("spectral") == "${upstream_version}", md.version("spectral")
      for mod in (numpy, scipy, matplotlib):
          assert mod.__file__.startswith("/usr/lib/python3/dist-packages/"), mod.__file__
      so_files = list(pathlib.Path("/opt/spectral").rglob("*.so*"))
      assert not so_files, so_files
      print(f"spectral={md.version('spectral')} numpy={numpy.__version__}")
      PY
    expected_output_contains: "spectral=${upstream_version}"

  - name: license notice installed
    description: Verify Spectral Python MIT license file is installed.
    command: |
      set -e
      test -s /opt/spectral/share/licenses/SPECTRAL-LICENSE.txt
      grep -q "Thomas Boggs" /opt/spectral/share/licenses/SPECTRAL-LICENSE.txt
      echo "license ok"
    expected_output_contains: "license ok"

  - name: wrapper isolates process-group signals, cleans up on SIGHUP, and preserves piped and PTY stdin
    description: Verify the installed spectral-cube wrapper handles SIGINT/SIGHUP cleanup, noexec /tmp, and foreground/background PTY stdin cleanly.
    command: |
      set -e
      /usr/bin/python3 - <<'PY'
      import fcntl, os, pty, select, signal, subprocess, sys, tempfile, termios, time

      src = open("/opt/spectral/wrappers/spectral-cube").read()
      py = sys.executable

      def make_wrapper(path, stub_path):
          patched = src.replace(
              'cmd = ["/opt/spectral/bin/spectral-cube", *sys.argv[1:]]',
              f'cmd = [{py!r}, {stub_path!r}, *sys.argv[1:]]',
          )
          assert patched != src
          open(path, "w").write(patched)

      def run_in_pty(argv, env, on_ready=None, send_bytes=None):
          master, slave = pty.openpty()
          def preexec():
              os.setsid()
              fcntl.ioctl(slave, termios.TIOCSCTTY, 0)
          p = subprocess.Popen(argv, env=env, stdin=slave, stdout=slave, stderr=slave, preexec_fn=preexec, close_fds=True)
          os.close(slave)
          if on_ready:
              on_ready()
          if send_bytes:
              os.write(master, send_bytes)
          out = bytearray()
          deadline = time.time() + 6.0
          while time.time() < deadline:
              r, _, _ = select.select([master], [], [], 0.1)
              if r:
                  try:
                      chunk = os.read(master, 4096)
                      if not chunk:
                          break
                      out += chunk
                  except OSError:
                      break
              if p.poll() is not None and not r:
                  break
          rc = p.wait(timeout=5)
          os.close(master)
          return rc, out.decode("utf-8", "replace")

      with tempfile.TemporaryDirectory() as td:
          stub = os.path.join(td, "stub.py")
          open(stub, "w").write(
              "import os, signal, sys, time\n"
              "if sys.argv[1] == 'stdin':\n"
              "    print('GOT:' + sys.stdin.readline().strip(), flush=True)\n"
              "    raise SystemExit(0)\n"
              "log, ready = sys.argv[2], sys.argv[3]\n"
              "seen = []\n"
              "def h(sig, _):\n"
              "    seen.append(sig)\n"
              "    open(log, 'a').write(f'{sig}\\n')\n"
              "signal.signal(signal.SIGINT, h)\n"
              "signal.signal(signal.SIGHUP, h)\n"
              "open(ready, 'w').write(os.environ.get('XDG_CACHE_HOME', '') + '\\n')\n"
              "deadline = time.time() + 5.0\n"
              "while not seen and time.time() < deadline:\n"
              "    time.sleep(0.02)\n"
              "time.sleep(0.25)\n"
              "raise SystemExit(128 + seen[0] if seen else 0)\n"
          )
          wrapper = os.path.join(td, "wrapper.py")
          make_wrapper(wrapper, stub)

          env = os.environ.copy()
          for k in ("MPLCONFIGDIR", "XDG_CACHE_HOME", "XDG_CONFIG_HOME"):
              env.pop(k, None)

          r = subprocess.run([py, wrapper, "stdin"], input="spectral-pipe\n", capture_output=True, text=True, env=env, timeout=10)
          assert r.returncode == 0 and r.stdout.strip() == "GOT:spectral-pipe", (r.returncode, r.stdout, r.stderr)

          rc, out = run_in_pty([py, wrapper, "stdin"], env=env, send_bytes=b"spectral-pty\n")
          assert rc == 0 and "GOT:spectral-pty" in out, (rc, out)

          log_hup, ready_hup = os.path.join(td, "hup.log"), os.path.join(td, "hup.ready")
          p_hup = subprocess.Popen([py, wrapper, "sig", log_hup, ready_hup], env=env, start_new_session=True)
          dl = time.time() + 5.0
          while not os.path.exists(ready_hup) and time.time() < dl:
              time.sleep(0.02)
          assert os.path.exists(ready_hup), "hup stub did not become ready"
          scratch_dir = open(ready_hup).read().strip()
          assert scratch_dir and os.path.isdir(scratch_dir), scratch_dir
          os.kill(p_hup.pid, signal.SIGHUP)
          rc_hup = p_hup.wait(timeout=10)
          sigs_hup = [int(x) for x in open(log_hup).read().splitlines() if x.strip()]
          assert rc_hup == 128 + signal.SIGHUP.value and sigs_hup == [signal.SIGHUP.value], (rc_hup, sigs_hup)
          assert not os.path.exists(os.path.dirname(scratch_dir)), scratch_dir
      print("wrapper signal and stdin ok")
      PY
    expected_output_contains: "wrapper signal and stdin ok"

  - name: offline ENVI hyperspectral skin cube round-trip, PCA, and SAM via CLI
    description: Save a synthetic 16-band VIS-NIR ENVI reflectance cube, then run spectral-cube info, pca, and sam offline under read-only/unset HOME and unwritable cache paths.
    command: |
      set -e
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      env -u HOME -u USER -u LOGNAME \
        MPLCONFIGDIR=/sys/unwritable-mpl XDG_CACHE_HOME=/sys/unwritable-cache \
        /opt/spectral/bin/python - "$tmpdir" <<'PY'
      import os
      import sys
      import numpy as np
      from spectral.io import envi

      td = sys.argv[1]
      rng = np.random.default_rng(11)
      # 16x16x12 VIS-NIR skin reflectance cube (distinct spectral shape for lesion vs skin)
      wl = np.linspace(450.0, 900.0, 12)
      skin_spec = 0.25 + 0.55 * (wl - 450.0) / 450.0
      lesion_spec = 0.45 - 0.30 * (wl - 450.0) / 450.0
      cube = np.broadcast_to(skin_spec, (16, 16, 12)).copy()
      cube[4:12, 4:12, :] = lesion_spec
      cube = np.clip(cube + rng.normal(0.0, 0.005, size=cube.shape), 0.01, 1.0).astype(np.float32)
      envi.save_image(
          os.path.join(td, "skin.hdr"),
          cube,
          dtype=np.float32,
          metadata={"wavelength": [float(w) for w in wl]},
          force=True,
      )
      PY

      env -u HOME -u USER -u LOGNAME -u MPLCONFIGDIR -u XDG_CACHE_HOME -u XDG_CONFIG_HOME \
        spectral-cube --version | grep -q "spectral ${upstream_version}"
      HOME=/sys MPLCONFIGDIR=/sys/unwritable-mpl XDG_CACHE_HOME=/sys/unwritable-cache \
        spectral-cube info "$tmpdir/skin.hdr" | grep -q '"shape":'
      HOME=/sys spectral-cube pca "$tmpdir/skin.hdr" --components 3 | grep -q "explained_variance_ratio"
      HOME=/sys spectral-cube sam "$tmpdir/skin.hdr" --out "$tmpdir/angles.npy"
      /opt/spectral/bin/python - "$tmpdir/angles.npy" <<'PY'
      import sys, numpy as np
      angles = np.load(sys.argv[1])
      assert angles.shape == (16, 16, 1), angles.shape
      lesion_mean = float(angles[4:12, 4:12, 0].mean())
      skin_mean = float(angles[:4, :4, 0].mean())
      assert lesion_mean < 0.05 and skin_mean > 0.2, (lesion_mean, skin_mean)
      PY
      echo "spectral offline workflow ok"
    expected_output_contains: "spectral offline workflow ok"

  - name: runtime hook preserves cache across fork and cleans up on SIGTERM/SIGHUP (including PID 1)
    description: Verify direct /opt/spectral/bin/python keeps parent cache across os.fork()+sys.exit(0), cleans up on SIGTERM/SIGHUP, and exits cleanly under the PID 1 signal path.
    command: |
      set -e
      /usr/bin/python3 - <<'PY'
      import os, pathlib, signal, subprocess, tempfile

      py = "/opt/spectral/bin/python"
      with tempfile.TemporaryDirectory() as td:
          env = {"PATH": os.environ["PATH"], "TMPDIR": td}

          fork_code = (
              "import os, sys, _spectral_runtime as rt\n"
              "root = rt._CACHE_ROOT\n"
              "assert root is not None and root.is_dir(), root\n"
              "pid = os.fork()\n"
              "if pid == 0:\n"
              "    sys.exit(0)\n"
              "_, st = os.waitpid(pid, 0)\n"
              "assert os.WIFEXITED(st) and os.WEXITSTATUS(st) == 0, st\n"
              "assert root.is_dir(), root\n"
              "print(root)\n"
          )
          r = subprocess.run([py, "-c", fork_code], env=env, capture_output=True, text=True, timeout=30)
          assert r.returncode == 0, (r.returncode, r.stdout, r.stderr)
          assert not pathlib.Path(r.stdout.strip()).exists(), r.stdout

          for sig in (signal.SIGTERM, signal.SIGHUP):
              sp = subprocess.Popen(
                  [py, "-c", "import time, _spectral_runtime as rt; print(rt._CACHE_ROOT, flush=True); time.sleep(30)"],
                  env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              cdir = sp.stdout.readline().strip()
              assert cdir and os.path.isdir(cdir), cdir
              os.kill(sp.pid, sig)
              rc = sp.wait(timeout=10)
              assert rc == -sig.value, (sig, rc, sp.stderr.read())
              assert not os.path.exists(cdir), cdir

              pid1_code = (
                  "import os, time, _spectral_runtime as rt\n"
                  "rt._CACHE_OWNER_PID = 1\n"
                  "os.getpid = lambda: 1\n"
                  "print(rt._CACHE_ROOT, flush=True)\n"
                  "time.sleep(30)\n"
              )
              sp1 = subprocess.Popen(
                  [py, "-c", pid1_code],
                  env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              cdir1 = sp1.stdout.readline().strip()
              assert cdir1 and os.path.isdir(cdir1), cdir1
              os.kill(sp1.pid, sig)
              rc1 = sp1.wait(timeout=10)
              assert rc1 == 128 + sig.value, (sig, rc1, sp1.stderr.read())
              assert not os.path.exists(cdir1), cdir1
          assert os.listdir(td) == [], os.listdir(td)
      print("runtime hook signal and fork ok")
      PY
    expected_output_contains: "runtime hook signal and fork ok"
