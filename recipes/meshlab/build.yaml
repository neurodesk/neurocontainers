variables:
  meshlab_amd64_version: "2025.07~dfsg-2"
  meshlab_arm64_version: "2025.07~dfsg-2"
  package_version:
    try:
      - value: "{{ context.meshlab_amd64_version }}"
        condition: arch=="x86_64"
      - value: "{{ context.meshlab_arm64_version }}"
        condition: arch=="aarch64"

name: meshlab
version: "2025.07.0"

description: 3D triangular mesh processing, cleaning, remeshing, inspection, and Hausdorff surface-distance analysis for 3D total-body photography and wound morphometry.

copyright:
  - license: GPL-3.0-or-later
    name: MeshLab license
    url: https://github.com/cnr-isti-vclab/meshlab/blob/main/LICENSE.txt

architectures:
  - x86_64
  - aarch64

auto_update:
  method: sources
  container_version: meshlab-amd64
  local: []
  sources:
    - id: meshlab-amd64
      method: apt
      package: meshlab
      urls:
        - https://archive.ubuntu.com/ubuntu/dists/resolute/universe/binary-amd64/Packages.gz
        - https://archive.ubuntu.com/ubuntu/dists/resolute-updates/universe/binary-amd64/Packages.gz
        - https://security.ubuntu.com/ubuntu/dists/resolute-security/universe/binary-amd64/Packages.gz
      target:
        variable: meshlab_amd64_version
        fulltest_variable: meshlab_amd64_version
    - id: meshlab-arm64
      method: apt
      package: meshlab
      urls:
        - https://ports.ubuntu.com/ubuntu-ports/dists/resolute/universe/binary-arm64/Packages.gz
        - https://ports.ubuntu.com/ubuntu-ports/dists/resolute-updates/universe/binary-arm64/Packages.gz
        - https://ports.ubuntu.com/ubuntu-ports/dists/resolute-security/universe/binary-arm64/Packages.gz
      target:
        variable: meshlab_arm64_version
        fulltest_variable: meshlab_arm64_version

build:
  kind: neurodocker

  base-image: ubuntu:26.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive

    - install:
        - "meshlab={{ context.package_version }}"
        - libegl-mesa0
        - libgl1
        - libgl1-mesa-dri
        - libglx-mesa0
        - xauth
        - xvfb

    - run:
        # Download the exact APT-verified Ubuntu source package (.dsc, .orig.tar.*,
        # and .debian.tar.* with Ubuntu packaging/patches) directly into the image.
        - mkdir -p /opt/meshlab/share/src /opt/meshlab/share/licenses
        - "sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources"
        - apt-get update -qq
        - cd /opt/meshlab/share/src && apt-get source --download-only "meshlab={{ context.package_version }}"
        - "sed -i 's/^Types: deb deb-src$/Types: deb/' /etc/apt/sources.list.d/ubuntu.sources"
        - rm -rf /var/lib/apt/lists/*
        - install -m 0644 /usr/share/common-licenses/GPL-3 /opt/meshlab/share/licenses/GPL-3.0.txt
        - install -m 0644 {{ get_file("gpl_source_notice") }} /opt/meshlab/share/licenses/GPL-SOURCE-NOTICE.txt
        - chmod -R a+rX /opt/meshlab

files:
  - name: gpl_source_notice
    contents: |
      MeshLab {{ context.version }} Container — License & Corresponding Source Notice
      ===============================================================================
      This container installs Ubuntu 26.04 (resolute) package:
        meshlab={{ context.package_version }}

      The exact APT-verified Ubuntu corresponding source package (including upstream
      orig tarball, .dsc descriptor, and Ubuntu/Debian packaging and patches) is
      bundled inside this image under /opt/meshlab/share/src/:
        - meshlab_{{ context.package_version }}.dsc
        - meshlab_*.orig.tar.*
        - meshlab_{{ context.package_version }}.debian.tar.*

      License notices are installed at /usr/share/doc/meshlab/copyright and
      /opt/meshlab/share/licenses/GPL-3.0.txt.

      The same Ubuntu source package can also be retrieved directly from Ubuntu's
      resolute archive with `apt-get source meshlab={{ context.package_version }}`
      (after enabling `deb-src` for `resolute`, `resolute-updates`, and
      `resolute-security`), or from https://archive.ubuntu.com/ubuntu/pool/universe/m/meshlab/.

deploy:
  bins:
    - meshlab

gui_apps:
  - name: "MeshLab"
    exec: "meshlab"

domains:
  - microscopy
  - dermatology

categories:
  - "visualization"
  - "shape analysis"
  - "body"

readme: |-
  ----------------------------------
  ## meshlab/{{ context.version }} ##

  MeshLab is an open-source system for processing, cleaning, remeshing,
  inspecting, and measuring 3D triangular meshes — useful for textured
  `.obj`/`.ply` exports from 3D total-body photography (3D-TBP) systems and
  3D wound or scar surface reconstructions.

  ### Included GUI Tool
  ```
  meshlab    Launch MeshLab 3D mesh viewer and processing suite
  ```

  ### Example
  ```
  ml meshlab/{{ context.version }}
  meshlab avatar_mesh.obj
  ```

  In headless or software-rendered desktop environments, set
  `LIBGL_ALWAYS_SOFTWARE=1` if hardware OpenGL acceleration is unavailable.

  Documentation: https://www.meshlab.net/
  Debian/Ubuntu copyright and license notices are installed at
  `/usr/share/doc/meshlab/copyright` and `/opt/meshlab/share/licenses/`.
  The exact Ubuntu source package (`.dsc`, `.orig.tar.*`, and `.debian.tar.*`
  including Debian/Ubuntu packaging and patches) is bundled under
  `/opt/meshlab/share/src/`.
  ----------------------------------

