name: wsidicomizer
version: 0.32.0

description: Convert proprietary whole-slide microscopy images (SVS, NDPI, MRXS, CZI, TIFF) to DICOM VL Whole Slide Microscopy (Supplement 145).

copyright:
  - license: Apache-2.0
    name: wsidicomizer license
    url: https://github.com/imi-bigpicture/wsidicomizer/blob/v{{ context.upstream_version }}/LICENCE
  - license: LGPL-2.1-only
    name: OpenSlide binary distribution license
    url: https://github.com/openslide/openslide-bin/blob/v{{ context.openslide_bin_version }}/COPYING.LESSER
  - license: LGPL-2.1-only
    name: OpenSlide Python license
    url: https://github.com/openslide/openslide-python/blob/v{{ context.openslide_python_version }}/COPYING.LESSER
  - license: MIT
    name: pyjpegls license
    url: https://github.com/pydicom/pyjpegls/blob/v{{ context.pyjpegls_version }}/license.txt
  - license: BSD-3-Clause
    name: CharLS license
    url: https://github.com/team-charls/charls/blob/{{ context.charls_commit }}/LICENSE.md

architectures:
  - x86_64
  - aarch64

variables:
  upstream_version: "0.32.0"
  # Coordinated native-codec pins (kept together with their SHA-256 digests and
  # bundled LGPL/BSD notices so auto_update cannot drift versions and sources).
  openslide_bin_version: "4.0.1.2"
  openslide_bin_source_sha256: "83c9a4a598f3a5fe1dea83e123745e48b94ce7eab99833f04902bdf4fa0af1db"
  openslide_python_version: "1.4.7"
  openslide_python_source_sha256: "730fed798de683b00c8ef4d956f3d429cc02f2c449eb0d58944e1769ba7983cc"
  pyjpegls_version: "1.5.1"
  charls_commit: "36dd3307e070d8fbc765c3ba890b7e681046fa39"

auto_update:
  method: sources
  container_version: wsidicomizer
  sources:
    - id: wsidicomizer
      method: pypi
      package: wsidicomizer
      target:
        variable: upstream_version
        fulltest_variable: upstream_version

build:
  kind: neurodocker

  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        PIP_NO_CACHE_DIR: "1"
        XDG_CACHE_HOME: /tmp/wsidicomizer-cache
        XDG_CONFIG_HOME: /tmp/wsidicomizer-config
        PATH: /opt/wsidicomizer/bin:$PATH

    - install:
        - ca-certificates
        - python3
        - python3-venv

    - run:
        - python3 -m venv /opt/wsidicomizer
        # Omit the optional [opencv] extra so no bundled PyPI FFmpeg/Qt wheels are shipped;
        # [kernels] provides Apache-2.0 SIMD downsampling instead.
        - /opt/wsidicomizer/bin/python -m pip install --no-cache-dir "wsidicomizer[openslide,imagecodecs,pylibjpeg-openjpeg,pyjpegls,kernels]=={{ context.upstream_version }}" "openslide-bin=={{ context.openslide_bin_version }}" "openslide-python=={{ context.openslide_python_version }}" "pyjpegls=={{ context.pyjpegls_version }}"
        - /opt/wsidicomizer/bin/python -m pip check
        - mkdir -p /opt/wsidicomizer/share/licenses/openslide-bin /opt/wsidicomizer/share/src
        - install -m 0644 /opt/wsidicomizer/lib/python*/site-packages/wsidicomizer-{{ context.upstream_version }}.dist-info/licenses/LICENCE /opt/wsidicomizer/share/licenses/WSIDICOMIZER-LICENCE.txt
        - cp -a /opt/wsidicomizer/lib/python*/site-packages/openslide_bin-{{ context.openslide_bin_version }}.dist-info/licenses/. /opt/wsidicomizer/share/licenses/openslide-bin/
        - install -m 0644 /opt/wsidicomizer/lib/python*/site-packages/openslide_python-{{ context.openslide_python_version }}.dist-info/licenses/COPYING.LESSER /opt/wsidicomizer/share/licenses/OPENSLIDE-PYTHON-COPYING.LESSER
        - install -m 0644 {{ get_file("pyjpegls_license") }} /opt/wsidicomizer/share/licenses/PYJPEGLS-LICENSE.txt
        - install -m 0644 {{ get_file("charls_license") }} /opt/wsidicomizer/share/licenses/CHARLS-LICENSE.md
        - install -m 0644 {{ get_file("openslide_bin_source") }} /opt/wsidicomizer/share/src/openslide-bin-{{ context.openslide_bin_version }}.tar.gz
        - install -m 0644 {{ get_file("openslide_python_source") }} /opt/wsidicomizer/share/src/openslide_python-{{ context.openslide_python_version }}.tar.gz
        - chmod -R a+rX /opt/wsidicomizer
        - rm -rf /root/.cache/pip

files:
  - name: pyjpegls_license
    url: https://raw.githubusercontent.com/pydicom/pyjpegls/v{{ context.pyjpegls_version }}/license.txt
  - name: charls_license
    url: https://raw.githubusercontent.com/team-charls/charls/{{ context.charls_commit }}/LICENSE.md
  - name: openslide_bin_source
    url: https://github.com/openslide/openslide-bin/releases/download/v{{ context.openslide_bin_version }}/openslide-bin-{{ context.openslide_bin_version }}.tar.gz
    sha256: "{{ context.openslide_bin_source_sha256 }}"
  - name: openslide_python_source
    url: https://files.pythonhosted.org/packages/source/o/openslide_python/openslide_python-{{ context.openslide_python_version }}.tar.gz
    sha256: "{{ context.openslide_python_source_sha256 }}"

deploy:
  bins:
    - wsidicomizer

domains:
  - microscopy
  - dermatology

categories:
  - "digital pathology"
  - "data organisation"

readme: |-
  ----------------------------------
  ## wsidicomizer/{{ context.version }} ##

  `wsidicomizer` (IMI Bigpicture) reads proprietary whole-slide microscopy
  formats (`.svs`, `.ndpi`, `.mrxs`, `.czi`, `.tiff`) and converts them to
  standard DICOM VL Whole Slide Microscopy Image objects (DICOM Supplement 145).
  This container bundles OpenSlide 4.x (`openslide-bin` {{ context.openslide_bin_version }},
  `openslide-python` {{ context.openslide_python_version }}), `imagecodecs`,
  OpenJPEG, JPEG-LS (`pyjpegls` {{ context.pyjpegls_version }}), and SIMD
  pyramid downsampling (`wsidicom-kernels`).

  ### Included CLI Tool
  ```
  wsidicomizer    Convert whole-slide images to DICOM WSI (Supplement 145)
  ```

  ### Example
  ```
  ml wsidicomizer/{{ context.version }}
  wsidicomizer -i slide.svs -o ./dicom_out/ --tile-size 512
  ```

  Documentation: https://github.com/imi-bigpicture/wsidicomizer
  License texts (including `wsidicomizer`, `openslide-bin` and its bundled
  third-party notices, `openslide-python`, `pyjpegls`, and `CharLS`) are
  installed under `/opt/wsidicomizer/share/licenses`. Matching LGPL-2.1
  corresponding source archives for `openslide-bin` and `openslide-python` are
  bundled under `/opt/wsidicomizer/share/src/`.
  ----------------------------------

