name: wsidicomizer
version: 0.32.0
upstream_version: "0.32.0"

tests:
  - name: wsidicomizer binary available on PATH
    description: Verify the deployed wsidicomizer CLI entrypoint resolves on PATH.
    command: command -v wsidicomizer
    expected_output_contains: "/opt/wsidicomizer/bin/wsidicomizer"

  - name: package versions match recipe and opencv wheels are absent
    description: Verify installed wsidicomizer, openslide-bin, openslide-python, and pyjpegls versions, pip check, and absence of PyPI OpenCV wheels.
    command: |
      set -e
      /opt/wsidicomizer/bin/python -m pip check
      /opt/wsidicomizer/bin/python -c "
      import importlib.metadata as md
      for banned in ('opencv-python', 'opencv-python-headless'):
          try:
              md.version(banned)
              raise AssertionError(f'{banned} must not be installed')
          except md.PackageNotFoundError:
              pass
      print(
          'wsidicomizer=' + md.version('wsidicomizer'),
          'openslide-bin=' + md.version('openslide-bin'),
          'openslide-python=' + md.version('openslide-python'),
          'pyjpegls=' + md.version('pyjpegls'),
      )
      "
    expected_output_contains: "wsidicomizer=${upstream_version} openslide-bin=4.0.1.2 openslide-python=1.4.7 pyjpegls=1.5.1"

  - name: license notices and LGPL corresponding sources installed
    description: Verify release-matched license notices and both openslide-bin and openslide-python LGPL-2.1 corresponding source archives are present.
    command: |
      set -e
      test -s /opt/wsidicomizer/share/licenses/WSIDICOMIZER-LICENCE.txt
      test -s /opt/wsidicomizer/share/licenses/openslide-bin/COPYING.LESSER
      test -d /opt/wsidicomizer/share/licenses/openslide-bin/licenses
      test -s /opt/wsidicomizer/share/licenses/OPENSLIDE-PYTHON-COPYING.LESSER
      test -s /opt/wsidicomizer/share/licenses/PYJPEGLS-LICENSE.txt
      test -s /opt/wsidicomizer/share/licenses/CHARLS-LICENSE.md
      test -s /opt/wsidicomizer/share/src/openslide-bin-4.0.1.2.tar.gz
      test -s /opt/wsidicomizer/share/src/openslide_python-1.4.7.tar.gz
      grep -q "Apache License" /opt/wsidicomizer/share/licenses/WSIDICOMIZER-LICENCE.txt
      grep -q "GNU LESSER GENERAL PUBLIC LICENSE" /opt/wsidicomizer/share/licenses/openslide-bin/COPYING.LESSER
      grep -q "GNU LESSER GENERAL PUBLIC LICENSE" /opt/wsidicomizer/share/licenses/OPENSLIDE-PYTHON-COPYING.LESSER
      grep -q "Jan de Vaan" /opt/wsidicomizer/share/licenses/CHARLS-LICENSE.md
      echo "licenses and sources ok"
    expected_output_contains: "licenses and sources ok"

  - name: openslide 4.x and codecs available with read-only HOME
    description: Verify OpenSlide 4.x native library and CLI version/help work with read-only HOME.
    command: |
      set -e
      HOME=/sys wsidicomizer --version
      HOME=/sys /opt/wsidicomizer/bin/python -c "
      import openslide, imagecodecs, wsidicom, jpeg_ls
      print('openslide:', openslide.__library_version__, 'wsidicom:', wsidicom.__version__)
      assert openslide.__library_version__.startswith('4.'), openslide.__library_version__
      "
    expected_output_contains: "openslide: 4."

  - name: tiled TIFF to multi-level DICOM WSI conversion via CLI and OpenSlide
    description: Convert a synthetic tiled RGB TIFF with CLI pyramid generation and forced OpenSlide conversion, verifying SOP class, pyramid levels, and decoded pixel fidelity.
    command: |
      set -e
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      HOME=/sys /opt/wsidicomizer/bin/python -c "
      import sys, numpy as np, tifffile
      img = np.zeros((256, 256, 3), dtype=np.uint8)
      img[:, :, :] = [210, 40, 30]
      img[64:192, 64:192, :] = [30, 170, 50]
      img[96:160, 96:160, :] = [40, 60, 200]
      tifffile.imwrite(
          sys.argv[1],
          img,
          photometric='rgb',
          tile=(128, 128),
          compression='jpeg',
          resolution=(40000, 40000),
          resolutionunit='CENTIMETER',
      )
      " "$tmpdir/synthetic.tif"
      HOME=/sys wsidicomizer -i "$tmpdir/synthetic.tif" -o "$tmpdir/dcm_cli" --tile-size 128 --add-missing-levels
      HOME=/sys /opt/wsidicomizer/bin/python -c "
      import sys, glob, numpy as np, pydicom
      from wsidicom import WsiDicom
      from wsidicomizer import WsiDicomizer
      from wsidicomizer.wsidicomizer import SourceIdentifier

      cli_dir, tiff_path, os_dir = sys.argv[1], sys.argv[2], sys.argv[3]
      dcm_files = sorted(glob.glob(cli_dir + '/*.dcm'))
      assert dcm_files, 'No DICOM files generated by CLI'
      ds = pydicom.dcmread(dcm_files[0], stop_before_pixels=True)
      assert str(ds.SOPClassUID) == '1.2.840.10008.5.1.4.1.1.77.1.6', ds.SOPClassUID
      with WsiDicom.open(cli_dir) as slide:
          assert len(slide.levels) >= 2, f'Expected multi-level pyramid, got {len(slide.levels)}'
          center = np.asarray(slide.read_region((112, 112), 0, (32, 32)))
          assert center[:, :, 2].mean() > 170 and center[:, :, 0].mean() < 70, center.mean(axis=(0, 1))

      WsiDicomizer.convert(
          tiff_path,
          os_dir,
          tile_size=128,
          add_missing_levels=True,
          preferred_source=SourceIdentifier.OPENSLIDE,
      )
      with WsiDicom.open(os_dir) as slide:
          assert len(slide.levels) >= 2, f'Expected OpenSlide pyramid, got {len(slide.levels)}'
          corner = np.asarray(slide.read_region((8, 8), 0, (32, 32)))
          assert corner[:, :, 0].mean() > 180 and corner[:, :, 2].mean() < 60, corner.mean(axis=(0, 1))
          print('wsi roundtrip ok:', slide.size.width, slide.size.height, len(slide.levels), str(ds.SOPClassUID))
      " "$tmpdir/dcm_cli" "$tmpdir/synthetic.tif" "$tmpdir/dcm_openslide"
    expected_output_contains: "wsi roundtrip ok: 256 256 2 1.2.840.10008.5.1.4.1.1.77.1.6"
