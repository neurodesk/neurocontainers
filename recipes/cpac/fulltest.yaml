name: cpac
version: 1.8.7
software_version: 1.8.7
default_timeout: 120
tests:
- name: Test C-PAC CLI version
  description: Verify the container runtime smoke test for this tool.
  command: |
    cpac version
  expected_output_contains: "${software_version}"
- name: Test C-PAC BIDS runner help
  description: Verify the container runtime smoke test for this tool.
  command: |
    cpac-run --help
