name: meica-rs
version: 0.1.20261018

copyright:
  - license: LGPL-2.1-only
    url: https://github.com/niivue/meica-rs/blob/{{ context.meica_rs_commit }}/LICENSE

architectures:
  - x86_64
  - aarch64

variables:
  upstream_version: 0.1.20261018
  meica_rs_commit: 1582ce4733a91ceec8b77e8436170a976e7a2913
  niimath_version: 1.0.20261016
  rustup_version: 1.29.1
  rust_version: 1.88.0

auto_update:
  method: sources
  container_version: {variable: upstream_version}
  sources:
    - id: meica_rs
      method: github_commit
      repo: niivue/meica-rs
      ref: main
      version_file: Cargo.toml
      version_regex: '(?m)^version = "(?P<version>[0-9.]+)"$'
      target:
        variable: meica_rs_commit
        fulltest_variable: meica_rs_commit
        variables:
          upstream_version: version
    - id: niimath
      dependency: true
      method: github_release
      repo: rordenlab/niimath
      target:
        variable: niimath_version
        value: version
        fulltest_variable: niimath_version

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        PATH: /opt/meica-rs/bin:$PATH

    # Installed and purged in one layer; meica and the static niimath need no build tools at runtime.
    - run:
        - apt-get update -qq
        - apt-get install -y -q --no-install-recommends build-essential zlib1g-dev
        - mkdir -p /opt/meica-rs/bin /tmp/build/meica-rs /tmp/build/niimath
        - tar -xzf {{ get_file("niimath_source") }} -C /tmp/build/niimath --strip-components=1
        - make -C /tmp/build/niimath/src static -j{{ parallel_jobs }}
        - install -m 0755 /tmp/build/niimath/src/niimath /opt/meica-rs/bin/niimath
        - tar -xzf {{ get_file("meica_rs_source") }} -C /tmp/build/meica-rs --strip-components=1
        - export RUSTUP_HOME=/tmp/build/rustup CARGO_HOME=/tmp/build/cargo
        - '{{ get_file("rustup_init") }} -y --no-modify-path --default-toolchain {{ context.rust_version }} --profile minimal'
        - /tmp/build/cargo/bin/cargo build --manifest-path /tmp/build/meica-rs/Cargo.toml --release --locked -p meica
        - install -m 0755 /tmp/build/meica-rs/target/release/meica /opt/meica-rs/bin/meica
        - rm -rf /tmp/build
        - apt-get purge -y -q --auto-remove build-essential zlib1g-dev
        - rm -rf /var/lib/apt/lists/*

deploy:
  path:
    - /opt/meica-rs/bin

files:
  - name: meica_rs_source
    url: https://github.com/niivue/meica-rs/archive/{{ context.meica_rs_commit }}.tar.gz
  - name: niimath_source
    url: https://github.com/rordenlab/niimath/archive/refs/tags/v{{ context.niimath_version }}.tar.gz
  - name: rustup_init
    condition: arch=="x86_64"
    url: https://static.rust-lang.org/rustup/archive/{{ context.rustup_version }}/x86_64-unknown-linux-gnu/rustup-init
    sha256: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
    executable: true
  - name: rustup_init
    condition: arch=="aarch64"
    url: https://static.rust-lang.org/rustup/archive/{{ context.rustup_version }}/aarch64-unknown-linux-gnu/rustup-init
    sha256: 15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433
    executable: true

categories:
  - functional imaging
  - quality control

readme: |-
  ----------------------------------
  ## meica-rs/{{ context.version }} ##

  meica is a Rust port of [tedana](https://tedana.readthedocs.io/en/stable/) multi-echo
  independent component analysis (ME-ICA) denoising for multi-echo fMRI. It ports tedana's
  workflow (commit e07066c) and its dimensionality estimate, mapca 0.0.8. It needs neither
  Python nor Matlab, and its results match tedana's to floating-point rounding with identical
  component classifications.

  This container is distinct from the `meica` container, which packages the original ME-ICA v3
  (`meica.py`) by Kundu et al.

  The container provides two programs in /opt/meica-rs/bin:
  - `meica`: the ME-ICA command line tool (source commit {{ context.meica_rs_commit }})
  - `niimath` {{ context.niimath_version }}: used by `meica --moco` for motion correction

  Usage:

  The flags are tedana's (`meica --help`). Denoise a three-echo run with tedana's default
  decision tree, then with a tree that also rejects motion-related components:
  ```
  E="sub-01_task-motor_echo-1_bold.nii.gz sub-01_task-motor_echo-2_bold.nii.gz sub-01_task-motor_echo-3_bold.nii.gz"
  meica -d $E -e 15.2 35.32 55.42 --out-dir out
  meica -d $E -e 15.2 35.32 55.42 --tree motion_aroma \
    --external sub-01_task-motor_desc-confounds_timeseries.tsv --out-dir out_aroma
  ```

  `out/desc-denoised_bold.nii.gz` is the denoised series and `desc-tedana_metrics.tsv` lists
  each component's metrics and classification. Outputs use tedana's BIDS names, without its
  HTML report and figures. TEs are given in seconds (< 1) or milliseconds.

  The example data (three echoes, 100 volumes) is published on Hugging Face in the
  `neurodeskorg/webapps` dataset under `me-ica/motor-3echo/example` and
  `me-ica/motor-3echo-moco/example`.

  Decision trees (`--tree`): tedana's `tedana_orig` (default), `meica`, `minimal` and its
  three `demo_external_*` trees, plus `motion_aroma` and `motion_f`, which apply tedana's demo
  AROMA and F-test trees to fMRIPrep's `trans_*`/`rot_*` confound columns. `--tree` also takes
  a JSON file. `--mask FILE` replaces the EPI mask and `--dummy-scans N` drops the first N
  volumes, as in tedana. Options that select tedana code not ported here (for example
  `--fittype curvefit`, `--ica-method robustica`) stop with an error rather than being ignored.

  `--moco` (not a tedana flag) motion-corrects the raw echoes first. niimath builds echo 1's
  BOLD reference, detects dummy volumes, estimates head motion, resamples every echo once and
  writes fMRIPrep-named confounds (`desc-mocoConfounds_timeseries.tsv`). Upstream masks the
  reference with brainchop-mindgrab, which is not included in this container, so `--moco`
  needs `--mask FILE` here:
  ```
  meica -d $E -e 15.2 35.32 55.42 --moco --mask brain_mask.nii.gz --out-dir out_moco
  ```

  More documentation can be found here: https://github.com/niivue/meica-rs

  To run applications outside of this container: ml meica-rs/{{ context.version }}

  Citation:
  ```
  DuPre, E. M., Salo, T., Ahmed, Z., Bandettini, P. A., Bottenhorn, K. L., Caballero-Gaudes, C., Dowdle, L. T., Gonzalez-Castillo, J., Heunis, S., Kundu, P., Laird, A. R., Markello, R., Markiewicz, C. J., Moia, S., Staden, I., Teves, J. B., Urunuela, E., Vaziri-Pashkam, M., Whitaker, K., & Handwerker, D. A. (2021). TE-dependent analysis of multi-echo fMRI with tedana. Journal of Open Source Software, 6(66), 3669. https://doi.org/10.21105/joss.03669

  Kundu, P., Inati, S. J., Evans, J. W., Luh, W. M., & Bandettini, P. A. (2012). Differentiating BOLD and non-BOLD signals in fMRI time series using multi-echo EPI. NeuroImage, 60(3), 1759-1770. https://doi.org/10.1016/j.neuroimage.2011.12.028

  Li, Y. O., Adali, T., & Calhoun, V. D. (2007). Estimating the number of independent components for functional magnetic resonance imaging data. Human Brain Mapping, 28(11), 1251-1266. https://doi.org/10.1002/hbm.20359
  ```

  ----------------------------------

