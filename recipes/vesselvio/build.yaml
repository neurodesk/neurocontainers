name: vesselvio
version: 1.1.2.post1
architectures:
  - x86_64
  - aarch64

variables:
  upstream_version: 1.1.2
  miniforge_version: 26.7.2-0
  miniforge_installer:
    try:
      - value: Miniforge3-Linux-x86_64.sh
        condition: arch == "x86_64"
      - value: Miniforge3-Linux-aarch64.sh
        condition: arch == "aarch64"

auto_update:
  method: sources
  sources:
    - id: vesselvio
      method: github_release
      repo: JacobBumgarner/VesselVio
      target:
        variable: upstream_version
        fulltest_variable: upstream_version
    - id: miniforge
      method: github_release
      repo: conda-forge/miniforge
      target:
        variable: miniforge_version
        value: tag

build:
  kind: neurodocker
  base-image: ubuntu:22.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
    - install:
        - ca-certificates
        - patch
        - g++
        - libgl1-mesa-dri
        - libgl1-mesa-glx
        - libxkbcommon-x11-0
        - libxcb-xinerama0
        - xvfb
        - xauth
    - environment:
        IMAGEIO_FFMPEG_EXE: /opt/miniforge/envs/vesselvio/bin/ffmpeg
        CONDA_DIR: /opt/miniforge
        PATH: /opt/miniforge/envs/vesselvio/bin:/opt/miniforge/bin:$PATH
    - run:
        - bash {{ get_file(context.miniforge_installer) }} -b -p /opt/miniforge
        - conda config --system --set auto_update_conda false
        - >-
          conda create -y --override-channels -c conda-forge -n vesselvio
          python=3.10 pip cython=3.0.12 setuptools=75.8.2 wheel=0.45.1 numpy=1.23.5 scipy=1.10.1 pandas=1.5.3
          numba=0.57.1 llvmlite=0.40.1 scikit-image=0.20.0
          pyqt=5.15.9 vtk=9.2.6 pyvista=0.38.6 pyvistaqt=0.9.1
          matplotlib=3.7.3 python-igraph=0.9.10 networkx=2.8.8
          opencv=4.7.0 nibabel=5.1.0 imageio=2.31.5
          openpyxl=3.1.2 meshio=5.3.4 jinja2
          transforms3d=0.4.1
        - python -m pip install --no-deps --no-build-isolation --no-binary=PyMCubes,imageio-ffmpeg imageio-ffmpeg==0.4.9 geomdl==5.3.1 PyExcelerate==0.10.0 PyMCubes==0.1.6
        - python -m pip check
        - conda clean --all --yes
    - environment:
        SKIMAGE_DATADIR: /opt/scikit-image-data
    - run:
        - python -c 'import skimage'
        - ln -sf /usr/lib/$(uname -m)-linux-gnu/libGLdispatch.so.0 /opt/miniforge/envs/vesselvio/lib/libGLdispatch.so.0
    - run:
        - mkdir -p /opt/vesselvio-{{ context.upstream_version }}
        - tar -xzf {{ get_file("vesselvio_source") }} -C /opt/vesselvio-{{ context.upstream_version }} --strip-components=1
        - patch -d /opt/vesselvio-{{ context.upstream_version }} -p1 < {{ get_file("linux_paths") }}
    - copy:
        - vesselvio
        - /opt/vesselvio-{{ context.upstream_version }}/vesselvio
    - run:
        - chmod 755 /opt/vesselvio-{{ context.upstream_version }}/vesselvio
    - environment:
        PATH: $PATH:/opt/vesselvio-{{ context.upstream_version }}

deploy:
  bins:
    - vesselvio

files:
  - name: Miniforge3-Linux-x86_64.sh
    url: https://github.com/conda-forge/miniforge/releases/download/{{ context.miniforge_version }}/Miniforge3-Linux-x86_64.sh
  - name: Miniforge3-Linux-aarch64.sh
    url: https://github.com/conda-forge/miniforge/releases/download/{{ context.miniforge_version }}/Miniforge3-Linux-aarch64.sh
  - name: vesselvio_source
    url: https://github.com/JacobBumgarner/VesselVio/archive/refs/tags/v{{ context.upstream_version }}.tar.gz
  - name: linux_paths
    filename: linux-paths.patch
  - name: vesselvio
    contents: |
      #!/usr/bin/env bash
      set -euo pipefail
      source_dir=/opt/vesselvio-{{ context.upstream_version }}
      if [[ "${1:-}" == --version ]]; then
        printf '%s\n' 'VesselVio {{ context.upstream_version }}'
        exit 0
      fi
      if [[ "${1:-}" == --help ]]; then
        printf '%s\n' 'Usage: vesselvio [--version | --help]' 'Launch the VesselVio vascular analysis desktop.'
        exit 0
      fi
      export VESSELVIO_OUTPUT_DIR="${VESSELVIO_OUTPUT_DIR:-$PWD}"
      runtime_dir=$(mktemp -d "${TMPDIR:-/tmp}/vesselvio.XXXXXXXX")
      trap 'rm -rf "$runtime_dir"' EXIT
      mkdir -p "$runtime_dir/library/cache"
      python -c 'import json, os, sys; json.dump({"results_dir": os.environ["VESSELVIO_OUTPUT_DIR"], "update_check": True}, open(sys.argv[1], "w"))' "$runtime_dir/library/cache/preferences.json"
      for resource in annotation volumes icons; do
        ln -s "$source_dir/library/$resource" "$runtime_dir/library/$resource"
      done
      export NUMBA_CACHE_DIR="$runtime_dir/numba"
      export MPLCONFIGDIR="$runtime_dir/matplotlib"
      export XDG_CACHE_HOME="$runtime_dir/cache"
      export XDG_RUNTIME_DIR="$runtime_dir"
      cd "$runtime_dir"
      /opt/miniforge/envs/vesselvio/bin/python "$source_dir/VesselVio.py" "$@"

categories:
  - quantitative imaging
  - visualization
icon: data:image/png;base64,

gui_apps:
  - name: vesselvioGUI
    exec: vesselvio

readme: |
  ----------------------------------
  ## vesselvio/{{ context.version }} ##
  VesselVio is an open-source application designed to allow researchers to analyze and visualize segmented vasculature datasets.

  Example:
  ```
  vesselvio
  ```

  Results default to the directory from which VesselVio was launched. Set
  `VESSELVIO_OUTPUT_DIR` to choose a different writable results directory.

  More documentation can be found here: https://jacobbumgarner.github.io/VesselVio/

  To run container outside of this environment: ml vesselvio/{{ context.version }}

  Citation: https://doi.org/10.1016/j.crmeth.2022.100189
  ----------------------------------
