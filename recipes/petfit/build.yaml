name: petfit
version: "0.2.4"

copyright:
  - license: MIT
    url: https://github.com/mathesong/petfit/blob/main/LICENSE.md

architectures:
  - x86_64

auto_update:
  method: dockerhub
  repo: mathesong/petfit
  version_regex: '^v(?P<version>\d+\.\d+\.\d+)$'

build:
  kind: neurodocker
  base-image: mathesong/petfit:v{{ context.version }}
  pkg-manager: apt
  add-default-template: false
  add-tzdata: false

  directives:
    - run:
        - ln -sf /app/run_petfit.R /usr/local/bin/petfit
        - >-
          printf '%s\n'
          '#!/usr/bin/env bash'
          'set -e'
          ''
          'if [ "$#" -eq 0 ]; then'
          '  exec /usr/bin/env bash'
          'fi'
          ''
          'if [ "${1#-}" != "$1" ]; then'
          '  exec /usr/local/bin/petfit "$@"'
          'fi'
          ''
          'exec "$@"'
          > /usr/local/bin/petfit-entrypoint
        - chmod 0755 /usr/local/bin/petfit-entrypoint
        - test -x /usr/local/bin/petfit
    - entrypoint: /usr/local/bin/petfit-entrypoint
    - user: petfit

deploy:
  bins:
    - petfit
    - R
    - Rscript

domains:
  - neuroimaging

categories:
  - molecular imaging
  - preclinical imaging
  - quantitative imaging
  - bids apps

structured_readme:
  description: >-
    PETFit is a BIDS App and R Shiny application suite built on kinfitr for
    reproducible Positron Emission Tomography (PET) pharmacokinetic modeling.
    It provides interactive web apps and non-interactive automatic pipelines
    for combining regional time-activity curves (regiondef), plasma-input
    compartmental and graphical modeling (1TCM, 2TCM, 2TCM_irr, Logan, MA1,
    Patlak), and reference-tissue modeling (SRTM, SRTM2, SUV/SUVR, refLogan,
    MRTM1, MRTM2, refPatlak), generating HTML quality-control reports for each
    processing step.
  example: |-
    # Show CLI options
    petfit --help

    # Run region definition automatically from a saved regions TSV
    petfit --func regiondef --mode automatic \
      --bids_dir /path/to/bids \
      --derivatives_dir /path/to/bids/derivatives \
      --regions_file /path/to/petfit_regions.tsv \
      --cores 1

    # Run reference-tissue pharmacokinetic modeling automatically
    petfit --func modelling_ref --mode automatic \
      --bids_dir /path/to/bids \
      --derivatives_dir /path/to/bids/derivatives \
      --config_file /path/to/petfit_config.json \
      --cores 1

    # Launch the interactive Shiny app (open http://localhost:3838 by default)
    petfit --func modelling_ref --mode interactive \
      --bids_dir /path/to/bids \
      --derivatives_dir /path/to/bids/derivatives
  documentation: https://petfit.readthedocs.io/en/latest/
  citation: |-
    Matheson, G. J. (2019). Kinfitr: Reproducible PET Pharmacokinetic Modelling in R. bioRxiv: 755751. https://doi.org/10.1101/755751

    Tjerkaski, J., Cervenka, S., Farde, L., & Matheson, G. J. (2020). Kinfitr - an open source tool for reproducible PET modelling: Validation and evaluation of test-retest reliability. EJNMMI Research 10, 77. https://doi.org/10.1186/s13550-020-00664-8

readme: |-
  ----------------------------------
  ## petfit/{{ context.version }} ##

  PETFit is a BIDS App and R Shiny application suite built on kinfitr for
  reproducible Positron Emission Tomography (PET) pharmacokinetic modeling.
  It provides interactive web apps and non-interactive automatic pipelines
  for combining regional time-activity curves (`regiondef`), plasma-input
  compartmental and graphical modeling (`modelling_plasma`: 1TCM, 2TCM,
  2TCM_irr, Logan, MA1, Patlak), and reference-tissue modeling
  (`modelling_ref`: SRTM, SRTM2, SUV/SUVR, refLogan, MRTM1, MRTM2, refPatlak),
  generating HTML quality-control reports for each processing step.

  Example:
  ```bash
  # Show CLI options
  petfit --help

  # Run region definition automatically from a saved regions TSV
  petfit --func regiondef --mode automatic \
    --bids_dir /path/to/bids \
    --derivatives_dir /path/to/bids/derivatives \
    --regions_file /path/to/petfit_regions.tsv \
    --cores 1

  # Run reference-tissue pharmacokinetic modeling automatically
  petfit --func modelling_ref --mode automatic \
    --bids_dir /path/to/bids \
    --derivatives_dir /path/to/bids/derivatives \
    --config_file /path/to/petfit_config.json \
    --cores 1

  # Launch the interactive Shiny app (available at http://localhost:3838)
  petfit --func modelling_ref --mode interactive \
    --bids_dir /path/to/bids \
    --derivatives_dir /path/to/bids/derivatives
  ```

  More documentation can be found here:
  - https://petfit.readthedocs.io/en/latest/
  - https://github.com/mathesong/petfit

  Citation:
  ```
  Matheson, G. J. (2019). Kinfitr: Reproducible PET Pharmacokinetic Modelling in R. bioRxiv: 755751. https://doi.org/10.1101/755751

  Tjerkaski, J., Cervenka, S., Farde, L., & Matheson, G. J. (2020). Kinfitr - an open source tool for reproducible PET modelling: Validation and evaluation of test-retest reliability. EJNMMI Research 10, 77. https://doi.org/10.1186/s13550-020-00664-8
  ```

  To run container outside of this environment: ml petfit/{{ context.version }}

