variables:
  package_version: "1.0.6-5build2"

name: amide
version: 1.0.6

copyright:
  - license: GPL-2.0-or-later
    url: https://github.com/ferdymercury/amide/blob/main/COPYING

architectures:
  - x86_64
  - aarch64

auto_update:
  method: sources
  container_version: amide
  local: []
  sources:
    - id: amide
      method: apt
      package: amide
      urls:
        - https://archive.ubuntu.com/ubuntu/dists/noble/universe/binary-amd64/Packages.gz
        - https://archive.ubuntu.com/ubuntu/dists/noble-updates/universe/binary-amd64/Packages.gz
      target:
        variable: package_version
        fulltest_variable: package_version

build:
  kind: neurodocker

  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - install:
        - "amide={{ context.package_version }}"
        - adwaita-icon-theme
        - librsvg2-common
        - xvfb
        - xauth

deploy:
  bins:
    - amide

readme: |
  ----------------------------------
  ## amide/{{ context.version }} ##
  AMIDE (A Medical Image Data Examiner) is a tool for viewing, registering, and
  analyzing multimodal 3D medical imaging datasets, including clinical and
  preclinical microPET, microCT, SPECT, and MRI studies, with interactive ROI
  delineation, SUV/quantitative statistics, and volume rendering.

  Example:
  ```
  amide
  ```

  More documentation can be found here: https://amide.sourceforge.net/documentation.html

  Citation:
  ```
  Loening AM, Gambhir SS. AMIDE: a free software tool for multimodality medical image analysis.
  Molecular Imaging. 2003;2(3):131-137. doi:10.1162/153535003322556877
  ```

  To run container outside of this environment: ml amide/{{ context.version }}

  ----------------------------------

gui_apps:
  - name: "AMIDE"
    exec: "amide"

domains:
  - neuroimaging
  - preclinical

categories:
  - "molecular imaging"
  - "preclinical imaging"
  - "visualization"

icon: data:image/png;base64,
