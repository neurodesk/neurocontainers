name: labelme
version: 7.11.0
upstream_version: "7.11.0"

tests:
  - name: labelme wrapper available on PATH
    description: Verify the deployed labelme wrapper resolves on PATH.
    command: command -v labelme
    expected_output_contains: "/opt/labelme/wrappers/labelme"

  - name: package version matches recipe, system PySide6 is used, and no weights are baked
    description: Verify labelme matches upstream_version, pip check passes, PySide6 comes from Ubuntu APT, no CUDA wheels exist, and no ONNX model weights are baked into the image.
    command: |
      set -e
      /opt/labelme/bin/python -m pip check
      /opt/labelme/bin/python - <<'PY'
      import importlib.metadata as md
      import pathlib
      import PySide6
      import scipy

      assert md.version("labelme") == "${upstream_version}", md.version("labelme")
      assert PySide6.__file__.startswith("/usr/lib/python3/dist-packages/"), PySide6.__file__
      assert scipy.__file__.startswith("/usr/lib/python3/dist-packages/"), scipy.__file__
      bad = [
          d.metadata["Name"]
          for d in md.distributions()
          if d.metadata["Name"].lower().startswith(("nvidia-", "cuda-"))
      ]
      assert not bad, bad
      bad_libs = [
          str(p)
          for p in pathlib.Path("/opt/labelme").rglob("*.so*")
          if p.name.startswith(("libquadmath", "libgfortran", "libgomp", "libzmq"))
      ]
      assert not bad_libs, bad_libs
      weights = [
          str(p)
          for p in pathlib.Path("/opt/labelme").rglob("*")
          if p.is_file()
          and (
              p.suffix.lower() in {".pth", ".pt", ".ckpt", ".safetensors"}
              or (p.suffix.lower() == ".onnx" and p.stat().st_size > 1_000_000)
          )
      ]
      assert not weights, weights
      print(f"labelme={md.version('labelme')} pyside6={md.version('PySide6')}")
      PY
    expected_output_contains: "labelme=${upstream_version}"

  - name: license notices installed
    description: Verify Labelme GPL-3.0-only license and source notice files are installed.
    command: |
      set -e
      test -s /opt/labelme/share/licenses/LABELME-LICENSE.txt
      grep -q "GNU GENERAL PUBLIC LICENSE" /opt/labelme/share/licenses/LABELME-LICENSE.txt
      test -s /opt/labelme/share/licenses/GPL-3.0.txt
      test -s /opt/labelme/share/licenses/GPL-SOURCE-NOTICE.txt
      echo "license ok"
    expected_output_contains: "license ok"

  - name: wrapper isolates process-group signals, cleans up on SIGHUP, and preserves piped and PTY stdin
    description: Verify the installed labelme wrapper delivers one SIGINT/SIGHUP, cleans up scratch dirs on SIGHUP, works on noexec /tmp, and handles foreground/background PTY job control cleanly.
    command: |
      set -e
      /opt/labelme/bin/python - <<'PY'
      import fcntl, os, pty, select, signal, subprocess, sys, tempfile, termios, time

      src = open("/opt/labelme/wrappers/labelme").read()
      py = sys.executable

      def make_wrapper(path, stub_path):
          patched = src.replace(
              'cmd = ["/opt/labelme/bin/labelme", *sys.argv[1:]]',
              f'cmd = [{py!r}, {stub_path!r}, *sys.argv[1:]]',
          )
          assert patched != src
          open(path, "w").write(patched)

      def run_in_pty(argv, env, on_ready=None, send_bytes=None):
          master, slave = pty.openpty()
          def preexec():
              os.setsid()
              fcntl.ioctl(slave, termios.TIOCSCTTY, 0)
          p = subprocess.Popen(argv, env=env, stdin=slave, stdout=slave, stderr=slave, preexec_fn=preexec, close_fds=True)
          os.close(slave)
          if on_ready:
              on_ready()
          if send_bytes:
              os.write(master, send_bytes)
          out = bytearray()
          deadline = time.time() + 6.0
          while time.time() < deadline:
              r, _, _ = select.select([master], [], [], 0.1)
              if r:
                  try:
                      chunk = os.read(master, 4096)
                      if not chunk:
                          break
                      out += chunk
                  except OSError:
                      break
              if p.poll() is not None and not r:
                  break
          rc = p.wait(timeout=5)
          os.close(master)
          return rc, out.decode("utf-8", "replace")

      with tempfile.TemporaryDirectory() as td:
          stub = os.path.join(td, "stub.py")
          open(stub, "w").write(
              "import os, signal, sys, time\n"
              "if sys.argv[1] == 'stdin':\n"
              "    print('GOT:' + sys.stdin.readline().strip(), flush=True)\n"
              "    raise SystemExit(0)\n"
              "log, ready = sys.argv[2], sys.argv[3]\n"
              "seen = []\n"
              "def h(sig, _):\n"
              "    seen.append(sig)\n"
              "    open(log, 'a').write(f'{sig}\\n')\n"
              "signal.signal(signal.SIGINT, h)\n"
              "signal.signal(signal.SIGHUP, h)\n"
              "open(ready, 'w').write(os.environ.get('XDG_CACHE_HOME', '') + '\\n')\n"
              "deadline = time.time() + 5.0\n"
              "while not seen and time.time() < deadline:\n"
              "    time.sleep(0.02)\n"
              "time.sleep(0.25)\n"
              "raise SystemExit(128 + seen[0] if seen else 0)\n"
          )
          wrapper = os.path.join(td, "wrapper.py")
          make_wrapper(wrapper, stub)

          env = os.environ.copy()
          for k in ("XDG_CONFIG_HOME", "XDG_CACHE_HOME", "XDG_DATA_HOME", "XDG_RUNTIME_DIR", "MPLCONFIGDIR"):
              env.pop(k, None)

          # 1. Piped stdin passthrough
          r = subprocess.run([py, wrapper, "stdin"], input="labelme-pipe\n", capture_output=True, text=True, env=env, timeout=10)
          assert r.returncode == 0 and r.stdout.strip() == "GOT:labelme-pipe", (r.returncode, r.stdout, r.stderr)

          # 2. Interactive foreground PTY stdin read (must not stop with SIGTTIN)
          rc, out = run_in_pty([py, wrapper, "stdin"], env=env, send_bytes=b"labelme-pty\n")
          assert rc == 0 and "GOT:labelme-pty" in out, (rc, out)

          # 3. Interactive foreground PTY Ctrl-C delivers one SIGINT
          log_pty, ready_pty = os.path.join(td, "pty.log"), os.path.join(td, "pty.ready")
          def wait_ready():
              dl = time.time() + 5.0
              while not os.path.exists(ready_pty) and time.time() < dl:
                  time.sleep(0.02)
              assert os.path.exists(ready_pty), "pty stub did not become ready"
          rc, out = run_in_pty([py, wrapper, "sig", log_pty, ready_pty], env=env, on_ready=wait_ready, send_bytes=b"\x03")
          sigs_pty = [int(x) for x in open(log_pty).read().splitlines() if x.strip()]
          assert rc == 130 and sigs_pty == [signal.SIGINT.value], (rc, sigs_pty, out)

          # 4. Non-TTY process-group SIGINT delivers one SIGINT
          log, ready = os.path.join(td, "sig.log"), os.path.join(td, "sig.ready")
          p = subprocess.Popen([py, wrapper, "sig", log, ready], env=env, start_new_session=True)
          deadline = time.time() + 5.0
          while not os.path.exists(ready) and time.time() < deadline:
              time.sleep(0.02)
          assert os.path.exists(ready), "stub did not become ready"
          os.killpg(p.pid, signal.SIGINT)
          rc = p.wait(timeout=10)
          sigs = [int(x) for x in open(log).read().splitlines() if x.strip()]
          assert rc == 130 and sigs == [signal.SIGINT.value], (rc, sigs)

          # 5. SIGHUP forwards once to child and removes wrapper scratch dir
          log_hup, ready_hup = os.path.join(td, "hup.log"), os.path.join(td, "hup.ready")
          p_hup = subprocess.Popen([py, wrapper, "sig", log_hup, ready_hup], env=env, start_new_session=True)
          deadline = time.time() + 5.0
          while not os.path.exists(ready_hup) and time.time() < deadline:
              time.sleep(0.02)
          assert os.path.exists(ready_hup), "hup stub did not become ready"
          scratch_cache = open(ready_hup).read().strip()
          assert scratch_cache and os.path.isdir(scratch_cache), scratch_cache
          os.kill(p_hup.pid, signal.SIGHUP)
          rc_hup = p_hup.wait(timeout=10)
          sigs_hup = [int(x) for x in open(log_hup).read().splitlines() if x.strip()]
          assert rc_hup == 128 + signal.SIGHUP.value and sigs_hup == [signal.SIGHUP.value], (rc_hup, sigs_hup)
          assert not os.path.exists(os.path.dirname(scratch_cache)), f"scratch dir leaked on SIGHUP: {scratch_cache}"

          # 5b. Under nohup, inherited SIG_IGN for SIGHUP is preserved and child survives SIGHUP
          stub_nohup = os.path.join(td, "stub_nohup.py")
          open(stub_nohup, "w").write(
              "import os, signal, sys, time\n"
              "ready, go = sys.argv[1], sys.argv[2]\n"
              "assert signal.getsignal(signal.SIGHUP) == signal.SIG_IGN, signal.getsignal(signal.SIGHUP)\n"
              "open(ready, 'w').write('ready\\n')\n"
              "dl = time.time() + 5.0\n"
              "while not os.path.exists(go) and time.time() < dl:\n"
              "    time.sleep(0.02)\n"
              "assert os.path.exists(go), 'go file not seen'\n"
          )
          wrapper_nohup = os.path.join(td, "wrapper_nohup.py")
          make_wrapper(wrapper_nohup, stub_nohup)
          ready_nh, go_nh = os.path.join(td, "nh.ready"), os.path.join(td, "nh.go")
          p_nh = subprocess.Popen(["nohup", py, wrapper_nohup, ready_nh, go_nh], env=env, start_new_session=True, stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          dl = time.time() + 5.0
          while not os.path.exists(ready_nh) and time.time() < dl:
              time.sleep(0.02)
          assert os.path.exists(ready_nh), f"nohup stub not ready: {p_nh.stderr.read().decode()}"
          os.killpg(p_nh.pid, signal.SIGHUP)
          time.sleep(0.1)
          open(go_nh, "w").write("go\n")
          rc_nh = p_nh.wait(timeout=10)
          err_nh = p_nh.stderr.read().decode()
          assert rc_nh == 0, (rc_nh, err_nh)

          # 6. Interactive Bash Ctrl-Z returns shell prompt and fg resumes child
          ready_z = os.path.join(td, "tstp.ready")
          stub_z = os.path.join(td, "stub_z.py")
          open(stub_z, "w").write(
              "import sys\n"
              "open(sys.argv[1], 'w').write('ready\\n')\n"
              "print('RESUMED:' + sys.stdin.readline().strip(), flush=True)\n"
          )
          wrapper_z = os.path.join(td, "wrapper_z.py")
          make_wrapper(wrapper_z, stub_z)
          master, slave = pty.openpty()
          def preexec_bash():
              os.setsid()
              fcntl.ioctl(slave, termios.TIOCSCTTY, 0)
          benv = env.copy()
          benv["PS1"] = "BP> "
          bash = subprocess.Popen(["bash", "--norc", "--noprofile", "-i"], stdin=slave, stdout=slave, stderr=slave, preexec_fn=preexec_bash, close_fds=True, env=benv)
          os.close(slave)
          pty_buf = [""]
          def read_until(marker):
              dl = time.time() + 5.0
              while True:
                  idx = pty_buf[0].find(marker)
                  if idx != -1:
                      end = idx + len(marker)
                      out = pty_buf[0][:end]
                      pty_buf[0] = pty_buf[0][end:]
                      return out
                  if time.time() >= dl:
                      raise AssertionError(f"Timed out waiting for {marker!r}: {pty_buf[0]!r}")
                  r, _, _ = select.select([master], [], [], 0.05)
                  if r:
                      try:
                          chunk = os.read(master, 4096)
                          if not chunk:
                              raise AssertionError(f"EOF waiting for {marker!r}: {pty_buf[0]!r}")
                          pty_buf[0] += chunk.decode("utf-8", "replace")
                      except OSError:
                          raise AssertionError(f"OSError waiting for {marker!r}: {pty_buf[0]!r}")
          read_until("BP> ")
          os.write(master, f"{py} {wrapper_z} {ready_z}\n".encode())
          dl = time.time() + 5.0
          while not os.path.exists(ready_z) and time.time() < dl:
              time.sleep(0.02)
          assert os.path.exists(ready_z), "tstp stub did not start"
          time.sleep(0.1)
          os.write(master, b"\x1a")
          read_until("BP> ")
          os.write(master, b"bg\n")
          read_until("BP> ")
          time.sleep(0.15)
          os.write(master, b"echo BASH_KEEPS_TTY\n")
          out_bg = read_until("BASH_KEEPS_TTY")
          assert "RESUMED:echo" not in out_bg, out_bg
          read_until("BP> ")
          os.write(master, b"fg\n")
          time.sleep(0.15)
          os.write(master, b"after-fg\n")
          read_until("RESUMED:after-fg")
          read_until("BP> ")
          # 7. Background launch (&) followed by fg hands TTY to child cleanly
          ready_bg = os.path.join(td, "bg.ready")
          os.write(master, f"{py} {wrapper_z} {ready_bg} &\n".encode())
          dl = time.time() + 5.0
          while not os.path.exists(ready_bg) and time.time() < dl:
              time.sleep(0.02)
          assert os.path.exists(ready_bg), "bg stub did not start"
          time.sleep(0.15)
          os.write(master, b"echo BG_LAUNCH_OK\n")
          out_bgl = read_until("BG_LAUNCH_OK")
          assert "RESUMED:echo" not in out_bgl, out_bgl
          read_until("BP> ")
          os.write(master, b"fg\n")
          time.sleep(0.15)
          os.write(master, b"from-bg-to-fg\n")
          read_until("RESUMED:from-bg-to-fg")
          read_until("BP> ")
          # 8. Running background child (no TTY I/O) -> fg -> Ctrl-Z stops child too
          stub_bg = os.path.join(td, "stub_bg.py")
          open(stub_bg, "w").write(
              "import os, sys, time\n"
              "if sys.argv[1] == 'tick':\n"
              "    open(sys.argv[2], 'w').write(str(os.getpid()))\n"
              "    for i in range(60):\n"
              "        open(sys.argv[3], 'w').write(str(i))\n"
              "        time.sleep(0.05)\n"
              "else:\n"
              "    open(sys.argv[2], 'w').write('ready\\n')\n"
              "    time.sleep(0.3)\n"
              "    print('TOSTOP_OK', flush=True)\n"
          )
          wrapper_bg = os.path.join(td, "wrapper_bg.py")
          make_wrapper(wrapper_bg, stub_bg)
          pidf, tickf = os.path.join(td, "c.pid"), os.path.join(td, "c.tick")
          os.write(master, f"{py} {wrapper_bg} tick {pidf} {tickf} &\n".encode())
          dl = time.time() + 5.0
          while not os.path.exists(pidf) and time.time() < dl:
              time.sleep(0.02)
          cpid = int(open(pidf).read().strip())
          read_until("BP> ")
          os.write(master, b"fg\n")
          time.sleep(0.15)
          os.write(master, b"\x1a")
          read_until("BP> ")
          time.sleep(0.1)
          st = open(f"/proc/{cpid}/stat").read().rsplit(")", 1)[1].split()[0]
          assert st == "T", f"running child not stopped on fg + Ctrl-Z: {st}"
          os.write(master, b"fg\n")
          time.sleep(0.1)
          os.write(master, b"\x03")
          read_until("BP> ")
          # 9. stty tostop + bg with </dev/null stops cleanly on SIGTTOU and fg completes write
          ready_ts = os.path.join(td, "ts.ready")
          os.write(master, b"stty tostop\n")
          read_until("BP> ")
          os.write(master, f"{py} {wrapper_bg} write {ready_ts} </dev/null\n".encode())
          dl = time.time() + 5.0
          while not os.path.exists(ready_ts) and time.time() < dl:
              time.sleep(0.02)
          os.write(master, b"\x1a")
          read_until("BP> ")
          os.write(master, b"bg\n")
          read_until("BP> ")
          time.sleep(0.5)
          os.write(master, b"jobs\n")
          jout = read_until("BP> ")
          assert "Stopped" in jout and "TOSTOP_OK" not in jout, jout
          os.write(master, b"fg\n")
          read_until("TOSTOP_OK")
          read_until("BP> ")
          os.write(master, b"exit\n")
          bash.wait(timeout=5)
          os.close(master)
      print("wrapper signal and stdin ok")
      PY
    expected_output_contains: "wrapper signal and stdin ok"

  - name: labelme CLI version and help work with read-only or unset HOME and unwritable XDG paths
    description: Verify labelme --version and --help run cleanly when HOME is read-only or unset and XDG variables are unset or unwritable.
    command: |
      set -e
      out="$(env -u XDG_CONFIG_HOME -u XDG_CACHE_HOME -u XDG_DATA_HOME -u XDG_RUNTIME_DIR -u MPLCONFIGDIR HOME=/sys labelme --version)"
      echo "$out"
      env -u HOME -u XDG_CONFIG_HOME -u XDG_CACHE_HOME -u XDG_DATA_HOME -u XDG_RUNTIME_DIR -u MPLCONFIGDIR labelme --version | grep -q "Labelme ${upstream_version}"
      XDG_CONFIG_HOME=/sys/unwritable-cfg XDG_CACHE_HOME=/sys/unwritable-cache HOME=/sys labelme --help | grep -q -- "--output"
    expected_output_contains: "Labelme ${upstream_version}"

  - name: offline headless Qt6 GUI startup and polygon annotation round-trip
    description: Start Labelme MainWindow under Xvfb with read-only HOME and verify polygon LabelFile JSON serialization and mask rendering offline.
    command: |
      set -e
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      mkdir -m 0700 "$tmpdir/cfg" "$tmpdir/cache" "$tmpdir/data" "$tmpdir/run"
      env -u MPLCONFIGDIR \
        HOME=/sys \
        XDG_CONFIG_HOME="$tmpdir/cfg" \
        XDG_CACHE_HOME="$tmpdir/cache" \
        XDG_DATA_HOME="$tmpdir/data" \
        XDG_RUNTIME_DIR="$tmpdir/run" \
        xvfb-run -a /opt/labelme/bin/python - "$tmpdir" <<'PY'
      import os
      import sys
      import imgviz
      import numpy as np
      from PIL import Image, ImageDraw
      from PySide6 import QtWidgets
      from labelme._app import MainWindow
      from labelme._label_file import (
          Annotation,
          read_image_file,
          read_label_file,
          write_label_file,
      )

      td = sys.argv[1]
      img_path = os.path.join(td, "lesion.png")
      json_path = os.path.join(td, "lesion.json")

      # Synthesize a 64x64 dermoscopy-like skin + pigmented lesion patch
      rgb = np.full((64, 64, 3), (210, 170, 145), dtype=np.uint8)
      rgb[16:48, 18:46] = (95, 58, 42)
      Image.fromarray(rgb).save(img_path)

      pts = [(18.0, 16.0), (46.0, 16.0), (46.0, 48.0), (18.0, 48.0)]
      shapes = [
          {
              "label": "melanocytic_lesion",
              "points": [[x, y] for x, y in pts],
              "group_id": None,
              "description": "",
              "shape_type": "polygon",
              "flags": {},
              "mask": None,
              "locked": False,
              "other_data": {},
          }
      ]
      image_data = read_image_file(filename=img_path)
      ann = Annotation(
          image_path="lesion.png",
          image_data=image_data,
          shapes=shapes,
          flags={"dermoscopic": True},
          other_data={},
      )
      write_label_file(
          filename=json_path,
          annotation=ann,
          image_height=64,
          image_width=64,
          save_image_data=True,
      )
      reloaded = read_label_file(filename=json_path)
      assert len(reloaded.shapes) == 1 and reloaded.shapes[0]["label"] == "melanocytic_lesion"
      assert reloaded.flags.get("dermoscopic") is True

      mask_img = Image.new("L", (64, 64), 0)
      ImageDraw.Draw(mask_img).polygon(pts, fill=1)
      lbl = np.asarray(mask_img, dtype=np.int32)
      assert int((lbl == 1).sum()) > 800, int((lbl == 1).sum())
      viz = imgviz.label2rgb(lbl, image=rgb)
      assert viz.shape == (64, 64, 3)

      # Instantiate the real Qt6 MainWindow loading the annotated image under Xvfb
      app = QtWidgets.QApplication([])
      win = MainWindow(config_file=None, config_overrides={}, file_or_dir=img_path)
      win.show()
      app.processEvents()
      assert win.windowTitle().startswith("Labelme"), win.windowTitle()
      assert len(win._canvas_widgets.canvas.shapes) == 1, len(win._canvas_widgets.canvas.shapes)
      win.close()
      app.quit()
      print(f"labelme gui and polygon ok pixels={int((lbl == 1).sum())}")
      PY
    expected_output_contains: "labelme gui and polygon ok"
