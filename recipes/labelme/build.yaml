name: labelme
version: 7.11.0

description: Offline 2D polygon, mask, and contour annotation GUI for dermoscopic lesions, clinical photography, and chronic wounds.

copyright:
  - license: GPL-3.0-only
    name: Labelme license
    url: https://github.com/wkentaro/labelme/blob/v{{ context.upstream_version }}/LICENSE

architectures:
  - x86_64
  - aarch64

variables:
  upstream_version: "7.11.0"

auto_update:
  method: sources
  container_version: labelme
  sources:
    - id: labelme
      method: pypi
      package: labelme
      target:
        variable: upstream_version
        fulltest_variable: upstream_version

build:
  kind: neurodocker

  base-image: ubuntu:26.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        MPLBACKEND: Agg
        PIP_NO_CACHE_DIR: "1"
        PATH: /opt/labelme/wrappers:/opt/labelme/bin:$PATH

    - install:
        - ca-certificates
        - libdbus-1-3
        - libegl-mesa0
        - libegl1
        - libfontconfig1
        - libgl1
        - libgl1-mesa-dri
        - libglib2.0-0
        - libglx-mesa0
        - libxcb-cursor0
        - libxcb-icccm4
        - libxcb-image0
        - libxcb-keysyms1
        - libxcb-randr0
        - libxcb-render-util0
        - libxcb-shape0
        - libxcb-xfixes0
        - libxcb-xinerama0
        - libxkbcommon-x11-0
        - libxkbcommon0
        - python3
        - python3-numpy
        - python3-pip
        - python3-pyside6.qtcore
        - python3-pyside6.qtgui
        - python3-pyside6.qtnetwork
        - python3-pyside6.qtsvg
        - python3-pyside6.qtwidgets
        - python3-scipy
        - python3-skimage
        - python3-venv
        - xauth
        - xvfb

    - run:
        # Inherit Ubuntu 26.04's system python3-pyside6.*, python3-numpy,
        # python3-scipy, and python3-skimage so we satisfy runtime dependencies
        # without shipping PyPI wheels bundling LGPL Qt or GCC libquadmath/libgfortran.
        - python3 -m venv --system-site-packages /opt/labelme
        # Upgrade pip inside the venv so PEP 440 handles Ubuntu 26.04 kernel
        # platform_release markers in labelme's osam[webgpu] dependency.
        - /opt/labelme/bin/python -m pip install --no-cache-dir --upgrade pip
        - /opt/labelme/bin/python -m pip install --no-cache-dir "labelme=={{ context.upstream_version }}"
        - /opt/labelme/bin/python -m pip check
        # Guard: PySide6 and SciPy must come from system APT (no bundled LGPL/GPL/MPL
        # shared libs under /opt/labelme), no proprietary CUDA wheels, and no baked
        # pretrained model weights inside /opt/labelme.
        - >-
          /opt/labelme/bin/python -c "import importlib.metadata as md, pathlib, PySide6, scipy;
          assert PySide6.__file__.startswith('/usr/lib/python3/dist-packages/'), PySide6.__file__;
          assert scipy.__file__.startswith('/usr/lib/python3/dist-packages/'), scipy.__file__;
          bad = [d.metadata['Name'] for d in md.distributions() if d.metadata['Name'].lower().startswith(('nvidia-', 'cuda-'))];
          assert not bad, bad;
          bad_libs = [str(p) for p in pathlib.Path('/opt/labelme').rglob('*.so*') if p.name.startswith(('libquadmath', 'libgfortran', 'libgomp', 'libzmq'))];
          assert not bad_libs, bad_libs;
          weights = [str(p) for p in pathlib.Path('/opt/labelme').rglob('*') if p.is_file() and (p.suffix.lower() in {'.pth', '.pt', '.ckpt', '.safetensors'} or (p.suffix.lower() == '.onnx' and p.stat().st_size > 1_000_000))];
          assert not weights, weights"
        - mkdir -p /opt/labelme/wrappers /opt/labelme/share/licenses
        - install -m 0755 {{ get_file("labelme_wrapper") }} /opt/labelme/wrappers/labelme
        - install -m 0644 {{ get_file("labelme_license") }} /opt/labelme/share/licenses/LABELME-LICENSE.txt
        - install -m 0644 /usr/share/common-licenses/GPL-3 /opt/labelme/share/licenses/GPL-3.0.txt
        - install -m 0644 {{ get_file("gpl_source_notice") }} /opt/labelme/share/licenses/GPL-SOURCE-NOTICE.txt
        - chmod -R a+rX /opt/labelme
        - rm -rf /root/.cache/pip

files:
  - name: labelme_license
    url: https://raw.githubusercontent.com/wkentaro/labelme/v{{ context.upstream_version }}/LICENSE
  - name: gpl_source_notice
    contents: |
      Labelme {{ context.upstream_version }} Container — License & Source Notice
      ==========================================================================
      Labelme {{ context.upstream_version }} is licensed under the GNU General
      Public License v3.0 only (GPL-3.0-only). Its complete Python source code
      is installed directly inside /opt/labelme/lib/python*/site-packages/labelme/.
      The license text is installed at /opt/labelme/share/licenses/LABELME-LICENSE.txt
      and /opt/labelme/share/licenses/GPL-3.0.txt.

      Qt / PySide6 bindings are provided by Ubuntu 26.04 (resolute) APT packages
      (python3-pyside6.*); Ubuntu copyright notices are located under
      /usr/share/doc/python3-pyside6.qtcore/copyright.
  - name: labelme_wrapper
    executable: true
    contents: |
      #!/opt/labelme/bin/python
      """Run Labelme with private non-/home XDG/Qt runtime and cache paths."""

      from __future__ import annotations

      import getpass
      import os
      import shutil
      import signal
      import subprocess
      import sys
      import tempfile


      ENV_SUBDIRS = (
          ("XDG_CONFIG_HOME", "config"),
          ("XDG_CACHE_HOME", "cache"),
          ("XDG_DATA_HOME", "data"),
          ("XDG_RUNTIME_DIR", "runtime"),
          ("MPLCONFIGDIR", "mpl"),
      )


      def _is_writable_dir(path_str: str | None) -> bool:
          if not path_str:
              return False
          try:
              os.makedirs(path_str, exist_ok=True)
              fd, probe = tempfile.mkstemp(prefix=".labelme-write-check-", dir=path_str)
              os.close(fd)
              os.unlink(probe)
              return True
          except OSError:
              return False


      def main() -> int:
          cmd = ["/opt/labelme/bin/labelme", *sys.argv[1:]]
          env = os.environ.copy()
          try:
              getpass.getuser()
          except Exception:
              env["USER"] = f"uid{os.getuid()}"
          missing = [item for item in ENV_SUBDIRS if not _is_writable_dir(env.get(item[0]))]
          if not env.get("HOME"):
              missing.append(("HOME", "home"))
          if not missing:
              os.execve(cmd[0], cmd, env)

          tmp_root: str | None = None
          proc: subprocess.Popen[bytes] | None = None
          received_signal: int | None = None
          pending_signal: int | None = None
          pending_tstp = False
          tty_fd: int | None = None
          orig_pgrp: int | None = None
          handed_tty = False

          def set_tty_pgrp(pgrp: int) -> bool:
              if tty_fd is None:
                  return False
              prev = signal.signal(signal.SIGTTOU, signal.SIG_IGN)
              try:
                  os.tcsetpgrp(tty_fd, pgrp)
                  return True
              except OSError:
                  return False
              finally:
                  signal.signal(signal.SIGTTOU, prev)

          def owns_tty() -> bool:
              if tty_fd is None or orig_pgrp is None:
                  return False
              try:
                  return os.tcgetpgrp(tty_fd) == orig_pgrp
              except OSError:
                  return False

          def child_owns_tty() -> bool:
              if tty_fd is None or proc is None:
                  return False
              try:
                  return os.tcgetpgrp(tty_fd) == proc.pid
              except OSError:
                  return False

          def hand_tty_to_child() -> None:
              nonlocal handed_tty
              if proc is None or tty_fd is None or not owns_tty():
                  return
              if set_tty_pgrp(proc.pid):
                  handed_tty = True

          def reclaim_tty() -> None:
              nonlocal handed_tty
              if handed_tty and tty_fd is not None and orig_pgrp is not None:
                  if child_owns_tty():
                      set_tty_pgrp(orig_pgrp)
                  handed_tty = False

          def forward(signum: int) -> None:
              if proc is not None and proc.returncode is None:
                  try:
                      os.killpg(proc.pid, signum)
                      if signum in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP):
                          os.killpg(proc.pid, signal.SIGCONT)
                  except ProcessLookupError:
                      pass

          def handle_signal(signum: int, _frame: object) -> None:
              nonlocal received_signal, pending_signal
              received_signal = signum
              if proc is None:
                  pending_signal = signum
              else:
                  forward(signum)

          def handle_cont(_signum: int, _frame: object) -> None:
              if proc is not None and proc.returncode is None and received_signal is None:
                  hand_tty_to_child()

          def handle_tstp(_signum: int, _frame: object) -> None:
              nonlocal pending_tstp
              if proc is None:
                  pending_tstp = True
              elif proc.returncode is None:
                  try:
                      os.killpg(proc.pid, signal.SIGTSTP)
                  except ProcessLookupError:
                      pass

          def stop_self(stop_sig: int) -> None:
              prev_tstp = signal.signal(signal.SIGTSTP, signal.SIG_DFL)
              try:
                  os.kill(os.getpid(), stop_sig)
              finally:
                  signal.signal(signal.SIGTSTP, prev_tstp)

          try:
              # Install signal handlers BEFORE creating tmp_root so an early
              # SIGHUP/SIGINT/SIGTERM can never terminate the wrapper and leak scratch.
              signal.signal(signal.SIGINT, handle_signal)
              signal.signal(signal.SIGTERM, handle_signal)
              signal.signal(signal.SIGHUP, handle_signal)
              signal.signal(signal.SIGCONT, handle_cont)
              signal.signal(signal.SIGTSTP, handle_tstp)
              if received_signal is not None:
                  return 128 + received_signal

              tmp_root = tempfile.mkdtemp(prefix="labelme.")
              for key, subdir in missing:
                  path = os.path.join(tmp_root, subdir)
                  os.mkdir(path, 0o700)
                  env[key] = path
              if received_signal is not None:
                  return 128 + received_signal

              try:
                  tty_fd = os.open("/dev/tty", os.O_RDWR | os.O_NOCTTY | os.O_CLOEXEC)
                  os.tcgetpgrp(tty_fd)
                  orig_pgrp = os.getpgrp()
              except OSError:
                  if tty_fd is not None:
                      try:
                          os.close(tty_fd)
                      except OSError:
                          pass
                  tty_fd = None

              # Place the child in its own process group so a group SIGINT is delivered
              # once; transfer foreground terminal ownership only when this job owns
              # the TTY, and propagate job-control stops (Ctrl-Z/bg/fg/tostop) cleanly.
              proc = subprocess.Popen(cmd, env=env, process_group=0)
              if received_signal is None and owns_tty():
                  hand_tty_to_child()
                  if handed_tty:
                      try:
                          os.killpg(proc.pid, signal.SIGCONT)
                      except ProcessLookupError:
                          pass

              sig_to_replay, pending_signal = pending_signal, None
              if sig_to_replay is not None:
                  forward(sig_to_replay)
              elif pending_tstp:
                  pending_tstp = False
                  try:
                      os.killpg(proc.pid, signal.SIGTSTP)
                  except ProcessLookupError:
                      pass

              rc = 0
              while True:
                  try:
                      _, status = os.waitpid(proc.pid, os.WUNTRACED)
                  except InterruptedError:
                      continue
                  except ChildProcessError:
                      break
                  if os.WIFSTOPPED(status):
                      stop_sig = os.WSTOPSIG(status)
                      if received_signal is not None:
                          try:
                              os.killpg(proc.pid, signal.SIGCONT)
                          except ProcessLookupError:
                              pass
                          continue
                      if stop_sig in (signal.SIGTTIN, signal.SIGTTOU) and (
                          owns_tty() or child_owns_tty()
                      ):
                          hand_tty_to_child()
                          try:
                              os.killpg(proc.pid, signal.SIGCONT)
                          except ProcessLookupError:
                              pass
                          continue
                      reclaim_tty()
                      stop_self(stop_sig)
                      if received_signal is not None:
                          try:
                              os.killpg(proc.pid, signal.SIGCONT)
                          except ProcessLookupError:
                              pass
                          continue
                      hand_tty_to_child()
                      try:
                          os.killpg(proc.pid, signal.SIGCONT)
                      except ProcessLookupError:
                          pass
                      continue
                  if os.WIFSIGNALED(status):
                      rc = -os.WTERMSIG(status)
                  elif os.WIFEXITED(status):
                      rc = os.WEXITSTATUS(status)
                  else:
                      continue
                  proc.returncode = rc
                  break
              if received_signal is not None:
                  return 128 + received_signal
              return 128 - rc if rc < 0 else rc
          finally:
              reclaim_tty()
              if tty_fd is not None:
                  try:
                      os.close(tty_fd)
                  except OSError:
                      pass
              if tmp_root is not None:
                  shutil.rmtree(tmp_root, ignore_errors=True)


      if __name__ == "__main__":
          raise SystemExit(main())

deploy:
  bins:
    - labelme

gui_apps:
  - name: "LabelMe"
    exec: "labelme"

domains:
  - microscopy
  - dermatology

categories:
  - "image segmentation"
  - "optical imaging"
  - "visualization"

readme: |-
  ----------------------------------
  ## labelme/{{ context.version }} ##

  Labelme is an open-source graphical image annotation tool for polygon,
  rectangle, circle, line, point, and mask labeling — well suited for offline
  dermoscopic lesion delineation, clinical macro photography, and chronic wound
  boundary annotation.

  This container ships code only (no pre-downloaded AI/SAM weights) and uses
  Ubuntu 26.04 system `PySide6` packages.

  ### Included GUI Tool
  ```
  labelme    Launch the Labelme Qt6 annotation GUI
  ```

  ### Example
  ```
  ml labelme/{{ context.version }}
  labelme ./dermoscopy_images/ --output ./annotations/ --labels lesion,ruler,hair
  ```

  Documentation: https://github.com/wkentaro/labelme
  License texts (`LABELME-LICENSE.txt`, `GPL-3.0.txt`, and `GPL-SOURCE-NOTICE.txt`)
  are installed under `/opt/labelme/share/licenses/`.
  ----------------------------------

icon: data:image/png;base64,
