name: dentateseg
version: "0.3.2"

copyright:
  - license: NOASSERTION
    name: DentateSeg (no license declared upstream)
    url: https://github.com/art2mri/DentateSeg

architectures:
  - x86_64

auto_update:
  method: dockerhub
  repo: diogohs/dentateseg
  version_regex: ^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$

build:
  kind: neurodocker
  base-image: diogohs/dentateseg:{{ context.version }}
  pkg-manager: apt
  add-default-template: false
  add-tzdata: false

  directives:
    - environment:
        RUNNING_IN_DOCKER: "true"
        PYTHONUNBUFFERED: "1"
        PYTHONIOENCODING: utf-8
        PYTHONPATH: /app
    - run:
        - install -m 0755 {{ get_file("dentateseg") }} /usr/local/bin/dentateseg
        - ln -sf /usr/local/bin/dentateseg /usr/local/bin/dentateseg.sh
        - install -m 0755 {{ get_file("dentateseg-entrypoint") }} /usr/local/bin/dentateseg-entrypoint
        - test -x /usr/local/bin/dentateseg
        - test -x /usr/local/bin/dentateseg.sh
    - entrypoint: /usr/local/bin/dentateseg-entrypoint

deploy:
  bins:
    - dentateseg
    - dentateseg.sh

files:
  - name: dentateseg
    contents: |
      #!/usr/bin/env bash
      set -euo pipefail

      usage() {
          cat <<'EOF'
      DentateSeg: Automated cerebellar dentate nucleus segmentation from QSM MRI

      Usage: dentateseg -i INPUT_RESOURCE -o OUTPUT_DIRECTORY [--gpu] [--debug]

      Args:
        -i, --input_resource INPUT_RESOURCE
            Path to an input NIfTI file (.nii or .nii.gz) or directory of NIfTI files. (Required)

        -o, --output_directory OUTPUT_DIRECTORY
            Path to the output directory where segmentation results and reports will be saved. (Required)

        --gpu
            Enable CUDA GPU acceleration for inference (run container with --nv or --gpus=all). (Optional)

        --debug
            Enable verbose debug logging. (Optional)

        -h, --help
            Display this help message and exit.
      EOF
      }

      if [ "$#" -eq 0 ]; then
          usage
          exit 0
      fi

      ORIG_PWD="$PWD"
      INPUT_RESOURCE=""
      OUTPUT_DIRECTORY=""
      EXTRA_ARGS=()

      while [ "$#" -gt 0 ]; do
          case "$1" in
              -h|--help)
                  usage
                  exit 0
                  ;;
              -i|--input_resource)
                  if [ "$#" -lt 2 ]; then
                      echo "Error: $1 requires a path argument." >&2
                      exit 2
                  fi
                  INPUT_RESOURCE="$2"
                  shift 2
                  ;;
              --input_resource=*)
                  INPUT_RESOURCE="${1#*=}"
                  shift
                  ;;
              -o|--output_directory)
                  if [ "$#" -lt 2 ]; then
                      echo "Error: $1 requires a path argument." >&2
                      exit 2
                  fi
                  OUTPUT_DIRECTORY="$2"
                  shift 2
                  ;;
              --output_directory=*)
                  OUTPUT_DIRECTORY="${1#*=}"
                  shift
                  ;;
              *)
                  EXTRA_ARGS+=("$1")
                  shift
                  ;;
          esac
      done

      if [ -z "$INPUT_RESOURCE" ] || [ -z "$OUTPUT_DIRECTORY" ]; then
          echo "Error: Both -i/--input_resource and -o/--output_directory are required." >&2
          usage >&2
          exit 2
      fi

      USE_STORAGE_FALLBACK=false
      INPUT_ABS="$(realpath -m -- "$INPUT_RESOURCE")"
      if [ ! -e "$INPUT_ABS" ] && [[ "$INPUT_RESOURCE" != /* ]] && [ -e "/dentateseg-storage/$INPUT_RESOURCE" ]; then
          INPUT_ABS="$(realpath -m -- "/dentateseg-storage/$INPUT_RESOURCE")"
          USE_STORAGE_FALLBACK=true
      fi

      if [ ! -e "$INPUT_ABS" ]; then
          echo "Error: Input resource does not exist: $INPUT_ABS" >&2
          exit 1
      fi

      if [ "$USE_STORAGE_FALLBACK" = true ] && [[ "$OUTPUT_DIRECTORY" != /* ]] && [ -d "/dentateseg-storage" ]; then
          OUTPUT_ABS="$(realpath -m -- "/dentateseg-storage/$OUTPUT_DIRECTORY")"
      else
          OUTPUT_ABS="$(realpath -m -- "$OUTPUT_DIRECTORY")"
      fi

      WORKDIR_TMP="$(mktemp -d "${TMPDIR:-/tmp}/dentateseg.XXXXXX")"
      trap 'rm -rf "$WORKDIR_TMP"' EXIT
      ln -s /app/config.yaml "$WORKDIR_TMP/config.yaml"

      export RUNNING_IN_DOCKER=true
      export PYTHONUNBUFFERED=1
      export PYTHONIOENCODING=utf-8
      export PYTHONPATH="/app${PYTHONPATH:+:$PYTHONPATH}"
      : "${MPLCONFIGDIR:=$WORKDIR_TMP/mpl}"
      : "${CUDA_CACHE_PATH:=$WORKDIR_TMP/cuda-cache}"
      export MPLCONFIGDIR CUDA_CACHE_PATH
      mkdir -p "$MPLCONFIGDIR" "$CUDA_CACHE_PATH"

      cd "$WORKDIR_TMP"
      python3 /app/main.py -i "$INPUT_ABS" -o "$OUTPUT_ABS" "${EXTRA_ARGS[@]}"

  - name: dentateseg-entrypoint
    contents: |
      #!/usr/bin/env bash
      set -e

      if [ "$#" -eq 0 ]; then
          exec /usr/bin/env bash
      fi

      if [ "${1#-}" != "$1" ]; then
          exec /usr/local/bin/dentateseg "$@"
      fi

      exec "$@"

structured_readme:
  description: >-
    DentateSeg is an automated deep-learning pipeline for segmenting the left
    and right cerebellar dentate nuclei from Quantitative Susceptibility Mapping
    (QSM) MRI images. It runs a two-stage workflow combining a MONAI 3D U-Net
    cerebellar localization model with a 5-fold 3D full-resolution nnU-Net v2
    segmentation ensemble, producing labeled NIfTI masks (1 = left dentate
    nucleus, 2 = right dentate nucleus) along with CSV and Excel volumetric and
    texture analysis reports. Both CPU and CUDA GPU execution (`--gpu`, with
    `--nv` under Apptainer/Singularity or `--gpus=all` under Docker) are
    supported.
  example: |-
    # Show CLI usage
    dentateseg --help

    # Segment a QSM NIfTI image on CPU
    dentateseg -i QSM_image.nii.gz -o dentateseg-output

    # Segment a QSM NIfTI image or directory using a CUDA GPU
    dentateseg -i QSM_image.nii.gz -o dentateseg-output --gpu
  documentation: https://github.com/art2mri/DentateSeg
  citation: >-
    Shiraishi, D. H.*, Saha, S.*, et al., Harding, I. H., Rezende, T. J. R.,
    TRACK-FA Neuroimaging Consortium (*co-first). Automated Deep Learning-based
    Segmentation of the Dentate Nucleus Using Quantitative Susceptibility
    Mapping MRI. Radiology: Artificial Intelligence (2025).
    https://doi.org/10.1148/ryai.240478

domains:
  - neuroimaging

categories:
  - image segmentation
  - quantitative imaging
  - structural imaging
  - machine learning

icon: data:image/png;base64,
