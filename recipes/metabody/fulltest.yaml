name: metabody
version: 1.0.5

tests:
  - name: OpenRecon server help
    description: Verify the python-ismrmrd server entrypoint starts correctly.
    script: |
      python /opt/code/python-ismrmrd-server/main.py -h 2>&1 |
        grep 'Example server for MRD streaming format'

  - name: Metabody module imports
    description: Verify the reconstruction module imports with its runtime dependencies.
    script: |
      PYTHONPATH=/opt/code/python-ismrmrd-server \
        python -c "import metabody; print(metabody.__file__)" |
        grep -x '/opt/code/python-ismrmrd-server/metabody.py'

  - name: AFNI workflow is executable
    description: Verify the deployed processing entrypoint is available.
    script: |
      test -x /opt/code/afni_processing.sh

  - name: AFNI stimulus timing files present
    description: Verify every stimulus timing file the AFNI workflow references is installed.
    script: |
      grep -o '/opt/code/stim_times/[^"]*\.1D' /opt/code/afni_processing.sh > /tmp/stim_files
      test "$(wc -l < /tmp/stim_files)" -eq 7
      while IFS= read -r f; do test -s "$f" || { echo "missing $f"; exit 1; }; done < /tmp/stim_files
