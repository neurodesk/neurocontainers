# openmsk container test suite
# Focused verification for OpenRecon runtime packaging and lightweight entrypoints.

name: openmsk
version: 0.1.11

test_data:
  output_dir: test_output

setup:
  script: |
    #!/usr/bin/env bash
    set -e
    mkdir -p ${output_dir}

tests:
  - name: openmsk wrapper
    description: Verify the NeuroContainers version wrapper is installed
    script: |
      test "$(openmsk)" = "openmsk ${OPENMSK_VERSION}"

  - name: OpenRecon server help
    description: Verify the python-ismrmrd server entrypoint starts correctly
    script: |
      python3 /opt/code/python-ismrmrd-server/main.py -h 2>&1 | sed -n '1,20p' | grep 'Example server for MRD streaming format'

  - name: OpenRecon assets
    description: Verify packaged OpenRecon label and README assets are present and readable
    script: |
      python - <<'PY'
      import json
      from pathlib import Path

      label = Path("/opt/code/python-ismrmrd-server/OpenReconLabel.json")
      readme = Path("/opt/code/python-ismrmrd-server/OpenReconREADME.md")
      data = json.loads(label.read_text())
      parameters = {parameter["id"] for parameter in data["parameters"]}
      assert {"sendoriginal", "segmodel", "computethickness"} <= parameters
      assert "OpenMSK" in readme.read_text()
      print(label)
      PY

  - name: OpenMSK module imports
    description: Verify the OpenRecon module imports with its runtime dependencies
    script: |
      PYTHONPATH=/opt/code/python-ismrmrd-server python3 - <<'PY'
      import os

      import openmsk
      import ismrmrd
      import nibabel
      import numpy

      assert openmsk.OPENMSK_VERSION == os.environ["OPENMSK_VERSION"]
      assert openmsk.UPSTREAM_LABELS == {
          0: "background",
          1: "patellar_cartilage",
          2: "femoral_cartilage",
          3: "medial_tibial_cartilage",
          4: "lateral_tibial_cartilage",
          5: "medial_meniscus",
          6: "lateral_meniscus",
          7: "femur",
          8: "tibia",
          9: "patella",
      }
      PY

  - name: offline pymskt reference image
    description: Verify cartilage subregion generation can load its packaged reference without network access
    script: |
      python - <<'PY'
      from pathlib import Path
      import inspect

      import pymskt
      import SimpleITK as sitk
      from pymskt.image.cartilage_processing import get_aligned_cartilage_subregions

      reference = Path(pymskt.__file__).resolve().parent / "data" / "right_knee_example.nrrd"
      assert reference.is_file(), reference
      default_reference = inspect.signature(
          get_aligned_cartilage_subregions
      ).parameters["reference_image_input"].default
      assert Path(default_reference).resolve() == reference.resolve()
      image = sitk.ReadImage(str(reference))
      assert image.GetSize() == (384, 384, 160)
      print(reference)
      PY

  - name: Helper scripts render help
    description: Verify conversion helper scripts start and expose command line help
    script: |
      python3 /opt/code/python-ismrmrd-server/enhanceddicom2mrd.py -h 2>&1 | grep 'usage:'
      python3 /opt/code/python-ismrmrd-server/nifti2mrd.py -h 2>&1 | grep 'usage:'
      python3 /opt/code/python-ismrmrd-server/enhanced2singleframe.py -h 2>&1 | grep 'usage:'
