name: openmsk
version: 0.1.11
architectures:
  - x86_64

variables:
  # When bumping this commit, re-check the label contract in openmsk.py:
  # steps/generate_meshes.py and steps/t2_mapping.py must still hard-code
  # canonical labels 1-7 (+ subregions 11-15) and leave canonical 8/9 unused,
  # because openmsk.py parks the menisci there during post-processing.
  kneepipeline_commit: "61144f23d9001950a70f77cb70d628e1883da86d"
  dosma_sagittal_model_url: "https://huggingface.co/aagatti/dosma_bones/resolve/main/sagittal_best_model.h5"
  dosma_coronal_model_url: "https://huggingface.co/aagatti/dosma_bones/resolve/main/coronal_best_model.h5"
  dosma_axial_model_url: "https://huggingface.co/aagatti/dosma_bones/resolve/main/axial_best_model.h5"
  nnunet_fullres_dataset_url: "https://huggingface.co/aagatti/nnunet_knee/resolve/main/models/Dataset500_KneeMRI/nnUNetTrainer__nnUNetResEncUNetMPlans__3d_fullres/dataset.json"
  nnunet_fullres_model_config_url: "https://huggingface.co/aagatti/nnunet_knee/resolve/main/models/Dataset500_KneeMRI/nnUNetTrainer__nnUNetResEncUNetMPlans__3d_fullres/model_config.json"
  nnunet_fullres_plans_url: "https://huggingface.co/aagatti/nnunet_knee/resolve/main/models/Dataset500_KneeMRI/nnUNetTrainer__nnUNetResEncUNetMPlans__3d_fullres/plans.json"
  nnunet_fullres_checkpoint_best_url: "https://huggingface.co/aagatti/nnunet_knee/resolve/main/models/Dataset500_KneeMRI/nnUNetTrainer__nnUNetResEncUNetMPlans__3d_fullres/fold_1/checkpoint_best.pth"
  pymskt_commit: "88b947e3075d270f345bf7f8b545ead7daefd125"
  pymskt_right_knee_reference_url: "https://raw.githubusercontent.com/gattia/pymskt/{{ context.pymskt_commit }}/data/right_knee_example.nrrd"
  pymskt_right_knee_reference_sha256: "90af3273cf9323f2e5212f917f60b60725dde90838569c3607990d16309fc2aa"

files:
  - name: openmsk.py
    filename: openmsk.py
  - name: OpenReconLabel.json
    filename: OpenReconLabel.json
  - name: OpenReconREADME.md
    filename: OpenReconREADME.md
  - name: enhanceddicom2mrd.py
    filename: enhanceddicom2mrd.py
  - name: nifti2mrd.py
    filename: nifti2mrd.py
  - name: enhanced2singleframe.py
    filename: enhanced2singleframe.py
  - name: nnunet_numpy_compat.py
    filename: nnunet_numpy_compat.py
  - name: openmsk_nnunet_worker_patch.py
    filename: openmsk_nnunet_worker_patch.py
  - name: dosma_sagittal_model
    url: "{{ context.dosma_sagittal_model_url }}"
  - name: dosma_coronal_model
    url: "{{ context.dosma_coronal_model_url }}"
  - name: dosma_axial_model
    url: "{{ context.dosma_axial_model_url }}"
  - name: nnunet_fullres_dataset
    url: "{{ context.nnunet_fullres_dataset_url }}"
  - name: nnunet_fullres_model_config
    url: "{{ context.nnunet_fullres_model_config_url }}"
  - name: nnunet_fullres_plans
    url: "{{ context.nnunet_fullres_plans_url }}"
  - name: nnunet_fullres_checkpoint_best
    url: "{{ context.nnunet_fullres_checkpoint_best_url }}"
  - name: pymskt_right_knee_reference
    url: "{{ context.pymskt_right_knee_reference_url }}"
  - name: openmsk
    contents: |-
      #!/usr/bin/env bash
      printf 'openmsk {{ context.version }}\n'
  - name: openmsk_config
    contents: |-
      {
        "perform_bone_only_nsm": false,
        "perform_bone_and_cart_nsm": false,
        "clip_femur_top": true,
        "default_seg_model": "goyal_sagittal",
        "batch_size": 32,
        "models": {
          "acl_qdess_bone_july_2024": "/opt/DOSMA_WEIGHTS/sagittal_best_model.h5",
          "goyal_sagittal": "/opt/DOSMA_WEIGHTS/sagittal_best_model.h5",
          "goyal_coronal": "/opt/DOSMA_WEIGHTS/coronal_best_model.h5",
          "goyal_axial": "/opt/DOSMA_WEIGHTS/axial_best_model.h5"
        },
        "nnunet": {
          "type": "fullres",
          "model_name": "Dataset500_KneeMRI"
        }
      }

build:
  kind: neurodocker
  # Official TensorFlow GPU base with Python 3.11, Ubuntu 22.04, and TensorFlow
  # built for CUDA 11.8/cuDNN 8. Keep TensorFlow and PyTorch on matching CUDA
  # 11.8 stacks so DOSMA segmentation can run on scanner GPUs.
  base-image: tensorflow/tensorflow:2.14.0-gpu
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
    - install:
        - bzip2
        - ca-certificates
        # TensorFlow/cuDNN dlopens libnvrtc.so during DOSMA segmentation.
        - cuda-nvrtc-11-8
        - cuda-nvrtc-dev-11-8
        - git
        - libgl1
        - libglib2.0-0
        - libgomp1
        - libsm6
        - libxext6
        - libxrender1
        # The OpenRecon macro invokes /usr/bin/python3 -m pip after its apt
        # layer, so the system Python needs pip even though TensorFlow ships a
        # separate /usr/local Python environment.
        - python3-pip
        - unzip

    # The TensorFlow image keeps pip in its Python 3.11 environment, but the
    # OpenRecon macro's apt layer restores /usr/bin/python3 to Ubuntu's 3.10
    # interpreter. Keep python3-pip installed for the macro's python3 -m pip
    # calls, and point pip/pip3 at /usr/bin/python for later unqualified pip
    # calls before that apt layer runs.
    - run:
        - python -m pip --version
        - sed -i '1s|.*|#!/usr/bin/python|' /usr/local/bin/pip /usr/local/bin/pip3
        - python -c "import tensorflow as tf, keras, pathlib; pathlib.Path('/opt/pip-constraints.txt').write_text('tensorflow==%s\nkeras==%s\nnumpy==1.24.3\n' % (tf.__version__, keras.__version__))"
        - cat /opt/pip-constraints.txt
        - pip3 --version
    - environment:
        PIP_CONSTRAINT: /opt/pip-constraints.txt

    - include: macros/openrecon/neurodocker.yaml

    # Install the CUDA-enabled PyTorch code without its duplicate NVIDIA wheel
    # stack. The TensorFlow GPU base already provides CUDA 11.8/cuDNN; only
    # NCCL is absent from the base and must remain as a Python wheel.
    - run:
        - pip install --no-cache-dir --no-deps --extra-index-url https://download.pytorch.org/whl/cu118 torch==2.2.2+cu118 torchvision==0.17.2+cu118
        - pip install --no-cache-dir nvidia-nccl-cu11==2.19.3
        - LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH python -c "from importlib.metadata import version; import torch; assert torch.version.cuda == '11.8'; print('PyTorch using system CUDA', torch.__version__, version('torchvision'))"
        - python -c "from importlib.metadata import version; import pathlib; path = pathlib.Path('/opt/pip-constraints.txt'); path.write_text(path.read_text() + 'torch==%s\ntorchvision==%s\n' % (version('torch'), version('torchvision')))"
        - cat /opt/pip-constraints.txt

    - workdir: /opt
    - run:
        - pip install --no-cache-dir huggingface-hub==0.24.7
        # NSM: install against the baseline torch and the minimal pyMSKT set below.
        - git clone https://github.com/gattia/nsm /opt/nsm
        - cd /opt/nsm
        - sed -i -E '/^[[:space:]]*(torch|torchvision|torchaudio|mskt)([[:space:]]*[<>=!~].*)?[[:space:]]*$/d' requirements.txt
        - pip install --no-cache-dir -r requirements.txt
        - pip install --no-cache-dir --no-deps .
        # DOSMA bone_seg branch (qDESS bone/cartilage segmentation).
        - git clone https://github.com/gattia/DOSMA /opt/DOSMA
        - cd /opt/DOSMA
        - git checkout bone_seg
        - pip install --no-cache-dir '.[ai]'
        # Install only the pyMSKT dependencies used by KneePipeline's subregion,
        # mesh, and thickness paths. Omit ITK widgets, Jupyter/Notebook,
        # traittypes, and optional non-rigid registration dependencies.
        # pymeshfix is pinned because pyMSKT passes repair(verbose=...), which
        # was removed in pymeshfix >=0.17.
        - pip install --no-cache-dir point-cloud-utils==0.34.0 pyacvd==0.4.0 pyvista==0.48.4 vtk==9.6.2 param==2.4.1 cycpd==0.28 SimpleITK==2.3.1 pandas==2.0.3 Pillow==10.4.0 pymeshfix==0.16.2 batchgenerators==0.25.3 dicom2nifti==2.6.2 graphviz==0.21 imagecodecs==2026.1.14 yacs==0.1.8 connected-components-3d==4.0.0 blosc2==3.0.0b4 jinja2==3.1.6 sympy==1.14.0
        # These packages declare torch dependencies. Resolve their runtime
        # dependencies above, then install without allowing pip to backfill the
        # duplicate CUDA wheels from torch's package metadata.
        - pip install --no-cache-dir --no-deps acvl-utils==0.2.6 dynamic-network-architectures==0.3.1 nnunetv2==2.4.2 mskt==0.1.20
        - echo "{{ context.pymskt_right_knee_reference_sha256 }}  {{ get_file("pymskt_right_knee_reference") }}" | sha256sum -c -
        # Locate pyMSKT without importing it: its optional-dependency warning is
        # printed to stdout and would corrupt a command-substitution path.
        - pymskt_reference_path="$(python -c 'from importlib.util import find_spec; from pathlib import Path; print(Path(next(iter(find_spec("pymskt").submodule_search_locations))) / "data" / "right_knee_example.nrrd")')" && install -D -m 0644 {{ get_file("pymskt_right_knee_reference") }} "${pymskt_reference_path}" && echo "{{ context.pymskt_right_knee_reference_sha256 }}  ${pymskt_reference_path}" | sha256sum -c -
        # KneePipeline's TF 2.11 / nnU-Net numpy compromise (resolved last).
        - pip install --no-cache-dir "numpy==1.24.3"
        - install -D -m 0644 {{ get_file("nnunet_numpy_compat.py") }} /opt/openmsk_compat/sitecustomize.py
        - PYTHONPATH=/opt/openmsk_compat python -c "import numpy, numpy._core, numpy._core.multiarray; print('nnU-Net NumPy compat loaded for numpy', numpy.__version__)"
    - run:
        - git clone --recurse-submodules https://github.com/gattia/KneePipeline /opt/KneePipeline
        - cd /opt/KneePipeline
        - git checkout {{ context.kneepipeline_commit }}
        - git submodule update --init --recursive
        - python {{ get_file("openmsk_nnunet_worker_patch.py") }} /opt/KneePipeline/DEPENDENCIES/nnunet_knee_inference/scripts/inference.py
        - mkdir -p /opt/DOSMA_WEIGHTS /opt/NSM_MODELS /opt/KneePipeline/DEPENDENCIES/nnunet_knee_inference/huggingface/models/Dataset500_KneeMRI/nnUNetTrainer__nnUNetResEncUNetMPlans__3d_fullres/fold_1
        - cp {{ get_file("dosma_sagittal_model") }} /opt/DOSMA_WEIGHTS/sagittal_best_model.h5
        - cp {{ get_file("dosma_coronal_model") }} /opt/DOSMA_WEIGHTS/coronal_best_model.h5
        - cp {{ get_file("dosma_axial_model") }} /opt/DOSMA_WEIGHTS/axial_best_model.h5
        - cp {{ get_file("nnunet_fullres_dataset") }} /opt/KneePipeline/DEPENDENCIES/nnunet_knee_inference/huggingface/models/Dataset500_KneeMRI/nnUNetTrainer__nnUNetResEncUNetMPlans__3d_fullres/dataset.json
        - cp {{ get_file("nnunet_fullres_model_config") }} /opt/KneePipeline/DEPENDENCIES/nnunet_knee_inference/huggingface/models/Dataset500_KneeMRI/nnUNetTrainer__nnUNetResEncUNetMPlans__3d_fullres/model_config.json
        - cp {{ get_file("nnunet_fullres_plans") }} /opt/KneePipeline/DEPENDENCIES/nnunet_knee_inference/huggingface/models/Dataset500_KneeMRI/nnUNetTrainer__nnUNetResEncUNetMPlans__3d_fullres/plans.json
        - cp {{ get_file("nnunet_fullres_checkpoint_best") }} /opt/KneePipeline/DEPENDENCIES/nnunet_knee_inference/huggingface/models/Dataset500_KneeMRI/nnUNetTrainer__nnUNetResEncUNetMPlans__3d_fullres/fold_1/checkpoint_best.pth
        - cp {{ get_file("openmsk_config") }} /opt/KneePipeline/config.json
        - find /opt/KneePipeline -name .git -type d -prune -exec rm -rf {} +
        - find /opt/nsm -name .git -type d -prune -exec rm -rf {} +
        - find /opt/DOSMA -name .git -type d -prune -exec rm -rf {} +
        - pip cache purge || true
        - install -m 0755 {{ get_file("openmsk") }} /usr/local/bin/openmsk
        - mkdir -p /tmp/share/debug
        - chmod 1777 /tmp/share /tmp/share/debug
    # Runtime environment. CUDA libs from the TensorFlow base image plus the
    # NVIDIA runtime mounts let TensorFlow/torch load on a GPU host; harmless on
    # CPU-only hosts.
    - environment:
        OPENMSK_VERSION: "{{ context.version }}"
        KNEEPIPELINE_HOME: /opt/KneePipeline
        KNEEPIPELINE_CONFIG: /opt/KneePipeline/config.json
        OPENMSK_NNUNET_NUMPY_COMPAT_PATH: /opt/openmsk_compat
        OPENMSK_NNUNET_NUM_PROCESSES_PREPROCESSING: "1"
        OPENMSK_NNUNET_NUM_PROCESSES_EXPORT: "1"
        PYTHONPATH: /opt/openmsk_compat
        LD_LIBRARY_PATH: /usr/local/cuda/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64:$LD_LIBRARY_PATH
        # The DOSMA qDESS TF models are saved channels-first (NCHW). On a GPU
        # that runs natively; on CPU-only hosts oneDNN is required for NCHW
        # Conv2D, so enable it (harmless on GPU).
        TF_ENABLE_ONEDNN_OPTS: "1"
    - run:
        - cp {{ get_file("openmsk.py") }} /opt/code/python-ismrmrd-server/openmsk.py
        - cp {{ get_file("OpenReconLabel.json") }} /opt/code/python-ismrmrd-server/OpenReconLabel.json
        - cp {{ get_file("OpenReconREADME.md") }} /opt/code/python-ismrmrd-server/OpenReconREADME.md
        - cp {{ get_file("enhanceddicom2mrd.py") }} /opt/code/python-ismrmrd-server/enhanceddicom2mrd.py
        - cp {{ get_file("nifti2mrd.py") }} /opt/code/python-ismrmrd-server/nifti2mrd.py
        - cp {{ get_file("enhanced2singleframe.py") }} /opt/code/python-ismrmrd-server/enhanced2singleframe.py
    # Utility: expand Siemens qDESS Enhanced (multi-frame) DICOM into classic
    # single-frame DICOM so the direct `run_pipeline.py <dicom_dir>` path (DOSMA
    # QDess.from_dicom: qDESS RSS segmentation + T2) can read it.

deploy:
  bins:
    - python
    - openmsk

readme: |-
  ----------------------------------
  ## openmsk/{{ context.version }} ##

  OpenMSK packages the KneePipeline knee MRI toolbox as a Siemens OpenRecon
  image-to-image module for DESS knee MRI. The OpenRecon path receives MRD
  images from the scanner, builds a two-echo RSS NIfTI, runs KneePipeline, and
  returns bone/cartilage/meniscus segmentation with geometry copied from the
  source images.

  This OpenRecon workflow was tested using the Siemens DESS WIP
  `wip_dess_CS_260902` on a MAGNETOM 3.0T X60 running Numaris/X VA61A-092T.
  The protocol exports are stored in this repository and available from
  GitHub: [PDF](https://github.com/NeuroDesk/neurocontainers/blob/main/recipes/openmsk/wip_dess_CS_260902.pdf)
  and [.pro](https://github.com/NeuroDesk/neurocontainers/blob/main/recipes/openmsk/wip_dess_CS_260902.pro).
  The `.pro` file includes the saved OpenRecon algorithm selection and OpenMSK
  parameters used for the test.

  The wrapper preserves both DESS echo groups and synthesizes a
  minimal two-echo DICOM series with TR/TE/flip and DOSMA-compatible GL/TG
  adapter fields. This lets KneePipeline's DESS loader run its analytical T2
  step from OpenRecon MRD input. The GL/TG adapter fields are not documented
  Siemens qDESS private attributes. For `sequenceName`, `sequenceName_fid`,
  and `sequenceName_SE`,
  segmentation uses the voxelwise root-sum-of-squares of `_fid` and `_SE`,
  fitting uses the echoes separately, and the corrected second echo time is
  computed as `TE2 = 2 * TR - TE1`. Equal-sized `set=0`
  and `set=1` groups within one series are handled as an unnamed two-echo
  fallback, with the detected grouping, routing, counts, and timing reported to
  LogViewer. TR, TE1, and flip angle come from MRD sequence parameters when
  available, TE2 is computed, and GL/TG use built-in defaults when absent from
  metadata and legacy saved-protocol settings. Source volumes returned by
  `sendoriginal` retain separate scanner series and source names. The pyMSKT
  right-knee registration reference is
  packaged at build time, so subregion and T2-statistics post-processing does
  not require runtime GitHub access. If subregion generation still fails while
  thickness is disabled, global cartilage-compartment T2 statistics are
  computed from the remapped all-label segmentation. It mirrors
  KneePipeline's split steps: it runs mesh
  generation/cartilage thickness when requested, runs DESS T2 mapping when
  KneePipeline identifies DESS input, and returns subregion segmentation,
  T2 maps, and a burned-in metrics report image series whenever those artifacts
  are written. The same metrics are copied into output metadata comments.
  The packaged segmentation models are `goyal_sagittal`, `goyal_coronal`,
  `goyal_axial`, and `nnunet_knee`. Legacy saved protocols that request
  `acl_qdess_bone_july_2024` use the identical `goyal_sagittal` checkpoint.
  Optional mesh/thickness analysis can run
  after segmentation when the `computethickness` OpenRecon option is enabled.
  The `nnunet_knee` path is packaged with single preprocessing/export worker
  defaults for scanner-side memory stability.
  Returned segmentation and subregion series use the upstream DOSMA/OpenMSK
  labels: 1 patellar cartilage, 2 femoral cartilage, 3 medial tibial
  cartilage, 4 lateral tibial cartilage, 5 medial meniscus, 6 lateral
  meniscus, 7 femur, 8 tibia, and 9 patella. Canonical labels used by the
  modular mesh, thickness, T2, and NSM steps remain internal and are never
  exposed in the returned segmentation series. Femoral-cartilage subregion
  labels 11 through 15 retain their upstream values.
  Legacy `runnsm` and `runbscore` protocol parameters are accepted for scanner
  conversion compatibility but ignored because gated ShapeMedKnee assets are not
  packaged. Legacy DESS acquisition fallback parameters are also accepted but
  hidden from the OpenRecon GUI.

  Direct DICOM usage can produce the full output set, including T2, when the
  input contains the DESS timing and spoiler metadata expected by DOSMA:

  ```bash
  ml openmsk/{{ context.version }}
  python /opt/KneePipeline/run_pipeline.py /path/to/DESS/dicom_dir /path/to/out --config /opt/KneePipeline/config.json
  ```

  ----------------------------------
