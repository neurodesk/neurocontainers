name: gliomoda
version: 0.0.4

description: GlioMODA segments gliomas from multi-modal brain MRI across arbitrary sequence combinations.

copyright:
  - license: Apache-2.0
    url: https://github.com/BrainLesion/GlioMODA/blob/main/LICENSE

architectures:
  - x86_64

variables:
  # Version of the model weights baked into the image. Bumping this is a
  # deliberate act: the build asserts the archive Zenodo serves matches, so new
  # upstream weights fail the build here instead of silently changing results.
  weights_version: "1.0.2"
  venv: /opt/gliomoda-0.0.4

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        VENV: "{{ context.venv }}"
        # These default under $HOME, which does not exist at container runtime.
        MPLCONFIGDIR: /tmp/mpl-gliomoda
        XDG_CACHE_HOME: /tmp/cache-gliomoda
        PYTHONNOUSERSITE: "1"
        PATH: "{{ context.venv }}/bin:$PATH"

    - install:
        - ca-certificates
        - fonts-dejavu-core
        - libgl1
        - libglib2.0-0t64
        - libgomp1
        - python3
        - python3-pip
        - python3-venv

    - run:
        - python3 -m venv "${VENV}"
        - . "${VENV}/bin/activate" && python -m pip install --no-cache-dir --upgrade pip setuptools wheel
        # CUDA wheels: these are GPU inference tools and the default index
        # already resolves to CUDA builds, so pin the index explicitly rather
        # than letting the resolver choose a different one on a rebuild.
        - . "${VENV}/bin/activate" && python -m pip install --no-cache-dir
          --extra-index-url https://download.pytorch.org/whl/cu124 torch
        - . "${VENV}/bin/activate" && python -m pip install --no-cache-dir "gliomoda==0.0.4"
        # Import at build time so a broken resolve fails here rather than on
        # first use; read the version from distribution metadata because these
        # packages do not all define __version__.
        - . "${VENV}/bin/activate" && python -c "import importlib.metadata as md; import gliomoda; print('gliomoda', md.version('gliomoda'))"
        # Bake the model weights into the image so inference runs offline and every
        # run uses the same weights. Upstream's own downloader is called rather
        # than fetching the Zenodo archive by hand: it resolves the record and
        # unpacks into the exact version-stamped directory the package later looks
        # for, so it cannot drift from what the code expects. Adds ~3.3GB to the image.
        - . "${VENV}/bin/activate" && python -c "from gliomoda.weights import check_weights_path; print('weights at', check_weights_path())"
        # Fail the build rather than ship an image that silently re-downloads.
        - . "${VENV}/bin/activate" && python -c "import pathlib,gliomoda as _m; root=pathlib.Path(_m.__file__).parent; dirs=[x for x in root.rglob('weights_v*') if x.is_dir()]; assert dirs, 'no weights baked into the image'; n=sum(f.stat().st_size for x in dirs for f in x.rglob('*') if f.is_file()); print('baked', dirs[0].name, round(n/1e6), 'MB'); assert n > 2000*1e6, 'weights look truncated'"
        # The baked weights must be the version this recipe declares.
        - . "${VENV}/bin/activate" && python -c "import pathlib,gliomoda as _m; root=pathlib.Path(_m.__file__).parent; dirs=[x.name for x in root.rglob('weights_v*') if x.is_dir()]; want='weights_v{{ context.weights_version }}'; assert want in dirs, 'expected '+want+', found '+str(dirs)+' -- upstream published new weights, bump weights_version'"
        # Pin: stop the package querying Zenodo at run time so the image cannot
        # swap its weights underneath a user. Upstream already handles an
        # unreachable Zenodo by falling back to the local copy, so this reuses
        # that supported path rather than adding new behaviour. Newer weights now
        # require a rebuild with weights_version bumped.
        - cat {{ get_file("pin_weights.py") }} >> "$(. "${VENV}/bin/activate" && python -c "import gliomoda.weights as m; print(m.__file__)")"
        - . "${VENV}/bin/activate" && python -c "from gliomoda.weights import _get_zenodo_metadata_and_archive_url as f; assert f() is None, 'weight pin did not take'; print('zenodo lookup pinned off')"
        # Prove the pinned lookup still resolves the baked weights.
        - . "${VENV}/bin/activate" && python -c "from gliomoda.weights import check_weights_path; p=str(check_weights_path()); assert p.endswith('weights_v{{ context.weights_version }}'), p; print('resolves offline to', p)"
        - chmod -R a+rX "${VENV}"
        - rm -rf /root/.cache/pip /tmp/mpl-gliomoda /tmp/cache-gliomoda

    - workdir: /opt

    - test:
        name: Simple Deploy Bins/Path Test
        builtin: test_deploy.sh

files:
  - name: pin_weights.py
    contents: |
      # Appended to upstream's weights module by the neurocontainers recipe.
      # Redefining the lookup shadows the original, so the package takes its own
      # "Zenodo unreachable -> use the local weights" branch and never downloads
      # at run time. This image ships weights_v1.0.2; to move to newer weights,
      # bump weights_version in build.yaml and rebuild the container.
      def _get_zenodo_metadata_and_archive_url():
          return None

deploy:
  path:
    - "{{ context.venv }}/bin"

categories:
  - image segmentation
  - structural imaging
  - machine learning

icon: data:image/png;base64,

readme: |-
  ----------------------------------
  ## gliomoda/{{ context.version }} ##

  GlioMODA segments gliomas from multi-modal brain MRI across arbitrary sequence combinations.

  Example:
  ```
  python -c 'from gliomoda import Inferer'
  ```

  Notes:
  Upstream ships no console_scripts; the interface is the Python API
  (`from gliomoda import Inferer`). nnU-Net v2 is pinned by upstream to 2.5.2.
  Model weights are fetched on first inference.

  More documentation can be found here: https://github.com/BrainLesion
