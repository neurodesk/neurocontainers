name: gliomoda
version: 0.0.4
# Substitutions available to tests come from top-level scalars here, not
# from build.yaml, so the bundled weights version is declared again.
weights_version: "1.0.2"
upstream_version: "0.0.4"
arm_torch_version: "2.6.0"

tests:
  - name: package imports
    description: Guards the whole dependency resolve, which is the fragile part of this recipe.
    command: python -c "import gliomoda; print('import ok')"
    expected_output_contains: "import ok"

  - name: reports the packaged version
    description: Guards against the venv resolving a different release than the recipe pins.
    command: python -c "import importlib.metadata as md; print(md.version('gliomoda'))"
    expected_output_contains: "${upstream_version}"

  - name: runs outside HOME
    description: $HOME does not exist at container runtime; caches must point somewhere writable.
    command: env HOME=/nonexistent python -c "import gliomoda; print('no-home ok')"
    expected_output_contains: "no-home ok"

  - name: torch imports and computes on CPU
    description: A CUDA-built torch must still work where no GPU is present.
    command: python -c "import torch; print('torch', torch.__version__, (torch.ones(2)+1).sum().item())"
    expected_output_contains: "4.0"

  - name: model weights are bundled in the image
    description: >-
      The point of baking the weights in is that inference works offline; this
      fails if a rebuild ever silently drops them.
    command: python -c "import pathlib,gliomoda as _m; root=pathlib.Path(_m.__file__).parent; dirs=[x for x in root.rglob('weights_v*') if x.is_dir()]; n=sum(f.stat().st_size for x in dirs for f in x.rglob('*') if f.is_file()) if dirs else 0; print('weights-mb', round(n/1e6))"
    expected_output_contains: "weights-mb"

  - name: bundled weights are the declared version
    description: Guards against a rebuild shipping different weights than the readme states.
    command: python -c "import pathlib,gliomoda as _m; root=pathlib.Path(_m.__file__).parent; print([x.name for x in root.rglob('weights_v*') if x.is_dir()])"
    expected_output_contains: "weights_v1.0.2"

  - name: weights are pinned, not fetched at run time
    description: >-
      The Zenodo lookup is disabled at build time so the image cannot swap its
      weights underneath a user; this fails if that patch is ever lost.
    command: python -c "from gliomoda.weights import _get_zenodo_metadata_and_archive_url as f; m,_u=f(); print('pinned' if m['version']=='1.0.2' else 'NOT-PINNED')"
    expected_output_contains: "pinned"

  - name: gliomoda CLI is on PATH and renders help
    description: >-
      The CLI is added by this recipe rather than upstream, so nothing else
      would catch it going missing or failing to import its dependencies.
    command: gliomoda --help
    expected_output_contains: "usage: gliomoda"

  - name: the CLI selects a device instead of assuming CUDA
    description: >-
      Upstream defaults to device="cuda" and never falls back, so on a CPU-only
      node inference died inside nnU-Net after the model had loaded. CI has no
      GPU, so auto must resolve to cpu here.
    command: gliomoda --help
    expected_output_contains: "--device"

  - name: version reports package and bundled weights
    description: >-
      gliomoda --version previously exited 2 with an argument-parsing error.
      The weights version governs reproducibility, so it belongs here.
    command: gliomoda --version
    expected_output_contains: "bundled weights v${weights_version}"

  - name: the bundled models can be listed
    description: >-
      Not every declared InferenceMode has weights in the image; t1n is
      advertised but has no model folder. Listing what is actually present lets
      a user find out without a FileNotFoundError.
    command: |
      bash -c 'n=$(gliomoda --list-models | wc -l); echo "models=$n"; gliomoda --list-models | head -3'
    expected_output_contains: "models="

  - name: an unbundled modality combination fails with a usable message
    description: >-
      t1n alone selects a mode with no weights in this image. Upstream fails
      with a bare FileNotFoundError on dataset.json; the CLI should say what is
      wrong and what is available.
    command: |
      bash -c 'gliomoda --t1n /nonexistent.nii.gz -o /tmp/x.nii.gz 2>&1 || true'
    expected_output_contains: "no such file"

  - name: a trailing singleton axis is rejected with a usable message
    description: >-
      The canonical BraTS atlas ships as (240, 240, 155, 1). The pre-flight
      used to squeeze the shape, admit the file, and then upstream reloaded it
      and failed with a bare AssertionError; the CLI must reject it up front
      and say what to do.
    command: |
      bash -c 'python -c "import numpy,nibabel,sys; nibabel.Nifti1Image(numpy.zeros((240,240,155,1),dtype=numpy.uint8), numpy.eye(4)).to_filename(sys.argv[1])" /tmp/gliomoda-4d.nii.gz && gliomoda -t1c /tmp/gliomoda-4d.nii.gz -o /tmp/gliomoda-4d-seg.nii.gz 2>&1 || true'
    expected_output_contains: "singleton axis"

  - name: forcing cuda without a GPU fails before loading the model
    description: >-
      --device cuda on a GPU-less node used to load the model and die ~50 s
      later with a raw RuntimeError inside nnU-Net. The CLI must refuse
      immediately with the way out. CI has no GPU, so the input must pass the
      grid pre-flight and then hit the device check.
    command: |
      bash -c 'python -c "import numpy,nibabel,sys; nibabel.Nifti1Image(numpy.zeros((240,240,155),dtype=numpy.uint8), numpy.eye(4)).to_filename(sys.argv[1])" /tmp/gliomoda-3d.nii.gz && gliomoda --device cuda -t1c /tmp/gliomoda-3d.nii.gz -o /tmp/gliomoda-3d-seg.nii.gz 2>&1 || true'
    expected_output_contains: "no CUDA device is available"

  - name: the thread default reports where its number came from
    description: >-
      The default cannot be the Slurm allocation: the module launcher runs
      singularity with --cleanenv, which strips $SLURM_CPUS_PER_TASK and
      $OMP_NUM_THREADS, and the kernel fallback then reads the Neurodesk
      session's cgroup quota instead. Measured on an 8-CPU session, a 2-CPU
      and a 4-CPU job both defaulted to 8 threads. The run now names the
      source so an oversubscribed default is visible in the log rather than
      silent, and this checks the precedence behind that label: a variable
      wins when it survives, a kernel limit is the floor when it does not.
    command: |
      /opt/gliomoda-${version}/bin/python3 - <<'PY'
      import os

      # The wrapper is a plain script, not an importable module, and it holds
      # no heavy imports at module level.
      cli = {"__name__": "gliomoda_cli"}
      with open("/usr/local/bin/gliomoda") as handle:
          exec(compile(handle.read(), "gliomoda", "exec"), cli)
      default_threads = cli["default_threads"]

      os.environ["SLURM_CPUS_PER_TASK"] = "2"
      assert default_threads() == (2, "$SLURM_CPUS_PER_TASK"), default_threads()
      del os.environ["SLURM_CPUS_PER_TASK"]

      os.environ["OMP_NUM_THREADS"] = "3"
      assert default_threads() == (3, "$OMP_NUM_THREADS"), default_threads()
      del os.environ["OMP_NUM_THREADS"]

      # A non-numeric value must fall through rather than crash the run.
      os.environ["SLURM_CPUS_PER_TASK"] = "2,4"
      count, source = default_threads()
      assert source != "$SLURM_CPUS_PER_TASK", (count, source)
      del os.environ["SLURM_CPUS_PER_TASK"]

      # What --cleanenv actually leaves behind: no variables, so a kernel
      # limit and a label naming which one.
      count, source = default_threads()
      assert isinstance(count, int) and count > 0, (count, source)
      assert source in ("affinity mask", "cgroup quota"), source
      print("thread-source", source, count)
      PY
    expected_output_contains: "thread-source"

  - name: the container does not export a python interpreter
    description: >-
      Deploying the venv bin put python, python3 and python3.12 on the user's
      PATH, shadowing their own interpreter for the rest of the shell.
    command: bash -c 'echo "deploy-bins=$DEPLOY_BINS"'
    expected_output_contains: "deploy-bins=gliomoda"

  - name: Native CPU model dependency closure
    description: Exercise Torch matrix multiplication, Blosc compression and installed dependency consistency; ARM must use the declared CPU wheel.
    timeout: 300
    command: |
      python - <<'PY'
      import importlib.metadata as md
      import platform
      import subprocess
      import sys
      import blosc2
      import numpy as np
      import torch
      assert md.version('gliomoda') == '${upstream_version}'
      assert md.version('nnunetv2') == '2.5.2'
      assert not torch.cuda.is_available()
      if platform.machine() == 'aarch64':
          assert torch.__version__ == '${arm_torch_version}+cpu', torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
      torch.set_num_threads(2)
      x = torch.arange(12, dtype=torch.float32).reshape(3, 4)
      np.testing.assert_array_equal((x @ x.T).numpy(), np.arange(12, dtype=np.float32).reshape(3, 4) @ np.arange(12, dtype=np.float32).reshape(3, 4).T)
      data = np.arange(1024, dtype=np.int32)
      np.testing.assert_array_equal(blosc2.unpack_array(blosc2.pack_array(data)), data)
      subprocess.run([sys.executable, '-m', 'pip', 'check'], check=True)
      print('CPU model dependency closure passed', torch.__version__, md.version('nnunetv2'), blosc2.__version__)
      PY
    expected_exit_code: 0
    expected_output_contains: CPU model dependency closure passed

  - name: Full trained four modality glioma MRI inference
    description: Run the default bundled model on all complete official BraTS MRI modalities without resizing or replacing checkpoints. Assert valid nonempty labels, full physical grid and unchanged inputs and bundled weights. This is CPU runtime evidence, not clinical accuracy or GPU verification.
    timeout: 11000
    command: |
      python - <<'PY'
      import hashlib
      import json
      import os
      from pathlib import Path
      import signal
      import subprocess
      import tempfile
      import time
      import urllib.request

      import gliomoda
      import nibabel as nib
      import numpy as np


      def digest(path):
          h = hashlib.sha256()
          with path.open('rb') as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                  h.update(chunk)
          return h.hexdigest()


      fixtures = [{'modality': 't1c', 'url': 'https://raw.githubusercontent.com/BrainLesion/tutorials/99c5841fe8985e4004d3d5394ca9590a914e24e7/BraTS/data/segmentation/BraTS-GLI-00001-000/BraTS-GLI-00001-000-t1c.nii.gz', 'sha256': '4399faadcc45c8a4541313cdf88aced7d835ed59ac3078d950e0eac293d603f5'}, {'modality': 't2f', 'url': 'https://raw.githubusercontent.com/BrainLesion/tutorials/99c5841fe8985e4004d3d5394ca9590a914e24e7/BraTS/data/segmentation/BraTS-GLI-00001-000/BraTS-GLI-00001-000-t2f.nii.gz', 'sha256': '82aed8546af5e6d8d94fd91c56227abdcf6120130390d1556c4342a208980604'}, {'modality': 't1n', 'url': 'https://raw.githubusercontent.com/BrainLesion/tutorials/99c5841fe8985e4004d3d5394ca9590a914e24e7/BraTS/data/segmentation/BraTS-GLI-00001-000/BraTS-GLI-00001-000-t1n.nii.gz', 'sha256': 'e860924b936e301ddeba20409fbb59dde322475cb49328f1b46a9235c792e73e'}, {'modality': 't2w', 'url': 'https://raw.githubusercontent.com/BrainLesion/tutorials/99c5841fe8985e4004d3d5394ca9590a914e24e7/BraTS/data/segmentation/BraTS-GLI-00001-000/BraTS-GLI-00001-000-t2w.nii.gz', 'sha256': '4cd389cc57d12134a30a898c66532228126b9a7d0600ee578e82a32144528b51'}]
      weights = Path(gliomoda.__file__).parent / 'weights' / 'weights_v${weights_version}'
      model = weights / 't1c-t2f-t1n-t2w'
      for relative in ('dataset.json', 'plans.json', 'fold_all/checkpoint_final.pth'):
          assert (model / relative).is_file(), relative
      before_weights = {str(p.relative_to(weights)): digest(p)
                        for p in weights.rglob('*') if p.is_file()}
      assert sum(p.stat().st_size for p in weights.rglob('*') if p.is_file()) > 2_000_000_000

      with tempfile.TemporaryDirectory(prefix='gliomoda-real-mri-') as directory:
          root = Path(directory)
          inputs = {}
          for item in fixtures:
              path = root / (item['modality'] + '.nii.gz')
              with urllib.request.urlopen(item['url'], timeout=120) as response, path.open('wb') as handle:
                  while chunk := response.read(1024 * 1024):
                      handle.write(chunk)
              assert digest(path) == item['sha256'], item['modality']
              image = nib.load(path)
              assert image.shape == (240, 240, 155), image.shape
              np.testing.assert_array_equal(image.header.get_zooms(), (1, 1, 1))
              data = np.asarray(image.dataobj)
              assert np.isfinite(data).all() and np.count_nonzero(data) > 0
              inputs[item['modality']] = path
          reference = nib.load(inputs['t1c'])
          for path in inputs.values():
              np.testing.assert_array_equal(nib.load(path).affine, reference.affine)
          before_inputs = {k: digest(p) for k, p in inputs.items()}
          output = root / 'segmentation.nii.gz'
          command = ['gliomoda', '--device', 'cpu', '--threads', '2']
          for modality, path in inputs.items():
              command.extend(['--' + modality, str(path)])
          command.extend(['--output', str(output)])
          env = dict(os.environ)
          for variable in ('HOME', 'XDG_CACHE_HOME', 'MPLCONFIGDIR'):
              target = root / variable.lower()
              target.mkdir()
              env[variable] = str(target)
          env.update(OMP_NUM_THREADS='2', MKL_NUM_THREADS='2', OPENBLAS_NUM_THREADS='2')
          started = time.monotonic()
          process = subprocess.Popen(command, env=env, start_new_session=True)
          try:
              code = process.wait(timeout=10800)
          except subprocess.TimeoutExpired:
              os.killpg(process.pid, signal.SIGTERM)
              try:
                  process.wait(timeout=20)
              except subprocess.TimeoutExpired:
                  os.killpg(process.pid, signal.SIGKILL)
                  process.wait()
              raise
          assert code == 0, code
          assert output.is_file() and output.stat().st_size > 0
          result = nib.load(output)
          assert result.shape == reference.shape, (result.shape, reference.shape)
          # NIfTI stores its spatial transform in float32. This bound derives from
          # that storage precision; it is not a segmentation accuracy tolerance.
          spatial_bound = 8 * np.finfo(np.float32).eps * max(1, np.abs(reference.affine).max())
          np.testing.assert_allclose(result.affine, reference.affine, rtol=0, atol=spatial_bound)
          np.testing.assert_array_equal(result.header.get_zooms(), reference.header.get_zooms())
          labels = np.asarray(result.dataobj)
          assert np.isfinite(labels).all()
          np.testing.assert_array_equal(labels, labels.astype(np.uint8))
          values, counts = np.unique(labels, return_counts=True)
          assert set(values.tolist()) <= {0, 1, 2, 3}, values
          foreground = int(np.count_nonzero(labels))
          assert 0 < foreground < labels.size, foreground
          assert before_inputs == {k: digest(p) for k, p in inputs.items()}
          assert before_weights == {str(p.relative_to(weights)): digest(p)
                                    for p in weights.rglob('*') if p.is_file()}
          print('full glioma MRI inference passed', json.dumps({
              'shape': list(result.shape), 'labels': values.tolist(),
              'label_counts': counts.tolist(), 'foreground_voxels': foreground,
              'seconds': round(time.monotonic() - started, 2),
              'input_sha256': before_inputs, 'unchanged_weight_files': len(before_weights),
              'mode': 't1c-t2f-t1n-t2w', 'weights_version': '${weights_version}',
          }, sort_keys=True))
      PY
    expected_exit_code: 0
    expected_output_contains: full glioma MRI inference passed
