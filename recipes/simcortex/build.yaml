name: simcortex
version: "2.0.0"

architectures:
  - x86_64

variables:
  upstream_version: "2.0.0"
  image_digest: "sha256:b4dfdfa36a10eeedadd1eb4d62adfe751025e45336e6fdfeab717a2f6245ec25"

auto_update:
  method: sources
  container_version:
    variable: upstream_version
  frozen: true
  reason: >-
    Preserve the validated SimCortex scientific runtime.
    New upstream releases require scientific validation
    before updating the container.
  sources:
    - id: simcortex_image
      method: oci_digest
      image: kavehmoradkhani/simcortex
      tag: "2.0.0"
      target:
        variable: image_digest

copyright:
  - license: Apache-2.0
    url: https://github.com/Neuro-iX/SimCortex/blob/v2.0.0/LICENSE
  - license: CC-BY-SA-4.0
    url: https://github.com/Neuro-iX/SimCortex/blob/v2.0.0/THIRD_PARTY_NOTICES.md

files:
  - name: LICENSE
    filename: LICENSE
  - name: THIRD_PARTY_NOTICES.md
    filename: THIRD_PARTY_NOTICES.md

build:
  kind: neurodocker
  base-image: kavehmoradkhani/simcortex:{{ context.upstream_version }}@{{ context.image_digest }}
  pkg-manager: apt
  add-default-template: false
  add-tzdata: false

  directives:
    - copy:
        - LICENSE
        - /opt/SimCortex/LICENSE

    - copy:
        - THIRD_PARTY_NOTICES.md
        - /opt/SimCortex/THIRD_PARTY_NOTICES.md

    - run:
        - test -x /opt/conda-env/bin/simcortex
        - test -f /opt/SimCortex/scripts/run_pipeline.py

    - deploy:
        path: []
        bins:
          - simcortex

categories:
  - structural imaging
  - image segmentation
  - shape analysis
  - machine learning

domains:
  - neuroimaging

structured_readme:
  description: >-
    SimCortex is a deep learning framework for joint cortical
    surface reconstruction from T1-weighted MRI.

    It reconstructs bilateral white matter and pial surfaces
    through MRI preprocessing, segmentation, initial surface
    generation, and joint surface deformation.

    End-to-end MRI-only inference does not require FreeSurfer.
    Single-subject and BIDS-like batch inference are supported.
    Surfaces can be exported in MNI152 and native scanner RAS space.

    NVIDIA GPU acceleration is supported.
    SimCortex is intended for research use.

    Pretrained checkpoints and the MNI152 reference image
    must be supplied separately.

    Official pretrained models:
    https://doi.org/10.5281/zenodo.22710781

    Use the reference template documented in the upstream
    SimCortex v2.0.0 release.

  example: |-
    # Load SimCortex in Neurodesk
    ml simcortex/2.0.0
    simcortex --version
    simcortex --help

    # Individual pipeline stages
    simcortex fs-to-mni --help
    simcortex seg --help
    simcortex initsurf --help
    simcortex deform --help

    # End-to-end inference using a local Apptainer image.
    # Set these paths to your container and input directory.
    SIF=/path/to/simcortex_2.0.0.sif
    INPUT_DIR=/path/to/inputs
    mkdir -p "$PWD/results"

    apptainer exec --cleanenv --nv \
      --bind "$INPUT_DIR:/data/inputs:ro" \
      --bind "$PWD/results:/data/output:rw" \
      "$SIF" \
      /opt/conda-env/bin/python \
      /opt/SimCortex/scripts/run_pipeline.py single \
      --project-root /opt/SimCortex \
      --t1w /data/inputs/T1w.nii.gz \
      --subject sub-001 \
      --session ses-01 \
      --mni /data/inputs/MNI152_T1_1mm.nii.gz \
      --seg-ckpt /data/inputs/models/seg/seg_best_dice.pt \
      --deform-ckpt /data/inputs/models/deform/deform_best_rmse.pth \
      --out-root /data/output \
      --device cuda:0 \
      --export-native

  documentation: https://github.com/Neuro-iX/SimCortex

  citation: |-
    Moradkhani K, Rushmore RJ, Bouix S.
    SimCortex: Collision-free Simultaneous Cortical Surfaces
    Reconstruction. 2025.
    https://doi.org/10.1007/978-3-032-06774-6_26

    Moradkhani K, Bouix S.
    SimCortex v2: Joint Cortical Surface Reconstruction with
    Near-Zero Collisions and Self-Intersections.
    https://arxiv.org/abs/2610.07378

icon: "data:image/png;base64,"
