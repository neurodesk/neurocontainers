name: jipipe
version: 5.3.0

copyright:
  - license: MIT
    url: https://github.com/applied-systems-biology/jipipe/blob/pom-jipipe-{{ context.version }}/LICENSE
  - license: GPL-3.0-or-later
    name: MTrack2 2.0.1 (bundled as MTrack2_-2.0.1.jar in JIPipe {{ context.version }} prepackaged Fiji runtime) and combined GPLv3 distribution notice in /opt/jipipe/GPL-SOURCE-NOTICE.txt
    url: https://github.com/fiji/MTrack2/tree/MTrack2_-2.0.1
  - license: GPL-2.0-or-later
    name: Bundled Fiji / ImageJ2 runtime components in JIPipe prepackaged Linux64 archive
    url: https://imagej.net/licensing

architectures:
  - x86_64

variables:
  upstream_version: "5.3.0"

auto_update:
  method: sources
  container_version: jipipe_archive
  sources:
    - id: jipipe_archive
      method: github_release_asset
      repo: applied-systems-biology/jipipe
      version_regex: '^pom-jipipe-(?P<version>\d+\.\d+\.\d+)$'
      asset: JIPipe-{version}-Prepackaged-Linux64.tar.gz
      target:
        file: jipipe_archive
        variables:
          upstream_version: version

structured_readme:
  description: >-
    JIPipe (Java Image Processing Pipeline) is an open-source visual
    programming language and workflow builder for ImageJ/Fiji, enabling
    reproducible batch microscopy image analysis without coding.
  example: |
    # Launch the JIPipe desktop GUI
    jipipe

    # Run a JIPipe project headlessly
    jipipe --help
  documentation: https://www.jipipe.org/documentation/
  citation: |-
    Gerst, R., Cseresnyés, Z., & Figge, M. T. (2023). JIPipe: visual batch
    processing for ImageJ. Nature Methods, 20(2), 168-169.
    https://doi.org/10.1038/s41592-022-01744-4

files:
  - name: jipipe_archive
    url: https://github.com/applied-systems-biology/jipipe/releases/download/pom-jipipe-5.3.0/JIPipe-5.3.0-Prepackaged-Linux64.tar.gz
    sha256: 0ba50de964bc24a03a38fb3b1fef776be656a606a8520fd855a7e4d0b62604c1
  - name: gpl-source-notice
    contents: |-
      JIPipe {{ context.version }} Container — License & Corresponding Source Notice
      ==============================================================================
      This container redistributes the upstream JIPipe prepackaged Linux64 archive:
        https://github.com/applied-systems-biology/jipipe/releases/download/pom-jipipe-{{ context.version }}/JIPipe-{{ context.version }}-Prepackaged-Linux64.tar.gz

      Note: Redistribution-restricted ImageScience JARs (FeatureJ_.jar, MTrackJ_.jar,
      NeuronJ_.jar, RandomJ_.jar, TransformJ_.jar, and imagescience.jar) are excluded
      during extraction.

      JIPipe itself is licensed under MIT:
        https://github.com/applied-systems-biology/jipipe/blob/pom-jipipe-{{ context.version }}/LICENSE

      The prepackaged Fiji/ImageJ2 runtime includes components under GPL-3.0-or-later
      and GPL-2.0-or-later, along with permissively licensed plugins and a bundled
      OpenJDK runtime:

      - MTrack2_-2.0.1.jar (GPL-3.0-or-later) corresponding source revision:
        https://github.com/fiji/MTrack2/tree/MTrack2_-2.0.1
        https://github.com/fiji/MTrack2/archive/refs/tags/MTrack2_-2.0.1.tar.gz
      - Fiji / ImageJ2 core source repositories:
        https://github.com/fiji/fiji
        https://imagej.net/licensing
      - Exact release-pinned Maven POM metadata and SCM source coordinates for bundled
        JARs are embedded under META-INF/maven/ inside /opt/jipipe/bin/jars/ and
        /opt/jipipe/bin/plugins/, with corresponding source artifacts published at
        https://maven.scijava.org/ and https://repo1.maven.org/maven2/.
  - name: jipipe-wrapper
    executable: true
    contents: |-
      #!/usr/bin/env bash
      set -euo pipefail

      is_writable_dir() {
        local dir="$1"
        [ -n "${dir}" ] && [ -d "${dir}" ] || return 1
        local probe
        probe="$(mktemp "${dir}/.writable.XXXXXX" 2>/dev/null)" || return 1
        rm -f "${probe}"
      }

      if [ -n "${JIPIPE_OVERRIDE_USER_DIR_BASE:-}" ]; then
        jipipe_user_dir="${JIPIPE_OVERRIDE_USER_DIR_BASE}"
      elif [ -n "${JIPIPE_USER_DIR:-}" ]; then
        jipipe_user_dir="${JIPIPE_USER_DIR}"
      elif is_writable_dir "${HOME:-}"; then
        jipipe_user_dir="${HOME}/.jipipe"
      else
        jipipe_user_dir="${XDG_CONFIG_HOME:-${TMPDIR:-/tmp}/jipipe-$(id -u)}/jipipe"
      fi

      if is_writable_dir "${HOME:-}"; then
        user_home="${HOME}"
      else
        user_home="${jipipe_user_dir}"
        export HOME="${user_home}"
      fi

      export JIPIPE_OVERRIDE_USER_DIR_BASE="${jipipe_user_dir}"
      export JIPIPE_USER_DIR="${jipipe_user_dir}"
      prefs_root="${jipipe_user_dir}/java-prefs"
      tmp_root="${TMPDIR:-/tmp}/jipipe-$(id -u)-tmp"
      mkdir -p "${jipipe_user_dir}" "${prefs_root}" "${tmp_root}"

      export JAVA_TOOL_OPTIONS="\"-Duser.home=${user_home}\" \"-Djava.util.prefs.userRoot=${prefs_root}\" \"-Djava.io.tmpdir=${tmp_root}\" ${JAVA_TOOL_OPTIONS:-}"

      fiji_bin="/opt/jipipe/bin/ImageJ-linux64"
      if [ ! -x "${fiji_bin}" ]; then
        echo "JIPipe ImageJ launcher not found at ${fiji_bin}" >&2
        exit 1
      fi

      launcher="$(basename "$0")"
      if [ "${launcher}" = "jipipe-cli" ]; then
        if [ "$#" -eq 0 ] || [ "$1" = "--help" ] || [ "$1" = "-h" ]; then
          exec "${fiji_bin}" --headless --pass-classpath --full-classpath --main-class org.hkijena.jipipe.cli.JIPipeCLIMain help
        fi
        exec "${fiji_bin}" --headless --pass-classpath --full-classpath --main-class org.hkijena.jipipe.cli.JIPipeCLIMain "$@"
      fi

      case "${1:-}" in
        --help|-h|help)
          exec "${fiji_bin}" --headless --pass-classpath --full-classpath --main-class org.hkijena.jipipe.cli.JIPipeCLIMain help
          ;;
        run|render)
          exec "${fiji_bin}" --headless --pass-classpath --full-classpath --main-class org.hkijena.jipipe.cli.JIPipeCLIMain "$@"
          ;;
        *)
          exec "${fiji_bin}" --pass-classpath --full-classpath --main-class org.hkijena.jipipe.JIPipeLauncher "$@"
          ;;
      esac

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
    - install:
        - ca-certificates
        - fontconfig
        - fonts-dejavu-core
        - libasound2t64
        - libfreetype6
        - libgl1
        - libglib2.0-0
        - libglu1-mesa
        - libgtk-3-0
        - libx11-6
        - libxext6
        - libxi6
        - libxrandr2
        - libxrender1
        - libxtst6
    - run:
        - mkdir -p /opt/jipipe
        - >-
          tar -xzf {{ get_file("jipipe_archive") }} -C /opt/jipipe --strip-components=1
          --exclude='*/FeatureJ_*.jar'
          --exclude='*/MTrackJ_*.jar'
          --exclude='*/NeuronJ_*.jar'
          --exclude='*/RandomJ_*.jar'
          --exclude='*/TransformJ_*.jar'
          --exclude='*/imagescience*.jar'
        - install -m 0644 {{ get_file("gpl-source-notice") }} /opt/jipipe/GPL-SOURCE-NOTICE.txt
        - chmod -R a+rX /opt/jipipe
        - install -m 0755 {{ get_file("jipipe-wrapper") }} /usr/local/bin/jipipe
        - ln -sf jipipe /usr/local/bin/jipipe-cli

deploy:
  path: []
  bins:
    - jipipe
    - jipipe-cli

gui_apps:
  - name: "JIPipe"
    exec: "jipipe"

domains:
  - microscopy

categories:
  - visualization
  - image segmentation
  - workflows

icon: data:image/svg+xml;base64,
