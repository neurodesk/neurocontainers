# workshopdemo container test suite
# Tests for workshopdemo v1.0.0 - Minimal hello-world workshop example
#
# This container includes:
#   - hello: GNU hello example program
#
# Tests focus on the packaged runtime and documented example command.

name: workshopdemo
version: 1.0.0

setup:
  script: |
    #!/usr/bin/env bash
    set -e
    mkdir -p test_output/workshopdemo

tests:
  - name: hello on PATH
    description: Verify the hello binary is available
    command: command -v hello
    expected_output_contains: "/usr/bin/hello"

  - name: hello output
    description: Verify the documented example command works
    command: hello
    expected_output_contains: "Hello, world!"

  - name: hello version
    description: Verify hello reports its version information
    command: hello --version
    expected_output_contains: "hello"

  - name: Complete greeting output and option precedence
    description: Verify exact output bytes, clean stderr and documented greeting options
    command: |
      set -eu
      export LC_ALL=C.UTF-8
      work=$(mktemp -d)
      trap 'rm -rf "$work"' EXIT
      hello > "$work/actual" 2> "$work/stderr"
      printf 'Hello, world!\n' > "$work/expected"
      cmp "$work/expected" "$work/actual"
      test ! -s "$work/stderr"
      greeting='Neurodesk ARM64: café and spaces'
      hello --traditional --greeting="$greeting" > "$work/actual" 2> "$work/stderr"
      printf '%s\n' "$greeting" > "$work/expected"
      cmp "$work/expected" "$work/actual"
      test ! -s "$work/stderr"
      hello --greeting="$greeting" --traditional > "$work/actual" 2> "$work/stderr"
      printf 'hello, world\n' > "$work/expected"
      cmp "$work/expected" "$work/actual"
      test ! -s "$work/stderr"
      echo 'Complete greeting bytes and documented option precedence verified'
    expected_output_contains: 'Complete greeting bytes and documented option precedence verified'

cleanup:
  script: |
    #!/usr/bin/env bash
    echo "Test outputs preserved in test_output/workshopdemo/"
