# postgresanalytics container test suite
# Validates PostgreSQL 18, bundled analytics extensions, non-root execution,
# read-only rootfs ergonomics via pg-analytics, and real SQL operations.

name: postgresanalytics
version: "18.7.0"
postgres_amd64_version: "18.7-1.pgdg24.04+5"
postgres_arm64_version: "18.7-1.pgdg24.04+5"
postgis_amd64_version: "3.7.0+dfsg-2.pgdg24.04+1"
postgis_arm64_version: "3.7.0+dfsg-2.pgdg24.04+1"
pgvector_amd64_version: "0.8.7-2.pgdg24.04+1"
pgvector_arm64_version: "0.8.7-2.pgdg24.04+1"
pgedge_vectorizer_tag: "v1.1"
plproxy_amd64_version: "2.12.0-2.pgdg24.04+1"
plproxy_arm64_version: "2.12.0-2.pgdg24.04+1"
timescaledb_amd64_version: "2.32.0+dfsg-2.pgdg24.04+1"
timescaledb_arm64_version: "2.32.0+dfsg-2.pgdg24.04+1"

tests:
  - name: PostgreSQL binaries and pg-analytics available
    description: Verify pg-analytics, PostgreSQL 18 binaries, and PostGIS CLI tools are on PATH
    command: |
      set -euo pipefail
      for bin in pg-analytics psql initdb pg_ctl postgres pg_dump pg_restore pg_isready shp2pgsql raster2pgsql; do
        command -v "$bin"
      done
      test -s /usr/share/doc/pgedge-vectorizer/copyright
      psql --version
      pg-analytics --help
    expected_output_contains:
      - "pg-analytics"
      - "psql (PostgreSQL) 18."

  - name: Tracked package versions match architecture
    description: Verify pinned PGDG package versions match the recipe metadata
    command: |
      set -euo pipefail
      case "$(dpkg --print-architecture)" in
        amd64)
          pg_expected="${postgres_amd64_version}"
          postgis_expected="${postgis_amd64_version}"
          pgvector_expected="${pgvector_amd64_version}"
          plproxy_expected="${plproxy_amd64_version}"
          timescale_expected="${timescaledb_amd64_version}"
          ;;
        arm64)
          pg_expected="${postgres_arm64_version}"
          postgis_expected="${postgis_arm64_version}"
          pgvector_expected="${pgvector_arm64_version}"
          plproxy_expected="${plproxy_arm64_version}"
          timescale_expected="${timescaledb_arm64_version}"
          ;;
        *) exit 1 ;;
      esac
      test "$(dpkg-query -W -f='${Version}' postgresql-18)" = "$pg_expected"
      test "$(dpkg-query -W -f='${Version}' postgresql-18-postgis-3)" = "$postgis_expected"
      test "$(dpkg-query -W -f='${Version}' postgresql-18-pgvector)" = "$pgvector_expected"
      test "$(dpkg-query -W -f='${Version}' postgresql-18-plproxy)" = "$plproxy_expected"
      test "$(dpkg-query -W -f='${Version}' postgresql-18-timescaledb)" = "$timescale_expected"
      echo "All tracked package versions match"
    expected_output_contains: "All tracked package versions match"

  - name: End-to-end PostgreSQL analytics lifecycle and extensions SQL checks
    description: Verify non-root startup, socket and TCP authentication, and analytics SQL on port 5435
    command: |
      set -euo pipefail
      WORK=$(mktemp -d /tmp/pg-analytics-test.XXXXXX)
      trap 'rm -rf "$WORK"' EXIT
      cat > "${WORK}/run_pg_test.sh" <<'INNER'
      #!/usr/bin/env bash
      set -euo pipefail
      WORK="$1"
      export PGANALYTICS_DATA="${WORK}/pgdata"
      export PGANALYTICS_RUN="${WORK}/socket dir"
      export PGANALYTICS_HOST="127.0.0.1"
      export PGANALYTICS_PORT="5435"
      export PGANALYTICS_DB="postgres"

      cleanup() {
        pg-analytics stop >/dev/null 2>&1 || true
      }
      trap cleanup EXIT

      pg-analytics init
      PGANALYTICS_PRELOAD=pg_stat_statements pg-analytics start
      test "$(pg-analytics psql -XAtc 'SHOW shared_preload_libraries')" = pg_stat_statements
      pg-analytics stop

      pg-analytics start --foreground &
      server_pid=$!
      for attempt in {1..30}; do
        if pg-analytics status >/dev/null 2>&1; then
          break
        fi
        sleep 1
      done
      pg-analytics status
      if output=$(PGPASSWORD='' PGPASSFILE=/dev/null psql -Xw -h "$PGANALYTICS_HOST" -p "$PGANALYTICS_PORT" -d "$PGANALYTICS_DB" -c 'SELECT 1' 2>&1); then
        echo 'TCP accepted a connection without a password' >&2
        exit 1
      fi
      printf '%s\n' "$output" | grep -F 'no password supplied'
      pg-analytics enable-extensions

      pg-analytics psql -v ON_ERROR_STOP=1 -At <<'SQL'
      -- 1. Verify shared_preload_libraries loaded
      SELECT 'PRELOAD=' || current_setting('shared_preload_libraries');

      -- 2. Verify all required and bundled extensions are registered
      SELECT 'EXT_COUNT=' || count(*) FROM pg_extension
      WHERE extname IN (
        'postgis', 'postgis_topology', 'postgis_raster',
        'vector', 'pgedge_vectorizer', 'plproxy',
        'timescaledb', 'hll', 'tdigest', 'hypopg',
        'pg_stat_statements', 'btree_gin', 'btree_gist',
        'pg_trgm', 'hstore', 'uuid-ossp', 'citext',
        'cube', 'earthdistance', 'tablefunc'
      );

      -- 3. PostGIS geospatial computation check
      SELECT 'POSTGIS_DIST=' || ST_Distance(ST_MakePoint(0, 0), ST_MakePoint(3, 4));
      SELECT 'POSTGIS_RASTER=' || ST_Width(ST_MakeEmptyRaster(10, 10, 0, 0, 1, -1, 0, 0, 0));

      -- 4. pgvector L2 and cosine distance operators
      SELECT 'PGVECTOR_L2=' || round(('[0,0,0]'::vector <-> '[3,4,0]'::vector)::numeric, 2);
      SELECT 'PGVECTOR_COS=' || round(('[1,0,0]'::vector <=> '[0,1,0]'::vector)::numeric, 2);

      -- 5. pgEdge Vectorizer C chunking function & schema check
      SELECT 'VECTORIZER_VERSION=v' || extversion FROM pg_extension WHERE extname = 'pgedge_vectorizer';
      SELECT 'VECTORIZER_CHUNKS=' || array_length(
        pgedge_vectorizer.chunk_text(
          'PostgreSQL analytics in NeuroDesk supports geospatial, vector, and time series workloads.',
          'token_based',
          8,
          2
        ),
        1
      );

      -- 6. PL/Proxy procedural language registration check
      SELECT 'PLPROXY_LANG=' || lanname FROM pg_language WHERE lanname = 'plproxy';

      -- 7. TimescaleDB hypertable & time_bucket functional check
      CREATE TABLE sensor_metrics (ts TIMESTAMPTZ NOT NULL, metric DOUBLE PRECISION);
      SELECT create_hypertable('sensor_metrics', 'ts') IS NOT NULL;
      INSERT INTO sensor_metrics VALUES ('2026-01-01 00:00:00+00', 10.0), ('2026-01-01 00:15:00+00', 20.0);
      SELECT 'TIMESCALE_AVG=' || avg(metric)::text
      FROM sensor_metrics
      GROUP BY time_bucket('1 hour', ts);

      -- 8. HyperLogLog, t-digest, and HypoPG functional checks
      SELECT 'HLL_CARD=' || round(hll_cardinality(hll_add_agg(hll_hash_text(v))))
      FROM unnest(ARRAY['a', 'b', 'c', 'a']) AS v;
      SELECT 'TDIGEST_P50=' || round(tdigest_percentile(v, 100, 0.5)::numeric, 1)
      FROM generate_series(1, 100) AS v;
      SELECT 'HYPOPG_OK=' || (count(*) >= 1)::text
      FROM hypopg_create_index('CREATE INDEX ON sensor_metrics (metric)');
      SQL

      pg-analytics stop
      wait "$server_pid"
      echo "PG_ANALYTICS_FULLTEST_OK"
      INNER

      if [ "$(id -u)" -eq 0 ]; then
        chown -R postgres:postgres "${WORK}"
        runuser -u postgres -- bash "${WORK}/run_pg_test.sh" "$WORK"
      else
        bash "${WORK}/run_pg_test.sh" "$WORK"
      fi
    expected_output_contains:
      - "PRELOAD=pg_stat_statements,timescaledb,pgedge_vectorizer"
      - "EXT_COUNT=20"
      - "POSTGIS_DIST=5"
      - "POSTGIS_RASTER=10"
      - "PGVECTOR_L2=5.00"
      - "PGVECTOR_COS=1.00"
      - "VECTORIZER_VERSION=${pgedge_vectorizer_tag}"
      - "VECTORIZER_CHUNKS=8"
      - "PLPROXY_LANG=plproxy"
      - "TIMESCALE_AVG=15"
      - "HLL_CARD=3"
      - "TDIGEST_P50=50.5"
      - "HYPOPG_OK=true"
      - "PG_ANALYTICS_FULLTEST_OK"

  - name: Multi-cluster isolation, socket directory verification, and init permissions
    description: Verify pg-analytics binds default sockets per cluster, enforces private socket checks on clients, rejects cross-cluster SQL, and leaves existing non-empty directory permissions intact on init failure
    command: |
      set -euo pipefail
      WORK=$(mktemp -d /tmp/pg-analytics-iso.XXXXXX)
      trap 'rm -rf "$WORK"' EXIT
      cat > "${WORK}/run_iso_test.sh" <<'INNER'
      #!/usr/bin/env bash
      set -euo pipefail
      WORK="$1"
      unset PGANALYTICS_RUN

      C1="${WORK}/cluster1"
      C2="${WORK}/cluster2"
      PORT1="5436"
      PORT2="5437"

      cleanup() {
        PGANALYTICS_DATA="$C1" PGANALYTICS_PORT="$PORT1" pg-analytics stop >/dev/null 2>&1 || true
        PGANALYTICS_DATA="$C2" PGANALYTICS_PORT="$PORT2" pg-analytics stop >/dev/null 2>&1 || true
      }
      trap cleanup EXIT

      # 1. init must not alter permissions of an existing non-empty directory
      NONEMPTY="${WORK}/nonempty"
      mkdir -m 755 "$NONEMPTY"
      touch "${NONEMPTY}/keep"
      if PGANALYTICS_DATA="$NONEMPTY" pg-analytics init >/dev/null 2>&1; then
        echo "init unexpectedly succeeded on non-empty directory" >&2
        exit 1
      fi
      test "$(stat -c %a "$NONEMPTY")" = "755"
      echo "INIT_PERMS_PRESERVED=true"

      # 2. Start cluster 1 with default cluster-derived PGANALYTICS_RUN
      PGANALYTICS_DATA="$C1" PGANALYTICS_PORT="$PORT1" pg-analytics init >/dev/null
      PGANALYTICS_DATA="$C1" PGANALYTICS_PORT="$PORT1" pg-analytics start >/dev/null

      # 3. Unstarted cluster 2 must fail enable-extensions and psql without touching cluster 1
      PGANALYTICS_DATA="$C2" PGANALYTICS_PORT="$PORT1" pg-analytics init >/dev/null
      if PGANALYTICS_DATA="$C2" PGANALYTICS_PORT="$PORT1" pg-analytics enable-extensions >/dev/null 2>&1; then
        echo "enable-extensions unexpectedly succeeded on stopped cluster 2" >&2
        exit 1
      fi
      if PGANALYTICS_DATA="$C2" PGANALYTICS_PORT="$PORT1" pg-analytics psql -XAtc 'SELECT 1' >/dev/null 2>&1; then
        echo "psql unexpectedly connected to cluster 1 via cluster 2 PGANALYTICS_DATA" >&2
        exit 1
      fi
      # Confirm cluster 1 was not modified (postgis not installed on cluster 1)
      c1_postgis=$(PGANALYTICS_DATA="$C1" PGANALYTICS_PORT="$PORT1" pg-analytics psql -XAtc "SELECT count(*) FROM pg_extension WHERE extname = 'postgis'")
      test "$c1_postgis" = "0"
      echo "STOPPED_C2_ISOLATED=true"

      # 4. Start cluster 2 on PORT2; both clusters must have distinct default sockets and data directories
      PGANALYTICS_DATA="$C2" PGANALYTICS_PORT="$PORT2" pg-analytics start >/dev/null
      c1_sock=$(sed -n '5p' "${C1}/postmaster.pid")
      c2_sock=$(sed -n '5p' "${C2}/postmaster.pid")
      test "$(realpath -- "$c1_sock")" != "$(realpath -- "$c2_sock")"
      d1=$(PGANALYTICS_DATA="$C1" PGANALYTICS_PORT="$PORT1" pg-analytics psql -XAtc 'SHOW data_directory')
      d2=$(PGANALYTICS_DATA="$C2" PGANALYTICS_PORT="$PORT2" pg-analytics psql -XAtc 'SHOW data_directory')
      test "$(realpath -- "$d1")" = "$(realpath -- "$C1")"
      test "$(realpath -- "$d2")" = "$(realpath -- "$C2")"
      test "$d1" != "$d2"
      echo "TWO_CLUSTERS_ISOLATED=true"

      # 5. Inherited PGHOSTADDR/PGSERVICE and CLI endpoint overrides must not bypass the verified socket
      test "$(PGHOSTADDR=127.0.0.1 PGSERVICE=nonexistent PGANALYTICS_DATA="$C1" PGANALYTICS_PORT="$PORT1" pg-analytics psql -XAtc 'SELECT 1')" = "1"
      PGHOSTADDR=127.0.0.1 PGSERVICE=nonexistent PGANALYTICS_DATA="$C1" PGANALYTICS_PORT="$PORT1" pg-analytics status >/dev/null
      for override_cmd in \
        "-h 127.0.0.1 -XAtc SELECT_1" \
        "--dbn=host=127.0.0.1" \
        "host=127.0.0.1"; do
        read -r -a override_args <<< "$override_cmd"
        set +e
        PGANALYTICS_DATA="$C1" PGANALYTICS_PORT="$PORT1" pg-analytics psql "${override_args[@]}" >/dev/null 2>&1
        rc=$?
        set -e
        if [ "$rc" -ne 2 ]; then
          echo "Expected launcher exit code 2 for override '${override_cmd}', got ${rc}" >&2
          exit 1
        fi
      done
      echo "ENDPOINT_PINNED=true"

      # 6. Mismatched PGANALYTICS_DATA + PGANALYTICS_PORT must be rejected
      if PGANALYTICS_DATA="$C2" PGANALYTICS_PORT="$PORT1" pg-analytics psql -XAtc 'SELECT 1' >/dev/null 2>&1; then
        echo "psql accepted mismatched PGANALYTICS_DATA and PGANALYTICS_PORT" >&2
        exit 1
      fi
      if PGANALYTICS_DATA="$C2" PGANALYTICS_PORT="$PORT1" pg-analytics enable-extensions >/dev/null 2>&1; then
        echo "enable-extensions accepted mismatched PGANALYTICS_DATA and PGANALYTICS_PORT" >&2
        exit 1
      fi
      echo "MISMATCH_REJECTED=true"

      # 7. Client paths must reject non-0700 or symlink socket directories (even on the active cluster's own socket)
      chmod 755 "$c1_sock"
      if PGANALYTICS_DATA="$C1" PGANALYTICS_PORT="$PORT1" pg-analytics psql -XAtc 'SELECT 1' >/dev/null 2>&1; then
        chmod 700 "$c1_sock"
        echo "psql accepted world-readable socket directory" >&2
        exit 1
      fi
      if PGANALYTICS_DATA="$C1" PGANALYTICS_PORT="$PORT1" pg-analytics enable-extensions >/dev/null 2>&1; then
        chmod 700 "$c1_sock"
        echo "enable-extensions accepted world-readable socket directory" >&2
        exit 1
      fi
      chmod 700 "$c1_sock"
      test "$(PGANALYTICS_DATA="$C1" PGANALYTICS_PORT="$PORT1" pg-analytics psql -XAtc 'SELECT 1')" = "1"
      SYM_SOCK="${WORK}/sym_sock"
      ln -s "$c1_sock" "$SYM_SOCK"
      if PGANALYTICS_DATA="$C1" PGANALYTICS_PORT="$PORT1" PGANALYTICS_RUN="$SYM_SOCK" pg-analytics psql -XAtc 'SELECT 1' >/dev/null 2>&1; then
        echo "psql accepted symlink socket directory" >&2
        exit 1
      fi
      echo "UNTRUSTED_SOCK_REJECTED=true"

      PGANALYTICS_DATA="$C1" PGANALYTICS_PORT="$PORT1" pg-analytics stop >/dev/null
      PGANALYTICS_DATA="$C2" PGANALYTICS_PORT="$PORT2" pg-analytics stop >/dev/null
      echo "PG_ANALYTICS_ISO_OK"
      INNER

      if [ "$(id -u)" -eq 0 ]; then
        chown -R postgres:postgres "${WORK}"
        runuser -u postgres -- bash "${WORK}/run_iso_test.sh" "$WORK"
      else
        bash "${WORK}/run_iso_test.sh" "$WORK"
      fi
    expected_output_contains:
      - "INIT_PERMS_PRESERVED=true"
      - "STOPPED_C2_ISOLATED=true"
      - "TWO_CLUSTERS_ISOLATED=true"
      - "ENDPOINT_PINNED=true"
      - "MISMATCH_REJECTED=true"
      - "UNTRUSTED_SOCK_REJECTED=true"
      - "PG_ANALYTICS_ISO_OK"
