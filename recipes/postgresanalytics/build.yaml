name: postgresanalytics
version: "18.7.0"

copyright:
  - license: PostgreSQL
    url: https://www.postgresql.org/about/licence/
  - license: PostgreSQL
    url: "https://github.com/pgEdge/pgedge-vectorizer/blob/{{ context.pgedge_vectorizer_tag }}/docs/LICENCE.md"
  - license: GPL-2.0-or-later
    url: https://github.com/postgis/postgis/blob/master/COPYING
  - license: ISC
    url: https://github.com/plproxy/plproxy/blob/master/COPYRIGHT
  - license: Apache-2.0
    url: https://github.com/timescale/timescaledb/blob/main/LICENSE-APACHE

architectures:
  - x86_64
  - aarch64

variables:
  pg_major: "18"
  postgres_amd64_version: "18.7-1.pgdg24.04+5"
  postgres_arm64_version: "18.7-1.pgdg24.04+5"
  postgis_amd64_version: "3.7.0+dfsg-1.pgdg24.04+2"
  postgis_arm64_version: "3.7.0+dfsg-1.pgdg24.04+2"
  pgvector_amd64_version: "0.8.7-1.pgdg24.04+2"
  pgvector_arm64_version: "0.8.7-1.pgdg24.04+2"
  plproxy_amd64_version: "2.12.0-1.pgdg24.04+3"
  plproxy_arm64_version: "2.12.0-1.pgdg24.04+3"
  timescaledb_amd64_version: "2.32.0+dfsg-2.pgdg24.04+1"
  timescaledb_arm64_version: "2.32.0+dfsg-2.pgdg24.04+1"
  hll_amd64_version: "2.21-1.pgdg24.04+3"
  hll_arm64_version: "2.21-1.pgdg24.04+3"
  tdigest_amd64_version: "1.4.7-1.pgdg24.04+2"
  tdigest_arm64_version: "1.4.7-1.pgdg24.04+2"
  hypopg_amd64_version: "1.4.5-1.pgdg24.04+2"
  hypopg_arm64_version: "1.4.5-1.pgdg24.04+2"
  pgedge_vectorizer_tag: "v1.1"
  postgres_version:
    try:
      - value: "{{ context.postgres_amd64_version }}"
        condition: arch=="x86_64"
      - value: "{{ context.postgres_arm64_version }}"
        condition: arch=="aarch64"
  postgis_version:
    try:
      - value: "{{ context.postgis_amd64_version }}"
        condition: arch=="x86_64"
      - value: "{{ context.postgis_arm64_version }}"
        condition: arch=="aarch64"
  pgvector_version:
    try:
      - value: "{{ context.pgvector_amd64_version }}"
        condition: arch=="x86_64"
      - value: "{{ context.pgvector_arm64_version }}"
        condition: arch=="aarch64"
  plproxy_version:
    try:
      - value: "{{ context.plproxy_amd64_version }}"
        condition: arch=="x86_64"
      - value: "{{ context.plproxy_arm64_version }}"
        condition: arch=="aarch64"
  timescaledb_version:
    try:
      - value: "{{ context.timescaledb_amd64_version }}"
        condition: arch=="x86_64"
      - value: "{{ context.timescaledb_arm64_version }}"
        condition: arch=="aarch64"
  hll_version:
    try:
      - value: "{{ context.hll_amd64_version }}"
        condition: arch=="x86_64"
      - value: "{{ context.hll_arm64_version }}"
        condition: arch=="aarch64"
  tdigest_version:
    try:
      - value: "{{ context.tdigest_amd64_version }}"
        condition: arch=="x86_64"
      - value: "{{ context.tdigest_arm64_version }}"
        condition: arch=="aarch64"
  hypopg_version:
    try:
      - value: "{{ context.hypopg_amd64_version }}"
        condition: arch=="x86_64"
      - value: "{{ context.hypopg_arm64_version }}"
        condition: arch=="aarch64"

auto_update:
  method: sources
  container_version: postgresql-amd64
  local: []
  sources:
    - id: postgresql-amd64
      method: apt
      package: postgresql-18
      urls:
        - https://apt.postgresql.org/pub/repos/apt/dists/noble-pgdg/main/binary-amd64/Packages.gz
      target:
        variable: postgres_amd64_version
        fulltest_variable: postgres_amd64_version
    - id: postgresql-arm64
      method: apt
      package: postgresql-18
      urls:
        - https://apt.postgresql.org/pub/repos/apt/dists/noble-pgdg/main/binary-arm64/Packages.gz
      target:
        variable: postgres_arm64_version
        fulltest_variable: postgres_arm64_version
    - id: postgis-amd64
      method: apt
      package: postgresql-18-postgis-3
      urls:
        - https://apt.postgresql.org/pub/repos/apt/dists/noble-pgdg/main/binary-amd64/Packages.gz
      target:
        variable: postgis_amd64_version
        fulltest_variable: postgis_amd64_version
    - id: postgis-arm64
      method: apt
      package: postgresql-18-postgis-3
      urls:
        - https://apt.postgresql.org/pub/repos/apt/dists/noble-pgdg/main/binary-arm64/Packages.gz
      target:
        variable: postgis_arm64_version
        fulltest_variable: postgis_arm64_version
    - id: pgvector-amd64
      method: apt
      package: postgresql-18-pgvector
      urls:
        - https://apt.postgresql.org/pub/repos/apt/dists/noble-pgdg/main/binary-amd64/Packages.gz
      target:
        variable: pgvector_amd64_version
        fulltest_variable: pgvector_amd64_version
    - id: pgvector-arm64
      method: apt
      package: postgresql-18-pgvector
      urls:
        - https://apt.postgresql.org/pub/repos/apt/dists/noble-pgdg/main/binary-arm64/Packages.gz
      target:
        variable: pgvector_arm64_version
        fulltest_variable: pgvector_arm64_version
    - id: pgedge-vectorizer
      method: github_tags
      repo: pgEdge/pgedge-vectorizer
      target:
        variable: pgedge_vectorizer_tag
        value: tag
        fulltest_variable: pgedge_vectorizer_tag
    - id: pgedge-vectorizer-archive
      method: http_digest
      url: "https://github.com/pgEdge/pgedge-vectorizer/archive/refs/tags/{{ context.pgedge_vectorizer_tag }}.tar.gz"
      dependency: true
      target:
        file: pgedge_vectorizer_tar
    - id: plproxy-amd64
      method: apt
      package: postgresql-18-plproxy
      urls:
        - https://apt.postgresql.org/pub/repos/apt/dists/noble-pgdg/main/binary-amd64/Packages.gz
      target:
        variable: plproxy_amd64_version
        fulltest_variable: plproxy_amd64_version
    - id: plproxy-arm64
      method: apt
      package: postgresql-18-plproxy
      urls:
        - https://apt.postgresql.org/pub/repos/apt/dists/noble-pgdg/main/binary-arm64/Packages.gz
      target:
        variable: plproxy_arm64_version
        fulltest_variable: plproxy_arm64_version
    - id: timescaledb-amd64
      method: apt
      package: postgresql-18-timescaledb
      urls:
        - https://apt.postgresql.org/pub/repos/apt/dists/noble-pgdg/main/binary-amd64/Packages.gz
      target:
        variable: timescaledb_amd64_version
        fulltest_variable: timescaledb_amd64_version
    - id: timescaledb-arm64
      method: apt
      package: postgresql-18-timescaledb
      urls:
        - https://apt.postgresql.org/pub/repos/apt/dists/noble-pgdg/main/binary-arm64/Packages.gz
      target:
        variable: timescaledb_arm64_version
        fulltest_variable: timescaledb_arm64_version
    - id: hll-amd64
      method: apt
      package: postgresql-18-hll
      urls:
        - https://apt.postgresql.org/pub/repos/apt/dists/noble-pgdg/main/binary-amd64/Packages.gz
      target:
        variable: hll_amd64_version
    - id: hll-arm64
      method: apt
      package: postgresql-18-hll
      urls:
        - https://apt.postgresql.org/pub/repos/apt/dists/noble-pgdg/main/binary-arm64/Packages.gz
      target:
        variable: hll_arm64_version
    - id: tdigest-amd64
      method: apt
      package: postgresql-18-tdigest
      urls:
        - https://apt.postgresql.org/pub/repos/apt/dists/noble-pgdg/main/binary-amd64/Packages.gz
      target:
        variable: tdigest_amd64_version
    - id: tdigest-arm64
      method: apt
      package: postgresql-18-tdigest
      urls:
        - https://apt.postgresql.org/pub/repos/apt/dists/noble-pgdg/main/binary-arm64/Packages.gz
      target:
        variable: tdigest_arm64_version
    - id: hypopg-amd64
      method: apt
      package: postgresql-18-hypopg
      urls:
        - https://apt.postgresql.org/pub/repos/apt/dists/noble-pgdg/main/binary-amd64/Packages.gz
      target:
        variable: hypopg_amd64_version
    - id: hypopg-arm64
      method: apt
      package: postgresql-18-hypopg
      urls:
        - https://apt.postgresql.org/pub/repos/apt/dists/noble-pgdg/main/binary-arm64/Packages.gz
      target:
        variable: hypopg_arm64_version

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        LANG: C.UTF-8
        LC_ALL: C.UTF-8

    - install:
        - ca-certificates
        - gnupg
        - libcurl4t64
        - locales
        - procps

    - run:
        - locale-gen en_US.UTF-8 C.UTF-8
        - mkdir -p /etc/postgresql-common
        - echo 'create_main_cluster = false' > /etc/postgresql-common/createcluster.conf
        - install -D -m 0644 {{ get_file("pgdg_key") }} /etc/apt/keyrings/pgdg.asc
        - echo "deb [signed-by=/etc/apt/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" > /etc/apt/sources.list.d/pgdg.list

    - install:
        - "postgresql-{{ context.pg_major }}={{ context.postgres_version }}"
        - "postgresql-client-{{ context.pg_major }}={{ context.postgres_version }}"
        - "postgresql-{{ context.pg_major }}-postgis-3={{ context.postgis_version }}"
        - "postgresql-{{ context.pg_major }}-postgis-3-scripts={{ context.postgis_version }}"
        - "postgis={{ context.postgis_version }}"
        - "postgresql-{{ context.pg_major }}-pgvector={{ context.pgvector_version }}"
        - "postgresql-{{ context.pg_major }}-plproxy={{ context.plproxy_version }}"
        - "postgresql-{{ context.pg_major }}-timescaledb={{ context.timescaledb_version }}"
        - "postgresql-{{ context.pg_major }}-hll={{ context.hll_version }}"
        - "postgresql-{{ context.pg_major }}-tdigest={{ context.tdigest_version }}"
        - "postgresql-{{ context.pg_major }}-hypopg={{ context.hypopg_version }}"

    - run:
        - apt-get update
        - apt-get install -y --no-install-recommends build-essential libcurl4-openssl-dev "postgresql-server-dev-{{ context.pg_major }}={{ context.postgres_version }}"
        - mkdir -p /tmp/pgedge-vectorizer
        - tar -xzf {{ get_file("pgedge_vectorizer_tar") }} --strip-components=1 -C /tmp/pgedge-vectorizer
        - make -C /tmp/pgedge-vectorizer PG_CONFIG=/usr/lib/postgresql/{{ context.pg_major }}/bin/pg_config
        - make -C /tmp/pgedge-vectorizer PG_CONFIG=/usr/lib/postgresql/{{ context.pg_major }}/bin/pg_config install
        - install -D -m 0644 /tmp/pgedge-vectorizer/docs/LICENCE.md /usr/share/doc/pgedge-vectorizer/copyright
        - rm -rf /tmp/pgedge-vectorizer
        - apt-get purge -y --auto-remove build-essential libcurl4-openssl-dev "postgresql-server-dev-{{ context.pg_major }}"
        - rm -rf /var/lib/apt/lists/*
        - '! ldd /usr/lib/postgresql/{{ context.pg_major }}/lib/pgedge_vectorizer.so | grep -q "not found"'

    - copy:
        - pg-analytics
        - /usr/local/bin/pg-analytics

    - run:
        - chmod 0755 /usr/local/bin/pg-analytics

    - environment:
        PATH: "/usr/local/bin:/usr/lib/postgresql/{{ context.pg_major }}/bin:$PATH"
        PGANALYTICS_PORT: "5433"

deploy:
  path:
    - /usr/local/bin
    - "/usr/lib/postgresql/{{ context.pg_major }}/bin"
  bins:
    - pg-analytics
    - psql
    - initdb
    - pg_ctl
    - postgres
    - pg_dump
    - pg_restore
    - pg_isready
    - shp2pgsql
    - raster2pgsql

files:
  - name: pgdg_key
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    sha256: 0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76
  - name: pgedge_vectorizer_tar
    url: "https://github.com/pgEdge/pgedge-vectorizer/archive/refs/tags/{{ context.pgedge_vectorizer_tag }}.tar.gz"
    sha256: 96362aebad23a39f3b1c393cadf1f37894052b1eaaa4b3b59d1711330cbfe199
  - name: pg-analytics
    filename: pg-analytics
    executable: true

categories:
  - "data organisation"
  - "statistics"
  - "programming"

domains:
  - datascience

readme: |
  ----------------------------------
  ## postgresanalytics/{{ context.version }} ##

  Bundled PostgreSQL {{ context.pg_major }} advanced analytics container for data science desktops (`scidesktop`, `aidesktop`) loaded via `ml` (Lmod / Apptainer).

  ### Bundled Extensions
  - **Geospatial**: `postgis`, `postgis_topology`, `postgis_raster` (plus `shp2pgsql` and `raster2pgsql`)
  - **Vector & AI Embeddings**: `vector` (`pgvector`) and `pgedge_vectorizer` (`{{ context.pgedge_vectorizer_tag }}`)
  - **Horizontal Partitioning**: `plproxy`
  - **Time-Series & Streaming Analytics**: `timescaledb` (Apache-2.0 edition), `hll` (HyperLogLog), `tdigest`
  - **Query Optimization & Contrib**: `hypopg`, `pg_stat_statements`, `btree_gin`, `btree_gist`, `pg_trgm`, `hstore`, `uuid-ossp`, `citext`, `cube`, `earthdistance`, `tablefunc`

  ### Quick Start (Read-Only Apptainer / Non-Root Desktops)
  The `pg-analytics` helper runs PostgreSQL in user space on port `5433` by default (avoiding port `5432` used by Airflow/MLflow in `aidesktop`):

  ```bash
  ml postgresanalytics/{{ context.version }}
  pg-analytics init
  pg-analytics start --foreground &
  pg-analytics status  # Wait for accepting connections before continuing.
  pg-analytics enable-extensions
  pg-analytics psql
  # When finished:
  pg-analytics stop
  ```

  Foreground mode keeps the Apptainer session and its mounted image alive for PostgreSQL. In Docker or an interactive Apptainer shell, you can use `pg-analytics start` to run PostgreSQL in the background.

  The private Unix socket uses peer authentication. To connect over TCP, set a role password using `\password` in `pg-analytics psql`. PostgreSQL requires SCRAM authentication for TCP clients on the loopback interface.

  The database lives in `$HOME/pg-analytics` on your mounted home by default. Set `PGANALYTICS_DATA` to another writable location for a different cluster. Use `PGANALYTICS_RUN` for a private socket directory, `PGANALYTICS_HOST` and `PGANALYTICS_PORT` for the listener, `PGANALYTICS_DB` for the default database, `PGANALYTICS_LOG` for the log, and `PGANALYTICS_PRELOAD` for the libraries loaded at startup.

  When using `ml`, prefix these variables with `APPTAINERENV_` to pass them to the container. For example, `export APPTAINERENV_PGANALYTICS_PORT=5435` changes the port for subsequent `pg-analytics` commands. Use `SINGULARITYENV_` with SingularityCE.

  More documentation: https://www.postgresql.org/docs/18/
  ----------------------------------

