name: lcmodel
version: "6.3.0"

copyright:
  - name: LCModel and LCMgui License Agreement
    url: https://lcmodel.ca/lcm-license.shtml
  - license: MIT
    url: https://github.com/kspaceKelvin/LCModel-MRD-App/blob/main/LICENSE
  - license: MIT
    url: https://github.com/kspaceKelvin/python-ismrmrd-server/blob/master/LICENSE
icon: data:image/svg+xml;base64,

architectures:
  - x86_64

variables:
  lcm_64_url: https://www.lcmodel.com/pub/LCModel/programs/lcm-64.tar
  basis_3t_url: https://www.s-provencher.com/pub/LCModel/3t.zip
  basis_1_5t_url: https://www.s-provencher.com/pub/LCModel/1.5t.zip
  basis_7t_url: https://www.s-provencher.com/pub/LCModel/7t.zip
  basis_9_4t_url: https://www.s-provencher.com/pub/LCModel/9.4t.zip
  basisset_lcmodel_url: https://www.ismrm.org/workshops/Spectroscopy16/mrs_fitting_challenge/basisset_LCModel.zip
  mrs_basis_sets_commit: 646c6214f25e5d6758a9295bf9b41c3850264ae9
  testdata_url: https://zenodo.org/record/3904443/files/Spectra_hippocampus%28rat%29_TE02.rar?download=1
  manual_url: https://www.lcmodel.com/pub/LCModel/manual/manual.pdf
  upstream_version: '6.3'
  mrdapp_commit: 0d66d2e814e265f4a0ffcc1d1d5efd334a7f6a8c
  mrdapp_raw: https://raw.githubusercontent.com/kspaceKelvin/LCModel-MRD-App/{{ context.mrdapp_commit }}
  base_image_digest: sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
  openrecon_ubuntu_version: '24.04'
  openrecon_ismrmrd_version: 1.14.2
  openrecon_siemens_commit: 055eefc09dfa77fbf11fff85979dea9ef2879ba5
  openrecon_python_tools_commit: 17fe6fbf1bb645112e2ad0023eb4f42afb36421e
  openrecon_server_commit: 33362f2139701fbf5ea855808a325eb59b7db2ae
files:
  - name: lcm_64_tar
    url: "https://www.lcmodel.com/pub/LCModel/programs/lcm-64.tar"
    sha256: 2dbdca8ec89bc6de50b9aa723a1ebac8fabb7455dca12289821e5435f624b400
  - name: basis_3t_zip
    url: "{{ context.basis_3t_url }}"
  - name: basis_1_5t_zip
    url: "{{ context.basis_1_5t_url }}"
  - name: basis_7t_zip
    url: "{{ context.basis_7t_url }}"
  - name: basis_9_4t_zip
    url: "{{ context.basis_9_4t_url }}"
  - name: basisset_lcmodel_zip
    url: "{{ context.basisset_lcmodel_url }}"
  - name: mrs_basis_sets_zip
    url: https://github.com/mr-science-lab/mrs-basis-sets/archive/{{ context.mrs_basis_sets_commit }}.zip
  - name: testdata_rar
    url: "{{ context.testdata_url }}"
  - name: manual_pdf
    url: "{{ context.manual_url }}"
  - name: lcmodel.py
    url: "{{ context.mrdapp_raw }}/lcmodel.py"
  - name: lcmodel.json
    url: "{{ context.mrdapp_raw }}/lcmodel.json"
  - name: svs_se_30.h5
    url: "{{ context.mrdapp_raw }}/data/svs_se_30.h5"
  - name: svs_se_30_REF.h5
    url: "{{ context.mrdapp_raw }}/data/svs_se_30_REF.h5"
  - name: OpenReconLabel.json
    filename: OpenReconLabel.json
  - name: OpenReconREADME.md
    filename: OpenReconREADME.md

auto_update:
  container_version: {"variable": "upstream_version"}
  method: sources
  local:
    - macros/openrecon
  sources:
  - id: binary
    method: http_digest
    url: https://www.lcmodel.com/pub/LCModel/programs/lcm-64.tar
    target:
      file: lcm_64_tar
  - id: basis-sets
    dependency: true
    method: github_commit
    repo: mr-science-lab/mrs-basis-sets
    target:
      variable: mrs_basis_sets_commit
  - id: mrdapp
    method: github_commit
    repo: kspaceKelvin/LCModel-MRD-App
    ref: HEAD
    target:
      variable: mrdapp_commit
  - id: base_image
    dependency: true
    method: oci_digest
    image: ubuntu
    tag: '24.04'
    target:
      variable: base_image_digest
  - id: openrecon_ismrmrd
    dependency: true
    method: github_release
    repo: ismrmrd/ismrmrd
    target:
      variable: openrecon_ismrmrd_version
      value: version
  - id: openrecon_siemens
    dependency: true
    method: github_commit
    repo: ismrmrd/siemens_to_ismrmrd
    ref: HEAD
    target:
      variable: openrecon_siemens_commit
  - id: openrecon_python_tools
    dependency: true
    method: github_commit
    repo: ismrmrd/ismrmrd-python-tools
    ref: HEAD
    target:
      variable: openrecon_python_tools_commit
  - id: openrecon_server
    dependency: true
    method: github_commit
    repo: astewartau/python-ismrmrd-server
    ref: fix/ismrmrd-compatibility
    target:
      variable: openrecon_server_commit
build:
  kind: neurodocker
  base-image: ubuntu:24.04@{{ context.base_image_digest }}
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
    - install:
        - curl
        - ca-certificates
        - libx11-6
        - libxft2
        - libxss1
        - libtk8.6
        - libnet-ifconfig-wrapper-perl
        - vim
        - nano
        - unzip
        - gv
        - unrar
        - ghostscript
        - libimage-exiftool-perl
        - bzip2
        - git
        - build-essential
        - python3-pip
        - python-is-python3
    # FIRE / OpenRecon server, see OpenReconREADME.md
    - include: macros/openrecon/neurodocker.yaml
    - workdir: /opt/lcmodel-{{ context.upstream_version }}/
    - run:
        - tar xf '{{ get_file("lcm_64_tar") }}'
        - gunzip -c lcm-core.tar.gz | tar xf -
        - rm -rf lcm-core.tar.gz
        - chmod -R a+rwx /opt/lcmodel-{{ context.upstream_version }}
    - workdir: /opt/lcmodel-{{ context.upstream_version }}/.lcmodel/basis-sets
    - run:
        - unzip '{{ get_file("basis_3t_zip") }}'
        - unzip '{{ get_file("basis_1_5t_zip") }}'
        - unzip '{{ get_file("basis_7t_zip") }}'
        - unzip '{{ get_file("basis_9_4t_zip") }}'
        - unzip '{{ get_file("basisset_lcmodel_zip") }}'
        - unzip -q '{{ get_file("mrs_basis_sets_zip") }}' 'mrs-basis-sets-{{ context.mrs_basis_sets_commit }}/slaser/lcmodel/siemens/RawBasis_for_sLASERSiemens_TE_20_BW_2500_NPts_1024/*' 'mrs-basis-sets-{{ context.mrs_basis_sets_commit }}/slaser/lcmodel/siemens/RawBasis_for_sLASERSiemens_TE_20_BW_4000_NPts_2048/*'
        - mv mrs-basis-sets-{{ context.mrs_basis_sets_commit }}/slaser/lcmodel/siemens/RawBasis_for_sLASERSiemens_TE_20_BW_2500_NPts_1024 .
        - mv mrs-basis-sets-{{ context.mrs_basis_sets_commit }}/slaser/lcmodel/siemens/RawBasis_for_sLASERSiemens_TE_20_BW_4000_NPts_2048 .
        - rm -rf mrs-basis-sets-{{ context.mrs_basis_sets_commit }}
        - chmod -R a+rwx /opt/lcmodel-{{ context.upstream_version }}/.lcmodel/basis-sets
    # LCModel has been free since 2021 and only checks that .lcmodel/license
    # exists - the file must stay EMPTY. The licence key that used to be shipped
    # here was deliberately removed in 9fe69805; do not add content back.
    - run:
        - mkdir -p /opt/lcmodel-{{ context.upstream_version }}/.lcmodel
        - touch /opt/lcmodel-{{ context.upstream_version }}/.lcmodel/license
    - workdir: /opt/datasets
    - run:
        - unrar x '{{ get_file("testdata_rar") }}'
        - cp '{{ get_file("manual_pdf") }}' /opt/lcmodel-{{ context.upstream_version }}/manual.pdf
    - copy:
        - setup_lcmodel.sh
        - /opt/lcmodel-{{ context.upstream_version }}/.lcmodel/bin/setup_lcmodel.sh
    - workdir: /opt/lcmodel-{{ context.upstream_version }}/.lcmodel/profiles/1/control-defaults
    - copy:
        - controlfiledefault
        - /opt/lcmodel-{{ context.upstream_version }}/.lcmodel/profiles/1/control-defaults/controlfiledefault
    - copy:
        - gui-defaults
        - /opt/lcmodel-{{ context.upstream_version }}/.lcmodel/profiles/1/gui-defaults
    - run:
        # Large files got their mode in the layer that created them; touching
        # them again here would store a second copy in this layer.
        - find /opt/lcmodel-{{ context.upstream_version }} ! -perm -0777 -exec chmod a+rwx {} +
        - chmod 644 /opt/lcmodel-{{ context.upstream_version }}/.lcmodel/license
    # LCModel MRD App (https://github.com/kspaceKelvin/LCModel-MRD-App). It
    # resolves its basis file relative to PYTHONPATH, so the server's basis
    # folder points at the bundled basis sets.
    - workdir: /opt/code/python-ismrmrd-server
    - run:
        - cp {{ get_file("lcmodel.py") }} lcmodel.py
        # Upstream's base image exports this helper at package level; released
        # ismrmrd-python only has it in ismrmrd.image.
        - sed -i 's/ismrmrd\.get_dtype_from_data_type/ismrmrd.image.get_dtype_from_data_type/g' lcmodel.py
        # LCModel writes a scratch file to its working directory, which is the
        # read-only server folder under Apptainer. Run it in its data folder.
        - sed -i 's/check_output(lcmodelCmd, shell=True, text=True)/check_output(lcmodelCmd, shell=True, text=True, cwd=dataFolder)/' lcmodel.py
        - cp {{ get_file("lcmodel.json") }} lcmodel.json
        - cp {{ get_file("OpenReconLabel.json") }} OpenReconLabel.json
        - ln -s /opt/lcmodel-{{ context.upstream_version }}/.lcmodel/basis-sets basis
        - cp {{ get_file("OpenReconREADME.md") }} /opt/lcmodel-{{ context.upstream_version }}/OpenReconREADME.md
        - mkdir -p /opt/datasets/mrd
        - cp {{ get_file("svs_se_30.h5") }} /opt/datasets/mrd/svs_se_30.h5
        - cp {{ get_file("svs_se_30_REF.h5") }} /opt/datasets/mrd/svs_se_30_REF.h5
        - chmod -R a+rX /opt/datasets/mrd
        - mkdir -p /tmp/share
        - chmod 1777 /tmp/share
    - environment:
        PATH: /opt/lcmodel-{{ context.upstream_version }}/.lcmodel/bin/:/opt/lcmodel-{{ context.upstream_version }}/.lcmodel/:$PATH
        PYTHONPATH: /opt/code/python-ismrmrd-server

deploy:
  path:
    - /opt/lcmodel-{{ context.upstream_version }}/.lcmodel/bin/
    - /opt/lcmodel-{{ context.upstream_version }}/.lcmodel/

readme: |-
  
  ----------------------------------
  ## lcmodel/{{ context.version }} ##
  Automatic quantification of in vivo proton MR spectra. 
  
  When using this for the first time, run:
  ```
  setup_lcmodel.sh
  ```
  
  Example:
  ```
  lcmgui
  ```
  
  More documentation can be found here: http://www.lcmodel.com/lcmodel.shtml
  The manual contains a lot of useful information: http://www.lcmodel.com/pub/LCModel/manual/manual.pdf (or /opt/lcmodel-{{ context.upstream_version }}/manual.pdf)
  
  ### FIRE / OpenRecon
  The container also runs LCModel as an ISMRMRD (FIRE / OpenRecon) server, based on the
  LCModel MRD App by Kelvin Chow: https://github.com/kspaceKelvin/LCModel-MRD-App
  Send the water-unsuppressed reference scan first, then the water-suppressed scan. The
  report comes back as an image, with the concentration table base64 encoded in its
  `LCModelTable` MetaAttribute. Parameters: /opt/lcmodel-{{ context.upstream_version }}/OpenReconREADME.md

  Example with the bundled data (the client opens its input for writing, so copy it first):
  ```
  cp /opt/datasets/mrd/*.h5 /tmp/
  cd /opt/code/python-ismrmrd-server
  python3 main.py -v -H=0.0.0.0 -p=9002 -l=/tmp/lcmodel-server.log &
  python3 client.py -c lcmodel -o /tmp/svs_se_30_REF_results.h5 /tmp/svs_se_30_REF.h5
  python3 client.py -c lcmodel -o /tmp/svs_se_30_results.h5 /tmp/svs_se_30.h5
  ```

  To run container outside of this environment: ml lcmodel/{{ context.version }}
  
  ----------------------------------

domains:
  - neuroimaging
categories:
  - spectroscopy
  - image reconstruction

structured_readme:
  citation: |-
    Provencher SW. Estimation of metabolite concentrations from localized in vivo proton NMR spectra. Magn Reson Med. 1993;30(6):672-679. doi:10.1002/mrm.1910300604
