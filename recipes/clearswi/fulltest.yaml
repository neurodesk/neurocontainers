      mag = readmag(joinpath(nifti_folder, "Mag.nii"))
      phase = readphase(joinpath(nifti_folder, "Phase.nii"))
      data = Data(mag, phase, mag.header, [4,8,12])
      options = Options(phase_scaling_strength=4)
      swi = calculateSWI(data, options)
      mkpath("${output_dir}/options")
      savenii(swi, "${output_dir}/options/swi_strength_4.nii"; header=mag.header)
      println("phase_scaling_strength=4 completed")
      '
    validate:
      - output_exists: ${output_dir}/options/swi_strength_4.nii

  - name: Phase scaling strength 8
    description: Test phase_scaling_strength=8 (strong phase mask)
    command: |
      julia -e '
      using CLEARSWI
      nifti_folder = CLEARSWI.dir("test","data","small")
      mag = readmag(joinpath(nifti_folder, "Mag.nii"))
      phase = readphase(joinpath(nifti_folder, "Phase.nii"))
      data = Data(mag, phase, mag.header, [4,8,12])
      options = Options(phase_scaling_strength=8)
      swi = calculateSWI(data, options)
      mkpath("${output_dir}/options")
      savenii(swi, "${output_dir}/options/swi_strength_8.nii"; header=mag.header)
      println("phase_scaling_strength=8 completed")
      '
    validate:
      - output_exists: ${output_dir}/options/swi_strength_8.nii

  # ==========================================================================
  # INTERMEDIATE STEPS OUTPUT
  # ==========================================================================
  - name: Save intermediate steps
    description: Test writesteps option to save processing intermediates
    command: |
      julia -e '
      using CLEARSWI
      nifti_folder = CLEARSWI.dir("test","data","small")
      mag = readmag(joinpath(nifti_folder, "Mag.nii"))
      phase = readphase(joinpath(nifti_folder, "Phase.nii"))
      data = Data(mag, phase, mag.header, [4,8,12])
      mkpath("${output_dir}/steps/intermediate")
      options = Options(writesteps="${output_dir}/steps/intermediate")
      swi = calculateSWI(data, options)
      println("Intermediate steps saved")
      '
    validate:
      - output_exists: ${output_dir}/steps/intermediate/combined_mag.nii
      - output_exists: ${output_dir}/steps/intermediate/combinedphase.nii
      - output_exists: ${output_dir}/steps/intermediate/filteredphase.nii
      - output_exists: ${output_dir}/steps/intermediate/unwrappedphase.nii
      - output_exists: ${output_dir}/steps/intermediate/sensitivity.nii
      - output_exists: ${output_dir}/steps/intermediate/sensitivity_corrected_mag.nii
      - output_exists: ${output_dir}/steps/intermediate/swimag.nii
      - output_exists: ${output_dir}/steps/intermediate/swiphase.nii
      - output_exists: ${output_dir}/steps/intermediate/maskforphase.nii

  # ==========================================================================
  # SINGLE-ECHO SWI
  # ==========================================================================
  - name: Single-echo SWI
    description: Test SWI calculation with single echo data
    command: |
      julia -e '
      using CLEARSWI
      nifti_folder = CLEARSWI.dir("test","data","small")
      mag_full = readmag(joinpath(nifti_folder, "Mag.nii"))
      phase_full = readphase(joinpath(nifti_folder, "Phase.nii"))

      # Extract first echo only
      mag_single = mag_full[:,:,:,1]
      phase_single = phase_full[:,:,:,1]

      TEs = [4]  # single TE
      data = Data(mag_single, phase_single, mag_full.header, TEs)
      swi = calculateSWI(data)

      println("Single-echo SWI shape: ", size(swi))
      savenii(swi, "${output_dir}/swi_single_echo.nii"; header=mag_full.header)
      println("Single-echo SWI completed")
      '
    expected_output_contains:
      - "Single-echo SWI shape: (40, 40, 20)"
    validate:
      - output_exists: ${output_dir}/swi_single_echo.nii

  # ==========================================================================
  # DUAL-ECHO SWI
  # ==========================================================================
  - name: Dual-echo SWI
    description: Test SWI calculation with two echoes
    command: |
      julia -e '
      using CLEARSWI
      nifti_folder = CLEARSWI.dir("test","data","small")
      mag_full = readmag(joinpath(nifti_folder, "Mag.nii"))
      phase_full = readphase(joinpath(nifti_folder, "Phase.nii"))

      # Extract first two echoes
      mag_dual = mag_full[:,:,:,1:2]
      phase_dual = phase_full[:,:,:,1:2]

      TEs = [4, 8]  # dual TE
      data = Data(mag_dual, phase_dual, mag_full.header, TEs)
      swi = calculateSWI(data)

      println("Dual-echo SWI shape: ", size(swi))
      savenii(swi, "${output_dir}/swi_dual_echo.nii"; header=mag_full.header)
      println("Dual-echo SWI completed")
      '
    expected_output_contains:
      - "Dual-echo SWI shape: (40, 40, 20)"
    validate:
      - output_exists: ${output_dir}/swi_dual_echo.nii

  # ==========================================================================
  # INVERTED PHASE
  # ==========================================================================
  - name: Inverted phase processing
    description: Test SWI with inverted phase (sign flipped)
    command: |
      julia -e '
      using CLEARSWI
      nifti_folder = CLEARSWI.dir("test","data","small")
      mag = readmag(joinpath(nifti_folder, "Mag.nii"))
      phase = readphase(joinpath(nifti_folder, "Phase.nii"))

      # Invert phase
      phase_inverted = -phase

      data = Data(mag, phase_inverted, mag.header, [4,8,12])
      swi = calculateSWI(data)

      savenii(swi, "${output_dir}/swi_inverted_phase.nii"; header=mag.header)
      println("Inverted phase SWI completed")
      '
    validate:
      - output_exists: ${output_dir}/swi_inverted_phase.nii

  # ==========================================================================
  # COMBINED OPTIONS
  # ==========================================================================
  - name: Combined options - high quality
    description: Test multiple options combined for high quality output
    command: |
      julia -e '
      using CLEARSWI
      nifti_folder = CLEARSWI.dir("test","data","small")
      mag = readmag(joinpath(nifti_folder, "Mag.nii"))
      phase = readphase(joinpath(nifti_folder, "Phase.nii"))
      data = Data(mag, phase, mag.header, [4,8,12])

      options = Options(
        mag_combine=:SNR,
        mag_softplus=true,
        phase_unwrap=:romeo,
        phase_hp_sigma=[10,10,5],
        phase_scaling_type=:tanh,
        phase_scaling_strength=4
      )
      swi = calculateSWI(data, options)

      savenii(swi, "${output_dir}/swi_high_quality.nii"; header=mag.header)
      println("High quality SWI completed")
      '
    validate:
      - output_exists: ${output_dir}/swi_high_quality.nii

  - name: Combined options - traditional SWI
    description: Test options for traditional SWI appearance
    command: |
      julia -e '
      using CLEARSWI
      nifti_folder = CLEARSWI.dir("test","data","small")
      mag = readmag(joinpath(nifti_folder, "Mag.nii"))
      phase = readphase(joinpath(nifti_folder, "Phase.nii"))
      data = Data(mag, phase, mag.header, [4,8,12])

      options = Options(
        mag_combine=:last,
        mag_softplus=false,
        phase_unwrap=:laplacian,
        phase_scaling_type=:negative,
        phase_scaling_strength=4
      )
      swi = calculateSWI(data, options)

      savenii(swi, "${output_dir}/swi_traditional.nii"; header=mag.header)
      println("Traditional SWI completed")
      '
    validate:
      - output_exists: ${output_dir}/swi_traditional.nii

  - name: Combined options - 7T optimized
    description: Test options optimized for 7T ultra-high field
    command: |
      julia -e '
      using CLEARSWI
      nifti_folder = CLEARSWI.dir("test","data","small")
      mag = readmag(joinpath(nifti_folder, "Mag.nii"))
      phase = readphase(joinpath(nifti_folder, "Phase.nii"))
      data = Data(mag, phase, mag.header, [4,8,12])

      options = Options(
        mag_combine=:SNR,
        mag_softplus=true,
        phase_unwrap=:romeo,
        phase_hp_sigma=[20,20,10],
        phase_scaling_type=:tanh,
        phase_scaling_strength=6
      )
      swi = calculateSWI(data, options)

      savenii(swi, "${output_dir}/swi_7t_optimized.nii"; header=mag.header)
      println("7T optimized SWI completed")
      '
    validate:
      - output_exists: ${output_dir}/swi_7t_optimized.nii

  # ==========================================================================
  # FULL PIPELINE TEST
  # ==========================================================================
  - name: Full SWI pipeline with MIP
    description: Complete SWI workflow producing SWI and MIP outputs
    command: |
      julia -e '
      using CLEARSWI

      # Load data
      nifti_folder = CLEARSWI.dir("test","data","small")
      TEs = [4, 8, 12]
      mag = readmag(joinpath(nifti_folder, "Mag.nii"))
      phase = readphase(joinpath(nifti_folder, "Phase.nii"))
      data = Data(mag, phase, mag.header, TEs)

      # Calculate SWI with optimized settings
      mkpath("${output_dir}/full_pipeline")
      options = Options(
        phase_unwrap=:romeo,
        phase_hp_sigma=[10,10,5],
        writesteps="${output_dir}/full_pipeline"
      )
      swi = calculateSWI(data, options)

      # Create projections
      mip = createMIP(swi, 7)
      maxip = createIntensityProjection(swi, maximum)

      # Save outputs
      savenii(swi, "${output_dir}/full_pipeline/swi.nii"; header=mag.header)
      savenii(mip, "${output_dir}/full_pipeline/mip.nii"; header=mag.header)
      savenii(maxip, "${output_dir}/full_pipeline/maxip.nii"; header=mag.header)

      println("Full pipeline completed successfully")
      println("SWI shape: ", size(swi))
      println("MIP shape: ", size(mip))
      println("MaxIP shape: ", size(maxip))
      '
    expected_output_contains:
      - "Full pipeline completed successfully"
    validate:
      - output_exists: ${output_dir}/full_pipeline/swi.nii
      - output_exists: ${output_dir}/full_pipeline/mip.nii
      - output_exists: ${output_dir}/full_pipeline/maxip.nii

  # ==========================================================================
  # OPTIONS DEFAULTS VERIFICATION
  # ==========================================================================
  - name: Verify default options
    description: Confirm all default option values are as documented
    command: |
      julia -e '
      using CLEARSWI
      opt = Options()
      println("mag_combine: ", opt.mag_combine)
      println("mag_sens: ", opt.mag_sens)
      println("mag_softplus: ", opt.mag_softplus)
      println("phase_unwrap: ", opt.phase_unwrap)
      println("phase_hp_sigma: ", opt.phase_hp_sigma)
      println("phase_scaling_type: ", opt.phase_scaling_type)
      println("phase_scaling_strength: ", opt.phase_scaling_strength)
      println("writesteps: ", opt.writesteps)
      '
    expected_output_contains:
      - "mag_combine: SNR"
      - "mag_sens: nothing"
      - "mag_softplus: true"
      - "phase_unwrap: laplacian"
      - "phase_hp_sigma: [4, 4, 0]"
      - "phase_scaling_type: tanh"
      - "phase_scaling_strength: 4"
      - "writesteps: nothing"

  # ==========================================================================
  # DATA STRUCT VERIFICATION
  # ==========================================================================
  - name: Verify Data struct fields
    description: Confirm Data struct has expected fields
    command: |
      julia -e '
      using CLEARSWI
      println("Data fields: ", fieldnames(CLEARSWI.Data))
      '
    expected_output_contains:
      - "mag"
      - "phase"
      - "header"
      - "TEs"

  # ==========================================================================
  # ERROR HANDLING
  # ==========================================================================
  - name: Handle missing file gracefully
    description: Test error handling when file does not exist
    command: |
      julia -e 'using CLEARSWI; try readmag("/nonexistent/file.nii"); catch e; println("Error caught: ", typeof(e)); end'
    expected_output_contains: "Error caught:"

  # ==========================================================================
  # COMMAND LINE INTERFACE
  #
  # The Julia API tests above cover the algorithms. This section covers the
  # other way of running the container: the `clearswi` program exposed through
  # deploy.path. Each case exercises one flag's parsing and argument plumbing
  # and asserts that an output volume was actually written.
  #
  # Every test resolves the packaged data through ${output_dir}/datadir, which
  # setup wrote once.
  # ==========================================================================
  - name: CLI basic run
    description: Minimal multi-echo invocation with explicit echo times
    command: |
      D=$(cat ${output_dir}/datadir)
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" -o ${output_dir}/cli/basic.nii
    validate:
      - output_exists: ${output_dir}/cli/basic.nii

  - name: CLI echo times in range syntax
    description: Echo times given as start:step:stop instead of an array
    command: |
      D=$(cat ${output_dir}/datadir)
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "4:4:12" -o ${output_dir}/cli/range_te.nii
    validate:
      - output_exists: ${output_dir}/cli/range_te.nii

  - name: CLI mip slices
    description: -s controls the number of slices in the MIP
    command: |
      D=$(cat ${output_dir}/datadir)
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" -s 5 -o ${output_dir}/cli/mip5.nii
    validate:
      - output_exists: ${output_dir}/cli/mip5.nii

  # Echo selection needs array syntax. Space separated values such as -e 1 2 are
  # parsed with Meta.parse on the joined string and fail upstream.
  - name: CLI echo subset
    description: -e loads only the requested echoes from disk
    command: |
      D=$(cat ${output_dir}/datadir)
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" -e "[1,2]" -o ${output_dir}/cli/echoes.nii
    validate:
      - output_exists: ${output_dir}/cli/echoes.nii

  - name: CLI single echo
    description: Single echo input through the command line
    command: |
      D=$(cat ${output_dir}/datadir)
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" -e "1" -o ${output_dir}/cli/single_echo.nii
    validate:
      - output_exists: ${output_dir}/cli/single_echo.nii

  - name: CLI verbose
    description: -v produces progress output and still writes the volume
    command: |
      D=$(cat ${output_dir}/datadir)
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" -v -o ${output_dir}/cli/verbose.nii
    validate:
      - output_exists: ${output_dir}/cli/verbose.nii

  - name: CLI no memory mapping
    description: -N disables mmap, which matters on network storage
    command: |
      D=$(cat ${output_dir}/datadir)
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" -N -o ${output_dir}/cli/no_mmap.nii
    validate:
      - output_exists: ${output_dir}/cli/no_mmap.nii

  - name: CLI no phase rescale
    description: --no-phase-rescale skips rescaling the input phase
    command: |
      D=$(cat ${output_dir}/datadir)
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" --no-phase-rescale -o ${output_dir}/cli/no_rescale.nii
    validate:
      - output_exists: ${output_dir}/cli/no_rescale.nii

  - name: CLI fix GE phase
    description: --fix-ge-phase corrects the slice jumps GE systems write
    command: |
      D=$(cat ${output_dir}/datadir)
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" --fix-ge-phase -o ${output_dir}/cli/ge_phase.nii
    validate:
      - output_exists: ${output_dir}/cli/ge_phase.nii

  # --mag-combine takes four distinct forms, two of which are two tokens wide.
  - name: CLI mag-combine SNR and average
    description: Single token magnitude combination modes
    command: |
      D=$(cat ${output_dir}/datadir)
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" --mag-combine SNR -o ${output_dir}/cli/mc_snr.nii
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" --mag-combine average -o ${output_dir}/cli/mc_avg.nii
    validate:
      - output_exists: ${output_dir}/cli/mc_snr.nii
      - output_exists: ${output_dir}/cli/mc_avg.nii

  - name: CLI mag-combine echo and SE
    description: Two token magnitude combination modes, echo <n> and SE <te>
    command: |
      D=$(cat ${output_dir}/datadir)
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" --mag-combine echo 2 -o ${output_dir}/cli/mc_echo2.nii
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" --mag-combine SE 8 -o ${output_dir}/cli/mc_se8.nii
    validate:
      - output_exists: ${output_dir}/cli/mc_echo2.nii
      - output_exists: ${output_dir}/cli/mc_se8.nii

  - name: CLI sensitivity correction on and off
    description: --mag-sensitivity-correction toggles the CLEAR-SWI correction
    command: |
      D=$(cat ${output_dir}/datadir)
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" --mag-sensitivity-correction on -o ${output_dir}/cli/sens_on.nii
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" --mag-sensitivity-correction off -o ${output_dir}/cli/sens_off.nii
    validate:
      - output_exists: ${output_dir}/cli/sens_on.nii
      - output_exists: ${output_dir}/cli/sens_off.nii

  - name: CLI softplus scaling on and off
    description: --mag-softplus-scaling toggles softplus magnitude scaling
    command: |
      D=$(cat ${output_dir}/datadir)
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" --mag-softplus-scaling on -o ${output_dir}/cli/sp_on.nii
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" --mag-softplus-scaling off -o ${output_dir}/cli/sp_off.nii
    validate:
      - output_exists: ${output_dir}/cli/sp_on.nii
      - output_exists: ${output_dir}/cli/sp_off.nii

  - name: CLI unwrapping algorithms
    description: All three values of --unwrapping-algorithm
    command: |
      D=$(cat ${output_dir}/datadir)
      for a in laplacian romeo laplacianslice; do
        clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" --unwrapping-algorithm $a -o ${output_dir}/cli/unwrap_$a.nii
      done
    validate:
      - output_exists: ${output_dir}/cli/unwrap_laplacian.nii
      - output_exists: ${output_dir}/cli/unwrap_romeo.nii
      - output_exists: ${output_dir}/cli/unwrap_laplacianslice.nii

  # --filter-size needs array syntax. The help also advertises "<x> <y> <z>",
  # but three separate tokens fail upstream in Meta.parse.
  - name: CLI filter size
    description: --filter-size sets the high-pass phase filter in voxels
    command: |
      D=$(cat ${output_dir}/datadir)
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" --filter-size "[10,10,5]" -o ${output_dir}/cli/filter3d.nii
    validate:
      - output_exists: ${output_dir}/cli/filter3d.nii

  - name: CLI phase scaling types
    description: All five values of --phase-scaling-type, including negativetanh
    command: |
      D=$(cat ${output_dir}/datadir)
      for s in tanh negativetanh positive negative triangular; do
        clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" --phase-scaling-type $s -o ${output_dir}/cli/scale_$s.nii
      done
    validate:
      - output_exists: ${output_dir}/cli/scale_tanh.nii
      - output_exists: ${output_dir}/cli/scale_negativetanh.nii
      - output_exists: ${output_dir}/cli/scale_positive.nii
      - output_exists: ${output_dir}/cli/scale_negative.nii
      - output_exists: ${output_dir}/cli/scale_triangular.nii

  - name: CLI phase scaling strength
    description: --phase-scaling-strength across the useful range
    command: |
      D=$(cat ${output_dir}/datadir)
      for n in 2 4 6; do
        clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" --phase-scaling-strength $n -o ${output_dir}/cli/strength_$n.nii
      done
    validate:
      - output_exists: ${output_dir}/cli/strength_2.nii
      - output_exists: ${output_dir}/cli/strength_4.nii
      - output_exists: ${output_dir}/cli/strength_6.nii

  - name: CLI writesteps
    description: --writesteps saves the intermediate volumes
    command: |
      D=$(cat ${output_dir}/datadir)
      mkdir -p ${output_dir}/cli/steps
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" \
        --writesteps ${output_dir}/cli/steps -o ${output_dir}/cli/ws.nii
    validate:
      - output_exists: ${output_dir}/cli/ws.nii
      - output_exists: ${output_dir}/cli/steps/combined_mag.nii
      - output_exists: ${output_dir}/cli/steps/combinedphase.nii
      - output_exists: ${output_dir}/cli/steps/filteredphase.nii
      - output_exists: ${output_dir}/cli/steps/unwrappedphase.nii
      - output_exists: ${output_dir}/cli/steps/sensitivity.nii
      - output_exists: ${output_dir}/cli/steps/swimag.nii
      - output_exists: ${output_dir}/cli/steps/swiphase.nii

  # --qsm dispatches into QuantitativeSusceptibilityMappingTGV through a package
  # extension. It only works because the launcher loads that package; without it
  # the run dies with "no method matching copy(::Nothing)".
  - name: CLI QSM phase weighting
    description: --qsm runs TGV QSM and uses it for phase weighting
    command: |
      D=$(cat ${output_dir}/datadir)
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" --qsm -o ${output_dir}/cli/qsm.nii
    validate:
      - output_exists: ${output_dir}/cli/qsm.nii

  - name: CLI QSM with custom mask
    description: --qsm-mask accepts a caller supplied mask
    command: |
      D=$(cat ${output_dir}/datadir)
      julia --startup-file=no -e '
      using CLEARSWI
      D = CLEARSWI.dir("test","data","small")
      mag = readmag(joinpath(D,"Mag.nii"))
      mask = mag[:,:,:,1] .> 0.1 * maximum(mag[:,:,:,1])
      savenii(UInt8.(mask), "${output_dir}/cli/mask.nii"; header=mag.header)
      '
      clearswi -m "$D/Mag.nii" -p "$D/Phase.nii" -t "[4,8,12]" --qsm \
        --qsm-mask ${output_dir}/cli/mask.nii -o ${output_dir}/cli/qsm_masked.nii
    validate:
      - output_exists: ${output_dir}/cli/mask.nii
      - output_exists: ${output_dir}/cli/qsm_masked.nii

cleanup:
  script: |
    #!/usr/bin/env bash
    # Optionally remove test outputs
    # rm -rf test_output/clearswi
    echo "CLEARSWI test outputs preserved in test_output/clearswi/"
