# CLEARSWI container test suite
# Tests for CLEARSWI 1.6.1 - Susceptibility Weighted Imaging (CLEAR-SWI)
#
# CLEARSWI is a Julia package for generating Susceptibility Weighted Images (SWI)
# with improved vein and iron contrast. It provides multi-echo SWI, intensity
# correction, contrast enhancement, and improved phase processing.
#
# Reference: https://doi.org/10.1016/j.neuroimage.2021.118175
# Source: https://github.com/korbinian90/CLEARSWI.jl
#
# The container uses Julia 1.12.6 with the CLEARSWI package and its dependencies,
# and exposes both the `clearswi` command line program and the `julia` interpreter.
# Test data ships inside the package under test/data/small (it was test/testData
# up to the version this container previously pinned) and is located via
# CLEARSWI.dir(...) rather than a hardcoded depot path, because the package hash
# changes on every rebuild:
#   - Mag.nii: 40x40x20x3 multi-echo magnitude (3 echoes)
#   - Phase.nii: 40x40x20x3 multi-echo phase (3 echoes)

name: clearswi
version: 1.6.1

test_data:
  output_dir: test_output

setup:
  script: |
    #!/usr/bin/env bash
    set -e
    mkdir -p ${output_dir}
    mkdir -p ${output_dir}/steps
    mkdir -p ${output_dir}/options
    mkdir -p ${output_dir}/cli
    # Resolve the packaged test data once. The depot path contains a package
    # hash that changes on every rebuild, so it cannot be hardcoded, and asking
    # Julia for it costs a full interpreter start that the CLI tests should not
    # each pay for.
    julia --startup-file=no -e 'using CLEARSWI; print(CLEARSWI.dir("test","data","small"))' \
      > ${output_dir}/datadir

tests:
  # ==========================================================================
  # BASIC FUNCTIONALITY
  # ==========================================================================
  - name: clearswi launcher available
    description: Verify the clearswi command line program is on PATH via DEPLOY_PATH
    command: command -v clearswi
    expected_output_contains: "clearswi"

  - name: clearswi usage without arguments
    description: Verify the CLI entrypoint runs and reports its arguments
    command: clearswi
    expected_output_contains:
      - "usage: clearswi"
      - "--magnitude"
      - "--phase"
      - "--echo-times"

  - name: clearswi help flags
    description: Verify both -h and --help produce the usage text
    command: |
      clearswi -h
      clearswi --help
    expected_output_contains:
      - "usage: clearswi"
      - "--unwrapping-algorithm"
      - "--phase-scaling-type"

  # The CLI reports "Unspecified version" rather than the package version, so
  # this asserts only that the flag is accepted and exits cleanly.
  - name: clearswi version flag
    description: Verify --version is accepted
    command: clearswi --version && echo "version flag ok"
    expected_output_contains: "version flag ok"

  - name: Julia version check
    description: Verify Julia is available and reports correct version
    command: julia --version
    expected_output_contains: "julia version 1.12"

  - name: CLEARSWI package loads
    description: Verify CLEARSWI package can be loaded
    command: julia -e 'using CLEARSWI; println("CLEARSWI loaded successfully")'
    expected_output_contains: "CLEARSWI loaded successfully"

  - name: CLEARSWI exports available
    description: Verify all expected exports are available
    command: julia -e 'using CLEARSWI; println(names(CLEARSWI))'
    expected_output_contains:
      - "calculateSWI"
      - "createMIP"
      - "readmag"
      - "readphase"
      - "savenii"
      - "Data"
      - "Options"

  - name: Test data exists
    description: Verify built-in test data is accessible
    command: julia -e 'using CLEARSWI; println(isfile(CLEARSWI.dir("test","data","small","Mag.nii")))'
    expected_output_contains: "true"

  # ==========================================================================
  # DATA LOADING
  # ==========================================================================
  - name: Read magnitude image
    description: Test readmag function for loading NIfTI magnitude data
    command: |
      julia -e '
      using CLEARSWI
      mag = readmag(CLEARSWI.dir("test","data","small","Mag.nii"))
      println("Shape: ", size(mag))
      println("Type: ", typeof(mag))
      '
    expected_output_contains:
      - "Shape: (40, 40, 20, 3)"

  - name: Read phase image
    description: Test readphase function for loading NIfTI phase data
    command: |
      julia -e '
      using CLEARSWI
      phase = readphase(CLEARSWI.dir("test","data","small","Phase.nii"))
      println("Shape: ", size(phase))
      println("Range: ", extrema(phase))
      '
    expected_output_contains:
      - "Shape: (40, 40, 20, 3)"

  - name: Create Data struct
    description: Test Data struct creation with magnitude, phase, and TEs
    command: |
      julia -e '
      using CLEARSWI
      nifti_folder = CLEARSWI.dir("test","data","small")
      mag = readmag(joinpath(nifti_folder, "Mag.nii"))
      phase = readphase(joinpath(nifti_folder, "Phase.nii"))
      TEs = [4,8,12]
      data = Data(mag, phase, mag.header, TEs)
      println("Data created with ", length(data.TEs), " echoes")
      println("TEs: ", data.TEs)
      '
    expected_output_contains:
      - "Data created with 3 echoes"
      - "TEs: [4, 8, 12]"

  # ==========================================================================
  # BASIC SWI CALCULATION
  # ==========================================================================
  - name: Calculate SWI with defaults
    description: Test basic SWI calculation with default options
    command: |
      julia -e '
      using CLEARSWI
      nifti_folder = CLEARSWI.dir("test","data","small")
      mag = readmag(joinpath(nifti_folder, "Mag.nii"))
      phase = readphase(joinpath(nifti_folder, "Phase.nii"))
      data = Data(mag, phase, mag.header, [4,8,12])
      swi = calculateSWI(data)
      println("SWI shape: ", size(swi))
      println("SWI min: ", minimum(swi))
      println("SWI computed successfully")
      '
    expected_output_contains:
      - "SWI shape: (40, 40, 20)"
      - "SWI computed successfully"

  - name: Calculate and save SWI
    description: Test full SWI pipeline with output saving
    command: |
      julia -e '
      using CLEARSWI
      nifti_folder = CLEARSWI.dir("test","data","small")
      mag = readmag(joinpath(nifti_folder, "Mag.nii"))
      phase = readphase(joinpath(nifti_folder, "Phase.nii"))
      data = Data(mag, phase, mag.header, [4,8,12])
      swi = calculateSWI(data)
      savenii(swi, "${output_dir}/swi_default.nii"; header=mag.header)
      println("SWI saved successfully")
      '
    validate:
      - output_exists: ${output_dir}/swi_default.nii

  # ==========================================================================
  # MINIMUM INTENSITY PROJECTION (MIP)
  # ==========================================================================
  - name: Create MIP default
    description: Test createMIP with default depth (d=7)
