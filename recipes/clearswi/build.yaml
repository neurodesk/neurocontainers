name: clearswi
version: 1.6.1

copyright:
  - license: MIT
    url: https://github.com/korbinian90/CLEARSWI.jl/blob/master/LICENSE

architectures:
  - x86_64

variables:
  julia_version: 1.12.6
  julia_series: "1.12"
  julia_root: /opt/julia-1.12.6

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive

    - install:
        - ca-certificates

    - workdir: /opt

    - run:
        - tar -xzf {{ get_file("julia_linux_x86_64_tar_gz") }} -C /opt

    # Julia and the CLEARSWI launcher have to be on PATH inside the container:
    # Transparent Singularity resolves DEPLOY_BINS/DEPLOY_PATH entries through
    # the container PATH when it generates the module wrapper scripts.
    - environment:
        PATH: "{{ context.julia_root }}/bin:/opt/clearswi/bin:$PATH"
        JULIA_DEPOT_PATH: /opt/julia_depot

    - copy:
        - install_packages.jl
        - /opt/install_packages.jl

    - run:
        - julia /opt/install_packages.jl

    # The Julia entry script is named "clearswi" (no extension) because ArgParse
    # derives the program name in its usage output from basename(PROGRAM_FILE);
    # naming it clearswi_main.jl makes the help text advertise the wrong command.
    - copy:
        - clearswi_main
        - /opt/clearswi/libexec/clearswi

    - copy:
        - clearswi
        - /opt/clearswi/bin/clearswi

    # The home directory is not available at container runtime and the image is
    # mounted read-only, so the depot has to be world-readable and fully
    # precompiled at build time.
    - run:
        - chmod a+rx /opt/clearswi/bin/clearswi
        - chmod -R a+rX /opt/julia_depot /opt/clearswi

deploy:
  path:
    - /opt/clearswi/bin
  bins:
    - julia

files:
  - name: julia_linux_x86_64_tar_gz
    url: https://julialang-s3.julialang.org/bin/linux/x64/{{ context.julia_series }}/julia-{{ context.julia_version }}-linux-x86_64.tar.gz

  - name: install_packages.jl
    contents: |
      using Pkg
      # ArgParse is a dependency of CLEARSWI, but the launcher loads it by name,
      # so it also has to be a direct dependency of this environment.
      Pkg.add([
          PackageSpec(name="CLEARSWI", version="{{ context.version }}"),
          PackageSpec(name="ArgParse"),
      ])
      Pkg.precompile()
      # Warm the cache for the launcher's exact load sequence.
      using CLEARSWI, ArgParse

  - name: clearswi_main
    contents: |
      using CLEARSWI, ArgParse
      msg = clearswi_main(ARGS)
      if msg !== nothing
          println(msg)
      end

  - name: clearswi
    contents: |
      #!/usr/bin/env bash
      exec julia --startup-file=no /opt/clearswi/libexec/clearswi "$@"

categories:
  - phase processing
  - structural imaging

structured_readme:
  description: |-
    Published as CLEAR-SWI. It provides magnetic resonance images with improved vein and iron contrast by weighting a combined magnitude image with a preprocessed phase image.

    The container exposes both the `clearswi` command line program and the `julia` interpreter with the CLEARSWI package preinstalled.
  example: |-
    Command line:

    clearswi -m Mag.nii -p Phase.nii -t [4,8,12] -o output_dir

    Julia:

    julia -e '
    using CLEARSWI

    TEs = [4,8,12]
    nifti_folder = CLEARSWI.dir("test","testData","small")
    magfile = joinpath(nifti_folder, "Mag.nii")
    phasefile = joinpath(nifti_folder, "Phase.nii")

    mag = readmag(magfile);
    phase = readphase(phasefile);
    data = Data(mag, phase, mag.header, TEs);

    swi = calculateSWI(data);
    mip = createMIP(swi);

    savenii(swi, "<outputpath>/swi.nii"; header=mag.header)
    savenii(mip, "<outputpath>/mip.nii"; header=mag.header)
    '
  documentation: https://github.com/korbinian90/CLEARSWI.jl
  citation: "Eckstein, K., Bachrata, B., Hangel, G., Widhalm, G., Enzinger, C., Barth, M., Trattnig, S., Robinson, S.D., 2021. Improved susceptibility weighted imaging at ultra-high field using bipolar multi-echo acquisition and optimized image processing: CLEAR-SWI. NeuroImage 237, 118175. https://doi.org/10.1016/j.neuroimage.2021.118175"

icon: data:image/png;base64,
