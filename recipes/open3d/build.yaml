name: open3d
version: 0.20.0

description: Open-source 3D point-cloud and mesh processing library for 3D total-body photography (3D-TBP) surface registration, reconstruction, and wound morphometry.

copyright:
  - license: MIT
    name: Open3D license
    url: https://github.com/isl-org/Open3D/blob/v{{ context.upstream_version }}/LICENSE
  - license: Apache-2.0
    name: oneTBB license (x86_64 v2021.5.0 / aarch64 v2021.12.0)
    url: https://github.com/uxlfoundation/oneTBB/blob/v2021.12.0/LICENSE.txt
  - license: BSD-3-Clause
    name: Intel ITT (bundled in oneTBB v2021.5.0 on x86_64)
    url: https://github.com/uxlfoundation/oneTBB/blob/v2021.5.0/third-party-programs.txt
  - license: BSD-3-Clause
    name: Intel ITT (bundled in oneTBB v2021.12.0 on aarch64)
    url: https://github.com/uxlfoundation/oneTBB/blob/v2021.12.0/third-party-programs.txt

architectures:
  - x86_64
  - aarch64

variables:
  upstream_version: "0.20.0"
  open3d_package:
    try:
      - value: "open3d-cpu"
        condition: arch=="x86_64"
      - value: "open3d"
        condition: arch=="aarch64"
  onetbb_version:
    try:
      - value: "2021.5.0"
        condition: arch=="x86_64"
      - value: "2021.12.0"
        condition: arch=="aarch64"

auto_update:
  method: sources
  container_version: open3d
  sources:
    - id: open3d
      method: pypi
      package: open3d
      target:
        variable: upstream_version
        fulltest_variable: upstream_version

build:
  kind: neurodocker

  base-image: ubuntu:26.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        MPLBACKEND: Agg
        PIP_NO_CACHE_DIR: "1"
        PATH: /opt/open3d/wrappers:/opt/open3d/bin:$PATH

    - install:
        - ca-certificates
        - libegl1
        - libgl1
        - libgomp1
        - libusb-1.0-0
        - libx11-6
        - patchelf
        - python3
        - python3-configargparse
        - python3-flask
        - python3-nbformat
        - python3-numpy
        - python3-pip
        - python3-venv
        - python3-werkzeug
        - python3-zmq

    - run:
        # Inherit Ubuntu 26.04 system numpy/zmq/flask/werkzeug/nbformat/ipywidgets so no
        # PyPI bundled GNU/ZeroMQ runtime libraries ship; install CPU-only Open3D wheel.
        - python3 -m venv --system-site-packages /opt/open3d
        - /opt/open3d/bin/python -m pip install --no-cache-dir "{{ context.open3d_package }}=={{ context.upstream_version }}"
        - /opt/open3d/bin/python -m pip check
        # Relink any bundled libgomp in Open3D wheels against Ubuntu's system libgomp1.
        - >-
          for f in $(find /opt/open3d/lib/python*/site-packages/open3d /opt/open3d/lib/python*/site-packages/open3d*.libs -name '*.so*' 2>/dev/null); do
          for need in $(patchelf --print-needed "$f" 2>/dev/null | grep '^libgomp-' || true); do
          patchelf --replace-needed "$need" libgomp.so.1 "$f";
          done;
          done
          && find /opt/open3d/lib/python*/site-packages -name 'libgomp*.so*' -delete
        - /opt/open3d/bin/python {{ get_file("install_runtime_hook") }}
        - >-
          /opt/open3d/bin/python -c "import importlib.metadata as md, pathlib, numpy, open3d, zmq;
          assert numpy.__file__.startswith('/usr/lib/python3/dist-packages/'), numpy.__file__;
          assert zmq.__file__.startswith('/usr/lib/python3/dist-packages/'), zmq.__file__;
          bad_libs = [str(p) for p in pathlib.Path('/opt/open3d').rglob('*.so*') if p.name.startswith(('libquadmath', 'libgfortran', 'libgomp', 'libzmq'))];
          assert not bad_libs, bad_libs;
          bad_pkgs = [d.metadata['Name'] for d in md.distributions() if d.metadata['Name'].lower().startswith(('nvidia-', 'cuda-'))];
          assert not bad_pkgs, bad_pkgs;
          assert open3d.__version__ == '{{ context.upstream_version }}', open3d.__version__"
        - mkdir -p /opt/open3d/wrappers /opt/open3d/share/licenses
        - install -m 0755 {{ get_file("open3d_wrapper") }} /opt/open3d/wrappers/open3d
        - install -m 0644 {{ get_file("open3d_license") }} /opt/open3d/share/licenses/OPEN3D-LICENSE.txt
        - install -m 0644 {{ get_file("onetbb_license") }} /opt/open3d/share/licenses/ONETBB-LICENSE.txt
        - install -m 0644 {{ get_file("onetbb_third_party_programs") }} /opt/open3d/share/licenses/ONETBB-THIRD-PARTY-PROGRAMS.txt
        - printf '%s\n' '#!/usr/bin/env bash' 'set -e' 'if [ -z "${USER:-}" ]; then export USER="$(whoami 2>/dev/null || echo "uid$(id -u)")"; fi' 'if [ -n "${1:-}" ]; then exec "$@"; else exec /usr/bin/env bash; fi' > /neurodocker/startup.sh && chmod 0755 /neurodocker/startup.sh
        - chmod -R a+rX /opt/open3d
        - rm -rf /root/.cache/pip

files:
  - name: open3d_license
    url: https://raw.githubusercontent.com/isl-org/Open3D/v{{ context.upstream_version }}/LICENSE
  - name: onetbb_license
    url: https://raw.githubusercontent.com/uxlfoundation/oneTBB/v{{ context.onetbb_version }}/LICENSE.txt
  - name: onetbb_third_party_programs
    url: https://raw.githubusercontent.com/uxlfoundation/oneTBB/v{{ context.onetbb_version }}/third-party-programs.txt
  - name: install_runtime_hook
    contents: |
      from __future__ import annotations

      import pathlib
      import textwrap

      matches = sorted(pathlib.Path("/opt/open3d/lib").glob("python*/site-packages"))
      assert len(matches) == 1, matches
      site_packages = matches[0]
      (site_packages / "_open3d_runtime.py").write_text(
          textwrap.dedent(
              '''\
              """Container runtime defaults for Open3D caches, PID 1 signals, and unlisted UIDs."""

              from __future__ import annotations

              import atexit
              import errno
              import getpass
              import os
              import shutil
              import signal
              import tempfile
              from pathlib import Path

              _CACHE_ROOT: Path | None = None
              _CACHE_OWNER_PID: int | None = None
              _CLEANUP_REGISTERED = False


              def is_writable_dir(path_str: str | None) -> bool:
                  if not path_str:
                      return False
                  blocked = {signal.SIGINT, signal.SIGTERM, signal.SIGHUP}
                  prev_mask = signal.pthread_sigmask(signal.SIG_BLOCK, blocked)
                  try:
                      os.makedirs(path_str, exist_ok=True)
                      if hasattr(os, "O_TMPFILE"):
                          try:
                              fd = os.open(path_str, os.O_TMPFILE | os.O_RDWR, 0o600)
                              os.close(fd)
                              return True
                          except OSError as exc:
                              if exc.errno not in (errno.EOPNOTSUPP, errno.EISDIR, errno.EINVAL, errno.ENOSYS):
                                  return False
                      fd, probe = tempfile.mkstemp(prefix=".open3d-write-check-", dir=path_str)
                      try:
                          os.close(fd)
                      finally:
                          os.unlink(probe)
                      return True
                  except OSError:
                      return False
                  finally:
                      signal.pthread_sigmask(signal.SIG_SETMASK, prev_mask)


              def _cleanup_cache() -> None:
                  if _CACHE_ROOT is not None and _CACHE_OWNER_PID == os.getpid():
                      shutil.rmtree(_CACHE_ROOT, ignore_errors=True)


              def _signal_cleanup(signum: int, _frame: object) -> None:
                  _cleanup_cache()
                  if os.getpid() == 1:
                      os._exit(128 + signum)
                  signal.signal(signum, signal.SIG_DFL)
                  os.kill(os.getpid(), signum)


              def _install_signal_handlers() -> None:
                  try:
                      for sig in (signal.SIGTERM, signal.SIGHUP):
                          if signal.getsignal(sig) == signal.SIG_DFL:
                              signal.signal(sig, _signal_cleanup)
                  except ValueError:
                      pass


              def _private_subdir(sub: str) -> Path:
                  global _CACHE_ROOT, _CACHE_OWNER_PID, _CLEANUP_REGISTERED
                  if _CACHE_ROOT is None or _CACHE_OWNER_PID != os.getpid():
                      blocked = {signal.SIGINT, signal.SIGTERM, signal.SIGHUP}
                      prev_mask = signal.pthread_sigmask(signal.SIG_BLOCK, blocked)
                      try:
                          _CACHE_ROOT = Path(tempfile.mkdtemp(prefix="open3d-cache."))
                          _CACHE_OWNER_PID = os.getpid()
                          if not _CLEANUP_REGISTERED:
                              atexit.register(_cleanup_cache)
                              _CLEANUP_REGISTERED = True
                          _install_signal_handlers()
                      finally:
                          signal.pthread_sigmask(signal.SIG_SETMASK, prev_mask)
                  subdir = _CACHE_ROOT / sub
                  subdir.mkdir(mode=0o700, exist_ok=True)
                  return subdir


              def ensure_runtime_env() -> None:
                  try:
                      getpass.getuser()
                  except Exception:
                      os.environ["USER"] = f"uid{os.getuid()}"

                  for key, sub in (
                      ("MPLCONFIGDIR", "mpl"),
                      ("XDG_CACHE_HOME", "cache"),
                      ("XDG_CONFIG_HOME", "config"),
                      ("OPEN3D_DATA_ROOT", "data"),
                  ):
                      if not is_writable_dir(os.environ.get(key)):
                          os.environ[key] = str(_private_subdir(sub))

                  if not os.environ.get("HOME"):
                      os.environ["HOME"] = str(_private_subdir("home"))

                  if os.getpid() == 1:
                      _install_signal_handlers()


              ensure_runtime_env()
              '''
          ),
          encoding="utf-8",
      )
      (site_packages / "_open3d_runtime.pth").write_text(
          "import _open3d_runtime\n",
          encoding="utf-8",
      )
  - name: open3d_wrapper
    executable: true
    contents: |
      #!/usr/bin/python3
      """Run Open3D CLI with private non-/home cache paths and POSIX job control."""

      from __future__ import annotations

      import errno
      import getpass
      import os
      import shutil
      import signal
      import subprocess
      import sys
      import tempfile


      ENV_SUBDIRS = (
          ("MPLCONFIGDIR", "mpl"),
          ("XDG_CACHE_HOME", "cache"),
          ("XDG_CONFIG_HOME", "config"),
          ("OPEN3D_DATA_ROOT", "data"),
      )


      def _is_writable_dir(path_str: str | None) -> bool:
          if not path_str:
              return False
          blocked = {signal.SIGINT, signal.SIGTERM, signal.SIGHUP}
          prev_mask = signal.pthread_sigmask(signal.SIG_BLOCK, blocked)
          try:
              os.makedirs(path_str, exist_ok=True)
              if hasattr(os, "O_TMPFILE"):
                  try:
                      fd = os.open(path_str, os.O_TMPFILE | os.O_RDWR, 0o600)
                      os.close(fd)
                      return True
                  except OSError as exc:
                      if exc.errno not in (errno.EOPNOTSUPP, errno.EISDIR, errno.EINVAL, errno.ENOSYS):
                          return False
              fd, probe = tempfile.mkstemp(prefix=".open3d-write-check-", dir=path_str)
              try:
                  os.close(fd)
              finally:
                  os.unlink(probe)
              return True
          except OSError:
              return False
          finally:
              signal.pthread_sigmask(signal.SIG_SETMASK, prev_mask)


      def main() -> int:
          cmd = ["/opt/open3d/bin/open3d", *sys.argv[1:]]
          env = os.environ.copy()
          try:
              getpass.getuser()
          except Exception:
              env["USER"] = f"uid{os.getuid()}"

          tmp_root: str | None = None
          proc: subprocess.Popen[bytes] | None = None
          received_signal: int | None = None
          pending_signal: int | None = None
          pending_tstp = False
          tty_fd: int | None = None
          orig_pgrp: int | None = None
          handed_tty = False

          def set_tty_pgrp(pgrp: int) -> bool:
              if tty_fd is None:
                  return False
              prev = signal.signal(signal.SIGTTOU, signal.SIG_IGN)
              try:
                  os.tcsetpgrp(tty_fd, pgrp)
                  return True
              except OSError:
                  return False
              finally:
                  signal.signal(signal.SIGTTOU, prev)

          def owns_tty() -> bool:
              if tty_fd is None or orig_pgrp is None:
                  return False
              try:
                  return os.tcgetpgrp(tty_fd) == orig_pgrp
              except OSError:
                  return False

          def child_owns_tty() -> bool:
              if tty_fd is None or proc is None:
                  return False
              try:
                  return os.tcgetpgrp(tty_fd) == proc.pid
              except OSError:
                  return False

          def hand_tty_to_child() -> None:
              nonlocal handed_tty
              if proc is None or tty_fd is None or not owns_tty():
                  return
              if set_tty_pgrp(proc.pid):
                  handed_tty = True

          def reclaim_tty() -> None:
              nonlocal handed_tty
              if handed_tty and tty_fd is not None and orig_pgrp is not None:
                  if child_owns_tty():
                      set_tty_pgrp(orig_pgrp)
                  handed_tty = False

          def forward(signum: int) -> None:
              if proc is not None and proc.returncode is None:
                  try:
                      os.killpg(proc.pid, signum)
                      if signum in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP):
                          os.killpg(proc.pid, signal.SIGCONT)
                  except ProcessLookupError:
                      pass

          def handle_signal(signum: int, _frame: object) -> None:
              nonlocal received_signal, pending_signal
              received_signal = signum
              if proc is None:
                  pending_signal = signum
              else:
                  forward(signum)

          def handle_cont(_signum: int, _frame: object) -> None:
              if proc is not None and proc.returncode is None and received_signal is None:
                  hand_tty_to_child()

          def handle_tstp(_signum: int, _frame: object) -> None:
              nonlocal pending_tstp
              if proc is None:
                  pending_tstp = True
              elif proc.returncode is None:
                  try:
                      os.killpg(proc.pid, signal.SIGTSTP)
                  except ProcessLookupError:
                      pass

          def stop_self(stop_sig: int) -> None:
              prev_tstp = signal.signal(signal.SIGTSTP, signal.SIG_DFL)
              try:
                  os.kill(os.getpid(), stop_sig)
              finally:
                  signal.signal(signal.SIGTSTP, prev_tstp)

          try:
              signal.signal(signal.SIGINT, handle_signal)
              signal.signal(signal.SIGTERM, handle_signal)
              signal.signal(signal.SIGHUP, handle_signal)
              signal.signal(signal.SIGCONT, handle_cont)
              signal.signal(signal.SIGTSTP, handle_tstp)
              if received_signal is not None:
                  return 128 + received_signal

              missing = [item for item in ENV_SUBDIRS if not _is_writable_dir(env.get(item[0]))]
              if not env.get("HOME"):
                  missing.append(("HOME", "home"))
              if received_signal is not None:
                  return 128 + received_signal
              if not missing:
                  os.execve(cmd[0], cmd, env)

              tmp_root = tempfile.mkdtemp(prefix="open3d.")
              for key, subdir in missing:
                  path = os.path.join(tmp_root, subdir)
                  os.mkdir(path, 0o700)
                  env[key] = path
              if received_signal is not None:
                  return 128 + received_signal

              try:
                  tty_fd = os.open("/dev/tty", os.O_RDWR | os.O_NOCTTY | os.O_CLOEXEC)
                  os.tcgetpgrp(tty_fd)
                  orig_pgrp = os.getpgrp()
              except OSError:
                  if tty_fd is not None:
                      try:
                          os.close(tty_fd)
                      except OSError:
                          pass
                  tty_fd = None

              proc = subprocess.Popen(cmd, env=env, process_group=0)
              if received_signal is None and owns_tty():
                  hand_tty_to_child()
                  if handed_tty:
                      try:
                          os.killpg(proc.pid, signal.SIGCONT)
                      except ProcessLookupError:
                          pass

              sig_to_replay, pending_signal = pending_signal, None
              if sig_to_replay is not None:
                  forward(sig_to_replay)
              elif pending_tstp:
                  pending_tstp = False
                  try:
                      os.killpg(proc.pid, signal.SIGTSTP)
                  except ProcessLookupError:
                      pass

              rc = 0
              while True:
                  try:
                      _, status = os.waitpid(proc.pid, os.WUNTRACED)
                  except InterruptedError:
                      continue
                  except ChildProcessError:
                      break
                  if os.WIFSTOPPED(status):
                      stop_sig = os.WSTOPSIG(status)
                      if received_signal is not None:
                          try:
                              os.killpg(proc.pid, signal.SIGCONT)
                          except ProcessLookupError:
                              pass
                          continue
                      if stop_sig in (signal.SIGTTIN, signal.SIGTTOU) and (
                          owns_tty() or child_owns_tty()
                      ):
                          hand_tty_to_child()
                          try:
                              os.killpg(proc.pid, signal.SIGCONT)
                          except ProcessLookupError:
                              pass
                          continue
                      reclaim_tty()
                      stop_self(stop_sig)
                      if received_signal is not None:
                          try:
                              os.killpg(proc.pid, signal.SIGCONT)
                          except ProcessLookupError:
                              pass
                          continue
                      hand_tty_to_child()
                      try:
                          os.killpg(proc.pid, signal.SIGCONT)
                      except ProcessLookupError:
                          pass
                      continue
                  if os.WIFSIGNALED(status):
                      rc = -os.WTERMSIG(status)
                  elif os.WIFEXITED(status):
                      rc = os.WEXITSTATUS(status)
                  else:
                      continue
                  proc.returncode = rc
                  break
              if received_signal is not None:
                  return 128 + received_signal
              return 128 - rc if rc < 0 else rc
          finally:
              reclaim_tty()
              if tty_fd is not None:
                  try:
                      os.close(tty_fd)
                  except OSError:
                      pass
              if tmp_root is not None:
                  shutil.rmtree(tmp_root, ignore_errors=True)


      if __name__ == "__main__":
          raise SystemExit(main())

deploy:
  bins:
    - open3d

domains:
  - microscopy

categories:
  - "image reconstruction"
  - "shape analysis"
  - "visualization"
  - "body"

readme: |-
  ----------------------------------
  ## open3d/{{ context.version }} ##

  Open3D is an open-source 3D data processing library (CPU build) for point-cloud
  and triangle-mesh registration (ICP, FPFH), surface reconstruction, normal
  estimation, and morphometric measurement in 3D total-body photography (3D-TBP)
  and wound/scar imaging.

  ### Included CLI & Python Environment
  ```
  open3d                  Open3D command-line tool
  /opt/open3d/bin/python  Python environment with open3d {{ context.upstream_version }}
  ```

  ### Example
  ```
  ml open3d/{{ context.version }}
  open3d --version
  /opt/open3d/bin/python -c "import open3d as o3d; print(o3d.__version__)"
  ```

  Documentation: https://www.open3d.org/docs/release/
  License texts (`OPEN3D-LICENSE.txt`, `ONETBB-LICENSE.txt`,
  `ONETBB-THIRD-PARTY-PROGRAMS.txt`) are installed under
  `/opt/open3d/share/licenses/`.
  ----------------------------------

