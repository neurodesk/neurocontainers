name: open3d
version: 0.20.0
upstream_version: "0.20.0"

tests:
  - name: open3d wrapper available on PATH
    description: Verify the deployed open3d wrapper resolves on PATH.
    command: command -v open3d
    expected_output_contains: "/opt/open3d/wrappers/open3d"

  - name: package version matches recipe, system APT libs used, and zero bundled GNU/MPL/CUDA libs
    description: Verify open3d matches upstream_version, pip check passes, numpy and zmq come from Ubuntu APT, and zero bundled libquadmath/libgfortran/libgomp/libzmq or NVIDIA CUDA packages exist.
    command: |
      set -e
      /opt/open3d/bin/python -m pip check
      /opt/open3d/bin/python - <<'PY'
      import importlib.metadata as md
      import pathlib
      import numpy
      import open3d
      import zmq

      assert open3d.__version__ == "${upstream_version}", open3d.__version__
      assert numpy.__file__.startswith("/usr/lib/python3/dist-packages/"), numpy.__file__
      assert zmq.__file__.startswith("/usr/lib/python3/dist-packages/"), zmq.__file__
      bad_libs = [
          str(p)
          for p in pathlib.Path("/opt/open3d").rglob("*.so*")
          if p.name.startswith(("libquadmath", "libgfortran", "libgomp", "libzmq"))
      ]
      assert not bad_libs, bad_libs
      bad_pkgs = [
          d.metadata["Name"]
          for d in md.distributions()
          if d.metadata["Name"].lower().startswith(("nvidia-", "cuda-"))
      ]
      assert not bad_pkgs, bad_pkgs
      print(f"open3d={open3d.__version__} numpy={numpy.__version__}")
      PY
    expected_output_contains: "open3d=${upstream_version}"

  - name: license notices installed
    description: Verify Open3D MIT, bundled oneTBB Apache-2.0, and arch-matched oneTBB third-party (Intel ITT) notices are installed.
    command: |
      set -e
      test -s /opt/open3d/share/licenses/OPEN3D-LICENSE.txt
      grep -q "MIT License" /opt/open3d/share/licenses/OPEN3D-LICENSE.txt
      test -s /opt/open3d/share/licenses/ONETBB-LICENSE.txt
      grep -q "Apache License" /opt/open3d/share/licenses/ONETBB-LICENSE.txt
      test -s /opt/open3d/share/licenses/ONETBB-THIRD-PARTY-PROGRAMS.txt
      /opt/open3d/bin/python - <<'PY'
      import pathlib
      import platform

      arch = platform.machine()
      expected_year = {"x86_64": "2019", "aarch64": "2022"}[arch]
      text = pathlib.Path("/opt/open3d/share/licenses/ONETBB-THIRD-PARTY-PROGRAMS.txt").read_text(encoding="latin-1")
      header = "1.  Intel(R) Instrumentation and Tracing Technology (ITT)"
      idx = text.find(header)
      assert idx != -1, "Missing Intel ITT section"
      itt_section = text[idx:idx + 400]
      expected_line = f"Copyright (c) {expected_year} Intel Corporation. All rights reserved."
      assert expected_line in itt_section, (arch, expected_line, itt_section[:200])
      PY
      echo "license ok"
    expected_output_contains: "license ok"

  - name: wrapper isolates process-group signals, cleans up on SIGHUP, and preserves piped and PTY stdin
    description: Verify the installed open3d wrapper handles SIGINT/SIGHUP cleanup, noexec /tmp, and foreground PTY stdin cleanly.
    command: |
      set -e
      /usr/bin/python3 - <<'PY'
      import fcntl, os, pty, select, signal, subprocess, sys, tempfile, termios, time

      src = open("/opt/open3d/wrappers/open3d").read()
      py = sys.executable

      def make_wrapper(path, stub_path):
          patched = src.replace(
              'cmd = ["/opt/open3d/bin/open3d", *sys.argv[1:]]',
              f'cmd = [{py!r}, {stub_path!r}, *sys.argv[1:]]',
          )
          assert patched != src
          open(path, "w").write(patched)

      def run_in_pty(argv, env, on_ready=None, send_bytes=None):
          master, slave = pty.openpty()
          def preexec():
              os.setsid()
              fcntl.ioctl(slave, termios.TIOCSCTTY, 0)
          p = subprocess.Popen(argv, env=env, stdin=slave, stdout=slave, stderr=slave, preexec_fn=preexec, close_fds=True)
          os.close(slave)
          if on_ready:
              on_ready()
          if send_bytes:
              os.write(master, send_bytes)
          out = bytearray()
          deadline = time.time() + 6.0
          while time.time() < deadline:
              r, _, _ = select.select([master], [], [], 0.1)
              if r:
                  try:
                      chunk = os.read(master, 4096)
                      if not chunk:
                          break
                      out += chunk
                  except OSError:
                      break
              if p.poll() is not None and not r:
                  break
          rc = p.wait(timeout=5)
          os.close(master)
          return rc, out.decode("utf-8", "replace")

      with tempfile.TemporaryDirectory() as td:
          stub = os.path.join(td, "stub.py")
          open(stub, "w").write(
              "import os, signal, sys, time\n"
              "if sys.argv[1] == 'stdin':\n"
              "    print('GOT:' + sys.stdin.readline().strip(), flush=True)\n"
              "    raise SystemExit(0)\n"
              "log, ready = sys.argv[2], sys.argv[3]\n"
              "seen = []\n"
              "def h(sig, _):\n"
              "    seen.append(sig)\n"
              "    open(log, 'a').write(f'{sig}\\n')\n"
              "signal.signal(signal.SIGINT, h)\n"
              "signal.signal(signal.SIGHUP, h)\n"
              "open(ready, 'w').write(os.environ.get('OPEN3D_DATA_ROOT', '') + '\\n')\n"
              "deadline = time.time() + 5.0\n"
              "while not seen and time.time() < deadline:\n"
              "    time.sleep(0.02)\n"
              "time.sleep(0.25)\n"
              "raise SystemExit(128 + seen[0] if seen else 0)\n"
          )
          wrapper = os.path.join(td, "wrapper.py")
          make_wrapper(wrapper, stub)

          env = os.environ.copy()
          for k in ("MPLCONFIGDIR", "XDG_CACHE_HOME", "XDG_CONFIG_HOME", "OPEN3D_DATA_ROOT"):
              env.pop(k, None)

          r = subprocess.run([py, wrapper, "stdin"], input="open3d-pipe\n", capture_output=True, text=True, env=env, timeout=10)
          assert r.returncode == 0 and r.stdout.strip() == "GOT:open3d-pipe", (r.returncode, r.stdout, r.stderr)

          rc, out = run_in_pty([py, wrapper, "stdin"], env=env, send_bytes=b"open3d-pty\n")
          assert rc == 0 and "GOT:open3d-pty" in out, (rc, out)

          log_hup, ready_hup = os.path.join(td, "hup.log"), os.path.join(td, "hup.ready")
          p_hup = subprocess.Popen([py, wrapper, "sig", log_hup, ready_hup], env=env, start_new_session=True)
          dl = time.time() + 5.0
          while not os.path.exists(ready_hup) and time.time() < dl:
              time.sleep(0.02)
          assert os.path.exists(ready_hup), "hup stub did not become ready"
          scratch_dir = open(ready_hup).read().strip()
          assert scratch_dir and os.path.isdir(scratch_dir), scratch_dir
          os.kill(p_hup.pid, signal.SIGHUP)
          rc_hup = p_hup.wait(timeout=10)
          sigs_hup = [int(x) for x in open(log_hup).read().splitlines() if x.strip()]
          assert rc_hup == 128 + signal.SIGHUP.value and sigs_hup == [signal.SIGHUP.value], (rc_hup, sigs_hup)
          assert not os.path.exists(os.path.dirname(scratch_dir)), scratch_dir

          stub_nohup = os.path.join(td, "stub_nohup.py")
          open(stub_nohup, "w").write(
              "import os, signal, sys, time\n"
              "ready, go = sys.argv[1], sys.argv[2]\n"
              "assert signal.getsignal(signal.SIGHUP) == signal.SIG_IGN, signal.getsignal(signal.SIGHUP)\n"
              "open(ready, 'w').write('ready\\n')\n"
              "dl = time.time() + 5.0\n"
              "while not os.path.exists(go) and time.time() < dl:\n"
              "    time.sleep(0.02)\n"
              "assert os.path.exists(go), 'go file not seen'\n"
          )
          wrapper_nohup = os.path.join(td, "wrapper_nohup.py")
          make_wrapper(wrapper_nohup, stub_nohup)
          ready_nh, go_nh = os.path.join(td, "nh.ready"), os.path.join(td, "nh.go")
          p_nh = subprocess.Popen(["nohup", py, wrapper_nohup, ready_nh, go_nh], env=env, start_new_session=True, stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          dl = time.time() + 5.0
          while not os.path.exists(ready_nh) and time.time() < dl:
              time.sleep(0.02)
          assert os.path.exists(ready_nh), f"nohup stub not ready: {p_nh.stderr.read().decode()}"
          os.killpg(p_nh.pid, signal.SIGHUP)
          time.sleep(0.1)
          open(go_nh, "w").write("go\n")
          rc_nh = p_nh.wait(timeout=10)
          err_nh = p_nh.stderr.read().decode()
          assert rc_nh == 0, (rc_nh, err_nh)
      print("wrapper signal and stdin ok")
      PY
    expected_output_contains: "wrapper signal and stdin ok"

  - name: offline 3D skin-lesion mesh, ICP registration, and PLY round-trip
    description: Synthesize a 3D skin/lesion dome mesh and rigidly displaced point cloud, run Open3D ICP registration and PLY I/O, and run open3d --version under unset/read-only HOME.
    command: |
      set -e
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      env -u HOME -u USER -u LOGNAME -u MPLCONFIGDIR -u XDG_CACHE_HOME -u XDG_CONFIG_HOME -u OPEN3D_DATA_ROOT \
        open3d --version | grep -q "${upstream_version}"
      HOME=/sys XDG_CACHE_HOME=/sys/unwritable-cache OPEN3D_DATA_ROOT=/sys/unwritable-data \
        /opt/open3d/bin/python - "$tmpdir" <<'PY'
      import os
      import sys
      import numpy as np
      import open3d as o3d

      td = sys.argv[1]
      # Synthesize a 3D dome skin-patch mesh with raised lesion bump
      mesh = o3d.geometry.TriangleMesh.create_sphere(radius=20.0, resolution=16)
      verts = np.asarray(mesh.vertices).copy()
      # Keep upper skin hemisphere and add Gaussian lesion elevation
      verts[:, 2] = np.abs(verts[:, 2]) + 2.5 * np.exp(-((verts[:, 0] ** 2 + verts[:, 1] ** 2) / 25.0))
      mesh.vertices = o3d.utility.Vector3dVector(verts)
      mesh.compute_vertex_normals()
      area = mesh.get_surface_area()
      assert area > 1000.0, area

      ply_path = os.path.join(td, "skin_lesion.ply")
      assert o3d.io.write_triangle_mesh(ply_path, mesh)
      reloaded = o3d.io.read_triangle_mesh(ply_path)
      assert len(reloaded.vertices) == len(mesh.vertices)

      # Point-to-point ICP recovery of a known small rigid translation
      target = reloaded.sample_points_uniformly(number_of_points=600)
      source = o3d.geometry.PointCloud(target)
      shift = np.array([1.2, -0.8, 0.5])
      source.translate(shift)
      reg = o3d.pipelines.registration.registration_icp(
          source,
          target,
          max_correspondence_distance=5.0,
          init=np.eye(4),
          estimation_method=o3d.pipelines.registration.TransformationEstimationPointToPoint(),
          criteria=o3d.pipelines.registration.ICPConvergenceCriteria(max_iteration=60),
      )
      assert reg.fitness > 0.95, reg.fitness
      recovered = reg.transformation[:3, 3]
      err = float(np.linalg.norm(recovered + shift))
      assert err < 0.25, (recovered, shift, err)
      print(f"open3d icp ok area={area:.1f} fitness={reg.fitness:.3f} err={err:.4f}")
      PY
    expected_output_contains: "open3d icp ok"

  - name: runtime hook preserves cache across fork and cleans up on SIGTERM/SIGHUP (including PID 1)
    description: Verify direct /opt/open3d/bin/python keeps parent cache across os.fork()+sys.exit(0), cleans up on SIGTERM/SIGHUP, and exits cleanly under the PID 1 signal path.
    command: |
      set -e
      /usr/bin/python3 - <<'PY'
      import os, pathlib, signal, subprocess, tempfile

      py = "/opt/open3d/bin/python"
      with tempfile.TemporaryDirectory() as td:
          env = {"PATH": os.environ["PATH"], "TMPDIR": td}

          fork_code = (
              "import os, sys, _open3d_runtime as rt\n"
              "root = rt._CACHE_ROOT\n"
              "assert root is not None and root.is_dir(), root\n"
              "pid = os.fork()\n"
              "if pid == 0:\n"
              "    sys.exit(0)\n"
              "_, st = os.waitpid(pid, 0)\n"
              "assert os.WIFEXITED(st) and os.WEXITSTATUS(st) == 0, st\n"
              "assert root.is_dir(), root\n"
              "print(root)\n"
          )
          r = subprocess.run([py, "-c", fork_code], env=env, capture_output=True, text=True, timeout=30)
          assert r.returncode == 0, (r.returncode, r.stdout, r.stderr)
          assert not pathlib.Path(r.stdout.strip()).exists(), r.stdout

          for sig in (signal.SIGTERM, signal.SIGHUP):
              sp = subprocess.Popen(
                  [py, "-c", "import time, _open3d_runtime as rt; print(rt._CACHE_ROOT, flush=True); time.sleep(30)"],
                  env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              cdir = sp.stdout.readline().strip()
              assert cdir and os.path.isdir(cdir), cdir
              os.kill(sp.pid, sig)
              rc = sp.wait(timeout=10)
              assert rc == -sig.value, (sig, rc, sp.stderr.read())
              assert not os.path.exists(cdir), cdir

              pid1_code = (
                  "import os, time, _open3d_runtime as rt\n"
                  "rt._CACHE_OWNER_PID = 1\n"
                  "os.getpid = lambda: 1\n"
                  "print(rt._CACHE_ROOT, flush=True)\n"
                  "time.sleep(30)\n"
              )
              sp1 = subprocess.Popen(
                  [py, "-c", pid1_code],
                  env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              cdir1 = sp1.stdout.readline().strip()
              assert cdir1 and os.path.isdir(cdir1), cdir1
              os.kill(sp1.pid, sig)
              rc1 = sp1.wait(timeout=10)
              assert rc1 == 128 + sig.value, (sig, rc1, sp1.stderr.read())
              assert not os.path.exists(cdir1), cdir1
          assert os.listdir(td) == [], os.listdir(td)
      print("runtime hook signal and fork ok")
      PY
    expected_output_contains: "runtime hook signal and fork ok"
