# Runtime checks use the bundled GQI template; it contains QA and ISO, not tensor FA/AD/RD.
name: dsistudio
version: 2024.06.12.post1
upstream_version: 2024.6.12
env:
  QT_QPA_PLATFORM: offscreen
required_files:
  - dataset: ds000001
    files:
      - sub-01/anat/sub-01_T1w.nii.gz
      - sub-01/anat/sub-01_inplaneT2.nii.gz
test_data:
  t1w: ds000001/sub-01/anat/sub-01_T1w.nii.gz
  t2: ds000001/sub-01/anat/sub-01_inplaneT2.nii.gz
  output_dir: test_output
  atlas_dir: /opt/dsi-studio/atlas/human
  template_fib: test_output/human.fz
  template_t1w: /opt/dsi-studio/atlas/human/human.T1W.nii.gz
  template_qa: /opt/dsi-studio/atlas/human/human.QA.nii.gz
setup:
  script: |
    set -eu
    mkdir -p test_output
    cp /opt/dsi-studio/atlas/human/human.fz test_output/human.fz
tests:
  - name: DSI Studio binary exists
    description: Verify dsi_studio binary is in PATH
    command: command -v dsi_studio
    expected_output_contains: dsi_studio
  - name: DSI Studio version check
    description: Check DSI Studio version output
    command: dsi_studio --version
    expected_output_contains: 'DSI Studio version:'
  - name: DSI Studio atlas directory exists
    description: Verify atlas directory is present
    command: ls -la /opt/dsi-studio/atlas/
    expected_output_contains: human
  - name: DSI Studio human template files exist
    description: Verify the bundled human FIB template is available.
    command: ls /opt/dsi-studio/atlas/human/*.fz
    expected_output_contains: human.fz
  - name: src action rejects missing input
    description: Verify the action fails for missing or invalid input.
    command: dsi_studio --action=src --source=nonexistent
    expected_exit_code: 1
  - name: rec action rejects missing input
    description: Verify the action fails for missing or invalid input.
    command: dsi_studio --action=rec --source=nonexistent
    expected_exit_code: 1
    expected_output_contains: does not exist
  - name: trk action rejects missing input
    description: Verify the action fails for missing or invalid input.
    command: dsi_studio --thread_count=2 --action=trk --source=nonexistent
    expected_exit_code: 1
    expected_output_contains: does not exist
  - name: ana action rejects missing input
    description: Verify the action fails for missing or invalid input.
    command: dsi_studio --action=ana --source=nonexistent
    expected_exit_code: 1
    expected_output_contains: does not exist
  - name: atk action rejects missing input
    description: Verify the action fails for missing or invalid input.
    command: dsi_studio --thread_count=2 --action=atk --source=nonexistent
    expected_exit_code: 1
    expected_output_contains: does not exist
  - name: exp action rejects missing input
    description: Verify the action fails for missing or invalid input.
    command: dsi_studio --action=exp --source=nonexistent
    expected_exit_code: 1
    expected_output_contains: unsupported file format
  - name: reg action rejects missing input
    description: Verify the action fails for missing or invalid input.
    command: dsi_studio --action=reg --source=nonexistent
    expected_exit_code: 1
    expected_output_contains: please specify the images to warp
  - name: reg action - linear registration T1w to template
    description: Complete structural registration on CPU and verify the transformed image is written.
    command: mkdir -p test_output/reg_11 && dsi_studio --action=reg --source=${t1w} --to=${template_t1w} --reg_type=0
      --overwrite=1 --output=test_output/reg_11
    validate:
      - output_exists: test_output/reg_11/sub-01_T1w.nii.gz.wp.nii.gz
    timeout: 600
  - name: reg action - save reusable mapping
    description: Save an affine mapping and registered image.
    command: mkdir -p test_output/reg_mapping && dsi_studio --action=reg --source=${t1w} --to=${template_t1w} --reg_type=1
      --skip_nonlinear=1 --output_mapping=test_output/mapping.mz --output=test_output/reg_mapping --overwrite=1
    validate:
      - output_exists: test_output/mapping.mz
      - output_exists: test_output/reg_mapping/sub-01_T1w.nii.gz.wp.nii.gz
    timeout: 600
  - name: reg action - nonlinear registration T1w to template
    description: Complete structural registration on CPU and verify the transformed image is written.
    command: mkdir -p test_output/reg_13 && dsi_studio --action=reg --source=${t1w} --to=${template_t1w} --reg_type=1
      --resolution=4 --overwrite=1 --output=test_output/reg_13
    validate:
      - output_exists: test_output/reg_13/sub-01_T1w.nii.gz.wp.nii.gz
    timeout: 600
  - name: reg action - apply saved mapping
    description: Transform the subject image with the mapping produced by registration.
    command: mkdir -p test_output/reg_reuse && dsi_studio --action=reg --source=${t1w} --mapping=test_output/mapping.mz
      --output=test_output/reg_reuse
    depends_on: reg action - save reusable mapping
    validate:
      - output_exists: test_output/reg_reuse/sub-01_T1w.nii.gz.wp.nii.gz
  - name: reg action - multi-modality registration
    description: Complete structural registration on CPU and verify the transformed image is written.
    command: mkdir -p test_output/reg_15 && dsi_studio --action=reg --source=${t1w},${t2} --to=${template_t1w},${template_t1w}
      --reg_type=0 --overwrite=1 --output=test_output/reg_15
    validate:
      - output_exists: test_output/reg_15/sub-01_T1w.nii.gz.wp.nii.gz
      - output_exists: test_output/reg_15/sub-01_inplaneT2.nii.gz.wp.nii.gz
    timeout: 600
  - name: exp action - export QA from template FIB
    description: Export the GQI metrics present in the bundled FIB to the writable test directory.
    command: rm -f ${template_fib}.qa.nii.gz && dsi_studio --action=exp --source=${template_fib} --export=qa
    validate:
      - output_exists: ${template_fib}.qa.nii.gz
  - name: exp action - export ISO from template FIB
    description: Export the GQI metrics present in the bundled FIB to the writable test directory.
    command: rm -f ${template_fib}.iso.nii.gz && dsi_studio --action=exp --source=${template_fib} --export=iso
    expected_exit_code: 0
    validate:
      - output_exists: ${template_fib}.iso.nii.gz
  - name: exp action - export multiple metrics
    description: Export the GQI metrics present in the bundled FIB to the writable test directory.
    command: rm -f ${template_fib}.qa.nii.gz ${template_fib}.iso.nii.gz && dsi_studio --action=exp --source=${template_fib}
      --export=qa,iso
    expected_exit_code: 0
    validate:
      - output_exists: ${template_fib}.qa.nii.gz
      - output_exists: ${template_fib}.iso.nii.gz
  - name: trk action - whole brain tracking (limited)
    description: Run limited whole-brain tracking on human template
    command: dsi_studio --thread_count=2 --action=trk --source=${template_fib} --seed_count=100 --output=test_output/template_wb_tracks.tt.gz
    validate:
      - output_exists: ${output_dir}/template_wb_tracks.tt.gz
  - name: trk action - tracking with parameters
    description: Test fiber tracking with custom parameters
    command: dsi_studio --thread_count=2 --action=trk --source=${template_fib} --seed_count=50 --fa_threshold=0.1
      --turning_angle=60 --step_size=1.0 --min_length=20 --max_length=200 --output=test_output/template_tracks_params.tt.gz
    validate:
      - output_exists: ${output_dir}/template_tracks_params.tt.gz
  - name: trk action - tracking with ROI
    description: Test fiber tracking with region of interest
    command: dsi_studio --thread_count=2 --action=trk --source=${template_fib} --seed_count=5000 --roi=HCP-MMP:L_V1
      --output=test_output/template_tracks_roi.tt.gz
    validate:
      - output_exists: ${output_dir}/template_tracks_roi.tt.gz
  - name: trk action - tracking with connectome
    description: Test fiber tracking with connectivity matrix output
    command: dsi_studio --thread_count=2 --action=trk --source=${template_fib} --seed_count=100 --connectivity=Brodmann
      --output=test_output/template_tracks_conn.tt.gz
    validate:
      - output_exists: ${output_dir}/template_tracks_conn.tt.gz
      - output_exists: test_output/template_tracks_conn.tt.gz.Brodmann.count.pass.connectivity.mat
  - name: atk action - track arcuate fasciculus
    description: Automatic tracking of arcuate fasciculus bundle
    command: mkdir -p test_output/atk_23 && dsi_studio --thread_count=2 --action=atk --source=${template_fib} --track_id=Arcuate
      --output=test_output/atk_23 --track_voxel_ratio=0.01 --tip_iteration=0 --overwrite=1 && test -n "$(find test_output/atk_23
      -name '*.tt.gz' -size +0c -print -quit)" && test -z "$(find test_output/atk_23 -name '*.no_result.txt' -print
      -quit)"
    expected_exit_code: 0
    timeout: 300
  - name: atk action - track corticospinal tract
    description: Automatic tracking of corticospinal tract
    command: mkdir -p test_output/atk_24 && dsi_studio --thread_count=2 --action=atk --source=${template_fib} --track_id=Corticos
      --output=test_output/atk_24 --track_voxel_ratio=0.01 --tip_iteration=0 --overwrite=1 && test -n "$(find test_output/atk_24
      -name '*.tt.gz' -size +0c -print -quit)" && test -z "$(find test_output/atk_24 -name '*.no_result.txt' -print
      -quit)"
    expected_exit_code: 0
    timeout: 300
  - name: atk action - track multiple bundles
    description: Automatic tracking of multiple bundles
    command: mkdir -p test_output/atk_25 && dsi_studio --thread_count=2 --action=atk --source=${template_fib} --track_id=Arcuate,Cingulum,Fornix
      --output=test_output/atk_25 --track_voxel_ratio=0.01 --tip_iteration=0 --overwrite=1 && test -n "$(find test_output/atk_25
      -name '*.tt.gz' -size +0c -print -quit)" && test -z "$(find test_output/atk_25 -name '*.no_result.txt' -print
      -quit)"
    expected_exit_code: 0
    timeout: 300
  - name: atk action - with custom tolerance
    description: Automatic tracking with adjusted tolerance
    command: mkdir -p test_output/atk_26 && dsi_studio --thread_count=2 --action=atk --source=${template_fib} --track_id=Uncinate
      --tolerance=22,26,30 --output=test_output/atk_26 --track_voxel_ratio=0.01 --tip_iteration=0 --overwrite=1
      && test -n "$(find test_output/atk_26 -name '*.tt.gz' -size +0c -print -quit)" && test -z "$(find test_output/atk_26
      -name '*.no_result.txt' -print -quit)"
    expected_exit_code: 0
    timeout: 300
  - name: ana action - tract statistics
    description: Generate tract statistics from tracked fibers
    command: dsi_studio --action=ana --source=${template_fib} --tract=test_output/template_wb_tracks.tt.gz --export=stat
    depends_on: trk action - whole brain tracking (limited)
    expected_exit_code: 0
    validate:
      - output_exists: test_output/template_wb_tracks.tt.gz.stat.txt
  - name: ana action - tract density image
    description: Generate tract density image from tracked fibers
    command: dsi_studio --action=ana --source=${template_fib} --tract=test_output/template_wb_tracks.tt.gz --export=tdi
    depends_on: trk action - whole brain tracking (limited)
    expected_exit_code: 0
    validate:
      - output_exists: test_output/template_wb_tracks.tt.gz.tdi.nii.gz
  - name: ana action - tract to region connectivity
    description: Calculate tract-to-region connectivity matrix
    command: dsi_studio --action=ana --source=${template_fib} --tract=test_output/template_wb_tracks.tt.gz --connectivity=Brodmann
    depends_on: trk action - whole brain tracking (limited)
    expected_exit_code: 0
    validate:
      - output_exists: test_output/template_wb_tracks.tt.gz.Brodmann.count.pass.connectivity.mat
  - name: ana action - region statistics with atlas
    description: Get region statistics using HCP-MMP atlas
    command: dsi_studio --action=ana --source=${template_fib} --region=HCP-MMP:L_V1 --output=test_output/region_30.txt
    expected_exit_code: 0
    validate:
      - output_exists: test_output/region_30.txt
  - name: ana action - export tract endpoints
    description: Export tract endpoint coordinates
    command: dsi_studio --action=ana --source=${template_fib} --tract=test_output/template_wb_tracks.tt.gz --end_point=test_output/endpoints.txt
    depends_on: trk action - whole brain tracking (limited)
    expected_exit_code: 0
    validate:
      - output_exists: test_output/endpoints.txt
  - name: cnt action rejects missing input
    description: Verify the action fails for missing or invalid input.
    command: dsi_studio --action=cnt --source=nonexistent
    expected_exit_code: 1
    expected_output_contains: invalid fib file
  - name: ren action accepts an empty directory
    description: Verify the DICOM renamer completes on an empty input directory.
    command: mkdir -p test_output/empty_dicom && dsi_studio --action=ren --source=test_output/empty_dicom --output=test_output/renamed_dicom
    expected_output_contains: Renaming DICOM
  - name: Atlas Brodmann exists
    description: Verify Brodmann atlas is available
    command: ls /opt/dsi-studio/atlas/human/Brodmann.nii.gz
    expected_exit_code: 0
  - name: Atlas HCP-MMP exists
    description: Verify HCP-MMP atlas is available
    command: ls /opt/dsi-studio/atlas/human/HCP-MMP.nii.gz
    expected_exit_code: 0
  - name: Atlas FreeSurferDKT exists
    description: Verify FreeSurfer DKT atlas is available
    command: ls /opt/dsi-studio/atlas/human/FreeSurferDKT_Cortical.nii.gz
    expected_exit_code: 0
  - name: Atlas Brainnectome exists
    description: Verify Brainnectome atlas is available
    command: test -s /opt/dsi-studio/atlas/human/Brainnectome.nii.gz
    expected_exit_code: 0
  - name: Atlas CerebrA exists
    description: Verify CerebrA atlas is available
    command: ls /opt/dsi-studio/atlas/human/CerebrA.nii.gz
    expected_exit_code: 0
  - name: Atlas HCPex exists
    description: Verify HCPex atlas is available
    command: ls /opt/dsi-studio/atlas/human/HCPex.nii.gz
    expected_exit_code: 0
  - name: Atlas JulichBrain exists
    description: Verify JulichBrain atlas is available
    command: ls /opt/dsi-studio/atlas/human/JulichBrain.nii.gz
    expected_exit_code: 0
  - name: HCP842 tractography template exists
    description: Verify HCP842 tractography template is available
    command: ls /opt/dsi-studio/atlas/human/HCP842_tractography.nii.gz
    expected_exit_code: 0
  - name: Mouse atlas exists
    description: Verify C57BL6 mouse atlas is available
    command: ls /opt/dsi-studio/atlas/mouse/
    expected_exit_code: 0
  - name: Rat atlas exists
    description: Verify WHS SD rat atlas is available
    command: ls /opt/dsi-studio/atlas/rat/
    expected_exit_code: 0
  - name: Marmoset atlas exists
    description: Verify Pitt marmoset atlas is available
    command: ls /opt/dsi-studio/atlas/marmoset/
    expected_exit_code: 0
  - name: Rhesus atlas exists
    description: Verify INDI rhesus atlas is available
    command: ls /opt/dsi-studio/atlas/rhesus/
    expected_exit_code: 0
  - name: Neonate atlas exists
    description: Verify dHCP neonate atlas is available
    command: ls /opt/dsi-studio/atlas/human_neonate/
    expected_exit_code: 0
  - name: Network files exist
    description: Verify network definition files are available
    command: ls /opt/dsi-studio/network/
    expected_exit_code: 0
  - name: Color map files exist
    description: Verify color map files are available
    command: ls /opt/dsi-studio/color_map/
    expected_exit_code: 0
  - name: trk action rejects unknown differential metric
    description: Differential tracking must reject metrics missing from the input FIB.
    command: dsi_studio --action=trk --source=${template_fib} --dt_metric1=missing_metric --dt_metric2=missing_metric
      --dt_threshold=0.1 --seed_count=50
    expected_exit_code: 1
    expected_output_contains: 'cannot find the metric: missing_metric'
  - name: trk action - tracking with smoothing
    description: Test fiber tracking with smoothing parameter
    command: dsi_studio --thread_count=2 --action=trk --source=${template_fib} --seed_count=50 --smoothing=0.5 --output=test_output/template_tracks_smooth.tt.gz
    validate:
      - output_exists: ${output_dir}/template_tracks_smooth.tt.gz
  - name: trk action - delete repeat streamlines
    description: Test fiber tracking with duplicate removal
    command: dsi_studio --thread_count=2 --action=trk --source=${template_fib} --seed_count=100 --delete_repeat=1
      --output=test_output/template_tracks_unique.tt.gz
    validate:
      - output_exists: ${output_dir}/template_tracks_unique.tt.gz
  - name: trk action - output tract statistics
    description: Test fiber tracking with inline statistics export
    command: dsi_studio --thread_count=2 --action=trk --source=${template_fib} --seed_count=50 --export=stat --output=test_output/template_tracks_stat.tt.gz
    validate:
      - output_exists: ${output_dir}/template_tracks_stat.tt.gz
      - output_exists: test_output/template_tracks_stat.tt.gz.stat.txt
  - name: trk action - HCP-MMP connectivity
    description: Generate connectivity matrix using HCP-MMP parcellation
    command: dsi_studio --thread_count=2 --action=trk --source=${template_fib} --seed_count=200 --connectivity=HCP-MMP
      --connectivity_type=pass --output=test_output/template_conn_hcpmmp.tt.gz
    validate:
      - output_exists: ${output_dir}/template_conn_hcpmmp.tt.gz
      - output_exists: test_output/template_conn_hcpmmp.tt.gz.HCP-MMP.count.pass.connectivity.mat
  - name: trk action - multiple atlas connectivity
    description: Generate connectivity matrices for multiple atlases
    command: dsi_studio --thread_count=2 --action=trk --source=${template_fib} --seed_count=100 --connectivity=Brodmann,FreeSurferDKT_Cortical
      --output=test_output/template_conn_multi.tt.gz
    validate:
      - output_exists: ${output_dir}/template_conn_multi.tt.gz
      - output_exists: test_output/template_conn_multi.tt.gz.Brodmann.count.pass.connectivity.mat
      - output_exists: test_output/template_conn_multi.tt.gz.FreeSurferDKT_Cortical.count.pass.connectivity.mat
  - name: trk action - endpoint connectivity
    description: Generate endpoint-based connectivity matrix
    command: dsi_studio --thread_count=2 --action=trk --source=${template_fib} --seed_count=100 --connectivity=Brodmann
      --connectivity_type=end --output=test_output/template_conn_end.tt.gz
    validate:
      - output_exists: ${output_dir}/template_conn_end.tt.gz
      - output_exists: test_output/template_conn_end.tt.gz.Brodmann.count.end.connectivity.mat
  - name: reg action - cost function mutual information
    description: Complete structural registration on CPU and verify the transformed image is written.
    command: mkdir -p test_output/reg_56 && dsi_studio --action=reg --source=${t1w} --to=${template_t1w} --reg_type=0
      --cost_function=mi --overwrite=1 --output=test_output/reg_56
    validate:
      - output_exists: test_output/reg_56/sub-01_T1w.nii.gz.wp.nii.gz
    timeout: 600
  - name: reg action - high resolution registration
    description: Complete structural registration on CPU and verify the transformed image is written.
    command: mkdir -p test_output/reg_57 && dsi_studio --action=reg --source=${t1w} --to=${template_t1w} --reg_type=1
      --resolution=2 --overwrite=1 --output=test_output/reg_57
    validate:
      - output_exists: test_output/reg_57/sub-01_T1w.nii.gz.wp.nii.gz
    timeout: 600
  - name: reg action - smoothed registration
    description: Complete structural registration on CPU and verify the transformed image is written.
    command: mkdir -p test_output/reg_58 && dsi_studio --action=reg --source=${t1w} --to=${template_t1w} --reg_type=1
      --smoothing=0.5 --overwrite=1 --output=test_output/reg_58
    validate:
      - output_exists: test_output/reg_58/sub-01_T1w.nii.gz.wp.nii.gz
    timeout: 600
  - name: atk action - inferior longitudinal fasciculus
    description: Track inferior longitudinal fasciculus
    command: mkdir -p test_output/atk_59 && dsi_studio --thread_count=2 --action=atk --source=${template_fib} --track_id=InferiorLongitudinal
      --output=test_output/atk_59 --track_voxel_ratio=0.01 --tip_iteration=0 --overwrite=1 && test -n "$(find test_output/atk_59
      -name '*.tt.gz' -size +0c -print -quit)" && test -z "$(find test_output/atk_59 -name '*.no_result.txt' -print
      -quit)"
    expected_exit_code: 0
    timeout: 300
  - name: atk action - superior longitudinal fasciculus
    description: Track superior longitudinal fasciculus
    command: mkdir -p test_output/atk_60 && dsi_studio --thread_count=2 --action=atk --source=${template_fib} --track_id=SuperiorLongitudinal
      --output=test_output/atk_60 --track_voxel_ratio=0.01 --tip_iteration=0 --overwrite=1 && test -n "$(find test_output/atk_60
      -name '*.tt.gz' -size +0c -print -quit)" && test -z "$(find test_output/atk_60 -name '*.no_result.txt' -print
      -quit)"
    expected_exit_code: 0
    timeout: 300
  - name: atk action - optic radiation
    description: Track optic radiation
    command: mkdir -p test_output/atk_61 && dsi_studio --thread_count=2 --action=atk --source=${template_fib} --track_id=Optic
      --output=test_output/atk_61 --track_voxel_ratio=0.01 --tip_iteration=0 --overwrite=1 && test -n "$(find test_output/atk_61
      -name '*.tt.gz' -size +0c -print -quit)" && test -z "$(find test_output/atk_61 -name '*.no_result.txt' -print
      -quit)"
    expected_exit_code: 0
    timeout: 300
  - name: atk action - corpus callosum
    description: Track corpus callosum
    command: mkdir -p test_output/atk_62 && dsi_studio --thread_count=2 --action=atk --source=${template_fib} --track_id=Corpus
      --output=test_output/atk_62 --track_voxel_ratio=0.01 --tip_iteration=0 --overwrite=1 && test -n "$(find test_output/atk_62
      -name '*.tt.gz' -size +0c -print -quit)" && test -z "$(find test_output/atk_62 -name '*.no_result.txt' -print
      -quit)"
    expected_exit_code: 0
    timeout: 300
  - name: atk action - thalamic radiation
    description: Track thalamic radiation
    command: mkdir -p test_output/atk_63 && dsi_studio --thread_count=2 --action=atk --source=${template_fib} --track_id=ThalamicR
      --output=test_output/atk_63 --track_voxel_ratio=0.01 --tip_iteration=0 --overwrite=1 && test -n "$(find test_output/atk_63
      -name '*.tt.gz' -size +0c -print -quit)" && test -z "$(find test_output/atk_63 -name '*.no_result.txt' -print
      -quit)"
    expected_exit_code: 0
    timeout: 300
  - name: Device configuration exists
    description: Verify device configuration file is present
    command: ls /opt/dsi-studio/device.txt
    expected_exit_code: 0
  - name: TOPUP parameter file exists
    description: Verify TOPUP parameter file is present
    command: ls /opt/dsi-studio/topup_param.txt
    expected_exit_code: 0
  - name: License file exists
    description: Verify license file is present
    command: ls /opt/dsi-studio/LICENSE
    expected_exit_code: 0
  - name: Template FIB file valid
    description: Export the GQI metrics present in the bundled FIB to the writable test directory.
    command: rm -f ${template_fib}.qa.nii.gz && dsi_studio --action=exp --source=${template_fib} --export=qa
    expected_exit_code: 0
    validate:
      - output_exists: ${template_fib}.qa.nii.gz
  - name: Template tract file exists
    description: Verify template tractography file exists
    command: ls /opt/dsi-studio/atlas/human/human.tt.gz
    expected_exit_code: 0
  - name: Template mask file exists
    description: Verify template mask file exists
    command: ls /opt/dsi-studio/atlas/human/human.mask.nii.gz
    expected_exit_code: 0
  - name: Template white matter file exists
    description: Verify template white matter file exists
    command: ls /opt/dsi-studio/atlas/human/human.WM.nii.gz
    expected_exit_code: 0
  - name: Template ROI file exists
    description: Verify template ROI file exists
    command: ls /opt/dsi-studio/atlas/human/human.roi.nii.gz
    expected_exit_code: 0
  - name: ana action - Brodmann region analysis
    description: Analyze specific Brodmann area
    command: dsi_studio --action=ana --source=${template_fib} --region=Brodmann:BA17_L --output=test_output/region_72.txt
    expected_exit_code: 0
    validate:
      - output_exists: test_output/region_72.txt
  - name: ana action - FreeSurfer region analysis
    description: Analyze FreeSurfer DKT region
    command: dsi_studio --action=ana --source=${template_fib} --region=FreeSurferDKT_Cortical:left_precentral --output=test_output/region_73.txt
    expected_exit_code: 0
