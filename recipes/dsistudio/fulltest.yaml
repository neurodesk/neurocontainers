    description: Run tracking and then analyze the resulting tracts
    command: dsi_studio --thread_count=2 --action=trk --source=${template_fib} --seed_count=100 --output=test_output/pipeline_ana_tracks.tt.gz
      && dsi_studio --action=ana --source=${template_fib} --tract=test_output/pipeline_ana_tracks.tt.gz --connectivity=Brodmann
    validate:
