    command: dsi_studio --action=ana --source=${template_fib} --region=Cerebellum-SUIT:Left_I_IV --output=test_output/region_74.txt
    expected_exit_code: 0
    validate:
      - output_exists: test_output/region_74.txt
  - name: trk action - output as TRK format
    description: Test fiber tracking with TRK output format
    command: dsi_studio --thread_count=2 --action=trk --source=${template_fib} --seed_count=50 --output=test_output/template_tracks.trk.gz
    validate:
      - output_exists: ${output_dir}/template_tracks.trk.gz
  - name: Missing source file error
    description: Verify the action fails for missing or invalid input.
    command: dsi_studio --action=rec --source=nonexistent_file.src.gz
    expected_exit_code: 1
    expected_output_contains: does not exist
  - name: Invalid action error
    description: Verify the action fails for missing or invalid input.
    command: dsi_studio --action=invalid_action --source=nonexistent
    expected_exit_code: 1
    expected_output_contains: unknown action
  - name: trk action - single threaded
    description: Test fiber tracking with single thread
    command: dsi_studio --action=trk --source=${template_fib} --seed_count=50 --thread_count=1 --output=test_output/template_tracks_1thread.tt.gz
    validate:
      - output_exists: ${output_dir}/template_tracks_1thread.tt.gz
  - name: trk action - multi threaded
    description: Test fiber tracking with multiple threads
    command: dsi_studio --action=trk --source=${template_fib} --seed_count=50 --thread_count=4 --output=test_output/template_tracks_4thread.tt.gz
    validate:
      - output_exists: ${output_dir}/template_tracks_4thread.tt.gz
  - name: Pipeline - register and track
    description: Complete structural registration on CPU and verify the transformed image is written.
    command: mkdir -p test_output/reg_80 && dsi_studio --action=reg --source=${t1w} --to=${template_t1w} --reg_type=0
      --overwrite=1 --output=test_output/reg_80 && dsi_studio --action=trk --source=${template_fib} --seed_count=100
      --thread_count=2 --output=test_output/pipeline_tracks.tt.gz
    validate:
