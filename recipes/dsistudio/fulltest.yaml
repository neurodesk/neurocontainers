      - output_exists: test_output/pipeline_ana_tracks.tt.gz.Brodmann.count.pass.connectivity.mat
  - name: Pipeline - autotrack multiple bundles with export
    description: Automatically track bundles and export statistics
    command: mkdir -p test_output/atk_82 && dsi_studio --thread_count=2 --action=atk --source=${template_fib} --track_id=Arcuate,Uncinate
      --export_stat=1 --output=test_output/atk_82 --track_voxel_ratio=0.01 --tip_iteration=0 --overwrite=1 && test
      -n "$(find test_output/atk_82 -name '*.tt.gz' -size +0c -print -quit)" && test -n "$(find test_output/atk_82
      -name '*.stat.txt' -size +0c -print -quit)" && test -z "$(find test_output/atk_82 -name '*.no_result.txt'
      -print -quit)"
    expected_exit_code: 0
    timeout: 300
