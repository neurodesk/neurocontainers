name: kinfitr
version: "0.9.3"

copyright:
  - license: MIT
    url: https://github.com/mathesong/kinfitr/blob/v0.9.3/LICENSE

architectures:
  - x86_64

variables:
  upstream_version: "0.9.3"
  # Pinned R build from CRAN's Ubuntu 24.04 (noble-cran40) apt repository.
  r_version: "4.6.2-2.2404.0"
  # Posit Package Manager CRAN binary snapshot matching the pinned R version.
  cran_snapshot: "2026-11-23"

auto_update:
  method: sources
  container_version: kinfitr
  sources:
    - id: kinfitr
      method: github_release
      repo: mathesong/kinfitr
      target:
        variable: upstream_version
        value: version
        fulltest_variable: upstream_version
    - id: r
      method: apt
      package: r-base-core
      urls:
        - https://cloud.r-project.org/bin/linux/ubuntu/noble-cran40/Packages.gz
      dependency: true
      target:
        variable: r_version
        fulltest_variable: r_version
    - id: cran_snapshot
      method: webpage
      url: https://packagemanager.posit.co/__api__/repos/cran/transaction-dates
      version_regex: '"alias":"(?P<version>[0-9-]+)"'
      version_scheme: date
      dependency: true
      target:
        variable: cran_snapshot

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - run:
        - install -m 0644 {{ get_file("cran_ubuntu_key") }} /etc/apt/trusted.gpg.d/cran_ubuntu_key.asc
        - echo "deb https://cloud.r-project.org/bin/linux/ubuntu noble-cran40/" > /etc/apt/sources.list.d/cran.list

    - install:
        - "r-base-core={{ context.r_version }}"
        - "r-recommended={{ context.r_version }}"
        - libuv1t64

    - run:
        - Rscript {{ get_file("install_kinfitr.R") }} {{ get_file("kinfitr_source") }}
        - Rscript -e 'library(kinfitr); stopifnot(as.character(packageVersion("kinfitr")) == "{{ context.upstream_version }}")'
        - rm -rf /tmp/* /var/tmp/*

deploy:
  bins:
    - R
    - Rscript

files:
  - name: cran_ubuntu_key
    url: https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc

  - name: kinfitr_source
    url: https://github.com/mathesong/kinfitr/archive/refs/tags/v{{ context.upstream_version }}.tar.gz

  - name: install_kinfitr.R
    contents: |
      # Install kinfitr's CRAN dependencies as Ubuntu 24.04 (noble) Linux
      # binaries from the pinned Posit Package Manager snapshot, then install
      # kinfitr itself from the staged release source archive.
      options(
        repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/{{ context.cran_snapshot }}"),
        HTTPUserAgent = sprintf(
          "R/%s R (%s)",
          getRversion(),
          paste(getRversion(), R.version$platform, R.version$arch, R.version$os)
        ),
        timeout = 1800,
        Ncpus = 1L
      )

      tarball <- commandArgs(trailingOnly = TRUE)[[1]]
      extract_dir <- tempfile("kinfitr_src_")
      dir.create(extract_dir)
      on.exit(unlink(extract_dir, recursive = TRUE), add = TRUE)
      untar(tarball, exdir = extract_dir)
      pkg_dir <- list.dirs(extract_dir, full.names = TRUE, recursive = FALSE)[[1]]

      dcf <- read.dcf(file.path(pkg_dir, "DESCRIPTION"))
      parse_pkgs <- function(field) {
        if (!(field %in% colnames(dcf)) || is.na(dcf[1, field])) {
          return(character(0))
        }
        raw <- strsplit(dcf[1, field], ",", fixed = TRUE)[[1]]
        pkgs <- sub("\\s*\\(.*$", "", trimws(raw))
        pkgs[nzchar(pkgs) & pkgs != "R"]
      }

      deps <- unique(c(
        parse_pkgs("Depends"),
        parse_pkgs("Imports"),
        parse_pkgs("LinkingTo")
      ))
      installed <- rownames(installed.packages())
      needed <- setdiff(deps, installed)
      if (length(needed)) {
        install.packages(needed, clean = TRUE)
      }

      missing <- deps[!vapply(deps, requireNamespace, logical(1), quietly = TRUE)]
      if (length(missing)) {
        stop("CRAN dependencies failed to install: ", paste(missing, collapse = ", "))
      }

      install.packages(pkg_dir, repos = NULL, type = "source", clean = TRUE)
      if (!requireNamespace("kinfitr", quietly = TRUE)) {
        stop("kinfitr failed to install")
      }

domains:
  - neuroimaging

categories:
  - molecular imaging
  - preclinical imaging
  - quantitative imaging
  - statistics

structured_readme:
  description: >-
    kinfitr is an R package for reproducible pharmacokinetic modeling of Positron
    Emission Tomography (PET) time-activity curves (TACs). It implements compartmental
    models (1TCM, 2TCM), graphical analyses (Logan, Patlak, MA1), and reference tissue
    models (SRTM, SRTM2, MRTM1, MRTM2, refLogan, refPatlak) along with arterial blood
    data processing utilities.
  example: |-
    Rscript -e '
      library(kinfitr)
      data(simref)
      tacs <- simref$tacs[[1]]
      fit <- srtm(t_tac = tacs$Times, reftac = tacs$Reference, roitac = tacs$ROI1, weights = tacs$Weights)
      print(fit$par)
    '
  documentation: https://github.com/mathesong/kinfitr
  citation: |-
    Matheson, G. J. (2019). Kinfitr: Reproducible PET Pharmacokinetic Modelling in R. bioRxiv: 755751. https://doi.org/10.1101/755751

    Tjerkaski, J., Cervenka, S., Farde, L., & Matheson, G. J. (2020). Kinfitr - an open source tool for reproducible PET modelling: Validation and evaluation of test-retest reliability. EJNMMI Research 10, 77. https://doi.org/10.1186/s13550-020-00664-8

readme: |-
  ----------------------------------
  ## kinfitr/{{ context.version }} ##

  kinfitr is an R package for reproducible pharmacokinetic modeling of Positron
  Emission Tomography (PET) time-activity curves (TACs). It implements compartmental
  models (1TCM, 2TCM), graphical analyses (Logan, Patlak, MA1), and reference tissue
  models (SRTM, SRTM2, MRTM1, MRTM2, refLogan, refPatlak) along with arterial blood
  data processing utilities.

  Example:
  ```bash
  Rscript -e '
    library(kinfitr)
    data(simref)
    tacs <- simref$tacs[[1]]
    fit <- srtm(t_tac = tacs$Times, reftac = tacs$Reference, roitac = tacs$ROI1, weights = tacs$Weights)
    print(fit$par)
  '
  ```

  More documentation and tutorials can be found here:
  - https://github.com/mathesong/kinfitr
  - https://granvillematheson.com/posts/2020/kinfitr-part-1-theory

  Citation:
  ```
  Matheson, G. J. (2019). Kinfitr: Reproducible PET Pharmacokinetic Modelling in R. bioRxiv: 755751. https://doi.org/10.1101/755751

  Tjerkaski, J., Cervenka, S., Farde, L., & Matheson, G. J. (2020). Kinfitr - an open source tool for reproducible PET modelling: Validation and evaluation of test-retest reliability. EJNMMI Research 10, 77. https://doi.org/10.1186/s13550-020-00664-8
  ```

  To run container outside of this environment: ml kinfitr/{{ context.version }}

  ----------------------------------

