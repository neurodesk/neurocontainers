name: mobstr3d
version: 1.0.5

copyright:
  - license: Apache-2.0
    url: https://github.com/UOA-Heart-Mechanics-Research/mobstr3D/blob/main/LICENSE
  - license: Apache-2.0
    url: https://github.com/MIC-DKFZ/nnUNet/blob/master/LICENSE

architectures:
  - x86_64

readme_url: https://raw.githubusercontent.com/UOA-Heart-Mechanics-Research/mobstr3D/{{ context.upstream_commit }}/README.md

variables:
  upstream_commit: e8cf9b20291acd14ef5ff67d40432531823fa46f
  upstream_version: 1.0.5
  base_image_digest: sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
  openrecon_ubuntu_version: '24.04'
  openrecon_ismrmrd_version: 1.14.2
  openrecon_siemens_commit: 055eefc09dfa77fbf11fff85979dea9ef2879ba5
  openrecon_python_tools_commit: 17fe6fbf1bb645112e2ad0023eb4f42afb36421e
  openrecon_server_commit: 33362f2139701fbf5ea855808a325eb59b7db2ae
  torch_version: 2.15.0
  nnunetv2_version: 2.8.1
  mobstr3d_model: /opt/mobstr3D/src/mobstr3D/preprocessing/DICOM/segmentation/modelESv2/nnUNetTrainer__nnUNetPlans__2d

files:
  - name: mobstr3d_source
    url: https://github.com/UOA-Heart-Mechanics-Research/mobstr3D/archive/{{ context.upstream_commit }}.tar.gz
    sha256: 28db66eb74292ab74bc5bf91ca458d91de9e39c877f4dfe67ba41e2ac5c2afff
  - name: mobstr3d.py
    filename: mobstr3d.py
  - name: mobstr3d_slice.py
    filename: mobstr3d_slice.py
  - name: verify_runtime.py
    filename: verify_runtime.py
  - name: OpenReconLabel.json
    filename: OpenReconLabel.json
  - name: OpenReconREADME.md
    filename: OpenReconREADME.md
  - name: mobstr3d-slice
    contents: |-
      #!/usr/bin/env bash
      exec python3 /opt/mobstr3d/mobstr3d_slice.py "$@"
  - name: openrecon-mobstr3d
    contents: |-
      #!/usr/bin/env bash
      exec python3 /opt/code/python-ismrmrd-server/main.py --defaultConfig mobstr3d "$@"

auto_update:
  method: sources
  container_version: mobstr3d
  local:
    - macros/openrecon
    - macros/openrecon_i2i
  sources:
    - id: mobstr3d
      method: github_commit
      repo: UOA-Heart-Mechanics-Research/mobstr3D
      ref: main
      version_file: pyproject.toml
      version_regex: '(?m)^version = "(?P<version>[0-9.]+)"'
      target:
        variable: upstream_commit
        fulltest_variable: upstream_commit
        variables:
          upstream_version: version
    - id: mobstr3d_archive
      dependency: true
      method: http_digest
      url: https://github.com/UOA-Heart-Mechanics-Research/mobstr3D/archive/{{ context.upstream_commit }}.tar.gz
      target:
        file: mobstr3d_source
    - id: base_image
      dependency: true
      method: oci_digest
      image: ubuntu
      tag: '24.04'
      target:
        variable: base_image_digest
    - id: torch
      dependency: true
      method: pypi
      package: torch
      target:
        variable: torch_version
    - id: nnunetv2
      dependency: true
      method: pypi
      package: nnunetv2
      target:
        variable: nnunetv2_version
    - id: openrecon_ismrmrd
      dependency: true
      method: github_release
      repo: ismrmrd/ismrmrd
      target:
        variable: openrecon_ismrmrd_version
        value: version
    - id: openrecon_siemens
      dependency: true
      method: github_commit
      repo: ismrmrd/siemens_to_ismrmrd
      ref: HEAD
      target:
        variable: openrecon_siemens_commit
    - id: openrecon_python_tools
      dependency: true
      method: github_commit
      repo: ismrmrd/ismrmrd-python-tools
      ref: HEAD
      target:
        variable: openrecon_python_tools_commit
    - id: openrecon_server
      dependency: true
      method: github_commit
      repo: astewartau/python-ismrmrd-server
      ref: fix/ismrmrd-compatibility
      target:
        variable: openrecon_server_commit

build:
  kind: neurodocker
  base-image: ubuntu:24.04@{{ context.base_image_digest }}
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        MPLBACKEND: Agg
        MPLCONFIGDIR: /tmp/matplotlib
    - install: bzip2 ca-certificates git build-essential unzip python3-pip python3-dev python-is-python3 libgl1 libglib2.0-0 libxrender1 libxext6 libx11-6
    - include: macros/openrecon/neurodocker.yaml
    - include: macros/openrecon_i2i/helpers.yaml

    # mobstr3D at the pinned commit, with the modelESv2 nnU-Net weights it ships.
    # PyTorch goes in first (CPU build), as the mobstr3D README requires before nnU-Net.
    - workdir: /opt
    - run:
        - mkdir -p /opt/mobstr3D
        - tar -xzf {{ get_file("mobstr3d_source") }} --strip-components=1 -C /opt/mobstr3D
        - rm -rf /opt/mobstr3D/assets {{ context.mobstr3d_model }}/fold_0/checkpoint_best.pth
        - python3 -m pip install --break-system-packages --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch=={{ context.torch_version }}
        - python3 -m pip install --break-system-packages --no-cache-dir /opt/mobstr3D nnunetv2=={{ context.nnunetv2_version }}
        - python3 -c "import importlib.metadata as m; assert m.version('mobstr3D') == '{{ context.upstream_version }}', m.version('mobstr3D')"

    - run:
        - mkdir -p /opt/mobstr3d
        - cp {{ get_file("mobstr3d_slice.py") }} /opt/mobstr3d/mobstr3d_slice.py
        - cp {{ get_file("verify_runtime.py") }} /opt/mobstr3d/verify_runtime.py
        - cp {{ get_file("OpenReconREADME.md") }} /opt/mobstr3d/OpenReconREADME.md
        - cp {{ get_file("mobstr3d.py") }} /opt/code/python-ismrmrd-server/mobstr3d.py
        - cp {{ get_file("OpenReconLabel.json") }} /opt/code/python-ismrmrd-server/OpenReconLabel.json
        - install -m 0755 {{ get_file("mobstr3d-slice") }} /usr/local/bin/mobstr3d-slice
        - install -m 0755 {{ get_file("openrecon-mobstr3d") }} /usr/local/bin/openrecon-mobstr3d
        - mkdir -p /tmp/matplotlib /tmp/share/debug
        - chmod 1777 /tmp/matplotlib /tmp/share /tmp/share/debug

    - environment:
        PYTHONPATH: /opt/code/python-ismrmrd-server:/opt/mobstr3d
        MOBSTR3D_MODEL: '{{ context.mobstr3d_model }}'
    - workdir: /tmp

deploy:
  bins:
    - mobstr3d-slice
    - openrecon-mobstr3d

categories:
  - body
  - phase processing
  - image segmentation
domains:
  - neuroimaging

readme: |
  ## mobstr3d/{{ context.version }}

  Single-slice preprocessing from [mobstr3D](https://github.com/UOA-Heart-Mechanics-Research/mobstr3D)
  (Model-based Strains in 3D) for cine DENSE CMR with 3D displacement encoding,
  pinned to upstream commit {{ context.upstream_commit }}. Each slice (magnitude plus
  x/y/z encoded phase, all frames) is processed on its own, so it can run as soon as
  the slice is acquired:

  1. nnU-Net modelESv2 segmentation of the magnitude frames (myocardium, blood pool)
  2. endocardial and epicardial contours from the labels
  3. automatic seed selection and spatiotemporal quality-guided phase unwrapping
  4. x/y/z displacements in mm, using the DENSE encoding frequency, scale and RCswap/RCSflip

  Slice correction, the pseudo-cardiac transform, model fitting and strain analysis
  need the whole stack and are not part of this container.

  Process a folder of DENSE DICOMs, one output folder per slice:

  ```bash
  mobstr3d-slice --dicom-dir dicoms --output-dir out
  ```

  Each `out/Slice_n` holds `segmentation.nii.gz`, `displacements_ics.json`,
  `contours_ics.json`, `seed_points.json` and `imaging_parameters.json` in mobstr3D's
  own formats. Options: `--frame-of-seed` (default 5), `--end-frame` (default -1, last
  frame), `--phase-quality cropped|masked`, `--contour-method marching_squares|cv2_find_contours`.

  Start the OpenRecon MRD server with `openrecon-mobstr3d --host 0.0.0.0 --port 9002`
  and select the `mobstr3d` configuration. See /opt/mobstr3d/OpenReconREADME.md.

  Citation: G. E. Harpur et al., "mobstr3D: Open-Source Software for Analysing Cine DENSE
  CMR to Quantify Regional Heart Motion and Strain," JCMR 28:102336, 2026.
  https://doi.org/10.1016/j.jocmr.2025.102336

icon: "data:image/png;base64,"
