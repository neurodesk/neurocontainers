name: valis
version: 1.2.0
upstream_version: "1.2.0"

tests:
  - name: valis-info wrapper available on PATH and runs cleanly
    description: Verify the deployed valis-info wrapper resolves on PATH and prints installed VALIS and OpenCV contrib info.
    command: |
      set -e
      command -v valis-info
      env -u HOME -u USER -u LOGNAME valis-info
    expected_output_contains: "valis-wsi ${upstream_version}"

  - name: package version matches recipe, system APT libs used, zero bundled GNU/FFmpeg/CUDA libs or Magic Leap weights
    description: Verify valis-wsi matches upstream_version, pip check passes, numpy/scipy/sklearn come from Ubuntu APT, xfeatures2d is available, and zero proprietary SuperGlue weights or bundled GNU/FFmpeg/CUDA libs ship.
    command: |
      set -e
      /opt/valis/bin/python -m pip check
      /opt/valis/bin/python - <<'PY'
      import importlib.metadata as md
      import pathlib
      import aicspylibczi
      import cv2
      import numpy
      import pyvips
      import scipy
      import sklearn
      import torch
      import valis
      from valis.superglue_models import superpoint

      assert md.version("valis-wsi") == "${upstream_version}", md.version("valis-wsi")
      assert hasattr(cv2, "xfeatures2d") and hasattr(cv2.xfeatures2d, "VGG_create")
      assert hasattr(cv2, "optflow") and hasattr(cv2.optflow, "createOptFlow_DeepFlow")
      for m in (numpy, scipy, sklearn):
          assert m.__file__.startswith("/usr/lib/python3/dist-packages/"), m.__file__
      bad_libs = [
          str(p)
          for p in pathlib.Path("/opt/valis").rglob("*.so*")
          if p.name.startswith(("libquadmath", "libgfortran", "libgomp", "libavcodec", "libavformat", "libavutil", "libswscale", "libswresample"))
      ]
      assert not bad_libs, bad_libs
      bad_pkgs = [
          d.metadata.get("Name", "")
          for d in md.distributions()
          if (d.metadata.get("Name") or "").lower().startswith(("nvidia-", "cuda-"))
      ]
      assert not bad_pkgs, bad_pkgs
      weights = [
          str(p)
          for p in pathlib.Path("/opt/valis").rglob("*")
          if p.is_file() and p.suffix.lower() in (".pth", ".pt", ".ckpt", ".onnx", ".safetensors") and p.stat().st_size > 100_000
      ]
      assert not weights, weights
      try:
          superpoint.SuperPoint()
          raise AssertionError("Expected SuperPoint stub to raise RuntimeError")
      except RuntimeError as exc:
          assert "non-commercial" in str(exc)
      print(f"valis={md.version('valis-wsi')} cv2={cv2.__version__} vips={pyvips.version(0)}.{pyvips.version(1)}")
      PY
    expected_output_contains: "valis=${upstream_version}"

  - name: license notices and GPL-3.0 aicspylibczi source archive installed
    description: Verify VALIS MIT, OpenCV Apache-2.0, SciJava Unlicense, aicspylibczi GPL-3.0 notices, and corresponding aicspylibczi source tarball are installed.
    command: |
      set -e
      test -s /opt/valis/share/licenses/VALIS-LICENSE.txt
      grep -q "Permission is hereby granted, free of charge" /opt/valis/share/licenses/VALIS-LICENSE.txt
      test -s /opt/valis/share/licenses/OPENCV-LICENSE.txt
      grep -q "Apache License" /opt/valis/share/licenses/OPENCV-LICENSE.txt
      test -s /opt/valis/share/licenses/JGO-UNLICENSE.txt
      test -s /opt/valis/share/licenses/SCYJAVA-UNLICENSE.txt
      test -s /opt/valis/share/licenses/AICSPYLIBCZI-LICENSE.txt
      test -s /opt/valis/share/licenses/GPL-3.0.txt
      ls /opt/valis/share/src/aicspylibczi-*.tar.gz >/dev/null
      echo "licenses and sources ok"
    expected_output_contains: "licenses and sources ok"

  - name: wrapper isolates process-group signals, cleans up on SIGHUP, and preserves piped and PTY stdin
    description: Verify the installed valis-info wrapper handles SIGHUP cleanup, noexec /tmp, and foreground PTY stdin cleanly.
    command: |
      set -e
      /usr/bin/python3 - <<'PY'
      import fcntl, os, pty, select, signal, subprocess, sys, tempfile, termios, time

      src = open("/opt/valis/wrappers/valis-info").read()
      py = sys.executable

      def make_wrapper(path, stub_path):
          patched = src.replace(
              'cmd = ["/opt/valis/bin/valis-info", *sys.argv[1:]]',
              f'cmd = [{py!r}, {stub_path!r}, *sys.argv[1:]]',
          )
          assert patched != src
          open(path, "w").write(patched)

      def run_in_pty(argv, env, send_bytes=None):
          master, slave = pty.openpty()
          def preexec():
              os.setsid()
              fcntl.ioctl(slave, termios.TIOCSCTTY, 0)
          p = subprocess.Popen(argv, env=env, stdin=slave, stdout=slave, stderr=slave, preexec_fn=preexec, close_fds=True)
          os.close(slave)
          if send_bytes:
              os.write(master, send_bytes)
          out = bytearray()
          deadline = time.time() + 6.0
          while time.time() < deadline:
              r, _, _ = select.select([master], [], [], 0.1)
              if r:
                  try:
                      chunk = os.read(master, 4096)
                      if not chunk:
                          break
                      out += chunk
                  except OSError:
                      break
              if p.poll() is not None and not r:
                  break
          rc = p.wait(timeout=5)
          os.close(master)
          return rc, out.decode("utf-8", "replace")

      with tempfile.TemporaryDirectory() as td:
          stub = os.path.join(td, "stub.py")
          open(stub, "w").write(
              "import os, signal, sys, time\n"
              "if sys.argv[1] == 'stdin':\n"
              "    print('GOT:' + sys.stdin.readline().strip(), flush=True)\n"
              "    raise SystemExit(0)\n"
              "log, ready = sys.argv[2], sys.argv[3]\n"
              "seen = []\n"
              "def h(sig, _):\n"
              "    seen.append(sig)\n"
              "    open(log, 'a').write(f'{sig}\\n')\n"
              "signal.signal(signal.SIGINT, h)\n"
              "signal.signal(signal.SIGHUP, h)\n"
              "open(ready, 'w').write(os.environ.get('TORCH_HOME', '') + '\\n')\n"
              "deadline = time.time() + 5.0\n"
              "while not seen and time.time() < deadline:\n"
              "    time.sleep(0.02)\n"
              "time.sleep(0.25)\n"
              "raise SystemExit(128 + seen[0] if seen else 0)\n"
          )
          wrapper = os.path.join(td, "wrapper.py")
          make_wrapper(wrapper, stub)

          env = os.environ.copy()
          for k in ("TORCH_HOME", "TORCHINDUCTOR_CACHE_DIR", "MPLCONFIGDIR", "XDG_CACHE_HOME", "XDG_CONFIG_HOME"):
              env.pop(k, None)

          r = subprocess.run([py, wrapper, "stdin"], input="valis-pipe\n", capture_output=True, text=True, env=env, timeout=10)
          assert r.returncode == 0 and r.stdout.strip() == "GOT:valis-pipe", (r.returncode, r.stdout, r.stderr)

          rc, out = run_in_pty([py, wrapper, "stdin"], env=env, send_bytes=b"valis-pty\n")
          assert rc == 0 and "GOT:valis-pty" in out, (rc, out)

          log_hup, ready_hup = os.path.join(td, "hup.log"), os.path.join(td, "hup.ready")
          p_hup = subprocess.Popen([py, wrapper, "sig", log_hup, ready_hup], env=env, start_new_session=True)
          dl = time.time() + 5.0
          while not os.path.exists(ready_hup) and time.time() < dl:
              time.sleep(0.02)
          assert os.path.exists(ready_hup), "hup stub did not become ready"
          scratch_dir = open(ready_hup).read().strip()
          assert scratch_dir and os.path.isdir(scratch_dir), scratch_dir
          os.kill(p_hup.pid, signal.SIGHUP)
          rc_hup = p_hup.wait(timeout=10)
          sigs_hup = [int(x) for x in open(log_hup).read().splitlines() if x.strip()]
          assert rc_hup == 128 + signal.SIGHUP.value and sigs_hup == [signal.SIGHUP.value], (rc_hup, sigs_hup)
          assert not os.path.exists(os.path.dirname(scratch_dir)), scratch_dir
      print("wrapper signal and stdin ok")
      PY
    expected_output_contains: "wrapper signal and stdin ok"

  - name: offline serial histology feature detection, matching, and pyvips warp registration
    description: Synthesize two rigidly displaced histology-like RGB slides, extract OpenCV contrib VGG features, match via VALIS Matcher, estimate transform, and warp via pyvips under unset/read-only HOME.
    command: |
      set -e
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      env -u HOME -u USER -u LOGNAME -u TORCH_HOME -u TORCHINDUCTOR_CACHE_DIR -u MPLCONFIGDIR -u XDG_CACHE_HOME -u XDG_CONFIG_HOME         /opt/valis/bin/python - "$tmpdir" <<'PY'
      import os
      import sys
      import cv2
      import numpy as np
      import pyvips
      from valis import feature_detectors, feature_matcher, warp_tools

      td = sys.argv[1]
      # Synthesize a textured 384x384 histology-like RGB image (glandular rings + nuclei)
      rng = np.random.default_rng(7)
      base = np.full((384, 384, 3), 235, dtype=np.uint8)
      for _ in range(45):
          cx, cy = int(rng.integers(60, 324)), int(rng.integers(60, 324))
          rx, ry = int(rng.integers(10, 28)), int(rng.integers(8, 22))
          ang = float(rng.uniform(0, 180))
          col = (int(rng.integers(120, 210)), int(rng.integers(70, 140)), int(rng.integers(130, 200)))
          cv2.ellipse(base, (cx, cy), (rx, ry), ang, 0, 360, col, -1)
          cv2.ellipse(base, (cx, cy), (max(3, rx // 2), max(3, ry // 2)), ang, 0, 360, (90, 55, 130), 2)

      # Apply a known rigid rotation + translation
      M_true = cv2.getRotationMatrix2D((192.0, 192.0), 6.0, 1.0)
      M_true[0, 2] += 10.0
      M_true[1, 2] -= 8.0
      moved = cv2.warpAffine(base, M_true, (384, 384), borderValue=(235, 235, 235))

      # Save via pyvips and reload via pyvips to verify libvips TIFF I/O
      p_a = os.path.join(td, "slide_a.tif")
      p_b = os.path.join(td, "slide_b.tif")
      pyvips.Image.new_from_array(base).tiffsave(p_a)
      pyvips.Image.new_from_array(moved).tiffsave(p_b)
      img_a = pyvips.Image.new_from_file(p_a).numpy()
      img_b = pyvips.Image.new_from_file(p_b).numpy()

      gray_a = cv2.cvtColor(img_a, cv2.COLOR_RGB2GRAY)
      gray_b = cv2.cvtColor(img_b, cv2.COLOR_RGB2GRAY)

      fd = feature_detectors.VggFD()
      kp_a, desc_a = fd.detect_and_compute(gray_a)
      kp_b, desc_b = fd.detect_and_compute(gray_b)
      assert len(kp_a) > 50 and len(kp_b) > 50, (len(kp_a), len(kp_b))

      matcher = feature_matcher.Matcher()
      match_info, filtered_info, _, _ = matcher.match_images(
          gray_a, desc_a, kp_a, gray_b, desc_b, kp_b
      )
      assert len(filtered_info.matched_kp1_xy) >= 20, len(filtered_info.matched_kp1_xy)

      M_est, inliers = cv2.estimateAffinePartial2D(
          filtered_info.matched_kp1_xy, filtered_info.matched_kp2_xy
      )
      assert M_est is not None and inliers.sum() >= 15
      err = float(np.max(np.abs(M_est - M_true)))
      assert err < 1.5, (M_est, M_true, err)
      print(f"valis registration ok matches={len(filtered_info.matched_kp1_xy)} err={err:.3f}")
      PY
    expected_output_contains: "valis registration ok"

  - name: runtime hook preserves cache across fork and cleans up on SIGTERM/SIGHUP (including PID 1)
    description: Verify direct /opt/valis/bin/python keeps parent cache across os.fork()+sys.exit(0), cleans up on SIGTERM/SIGHUP, and exits cleanly under the PID 1 signal path.
    command: |
      set -e
      /usr/bin/python3 - <<'PY'
      import os, pathlib, signal, subprocess, tempfile

      py = "/opt/valis/bin/python"
      with tempfile.TemporaryDirectory() as td:
          env = {"PATH": os.environ["PATH"], "TMPDIR": td}

          fork_code = (
              "import os, sys, _valis_runtime as rt\n"
              "root = rt._CACHE_ROOT\n"
              "assert root is not None and root.is_dir(), root\n"
              "pid = os.fork()\n"
              "if pid == 0:\n"
              "    sys.exit(0)\n"
              "_, st = os.waitpid(pid, 0)\n"
              "assert os.WIFEXITED(st) and os.WEXITSTATUS(st) == 0, st\n"
              "assert root.is_dir(), root\n"
              "print(root)\n"
          )
          r = subprocess.run([py, "-c", fork_code], env=env, capture_output=True, text=True, timeout=30)
          assert r.returncode == 0, (r.returncode, r.stdout, r.stderr)
          assert not pathlib.Path(r.stdout.strip()).exists(), r.stdout

          for sig in (signal.SIGTERM, signal.SIGHUP):
              sp = subprocess.Popen(
                  [py, "-c", "import time, _valis_runtime as rt; print(rt._CACHE_ROOT, flush=True); time.sleep(30)"],
                  env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              cdir = sp.stdout.readline().strip()
              assert cdir and os.path.isdir(cdir), cdir
              os.kill(sp.pid, sig)
              rc = sp.wait(timeout=10)
              assert rc == -sig.value, (sig, rc, sp.stderr.read())
              assert not os.path.exists(cdir), cdir

              pid1_code = (
                  "import os, time, _valis_runtime as rt\n"
                  "rt._CACHE_OWNER_PID = 1\n"
                  "os.getpid = lambda: 1\n"
                  "print(rt._CACHE_ROOT, flush=True)\n"
                  "time.sleep(30)\n"
              )
              sp1 = subprocess.Popen(
                  [py, "-c", pid1_code],
                  env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              cdir1 = sp1.stdout.readline().strip()
              assert cdir1 and os.path.isdir(cdir1), cdir1
              os.kill(sp1.pid, sig)
              rc1 = sp1.wait(timeout=10)
              assert rc1 == 128 + sig.value, (sig, rc1, sp1.stderr.read())
              assert not os.path.exists(cdir1), cdir1
          assert os.listdir(td) == [], os.listdir(td)
      print("runtime hook signal and fork ok")
      PY
    expected_output_contains: "runtime hook signal and fork ok"
