name: meganorm
version: 0.2.2
meganorm_version: "0.2.2"

tests:
  - name: meganorm launcher is on PATH
    description: The deployed bin must resolve, since upstream ships no console_scripts of its own.
    command: command -v meganorm
    expected_output_contains: "meganorm"

  - name: meganorm CLI runs and shows its arguments
    description: Exercises the argparse entrypoint in meganorm.src.mainParallel through the wrapper.
    command: meganorm --help
    expected_output_contains: "--surfaces_dir"

  - name: package reports the packaged version
    description: >-
      Guards against the venv resolving a different meganorm than the recipe
      pins, and against meganorm.__version__ regressing to the AttributeError
      it raised upstream -- __init__.py never imported the _version module the
      wheel ships.
    command: |
      meganorm-python -c "
      import importlib.metadata as md
      import meganorm
      assert meganorm.__version__ == md.version('meganorm'), meganorm.__version__
      print(meganorm.__version__)
      "
    expected_output_contains: "${meganorm_version}"

  - name: dependency stack imports
    description: onnxruntime and pcntoolkit are imported lazily at run time, so check them explicitly.
    command: meganorm-python -c "import mne, mne_bids, mne_icalabel, pcntoolkit, onnxruntime; print('stack ok')"
    expected_output_contains: "stack ok"

  - name: matplotlib writes its cache outside HOME
    description: $HOME does not exist at container runtime; MPLCONFIGDIR must point somewhere writable.
    command: meganorm-python -c "import matplotlib; matplotlib.use('Agg'); import matplotlib.pyplot as plt; print('mpl ok')"
    expected_output_contains: "mpl ok"

  - name: only the tool's own commands are exported to the session
    description: >-
      Loading the module used to export 25 commands, python, python3,
      python3.12 and pip3.12 among them, which shadowed the host interpreter
      for the rest of the session: a later pip install or DataLad call silently
      ran this container's python. Transparent Singularity writes one wrapper
      per name in DEPLOY_BINS, so that list -- not the container's own PATH --
      is what reaches the user's shell. The venv is on PATH in here by design,
      so python3.12 is reachable inside the container and asking whether it
      resolves proves nothing; what matters is that it is never exported, and
      that every name that is exported resolves to something.
    command: |
      for want in meganorm meganorm-python; do
        echo "${DEPLOY_BINS}" | tr ':' '\n' | grep -qx -- "${want}" || {
          echo "NOT EXPORTED: ${want}"; exit 1; }
      done
      for bin in $(echo "${DEPLOY_BINS}" | tr ':' ' '); do
        case "${bin}" in
          python|python3|python3.*|pip|pip3|pip3.*)
            echo "INTERPRETER EXPORTED: ${bin}"; exit 1 ;;
        esac
        command -v "${bin}" > /dev/null || {
          echo "EXPORTED BUT MISSING: ${bin}"; exit 1; }
      done
      echo "exported: ${DEPLOY_BINS}"
      echo "own-commands-only"
    expected_output_contains: "own-commands-only"

  - name: an example configuration ships and loads
    description: >-
      The CLI requires a JSON configuration as its fourth positional argument.
      Both shipped examples must load into the installed model.
    command: |
      meganorm-python -c "
      from meganorm.utils.IO import Config
      for name in ('default', 'eeg'):
          Config.load('/opt/meganorm/configs/%s.json' % name)
      print('configs-load')
      "
    expected_output_contains: "configs-load"

  - name: the shipped defaults are self-consistent
    description: >-
      Check usable ICA and spectral defaults, separated EEG reject/flat
      thresholds, complete band definitions and a spectral range covering
      every band. The end-to-end run below checks the resulting features.
    command: |
      meganorm-python -c "
      from meganorm.utils.IO import Config
      c = Config()
      assert c.ica_method == 'infomax', c.ica_method
      assert c.psd_parametrization_method == 'specparam', c.psd_parametrization_method
      assert 0 < c.eeg_flat_threshold < c.eeg_var_threshold / 10
      bands = set(c.freq_bands)
      assert all(r.numerator in bands and r.denominator in bands
                 for r in c.power_band_ratios_list), 'ratio names missing band'
      assert c.psd_parametrization_freq_range_low <= min(lo for lo, hi in c.freq_bands.values()), \
          'a band lies below the parametrisation floor'
      assert bands <= set(c.individualized_band_ranges) | {'Broadband'}, \
          'individualized_band_ranges misses a band'
      print('defaults-consistent')
      "
    expected_output_contains: "defaults-consistent"

  - name: no re-referencing is reachable by both documented spellings
    description: >-
      The documented {"average", "REST", None} third option was unreachable in
      both directions upstream: a JSON null failed pydantic validation, and the
      string "None" passed the truthiness guard into mne.set_eeg_reference,
      which raises. Both spellings must validate in the shipped model.
    command: |
      meganorm-python -c "
      from meganorm.utils.IO import Config
      assert Config(rereference_method=None).rereference_method is None
      assert Config(rereference_method='None').rereference_method == 'None'
      print('none-accepted')
      "
    expected_output_contains: "none-accepted"

  - name: band powers and ratios retain the upstream logarithmic scale
    description: Container compatibility patches must preserve the natural logarithmic units published in 0.2.2.
    command: |
      meganorm-python -c "
      import numpy as np
      from meganorm.src.featureExtraction import abs_canonical_power, abs_individual_power, band_power_ratio
      freqs = np.array([1., 2., 3., 4.])
      psd = np.array([2., 2., 4., 4.])
      assert np.isclose(abs_canonical_power(psd, freqs, 1, 2), np.log(2.))
      assert np.isclose(abs_individual_power(psd, freqs, [(1.5, 2., 1.)], {'Delta': (-0.5, 0.5)}, 'Delta'), np.log(2.))
      assert np.isclose(band_power_ratio(psd, freqs, 1, 2, 3, 4), np.log(0.5))
      assert np.isnan(abs_canonical_power(np.zeros(4), freqs, 1, 2))
      assert np.isnan(band_power_ratio(np.zeros(4), freqs, 1, 2, 3, 4))
      print('log-power-ok')
      "
    expected_output_contains: "log-power-ok"

  - name: the shipped EEG config completes a run with finite features
    description: >-
      The candidate-container report showed why field assertions are not
      enough; its build satisfied every static check while writing -inf into
      ten of forty-two features. This synthesizes a short 10-20 EEG recording,
      runs the real CLI on the shipped eeg.json, and requires every feature
      the config promises to be present and finite; it then reruns with an
      impossible min_r_squared and requires the loud empty-table failure
      instead of an empty CSV with exit 0. The two pipeline runs take a few
      minutes -- about four on the build runner -- so this cannot live under
      the runner's default 120 s budget.
    command: meganorm-python /opt/meganorm/selftest.py
    expected_output_contains: "SELFTEST PASS"
    timeout: 900
