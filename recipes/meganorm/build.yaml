name: meganorm
version: 0.2.2

description: MEGaNorm extracts EEG/MEG-derived phenotypes with MNE-Python and fits normative models over them with PCNToolkit.

copyright:
  - license: GPL-3.0-only
    url: https://github.com/ML4PNP/MEGaNorm/blob/main/LICENSE

architectures:
  - x86_64

variables:
  meganorm_venv: /opt/meganorm-{{ context.version }}
  # Upstream requires python >= 3.12 (setup.py). Ubuntu 24.04 ships 3.12 as its
  # system python, so no conda/deadsnakes layer is needed here.
  python_package: python3.12
  meganorm_version: "0.2.2"
  picard_version: "0.8.2"

auto_update:
  method: sources
  container_version: meganorm
  sources:
    - id: meganorm
      method: pypi
      package: meganorm
      target:
        variable: meganorm_version
        fulltest_variable: meganorm_version
    - id: picard
      dependency: true
      method: pypi
      package: python-picard
      target:
        variable: picard_version

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        MEGANORM_VENV: "{{ context.meganorm_venv }}"
        # These default under $HOME, which does not exist at container runtime.
        MPLCONFIGDIR: /tmp/matplotlib-meganorm
        XDG_CACHE_HOME: /tmp/cache-meganorm
        NUMBA_CACHE_DIR: /tmp/numba-meganorm
        PYTHONNOUSERSITE: "1"
        # The module wrapper runs this container with --cleanenv, so the
        # host's OMP_NUM_THREADS never arrives and OpenBLAS would otherwise
        # start one thread per node core regardless of the job's allocation.
        # Default to single-threaded BLAS -- the pipeline parallelises with
        # joblib worker processes, not BLAS threads -- and let callers raise
        # it with SINGULARITYENV_OMP_NUM_THREADS / APPTAINERENV_OMP_NUM_THREADS,
        # which override these values.
        OMP_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        PATH: "{{ context.meganorm_venv }}/bin:$PATH"

    - install:
        - ca-certificates
        # PyTensor compiles its graphs with a C++ compiler; pcntoolkit's PyMC
        # sampling runs severely degraded in pure-python mode without one. The
        # first build warned "g++ not detected!".
        - g++
        # matplotlib/seaborn and MNE's plotting paths need these at import time.
        - fonts-dejavu-core
        - libgl1
        - libglib2.0-0t64
        # onnxruntime (via mne-icalabel) links against libgomp.
        - libgomp1
        - libsm6
        - libxext6
        - libxrender1
        - python3
        - python3-pip
        - python3-venv

    - run:
        - python3 -m venv "${MEGANORM_VENV}"
        - . "${MEGANORM_VENV}/bin/activate" && python -m pip install --no-cache-dir --upgrade pip setuptools wheel
        # python-picard is not in meganorm's dependency list, but "picard" is
        # one of the three documented ica_method values and MNE needs the
        # package to run it; without it the option dies on an ImportError.
        - . "${MEGANORM_VENV}/bin/activate" && python -m pip install --no-cache-dir "meganorm=={{ context.meganorm_version }}" "python-picard=={{ context.picard_version }}"
        - . "${MEGANORM_VENV}/bin/activate" && python -m pip check
        # Fail the build here rather than shipping an image that only breaks on
        # first use: the heavy optional stack (onnxruntime, pcntoolkit) is what
        # tends to go missing, and it is imported lazily at run time.
        - . "${MEGANORM_VENV}/bin/activate" && python -c "import importlib.metadata as md; import meganorm, mne, mne_bids, mne_icalabel, pcntoolkit, onnxruntime, picard; print('meganorm', md.version('meganorm'))"
        # Keep the compatibility fixes still needed in 0.2.2. Runtime tests
        # check complete band definitions, usable defaults and empty-output errors.
        - . "${MEGANORM_VENV}/bin/activate" && python {{ get_file("fix_working_defaults") }}
        # Assert on the model itself, not on the patch having run: these are
        # the properties a run depends on. The end-to-end proof that they hold
        # in practice is the selftest below.
        - >-
          . "${MEGANORM_VENV}/bin/activate" && python -c "import meganorm; from meganorm.utils.IO import Config; c=Config(); assert c.ica_method=='infomax', c.ica_method; assert c.psd_parametrization_method=='specparam', c.psd_parametrization_method; assert 0 < c.eeg_flat_threshold < c.eeg_var_threshold/10, (c.eeg_flat_threshold, c.eeg_var_threshold); bands=set(c.freq_bands); missing=[r for r in c.power_band_ratios_list if r.numerator not in bands or r.denominator not in bands]; assert not missing, missing; assert c.psd_parametrization_freq_range_low <= min(lo for lo, hi in c.freq_bands.values()), 'a band lies below the parametrisation floor'; assert bands <= set(c.individualized_band_ranges) | {'Broadband'}, 'individualized_band_ranges misses a band'; assert Config(rereference_method=None).rereference_method is None, 'JSON null rereference rejected'; assert meganorm.__version__ == '{{ context.version }}', meganorm.__version__; print('defaults can complete a run')"
        # The config file is a required argument with no example anywhere in the
        # package, so the documented invocation could not be followed.
        - . "${MEGANORM_VENV}/bin/activate" && python {{ get_file("write_example_configs") }} /opt/meganorm/configs
        - chmod -R a+rX /opt/meganorm/configs

    - copy:
        - meganorm
        - /usr/local/bin/meganorm

    - copy:
        - meganorm_python_helper
        - /usr/local/bin/meganorm-python

    # Baked into the image so CI's release tests and any user can rerun the
    # end-to-end check against the exact artifact they are holding.
    - copy:
        - selftest
        - /opt/meganorm/selftest.py

    - run:
        - chmod 755 /usr/local/bin/meganorm /usr/local/bin/meganorm-python
        - chmod 644 /opt/meganorm/selftest.py
        - meganorm-python -c "import meganorm; print('meganorm-python ok')"
        - chmod -R a+rX "${MEGANORM_VENV}"
        - rm -rf /root/.cache/pip /tmp/matplotlib-meganorm /tmp/cache-meganorm /tmp/numba-meganorm

    - workdir: /opt

    - test:
        name: Simple Deploy Bins/Path Test
        builtin: test_deploy.sh

    - test:
        name: Test MEGaNorm CLI and imports
        script: |
          #!/bin/bash
          set -e
          meganorm --help
          meganorm-python -c "import importlib.metadata as md; import meganorm; assert meganorm.__version__ == md.version('meganorm'); print(md.version('meganorm'))"
          meganorm-python -c "import mne, mne_bids, mne_icalabel, pcntoolkit, onnxruntime; print('stack ok')"
          # The config argument is mandatory, so an example has to exist and
          # has to load back into the model.
          meganorm-python -c "
          from meganorm.utils.IO import Config
          for name in ('default', 'eeg'):
              cfg = Config.load('/opt/meganorm/configs/%s.json' % name)
              print(name, 'config loads')
          "
          # The defaults must be able to complete a run: every one of these
          # aborted the pipeline or silently emptied its output, and a band
          # below the parametrisation floor put -inf into the feature table.
          meganorm-python -c "
          from meganorm.utils.IO import Config
          c = Config()
          assert c.ica_method == 'infomax'
          assert c.psd_parametrization_method == 'specparam'
          assert 0 < c.eeg_flat_threshold < c.eeg_var_threshold / 10
          bands = set(c.freq_bands)
          assert all(r.numerator in bands and r.denominator in bands for r in c.power_band_ratios_list)
          assert c.psd_parametrization_freq_range_low <= min(lo for lo, hi in c.freq_bands.values())
          assert bands <= set(c.individualized_band_ranges) | {'Broadband'}
          assert Config(rereference_method=None).rereference_method is None
          print('defaults ok')
          "

    - test:
        name: Shipped EEG config completes a run with finite features
        script: |
          #!/bin/bash
          set -e
          # Field-level assertions pass on builds whose output is unusable;
          # only a run catches that. This synthesizes a short EEG recording,
          # runs the real CLI on the shipped eeg.json, and requires every
          # promised feature to be present and finite -- then repeats the run
          # with an impossible min_r_squared and requires a loud failure
          # instead of an empty CSV and exit 0.
          meganorm-python /opt/meganorm/selftest.py

files:
  - name: fix_working_defaults
    contents: |
      """Apply the remaining container compatibility fixes for MEGaNorm 0.2.2.

      Upstream removed GEDAI, corrected the EEG flat threshold, creates output
      folders, and fits extended Infomax for ICLabel. Those older patches are no
      longer needed. Keep an Infomax default, complete the Delta band definitions
      and spectral range, accept the legacy string "None" for re-referencing,
      expose the installed version, and fail when no channels yield features.
      The runtime selftest checks the resulting feature values and failure path.
      """

      from importlib.util import find_spec
      from pathlib import Path

      package_spec = find_spec("meganorm")
      if package_spec is None or package_spec.submodule_search_locations is None:
          raise RuntimeError("meganorm is not installed")
      package_dir = Path(next(iter(package_spec.submodule_search_locations)))

      EDITS = {
          'utils/IO.py': [
              (
                  '    ica_method: Literal["fastica", "infomax", "picard"] = "fastica"\n',
                  '    ica_method: Literal["fastica", "infomax", "picard"] = "infomax"\n',
              ),
              (
                  '    freq_bands: Dict[str, Tuple[int, int]] = {\n'
                  '        "Theta": (3, 8),\n',
                  '    freq_bands: Dict[str, Tuple[int, int]] = {\n'
                  '        "Delta": (1, 3),\n'
                  '        "Theta": (3, 8),\n',
              ),
              (
                  '    psd_parametrization_freq_range_low: PositiveInt = 3\n',
                  '    psd_parametrization_freq_range_low: PositiveInt = 1\n',
              ),
              (
                  '    individualized_band_ranges: Dict[str, Tuple[int, int]] = {\n'
                  '        "Theta": (-2, 3),\n',
                  '    individualized_band_ranges: Dict[str, Tuple[int, int]] = {\n'
                  '        "Delta": (-1, 1),\n'
                  '        "Theta": (-2, 3),\n',
              ),
              (
                  '    rereference_method: Literal["average", "REST", None] = "average"\n',
                  '    rereference_method: Optional[Literal["average", "REST", "None"]] = (\n'
                  '        "average"\n'
                  '    )\n',
              ),
              (
                  '    ica_method : {"fastica", "infomax", "picard"}, default="fastica"\n',
                  '    ica_method : {"fastica", "infomax", "picard"}, default="infomax"\n',
              ),
              (
                  '        Canonical frequency band definitions (Theta, Alpha, Beta, Gamma).\n',
                  '        Canonical frequency band definitions (Delta, Theta, Alpha, Beta,\n'
                  '        Gamma).\n',
              ),
              (
                  '    psd_parametrization_freq_range_low, psd_parametrization_freq_range_high : PositiveInt, default=3, 40\n',
                  '    psd_parametrization_freq_range_low, psd_parametrization_freq_range_high : PositiveInt, default=1, 40\n',
              ),
          ],
          'src/preprocess.py': [
              (
                  '    if which_sensor["eeg"] and rereference_method:\n',
                  '    if which_sensor["eeg"] and rereference_method not in (None, "None"):\n',
              ),
          ],
          'src/featureExtraction.py': [
              (
                  '    logger.info(f"The shape of the extracted features: {final_df.shape}")\n',
                  '    if final_df.shape[1] == 0:\n'
                  '        raise Exception(\n'
                  '            "No features were extracted: every channel was discarded, "\n'
                  '            "most likely by the min_r_squared threshold during PSD "\n'
                  '            "parametrization. Lower min_r_squared or change "\n'
                  '            "psd_parametrization_method."\n'
                  '        )\n'
                  '\n'
                  '    logger.info(f"The shape of the extracted features: {final_df.shape}")\n',
              ),
          ],
          '__init__.py': [
              (
                  '__all__ = ["featureExtraction", "mainParallel", "preprocess", "psdParameterize"]\n',
                  '__all__ = ["featureExtraction", "mainParallel", "preprocess", "psdParameterize"]\n'
                  '\n'
                  'from ._version import __version__\n',
              ),
          ],
      }

      pending = {}
      for relative_path, replacements in EDITS.items():
          path = package_dir / relative_path
          source = path.read_text()
          for old, new in replacements:
              if source.count(old) != 1:
                  raise RuntimeError(
                      f"meganorm {relative_path} changed; review this patch:\n{old!r}"
                  )
              source = source.replace(old, new, 1)
          compile(source, str(path), "exec")
          pending[path] = source

      for path, source in pending.items():
          path.write_text(source)
          print(f"patched {path.relative_to(package_dir)}")
  - name: write_example_configs
    contents: |
      """Write example JSON configs from the installed pydantic model.

      The CLI requires a JSON config as its fourth positional argument. Keep
      default.json at the model defaults; eeg.json disables the MEG-only stages
      and saves the preprocessed recording. Round-trip both files before shipping.
      Runtime assets belong under /opt because HOME is unavailable at runtime.
      """

      import sys
      from pathlib import Path

      from meganorm.utils.IO import Config

      out_dir = Path(sys.argv[1])
      out_dir.mkdir(parents=True, exist_ok=True)

      Config().save(str(out_dir / "default.json"), overwrite=True)

      Config(
          which_sensor="eeg",
          save_preprocessed_data=True,
          apply_oversampled_temporal_projection=False,
          apply_Head_movement_correction=False,
          apply_environmental_noise_correction=False,
      ).save(str(out_dir / "eeg.json"), overwrite=True)

      # Round-trip both, so a file that cannot be loaded back fails the build rather
      # than a user's first run.
      for path in sorted(out_dir.glob("*.json")):
          Config.load(str(path))
          print(f"wrote {path}")
  - name: selftest
    contents: |
      """Run the shipped EEG configuration end to end and require finite features.

      The candidate-container test found that assertions on Config fields pass on
      builds whose actual output is unusable: the 20260824 candidate satisfied every
      field-level check while writing ten `-inf` values into its forty-two default
      EEG features, because the Delta band lay below the parametrisation floor. No
      static check catches that class of defect; only running the pipeline does.

      This script synthesizes a short 19-channel 10-20 EEG recording (1/f background
      plus an alpha rhythm, amplitudes inside the epoch rejection thresholds), runs
      the real CLI on it with the shipped `eeg.json`, and then holds the output to
      the contract the config states: one feature row, every band and every ratio
      the config promises present, and every value finite or absent -- never
      infinite. It then repeats the run with a min_r_squared no fit can reach and
      requires the pipeline to fail loudly instead of writing an empty CSV and
      exiting 0 -- the other defect class a field-level assertion cannot see. It
      runs with this interpreter's installed meganorm, so it exercises exactly what
      ships.

      Usage: python selftest.py [config.json] [work_dir]
      Defaults: /opt/meganorm/configs/eeg.json and a fresh temp directory.
      """

      import subprocess
      import sys
      import tempfile
      from pathlib import Path

      import numpy as np

      CONFIG = sys.argv[1] if len(sys.argv) > 1 else "/opt/meganorm/configs/eeg.json"
      WORK = Path(sys.argv[2]) if len(sys.argv) > 2 else Path(tempfile.mkdtemp())

      SFREQ = 250.0
      DURATION_S = 180
      CHANNELS = [
          "Fp1", "Fp2", "F7", "F3", "Fz", "F4", "F8", "T7", "C3", "Cz",
          "C4", "T8", "P7", "P3", "Pz", "P4", "P8", "O1", "O2",
      ]


      def synthesize_raw(path: Path) -> None:
          import mne

          rng = np.random.default_rng(42)
          n_samples = int(SFREQ * DURATION_S)
          freqs = np.fft.rfftfreq(n_samples, d=1.0 / SFREQ)

          data = np.empty((len(CHANNELS), n_samples))
          times = np.arange(n_samples) / SFREQ
          for idx in range(len(CHANNELS)):
              # 1/f background: shape white noise in the frequency domain.
              spectrum = np.fft.rfft(rng.standard_normal(n_samples))
              with np.errstate(divide="ignore"):
                  spectrum[1:] /= np.sqrt(freqs[1:])
              spectrum[0] = 0.0
              pink = np.fft.irfft(spectrum, n=n_samples)
              pink /= pink.std()
              # Alpha rhythm so the spectral model has a peak to fit.
              alpha = np.sin(2 * np.pi * 10.0 * times + rng.uniform(0, 2 * np.pi))
              # 3 uV of background + 1.5 uV of alpha: comfortably above the 1 uV
              # flat threshold and, at ~20-25 uV peak-to-peak per epoch, comfortably
              # under the 40 uV rejection threshold.
              data[idx] = 3e-6 * pink + 1.5e-6 * alpha

          info = mne.create_info(CHANNELS, SFREQ, ch_types="eeg")
          raw = mne.io.RawArray(data, info, verbose="error")
          raw.set_montage("standard_1020")
          raw.save(path, overwrite=True, verbose="error")


      def main() -> None:
          import json

          import pandas as pd

          raw_path = WORK / "sub-000_raw.fif"
          out_dir = WORK / "out"
          out_dir.mkdir(parents=True, exist_ok=True)
          synthesize_raw(raw_path)

          cmd = [
              sys.executable, "-m", "meganorm.src.mainParallel",
              str(raw_path), str(out_dir), "sub-000", CONFIG, "--line_freq", "50",
          ]
          print("running:", " ".join(cmd), flush=True)
          proc = subprocess.run(cmd)
          log = WORK / "Saved_outputs" / "log_summary" / "subject_sub-000_report.log"
          if proc.returncode != 0:
              if log.exists():
                  print(log.read_text()[-4000:], file=sys.stderr)
              raise SystemExit(f"pipeline exited {proc.returncode}")

          preprocessed = WORK / "Saved_outputs" / "Preprocessed_data" / "sub-000_preproc-raw.fif"
          if not preprocessed.is_file():
              raise SystemExit(f"preprocessed recording is missing: {preprocessed}")

          rejection_plot = WORK / "Saved_outputs" / "auto_reject_plot" / "sub-000_autoreject_res_plot.png"
          if not rejection_plot.is_file():
              raise SystemExit(f"autoreject plot is missing: {rejection_plot}")

          csv_path = out_dir / "sub-000.csv"
          if not csv_path.exists():
              raise SystemExit(f"pipeline exited 0 but wrote no {csv_path}")

          table = pd.read_csv(csv_path, index_col=0)
          if table.shape[0] != 1 or table.shape[1] == 0:
              raise SystemExit(f"feature table is empty: shape {table.shape}")

          values = table.to_numpy(dtype=float)
          n_finite = int(np.isfinite(values).sum())
          n_inf = int(np.isinf(values).sum())
          print(f"features: {table.shape[1]}, finite values: {n_finite}, inf: {n_inf}")

          # Infinities are the defect this test exists for: they propagate silently
          # into downstream normative models. nan is allowed -- it is the pipeline's
          # marker for a feature that could not be computed (e.g. no peak found).
          if n_inf:
              bad = sorted(
                  {c.split("__")[0] for c in table.columns if np.isinf(table[c]).any()}
              )
              raise SystemExit(f"{n_inf} infinite feature values, e.g. in: {bad[:10]}")
          if n_finite == 0:
              raise SystemExit("no finite feature values at all")

          # Every band and every ratio the config promises must appear, and the
          # canonical band powers -- the features the -inf defect hit -- must all be
          # finite, Delta included. Columns carry a parcel suffix ("__all" with the
          # default which_layout), so match on the feature name as a prefix.
          config = json.loads(Path(CONFIG).read_text())
          missing: list[str] = []
          not_finite: list[str] = []

          def check(name: str) -> None:
              matches = [c for c in table.columns if c.startswith(name + "__")]
              if not matches:
                  missing.append(name)
              elif not all(np.isfinite(table[c]).all() for c in matches):
                  not_finite.append(name)

          for band in config["freq_bands"]:
              for prefix in ("Adjusted", "OriginalPSD"):
                  if band == "Broadband" and prefix == "Adjusted":
                      continue
                  check(f"{prefix}_Canonical_Absolute_Power__{band}")
          for ratio in config["power_band_ratios_list"]:
              num, den = ratio["numerator"], ratio["denominator"]
              for prefix in ("Adjusted", "OriginalPSD"):
                  check(f"{prefix}_Band_Ratio__{num}_over_{den}")
          if missing:
              raise SystemExit(f"features promised by the config are absent: {missing}")
          if not_finite:
              raise SystemExit(f"band features with non-finite values: {not_finite}")
          print("positive run ok", flush=True)

          # Phase two: a run whose every channel is discarded must fail loudly.
          # Upstream wrote an 11-byte CSV, logged completion and exited 0, so a
          # whole cohort could produce empty files with clean exit statuses.
          strict = config | {"min_r_squared": 0.999999}
          strict_path = WORK / "strict.json"
          strict_path.write_text(json.dumps(strict))
          strict_out = WORK / "out_strict"
          strict_out.mkdir(parents=True, exist_ok=True)
          cmd = [
              sys.executable, "-m", "meganorm.src.mainParallel",
              str(raw_path), str(strict_out), "sub-001", str(strict_path),
              "--line_freq", "50",
          ]
          print("running:", " ".join(cmd), flush=True)
          proc = subprocess.run(cmd, capture_output=True, text=True)
          if proc.returncode == 0:
              raise SystemExit("all-channels-discarded run exited 0")
          if (strict_out / "sub-001.csv").exists():
              raise SystemExit("all-channels-discarded run still wrote a CSV")
          if "No features were extracted" not in proc.stderr:
              print(proc.stderr[-2000:], file=sys.stderr)
              raise SystemExit("failure was not the loud empty-table error")
          print("empty-table run fails loudly")

          print("SELFTEST PASS")


      if __name__ == "__main__":
          main()
  # Upstream declares no console_scripts (setup.py has no entry_points), but
  # meganorm/src/mainParallel.py carries the argparse CLI for the per-subject
  # pipeline and guards on __main__. Expose that as the module's entrypoint so
  # the container has something to deploy as a bin.
  - name: meganorm
    contents: |
      #!/usr/bin/env bash
      set -euo pipefail
      exec {{ context.meganorm_venv }}/bin/python -m meganorm.src.mainParallel "$@"
  - name: meganorm_python_helper
    contents: |
      #!/usr/bin/env bash
      # Run python from inside this container.
      #
      # meganorm and its stack are installed in the container's environment,
      # not on the host, so "import meganorm" only works with this interpreter.
      # The container does not put python on your PATH, because doing so
      # replaced the host interpreter for the rest of the shell.
      exec {{ context.meganorm_venv }}/bin/python "$@"

deploy:
  # Named individually rather than exporting the venv bin directory. That
  # exported 25 commands, among them python, python3, python3.12 and pip3.12,
  # which shadowed /opt/conda/bin/python for the rest of the session: a later
  # pip install, DataLad call or another module's tooling silently ran this
  # container's interpreter. The rest were transitive-dependency console
  # scripts (idna, markdown-it, undill, get_gprof, plotly_get_chrome) that have
  # nothing to do with this tool.
  bins:
    - meganorm
    - meganorm-python
    - normative
    - mne
    - mne_bids

categories:
  - electrophysiology
  - statistics
  - machine learning

icon: data:image/png;base64,

readme: |-
  ----------------------------------
  ## meganorm/{{ context.version }} ##

  MEGaNorm derives functional imaging-derived phenotypes from large-scale EEG
  and MEG datasets and fits normative models over them, so an individual
  recording can be placed against a population reference range. It wraps
  MNE-Python for preprocessing and feature extraction, and PCNToolkit for the
  normative modelling.

  ### Example

  ```
  meganorm sub-037_task-eyesclosed_eeg.set out/ sub-037 \
      /opt/meganorm/configs/eeg.json --line_freq 50
  ```

  The first argument is **one recording file**, not a BIDS root: it is handed
  straight to `mne.io.read_raw()`, and nothing in the pipeline does BIDS
  discovery, despite the argument being named `dir`. Pointing it at a dataset
  directory fails with `ValueError: Unsupported file type ()`.

  ### The config argument

  `configs` is required, and it is a path to a JSON file holding a typed
  model that rejects unknown keys. Two ready-made ones ship in the image:

  ```
  /opt/meganorm/configs/default.json   every field at its default
  /opt/meganorm/configs/eeg.json       EEG stages and saved preprocessed data
  ```

  Copy one and edit it. `eeg.json` is the place to start for EEG: the defaults
  are MEG-oriented, and it turns off oversampled temporal projection,
  head-movement correction and environmental-noise correction, which have
  nothing to act on in an EEG recording.

  ### Python

  MEGaNorm is a library first: most workflows import it rather than shelling
  out. Use `meganorm-python`, this container's interpreter:

  ```
  meganorm-python -c 'from meganorm.utils.IO import Config; print(Config())'
  ```

  `python` is deliberately not exported. The environment's bin directory put
  `python`, `python3`, `python3.12` and `pip3.12` on your PATH and shadowed the
  host interpreter for the rest of the session. `normative`, `mne` and
  `mne_bids` are exported as commands.

  ### Threads

  The image defaults `OMP_NUM_THREADS` and `OPENBLAS_NUM_THREADS` to 1: the
  module wrapper runs the container with `--cleanenv`, so a plain
  `OMP_NUM_THREADS` -- and `SLURM_CPUS_PER_TASK` -- never reaches the tool,
  and OpenBLAS otherwise started one thread per node core regardless of what
  the job asked for. The pipeline parallelises with joblib worker processes,
  which this default deliberately leaves single-threaded inside. To raise the
  BLAS budget, set `SINGULARITYENV_OMP_NUM_THREADS` (Apptainer also accepts
  `APPTAINERENV_OMP_NUM_THREADS`); those override the baked defaults.

  Source localization expects FreeSurfer surface reconstructions, passed via
  `--surfaces_dir`. FreeSurfer is not bundled in this container -- run it
  separately (see the `freesurfer` container) and mount the results.

  ### Container configuration

  MEGaNorm 0.2.2 removed GEDAI, fixed the EEG flat threshold and output
  directories, and uses extended Infomax for ICLabel. The container sets
  `ica_method` to `infomax`, adds the missing Delta band and individualized
  Delta range, and lowers `psd_parametrization_freq_range_low` to 1 Hz so the
  spectrum covers every configured band. The upstream spectral method
  default is now `specparam`.

  A run that discards every channel raises instead of writing an empty feature
  table and exiting 0. Absolute band powers and band ratios retain the natural
  logarithmic units published in MEGaNorm 0.2.2. `rereference_method` accepts
  JSON `null` and the string `"None"`. `meganorm.__version__` matches the
  installed package.

  Every build of this container synthesizes a short EEG recording, runs the
  pipeline end to end on the shipped `eeg.json`, and fails if any feature the
  config promises is missing or non-finite -- and then repeats the run with an
  impossible `min_r_squared` and fails unless the pipeline errors loudly. The
  same check is baked into the image, so you can run it against the copy you
  are holding:

  ```
  meganorm-python /opt/meganorm/selftest.py
  ```

  More documentation can be found here: https://github.com/ML4PNP/MEGaNorm

  Citation:
  ```
  MEGaNorm: normative modeling on large-scale EEG and MEG data.
  https://doi.org/10.5281/zenodo.15441320
  ```
