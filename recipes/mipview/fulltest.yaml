name: mipview
version: 0.6.2
tests:
- name: MipView launcher
  command: command -v mipview
  expected_output_contains: mipview
- name: MipView version
  command: python -c "from importlib.metadata import version; print(version('MipView'))"
  expected_output_contains: ${version}

- name: Exact NIfTI orientation and patch exports
  description: Verify every permuted voxel at its physical coordinate and both actual patch-save formats with unchanged data, affine and form codes
  command: |
    python - <<'PYTHON'
    from pathlib import Path
    import hashlib
    import tempfile

    import nibabel as nib
    import numpy as np
    from mipview.io.nifti_io import load_nifti
    from mipview.patch.extractor import extract_patch
    from mipview.patch.selector import PatchBounds
    from mipview.patch.saver import save_patch_nifti

    with tempfile.TemporaryDirectory(prefix='mipview-orientation-') as folder:
        root = Path(folder)
        source = root / 'permuted.nii.gz'
        data = np.arange(120,dtype=np.uint16).reshape(4,5,6)
        affine = np.array([[0,0,-2,10],[-3,0,0,12],[0,4,0,-20],[0,0,0,1]],dtype=float)
        image = nib.Nifti1Image(data,affine)
        image.set_qform(affine,code=2)
        image.set_sform(affine,code=1)
        image.to_filename(source)
        original_hash = hashlib.sha256(source.read_bytes()).hexdigest()
        loaded = load_nifti(source)
        expected = data.transpose(2,0,1)[::-1,:,::-1]
        expected_affine = np.array([[2,0,0,0],[0,-3,0,12],[0,0,-4,-4],[0,0,0,1]],dtype=float)
        assert loaded.shape == (6,4,5) and loaded.dtype == np.dtype('uint16')
        assert loaded.original_shape == (4,5,6)
        assert loaded.original_axcodes == ('P','S','L')
        np.testing.assert_array_equal(loaded.original_affine,affine)
        np.testing.assert_array_equal(loaded.data,expected)
        np.testing.assert_array_equal(loaded.affine,expected_affine)
        assert nib.aff2axcodes(loaded.affine) == ('R','P','I')
        np.testing.assert_array_equal(loaded.header.get_zooms(),(2,3,4))
        for x,y,z in np.ndindex(loaded.shape):
            original = (y,4-z,5-x)
            assert loaded.data[x,y,z] == data[original]
            np.testing.assert_array_equal(loaded.affine @ [x,y,z,1],affine @ [*original,1])
            np.testing.assert_array_equal(loaded.original_to_loaded_voxel_affine @ [*original,1],[x,y,z,1])
        bounds = PatchBounds(1,4,1,3,1,4)
        patch = extract_patch(loaded,bounds)
        patch_expected = expected[1:4,1:3,1:4]
        patch_affine = expected_affine.copy()
        patch_affine[:3,3] = [2,9,-8]
        assert patch.shape == (3,2,3)
        np.testing.assert_array_equal(patch.data,patch_expected)
        np.testing.assert_array_equal(patch.affine,patch_affine)
        for extension in ['.nii','.nii.gz']:
            destination = root / ('patch'+extension)
            assert save_patch_nifti(patch,destination) == destination
            exported = nib.load(destination)
            assert exported.shape == (3,2,3) and exported.get_data_dtype() == np.dtype('uint16')
            np.testing.assert_array_equal(np.asarray(exported.dataobj),patch_expected)
            np.testing.assert_array_equal(exported.affine,patch_affine)
            for form,code in [('qform',2),('sform',1)]:
                matrix,observed = getattr(exported.header,'get_'+form)(coded=True)
                assert observed == code
                np.testing.assert_array_equal(matrix,patch_affine)
            reopened = load_nifti(destination)
            np.testing.assert_array_equal(reopened.data,patch_expected)
            np.testing.assert_array_equal(reopened.affine,patch_affine)
        assert hashlib.sha256(source.read_bytes()).hexdigest() == original_hash
        print('MipView preserved all120 oriented voxels and exact physical patch exports in both NIfTI formats')
    PYTHON
  expected_output_contains: MipView preserved all120 oriented voxels and exact physical patch exports in both NIfTI formats
  expected_exit_code: 0
  timeout: 120

- name: Packaged Qt event loop starts offscreen
  description: Exercise the actual launcher with the released upstream CI startup mode and require native backend and IPC initialization
  command: |
    python - <<'PYTHON'
    import os
    import subprocess
    import tempfile
    from pathlib import Path
    with tempfile.TemporaryDirectory(prefix='mipview-qt-') as folder:
        root = Path(folder)
        env = os.environ.copy()
        env.update(QT_QPA_PLATFORM='offscreen', MIPVIEW_SMOKE_TEST='1', XDG_RUNTIME_DIR=str(root), XDG_CACHE_HOME=str(root/'cache'), XDG_CONFIG_HOME=str(root/'config'))
        result = subprocess.run(['mipview'], text=True, capture_output=True, env=env, timeout=90)
        print(result.stdout, result.stderr)
        assert result.returncode == 0, result.returncode
        for error in ['Traceback', 'VisPy backend initialization failed', 'MipView IPC server failed to start']:
            assert error not in result.stdout + result.stderr, error
        print('MipView packaged Qt event loop completed offscreen with its native backend')
    PYTHON
  expected_output_contains: MipView packaged Qt event loop completed offscreen with its native backend
  expected_exit_code: 0
  timeout: 120
