name: tpcclib
version: "0.8.2"

copyright:
  - license: GPL-3.0-or-later
    url: https://gitlab.utu.fi/vesoik/tpcclib/-/blob/{{ context.upstream_tag }}/license.md

architectures:
  - x86_64
  - aarch64

variables:
  upstream_tag: "0.8.2"
  upstream_version: "0.8.2"

auto_update:
  method: sources
  container_version: tpcclib
  sources:
    - id: tpcclib
      method: webpage
      url: https://gitlab.utu.fi/api/v4/projects/vesoik%2Ftpcclib/repository/tags?per_page=100
      version_regex: '"name":"(?P<version>v?\d+\.\d+\.\d+)"'
      target:
        variable: upstream_tag
        value: tag
        variables:
          upstream_version: version
    - id: source_archive_digest
      method: http_digest
      url: https://gitlab.utu.fi/vesoik/tpcclib/-/archive/{{ context.upstream_tag }}/tpcclib-{{ context.upstream_tag }}.tar.gz
      dependency: true
      target:
        file: source

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        PATH: /opt/tpcclib/bin:$PATH
    - install:
        - libgomp1
    - run:
        - apt-get update -qq
        - apt-get install -y --no-install-recommends build-essential cmake ninja-build
        - mkdir -p /tmp/tpcclib-src
        - tar -xzf {{ get_file("source") }} -C /tmp/tpcclib-src --strip-components=1
        - sed -i -e 's/ -mfpmath=sse//g' -e 's/ -static//g' /tmp/tpcclib-src/CMakeLists.txt
        - cmake -S /tmp/tpcclib-src -B /tmp/tpcclib-build -G Ninja -DCMAKE_BUILD_TYPE=Release
        - cmake --build /tmp/tpcclib-build --parallel "$(nproc)"
        - cmake --install /tmp/tpcclib-build --prefix /opt/tpcclib --component applications
        - mkdir -p /opt/tpcclib/share/licenses
        - cp -a /tmp/tpcclib-src/README.md /tmp/tpcclib-src/copying.md /tmp/tpcclib-src/license.md /opt/tpcclib/share/licenses/
        - chmod -R a+rX /opt/tpcclib
        - rm -rf /tmp/tpcclib-src /tmp/tpcclib-build
        - apt-get purge -y --auto-remove build-essential cmake ninja-build
        - rm -rf /var/lib/apt/lists/*

deploy:
  path:
    - /opt/tpcclib/bin

files:
  - name: source
    url: "https://gitlab.utu.fi/vesoik/tpcclib/-/archive/{{ context.upstream_tag }}/tpcclib-{{ context.upstream_tag }}.tar.gz"
    sha256: "c9d48ebb5ada13f2a04e5607052f062b9588df8a7c5f2bb4edff0d359a25f5b9"

domains:
  - neuroimaging
  - preclinical
  - molecular-imaging

categories:
  - molecular imaging
  - preclinical imaging
  - quantitative imaging

structured_readme:
  description: >-
    TPCCLIB is the Turku PET Centre C command-line tool suite for clinical and
    preclinical dynamic PET analysis, time-activity curves (TACs), input
    functions, kinetic modeling, and parametric imaging.
  example: taccalc --help
  documentation: https://www.turkupetcentre.net/tpcclib-doc/
  citation: >-
    Oikonen V, Johansson J, Liukko K, Merisaari H, Alenius S, Laakkonen C,
    Krais R. TPCCLIB: Turku PET Centre C library and command-line tools for
    processing and analysing PET data. https://gitlab.utu.fi/vesoik/tpcclib

readme: |
  ## tpcclib/{{ context.version }}

  TPCCLIB is the Turku PET Centre C command-line tool suite for clinical and
  preclinical dynamic PET data processing and analysis, including time-activity
  curve (TAC) manipulation, blood/plasma input function modeling, graphical
  analysis (Patlak and Logan plots), compartmental modeling, simulation, and
  PET image format utilities.

  This build compiles both `v1` and `v2` CLI applications from the official
  TPCCLIB {{ context.upstream_version }} source release and installs them under
  `/opt/tpcclib/bin`.

  Example:

  ```sh
  taccalc --version
  patlak --help
  logan --help
  ```

  License texts (`GPL-3.0-or-later`) are installed in `/opt/tpcclib/share/licenses`.
  [Upstream documentation](https://www.turkupetcentre.net/tpcclib-doc/)

icon: "data:image/png;base64,"
