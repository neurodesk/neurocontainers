name: template
version: 1.1.5
default_timeout: 120
test_data:
  output_dir: test_output
setup:
  script: |
    set -eu
    mkdir -p "${output_dir}"
tests:
- name: test datalad version
  description: Verify the container runtime smoke test for this tool.
  command: |
    datalad --version

- name: packaged DataLad and container extension are usable
  description: Load both installed Debian distributions and require the container-management extension help without contacting external services
  command: |
    set -euo pipefail
    dpkg-query -W datalad datalad-container git-annex
    python3 -c 'import datalad, datalad_container; print("DataLad and container extension imported")'
    datalad containers-list --help-np
  expected_output_contains:
    - DataLad and container extension imported
    - containers-list
  expected_exit_code: 0
- name: offline annex retrieval and exact recorded computation
  description: Clone a local annex dataset, retrieve every known input byte, execute a recorded deterministic transform and verify its complete output and provenance
  command: |
    set -euo pipefail
    task_dir=$(mktemp -d "${output_dir}/datalad-template.XXXXXXXX")
    task_dir=$(cd "$task_dir" && pwd)
    export GIT_CONFIG_GLOBAL="$task_dir/gitconfig"
    export GIT_CONFIG_SYSTEM=/dev/null
    export GIT_AUTHOR_NAME='NeuroContainers fulltest'
    export GIT_AUTHOR_EMAIL='fulltest@example.invalid'
    export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
    export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
    touch "$GIT_CONFIG_GLOBAL"
    datalad create "$task_dir/source"
    python3 - "$task_dir/source/signal.bin" <<'PYTHON'
    from pathlib import Path
    import sys
    Path(sys.argv[1]).write_bytes(bytes(range(256))*256)
    PYTHON
    git -C "$task_dir/source" annex add --force-large signal.bin
    (cd "$task_dir/source" && datalad save -m 'Save deterministic signal' signal.bin)
    source_key=$(git -C "$task_dir/source" annex lookupkey signal.bin)
    test -n "$source_key"
    datalad clone "$task_dir/source" "$task_dir/clone"
    clone_key=$(git -C "$task_dir/clone" annex lookupkey signal.bin)
    test "$clone_key" = "$source_key"
    test ! -f "$task_dir/clone/signal.bin"
    (cd "$task_dir/clone" && datalad get signal.bin)
    cmp "$task_dir/source/signal.bin" "$task_dir/clone/signal.bin"
    cd "$task_dir/clone"
    datalad run --explicit -i signal.bin -o transformed.bin -m 'Record deterministic byte transform' -- \
      python3 -c 'from pathlib import Path; Path("transformed.bin").write_bytes(bytes(v ^ 90 for v in Path("signal.bin").read_bytes()))'
    python3 - <<'PYTHON'
    from pathlib import Path
    import json
    import subprocess
    original=bytes(range(256))*256
    assert Path('signal.bin').read_bytes()==original
    assert Path('transformed.bin').read_bytes()==bytes(v ^ 90 for v in original)
    message=subprocess.check_output(['git','show','-s','--format=%B','HEAD'],text=True)
    assert '[DATALAD RUNCMD]' in message
    record=message.split('=== Do not change lines below ===',1)[1].split('^^^ Do not change lines above ^^^',1)[0]
    record=json.loads(record)
    assert record['exit']==0
    assert record['inputs']==['signal.bin'] and record['outputs']==['transformed.bin']
    assert record['dsid']
    assert 'python3' in record['cmd'] and 'transformed.bin' in record['cmd']
    assert subprocess.check_output(['git','status','--porcelain'],text=True)==''
    assert len(original)==65536
    PYTHON
    echo 'Template DataLad offline annex retrieval, exact transformed bytes and recorded run provenance verified'
  expected_output_contains: Template DataLad offline annex retrieval, exact transformed bytes and recorded run provenance verified
  expected_exit_code: 0
  timeout: 180
