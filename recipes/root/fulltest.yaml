# ROOT (CERN Data Analysis Framework) container test suite
# Tests for ROOT 6.22.02 - Object-oriented framework for large scale data analysis
#
# ROOT is developed by CERN and provides:
#   - Data processing and analysis capabilities
#   - Histogramming and fitting
#   - I/O in ROOT format (TFile, TTree)
#   - Mathematical functions and statistics
#   - 2D/3D graphics
#   - Multivariate analysis (TMVA)
#   - RooFit for statistical modeling

name: root
version: 6.24.06

test_data:
  output_dir: test_output

setup:
  script: |
    #!/usr/bin/env bash
    set -e
    mkdir -p test_output

tests:
  # ==========================================================================
  # VERSION AND CONFIGURATION CHECKS
  # ==========================================================================
  - name: ROOT version check
    description: Verify ROOT binary runs and reports version
    command: |
      set -euo pipefail
      root --version
    expected_output_contains: "ROOT Version"
    expected_exit_code: 0

  - name: ROOT config version
    description: Check root-config reports correct version
    command: |
      set -euo pipefail
      root-config --version | tr '/' '.'
    expected_output_contains: "${version}"
    expected_exit_code: 0

  - name: ROOT features list
    description: List all compiled features
    command: |
      set -euo pipefail
      root-config --features
    expected_output_contains: "roofit"
    expected_exit_code: 0

  - name: ROOT has FFTW3
    description: Check FFTW3 support is enabled
    command: |
      set -euo pipefail
      root-config --has-fftw3
    expected_output_contains: "yes"
    expected_exit_code: 0

  - name: ROOT has RooFit
    description: Check RooFit support is enabled
    command: |
      set -euo pipefail
      root-config --has-roofit
    expected_output_contains: "yes"
    expected_exit_code: 0

  - name: ROOT has TMVA
    description: Check TMVA support is enabled
    command: |
      set -euo pipefail
      root-config --has-tmva
    expected_output_contains: "yes"
    expected_exit_code: 0

  - name: ROOT has MathMore
    description: Check MathMore support is enabled
    command: |
      set -euo pipefail
      root-config --has-mathmore
    expected_output_contains: "yes"
    expected_exit_code: 0

  - name: ROOT has Minuit2
    description: Check Minuit2 support is enabled
    command: |
      set -euo pipefail
      root-config --has-minuit2
    expected_output_contains: "yes"
    expected_exit_code: 0

  - name: ROOT has PyROOT
    description: Check PyROOT support is enabled
    command: |
      set -euo pipefail
      root-config --has-pyroot
    expected_output_contains: "yes"
    expected_exit_code: 0

  - name: ROOT architecture
    description: Check ROOT build architecture
    command: |
      set -euo pipefail
      root-config --arch
    expected_output_contains: "linux"
    expected_exit_code: 0

  - name: ROOT library path
    description: Get ROOT library directory
    command: |
      set -euo pipefail
      root-config --libdir
    expected_exit_code: 0

  - name: ROOT include path
    description: Get ROOT include directory
    command: |
      set -euo pipefail
      root-config --incdir
    expected_exit_code: 0

  - name: ROOT linker flags
    description: Get ROOT linker flags
    command: |
      set -euo pipefail
      root-config --libs
    expected_output_contains: "-lCore"
    expected_exit_code: 0

  # ==========================================================================
  # BASIC INTERPRETER TESTS
  # ==========================================================================
  - name: ROOT interpreter basic test
    description: Test ROOT interpreter with simple expression
    command: |
      set -euo pipefail
      root -b -l -q -e 'gROOT->GetVersion()' -e '(void)0' 2>&1 | tr '/' '.'
    expected_output_contains: "${version}"

  - name: ROOT cout output
    description: Test cout in ROOT interpreter
    command: |
      set -euo pipefail
      root -b -l -q -e 'cout << "Hello ROOT!" << endl;' -e '(void)0' 2>&1
    expected_output_contains: "Hello ROOT!"

  # ==========================================================================
  # TMATH MATHEMATICAL FUNCTIONS
  # ==========================================================================
  - name: TMath Pi constant
    description: Test TMath Pi returns correct value
    command: |
      set -euo pipefail
      root -b -l -q -e 'TMath::Pi()' -e '(void)0' 2>&1
    expected_output_contains: "3.1415"

  - name: TMath E constant
    description: Test TMath E returns Eulers number
    command: |
      set -euo pipefail
      root -b -l -q -e 'TMath::E()' -e '(void)0' 2>&1
    expected_output_contains: "2.718"

  - name: TMath Abs function
    description: Test absolute value function
    command: |
      set -euo pipefail
      root -b -l -q -e 'cout << TMath::Abs(-42) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "42"

  - name: TMath Sqrt function
    description: Test square root function
    command: |
      set -euo pipefail
      root -b -l -q -e 'cout << TMath::Sqrt(16) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "4"

  - name: TMath Sin function
    description: Test sine function
    command: |
      set -euo pipefail
      root -b -l -q -e 'cout << TMath::Sin(TMath::Pi()/2) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "1"

  - name: TMath Cos function
    description: Test cosine function
    command: |
      set -euo pipefail
      root -b -l -q -e 'cout << TMath::Cos(0) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "1"

  - name: TMath Log function
    description: Test natural logarithm function
    command: |
      set -euo pipefail
      root -b -l -q -e 'cout << TMath::Log(TMath::E()) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "1"

  - name: TMath Exp function
    description: Test exponential function
    command: |
      set -euo pipefail
      root -b -l -q -e 'cout << TMath::Exp(0) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "1"

  - name: TMath Power function
    description: Test power function
    command: |
      set -euo pipefail
      root -b -l -q -e 'cout << TMath::Power(2,10) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "1024"

  - name: TMath Factorial
    description: Test factorial function
    command: |
      set -euo pipefail
      root -b -l -q -e 'cout << TMath::Factorial(5) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "120"

  - name: TMath Binomial
    description: Test binomial coefficient
    command: |
      set -euo pipefail
      root -b -l -q -e 'cout << TMath::Binomial(10,5) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "252"

  # ==========================================================================
  # RANDOM NUMBER GENERATION
  # ==========================================================================
  - name: TRandom3 generation
    description: Test TRandom3 random number generator
    command: |
      set -euo pipefail
      root -b -l -q -e 'TRandom3 rand(42); cout << rand.Rndm() << endl;' -e '(void)0' 2>&1
    expected_output_contains: "0.37454"

  - name: gRandom Gaussian
    description: Test Gaussian random number generation
    command: |
      set -euo pipefail
      root -b -l -q -e 'gRandom->SetSeed(123); cout << gRandom->Gaus(0,1) << endl;' -e '(void)0' 2>&1

  - name: gRandom Poisson
    description: Test Poisson random number generation
    command: |
      set -euo pipefail
      root -b -l -q -e 'gRandom->SetSeed(456); cout << gRandom->Poisson(5) << endl;' -e '(void)0' 2>&1

  - name: gRandom Exponential
    description: Test exponential random number generation
    command: |
      set -euo pipefail
      root -b -l -q -e 'gRandom->SetSeed(789); cout << gRandom->Exp(1) << endl;' -e '(void)0' 2>&1

  # ==========================================================================
  # VECTORS AND MATRICES
  # ==========================================================================
  - name: TVector3 magnitude
    description: Test TVector3 magnitude calculation
    command: |
      set -euo pipefail
      root -b -l -q -e 'TVector3 v(1,2,3); cout << v.Mag() << endl;' -e '(void)0' 2>&1
    expected_output_contains: "3.74166"

  - name: TVector3 dot product
    description: Test TVector3 dot product
    command: |
      set -euo pipefail
      root -b -l -q -e 'TVector3 v1(1,0,0); TVector3 v2(0,1,0); cout << v1.Dot(v2) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "0"

  - name: TVector3 cross product
    description: Test TVector3 cross product
    command: |
      set -euo pipefail
      root -b -l -q -e 'TVector3 v1(1,0,0); TVector3 v2(0,1,0); TVector3 v3 = v1.Cross(v2); cout << v3.Z() << endl;' -e '(void)0' 2>&1
    expected_output_contains: "1"

  - name: TLorentzVector mass
    description: Test TLorentzVector invariant mass
    command: |
      set -euo pipefail
      root -b -l -q -e 'TLorentzVector v(1,2,3,10); cout << v.M() << endl;' -e '(void)0' 2>&1
    expected_output_contains: "9.27"

  - name: TLorentzVector boost
    description: Test TLorentzVector beta calculation
    command: |
      set -euo pipefail
      root -b -l -q -e 'TLorentzVector v(1,0,0,10); cout << v.Beta() << endl;' -e '(void)0' 2>&1

  - name: TMatrixD creation
    description: Test TMatrixD diagonal matrix creation
    command: |
      set -euo pipefail
      root -b -l -q -e 'TMatrixD m(3,3); m(0,0)=1; m(1,1)=2; m(2,2)=3; m.Print();' -e '(void)0' 2>&1
    expected_output_contains: "3x3 matrix"

  - name: TMatrixD determinant
    description: Test TMatrixD determinant calculation
    command: |
      set -euo pipefail
      root -b -l -q -e 'TMatrixD m(2,2); m(0,0)=1; m(0,1)=2; m(1,0)=3; m(1,1)=4; cout << m.Determinant() << endl;' -e '(void)0' 2>&1
    expected_output_contains: "-2"

  - name: TVectorD operations
    description: Test TVectorD vector operations
    command: |
      set -euo pipefail
      root -b -l -q -e 'TVectorD v(3); v[0]=1; v[1]=2; v[2]=3; cout << v.Norm2Sqr() << endl;' -e '(void)0' 2>&1
    expected_output_contains: "14"

  # ==========================================================================
  # HISTOGRAM OPERATIONS
  # ==========================================================================
  - name: TH1F creation and fill
    description: Test 1D histogram creation and filling
    command: |
      set -euo pipefail
      root -b -l -q -e 'TH1F h("h","test",100,-5,5); h.FillRandom("gaus",10000); cout << "Entries " << h.GetEntries() << endl;' -e '(void)0' 2>&1
    expected_output_contains: "Entries 10000"

  - name: TH1F statistics
    description: Test histogram statistics mean and std dev
    command: |
      set -euo pipefail
      root -b -l -q -e 'TH1F h("h","test",100,-5,5); h.FillRandom("gaus",10000); cout << "Mean approx zero " << (TMath::Abs(h.GetMean()) < 0.5) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "Mean approx zero 1"

  - name: TH1D double precision histogram
    description: Test double precision 1D histogram
    command: |
      set -euo pipefail
      root -b -l -q -e 'TH1D h("h","test",50,0,100); for(int i=0;i<1000;i++) h.Fill(gRandom->Uniform(0,100)); cout << h.GetEntries() << endl;' -e '(void)0' 2>&1
    expected_output_contains: "1000"

  - name: TH2F 2D histogram
    description: Test 2D histogram creation (FillRandom needs TF2, so fill manually)
    command: |
      set -euo pipefail
      root -b -l -q -e 'TH2F h("h2","2D",50,-5,5,50,-5,5); for(int i=0;i<5000;i++) h.Fill(gRandom->Gaus(),gRandom->Gaus()); cout << h.GetEntries() << endl;' -e '(void)0' 2>&1
    expected_output_contains: "5000"

  - name: TH3F 3D histogram
    description: Test 3D histogram creation
    command: |
      set -euo pipefail
      root -b -l -q -e 'TH3F h("h3","3D",10,-1,1,10,-1,1,10,-1,1); for(int i=0;i<1000;i++) h.Fill(gRandom->Gaus(),gRandom->Gaus(),gRandom->Gaus()); cout << h.GetEntries() << endl;' -e '(void)0' 2>&1
    expected_output_contains: "1000"

  - name: TProfile histogram
    description: Test profile histogram
    command: |
      set -euo pipefail
      root -b -l -q -e 'TProfile p("p","profile",50,-5,5); for(int i=0;i<1000;i++){float x=gRandom->Gaus(); p.Fill(x,x*x);} cout << p.GetEntries() << endl;' -e '(void)0' 2>&1
    expected_output_contains: "1000"

  - name: Histogram integration
    description: Test histogram integral calculation
    command: |
      set -euo pipefail
      root -b -l -q -e 'TH1F h("h","test",100,0,10); for(int i=0;i<100;i++) h.SetBinContent(i+1,1); cout << h.Integral() << endl;' -e '(void)0' 2>&1
    expected_output_contains: "100"

  # ==========================================================================
  # FUNCTION OBJECTS
  # ==========================================================================
  - name: TF1 Gaussian function
    description: Test TF1 Gaussian function evaluation
    command: |
      set -euo pipefail
      root -b -l -q -e 'TF1 f("gaus","gaus",-5,5); f.SetParameters(1,0,1); cout << f.Eval(0) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "1"

  - name: TF1 polynomial
    description: Test TF1 polynomial function
    command: |
      set -euo pipefail
      root -b -l -q -e 'TF1 f("poly","[0]+[1]*x+[2]*x*x",-10,10); f.SetParameters(1,2,3); cout << f.Eval(2) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "17"

  - name: TF1 integration
    description: Test TF1 numerical integration
    command: |
      set -euo pipefail
      root -b -l -q -e 'TF1 f("f","x*x",0,3); cout << f.Integral(0,3) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "9"

  - name: TF1 derivative
    description: Test TF1 numerical derivative
    command: |
      set -euo pipefail
      root -b -l -q -e 'TF1 f("f","x*x",-10,10); cout << f.Derivative(3) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "6"

  - name: TF2 2D function
    description: Test TF2 2D function evaluation
    command: |
      set -euo pipefail
      root -b -l -q -e 'TF2 f("f","x*y",-10,10,-10,10); cout << f.Eval(3,4) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "12"

  # ==========================================================================
  # GRAPH OBJECTS
  # ==========================================================================
  - name: TGraph creation
    description: Test TGraph creation and point count
    command: |
      set -euo pipefail
      root -b -l -q -e 'TGraph g(5); for(int i=0;i<5;i++) g.SetPoint(i,i,i*i); cout << "Points " << g.GetN() << endl;' -e '(void)0' 2>&1
    expected_output_contains: "Points 5"

  - name: TGraph evaluation
    description: Test TGraph interpolation
    command: |
      set -euo pipefail
      root -b -l -q -e 'TGraph g(3); g.SetPoint(0,0,0); g.SetPoint(1,1,1); g.SetPoint(2,2,4); cout << g.Eval(1.5) << endl;' -e '(void)0' 2>&1

  - name: TGraphErrors with errors
    description: Test TGraphErrors creation
    command: |
      set -euo pipefail
      root -b -l -q -e 'TGraphErrors g(3); g.SetPoint(0,1,1); g.SetPointError(0,0.1,0.1); cout << g.GetErrorX(0) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "0.1"

  # ==========================================================================
  # FILE I/O OPERATIONS
  # ==========================================================================
  - name: Create ROOT file with histogram
    description: Create a ROOT file containing a histogram
    command: |
      set -euo pipefail
      root -b -l -q -e 'TFile f("test_output/test_hist.root","RECREATE"); TH1F h("h1","histogram",100,-5,5); h.FillRandom("gaus",10000); h.Write(); f.Close(); cout << "File created" << endl;' -e '(void)0' 2>&1
    expected_output_contains: "File created"
    validate:
      - output_exists: ${output_dir}/test_hist.root

  - name: Create ROOT file with tree
    description: Create a ROOT file containing a TTree
    command: |
      set -euo pipefail
      root -b -l -q -e 'TFile f("test_output/test_tree.root","RECREATE"); TTree t("tree","sample tree"); float x,y; t.Branch("x",&x,"x/F"); t.Branch("y",&y,"y/F"); for(int i=0;i<1000;i++){x=gRandom->Gaus(); y=gRandom->Gaus(); t.Fill();} t.Write(); f.Close(); cout << "File created" << endl;' -e '(void)0' 2>&1
    expected_output_contains: "File created"
    validate:
      - output_exists: ${output_dir}/test_tree.root

  - name: Read histogram from file
    description: Read a histogram from a ROOT file
    command: |
      set -euo pipefail
      root -b -l -q -e 'TFile f("test_output/test_hist.root"); TH1F *h=(TH1F*)f.Get("h1"); cout << "Entries " << h->GetEntries() << endl;' -e '(void)0' 2>&1
    depends_on: Create ROOT file with histogram
    expected_output_contains: "Entries 10000"

  - name: Read tree from file
    description: Read a TTree from a ROOT file and count entries
    command: |
      set -euo pipefail
      root -b -l -q -e 'TFile f("test_output/test_tree.root"); TTree *t=(TTree*)f.Get("tree"); cout << "Tree entries " << t->GetEntries() << endl;' -e '(void)0' 2>&1
    depends_on: Create ROOT file with tree
    expected_output_contains: "Tree entries 1000"

  # ==========================================================================
  # ROOT COMMAND LINE UTILITIES
  # ==========================================================================
  - name: rootls basic listing
    description: Test rootls to list ROOT file contents
    command: |
      set -euo pipefail
      rootls test_output/test_hist.root 2>&1
    depends_on: Create ROOT file with histogram
    expected_output_contains: "h1"
    expected_exit_code: 0

  - name: rootls long listing
    description: Test rootls with long listing format
    command: |
      set -euo pipefail
      rootls -l test_output/test_hist.root 2>&1
    depends_on: Create ROOT file with histogram
    expected_output_contains: "TH1F"
    expected_exit_code: 0

  - name: rootls tree listing
    description: Test rootls with tree listing format
    command: |
      set -euo pipefail
      rootls -t test_output/test_tree.root 2>&1
    depends_on: Create ROOT file with tree
    expected_output_contains: "tree"
    expected_exit_code: 0

  - name: rootmkdir create directory
    description: Test rootmkdir to create directory in ROOT file
    command: |
      set -euo pipefail
      rootmkdir test_output/test_hist.root:newdir 2>&1 && rootls test_output/test_hist.root:* 2>&1
    depends_on: Create ROOT file with histogram
    expected_output_contains: "newdir"
    expected_exit_code: 0

  - name: rootcp copy object
    description: Test rootcp to copy histogram to new file
    command: |
      set -euo pipefail
      rootcp test_output/test_hist.root:h1 test_output/copy_hist.root 2>&1 && rootls test_output/copy_hist.root 2>&1
    depends_on: Create ROOT file with histogram
    expected_output_contains: "h1"
    expected_exit_code: 0

  - name: hadd help check
    description: Test hadd utility is available
    command: |
      set -euo pipefail
      hadd --help 2>&1
    expected_output_contains: "TARGET"
    expected_exit_code: 1

  - name: hadd merge files
    description: Test hadd to merge ROOT files
    command: |
      set -euo pipefail
      root -b -l -q -e 'TFile f("test_output/merge1.root","RECREATE"); TH1F h("h","h",10,0,10); h.Fill(5); h.Write(); f.Close();' -e '(void)0' 2>&1 && \
      root -b -l -q -e 'TFile f("test_output/merge2.root","RECREATE"); TH1F h("h","h",10,0,10); h.Fill(5); h.Write(); f.Close();' -e '(void)0' 2>&1 && \
      hadd -f test_output/merged.root test_output/merge1.root test_output/merge2.root 2>&1
    expected_output_contains: "merged.root"
    validate:
      - output_exists: ${output_dir}/merged.root

  - name: rooteventselector help
    description: Test rooteventselector utility is available
    command: |
      set -euo pipefail
      rooteventselector --help 2>&1
    expected_output_contains: "Copy subsets of trees"
    expected_exit_code: 0

  - name: rootslimtree help
    description: Test rootslimtree utility is available
    command: |
      set -euo pipefail
      rootslimtree --help 2>&1
    expected_output_contains: "Copy trees with a subset of branches"
    expected_exit_code: 0

  - name: rootdrawtree help
    description: Test rootdrawtree utility is available
    command: |
      set -euo pipefail
      rootdrawtree --help 2>&1
    expected_output_contains: "histograms"
    expected_exit_code: 0

  - name: rootcling help
    description: Test rootcling dictionary generator is available
    command: |
      set -euo pipefail
      rootcling --help 2>&1
    expected_output_contains: "dictionary"
    expected_exit_code: 0

  - name: genreflex help
    description: Test genreflex utility is available
    command: |
      set -euo pipefail
      genreflex --help 2>&1
    expected_output_contains: "Generates dictionary"
    expected_exit_code: 0

  # ==========================================================================
  # RDATAFRAME OPERATIONS
  # ==========================================================================
  - name: RDataFrame basic count
    description: Test RDataFrame basic creation and count
    command: |
      set -euo pipefail
      root -b -l -q -e 'ROOT::RDataFrame df(100); cout << "Count " << *df.Count() << endl;' -e '(void)0' 2>&1
    expected_output_contains: "Count 100"

  - name: RDataFrame Define column
    description: Test RDataFrame Define operation
    command: |
      set -euo pipefail
      root -b -l -q -e 'ROOT::RDataFrame df(100); auto df2 = df.Define("x","gRandom->Gaus()"); cout << "Count " << *df2.Count() << endl;' -e '(void)0' 2>&1
    expected_output_contains: "Count 100"

  - name: RDataFrame Filter
    description: Test RDataFrame Filter operation
    command: |
      set -euo pipefail
      root -b -l -q -e 'ROOT::RDataFrame df(1000); auto df2 = df.Define("x","gRandom->Uniform(-1,1)").Filter("x > 0"); cout << "About half " << (*df2.Count() > 400 && *df2.Count() < 600) << endl;' -e '(void)0' 2>&1
    expected_output_contains: "About half 1"

  - name: RDataFrame from TTree
    description: Test RDataFrame reading from TTree
    command: |
      set -euo pipefail
      root -b -l -q -e 'ROOT::RDataFrame df("tree","test_output/test_tree.root"); cout << "Tree entries " << *df.Count() << endl;' -e '(void)0' 2>&1
    depends_on: Create ROOT file with tree
    expected_output_contains: "Tree entries 1000"

  # ==========================================================================
  # ROOFIT STATISTICAL MODELING
  # ==========================================================================
  - name: RooFit RooRealVar creation
    description: Test RooFit variable creation
    command: |
      set -euo pipefail
      root -b -l -q -e 'RooRealVar x("x","observable",-10,10); cout << "RooRealVar name " << x.GetName() << endl;' -e '(void)0' 2>&1
    expected_output_contains: "RooRealVar name x"

  - name: RooFit Gaussian PDF
    description: Test RooFit Gaussian PDF creation
    command: |
      set -euo pipefail
      root -b -l -q -e 'RooRealVar x("x","x",-10,10); RooRealVar mean("mean","mean",0); RooRealVar sigma("sigma","sigma",1); RooGaussian gauss("gauss","Gaussian",x,mean,sigma); cout << "RooFit works" << endl;' -e '(void)0' 2>&1
    expected_output_contains: "RooFit works"

  - name: RooFit data generation
    description: Test RooFit toy data generation
    command: |
      set -euo pipefail
      root -b -l -q -e 'RooRealVar x("x","x",-10,10); RooRealVar mean("mean","mean",0); RooRealVar sigma("sigma","sigma",1); RooGaussian gauss("gauss","g",x,mean,sigma); RooDataSet *data = gauss.generate(x,1000); cout << "Generated " << data->numEntries() << endl;' -e '(void)0' 2>&1
