  - name: Interpreter errors remain strict after successful-result normalization
    description: A deliberate invalid expression must return the documented interpreter error before the trailing void expression, so successful-value normalization cannot hide compilation failure
    command: |
      set -euo pipefail
      root -b -l -q -e 'neurocontainers_intentionally_undefined_symbol_624()' -e '(void)0' 2>&1
    expected_exit_code: 1
    expected_output_contains: neurocontainers_intentionally_undefined_symbol_624
  - name: Exact ROOT tree roundtrip and analytical linear fit
    description: Write and reopen every deterministic typed tree entry and histogram bin and verify a real Minuit polynomial fit against the analytical slope/intercept
    command: |
      set -euo pipefail
      env -u HOME root -b -l -q -e '
      {
        TFile f("${output_dir}/analytical-root.root","RECREATE");
        if (f.IsZombie()) throw std::runtime_error("Output file creation failed");
        TTree tree("analytical","deterministic typed entries");
        int index=0; double value=0;
        tree.Branch("index",&index); tree.Branch("value",&value);
        TH1D hist("analytical_hist","exact bin counts",8,0,8);
        TGraph graph(16);
        for(index=0;index<16;++index){
          value=3.0*index+2.0;
          tree.Fill(); hist.Fill(index%8); graph.SetPoint(index,index,value);
        }
        TF1 line("analytical_line","pol1",0,15);
        auto fit=graph.Fit(&line,"QS");
        if(int(fit)!=0 || std::abs(line.GetParameter(0)-2.0)>1e-8 || std::abs(line.GetParameter(1)-3.0)>1e-8)
          throw std::runtime_error("Linear fit differs from analytical slope/intercept");
        tree.Write(); hist.Write(); f.Close();
        TFile read("${output_dir}/analytical-root.root","READ");
        auto saved=dynamic_cast<TTree*>(read.Get("analytical"));
        auto h=dynamic_cast<TH1D*>(read.Get("analytical_hist"));
        if(!saved || !h || saved->GetEntries()!=16 || h->GetEntries()!=16)
          throw std::runtime_error("Saved tree/histogram entry mismatch");
        int read_index=-1; double read_value=-1;
        saved->SetBranchAddress("index",&read_index); saved->SetBranchAddress("value",&read_value);
        for(int i=0;i<16;++i){
          if(saved->GetEntry(i)<=0 || read_index!=i || read_value!=3.0*i+2.0)
            throw std::runtime_error("Saved typed tree sample mismatch");
        }
        for(int b=1;b<=8;++b) if(h->GetBinContent(b)!=2.0)
          throw std::runtime_error("Saved histogram bin mismatch");
        if(h->GetBinContent(0)!=0 || h->GetBinContent(9)!=0)
          throw std::runtime_error("Unexpected histogram flow bins");
        read.Close();
        std::cout << "ROOT preserved every typed tree entry and histogram bin and recovered the analytical linear fit" << std::endl;
      }' -e '(void)0' 2>&1
    expected_output_contains: ROOT preserved every typed tree entry and histogram bin and recovered the analytical linear fit
    expected_exit_code: 0

