name: icy
version: 2.5.4.0

tests:
  - name: icy launcher available
    description: Verify the icy CLI wrapper is installed on PATH.
    command: command -v icy
    expected_output_contains: "icy"

  - name: icy version metadata matches recipe
    description: Verify the installed Icy distribution version.xml matches the recipe version.
    command: grep -oE "<version>[^<]+</version>" /opt/Icy/version.xml
    expected_output_contains: "${version}"

  - name: icy headless startup runs from unrelated working directory
    description: Verify Icy JVM boots cleanly from /tmp with writable setting.xml and relative lib/ layout.
    command: |
      rm -rf /tmp/icy-smoke-data
      cd /tmp && XDG_DATA_HOME=/tmp/icy-smoke-data icy -hl
      test -w /tmp/icy-smoke-data/icy/setting.xml
      test -d /tmp/icy-smoke-data/icy/lib/unix64
    expected_output_contains: "Icy Version ${version} started"
