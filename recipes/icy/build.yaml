name: icy
version: 2.5.4.0

copyright:
  - license: GPL-3.0-or-later
    url: https://github.com/icy-imaging/icy/blob/master/LICENSE

architectures:
  - x86_64

structured_readme:
  description: >-
    Icy is an open-source bioimage informatics platform developed at Institut
    Pasteur for 2D/3D microscopy visualization, Bio-Formats image loading,
    ROI measurement, and reproducible visual Protocols workflows.
  example: |
    # Launch the Icy GUI
    icy

    # Run Icy in headless mode
    icy -hl
  documentation: https://icy.bioimageanalysis.org/
  citation: |-
    de Chaumont, F., Dallongeville, S., Chenouard, N., Hervé, N., Pop, S.,
    Provoost, T., Meas-Yedid, V., Pankajakshan, P., Lecomte, T., Le Montagner,
    Y., Lagache, T., Dufour, A., & Olivo-Marin, J.-C. (2012). Icy: an open
    bioimage informatics platform for extended reproducible research. Nature
    Methods, 9(7), 690-696. https://doi.org/10.1038/nmeth.2075

auto_update:
  container_version: icy-archive
  method: sources
  local: []
  sources:
    - id: icy-archive
      method: http_digest
      url: https://icy.bioimageanalysis.org/download-file/?id=101809
      version_member: Icy/version.xml
      version_regex: '<version>(?P<version>[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)</version>'
      target:
        file: icy_archive
        variables:
          upstream_version: version

variables:
  upstream_version: "2.5.4.0"

files:
  - name: icy_archive
    url: https://icy.bioimageanalysis.org/download-file/?id=101809
    sha256: "0b61d58653bfd335579bd896e712eba930478cb13b423a1d5ac927f7869c0441"
  - name: icy-wrapper
    executable: true
    contents: |-
      #!/usr/bin/env bash
      set -euo pipefail
      caller_pwd="$(pwd)"
      icy_home="${XDG_DATA_HOME:-${TMPDIR:-/tmp}/icy-$(id -u)}/icy"
      mkdir -p "${icy_home}/workspace" "${icy_home}/java-prefs"
      for entry in /opt/Icy/*; do
        base="$(basename "${entry}")"
        case "${base}" in
          setting.xml|workspace) continue ;;
        esac
        if [ ! -e "${icy_home}/${base}" ] && [ ! -L "${icy_home}/${base}" ]; then
          ln -s "${entry}" "${icy_home}/${base}"
        fi
      done
      if [ ! -f "${icy_home}/setting.xml" ] && [ -f /opt/Icy/setting.xml ]; then
        cp /opt/Icy/setting.xml "${icy_home}/setting.xml"
        chmod u+w "${icy_home}/setting.xml"
      fi
      resolved_args=()
      for arg in "$@"; do
        if [[ "${arg}" != -* && "${arg}" != /* && -e "${caller_pwd}/${arg}" ]]; then
          resolved_args+=("${caller_pwd}/${arg}")
        else
          resolved_args+=("${arg}")
        fi
      done
      export JAVA_TOOL_OPTIONS="-Djava.util.prefs.userRoot=${icy_home}/java-prefs ${JAVA_TOOL_OPTIONS:-}"
      export LD_LIBRARY_PATH="${icy_home}/lib/unix64:${icy_home}/lib/unix64/vtk:${LD_LIBRARY_PATH:-}"
      cd "${icy_home}"
      exec java -Djava.library.path="${icy_home}/lib/unix64:${icy_home}/lib/unix64/vtk" \
        -jar "${icy_home}/icy.jar" --nosplash "${resolved_args[@]}"

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
    - install:
        - ca-certificates
        - fontconfig
        - libfreetype6
        - libgl1
        - libglib2.0-0
        - libglu1-mesa
        - libgomp1
        - libgtk-3-0
        - libx11-6
        - libxext6
        - libxi6
        - libxrandr2
        - libxrender1
        - libxtst6
        - openjdk-17-jre
    - workdir: /opt
    - run:
        - tar -xf {{ get_file("icy_archive") }} -C /opt
        - chmod -R a+rX /opt/Icy
        - install -m 755 {{ get_file("icy-wrapper") }} /usr/local/bin/icy

deploy:
  path: []
  bins:
    - icy

gui_apps:
  - name: "Icy"
    exec: "icy"

domains:
  - microscopy
  - dermatology

categories:
  - visualization
  - image segmentation

icon: data:image/png;base64,
