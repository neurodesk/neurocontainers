name: pyem
version: 0.69.0
copyright:
  - license: GPL-3.0-or-later
    url: https://github.com/asarnow/pyem/blob/v0.69/LICENSE
architectures:
  - x86_64
variables:
  upstream_version: '0.69'
  numpy_version: 1.26.4
  pandas_version: 2.2.3
  scipy_version: 1.14.1
  numba_version: 0.61.2
  starfile_version: 0.5.13
auto_update:
  method: sources
  container_version: pyem
  sources:
    - id: pyem
      method: artifact_listing
      url: https://api.github.com/repos/asarnow/pyem/tags?per_page=100
      download_base: https://codeload.github.com/asarnow/pyem/tar.gz/
      version_regex: v(?P<version>\d+(?:\.\d+)+)
      target:
        file: pyem_source
        variables:
          upstream_version: version
    - id: numpy
      method: pypi
      package: numpy
      dependency: true
      target:
        variable: numpy_version
    - id: pandas
      method: pypi
      package: pandas
      dependency: true
      target:
        variable: pandas_version
    - id: scipy
      method: pypi
      package: scipy
      dependency: true
      target:
        variable: scipy_version
    - id: numba
      method: pypi
      package: numba
      dependency: true
      target:
        variable: numba_version
    - id: starfile
      method: pypi
      package: starfile
      dependency: true
      target:
        variable: starfile_version
build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - install:
        - python3
        - python3-venv
        - ca-certificates
    - run:
        - mkdir -p /opt/pyem
        - tar -xzf {{ get_file("pyem_source") }} -C /opt/pyem --strip-components=1
        - python3 -m venv /opt/pyem-venv
        - /opt/pyem-venv/bin/pip install --no-cache-dir numpy=={{ context.numpy_version }} pandas=={{ context.pandas_version
          }} scipy=={{ context.scipy_version }} numba=={{ context.numba_version }} starfile=={{ context.starfile_version
          }} /opt/pyem
        - /opt/pyem-venv/bin/pip check
    - run:
        - install -m 755 {{ get_file("launch.sh") }} /opt/pyem-launch
        - /opt/pyem-venv/bin/python {{ get_file("install_launchers.py") }}
    - environment:
        PATH: /opt/pyem-bin:/opt/pyem-venv/bin:$PATH
        MPLBACKEND: Agg
files:
  - name: install_launchers.py
    filename: install_launchers.py
  - name: launch.sh
    filename: launch.sh
  - name: pyem_source
    url: https://codeload.github.com/asarnow/pyem/tar.gz/v0.69
    sha256: 969e0075ea7ba854e6ab2c5cf9ab315c7dc994dcb738574707cd4aad380c1105
deploy:
  path:
    - /opt/pyem-bin
categories:
  - cryo EM
readme: |
  pyem provides Python tools for cryo-EM metadata and image processing.
  Upstream release v{{ context.upstream_version }} is installed in /opt/pyem-venv.

  Run `csparc2star.py --help` for CryoSPARC conversion and `star.py --help`
  for RELION STAR selection and editing. All upstream console scripts are exposed.
  For example, `star.py --class 1 particles.star selected.star` selects one class.
  Commands and Python use private temporary Numba and Matplotlib cache directories,
  removed when the command exits. No writable home directory is required.
  Set NUMBA_CACHE_DIR or MPLCONFIGDIR to your own writable paths to retain caches.
  Mount your metadata, images and output directory at runtime. These CPU metadata
  tools do not require a GPU. https://github.com/asarnow/pyem
icon: data:image/png;base64,
