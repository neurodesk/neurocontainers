name: spm25
version: 26.10.01
variables:
  upstream_version: "26.10.01"
  spm_major: "26"
  matlab_runtime: R2026a
copyright:
  - license: GPL-2.0-or-later
    url: https://github.com/spm/spm?tab=GPL-2.0-1-ov-file#readme
architectures:
  - x86_64
structured_readme:
  description: |-
    Statistical Parametric Mapping refers to the construction and assessment of spatially extended statistical processes used to test hypotheses about functional imaging data. These ideas have been instantiated in a free and open source software that is called SPM.

    The SPM software package has been designed for the analysis of brain imaging data sequences. The sequences can be a series of images from different cohorts, or time-series from the same subject. The current release is designed for the analysis of fMRI, PET, SPECT, EEG and MEG.
  example: |-
    # Example usage

    ```bash
     run_spm{{ context.spm_major }}.sh /usr/local/MATLAB/MATLAB_Runtime/{{ context.matlab_runtime }}/
    ```
  documentation: https://github.com/spm
  citation: |
    Tierney, Tim M., Nicholas A. Alexander, John Ashburner, et al. “SPM 25: Open Source Neuroimaging Analysis Software.” Journal of Open Source Software 10, no. 110 (2025): 8103. https://doi.org/10.21105/joss.08103.
readme: |-
  ----------------------------------
  ## spm25/{{ context.version }} ##

  Statistical Parametric Mapping refers to the construction and assessment of spatially extended statistical processes used to test hypotheses about functional imaging data. These ideas have been instantiated in a free and open source software that is called SPM.

  The SPM software package has been designed for the analysis of brain imaging data sequences. The sequences can be a series of images from different cohorts, or time-series from the same subject. The current release is designed for the analysis of fMRI, PET, SPECT, EEG and MEG.

  Example:
  ```
  # Example usage

  ```bash
   run_spm{{ context.spm_major }}.sh /usr/local/MATLAB/MATLAB_Runtime/{{ context.matlab_runtime }}/
  ```
  ```

  More documentation can be found here: https://github.com/spm

  Citation:
  ```
  Tierney, Tim M., Nicholas A. Alexander, John Ashburner, et al. “SPM 25: Open Source Neuroimaging Analysis Software.” Journal of Open Source Software 10, no. 110 (2025): 8103. https://doi.org/10.21105/joss.08103.
  ```

  To run container outside of this environment: ml spm25/{{ context.version }}

  ----------------------------------
auto_update:
  method: sources
  container_version: spm
  sources:
    - id: spm
      method: oci
      url: https://ghcr.io/v2/spm/spm-docker/tags/list
      version_regex: 'docker-matlab-(?P<version>\d+\.\d+(?:\.\d+)?)'
      target:
        variable: upstream_version
        fulltest_variable: upstream_version

build:
  kind: neurodocker
  base-image: ghcr.io/spm/spm-docker:docker-matlab-{{ context.upstream_version }}
  pkg-manager: apt
  directives:
    - user: root
    - workdir: /opt/spm
    - run:
        - printf '%s\n' '#!/usr/bin/env bash' 'set -e' '' 'if [ "$#" -eq 0 ]; then' '  exec /usr/bin/env bash' 'fi' '' 'exec "$@"' > /usr/local/bin/spm25-entrypoint
        - chmod +x /usr/local/bin/spm25-entrypoint
    - user: spm
    - entrypoint: /usr/local/bin/spm25-entrypoint
    - environment:
          PATH: ${PATH}:/opt/spm
    - deploy:
        bins:
          - spm
          - spm{{ context.spm_major }}
          - run_spm{{ context.spm_major }}.sh
  add-default-template: false
categories:
  - functional imaging
  - structural imaging
icon: data:image/png;base64,
