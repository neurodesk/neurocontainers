name: nomis
version: "20220225"

copyright:
  - license: BSD-3-Clause
    url: https://git.valeria.science/medics/archives/github/nomis/-/blob/main/LICENSE

architectures:
  - x86_64

variables:
  # Upstream publishes no version numbers; the label is the date of the
  # NOMIS.zip release inside this archived repository.
  upstream_commit: 65938bed37cecaa5133e917ef19cca8f18c74983
  base_image_digest: sha256:b53f496ca43e5af6994f8e316cf03af31050bf7944e0e4a308ad86c001cf028b

auto_update:
  method: sources
  container_version: false
  sources:
    - id: upstream
      method: git_commit
      url: https://git.valeria.science/medics/archives/github/nomis.git
      ref: refs/heads/main
      target:
        variable: upstream_commit
        fulltest_variable: upstream_commit
    - id: base_image
      method: oci_digest
      image: python
      tag: 3.7.17-slim-bookworm
      dependency: true
      target:
        variable: base_image_digest

structured_readme:
  description: >-
    NOMIS (NOrmative Morphometry Image Statistics) computes normative Z-scores
    for FreeSurfer 6.0 morphometry, adjusted for age, sex, head size and image
    quality, from models of 6,909 healthy adults aged 18-100.
  example: nomis -csv subjects.csv -s $SUBJECTS_DIR -o nomis_out -a DK
  documentation: https://git.valeria.science/medics/archives/github/nomis
  citation: |-
    Potvin O, Dieumegarde L, Duchesne S. NOMIS: Quantifying morphometric deviations
    from normality over the lifetime of the adult human brain. bioRxiv
    2021.01.25.428063. https://doi.org/10.1101/2021.01.25.428063

readme: |-
  ----------------------------------
  ## nomis/{{ context.version }} ##

  NOMIS (NOrmative Morphometry Image Statistics) computes normative Z-scores for
  FreeSurfer 6.0 morphometry: 1,344 measures (aseg, wmparc, DK/DKT/Destrieux
  cortical parcellations, ex vivo Brodmann areas, hippocampal and brainstem
  subfields) modelled on 6,909 cognitively healthy adults aged 18-100. Z-scores
  are adjusted for head size and image quality (contrast-to-noise ratio and
  surface holes), and for age and sex when the CSV provides them.

  **Only FreeSurfer 6.0 output is valid.** The norms are calibrated on FreeSurfer
  6.0 `recon-all -all` run without manual edits or expert options. NOMIS will
  happily read FreeSurfer 7 or FastSurfer output and return plausible-looking
  but biased Z-scores, so check which version produced your subjects and check
  segmentation quality first.

  Usage:
  ```
  nomis -csv subjects.csv -s $SUBJECTS_DIR -o nomis_out [-a DK|DKT|Destrieux]
  ```

  `subjects.csv` has an `id` column matching the FreeSurfer subject folder
  names, and optionally `age` and `sex` (M/F). Rows with missing values are
  skipped. Results land in `nomis_out/normative_z_scores/`, with the extracted
  raw values in `raw_scores/` and contrast-to-noise ratios in `CNR/`. Without
  `-o`, output goes to `./nomis_out`.

  A worked example with two FreeSurfer subjects and the expected output ships
  in the container:
  ```
  nomis -csv /opt/nomis/Example/csv_example_ageandsex.csv -s /opt/nomis/Example/freesurfer_dir -o nomis_example
  ```

  More documentation: https://git.valeria.science/medics/archives/github/nomis

  Citation:
  ```
  Potvin O, Dieumegarde L, Duchesne S. NOMIS: Quantifying morphometric deviations
  from normality over the lifetime of the adult human brain. bioRxiv
  2021.01.25.428063. https://doi.org/10.1101/2021.01.25.428063
  ```

  To run container outside of this environment: ml nomis/{{ context.version }}

  ----------------------------------

build:
  kind: neurodocker
  base-image: python:3.7.17-slim-bookworm@{{ context.base_image_digest }}
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        PYTHONDONTWRITEBYTECODE: "1"

    - install: git unzip

    - run:
        # The normative models are scikit-learn 0.21 LinearRegression pickles
        # (sklearn.linear_model.base, removed in 0.24), so the stack NOMIS was
        # built with is pinned exactly; it reproduces the shipped example output.
        - 'pip install --no-cache-dir --only-binary=:all: numpy==1.17.2 scipy==1.3.1 joblib==0.13.2 scikit-learn==0.21.3 pandas==0.25.1 python-dateutil==2.8.0 pytz==2019.2 six==1.12.0 nibabel==2.5.1'
        - git clone https://git.valeria.science/medics/archives/github/nomis.git /tmp/nomis-src
        - git -C /tmp/nomis-src checkout {{ context.upstream_commit }}
        - unzip -q /tmp/nomis-src/NOMIS.zip -d /tmp/nomis-src/unpacked -x "__MACOSX/*"
        - mv /tmp/nomis-src/unpacked/NOMIS /opt/nomis
        - mv /tmp/nomis-src/Example /tmp/nomis-src/LICENSE /opt/nomis/
        - echo {{ context.upstream_commit }} > /opt/nomis/source-revision
        - find /opt/nomis \( -name .DS_Store -o -name __pycache__ \) -prune -exec rm -rf {} +
        - rm -rf /tmp/nomis-src
        - cp {{ get_file("nomis") }} /usr/local/bin/nomis
        - chmod 0755 /usr/local/bin/nomis
        - chmod -R a+rX /opt/nomis

    - deploy:
        bins:
          - nomis

files:
  - name: nomis
    contents: |
      #!/bin/sh
      # Without -o, NOMIS writes into its own install directory, which is
      # read-only in the container; default to ./nomis_out instead.
      case " $* " in
        *" -o "*|*" -h "*|*" --help "*) ;;
        *) set -- "$@" -o "$PWD/nomis_out"
           echo "nomis: no -o given, writing to $PWD/nomis_out" >&2 ;;
      esac
      exec python /opt/nomis/NOMIS.py "$@"

categories:
  - structural imaging
  - statistics

icon: data:image/png;base64,
