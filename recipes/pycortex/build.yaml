name: pycortex
version: 1.4.0

copyright:
  - license: BSD-2-Clause
    url: https://github.com/gallantlab/pycortex/blob/main/LICENSE

architectures:
  - x86_64
  - aarch64

variables:
  pycortex_version: "1.4.0"
  base_image_digest: sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5

auto_update:
  method: sources
  container_version: pycortex
  sources:
    - id: pycortex
      method: pypi
      package: pycortex
      target:
        variable: pycortex_version
        fulltest_variable: pycortex_version
    - id: base_image
      dependency: true
      method: oci_digest
      image: ubuntu
      tag: "24.04"
      target:
        variable: base_image_digest

build:
  kind: neurodocker
  base-image: ubuntu:24.04@{{ context.base_image_digest }}
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        MPLBACKEND: Agg

    - install:
        - build-essential
        - python3
        - python3-dev
        - python3-venv
        - inkscape
        - ca-certificates

    # pycortex ships only an sdist with Cython extensions. A wheel install puts
    # the S1 sample subject and colormaps under <prefix>/share/pycortex but leaves
    # defaults.cfg pointing at a non-existent site-packages/filestore, so the
    # installed defaults are rewritten to the shipped data. The subject cache
    # moves to the user's home because the image filesystem is read-only.
    # webshow prints the viewer URL instead of opening a browser, since the
    # image has none; open the URL in the Neurodesk desktop browser.
    # S1/views is created because pycortex creates it on first surface read.
    # Rendering one flatmap and one static WebGL viewer precomputes the S1
    # surface info (curvature, equivolume areas) that pycortex otherwise writes
    # into the filestore on first use.
    - run:
        - python3 -m venv /opt/pycortex
        - /opt/pycortex/bin/pip install --no-cache-dir --upgrade pip
        - /opt/pycortex/bin/pip install --no-cache-dir "pycortex=={{ context.pycortex_version }}"
        - /opt/pycortex/bin/pip check
        - >-
          /opt/pycortex/bin/python -c "import configparser, glob;
          path = glob.glob('/opt/pycortex/lib/python3*/site-packages/cortex/defaults.cfg')[0];
          cfg = configparser.ConfigParser(); cfg.read(path);
          cfg.set('basic', 'filestore', '/opt/pycortex/share/pycortex/db');
          cfg.set('basic', 'cache', '~/.cache/pycortex');
          cfg.set('webgl', 'colormaps', '/opt/pycortex/share/pycortex/colormaps');
          cfg.set('webshow', 'open_browser', 'false');
          cfg.write(open(path, 'w'))"
        - test -f /opt/pycortex/share/pycortex/db/S1/overlays.svg
        - mkdir -p /opt/pycortex/share/pycortex/db/S1/views
        - mkdir -p /tmp/pycortex-build
        - >-
          cd /tmp/pycortex-build && HOME=/tmp/pycortex-build /opt/pycortex/bin/python -c "import cortex;
          vol = cortex.Volume.random('S1', 'fullhead');
          cortex.quickflat.make_png('flat.png', vol, with_curvature=True, with_rois=True, with_labels=True);
          cortex.webgl.make_static('webgl', vol)"
        - cd /
        - test -f /opt/pycortex/share/pycortex/db/S1/surface-info/curvature.npz
        - test -f /opt/pycortex/share/pycortex/db/S1/surface-info/equivolume_areas.npz
        - rm -rf /tmp/pycortex-build
        - chmod -R a+rX /opt/pycortex

    - environment:
        PATH: /opt/pycortex/bin:$PATH

deploy:
  bins:
    - python
    - python3

domains:
  - neuroimaging
categories:
  - "visualization"
  - "functional imaging"

readme: |
  ## pycortex/{{ context.version }} ##
  Pycortex is a Python library for visualising fMRI and other volumetric or
  surface data on cortical surfaces: interactive WebGL 3D viewers and static
  flatmaps.

  The container provides pycortex in a Python environment at /opt/pycortex,
  with Inkscape for drawing ROI labels on flatmaps. The S1 sample subject is
  included.

  Example:
  ```
  python3 -c "
  import cortex, numpy as np
  vol = cortex.Volume.random('S1', 'fullhead')
  cortex.quickflat.make_png('flatmap.png', vol, with_curvature=True)
  "
  ```

  The bundled filestore at /opt/pycortex/share/pycortex/db is read-only. To
  import your own FreeSurfer subjects, point pycortex at a writable filestore.
  On first import pycortex writes its configuration to
  ~/.config/pycortex/options.cfg; change `filestore` under `[basic]` in
  that file, or copy the S1 subject into your own filestore first:
  ```
  cp -r /opt/pycortex/share/pycortex/db ~/pycortex-db
  ```
  Flatmap caches are written to ~/.cache/pycortex. A pycortex options.cfg
  already in ~/.config/pycortex from another installation takes precedence over
  the container defaults; delete or edit it if pycortex cannot find S1.

  `cortex.webshow(vol)` starts the interactive viewer and prints its URL
  (http://localhost:<port>/mixer.html); open that URL in a browser on the same
  machine. To write a self-contained viewer to disk instead, use
  `cortex.webgl.make_static('viewer_dir', vol)`.

  Importing subjects (`cortex.freesurfer.import_subj`) needs FreeSurfer, and
  automatic flattening needs Blender; neither is in this container.

  Documentation: https://gallantlab.org/pycortex/

  To run container outside of this environment: ml pycortex/{{ context.version }}

  Citation:
  ```
  Gao JS, Huth AG, Lescroart MD, Gallant JL (2015). Pycortex: an interactive
  surface visualizer for fMRI. Frontiers in Neuroinformatics 9:23.
  https://doi.org/10.3389/fninf.2015.00023
  ```

icon: data:image/png;base64,
