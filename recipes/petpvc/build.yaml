name: petpvc
version: "1.2.12"

copyright:
  - license: Apache-2.0
    url: https://github.com/UCL/PETPVC/blob/v{{ context.upstream_version }}/LICENSE.txt

architectures:
  - x86_64

variables:
  upstream_version: "1.2.12"

auto_update:
  method: sources
  container_version: petpvc
  sources:
    - id: petpvc
      method: webpage
      url: https://api.anaconda.org/package/conda-forge/petpvc
      version_regex: 'linux-64/petpvc-(?P<version>\d+\.\d+\.\d+)-'
      target:
        variable: upstream_version
    - id: micromamba
      method: http_digest
      url: https://micro.mamba.pm/api/micromamba/linux-64/2.3.2
      dependency: true
      target:
        file: micromamba

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        PATH: /opt/petpvc/bin:$PATH
    - run:
        - mkdir -p /tmp/micromamba
        - tar -xjf {{ get_file("micromamba") }} -C /tmp/micromamba bin/micromamba
        - >-
          MAMBA_ROOT_PREFIX=/tmp/mamba /tmp/micromamba/bin/micromamba create -y -p /opt/petpvc
          --override-channels -c conda-forge
          "petpvc={{ context.upstream_version }}"
        - mkdir -p /opt/petpvc/share/licenses/petpvc
        - install -m 0644 {{ get_file("petpvc_license") }} /opt/petpvc/share/licenses/petpvc/LICENSE.txt
        - install -m 0644 {{ get_file("petpvc_notice") }} /opt/petpvc/share/licenses/petpvc/NOTICE.txt
        - rm -rf /tmp/mamba /tmp/micromamba
        - chmod -R a+rX /opt/petpvc
        - test -x /opt/petpvc/bin/petpvc

files:
  - name: micromamba
    url: https://micro.mamba.pm/api/micromamba/linux-64/2.3.2
    sha256: 5512233cdd8564a671626081026dc861537a963baa06706baab08fac6f3bb9d2
  - name: petpvc_license
    url: https://raw.githubusercontent.com/UCL/PETPVC/v{{ context.upstream_version }}/LICENSE.txt
  - name: petpvc_notice
    url: https://raw.githubusercontent.com/UCL/PETPVC/v{{ context.upstream_version }}/NOTICE.txt

deploy:
  bins:
    - petpvc
    - pvc_diy
    - pvc_gtm
    - pvc_iy
    - pvc_labbe
    - pvc_make4d
    - pvc_mg
    - pvc_mtc
    - pvc_rbv
    - pvc_relabel
    - pvc_rl
    - pvc_simulate
    - pvc_stc
    - pvc_vc

domains:
  - neuroimaging

categories:
  - molecular imaging
  - preclinical imaging
  - quantitative imaging

structured_readme:
  description: >-
    PETPVC (UCL) is a standalone command-line suite for partial volume
    correction (PVC) in positron emission tomography (PET), providing
    region-based and voxel-wise methods including GTM, RBV, Labbe, MTC,
    Iterative Yang (IY), Discrete IY, Muller-Gartner (MG), Richardson-Lucy
    (RL), Van Cittert (VC), and STC, along with PSF simulation and 4D mask
    preparation utilities.
  example: |
    # Check installed PETPVC version and available methods
    petpvc -version
    petpvc -h

    # Run Iterative Yang partial volume correction with a 4 mm FWHM PSF
    petpvc -i pet.nii.gz -m mask4d.nii.gz -o pet_pvc.nii.gz --pvc IY -x 4.0 -y 4.0 -z 4.0
  documentation: https://github.com/UCL/PETPVC
  citation: >-
    Thomas BA, Cuplov V, Bousse A, Mendes A, Thielemans K, Hutton BF,
    Erlandsson K. PETPVC: a toolbox for performing partial volume correction
    techniques in positron emission tomography. Physics in Medicine and
    Biology. 2016;61(22):7975-7993. doi:10.1088/0031-9155/61/22/7975

icon: data:image/png;base64,
