  # ==========================================================================
  # STATUS CHECK (without authentication)
  # ==========================================================================
  - name: Status check without running instance
    description: Require the documented exit1 setup-prerequisite diagnostic in a new private configuration without a home directory
    command: |
      set -euo pipefail
      config_dir=$(mktemp -d /tmp/globus-status-XXXXXX)
      trap 'rm -rf "$config_dir"' EXIT
      env -u HOME globusconnectpersonal -dir "$config_dir" -status 2>&1
    expected_output_contains: "first completing setup"
    expected_exit_code: 1

  - name: Real native GridFTP transfer and path isolation
    description: Start the shipped GridFTP server in documented loopback anonymous mode and verify every byte of actual upload/download operations, private path restrictions and normal server exit
    timeout: 120
    command: |
      set -euo pipefail
      python - <<'PYTHON'
      import ftplib
      import io
      import os
      from pathlib import Path
      import socket
      import subprocess
      import tempfile
      import time

      # Exercise the exact shipped native server, with the documented anonymous mode
      # confined to a private loopback server and a private writable directory.
      # Authenticated Globus.org endpoint registration/relay is outside this local proof.
      toolkit=Path('${toolkit_dir}').resolve()
      server=toolkit/'sbin/globus-gridftp-server'
      with tempfile.TemporaryDirectory(dir=Path('${output_dir}').resolve()) as directory:
          root=Path(directory)
          payload=bytes(range(256))*4096
          source=root/'source.bin'
          source.write_bytes(payload)
          with socket.socket() as reservation:
              reservation.bind(('127.0.0.1',0))
              port=reservation.getsockname()[1]
          env=os.environ.copy()
          env.pop('HOME',None)
          env['GLOBUS_LOCATION']=str(toolkit)
      env['GLOBUS_HOSTNAME']='127.0.0.1'
          env['LD_LIBRARY_PATH']=str(toolkit/'lib')+':'+env.get('LD_LIBRARY_PATH','')
          command=[str(server),'-no-detach','-no-fork','-single','-allow-anonymous',
              '-control-interface','127.0.0.1','-data-interface','127.0.0.1',
              '-allow-from','127.0.0.1','-port',str(port),'-home-dir',str(root),
              '-restrict-paths','RW'+str(root),'-disable-usage-stats']
          log_path=root/'gridftp-server.log'
          with log_path.open('wb') as log:
              process=subprocess.Popen(command,env=env,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
              ftp=ftplib.FTP(timeout=15)
              try:
                  deadline=time.monotonic()+15
                  while True:
                      assert process.poll() is None, log_path.read_text(errors='replace')
                      try:
                          ftp.connect('127.0.0.1',port)
                          break
                      except ConnectionRefusedError:
                          assert time.monotonic()<deadline,'GridFTP server startup timed out'
                          time.sleep(0.1)
                  ftp.login('anonymous','local-test@localhost')
                  received=io.BytesIO()
                  reply=ftp.retrbinary('RETR '+str(source),received.write)
                  assert reply.startswith('226') and received.getvalue()==payload
                  changed=bytes(value^90 for value in payload)
                  uploaded=root/'uploaded.bin'
                  reply=ftp.storbinary('STOR '+str(uploaded),io.BytesIO(changed))
                  assert reply.startswith('226') and uploaded.read_bytes()==changed
                  received=io.BytesIO()
                  ftp.retrbinary('RETR '+str(uploaded),received.write)
                  assert received.getvalue()==changed
                  try:
                      ftp.retrbinary('RETR /etc/passwd',lambda block: None)
                  except ftplib.error_perm as error:
                      assert str(error).startswith('550'),error
                  else:
                      raise AssertionError('GridFTP allowed access outside its private path restriction')
                  ftp.quit()
                  assert process.wait(timeout=10)==0,log_path.read_text(errors='replace')
                  assert source.read_bytes()==payload
                  print('Native Globus GridFTP completed exact1MiB download, upload and retrieval, enforced private path restrictions and exited cleanly')
              except BaseException:
                  print(log_path.read_text(errors='replace'))
                  raise
              finally:
                  ftp.close()
                  if process.poll() is None:
                      process.terminate()
                      process.wait(timeout=10)
      PYTHON
    expected_output_contains: Native Globus GridFTP completed exact1MiB download, upload and retrieval, enforced private path restrictions and exited cleanly
    expected_exit_code: 0

cleanup:
  script: |
    #!/usr/bin/env bash
    # No cleanup needed for these tests as they only test help/version/status
    echo "Globus Connect Personal tests completed"
