# Globus Connect Personal container test suite
# Tests for Globus Connect Personal - secure data transfer endpoint software
#
# Globus Connect Personal allows users to create personal endpoints for
# transferring files between local systems and Globus-connected endpoints.
# It includes the GridFTP server for high-performance data transfer.

name: globus
version: "3.3.1"

globus_dir: /opt/globusconnectpersonal-${version}
toolkit_dir: test_output/globus-toolkit
test_data:
  output_dir: test_output

setup:
  script: |
    set -eu
    case "$(uname -m)" in
      x86_64) toolkit=gt_amd64 ;;
      aarch64) toolkit=gt_arm64 ;;
      *) echo "Unsupported Globus architecture" >&2; exit 1 ;;
    esac
    test -d "${globus_dir}/$toolkit"
    mkdir -p test_output
    ln -sfn "${globus_dir}/$toolkit" "${toolkit_dir}"

tests:
