name: brainqcnet
version: 1.0.1
architectures:
  - x86_64

copyright:
  - license: Apache-2.0
    url: https://github.com/garciaml/BrainQCNet_CPU/blob/master/LICENSE

variables:
  upstream_commit: 1bfb80a9d9ec9ac196ba87c8d9c22650b806f310
  upstream_version: "1.0.1"
  torch_version: 1.9.0+cpu
  torchvision_version: 0.10.0+cpu
  python_build: 3.9.25+20251031
  base_image_digest: sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
  openrecon_server_commit: 33362f2139701fbf5ea855808a325eb59b7db2ae
  openrecon_python_tools_commit: 17fe6fbf1bb645112e2ad0023eb4f42afb36421e
  openrecon_siemens_commit: 055eefc09dfa77fbf11fff85979dea9ef2879ba5
  openrecon_ismrmrd_version: 1.14.2

files:
  - name: brainqcnet_source
    url: https://github.com/garciaml/BrainQCNet_CPU/archive/{{ context.upstream_commit }}.tar.gz
    sha256: b7e2732d67c8e65b6a1513ddcf5f49503c63abae09aa590f936d180cae156be0
  # saved_models.zip linked from the upstream README: the ResNet152 ProtoPNet
  # checkpoint 10push0.8167.pth and its prototype images.
  - name: saved_models
    url: https://drive.usercontent.google.com/download?id=1Ik44ZiCRA_MeDDG3nXX0ZUk2lSNwak3e&export=download&confirm=t
    sha256: aa2c7a9dc4fe1ced8b77b81e06e9247cb6b16a7269acfa7e425c5d3f34cba666
  # torch 1.9.0+cpu, pinned by upstream, has no wheels for Python 3.10 or later.
  - name: python
    url: https://github.com/astral-sh/python-build-standalone/releases/download/20251031/cpython-{{ context.python_build }}-x86_64-unknown-linux-gnu-install_only.tar.gz
    sha256: 42834f61eb6df43432c3dd6ab9ca3fdf8c06d10a404ebdb53d6902e6b9570b08
  - name: brainqcnet
    filename: brainqcnet
  - name: openrecon-brainqcnet
    filename: openrecon-brainqcnet
  - name: brainqcnet.py
    filename: brainqcnet.py
  - name: verify_runtime.py
    filename: verify_runtime.py
  - name: OpenReconLabel.json
    filename: OpenReconLabel.json
  - name: OpenReconREADME.md
    filename: OpenReconREADME.md

auto_update:
  method: sources
  container_version: upstream
  local:
    - macros/openrecon
    - macros/openrecon_i2i
  sources:
    - id: upstream
      method: github_commit
      repo: garciaml/BrainQCNet_CPU
      ref: master
      version_file: run.py
      version_regex: '__version__ = "(?P<version>[0-9.]+)"'
      target:
        variable: upstream_commit
        variables:
          upstream_version: version
    - id: upstream_archive
      method: http_digest
      url: https://github.com/garciaml/BrainQCNet_CPU/archive/{{ context.upstream_commit }}.tar.gz
      target:
        file: brainqcnet_source
    - id: saved_models
      method: http_digest
      url: https://drive.usercontent.google.com/download?id=1Ik44ZiCRA_MeDDG3nXX0ZUk2lSNwak3e&export=download&confirm=t
      target:
        file: saved_models
    - id: base_image
      dependency: true
      method: oci_digest
      image: ubuntu
      tag: '22.04'
      target:
        variable: base_image_digest
    - id: openrecon_ismrmrd
      dependency: true
      method: github_release
      repo: ismrmrd/ismrmrd
      target:
        variable: openrecon_ismrmrd_version
        value: version
    - id: openrecon_siemens
      dependency: true
      method: github_commit
      repo: ismrmrd/siemens_to_ismrmrd
      ref: HEAD
      target:
        variable: openrecon_siemens_commit
    - id: openrecon_python_tools
      dependency: true
      method: github_commit
      repo: ismrmrd/ismrmrd-python-tools
      ref: HEAD
      target:
        variable: openrecon_python_tools_commit
    - id: openrecon_server
      dependency: true
      method: github_commit
      repo: astewartau/python-ismrmrd-server
      ref: fix/ismrmrd-compatibility
      target:
        variable: openrecon_server_commit

build:
  kind: neurodocker
  base-image: ubuntu:22.04@{{ context.base_image_digest }}
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        BRAINQCNET_VERSION: "{{ context.upstream_version }}"
    - install: bzip2 ca-certificates git build-essential python3-pip python-is-python3 unzip libgl1 libglib2.0-0
    - include: macros/openrecon/neurodocker.yaml
    - include: macros/openrecon_i2i/helpers.yaml
    - workdir: /opt
    - run:
        - mkdir -p /opt/brainqcnet
        - tar -xzf {{ get_file("brainqcnet_source") }} --strip-components=1 -C /opt/brainqcnet
        - grep -qx '__version__ = "{{ context.upstream_version }}"' /opt/brainqcnet/run.py
        - unzip -q {{ get_file("saved_models") }} -d /opt/brainqcnet
        - tar -xzf {{ get_file("python") }} -C /opt/brainqcnet
        - /opt/brainqcnet/python/bin/python3 -m venv /opt/brainqcnet/venv
        - /opt/brainqcnet/venv/bin/pip install --no-cache-dir wheel==0.38.1
        - /opt/brainqcnet/venv/bin/pip install --no-cache-dir -r /opt/brainqcnet/requirements.txt torch=={{ context.torch_version }} torchvision=={{ context.torchvision_version }} -f https://download.pytorch.org/whl/torch_stable.html
        - install -m 0755 {{ get_file("brainqcnet") }} /usr/local/bin/brainqcnet
        - install -m 0755 {{ get_file("openrecon-brainqcnet") }} /usr/local/bin/openrecon-brainqcnet
        - cp {{ get_file("verify_runtime.py") }} /opt/brainqcnet/verify_runtime.py
        - cp {{ get_file("brainqcnet.py") }} /opt/code/python-ismrmrd-server/brainqcnet.py
        - cp {{ get_file("OpenReconLabel.json") }} /opt/code/python-ismrmrd-server/OpenReconLabel.json
        - cp {{ get_file("OpenReconREADME.md") }} /opt/code/python-ismrmrd-server/OpenReconREADME.md
        - mkdir -p /tmp/share/debug
        - chmod 1777 /tmp/share /tmp/share/debug
    - workdir: /tmp

deploy:
  bins:
    - brainqcnet
    - openrecon-brainqcnet

domains:
  - neuroimaging
categories:
  - quality control
  - structural imaging
  - machine learning
  - bids apps

readme: |
  ## brainqcnet/{{ context.version }}

  BrainQCNet detects artifacts in brain T1-weighted MRI scans. An interpretable
  ProtoPNet with a ResNet152 backbone scores about 450 to 600 2D slices along all
  three axes and reports the probability that the scan fails quality control.
  This container runs the CPU BIDS app at upstream commit {{ context.upstream_commit }}
  with the published checkpoint `saved_models/resnet152/19112020/10push0.8167.pth`.

  Run the BIDS app from your working directory:

  ```bash
  brainqcnet /path/to/bids /path/to/output participant --participant_label 01
  brainqcnet /path/to/bids /path/to/output group
  ```

  Each T1w run writes `tot_df.csv` (global probability `proba`, `pred` = 1 for
  fail above 0.5, and per-axis `x_proba`, `y_proba`, `z_proba`), `table.csv`
  (one prediction per slice) and per-axis local results under
  `<output>/sub-<label>/ses-<session>/<run>/`. The group level collects all runs in
  `group_results.csv`. Options: `--pred_method percentage|mean|median`,
  `--n_areas`, and `--masks 1` to save prototype activation maps.

  ### OpenRecon

  Start the MRD server with `openrecon-brainqcnet --host 0.0.0.0 --port 9002` and
  select the `brainqcnet` configuration. The adapter scores each reconstructed T1w
  magnitude volume. It returns the originals in a new series labelled
  `BrainQCNet_PASS` or `BrainQCNet_FAIL` (SequenceDescriptionAdditional), with the
  probabilities in the image comments, and a one-page report image named with the
  verdict, probability and method. See OpenReconREADME.md for parameters.

  The trained weights are distributed by the authors without a license statement;
  the code is Apache-2.0. Research use only.

  Citation: Garcia M, Dosenbach N, Kelly C. BrainQCNet: A Deep Learning
  attention-based model for the automated detection of artifacts in brain
  structural MRI scans. Imaging Neuroscience 2024; 2: 1-16.
  https://doi.org/10.1162/imag_a_00300

  Upstream: https://github.com/garciaml/BrainQCNet

icon: "data:image/png;base64,"
