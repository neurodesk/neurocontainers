name: nftsim
version: 1.0.2
architectures:
  - x86_64
  - aarch64
structured_readme:
  description: NFTsim is a neural field simulation framework for large-scale brain dynamics. This container allows users to simulate various neural models including corticothalamic and cortical circuits using configuration files.
  example: nftsim -i /app/configs/eirs-corticothalamic.conf -o eirs-corticothalamic.output
  documentation: https://github.com/BrainDynamicsUSYD/nftsim
  citation: ''
variables:
  base_image_tag: 1.0.2
  source_commit: 0bd35df203e9e713018ce94c45119f1c794d61a2
  base_image:
    try:
      - value: ghcr.io/farwa-abbas/nftsim:{{ context.base_image_tag }}
        condition: arch == "x86_64"
      - value: ubuntu:22.04
        condition: arch == "aarch64"

auto_update:
  container_version: "base_image_tag"
  method: sources
  sources:
    - id: source
      method: github_commit
      repo: BrainDynamicsUSYD/nftsim
      ref: master
      target:
        variable: source_commit
    - id: base_image_tag
      method: oci
      url: https://ghcr.io/v2/farwa-abbas/nftsim/tags/list
      version_regex: '(?P<version>\d+\.\d+\.\d+)'
      target:
        variable: base_image_tag
        value: tag

build:
  kind: neurodocker
  base-image: "{{ context.base_image }}"
  pkg-manager: apt
  directives:
    - condition: arch == "aarch64"
      install:
        - build-essential
        - ca-certificates
    - condition: arch == "aarch64"
      run:
        - tar -xzf '{{ get_file("source") }}' -C /tmp
        - make -C /tmp/nftsim-{{ context.source_commit }} -j2 CXXFLAGS='-std=c++11 -lm -Wall -Wextra -pedantic -O3' nftsim
        - mkdir -p /app/bin /app/configs
        - cp /tmp/nftsim-{{ context.source_commit }}/bin/nftsim /app/bin/nftsim
        - cp -a /tmp/nftsim-{{ context.source_commit }}/configs/. /app/configs/
        - rm -rf /tmp/nftsim-{{ context.source_commit }}
    - environment:
        PATH: /app/bin:$PATH
    - workdir: /app
    - deploy:
        bins:
          - nftsim
        path:
          - /app/bin
          - /app/configs
    - test:
        name: testScript
        script: |-
          #!/bin/bash

          # Test 1: Check if nftsim binary exists and shows help
          echo "Testing nftsim --help..."
          nftsim --help
          if [ $? -ne 0 ]; then
              echo "ERROR: nftsim --help failed"
              exit 1
          fi

          # Test 2: Check if config file exists
          echo "Testing config file access..."
          if [ ! -f "/app/configs/eirs-corticothalamic.conf" ]; then
              echo "ERROR: Config file not found at /app/configs/eirs-corticothalamic.conf"
              exit 1
          fi

          # Test 3: Run nftsim with the config file
          echo "Testing nftsim execution with config..."
          nftsim -i /app/configs/eirs-corticothalamic.conf -o eirs-corticothalamic.output
          if [ $? -ne 0 ]; then
              echo "ERROR: nftsim execution failed"
              exit 1
          fi

          # Test 4: Check if output file was created
          echo "Testing output file generation..."
          if [ ! -f "eirs-corticothalamic.output" ]; then
              echo "ERROR: Output file not created"
              exit 1
          fi

          echo "All tests passed successfully!"
          exit 0
icon: data:image/png;base64,
categories:
  - programming
  - hippocampus
readme: |-
  ----------------------------------
  ## nftsim/1.0.2 ##

  NFTsim is a neural field simulation framework for large-scale brain dynamics. This container allows users to simulate various neural models including corticothalamic and cortical circuits using configuration files.

  Example:
  ```
  nftsim -i /app/configs/eirs-corticothalamic.conf -o eirs-corticothalamic.output
  ```

  More documentation can be found here: https://github.com/BrainDynamicsUSYD/nftsim

  Citation:
  ```

  ```

  To run container outside of this environment: ml nftsim/1.0.2

  ----------------------------------

files:
  - name: source
    condition: arch == "aarch64"
    url: https://github.com/BrainDynamicsUSYD/nftsim/archive/{{ context.source_commit }}.tar.gz
