# bidscoin container test suite
# Tests for BIDScoin v4.6.2 - DICOM to BIDS conversion toolkit
#
# BIDScoin provides tools for converting raw neuroimaging data (DICOM, etc.)
# to the Brain Imaging Data Structure (BIDS) format. The container includes:
#   - BIDScoin CLI tools (bidscoin, bidsmapper, bidscoiner, etc.)
#   - dcm2niix: DICOM to NIfTI converter
#   - spec2nii: MRS spectroscopy to NIfTI-MRS converter
#   - bids-validator: BIDS dataset validation
#
# Test data: ds000001 (OpenNeuro Balloon Analog Risk-taking Task)
#   - This is an existing BIDS dataset used to test validation and utilities
#   - T1w: 3D structural MRI
#   - BOLD: 4D functional MRI
#
# A small synthetic MR series exercises actual DICOM mapping and BIDS conversion.
# The external dataset also exercises validation and utility commands.

name: bidscoin
version: 4.6.2

required_files:
  - dataset: ds000001
    files:
      - dataset_description.json
      - participants.tsv
      - sub-01/anat/sub-01_T1w.nii.gz
      - sub-01/anat/sub-01_inplaneT2.nii.gz
      - sub-01/func/sub-01_task-balloonanalogrisktask_run-01_bold.nii.gz
      - sub-01/func/sub-01_task-balloonanalogrisktask_run-01_events.tsv

test_data:
  t1w: ds000001/sub-01/anat/sub-01_T1w.nii.gz
  t2: ds000001/sub-01/anat/sub-01_inplaneT2.nii.gz
  bold: ds000001/sub-01/func/sub-01_task-balloonanalogrisktask_run-01_bold.nii.gz
  events: ds000001/sub-01/func/sub-01_task-balloonanalogrisktask_run-01_events.tsv
  bids_dataset: ds000001
  output_dir: test_output

setup:
  script: |
    #!/usr/bin/env bash
    set -e
    mkdir -p ${output_dir}
    mkdir -p ${output_dir}/bids_test
    mkdir -p ${output_dir}/dicom_test

    cat > "${output_dir}/validate-bids.py" <<'PYTHON'
    import json
    import subprocess
    import sys

    args = sys.argv[1:]
    text = subprocess.run(['bids-validator', *args], text=True, capture_output=True, timeout=120)
    report = subprocess.run(['bids-validator', *args, '--json'], text=True, capture_output=True, timeout=120)
    print(text.stdout, text.stderr)
    assert 'Traceback' not in text.stdout + text.stderr
    result = json.loads(report.stdout)
    errors = result['issues']['errors']
    assert isinstance(errors, list)
    assert result['summary']['totalFiles'] > 0
    # A partial external dataset may contain BIDS errors. Require the documented
    # validation status to agree with its complete structured diagnostic report.
    expected = int(bool(errors))
    assert report.returncode == expected, (report.returncode, result)
    assert text.returncode == expected, (text.returncode, result)
    print(json.dumps(result))
    print('Summary:', result['summary']['totalFiles'], 'Files; validation status', expected)
    PYTHON

tests:
  # ==========================================================================
  # BIDSCOIN CORE FUNCTIONALITY
  # ==========================================================================
