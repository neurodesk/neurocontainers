# frisgo container test suite
# Verifies LN2_FRISGO and the OpenRecon round trip of a BOLD time series.

name: frisgo
version: 2.10.0
laynii_version: 2.10.0

tests:
  - name: LN2_FRISGO is built from LayNii
    description: Verify the LayNii release binary is installed on PATH
    script: |
      command -v LN2_FRISGO | grep -x '/opt/laynii-${laynii_version}/LN2_FRISGO'
      LN2_FRISGO -help | grep -- '-spline'

  - name: OpenRecon server help
    description: Verify the python-ismrmrd server entrypoint starts correctly
    script: |
      python /opt/code/python-ismrmrd-server/main.py -h 2>&1 | grep 'Example server for MRD streaming format'

  - name: OpenRecon label selects frisgo
    description: Verify the scanner label is installed and defaults to the frisgo config
    script: |
      python - <<'PY'
      import json
      label = json.load(open("/opt/code/python-ismrmrd-server/OpenReconLabel.json"))
      defaults = {p["id"]: p["default"] for p in label["parameters"]}
      assert defaults == {"config": "frisgo", "sendoriginal": True, "sendfrisgo": True}, defaults
      print(defaults)
      PY

  - name: OpenRecon scanner time-series transport
    description: Verify original fallback, independent counters, temporal validity and long-run image numbering
    script: python /opt/code/python-ismrmrd-server/test_frisgo_openrecon.py

  - name: OpenRecon round trip returns originals and FRISGO time series
    description: Send a synthetic BOLD run through the MRD server and compare with LN2_FRISGO -tshift
    script: |
      set -euo pipefail
      work_dir=$(mktemp -d)
      server_pid=
      cleanup() {
        if [ -n "$server_pid" ]; then
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
        fi
        rm -rf "$work_dir"
      }
      trap cleanup EXIT
      cd "$work_dir"
      python - <<'PY'
      import nibabel as nib
      import numpy as np
      rng = np.random.default_rng(0)
      data = 1000 + 200 * rng.random((16, 12, 3, 9))
      data[..., 1::2] += 50
      affine = np.diag([0.8, 0.8, 1.0, 1.0])
      image = nib.Nifti1Image(np.rint(data).astype(np.int16), affine)
      image.header.set_zooms((0.8, 0.8, 1.0, 0.05))
      nib.save(image, "bold.nii")
      PY
      LN2_FRISGO -input bold.nii -tshift
      server=/opt/code/python-ismrmrd-server
      python $server/frisgo_simulate.py nifti2mrd bold.nii input.h5
      python $server/main.py -p 9055 > server.log 2>&1 &
      server_pid=$!
      sleep 3
      python $server/client.py -p 9055 -c frisgo -G frisgo -o output.h5 input.h5
      python $server/frisgo_simulate.py mrd2nifti output.h5 returned --group frisgo | tee convert.log
      grep -c "images=27 " convert.log | grep -x 2
      grep "image_101: series_index=101 SeriesDescription='bold-frisgo'" convert.log
      python $server/frisgo_simulate.py compare returned/image_100.nii bold.nii
      python $server/frisgo_simulate.py compare returned/image_101.nii bold_Tshift.nii
