name: deepcombat
version: "0.0.0.9000"

copyright:
  - license: MIT
    url: https://github.com/hufengling/DeepComBat/blob/main/LICENSE.md

architectures:
  - x86_64

structured_readme:
  description: >-
    DeepComBat harmonizes multi-batch neuroimaging features. It trains a
    conditional variational autoencoder and applies ComBat in its latent space
    and to its residuals, removing multivariate scanner and site effects while
    preserving the effects of biological covariates.
  example: Rscript -e 'library(DeepComBat); ?deepcombat_setup'
  documentation: https://github.com/hufengling/DeepComBat
  citation: >-
    Hu, F., Lucas, A., Chen, A.A., Coleman, K., Horng, H., Ng, R.W., Tustison,
    N.J., Davis, K.A., Shou, H., Li, M., Shinohara, R.T., The Alzheimer's
    Disease Neuroimaging Initiative. (2023). DeepComBat: A Statistically
    Motivated, Hyperparameter-Robust, Deep Learning Approach to Harmonization
    of Neuroimaging Data. bioRxiv. https://doi.org/10.1101/2023.04.24.537396

variables:
  upstream_version: "0.0.0.9000"
  deepcombat_commit: bf0eda1c8c6b4690239351065f6ae92c316b4ff4
  neurocombat_commit: fbec46a61bc92bedb450b0e44addae4ce6afa934
  cran_snapshot: "2026-09-28"

auto_update:
  container_version: {"variable": "upstream_version"}
  method: sources
  sources:
    - id: deepcombat
      method: github_commit
      repo: hufengling/DeepComBat
      ref: HEAD
      target:
        variable: deepcombat_commit
    - id: neurocombat
      method: github_commit
      repo: Jfortin1/neuroCombat_Rpackage
      ref: HEAD
      dependency: true
      target:
        variable: neurocombat_commit

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        R_REPOS: "https://packagemanager.posit.co/cran/__linux__/noble/{{ context.cran_snapshot }}"

    - install:
        - r-base
        - r-base-dev
        - r-bioc-biocparallel
        - r-cran-matrixstats
        - ca-certificates
        - libcurl4-openssl-dev
        - libssl-dev

    - run:
        - Rscript {{ get_file("install_deepcombat.R") }} {{ get_file("neurocombat_source") }} {{ get_file("deepcombat_source") }}
        - Rscript -e 'library(DeepComBat); stopifnot(torch::torch_is_installed())'
        - rm -rf /tmp/Rtmp*

    - deploy:
        bins:
          - R
          - Rscript

files:
  - name: deepcombat_source
    url: https://github.com/hufengling/DeepComBat/archive/{{ context.deepcombat_commit }}.tar.gz
  - name: neurocombat_source
    url: https://github.com/Jfortin1/neuroCombat_Rpackage/archive/{{ context.neurocombat_commit }}.tar.gz
  - name: install_deepcombat.R
    contents: |
      options(
        repos = c(CRAN = Sys.getenv("R_REPOS")),
        HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(),
          paste(getRversion(), R.version$platform, R.version$arch, R.version$os)),
        timeout = 1800,
        Ncpus = max(1L, parallel::detectCores() - 1L)
      )
      install.packages(c("torch", "coro", "dplyr"))
      torch::install_torch()
      for (tarball in commandArgs(trailingOnly = TRUE)) {
        install.packages(tarball, repos = NULL, type = "source")
      }

categories:
  - statistics
  - machine learning

readme: |-
  ----------------------------------
  ## deepcombat/{{ context.version }} ##

  DeepComBat harmonizes multi-batch neuroimaging features. It trains a
  conditional variational autoencoder (CVAE) and applies ComBat in its latent
  space and to its residuals, removing multivariate scanner and site effects
  while preserving the effects of biological covariates. Apply it to extracted
  features (for example regional volumes or cortical thickness) after image
  preprocessing and before statistical analysis.

  The container provides R with the DeepComBat package, R torch with a CPU
  libtorch, and neuroCombat.

  Example:
  ```
  library(DeepComBat)
  # data: subjects x features matrix
  # covariates: tibble with columns age, sex, diagnosis, scanner
  covariates <- tibble::as_tibble(covariates)
  setup <- deepcombat_setup(~ age + sex + diagnosis, ~ scanner, data, covariates)
  trained_model <- deepcombat_trainer(setup, verbose = TRUE)
  harmonized <- deepcombat_harmonize(setup, trained_model)
  ```

  Pass covariates as a tibble. DeepComBat indexes them in a way that fails for
  a plain data.frame with "invalid subscript type 'symbol'".

  Run a script non-interactively with `Rscript my_harmonization.R`.

  More documentation can be found here: https://github.com/hufengling/DeepComBat

  Citation:
  ```
  Hu, F., Lucas, A., Chen, A.A., Coleman, K., Horng, H., Ng, R.W., Tustison, N.J., Davis, K.A., Shou, H., Li, M., Shinohara, R.T., The Alzheimer's Disease Neuroimaging Initiative. (2023). DeepComBat: A Statistically Motivated, Hyperparameter-Robust, Deep Learning Approach to Harmonization of Neuroimaging Data. bioRxiv. https://doi.org/10.1101/2023.04.24.537396
  ```

  To run container outside of this environment: ml deepcombat/{{ context.version }}

  ----------------------------------

