        emit("end")
    PYTHON
    case "$(uname -m)" in
      aarch64|arm64)
        if /usr/bin/python3 - <<'INERT_MMAP_SETUP_PY'
    import time
    entry_deadline = time.monotonic() + 15
    import signal
    signal.signal(signal.SIGALRM, signal.SIG_DFL)
    if time.monotonic() >= entry_deadline:
        raise SystemExit('inert setup deadline')
    signal.setitimer(signal.ITIMER_REAL, entry_deadline - time.monotonic())
    import hashlib
    import json
    import os
    from pathlib import Path
    import stat
    import sys
    from types import ModuleType


    def _read_inert_input(
        directory_fd: int, name: str, cap: int, entry_deadline: float,
    ) -> bytes:
        if not name or '/' in name or name in ('.', '..'):
            raise ValueError('inert input name')
        deadline = min(entry_deadline, time.monotonic() + 3)
        fd = os.open(name, os.O_RDONLY | os.O_NONBLOCK | os.O_NOFOLLOW, dir_fd=directory_fd)
        try:
            before = os.fstat(fd)
            if not stat.S_ISREG(before.st_mode) or not 0 < before.st_size <= cap:
                raise ValueError('inert input type or cap')
            data = bytearray()
            while True:
                if time.monotonic() >= deadline:
                    raise TimeoutError('inert input deadline')
                block = os.read(fd, min(65536, cap + 1 - len(data)))
                if not block:
                    break
                data.extend(block)
                if len(data) > cap:
                    raise ValueError('inert input cap')
            for after in (os.fstat(fd), os.stat(name, dir_fd=directory_fd, follow_symlinks=False)):
                if (before.st_dev, before.st_ino, before.st_mode, before.st_size, before.st_mtime_ns, before.st_ctime_ns) != (
                        after.st_dev, after.st_ino, after.st_mode, after.st_size, after.st_mtime_ns, after.st_ctime_ns):
                    raise ValueError('inert input changed')
            if len(data) != before.st_size or time.monotonic() >= deadline:
                raise ValueError('inert input incomplete or expired')
            return bytes(data)
        finally:
            os.close(fd)


    work = Path.cwd()
    directory_fd = os.open(work / '.pydeface-inert-r46', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
    try:
        seal_raw = _read_inert_input(directory_fd, 'seal.json', 65536, entry_deadline)
        origin_raw = _read_inert_input(directory_fd, 'origin.json', 1024 ** 2, entry_deadline)
        program = _read_inert_input(directory_fd, 'program.py', 1024 ** 2, entry_deadline)
    finally:
        os.close(directory_fd)
    seal = json.loads(seal_raw)
    document = json.loads(origin_raw)
    origin = document['origin']
    records = {item['name']: item for item in seal['files']}
    if set(records) != {'program.py', 'origin.json'} or len(seal['files']) != 2:
        raise ValueError('inert seal members')
    for name, data in (('program.py', program), ('origin.json', origin_raw)):
        if records[name] != dict(name=name, size=len(data), sha256=hashlib.sha256(data).hexdigest()):
            raise ValueError('inert input digest mismatch')
    if (origin['work'] != str(work) or origin['capsule_id'] != seal['capsule_id']
            or origin['program_sha256'] != records['program.py']['sha256']
            or origin['setup_script_sha256'] != seal['setup_script_sha256']):
        raise ValueError('inert origin binding')
    launch_raw = bytes.fromhex(document['launch_bytes_hex'])
    if (origin['launch_receipt'] != dict(name='launch.json', size=len(launch_raw),
                                        sha256=hashlib.sha256(launch_raw).hexdigest())
            or json.loads(launch_raw) != document['launch']):
        raise ValueError('inert launch binding')
    launch = document['launch']
    if (launch['work'] != origin['work'] or launch['boot_id'] != origin['runner']['boot_id']
            or launch['source_sha256'] != origin['source_suite_sha256']
            or launch['staged_sha256'] != origin['staged_suite_sha256']
            or launch['helper_sha256'] != origin['host_script_sha256']
            or launch['owner']['pid'] != origin['runner']['pid']
            or launch['owner']['ticks'] != origin['runner']['start_ticks']):
        raise ValueError('inert launch context')
    if time.monotonic() >= entry_deadline:
        raise TimeoutError('inert setup deadline before compilation')
    probe = ModuleType('_pydeface_inert_r46')
    sys.modules[probe.__name__] = probe
    exec(compile(program, '<pydeface-inert-r46:' + origin['program_sha256'] + '>', 'exec'), probe.__dict__)
    if time.monotonic() >= entry_deadline:
        raise TimeoutError('inert setup deadline after compilation')
    probe._run_inert_mmap(Path.cwd(), entry_deadline)
    INERT_MMAP_SETUP_PY
        then
          :
        else
          printf '%s\n' 'PYDEFACE_INERT_R46 setup unavailable'
        fi
        ;;
    esac

tests:
  # ==========================================================================
  # BASIC FUNCTIONALITY - pydeface
  # ==========================================================================
  - name: pydeface version check
    description: Verify pydeface binary runs and reports version
    command: pydeface --help 2>&1 | head -3
    expected_output_contains: "pydeface ${version}"

  - name: pydeface help
    description: Verify pydeface displays help message
    command: pydeface --help
    expected_output_contains: "Path to input nifti"

  # ==========================================================================
  # BASIC DEFACING OPERATIONS
  # ==========================================================================
  - name: Basic defacing with default output
    env_setup: &registration_diagnostics |
      export PYTHONUNBUFFERED=1
      pydeface() { python -u test_output/diagnose_pydeface.py "$@"; }
    description: Deface T1w image with corratio cost (default mutualinfo is too slow)
    command: pydeface ${t1w} --outfile test_output/t1w_defaced_default.nii.gz --cost corratio --verbose
    timeout: 300
    validate:
      - output_exists: ${output_dir}/t1w_defaced_default.nii.gz
      - same_dimensions: ["${output_dir}/t1w_defaced_default.nii.gz", "${t1w}"]

  - name: Defacing with custom output path
    description: Deface T1w image with explicit output filename
    command: pydeface ${t1w} --outfile test_output/t1w_custom_defaced.nii.gz --cost corratio --verbose
    timeout: 300
    validate:
      - output_exists: ${output_dir}/t1w_custom_defaced.nii.gz

  - name: Defacing with force overwrite
    description: Deface and force overwrite existing output
    command: pydeface ${t1w} --outfile test_output/t1w_defaced_default.nii.gz --cost corratio --force --verbose
    depends_on: Basic defacing with default output
    timeout: 300
    validate:
      - output_exists: ${output_dir}/t1w_defaced_default.nii.gz

  # ==========================================================================
  # COST FUNCTION OPTIONS
  # ==========================================================================
  - name: Defacing with mutualinfo cost
    env_setup: *registration_diagnostics
    description: Test defacing with mutual information cost function (default, slow)
    command: pydeface ${t1w} --outfile test_output/t1w_defaced_mutualinfo.nii.gz --cost mutualinfo --verbose
    timeout: 600
    validate:
      - output_exists: ${output_dir}/t1w_defaced_mutualinfo.nii.gz

  - name: Defacing with corratio cost
    description: Test defacing with correlation ratio cost function
    command: pydeface ${t1w} --outfile test_output/t1w_defaced_corratio.nii.gz --cost corratio --verbose
    timeout: 300
    validate:
      - output_exists: ${output_dir}/t1w_defaced_corratio.nii.gz

  - name: Defacing with normcorr cost
    description: Test defacing with normalized correlation cost function
    command: pydeface ${t1w} --outfile test_output/t1w_defaced_normcorr.nii.gz --cost normcorr --verbose
    timeout: 300
    validate:
      - output_exists: ${output_dir}/t1w_defaced_normcorr.nii.gz

  - name: Defacing with normmi cost
    env_setup: *registration_diagnostics
    description: Test defacing with normalized mutual information cost function
    command: pydeface ${t1w} --outfile test_output/t1w_defaced_normmi.nii.gz --cost normmi --verbose
    timeout: 300
    validate:
      - output_exists: ${output_dir}/t1w_defaced_normmi.nii.gz

  - name: Defacing with leastsq cost
    description: Test defacing with least squares cost function
    command: pydeface ${t1w} --outfile test_output/t1w_defaced_leastsq.nii.gz --cost leastsq --verbose
    timeout: 300
    validate:
      - output_exists: ${output_dir}/t1w_defaced_leastsq.nii.gz

  # ==========================================================================
  # APPLY TO MULTIPLE IMAGES
  # ==========================================================================
  - name: Defacing with applyto single image
    description: Apply defacing mask to another image (same dimensions required)
    command: pydeface ${t1w} --outfile test_output/t1w_defaced_applyto.nii.gz --cost corratio --applyto ${t1w} --verbose
    timeout: 300
    validate:
      - output_exists: ${output_dir}/t1w_defaced_applyto.nii.gz

  # ==========================================================================
  # DEBUGGING AND VERBOSE OPTIONS
  # ==========================================================================
  - name: Defacing with nocleanup
    description: Test defacing without cleaning up temporary files
    command: pydeface ${t1w} --outfile test_output/t1w_defaced_nocleanup.nii.gz --cost corratio --nocleanup --verbose
    timeout: 300
    validate:
      - output_exists: ${output_dir}/t1w_defaced_nocleanup.nii.gz

  - name: Defacing with verbose output
    description: Test defacing with verbose status messages
    command: pydeface ${t1w} --outfile test_output/t1w_defaced_verbose.nii.gz --cost corratio --verbose 2>&1
    timeout: 300
    expected_output_contains: "Defacing"
    validate:
      - output_exists: ${output_dir}/t1w_defaced_verbose.nii.gz

  # ==========================================================================
  # DEFACING DIFFERENT IMAGE TYPES
  # ==========================================================================
  - name: Deface T2 image
    env_setup: *registration_diagnostics
    description: Deface inplane T2 image
    command: pydeface ${t2} --outfile test_output/t2_defaced.nii.gz --verbose
    timeout: 300
    validate:
      - output_exists: ${output_dir}/t2_defaced.nii.gz
      - same_dimensions: ["${output_dir}/t2_defaced.nii.gz", "${t2}"]

  # ==========================================================================
  # FSL TOOLS (bundled with container)
  # ==========================================================================
  - name: FSL flirt version check
    description: Verify FSL FLIRT is available (required by pydeface)
    command: flirt -version 2>&1 || flirt 2>&1 | head -1
    expected_output_contains: "FLIRT"

  - name: FSL flirt basic registration
    description: Test FLIRT registration between T1w and T2
    command: flirt -in ${t2} -ref ${t1w} -out test_output/t2_to_t1w_flirt.nii.gz -omat test_output/t2_to_t1w.mat -dof 6
    timeout: 180
    validate:
      - output_exists: ${output_dir}/t2_to_t1w_flirt.nii.gz
      - output_exists: ${output_dir}/t2_to_t1w.mat

  - name: FSL flirt with mutualinfo cost
    description: Test FLIRT with mutual information cost function
    command: flirt -in ${t2} -ref ${t1w} -out test_output/t2_to_t1w_mi.nii.gz -cost mutualinfo -dof 6
    timeout: 180
    validate:
      - output_exists: ${output_dir}/t2_to_t1w_mi.nii.gz

  - name: FSL flirt apply transform
    description: Apply existing transformation matrix
    command: flirt -in ${t2} -ref ${t1w} -applyxfm -init test_output/t2_to_t1w.mat -out test_output/t2_to_t1w_applied.nii.gz
    depends_on: FSL flirt basic registration
    validate:
      - output_exists: ${output_dir}/t2_to_t1w_applied.nii.gz

  - name: FSL convert_xfm invert
    description: Invert a transformation matrix
    command: convert_xfm -omat test_output/t1w_to_t2.mat -inverse test_output/t2_to_t1w.mat
    depends_on: FSL flirt basic registration
    validate:
      - output_exists: ${output_dir}/t1w_to_t2.mat

  - name: FSL fslstats basic
    description: Get basic statistics from image
    command: fslstats ${t1w} -m -s
    expected_output_contains: ""

  - name: FSL fslstats volume
    description: Get volume statistics
    command: fslstats ${t1w} -V
    expected_output_contains: ""

  - name: FSL fslstats robust range
    description: Get robust intensity range
    command: fslstats ${t1w} -r
    expected_output_contains: ""

  - name: FSL fslinfo
    description: Get image header information
    command: fslinfo ${t1w}
    expected_output_contains: "dim1"

  - name: FSL fslhd
    description: Get detailed NIfTI header
    command: fslhd ${t1w} | head -30
    expected_output_contains: "sizeof_hdr"

  - name: FSL fslmaths copy
    description: Copy image using fslmaths
    command: fslmaths ${t1w} test_output/t1w_copy.nii.gz
    validate:
      - output_exists: ${output_dir}/t1w_copy.nii.gz

  - name: FSL fslmaths threshold
    description: Apply threshold using fslmaths
    command: fslmaths ${t1w} -thr 100 test_output/t1w_thr100.nii.gz
    validate:
      - output_exists: ${output_dir}/t1w_thr100.nii.gz

  - name: FSL fslmaths binarize
    description: Binarize image using fslmaths
    command: fslmaths ${t1w} -bin test_output/t1w_bin.nii.gz
    validate:
      - output_exists: ${output_dir}/t1w_bin.nii.gz

  - name: FSL fslmaths smooth
    description: Gaussian smoothing using fslmaths
    command: fslmaths ${t1w} -s 2 test_output/t1w_smooth.nii.gz
    validate:
      - output_exists: ${output_dir}/t1w_smooth.nii.gz

  - name: FSL fslmaths masking
    description: Apply mask using fslmaths
    command: fslmaths ${t1w} -mas test_output/t1w_bin.nii.gz test_output/t1w_masked.nii.gz
    depends_on: FSL fslmaths binarize
    validate:
      - output_exists: ${output_dir}/t1w_masked.nii.gz

  - name: FSL fslmaths arithmetic
    description: Test arithmetic operations
    command: fslmaths ${t1w} -mul 2 -add 100 test_output/t1w_arith.nii.gz
    validate:
      - output_exists: ${output_dir}/t1w_arith.nii.gz

  - name: FSL fslroi extract subvolume
    description: Extract ROI from volume
    command: fslroi ${t1w} test_output/t1w_roi.nii.gz 40 80 40 80 40 80
    validate:
      - output_exists: ${output_dir}/t1w_roi.nii.gz

  - name: FSL fslsplit check
    description: Check fslsplit is available
    command: fslsplit 2>&1
    expected_exit_code: 1
    expected_output_contains: "Usage: fslsplit"

  - name: FSL fslmerge check
    description: Check fslmerge is available
    command: fslmerge 2>&1
    expected_exit_code: 1
    expected_output_contains: "Usage: fslmerge"

  - name: FSL bet brain extraction
    description: Simple brain extraction using BET
    command: bet ${t1w} test_output/t1w_brain.nii.gz -f 0.5
    timeout: 120
    validate:
      - output_exists: ${output_dir}/t1w_brain.nii.gz

  - name: FSL bet with mask
    description: Brain extraction with binary mask output
    command: bet ${t1w} test_output/t1w_brain_mask -m -f 0.5
    timeout: 120
    validate:
      - output_exists: ${output_dir}/t1w_brain_mask.nii.gz
      - output_exists: ${output_dir}/t1w_brain_mask_mask.nii.gz

  # ==========================================================================
  # NIBABEL UTILITIES
  # ==========================================================================
  - name: nib-ls image info
    description: List image properties using nibabel
    command: nib-ls ${t1w}
    expected_output_contains: ""

  - name: nib-ls verbose
    description: List image properties with verbose output
    command: nib-ls -v ${t1w}
    expected_output_contains: ""

  - name: nib-ls with stats
    description: List image properties with statistics
    command: nib-ls -s ${t1w}
    expected_output_contains: ""

  - name: nib-ls header fields
    description: List image with specific header fields
    command: nib-ls -H "dim,pixdim" ${t1w}
    expected_output_contains: ""

  - name: nib-convert to float32
    description: Convert image datatype to float32
    command: nib-convert ${t1w} test_output/t1w_float32.nii.gz --out-dtype float32
    validate:
      - output_exists: ${output_dir}/t1w_float32.nii.gz

  - name: nib-convert to int16
    description: Convert image datatype to int16
    command: nib-convert ${t1w} test_output/t1w_int16.nii.gz --out-dtype int16
    validate:
      - output_exists: ${output_dir}/t1w_int16.nii.gz

  - name: nib-convert force overwrite
    description: Convert with force overwrite
    command: nib-convert ${t1w} test_output/t1w_float32.nii.gz --out-dtype float32 --force
    depends_on: nib-convert to float32
    validate:
      - output_exists: ${output_dir}/t1w_float32.nii.gz

  # ==========================================================================
  # PYTHON/NIBABEL DIRECT ACCESS
  # ==========================================================================
  - name: Python nibabel import
    description: Verify nibabel can be imported
    command: |
      python -c "import nibabel as nib; print(f'nibabel version: {nib.__version__}')"
    expected_output_contains: "nibabel version"

  - name: Python nibabel load image
    description: Load and inspect image with nibabel
    command: |
      python -c "import nibabel as nib; img = nib.load('${t1w}'); print(f'Shape: {img.shape}, Dtype: {img.get_data_dtype()}')"
    expected_output_contains: "Shape"

  - name: Python pydeface import
    description: Verify pydeface can be imported
    command: python -c "import pydeface; print('pydeface imported successfully')"
    expected_output_contains: "pydeface imported successfully"

  - name: Python nipype import
    description: Verify nipype can be imported (pydeface dependency)
    command: |
      python -c "import nipype; print(f'nipype version: {nipype.__version__}')"
    expected_output_contains: "nipype version"

  - name: Python numpy import
    description: Verify numpy can be imported
    command: |
      python -c "import numpy as np; print(f'numpy version: {np.__version__}')"
    expected_output_contains: "numpy version"

  # ==========================================================================
  # OUTPUT VALIDATION
  # ==========================================================================
  - name: Validate defaced image has same dimensions
    description: Ensure defaced output has same dimensions as input
    command: |
      python -c "
      import nibabel as nib
      orig = nib.load('${t1w}')
      defaced = nib.load('test_output/t1w_defaced_default.nii.gz')
      assert orig.shape == defaced.shape, f'Shape mismatch: {orig.shape} vs {defaced.shape}'
      print(f'Dimensions match: {orig.shape}')
      "
    depends_on: Basic defacing with default output
    expected_output_contains: "Dimensions match"

  - name: Validate defaced image has modified voxels
    description: Ensure defacing actually modified some voxels (face region zeroed)
    command: |
      python -c "
      import nibabel as nib
      import numpy as np
      orig = nib.load('${t1w}')
      defaced = nib.load('test_output/t1w_defaced_default.nii.gz')
      orig_data = orig.get_fdata()
      defaced_data = defaced.get_fdata()
      diff = np.sum(orig_data != defaced_data)
      print(f'Modified voxels: {diff}')
      assert diff > 0, 'No voxels were modified - defacing may have failed'
      "
    depends_on: Basic defacing with default output
    expected_output_contains: "Modified voxels"

  - name: Validate defaced image header preserved
    description: Ensure defaced image preserves essential header info
    command: |
      python -c "
      import nibabel as nib
      orig = nib.load('${t1w}')
      defaced = nib.load('test_output/t1w_defaced_default.nii.gz')
      import numpy as np
      np.testing.assert_array_equal(orig.affine, defaced.affine)
      np.testing.assert_array_equal(orig.header.get_zooms(), defaced.header.get_zooms())
      print(f'Header preserved: affine shape {orig.affine.shape}')
      "
    depends_on: Basic defacing with default output
    expected_output_contains: "Header preserved"

  # ==========================================================================
  # EDGE CASES AND ERROR HANDLING
  # ==========================================================================
  - name: pydeface with missing input
    description: Test error handling for missing input file
    command: pydeface nonexistent_file.nii.gz 2>&1
    expected_exit_code: 1
    expected_output_contains: ["Traceback", "nonexistent_file.nii.gz"]

  - name: pydeface with invalid cost function
    description: Test error handling for invalid cost function
    command: pydeface ${t1w} --outfile ${output_dir}/invalid-cost-result.nii.gz --force --cost invalid_cost 2>&1
    expected_exit_code: 1
    expected_output_contains: ["cost_func", "invalid_cost"]

  # ==========================================================================
  # TEMPLATE AND FACEMASK LOCATIONS
  # ==========================================================================
  - name: Check default template exists
    description: Verify default registration template is present
    command: "python -c \"import pathlib, pydeface; path = pathlib.Path(pydeface.__file__).parent / 'data' / 'mean_reg2mean.nii.gz'; print(path); raise SystemExit(0 if path.is_file() else 1)\""
    expected_output_contains: "mean_reg2mean.nii.gz"

  - name: Check default facemask exists
    description: Verify default face mask is present
    command: "python -c \"import pathlib, pydeface; path = pathlib.Path(pydeface.__file__).parent / 'data' / 'facemask.nii.gz'; print(path); raise SystemExit(0 if path.is_file() else 1)\""
    expected_output_contains: "facemask.nii.gz"

  - name: Inspect default template
    description: Get info about default template image
    command: "python -c \"import pathlib, pydeface, subprocess, sys; path = pathlib.Path(pydeface.__file__).parent / 'data' / 'mean_reg2mean.nii.gz'; sys.exit(subprocess.call(['nib-ls', str(path)]))\""
    expected_output_contains: ""

  - name: Inspect default facemask
    description: Get info about default face mask image
    command: "python -c \"import pathlib, pydeface, subprocess, sys; path = pathlib.Path(pydeface.__file__).parent / 'data' / 'facemask.nii.gz'; sys.exit(subprocess.call(['nib-ls', str(path)]))\""
    expected_output_contains: ""

  # ==========================================================================
  # COMBINED WORKFLOWS
  # ==========================================================================
  - name: Complete defacing workflow
    description: Full workflow - deface, verify, and extract brain
    command: |
      pydeface ${t1w} --outfile test_output/workflow_defaced.nii.gz --cost corratio --verbose && \
      nib-ls -s test_output/workflow_defaced.nii.gz && \
      bet test_output/workflow_defaced.nii.gz test_output/workflow_defaced_brain.nii.gz -f 0.5
    timeout: 300
    validate:
      - output_exists: ${output_dir}/workflow_defaced.nii.gz
      - output_exists: ${output_dir}/workflow_defaced_brain.nii.gz

  - name: Multi-contrast defacing workflow
    description: Deface T1w and apply mask to same-resolution image (cross-resolution applyto not supported)
    command: |
      pydeface ${t1w} --outfile test_output/multicontrast_t1w_defaced.nii.gz --cost corratio --applyto ${t1w} --force --verbose
    timeout: 300
    validate:
      - output_exists: ${output_dir}/multicontrast_t1w_defaced.nii.gz

  - name: Quality check after defacing
    description: Compare statistics before and after defacing
    command: |
      echo "Original T1w stats:" && \
      fslstats ${t1w} -m -s -R && \
      echo "Defaced T1w stats:" && \
      fslstats test_output/t1w_defaced_default.nii.gz -m -s -R
    depends_on: Basic defacing with default output
    expected_output_contains: "Original T1w stats"


  - name: Exact architecture-specific runtime versions
    description: Require the current PyDeface/scientific pins and official architecture-specific FSL version without changing the x86 base
    command: |
      set -euo pipefail
      case "$(uname -m)" in
        aarch64) expected="${fsl_arm64_version}" ;;
        x86_64) expected="${fsl_x86_version}" ;;
        *) exit 1 ;;
      esac
      actual="$(cat "$FSLDIR/etc/fslversion")"
      printf 'FSL runtime at %s reports %s; expected %s\n' "$FSLDIR" "$actual" "$expected"
      test "$actual" = "$expected"
      python -m pip check
      python - <<'PYTHON'
      from importlib.metadata import version
      expected={'pydeface':'${pydeface_version}','numpy':'2.2.6','scipy':'1.16.3','nibabel':'5.4.2','nipype':'1.12.0'}
      for package,wanted in expected.items():
          assert version(package)==wanted,(package,version(package),wanted)
      print('Exact PyDeface scientific versions and official FSL runtime verified')
      PYTHON
    expected_output_contains: Exact PyDeface scientific versions and official FSL runtime verified
    expected_exit_code: 0

  - name: Every defaced voxel matches the actual registered mask
    description: Run real registration/defacing on a private image copy and assert its full mask product within NIfTI storage quantization, nontrivial removed/retained tissue and exact physical geometry
    timeout: 600
    command: |
      env -u HOME OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 python - <<'PYTHON'
      import hashlib
      import os
      from pathlib import Path
      import shutil
      import subprocess
      import tempfile
      import nibabel as nib
      import numpy as np
      with tempfile.TemporaryDirectory(dir=Path('${output_dir}').resolve()) as directory:
          root = Path(directory)
          original = root/'anatomical.nii.gz'
          output = root/'anatomical-defaced.nii.gz'
          shutil.copyfile('${t1w}',original)
          before = hashlib.sha256(original.read_bytes()).hexdigest()
          environment = dict(os.environ,TMPDIR=str(root))
          subprocess.run(['pydeface',str(original),'--outfile',str(output),'--cost','corratio','--nocleanup','--verbose'],env=environment,check=True)
          mask_path = root/'anatomical_pydeface_mask.nii.gz'
          assert mask_path.is_file() and (root/'anatomical_pydeface.mat').is_file()
          source = nib.load(original)
          result = nib.load(output)
          mask_image = nib.load(mask_path)
          values = np.asanyarray(source.dataobj)
          mask = np.asanyarray(mask_image.dataobj)
          actual = result.get_fdata()
          expected = np.asarray(values*mask,dtype=np.float64)
          assert source.shape==result.shape==mask_image.shape
          np.testing.assert_array_equal(source.affine,result.affine)
          np.testing.assert_array_equal(source.header.get_zooms(),result.header.get_zooms())
          assert np.isfinite(mask).all() and np.isfinite(actual).all()
          assert mask.min()>=0 and mask.max()<=1+8*np.finfo(np.float32).eps
          # PyDeface preserves the input storage type. Bound the documented NIfTI
          # integer quantization by half a stored bin, plus float32 scaling roundoff.
          step = abs(float(result.dataobj.slope)) if np.issubdtype(result.get_data_dtype(),np.integer) else 0.0
          bound = step/2+8*np.finfo(np.float32).eps*max(1.0,float(np.max(np.abs(expected))))
          assert np.max(np.abs(actual-expected))<=bound
          removed = np.count_nonzero((values!=0)&(mask==0))
          retained = np.count_nonzero((values!=0)&(mask==1))
          assert removed>1000 and retained>1000
          assert removed<np.count_nonzero(values)
          assert hashlib.sha256(original.read_bytes()).hexdigest()==before
          print('Mask product checked for',values.size,'voxels; removed',removed,'retained',retained,'NIfTI storage bound',bound)
      print('Actual PyDeface registration and mask application agree at every voxel with unchanged input and spatial geometry')
      PYTHON
    expected_output_contains: Actual PyDeface registration and mask application agree at every voxel with unchanged input and spatial geometry
    expected_exit_code: 0

  - name: Native ARM diagnosis requires review
    description: Temporary failure gate until the native registration evidence is reviewed and diagnostics are removed
    command: |
      case "$(uname -m)" in
        aarch64|arm64)
          if python3 - <<'INERT_MMAP_REPORT_PY'
      import time
      report_deadline = time.monotonic() + 3
      import signal
      signal.signal(signal.SIGALRM, signal.SIG_DFL)
      if time.monotonic() >= report_deadline:
          raise SystemExit('inert reporter deadline')
      signal.setitimer(signal.ITIMER_REAL, report_deadline - time.monotonic())
      import base64
      import hashlib
      import json
      import os
      from pathlib import Path
      import re
      import stat
      import sys


      def _read_inert_member(
          directory_fd: int, name: str, cap: int, report_deadline: float,
      ) -> bytes:
          if not name or '/' in name or name in ('.', '..'):
              raise ValueError('inert member name')
          fd = os.open(name, os.O_RDONLY | os.O_NONBLOCK | os.O_NOFOLLOW, dir_fd=directory_fd)
          try:
              before = os.fstat(fd)
              if not stat.S_ISREG(before.st_mode) or before.st_size > cap:
                  raise ValueError('inert member type or cap')
              data = bytearray()
              while True:
                  if time.monotonic() >= report_deadline:
                      raise TimeoutError('inert reporter deadline')
                  block = os.read(fd, min(65536, cap + 1 - len(data)))
                  if not block:
                      break
                  data.extend(block)
                  if len(data) > cap:
                      raise ValueError('inert member cap')
              for after in (os.fstat(fd), os.stat(name, dir_fd=directory_fd, follow_symlinks=False)):
                  if (before.st_dev, before.st_ino, before.st_mode, before.st_size, before.st_mtime_ns, before.st_ctime_ns) != (
                          after.st_dev, after.st_ino, after.st_mode, after.st_size, after.st_mtime_ns, after.st_ctime_ns):
                      raise ValueError('inert member changed')
              if len(data) != before.st_size or time.monotonic() >= report_deadline:
                  raise ValueError('inert member incomplete or expired')
              return bytes(data)
          finally:
              os.close(fd)


      frame = dict(namespace='pydeface.inert-mmap.r46', status='unsealed', members=[], omitted_files=[],
                   native_acceptance=False, scientific_acceptance=False, release_pass=False, merge_eligible=False)
      raw_total = 0
      payloads = {}
      expected = {}
      directories = {}
      try:
          directories[''] = os.open(Path.cwd() / '.pydeface-inert-r46', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          for name in ('controller', 'observations'):
              try:
                  directories[name] = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW,
                                              dir_fd=directories[''])
              except OSError as error:
                  frame['omitted_files'].append(dict(name=name, reason=str(error)[:256], size=None, sha256=None))
          members = [('', 'seal.json'), ('', 'origin.json'), ('controller', 'seal.json'),
                     ('controller', 'envelope.json'), ('', 'program.py')]
          if 'observations' in directories:
              names = os.listdir(directories['observations'])
              if len(names) > 128:
                  raise ValueError('inert report file count')
              allowed = {'prerequisite.json', 'context.json', 'self-mountinfo.txt', 'self-mountinfo.txt.json',
                         'kernel-version.txt', 'kernel-version.txt.json', 'runner-mountinfo.txt',
                         'runner-mountinfo.txt.json', 'source-before.json', 'source-live.json', 'source-after.json',
                         'maps-before.txt', 'maps-before.txt.json', 'maps-live.txt', 'maps-live.txt.json',
                         'maps-after.txt', 'maps-after.txt.json', 'mmap-call.json', 'descriptor-stability.json', 'focused-descriptors.json',
                         'numeric-pairs.json', 'focus.json', 'objects.json', 'mapped-object-refusal.json',
                         'inventory-outcome.json', 'cleanup.json', 'terminal.json'}
              for name in sorted(names):
                  if name in allowed or re.fullmatch(
                          r'fd-(probe_root|mmap_source|focused_rooted_reopen|map_files_reopen)-\d{1,12}-\d{1,24}'
                          r'(\.txt|-mountinfo\.txt|-mount\.json)', name):
                      members.append(('observations', name))
                  else:
                      frame['omitted_files'].append(dict(name='observations/' + name[:160],
                                                        reason='not an allowed observation member', size=None, sha256=None))
          for directory, name in members:
              path = directory + '/' + name if directory else name
              size = digest = None
              try:
                  directory_fd = directories[directory]
                  info = os.stat(name, dir_fd=directory_fd, follow_symlinks=False)
                  size = info.st_size
                  data = _read_inert_member(directory_fd, name, min(4 * 1024 ** 2 - raw_total, 8 * 1024 ** 2), report_deadline)
                  digest = hashlib.sha256(data).hexdigest()
                  if path in expected and (expected[path]['size'] != len(data) or expected[path]['sha256'] != digest):
                      raise ValueError('inert member differs from recorded bytes')
                  payloads[path] = data
                  if path == 'seal.json':
                      value = json.loads(data)
                      if len(value['files']) != 2 or {item['name'] for item in value['files']} != {'program.py', 'origin.json'}:
                          raise ValueError('inert stage seal members')
                      expected.update({item['name']: item for item in value['files']})
                  elif path == 'controller/seal.json':
                      value = json.loads(data)
                      if value['envelope']['name'] != 'envelope.json':
                          raise ValueError('inert controller seal member')
                      expected['controller/envelope.json'] = value['envelope']
                  elif path == 'controller/envelope.json':
                      value = json.loads(data)
                      if len(value['actual_files']) > 128:
                          raise ValueError('inert controller file count')
                      for item in value['actual_files']:
                          if not re.fullmatch(r'observations/[a-zA-Z0-9_.-]{1,160}', item['name']):
                              raise ValueError('inert controller member name')
                          expected[item['name']] = item
                  frame['members'].append(dict(name=path, size=len(data), sha256=digest,
                                               base64=base64.b64encode(data).decode('ascii')))
                  raw_total += len(data)
              except (OSError, ValueError, KeyError, TypeError) as error:
                  payloads.pop(path, None)
                  frame['omitted_files'].append(dict(name=path, reason=type(error).__name__ + ': ' + str(error)[:256],
                                                    size=size, sha256=digest))
          try:
              origin = json.loads(payloads['origin.json'])['origin']
              stage = json.loads(payloads['seal.json'])
              seal = json.loads(payloads['controller/seal.json'])
              envelope = json.loads(payloads['controller/envelope.json'])
              if (origin['work'] != str(Path.cwd()) or origin['capsule_id'] != stage['capsule_id']
                      or origin['capsule_id'] != seal['capsule_id'] or origin['capsule_id'] != envelope['capsule_id']
                      or origin['program_sha256'] != hashlib.sha256(payloads['program.py']).hexdigest()
                      or seal['program_sha256'] != origin['program_sha256']
                      or seal['origin_sha256'] != hashlib.sha256(payloads['origin.json']).hexdigest()
                      or stage['setup_script_sha256'] != origin['setup_script_sha256']
                      or seal['status'] != envelope['status'] or not seal['sealed_at'] < seal['entry_deadline']):
                  raise ValueError('inert capsule binding')
              frame['status'] = 'sealed'
              frame['collection_status'] = envelope['status']
              frame['capsule_id'] = origin['capsule_id']
          except (KeyError, ValueError, TypeError) as error:
              frame['seal_validation'] = type(error).__name__ + ': ' + str(error)[:256]
          exported = {item['name'] for item in frame['members']}
          for name, item in expected.items():
              if name not in exported and name not in {item['name'] for item in frame['omitted_files']}:
                  frame['omitted_files'].append(dict(name=name, reason='recorded member not exported', size=None, sha256=None))
      except (OSError, ValueError, KeyError, TypeError) as error:
          frame['reason'] = type(error).__name__ + ': ' + str(error)[:256]
      finally:
          for fd in directories.values():
              os.close(fd)
      frame['raw_exported_bytes'] = raw_total
      if frame['status'] == 'sealed' and frame['omitted_files']:
          frame['status'] = 'sealed_partial_export'
      prefix = b'PYDEFACE_INERT_R46_BEGIN\n'
      suffix = b'\nPYDEFACE_INERT_R46_END\n'
      encoded = prefix + json.dumps(frame, sort_keys=True, separators=(',', ':')).encode() + suffix
      while len(encoded) > 6 * 1024 ** 2 and frame['members']:
          member = frame['members'].pop()
          raw_total -= member['size']
          frame['omitted_files'].append({key: value for key, value in member.items() if key != 'base64'} | dict(reason='encoded frame cap'))
          frame['raw_exported_bytes'] = raw_total
          if frame['status'] == 'sealed':
              frame['status'] = 'sealed_partial_export'
          encoded = prefix + json.dumps(frame, sort_keys=True, separators=(',', ':')).encode() + suffix
      if len(encoded) > 6 * 1024 ** 2 or time.monotonic() >= report_deadline:
          raise ValueError('inert frame cap or deadline')
      sys.stdout.buffer.write(encoded)
      sys.stdout.buffer.flush()
      INERT_MMAP_REPORT_PY
          then
            :
          else
            printf '%s\n' 'PYDEFACE_INERT_R46 report unavailable'
          fi
          ;;
      esac
      echo "DIAGNOSTICBLOCKED PR 3580 native ARM registration is not repaired or approved"
      exit 1
    expected_exit_code: 0

