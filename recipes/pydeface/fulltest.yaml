      defaced = nib.load('test_output/t1w_defaced_default.nii.gz')
      assert orig.shape == defaced.shape, f'Shape mismatch: {orig.shape} vs {defaced.shape}'
      print(f'Dimensions match: {orig.shape}')
      "
    depends_on: Basic defacing with default output
    expected_output_contains: "Dimensions match"

  - name: Validate defaced image has modified voxels
    description: Ensure defacing actually modified some voxels (face region zeroed)
    command: |
      python -c "
      import nibabel as nib
      import numpy as np
      orig = nib.load('${t1w}')
      defaced = nib.load('test_output/t1w_defaced_default.nii.gz')
      orig_data = orig.get_fdata()
      defaced_data = defaced.get_fdata()
      diff = np.sum(orig_data != defaced_data)
      print(f'Modified voxels: {diff}')
      assert diff > 0, 'No voxels were modified - defacing may have failed'
      "
    depends_on: Basic defacing with default output
    expected_output_contains: "Modified voxels"

  - name: Validate defaced image header preserved
    description: Ensure defaced image preserves essential header info
    command: |
      python -c "
      import nibabel as nib
      orig = nib.load('${t1w}')
      defaced = nib.load('test_output/t1w_defaced_default.nii.gz')
      import numpy as np
      np.testing.assert_array_equal(orig.affine, defaced.affine)
      np.testing.assert_array_equal(orig.header.get_zooms(), defaced.header.get_zooms())
      print(f'Header preserved: affine shape {orig.affine.shape}')
      "
    depends_on: Basic defacing with default output
    expected_output_contains: "Header preserved"

  # ==========================================================================
  # EDGE CASES AND ERROR HANDLING
  # ==========================================================================
  - name: pydeface with missing input
    description: Test error handling for missing input file
    command: pydeface nonexistent_file.nii.gz 2>&1
    expected_exit_code: 1
    expected_output_contains: ["Traceback", "nonexistent_file.nii.gz"]

  - name: pydeface with invalid cost function
    description: Test error handling for invalid cost function
    command: pydeface ${t1w} --outfile ${output_dir}/invalid-cost-result.nii.gz --force --cost invalid_cost 2>&1
    expected_exit_code: 1
    expected_output_contains: ["cost_func", "invalid_cost"]

  # ==========================================================================
  # TEMPLATE AND FACEMASK LOCATIONS
  # ==========================================================================
  - name: Check default template exists
    description: Verify default registration template is present
    command: "python -c \"import pathlib, pydeface; path = pathlib.Path(pydeface.__file__).parent / 'data' / 'mean_reg2mean.nii.gz'; print(path); raise SystemExit(0 if path.is_file() else 1)\""
    expected_output_contains: "mean_reg2mean.nii.gz"

  - name: Check default facemask exists
    description: Verify default face mask is present
    command: "python -c \"import pathlib, pydeface; path = pathlib.Path(pydeface.__file__).parent / 'data' / 'facemask.nii.gz'; print(path); raise SystemExit(0 if path.is_file() else 1)\""
    expected_output_contains: "facemask.nii.gz"

  - name: Inspect default template
    description: Get info about default template image
    command: "python -c \"import pathlib, pydeface, subprocess, sys; path = pathlib.Path(pydeface.__file__).parent / 'data' / 'mean_reg2mean.nii.gz'; sys.exit(subprocess.call(['nib-ls', str(path)]))\""
    expected_output_contains: ""

  - name: Inspect default facemask
    description: Get info about default face mask image
    command: "python -c \"import pathlib, pydeface, subprocess, sys; path = pathlib.Path(pydeface.__file__).parent / 'data' / 'facemask.nii.gz'; sys.exit(subprocess.call(['nib-ls', str(path)]))\""
    expected_output_contains: ""

  # ==========================================================================
  # COMBINED WORKFLOWS
  # ==========================================================================
  - name: Complete defacing workflow
    description: Full workflow - deface, verify, and extract brain
    command: |
      pydeface ${t1w} --outfile test_output/workflow_defaced.nii.gz --cost corratio --verbose && \
      nib-ls -s test_output/workflow_defaced.nii.gz && \
      bet test_output/workflow_defaced.nii.gz test_output/workflow_defaced_brain.nii.gz -f 0.5
    timeout: 300
    validate:
      - output_exists: ${output_dir}/workflow_defaced.nii.gz
      - output_exists: ${output_dir}/workflow_defaced_brain.nii.gz

  - name: Multi-contrast defacing workflow
    description: Deface T1w and apply mask to same-resolution image (cross-resolution applyto not supported)
    command: |
      pydeface ${t1w} --outfile test_output/multicontrast_t1w_defaced.nii.gz --cost corratio --applyto ${t1w} --force --verbose
    timeout: 300
    validate:
      - output_exists: ${output_dir}/multicontrast_t1w_defaced.nii.gz

  - name: Quality check after defacing
    description: Compare statistics before and after defacing
    command: |
      echo "Original T1w stats:" && \
      fslstats ${t1w} -m -s -R && \
      echo "Defaced T1w stats:" && \
      fslstats test_output/t1w_defaced_default.nii.gz -m -s -R
    depends_on: Basic defacing with default output
    expected_output_contains: "Original T1w stats"


  - name: Exact architecture-specific runtime versions
    description: Require the current PyDeface/scientific pins and official architecture-specific FSL version without changing the x86 base
    command: |
      set -euo pipefail
      case "$(uname -m)" in
        aarch64) expected="${fsl_arm64_version}" ;;
        x86_64) expected="${fsl_x86_version}" ;;
        *) exit 1 ;;
      esac
      actual="$(cat "$FSLDIR/etc/fslversion")"
      printf 'FSL runtime at %s reports %s; expected %s\n' "$FSLDIR" "$actual" "$expected"
      test "$actual" = "$expected"
      python -m pip check
      python - <<'PYTHON'
      from importlib.metadata import version
      expected={'pydeface':'${pydeface_version}','numpy':'2.2.6','scipy':'1.16.3','nibabel':'5.4.2','nipype':'1.12.0'}
      for package,wanted in expected.items():
          assert version(package)==wanted,(package,version(package),wanted)
      print('Exact PyDeface scientific versions and official FSL runtime verified')
      PYTHON
    expected_output_contains: Exact PyDeface scientific versions and official FSL runtime verified
    expected_exit_code: 0

  - name: Every defaced voxel matches the actual registered mask
    description: Run real registration/defacing on a private image copy and assert its full mask product within NIfTI storage quantization, nontrivial removed/retained tissue and exact physical geometry
    timeout: 600
    command: |
      env -u HOME OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 python - <<'PYTHON'
      import hashlib
      import os
      from pathlib import Path
      import shutil
      import subprocess
      import tempfile
      import nibabel as nib
      import numpy as np
      with tempfile.TemporaryDirectory(dir=Path('${output_dir}').resolve()) as directory:
          root = Path(directory)
          original = root/'anatomical.nii.gz'
          output = root/'anatomical-defaced.nii.gz'
          shutil.copyfile('${t1w}',original)
          before = hashlib.sha256(original.read_bytes()).hexdigest()
          environment = dict(os.environ,TMPDIR=str(root))
          subprocess.run(['pydeface',str(original),'--outfile',str(output),'--cost','corratio','--nocleanup','--verbose'],env=environment,check=True)
          mask_path = root/'anatomical_pydeface_mask.nii.gz'
          assert mask_path.is_file() and (root/'anatomical_pydeface.mat').is_file()
          source = nib.load(original)
          result = nib.load(output)
          mask_image = nib.load(mask_path)
          values = np.asanyarray(source.dataobj)
          mask = np.asanyarray(mask_image.dataobj)
          actual = result.get_fdata()
          expected = np.asarray(values*mask,dtype=np.float64)
          assert source.shape==result.shape==mask_image.shape
          np.testing.assert_array_equal(source.affine,result.affine)
          np.testing.assert_array_equal(source.header.get_zooms(),result.header.get_zooms())
          assert np.isfinite(mask).all() and np.isfinite(actual).all()
          assert mask.min()>=0 and mask.max()<=1+8*np.finfo(np.float32).eps
          # PyDeface preserves the input storage type. Bound the documented NIfTI
          # integer quantization by half a stored bin, plus float32 scaling roundoff.
          step = abs(float(result.dataobj.slope)) if np.issubdtype(result.get_data_dtype(),np.integer) else 0.0
          bound = step/2+8*np.finfo(np.float32).eps*max(1.0,float(np.max(np.abs(expected))))
          assert np.max(np.abs(actual-expected))<=bound
          removed = np.count_nonzero((values!=0)&(mask==0))
          retained = np.count_nonzero((values!=0)&(mask==1))
          assert removed>1000 and retained>1000
          assert removed<np.count_nonzero(values)
          assert hashlib.sha256(original.read_bytes()).hexdigest()==before
          print('Mask product checked for',values.size,'voxels; removed',removed,'retained',retained,'NIfTI storage bound',bound)
      print('Actual PyDeface registration and mask application agree at every voxel with unchanged input and spatial geometry')
      PYTHON
    expected_output_contains: Actual PyDeface registration and mask application agree at every voxel with unchanged input and spatial geometry
    expected_exit_code: 0

  - name: Native ARM diagnosis requires review
    description: Temporary failure gate until the native registration evidence is reviewed and diagnostics are removed
    command: |
      echo "DIAGNOSTICBLOCKED PR 3580 native ARM registration is not repaired or approved"
      exit 1
    expected_exit_code: 0

cleanup:
  script: |
    #!/usr/bin/env bash
    # Optionally remove test outputs
    # rm -rf test_output
    echo "Test outputs preserved in test_output/"
fsl_arm64_version: "6.0.7.23"
fsl_x86_version: "6.0.3:b862cdd5"
pydeface_version: "2.1.0"
