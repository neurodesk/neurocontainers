                              'no_user_site', 'safe_path')}
        receipt = dict(schema='pydeface.inert-prerequisite.v1',
                       phase='before_self_process_open',
                       claim='interpreter_prerequisite_metadata_only', binding=binding,
                       started_monotonic=started, finished_monotonic=check(),
                       started_wall_ns=started_wall, finished_wall_ns=time.time_ns(),
                       observation_deadline=observation_deadline,
                       python=python, executable=executable,
                       modules=dict(os=os_provenance, posix=posix_provenance),
                       pidfd_exports=dict(os=os_export, posix=posix_export),
                       self_metadata=self_metadata,
                       kernel_release=kernel_release,
                       startup=dict(environment=environment, flags=flags))
        check()
        raw = json.dumps(receipt, sort_keys=True, allow_nan=False).encode('utf-8')
        check()
        if len(raw) > 65536:
            raise ValueError('inert prerequisite byte cap')
        directory_fd = os.open(evidence, os.O_RDONLY | os.O_DIRECTORY
                               | os.O_NOFOLLOW | os.O_CLOEXEC)
        try:
            check()
            directory = os.fstat(directory_fd)
            check()
            if (not stat.S_ISDIR(directory.st_mode)
                    or stat.S_IMODE(directory.st_mode) != 0o700
                    or directory.st_uid != os.geteuid()):
                raise ValueError('inert prerequisite directory ownership or mode')
