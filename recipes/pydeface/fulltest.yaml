            fd = os.open('prerequisite.json',
                         os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW
                         | os.O_NONBLOCK | os.O_CLOEXEC, 0o600, dir_fd=directory_fd)
            try:
                check()
                output = os.fstat(fd)
                check()
                if (not stat.S_ISREG(output.st_mode)
                        or stat.S_IMODE(output.st_mode) != 0o600
                        or output.st_uid != os.geteuid()):
                    raise ValueError('inert prerequisite output ownership or mode')
                check()
                written = os.write(fd, raw)
                check()
                if written != len(raw):
                    raise OSError(errno.EIO, 'inert prerequisite short write')
            finally:
                close_owned(fd, observation_deadline)
        finally:
            close_owned(directory_fd, observation_deadline)
        check()


