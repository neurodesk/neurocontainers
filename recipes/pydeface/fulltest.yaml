    def _diagnostic_check(plan: RunPlan) -> None:
        plan.owner.check()
        if time.monotonic() > min(plan.preflight_deadline, plan.supply_deadline,
                                  plan.started+POLICY['lifetime']):
            raise Refusal('diagnostic deadline')


    def _executable_identity(path: Path, *, executable: bool = True) -> dict[str, Any]:
        fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
        try:
            value = os.fstat(fd)
            before = file_identity(fd)
            if not stat.S_ISREG(value.st_mode) or (executable and not os.access(path, os.X_OK)):
                raise Refusal('tool is not a regular executable')
            if value.st_mode & (stat.S_ISUID | stat.S_ISGID):
                raise Refusal('privileged executable changes parent-death semantics')
            try:
                capabilities = os.getxattr(fd, 'security.capability')
            except OSError as error:
                if error.errno not in (errno.ENODATA, errno.ENOTSUP):
                    raise
                capabilities = b''
            if capabilities:
                raise Refusal('capability-bearing executable changes parent-death semantics')
            digest = hash_fd(fd)
            current = os.stat(path, follow_symlinks=False)
            if before != file_identity(fd) or before != (
                    current.st_dev, current.st_ino, current.st_size, current.st_mtime_ns, current.st_ctime_ns):
                raise Refusal('executable path or descriptor identity changed')
            return dict(path=str(path), identity=before, sha256=digest,
                        capabilities=capabilities.hex(), mode=value.st_mode,
                        execution_binding='checked pathname; later path-based exec is not atomic')
        finally:
            os.close(fd)


    def _admit_perf(path: Path) -> dict[str, Any]:
        if path.lstat().st_size != PERF_PACKAGE['elf_size']:
            raise Refusal('perf byte pin mismatch')
        observed = _executable_identity(path, executable=False)
        if observed['identity'][2] != PERF_PACKAGE['elf_size'] or observed['sha256'] != PERF_PACKAGE['elf_sha256']:
            raise Refusal('perf byte pin mismatch')
        fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
        try:
            if file_identity(fd) != observed['identity']:
                raise Refusal('perf identity changed before ELF admission')
            header = os.pread(fd, 64, 0)
            if (len(header) != 64 or header[:7] != b'\x7fELF\x02\x01\x01'
                    or struct.unpack_from('<HHI', header, 16) not in ((2, 183, 1), (3, 183, 1))):
                raise Refusal('perf target is not ELF64 little-endian AArch64')
            offset = struct.unpack_from('<Q', header, 32)[0]
            size, count = struct.unpack_from('<HH', header, 54)
            if size != 56 or not 0 < count <= 256:
                raise Refusal('perf ELF program header limit')
            interpreter = None
            for index in range(count):
                ph = os.pread(fd, size, offset+size*index)
                if len(ph) != size:
                    raise Refusal('truncated perf ELF')
                kind = struct.unpack_from('<I', ph)[0]
                start, length = struct.unpack_from('<Q', ph, 8)[0], struct.unpack_from('<Q', ph, 32)[0]
                if start+length > PERF_PACKAGE['elf_size']:
                    raise Refusal('perf ELF segment outside file')
                if kind == 3:
                    if interpreter is not None or length > 4096:
                        raise Refusal('perf interpreter count or size')
                    interpreter = os.pread(fd, length, start)
                if kind == 2:
                    if length > POLICY['metadata'] or length % 16:
                        raise Refusal('perf dynamic table limit')
                    table = os.pread(fd, length, start)
                    tags = [struct.unpack_from('<q', table, pos)[0] for pos in range(0, length, 16)]
                    if 15 in tags or 29 in tags or 0 not in tags:
                        raise Refusal('perf RPATH/RUNPATH or invalid dynamic table')
            if interpreter != PERF_PACKAGE['interpreter'].encode()+b'\0':
                raise Refusal('perf interpreter mismatch')
            if file_identity(fd) != observed['identity']:
                raise Refusal('perf changed during ELF admission')
            os.fchmod(fd, 0o500)
            admitted_identity = file_identity(fd)
        finally:
            os.close(fd)
        admitted = _executable_identity(path)
        if admitted['identity'] != admitted_identity or admitted['sha256'] != PERF_PACKAGE['elf_sha256']:
            raise Refusal('perf identity changed after ELF admission')
        return admitted


    def _download_perf(plan: RunPlan, package: Path) -> None:
        host, request_path = PERF_PACKAGE['url'].removeprefix('https://').split('/', 1)
        connection = http.client.HTTPSConnection(host, timeout=5)
        fd = os.open(package, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
        try:
            _diagnostic_check(plan)
            connection.request('GET', '/'+request_path, headers={'Accept-Encoding': 'identity'})
            response = connection.getresponse()
            if response.status != 200 or response.getheader('Content-Encoding') not in (None, 'identity'):
                raise Refusal('package HTTP status or encoding refused')
            length = response.getheader('Content-Length')
            if length is not None and length != str(PERF_PACKAGE['size']):
                raise Refusal('package HTTP size mismatch')
            size = 0
            with os.fdopen(fd, 'wb', closefd=False) as output:
                while True:
                    _diagnostic_check(plan)
                    block = response.read(min(65536, PERF_PACKAGE['size']+1-size))
                    _diagnostic_check(plan)
                    if not block:
                        break
                    size += len(block)
                    if size > PERF_PACKAGE['size'] or size > 3*1024**2:
                        raise Refusal('package download size limit')
                    output.write(block)
            if size != PERF_PACKAGE['size']:
                raise Refusal('package download truncated')
        finally:
            connection.close()
            os.close(fd)


    def _package_data(plan: RunPlan, package: Path) -> tuple[bytes, dict[str, Any]]:
        fd = os.open(package, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
        try:
            before = file_identity(fd)
            if not stat.S_ISREG(os.fstat(fd).st_mode) or before[2] != PERF_PACKAGE['size']:
                raise Refusal('package byte pin mismatch')
            blocks = []
            offset = 0
            deadline = time.monotonic()+POLICY['read']
            while offset < PERF_PACKAGE['size']:
                _diagnostic_check(plan)
                if time.monotonic() > deadline:
                    raise Refusal('package read deadline')
                block = os.pread(fd, min(65536, PERF_PACKAGE['size']-offset), offset)
                if not block:
                    raise Refusal('package byte pin mismatch')
                blocks.append(block)
                offset += len(block)
            snapshot = b''.join(blocks)
            digest = hashlib.sha256(snapshot).hexdigest()
            if digest != PERF_PACKAGE['sha256']:
                raise Refusal('package byte pin mismatch')
            if before != file_identity(fd):
                raise Refusal('package identity changed')
        finally:
            os.close(fd)
        if snapshot[:8] != b'!<arch>\n':
            raise Refusal('invalid package archive')
        position = 8
        names = []
        data = b''
        while position < len(snapshot):
            _diagnostic_check(plan)
            header = snapshot[position:position+60]
            if len(header) != 60 or header[58:] != b'`\n':
                raise Refusal('invalid package member header')
            name = header[:16].decode('ascii').strip().removesuffix('/')
            try:
                size = int(header[48:58].decode('ascii').strip())
            except ValueError:
                raise Refusal('invalid package member size') from None
            if size < 0 or position+60+size > len(snapshot) or len(names) >= 3:
                raise Refusal('package member size or count limit')
            names.append(name)
            if name == 'debian-binary' and snapshot[position+60:position+60+size] != b'2.0\n':
                raise Refusal('unsupported package format')
            if name == 'data.tar.zst':
                data = snapshot[position+60:position+60+size]
            position += 60+size
            if size % 2:
                if snapshot[position:position+1] != b'\n':
                    raise Refusal('invalid package padding')
                position += 1
        if names != ['debian-binary', 'control.tar.zst', 'data.tar.zst'] or position != len(snapshot):
            raise Refusal('unexpected package archive structure')
        return data, dict(identity=before, sha256=digest, members=names)


    def _inflate_package_data(plan: RunPlan, package: Path) -> Path:
        if plan.private is None:
            raise Refusal('supply directory missing')
        receipt: dict[str, Any] = dict(state='pending', started=time.monotonic(),
            runtime_contract='trusted_host_os_not_closed',
            transitive_loads='trusted, not exhaustively observed or authenticated')
        try:
            data, receipt['package'] = _package_data(plan, package)
            if len(data) != 2668491:
                raise Refusal('compressed data size mismatch')
            _diagnostic_check(plan)
            root = os.open('/', os.O_RDONLY | os.O_DIRECTORY)
            try:
                library_path = '/usr/lib/aarch64-linux-gnu/libzstd.so.1'
                fd = open_rooted(root, library_path)
                try:
                    before = file_identity(fd)
                    canonical = Path(os.readlink(f'/proc/self/fd/{fd}'))
                    observed = _executable_identity(canonical, executable=False)
                    header = os.pread(fd, 64, 0)
                    if (len(header) != 64 or header[:7] != b'\x7fELF\x02\x01\x01'
                            or struct.unpack_from('<HHI', header, 16) != (3, 183, 1)):
                        raise Refusal('host zstd library is not ELF64 little-endian AArch64')
                    if before != observed['identity'] or before != file_identity(fd):
                        raise Refusal('host zstd library identity changed')
                    observed['execution_binding'] = 'ctypes.CDLL through retained /proc/self/fd descriptor'
                    receipt['library'] = observed
                    _diagnostic_check(plan)
                    library = ctypes.CDLL(f'/proc/self/fd/{fd}')
                    library.ZSTD_decompress.argtypes = [ctypes.c_void_p, ctypes.c_size_t,
                                                       ctypes.c_void_p, ctypes.c_size_t]
                    library.ZSTD_decompress.restype = ctypes.c_size_t
                    library.ZSTD_isError.argtypes = [ctypes.c_size_t]
                    library.ZSTD_isError.restype = ctypes.c_uint
                    library.ZSTD_versionNumber.argtypes = []
                    library.ZSTD_versionNumber.restype = ctypes.c_uint
                    receipt['version_number'] = library.ZSTD_versionNumber()
                    source = ctypes.create_string_buffer(data, len(data))
                    destination = ctypes.create_string_buffer(8816640)
                    _diagnostic_check(plan)
                    size = library.ZSTD_decompress(destination, len(destination), source, len(data))
                    _diagnostic_check(plan)
                    receipt['result'] = size
                    if library.ZSTD_isError(size):
                        raise Refusal('host zstd decompression error')
                    if size != len(destination):
                        raise Refusal('expanded tar size mismatch')
                    decoded = memoryview(destination).cast('B')
                    digest = hashlib.sha256(decoded).hexdigest()
                    receipt.update(expanded_bytes=size, sha256=digest)
                    if digest != '1a47aadbc8c9c2ea7d56da36212622853758cbc6fb13f088c4f5a67600425f63':
                        raise Refusal('expanded tar digest mismatch')
                    again = open_rooted(root, library_path)
                    try:
                        if before != file_identity(again) or before != file_identity(fd):
                            raise Refusal('host zstd library identity changed')
                    finally:
                        os.close(again)
                    if hash_fd(fd) != observed['sha256']:
                        raise Refusal('host zstd library digest changed')
                    _diagnostic_check(plan)
                finally:
                    os.close(fd)
            finally:
                os.close(root)
            archive = plan.private / 'data.tar'
            _diagnostic_check(plan)
            outfd = os.open(archive, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
            try:
                offset = 0
                while offset < size:
                    _diagnostic_check(plan)
                    written = os.write(outfd, decoded[offset:offset+65536])
                    if written <= 0:
                        raise Refusal('expanded tar write failed')
                    offset += written
                _diagnostic_check(plan)
            finally:
                os.close(outfd)
            receipt.update(state='decoded', ended=time.monotonic())
            return archive
        except BaseException as error:
            receipt.update(state='refused', reason=type(error).__name__+': '+str(error)[:512])
            raise
        finally:
            save(plan, 'supply-decode.json', receipt)


    def _select_perf(plan: RunPlan, archive: Path, destination: Path) -> dict[str, Any]:
        fd = os.open(archive, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
        try:
            before = file_identity(fd)
            if not stat.S_ISREG(os.fstat(fd).st_mode) or not 1024 <= before[2] <= 12*1024**2 or before[2] % 512:
                raise Refusal('tar size or type limit')
            position, selected = 0, None
            names = set()
            while position < before[2]:
                _diagnostic_check(plan)
                header = os.pread(fd, 512, position)
                if header == bytes(512):
                    if before[2]-position < 1024:
                        raise Refusal('tar end marker truncated')
                    while position < before[2]:
                        _diagnostic_check(plan)
                        block = os.pread(fd, min(65536, before[2]-position), position)
                        if not block or any(block):
                            raise Refusal('unaccounted trailing tar bytes')
                        position += len(block)
                    break
                try:
                    member = tarfile.TarInfo.frombuf(header, 'utf-8', 'strict')
                except (tarfile.HeaderError, UnicodeError, ValueError):
                    raise Refusal('invalid tar header') from None
                name = member.name.removeprefix('./').rstrip('/')
                if name == '.':
                    name = ''
                if (len(os.fsencode(name)) > 4095 or name.startswith('/')
                        or (name and any(part in ('', '.', '..') for part in name.split('/')))):
                    raise Refusal('unsafe tar member path')
                if name in names:
                    raise Refusal('duplicate tar member')
                names.add(name)
                if len(names) > 128:
                    raise Refusal('tar member count limit')
                if member.type not in (tarfile.REGTYPE, tarfile.AREGTYPE, tarfile.DIRTYPE) or member.linkname:
                    raise Refusal('tar links or special members refused')
                if member.size < 0 or (member.isdir() and member.size):
                    raise Refusal('invalid tar member size')
                if not name and not member.isdir():
                    raise Refusal('invalid tar root member')
                data_start = position+512
                position = data_start+((member.size+511)//512)*512
                if position > before[2]:
                    raise Refusal('truncated tar member')
                if any(os.pread(fd, position-data_start-member.size, data_start+member.size)):
                    raise Refusal('invalid tar member padding')
                if name == PERF_PACKAGE['member']:
                    if not member.isfile() or member.size != PERF_PACKAGE['elf_size'] or member.size > 6*1024**2:
                        raise Refusal('selected perf member size or type mismatch')
                    if member.mode & (stat.S_ISUID | stat.S_ISGID):
                        raise Refusal('privileged archive member')
                    selected = (data_start, member.size)
            else:
                raise Refusal('tar end marker missing')
            if selected is None:
                raise Refusal('selected perf member missing')
            outfd = os.open(destination, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
            try:
                offset, remaining = selected
                with os.fdopen(outfd, 'wb', closefd=False) as output:
                    while remaining:
                        _diagnostic_check(plan)
                        block = os.pread(fd, min(65536, remaining), offset)
                        if not block:
                            raise Refusal('selected perf truncated')
                        output.write(block)
                        offset += len(block)
                        remaining -= len(block)
            finally:
                os.close(outfd)
            if before != file_identity(fd):
                raise Refusal('tar identity changed')
            return dict(members=len(names), archive_identity=before, selected=PERF_PACKAGE['member'])
        finally:
            os.close(fd)


    def _observe_host_loader(plan: RunPlan) -> Path:
        _diagnostic_check(plan)
        root = os.open('/', os.O_RDONLY | os.O_DIRECTORY)
        try:
            fd = open_rooted(root, PERF_PACKAGE['interpreter'])
        finally:
            os.close(root)
        try:
            before = file_identity(fd)
            canonical = Path(os.readlink(f'/proc/self/fd/{fd}'))
            loader = _executable_identity(canonical)
            header = os.pread(fd, 64, 0)
            if (len(header) != 64 or header[:7] != b'\x7fELF\x02\x01\x01'
                    or struct.unpack_from('<HHI', header, 16) not in ((2, 183, 1), (3, 183, 1))):
                raise Refusal('host interpreter is not AArch64 ELF')
            root = os.open('/', os.O_RDONLY | os.O_DIRECTORY)
            try:
                again = open_rooted(root, PERF_PACKAGE['interpreter'])
                try:
                    if before != file_identity(again) or before != file_identity(fd) or before != loader['identity']:
                        raise Refusal('host interpreter identity changed')
                finally:
                    os.close(again)
            finally:
                os.close(root)
        finally:
            os.close(fd)
        optional = []
        for name in ('/etc/ld.so.preload', '/etc/ld.so.cache'):
            _diagnostic_check(plan)
            try:
                root = os.open('/', os.O_RDONLY | os.O_DIRECTORY)
                try:
                    fd = open_rooted(root, name)
                finally:
                    os.close(root)
                try:
                    before = file_identity(fd)
                    if before[2] > POLICY['metadata']:
                        raise Refusal('optional loader metadata size limit')
                    digest = hash_fd(fd)
                    optional.append(dict(path=name, state='observed', identity=before, sha256=digest))
                finally:
                    os.close(fd)
            except FileNotFoundError:
                optional.append(dict(path=name, state='absent'))
            except (OSError, Refusal) as error:
                optional.append(dict(path=name, state='unreadable', reason=str(error)[:512]))
        _diagnostic_check(plan)
        receipt = plan.retained / 'host-loader.json'
        save(plan, receipt.name, dict(architecture=platform.machine(), kernel=os.uname().release,
             loader=loader, optional=optional, runtime_contract='trusted_host_os_not_closed',
             conditional_modules='trusted, not exhaustively observed or authenticated',
             complete_load_trace=False, source_build_correspondence='unproved'))
        return receipt


    def _prepare_host_loaded_perf(plan: RunPlan) -> _HostLoadedPerf:
        if plan.private is None:
            raise Refusal('supply directory missing')
        plan.supply_deadline = min(time.monotonic()+POLICY['supply'], plan.preflight_deadline,
                                   plan.started+POLICY['bootstrap'])
        receipt: dict[str, Any] = dict(stage='supply_pending', started=time.monotonic(), pins=PERF_PACKAGE,
            runtime_contract='trusted_host_os_not_closed', native_acceptance=False)
        save(plan, 'supply-pending.json', receipt)
        if plan.control is not None:
            send(plan.control, 'operation', kind='supply')
        try:
            package = plan.private / 'perf.deb'
            _download_perf(plan, package)
            _diagnostic_check(plan)
            archive = _inflate_package_data(plan, package)
            path = plan.private / 'perf'
            receipt['archive'] = _select_perf(plan, archive, path)
            admitted = _admit_perf(path)
            receipt['elf'] = admitted
            _diagnostic_check(plan)
            files = list(plan.private.iterdir())
            if len(files)+len(list((plan.private/'home').iterdir())) > 8 or sum(p.lstat().st_size for p in files) > 24*1024**2:
                raise Refusal('aggregate supply file or byte limit')
            loader_receipt = _observe_host_loader(plan)
            _diagnostic_check(plan)
            receipt.update(stage='supplied', ended=time.monotonic())
            return _HostLoadedPerf(path, admitted['sha256'], admitted['identity'],
                                   _diagnostic_environment(plan.private), loader_receipt)
        except BaseException as error:
            receipt.update(stage='refused', reason=type(error).__name__+': '+str(error)[:512])
            raise
        finally:
            save(plan, 'perf-supply.json', receipt)
            plan.supply_deadline = float('inf')
            if plan.control is not None:
                send(plan.control, 'operation_done')


    def _observe_sibling_recorder(plan: RunPlan, child: OwnedChild) -> None:
        receipt: dict[str, Any] = dict(kind='sibling_recorder_mapping_snapshot', complete_load_trace=False,
            runtime_contract='trusted_host_os_not_closed', started=time.monotonic(), pid=child.pid,
            state='incomplete')
        target = None
        try:
            _diagnostic_check(plan)
            target = ObservedProcess.open(child.pid)
            maps_fd = os.open(f'/proc/{target.pid}/maps', os.O_RDONLY | os.O_NONBLOCK)
            try:
                receipt['maps_identity'] = file_identity(maps_fd)
                before = read_bytes(f'/proc/{target.pid}/maps')
            finally:
                os.close(maps_fd)
            receipt.update(ticks=target.ticks, maps_sha256=hashlib.sha256(before).hexdigest())
            receipt['objects'] = mapped_objects(plan, target)
            if read_bytes(f'/proc/{target.pid}/maps') != before:
                raise Refusal('recorder maps changed during snapshot')
            _diagnostic_check(plan)
            receipt.update(state='snapshot_obtained', ended=time.monotonic())
        except BaseException as error:
            receipt['reason'] = type(error).__name__+': '+str(error)[:512]
            raise Refusal('mandatory sibling recorder snapshot incomplete') from error
        finally:
            if target is not None:
                os.close(target.pidfd)
            save(plan, 'sibling-recorder-maps.json', receipt)


