    trace = Path("test_output") / f"pydeface-diagnostic-{os.getpid()}.jsonl"
    stream = trace.open("a", buffering=1)


    def emit(event: str, **fields: object) -> None:
        record = json.dumps(dict(event=event, time=time.time(),
                                 elapsed=time.monotonic() - started, **fields))
        with lock:
            stream.write(record + "\n")
            print("[DEBUG-pydeface-3580] " + record, file=sys.stderr, flush=True)


