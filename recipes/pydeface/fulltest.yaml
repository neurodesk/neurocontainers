    def _parse_busy_maps(data: bytes) -> tuple[_Mapping, ...]:
        if not data or len(data) > POLICY['metadata'] or not data.endswith(b'\n'):
            raise Refusal('incomplete busy maps')
        rows = []
        for line in data.decode().splitlines():
            match = re.fullmatch(r'([0-9a-f]+)-([0-9a-f]+) +([r-][w-][x-][ps]) +'
                                 r'([0-9a-f]+) +([0-9a-f]+):([0-9a-f]+) +(\d+)(?: +(.*))?', line)
            if match is None:
                raise Refusal('malformed busy maps row')
            row = _Mapping(int(match[1], 16), int(match[2], 16), match[3], int(match[4], 16),
                           (int(match[5], 16), int(match[6], 16)), int(match[7]), match[8] or '')
            if not 0 < row.start < row.end <= 2**64 or row.offset >= 2**64:
                raise Refusal('invalid busy maps range')
            rows.append(row)
        ordered = sorted(rows, key=lambda row: row.start)
        if any(left.end > right.start for left, right in zip(ordered, ordered[1:])):
            raise Refusal('overlapping busy maps')
        return tuple(rows)


    def _opened_sibling_files(objects: Sequence[Mapping[str, object]]) -> dict[str, _OpenedFile]:
        opened = {}
        for obj in objects:
            path, device, inode = obj.get('path'), obj.get('device'), obj.get('inode')
            before, after = obj.get('source_before'), obj.get('source_after')
            digest, identity = obj.get('sha256'), obj.get('build_id')
            if (not isinstance(path, str) or not path.startswith('/') or path.endswith(' (deleted)')
                    or path in opened or not isinstance(device, str)
                    or not re.fullmatch(r'[0-9a-f]+:[0-9a-f]+', device)
                    or type(inode) is not int or inode <= 0
                    or not isinstance(before, (list, tuple)) or len(before) != 5
                    or not isinstance(after, (list, tuple)) or len(after) != 5
                    or any(type(value) is not int for value in (*before, *after))
                    or tuple(before) != tuple(after)
                    or not isinstance(digest, str) or not re.fullmatch(r'[0-9a-f]{64}', digest)
                    or (identity is not None and (not isinstance(identity, str)
                        or not re.fullmatch(r'(?:[0-9a-f]{2})+', identity)))
                    or obj.get('source_status') != 'unresolved'):
                raise Refusal('invalid opened sibling file evidence')
            major, minor = (int(part, 16) for part in device.split(':'))
            if (os.major(before[0]), os.minor(before[0]), before[1]) != (major, minor, inode):
                raise Refusal('opened sibling file identity mismatch')
            opened[path] = _OpenedFile(path, (major, minor), inode, tuple(before), tuple(after),
                                       digest, identity, 'unresolved')
        return opened


    def _parse_sibling_dump(dump: bytes, pid: int) -> tuple[
            tuple[_RecordedMapping, ...], tuple[tuple[int, int, int, int], ...]]:
        if len(dump) > POLICY['text']:
            raise Refusal('sibling dump byte limit')
        text = dump.decode()
        prefix = r'\d+ 0x[0-9a-f]+ \[0x[0-9a-f]+\]: '
        marker = re.compile(r'^\s*(?:[^\n]*\s)?PERF_RECORD_(MMAP2|MMAP|SAMPLE)\b')
        mapping_pattern = re.compile(prefix + r'PERF_RECORD_MMAP2 (\d+)/(\d+): '
            r'\[0x([0-9a-f]+)\(0x([0-9a-f]+)\) @ ([0-9a-f]+) '
            r'([0-9a-f]+):([0-9a-f]+) (\d+) (\d+)\]: ([r-][w-][x-][ps]) (.+)')
        sample_pattern = re.compile(prefix + r'PERF_RECORD_SAMPLE\(IP, 0x2\): '
            r'(\d+)/(\d+): 0x([0-9a-f]+) period: \d+ addr: 0')
        mappings, samples = [], []
        counts = dict(MMAP=0, MMAP2=0, SAMPLE=0)
        for index, line in enumerate(text.splitlines()):
            found = marker.match(line)
            if found is None:
                continue
            kind = found[1]
            counts[kind] += 1
            if sum(counts.values()) > POLICY['records']:
                raise Refusal('sibling record limit')
            if kind == 'MMAP2':
                match = mapping_pattern.fullmatch(line)
                if match is None:
                    raise Refusal('malformed sibling MMAP2 record')
                start, length = int(match[3], 16), int(match[4], 16)
                row = _Mapping(start, start+length, match[10], int(match[5], 16),
                               (int(match[6], 16), int(match[7], 16)), int(match[8]), match[11])
                if (int(match[1]) != pid or int(match[2]) != pid
                        or not 0 < row.start < row.end <= 2**64 or row.offset >= 2**64):
                    raise Refusal('invalid or foreign sibling mapping')
                mappings.append(_RecordedMapping(index, int(match[1]), int(match[2]), row))
            elif kind == 'SAMPLE':
                match = sample_pattern.fullmatch(line)
                if match is None:
                    raise Refusal('malformed sibling SAMPLE record')
                if int(match[1]) != pid or int(match[2]) != pid or int(match[3], 16) >= 2**64:
                    raise Refusal('invalid or foreign sibling sample')
                samples.append((index, int(match[1]), int(match[2]), int(match[3], 16)))
            else:
                raise Refusal('unsupported sibling MMAP record')
        sections = text.split('Aggregated stats:\n')
        if len(sections) != 2:
            raise Refusal('sibling record summary unavailable')
        summary = sections[1].split('cpu-clock:u stats:', 1)[0]
        for kind, count in counts.items():
            totals = re.findall(r'^\s*'+kind+r' events:\s+(\d+)(?:\s+\([^\n]*\))?\s*$', summary, re.M)
            if len(totals) != 1 or int(totals[0]) != count:
                raise Refusal('sibling record marker accounting mismatch')
        ordered = sorted(mappings, key=lambda item: item.mapping.start)
        if any(left.mapping.end > right.mapping.start for left, right in zip(ordered, ordered[1:])):
            raise Refusal('overlapping recorded sibling mappings')
        return tuple(mappings), tuple(samples)


    def _admit_sibling_capture(
        *, owner: _ProcessIdentity, observations: Sequence[_MapsObservation],
        objects: Sequence[Mapping[str, object]], quality: Mapping[str, object],
        samples: bytes, dump: bytes, timing: Mapping[str, object],
    ) -> _SiblingAdmission:
        if len(observations) != 3 or tuple(item.phase for item in observations) != (
                'before_enable', 'after_stop', 'after_decode'):
            raise Refusal('missing or unordered busy maps observations')
        before, stopped, decoded = observations
        for item in observations:
            if item.owner != owner:
                raise Refusal('foreign busy maps identity')
            if (not math.isfinite(item.started) or not math.isfinite(item.finished)
                    or not 0 <= item.started <= item.finished):
                raise Refusal('invalid busy maps observation time')
        times = timing.get('times')
        keys = ('ping_ack', 'last_validation', 'enable_send', 'terminal_observed', 'post_identity', 'ended')
        if not isinstance(times, dict) or any(type(times.get(key)) not in (int, float)
                or not math.isfinite(times[key]) for key in keys):
            raise Refusal('missing sibling observation timing')
        if not (times['ping_ack'] <= before.started <= before.finished <= times['last_validation']
                <= times['enable_send'] <= times['terminal_observed'] <= stopped.started
                <= stopped.finished <= times['post_identity'] <= times['ended'] <= decoded.started):
            raise Refusal('busy maps outside recorder brackets')
        if times['enable_send']-before.finished > POLICY['admission']:
            raise Refusal('stale busy maps before enable')
        opened = _opened_sibling_files(objects)
        mappings, recorded_samples = _parse_sibling_dump(dump, owner.pid)
        executable = sorted((item for item in mappings if 'x' in item.mapping.permissions),
                            key=lambda item: item.mapping.start)
        starts = [item.mapping.start for item in executable]
        occurrences, kernel_samples = [], []
        dsos: dict[str, int] = {}
        stamps = []
        unknown = unknown_dsos = file_samples = 0
        if len(samples) > POLICY['text']:
            raise Refusal('sibling sample byte limit')
        for line in samples.decode().splitlines():
            if not line.strip() or line.startswith('#'):
                continue
            match = re.fullmatch(r'\s*(\d+)/(\d+)\s+([0-9.]+):\s+(cpu-clock:u):\s+'
                                 r'([0-9a-fA-F]+)\s+(.+)\s+\((.*)\)\s*', line)
            if match is None or len(occurrences) >= len(recorded_samples):
                raise Refusal('sibling sample occurrence mismatch')
            index, pid, tid, ip = recorded_samples[len(occurrences)]
            if (int(match[1]), int(match[2]), int(match[5], 16)) != (pid, tid, ip):
                raise Refusal('sibling script/dump identity mismatch')
            sample = _Sample(len(occurrences), index, pid, tid, ip, 'cpu-clock:u', match[7], match[6])
            position = bisect_right(starts, ip)-1
            if position < 0:
                raise Refusal('sibling sample has no preceding mapping')
            recorded = executable[position]
            row = recorded.mapping
            if ip >= row.end or recorded.record_index >= index:
                raise Refusal('sibling sample has no preceding mapping')
            if row.name != sample.dso:
                raise Refusal('sibling sample mapping label mismatch')
            if sample.dso == '[vdso]':
                kernel_samples.append(sample)
            elif sample.dso in opened:
                obj = opened[sample.dso]
                if (row.device, row.inode) != (obj.device, obj.inode):
                    raise Refusal('sibling recorded file identity mismatch')
                file_samples += 1
            else:
                raise Refusal('unbound sibling sample DSO')
            occurrences.append(sample)
            dsos[sample.dso] = dsos.get(sample.dso, 0)+1
            unknown += int('[unknown]' in sample.decoder_symbol)
            unknown_dsos += int('[unknown]' in sample.dso)
            stamp = float(match[3])
            if not math.isfinite(stamp):
                raise Refusal('invalid sibling sample timestamp')
            stamps.append(stamp)
        total = len(occurrences)
        if (not total or total != len(recorded_samples) or quality.get('total') != total
                or quality.get('dsos') != dsos or quality.get('tids') != {str(owner.pid): total}
                or quality.get('events') != {'cpu-clock:u': total} or quality.get('lost') != 0
                or quality.get('unknown_symbols') != unknown or quality.get('unknown_dsos') != unknown_dsos
                or quality.get('unknown_fraction') != unknown/total
                or quality.get('first_time') != min(stamps) or quality.get('last_time') != max(stamps)):
            raise Refusal('sibling quality reconciliation mismatch')
        kernel = None
        if kernel_samples:
            live = []
            for item in observations:
                rows = [row for row in item.rows if row.name == '[vdso]']
                if len(rows) != 1:
                    raise Refusal('missing or ambiguous busy vdso range')
                live.append(rows[0])
            row = live[0]
            if (any(other != row for other in live[1:]) or row.permissions != 'r-xp'
                    or row.offset != 0 or row.device != (0, 0) or row.inode != 0):
                raise Refusal('changed or invalid busy vdso range')
            matches = [item for item in mappings if item.mapping.name == '[vdso]']
            if len(matches) != 1 or matches[0].mapping != row:
                raise Refusal('recorded vdso range does not match busy observations')
            if any(not row.start <= sample.ip < row.end for sample in kernel_samples):
                raise Refusal('sibling sample outside busy vdso range')
            kernel = _KernelRangeEvidence(owner, row, (before, stopped, decoded), matches[0], tuple(kernel_samples))
        return _SiblingAdmission('sibling_sampling_mechanics', quality, file_samples, kernel)


    def _observe_busy_maps(
        plan: RunPlan, target: ObservedProcess,
        phase: Literal['before_enable', 'after_stop', 'after_decode'],
    ) -> _MapsObservation:
        _diagnostic_check(plan)
        target.check()
        started = time.monotonic()
        data = read_bytes(f'/proc/{target.pid}/maps', POLICY['metadata'])
        target.check()
        _diagnostic_check(plan)
        finished = time.monotonic()
        name = 'preflight-'+phase+'.maps'
        save(plan, name, data)
        observation = _MapsObservation(_ProcessIdentity(target.pid, target.ticks, plan.boot), phase,
            started, finished, _parse_busy_maps(data), name, hashlib.sha256(data).hexdigest())
        save(plan, 'preflight-'+phase+'.json', asdict(observation))
        _diagnostic_check(plan)
        target.check()
        return observation


    def _run_sibling_preflight(plan: RunPlan, perf: str, busy: int) -> None:
        _diagnostic_check(plan)
        target = ObservedProcess.open(busy)
        observations: list[_MapsObservation] = []

        def observe_busy() -> None:
            if len(observations) == 0:
                phase: Literal['before_enable', 'after_stop', 'after_decode'] = 'before_enable'
            elif len(observations) == 1:
                phase = 'after_stop'
            else:
                raise Refusal('unexpected busy maps callback')
            observation = _observe_busy_maps(plan, target, phase)
            observations.append(observation)
            _diagnostic_check(plan)
            target.check()
            if phase == 'before_enable' and time.monotonic()-observation.finished > POLICY['admission']:
                raise Refusal('stale busy maps callback')

        try:
            raw = record(plan, perf, target.pid, 'preflight', observe_busy, 1)
            if len(observations) != 2:
                raise Refusal('missing busy maps callback')
            with tempfile.TemporaryDirectory(prefix='native-symbols-', dir=plan.work) as directory:
                mirror = Path(directory)
                objects = mapped_objects(plan, target, mirror)
                quality = decode(plan, perf, raw, target.pid, 'preflight', mirror)
                if mapped_objects(plan, target) != objects:
                    raise Refusal('preflight mapped objects changed')
                observations.append(_observe_busy_maps(plan, target, 'after_decode'))
                samples = read_bytes(plan.retained/'preflight.samples.out', POLICY['text'])
                dump = read_bytes(plan.retained/'preflight.dump.out', POLICY['text'])
                timing = json.loads(read_bytes(plan.retained/'preflight.timing.json', POLICY['metadata']))
                _diagnostic_check(plan)
                target.check()
                admitted = _admit_sibling_capture(owner=_ProcessIdentity(target.pid, target.ticks, plan.boot),
                    observations=observations, objects=objects, quality=quality,
                    samples=samples, dump=dump, timing=timing)
        finally:
            os.close(target.pidfd)
        _diagnostic_check(plan)
        save(plan, 'preflight-mapping.json', asdict(admitted))
        _diagnostic_check(plan)
        save(plan, 'sibling-ok.json', dict(stage='sibling_ok', at=time.monotonic(),
                                          mapping_receipt='preflight-mapping.json'))
        _diagnostic_check(plan)


    def worker(plan: RunPlan, channel: socket.socket, busy: int) -> None:
        plan.control = channel
        phase = 'bootstrap'
        raw_capture = False
        scientific = None
        try:
            bind_runner(plan)
            _stage_inert_mmap(plan)
            send(channel, 'ready')
            phase = 'preflight'
            preflight_start = time.monotonic()
            plan.preflight_deadline = min(plan.started+POLICY['bootstrap'], preflight_start+POLICY['preflight'])
            send(channel, 'preflight')
            plan.private = Path(tempfile.mkdtemp(prefix='native-perf-', dir=plan.work))
            (plan.private / 'home').mkdir(mode=0o700)
            plan.tool = _prepare_host_loaded_perf(plan)
            perf = str(plan.tool.path)
            command(plan, [perf, '--version'], 'perf-version')
            save(plan, 'version-ok.json', dict(stage='version_ok', at=time.monotonic()))
            _run_sibling_preflight(plan, perf, busy)
            plan.preflight_deadline = float('inf')
            send(channel, 'acquire')
            save(plan, 'observing.json', dict(stage='observing', at=time.monotonic()))
            phase = 'acquisition'
            stage_seen = None
            trace_keys = {}
            selected_path = None
            while True:
                paths = sorted(plan.output.glob('pydeface-diagnostic-*.jsonl'))
                if len(paths) > POLICY['traces']:
                    raise Refusal('trace file limit')
                candidates = []
                total = 0
                for path in paths:
                    rows, data, key = trace_records(path, plan)
                    total += len(data)
                    if total > POLICY['trace_bytes']:
                        raise Refusal('aggregate trace limit')
                    if path in trace_keys and trace_keys[path] != key:
                        raise Refusal('trace replaced')
                    trace_keys[path] = key
                    if not rows:
                        continue
                    selected = parse_registration(rows, plan, path.name)
                    if selected:
                        candidates.append((path, selected, data, key))
                if len(candidates) > 1:
                    raise Refusal('duplicate qualifying observer')
                if candidates:
                    path, selected, data, key = candidates[0]
                    if stage_seen is None:
                        stage_seen = time.monotonic()
                        selected_path = path
                        send(channel, 'stage', wall=selected['stage_time'])
                    if path != selected_path:
                        raise Refusal('retarget forbidden')
                    if time.time()-selected['stage_time'] > POLICY['acquisition']:
                        raise Refusal('target acquisition deadline')
                    if not selected.get('waiting'):
                        break
                plan.owner.check()
                if time.monotonic() > plan.started+POLICY['lifetime']:
                    raise Refusal('helper lifetime')
                time.sleep(POLICY['service'])
            selected_started = time.monotonic()
            send(channel, 'selected')
            phase = 'selected'
            target = ObservedProcess.open(selected['pid'])
            observer = ObservedProcess.open(selected['observer_pid'])
            try:
                validate = lambda: verify_target(selected, plan, target, observer, path, key)
                chain = validate()
                save(plan, 'selected-trace.jsonl', data)
                save(plan, 'before.json', dict(target=snapshot(target), observer=snapshot(observer),
                     owner=snapshot(plan.owner), ancestry=chain, selected=selected))
                raw = record(plan, perf, target.pid, 'flirt', validate, POLICY['interval'])
                raw_capture = True
                save(plan, 'after.json', dict(target=snapshot(target), observer=snapshot(observer),
                     owner=snapshot(plan.owner), ancestry=validate()))
                scientific = _ScientificMismatch.after_stopped_capture(
                    plan=plan, target=target, observer=observer, selected=selected,
                    trace=path, trace_key=key, raw=raw, selected_started=selected_started)
                try:
                    with tempfile.TemporaryDirectory(prefix='native-symbols-', dir=plan.work) as directory:
                        mirror = Path(directory)
                        objects = mapped_objects(plan, target, mirror, scientific=scientific)
                        save(plan, 'objects-before.json', objects)
                        quality = decode(plan, perf, raw, target.pid, 'flirt', mirror)
                except BaseException as error:
                    if scientific.primary is not None:
                        if error is not scientific.primary:
                            scientific.record_owner_failure('mirror directory', error)
                        raise scientific.primary
                    raise
                after_objects = mapped_objects(plan, target)
                save(plan, 'objects-after.json', after_objects)
                if after_objects != objects:
                    raise Refusal('mapped objects changed during reporting')
                if any(name not in {obj['path'] for obj in objects} for name in quality['dsos']):
                    raise Refusal('sample DSO cannot be bound to an opened mapped object')
                validate()
                inventory = []
                for file in plan.retained.iterdir():
                    if file.name.startswith('manifest.'):
                        continue
                    fd = os.open(file, os.O_RDONLY | os.O_NOFOLLOW)
                    try:
                        inventory.append(dict(path=file.name, size=os.fstat(fd).st_size, sha256=hash_fd(fd)))
                    finally:
                        os.close(fd)
                save(plan, 'inventory.json', inventory)
                result = dict(outcome='captured' if not (quality['unknown_symbols'] or quality['unknown_dsos']) else 'incomplete',
                     raw_capture=True, source_attribution='unresolved', samples=quality,
                     object_count=len(objects), reason='unknown symbols' if (quality['unknown_symbols'] or quality['unknown_dsos']) else None)
            finally:
                if scientific is not None and scientific.primary is not None:
                    for label, owner in (('worker target pidfd', target), ('worker observer pidfd', observer)):
                        try:
                            os.close(owner.pidfd)
                        except BaseException as error:
                            scientific.record_owner_failure(label, error)
                    raise scientific.primary
                os.close(target.pidfd)
                os.close(observer.pidfd)
        except BaseException as error:
            result = dict(outcome='incomplete' if phase == 'selected' else 'refused',
                 stage=phase, raw_capture=raw_capture, source_attribution='unresolved',
                 reason=type(error).__name__+': '+str(error)[:2000])
        finally:
            if plan.private is not None:
                try:
                    shutil.rmtree(plan.private)
                    result['supply_cleanup'] = dict(complete=True, excluded_work=True)
                except BaseException as error:
                    if scientific is not None and scientific.primary is not None:
                        scientific.record_owner_failure('private supply', error)
                        result['supply_cleanup'] = dict(complete=False, excluded_work=True)
                    else:
                        result = dict(outcome='incomplete', reason='supply cleanup failed: '+str(error)[:512])
        if scientific is not None and scientific.primary is not None:
            try:
                result['scientific_probe'] = scientific.terminal_facts()
                send(channel, 'done', **result)
            except BaseException as error:
                scientific.record_owner_failure('done projection or delivery', error)
                raise scientific.primary
        else:
            send(channel, 'done', **result)


    def supervise(plan: RunPlan, readiness: socket.socket, launcher: int) -> None:
        parent_arm(launcher)
        os.setsid()
        libc = ctypes.CDLL(None, use_errno=True)
        if libc.prctl(36, 1, 0, 0, 0):
            raise Refusal('subreaper unavailable')
        up, down = socket.socketpair(socket.AF_UNIX, socket.SOCK_SEQPACKET)
        busy_read, busy_write = os.pipe()
        parent = os.getpid()
        busy_pid = os.fork()
        if busy_pid == 0:
            parent_arm(parent)
            detach({busy_write})
            os.write(busy_write, b'R')
            os.close(busy_write)
            end = time.monotonic()+POLICY['bootstrap']
            while time.monotonic() < end:
                pass
            os._exit(0)
        busy = OwnedChild(busy_pid)
        os.close(busy_write)
        children = [busy]
        handoff = {}
        result = dict(outcome='incomplete', reason='startup pending')
        worker_child = None
        try:
            if not select.select([busy_read], [], [], 1)[0] or os.read(busy_read, 1) != b'R':
                raise Refusal('busy sibling failed to arm')
            os.close(busy_read)
            worker_pid = os.fork()
            if worker_pid == 0:
                parent_arm(parent)
                os.setpgid(0, 0)
                detach({down.fileno(), plan.owner.pidfd})
                worker(plan, down, busy_pid)
                os._exit(0)
            worker_child = OwnedChild(worker_pid, True)
            children.append(worker_child)
            down.close()
            deadline = plan.started+POLICY['bootstrap']
            state = 'startup'
            operation_deadline = float('inf')
            handoff_state = 'ready'
            terminal = False
            while True:
                if readable(plan.owner.pidfd):
                    raise Refusal('runner ended')
                now = time.monotonic()
                active_deadline = min(deadline, operation_deadline, plan.started+POLICY['lifetime'],
                                      plan.started+POLICY['bootstrap'] if handoff_state != 'complete' else float('inf'))
                watched = [plan.owner.pidfd]
                if not terminal:
                    watched.append(up)
                if handoff_state != 'complete':
                    watched.append(readiness)
                events = select.select(watched, [], [], min(POLICY['service'], max(0, active_deadline-now)))[0]
                now = time.monotonic()
                if now > active_deadline:
                    raise Refusal(('operation' if now > operation_deadline else state)+' deadline')
                if plan.owner.pidfd in events:
                    raise Refusal('runner ended')
                if readiness in events:
                    event = receive(readiness, time.monotonic())['event']
                    if event == 'clear' and handoff_state == 'clear':
                        if libc.prctl(1, 0, 0, 0, 0):
                            raise Refusal('detach failed')
                        handoff['cleared'] = time.monotonic()
                        send(readiness, 'cleared')
                        handoff_state = 'ack'
                    elif event == 'ack' and handoff_state == 'ack':
                        handoff['acknowledged'] = time.monotonic()
                        readiness.close()
                        handoff_state = 'complete'
                        manifest(plan.retained, 'pending', stage=state, handoff=handoff)
                    else:
                        raise Refusal('invalid detach transition')
                if up in events:
                    message = receive(up, time.monotonic())
                    event = message['event']
                    if event == 'ready' and state == 'startup':
                        handoff['ready'] = time.monotonic()
                        send(readiness, 'ready')
                        handoff_state = 'clear'
                        state = 'armed'
                    elif event == 'preflight' and state == 'armed':
                        state = 'preflight'
                        deadline = min(deadline, message['at']+POLICY['preflight'])
                    elif event == 'acquire' and state == 'preflight':
                        busy.signal(signal.SIGKILL)
                        state = 'acquire'
                        deadline = plan.started+POLICY['lifetime']
                    elif event == 'stage' and state == 'acquire':
                        state = 'stage'
                        deadline = min(deadline, now+max(0, POLICY['acquisition']-(time.time()-message['wall'])))
                    elif event == 'selected' and state == 'stage':
                        state = 'selected'
                        deadline = min(plan.started+POLICY['lifetime'], now+POLICY['selected'])
                    elif event == 'operation' and operation_deadline == float('inf'):
                        if message['kind'] not in ('command', 'record', 'supply'):
                            raise Refusal('unknown operation budget')
                        operation_deadline = message['at']+POLICY[message['kind']]
                    elif event == 'operation_done' and operation_deadline != float('inf'):
                        operation_deadline = float('inf')
                    elif event == 'done':
                        result = {k: v for k, v in message.items() if k not in ('event', 'at')}
                        terminal = True
                    else:
                        raise Refusal('invalid worker transition')
                if terminal and handoff_state == 'complete':
                    break
                if not terminal and os.waitid(os.P_PID, worker_pid, os.WEXITED | os.WNOHANG | os.WNOWAIT):
                    # A terminal packet can precede exit but still be queued.
                    if not readable(up):
                        raise Refusal('worker ended without terminal evidence')
        except BaseException as error:
            if 'scientific_probe' in result:
                _scientific_secondary(result['scientific_probe'], 'supervisor result', error)
            else:
                result = dict(outcome='incomplete', reason=type(error).__name__+': '+str(error)[:2000])
        finally:
            for child in children:
                try:
                    child.signal(signal.SIGTERM)
                except BaseException as error:
                    if 'scientific_probe' not in result:
                        raise
                    _scientific_secondary(result['scientific_probe'], 'supervisor signal', error)
            try:
                time.sleep(POLICY['grace'])
            except BaseException as error:
                if 'scientific_probe' not in result:
                    raise
                _scientific_secondary(result['scientific_probe'], 'supervisor grace', error)
            for child in children:
                try:
                    child.signal(signal.SIGKILL)
                except BaseException as error:
                    if 'scientific_probe' not in result:
                        raise
                    _scientific_secondary(result['scientific_probe'], 'supervisor signal', error)
            # A pre-arm child may not have established its group yet.
            if worker_child:
                try:
                    OwnedChild(worker_child.pid).signal(signal.SIGKILL)
                except BaseException as error:
                    if 'scientific_probe' not in result:
                        raise
                    _scientific_secondary(result['scientific_probe'], 'supervisor signal', error)
            end = time.monotonic()+POLICY['grace']
            reaped = []
            complete = False
            while time.monotonic() < end:
                try:
                    pid, status = os.waitpid(-1, os.WNOHANG)
                except ChildProcessError:
                    complete = True
                    break
                except BaseException as error:
                    if 'scientific_probe' not in result:
                        raise
                    _scientific_secondary(result['scientific_probe'], 'supervisor reap', error)
                    break
                if pid:
                    reaped.append(dict(pid=pid, status=status))
                else:
                    try:
                        time.sleep(.01)
                    except BaseException as error:
                        if 'scientific_probe' not in result:
                            raise
                        _scientific_secondary(result['scientific_probe'], 'supervisor reap grace', error)
                        break
            if not complete:
                if 'scientific_probe' in result:
                    _scientific_secondary(result['scientific_probe'], 'supervisor cleanup',
                                          Refusal('owned descendants pending cleanup'))
                else:
                    result = dict(outcome='incomplete', reason='owned descendants pending cleanup')
            manifest(plan.retained, **result, handoff=handoff, cleanup=dict(reaped=reaped, complete=complete))


    def arm(output_dir: Path, t1w: Path) -> None:
        architecture = platform.machine()
        work = Path.cwd().resolve()
        directory = work.parent / 'native-profile'
        directory.mkdir(mode=0o700)
        if architecture not in ('aarch64', 'arm64'):
            manifest(directory, 'outside_native_scope', architecture=architecture)
            return
        started, wall = time.monotonic(), time.time()
        def bootstrap_alarm(*unused: int | FrameType | None) -> None:
            raise Refusal('bootstrap deadline')
        signal.signal(signal.SIGALRM, bootstrap_alarm)
        signal.setitimer(signal.ITIMER_REAL, POLICY['bootstrap'])
        manifest(directory, 'pending', stage='bootstrap', architecture=architecture)
        try:
            pid = os.getppid()
            owner = None
            for _ in range(POLICY['objects']):
                args = discovery_argv(pid)
                if args is not None and any(item.endswith('/builder/run_tests.py') for item in args):
                    owner = ObservedProcess.open(pid)
                    break
                pid = process_stat(pid)['ppid']
                if pid <= 1:
                    break
            if owner is None:
                raise Refusal('actual runner ancestor unavailable')
            output = Path(output_dir).resolve()
            if output != work/'test_output' or not Path(t1w).is_absolute():
                raise Refusal('unexpected work/input binding')
            plan = RunPlan(work, output, directory, Path(t1w), owner, started, wall,
                           read_bytes('/proc/sys/kernel/random/boot_id', 128).decode().strip())
            parent, child = socket.socketpair(socket.AF_UNIX, socket.SOCK_SEQPACKET)
            launcher = os.getpid()
            # Detach before fork so even an unscheduled child inherits no capture pipes.
            detach({parent.fileno(), child.fileno(), owner.pidfd})
            supervisor = os.fork()
            if supervisor == 0:
                parent.close()
                try:
                    supervise(plan, child, launcher)
                except BaseException:
                    pass
                os._exit(0)
            child.close()
            end = started+POLICY['bootstrap']
            try:
                if receive(parent, end)['event'] != 'ready':
                    raise Refusal('supervisor not ready')
                send(parent, 'clear')
                if receive(parent, end)['event'] != 'cleared':
                    raise Refusal('supervisor not detached')
                send(parent, 'ack')
            finally:
                parent.close()
                os.close(owner.pidfd)
                signal.setitimer(signal.ITIMER_REAL, 0)
        except BaseException as error:
            # After fork only the supervisor writes its manifest.
            if 'supervisor' not in locals():
                manifest(directory, 'prerequisite_failed', reason=type(error).__name__+': '+str(error)[:2000])


