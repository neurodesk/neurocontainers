    def _reserve_probe_window(*, selected_started: float, lifetime_started: float,
                              now: float) -> _ProbeWindow:
        if (not all(math.isfinite(t) for t in (selected_started, lifetime_started, now))
                or not lifetime_started <= selected_started <= now):
            raise Refusal('scientific timestamp order')
        end = min(selected_started + POLICY['selected'], lifetime_started + POLICY['lifetime'])
        allowance = min(12, end - now - 3)
        if allowance < 9:
            raise Refusal('scientific observation budget unavailable')
        return _ProbeWindow(now, end, now + allowance - 4, now + allowance - 3, now + allowance)


    def _compare_current_segments(*, target_rows: tuple[_Mapping, ...], collector_row: _Mapping,
                                   file_size: int, page_size: int) -> str:
        if any((row.device, row.inode) != (collector_row.device, collector_row.inode)
               for row in target_rows):
            return 'current_pairs_differ'
        rounded = ((file_size + page_size - 1) // page_size) * page_size
        if not target_rows or any(row.offset % page_size or row.offset >= file_size
                                 or row.offset + row.end - row.start > rounded
                                 or row.start % page_size or row.end % page_size
                                 for row in target_rows):
            return 'current_offsets_incompatible'
        return 'current_pair_and_offsets_match'


    def _scientific_secondary(facts: dict[str, Any], owner: str, error: BaseException) -> None:
        errors = facts.setdefault('owner_failures', [])
        try:
            reason = str(error)
        except BaseException:
            reason = 'exception text unavailable'
        if len(errors) < 4:
            errors.append(dict(owner=owner[:48], type=type(error).__name__[:48],
                               reason=reason[:96], truncated=len(reason) > 96))
        else:
            facts['owner_failures_truncated'] = True


    class _ScientificMismatch:
        @classmethod
        def after_stopped_capture(cls, *, plan: RunPlan, target: ObservedProcess,
                                  observer: ObservedProcess, selected: Mapping[str, Any],
                                  trace: Path, trace_key: tuple[int, int], raw: Path,
                                  selected_started: float) -> _ScientificMismatch:
            scope = cls()
            scope.plan, scope.target, scope.observer = plan, target, observer
            scope.selected, scope.trace, scope.trace_key = dict(selected), trace, trace_key
            scope.raw, scope.selected_started = raw, selected_started
            scope.primary = None
            scope.deadline = float('inf')
            scope.cancelled = None
            scope.phase = 'observation'
            scope.io_closes = 0
            scope.io_acquisition = None
            scope.outcome = dict(measurement=dict(kind='not_mapped', reason='not entered'),
                                evidence='unavailable', external_refs={}, brackets={},
                                members={name: dict(missing='not reached') for name in _SCIENTIFIC_MEMBERS},
                                cleanup=dict(state='not_needed', acquired=[], returned_closes=[],
                                             post_unmap_absence='not_observed'),
                                persistence=dict(missing='terminal not saved'), owner_failures=[],
                                scientific_disposition='refused', decode_permitted=False,
                                **_SCIENTIFIC_FLAGS)
            return scope

        def checkpoint(self) -> None:
            if (time.monotonic() >= self.deadline
                    or (self.phase == 'observation' and self.cancelled is not None)):
                raise Refusal('scientific ' + self.phase + ' deadline or cancellation')

        def record_owner_failure(self, owner: str, error: BaseException) -> None:
            _scientific_secondary(self.outcome, owner, error)

        def close_io(self, fd: int) -> None:
            try:
                os.close(fd)
                self.io_closes += 1
            except BaseException as error:
                self.outcome['cleanup']['state'] = 'unconfirmed'
                self.record_owner_failure('transient descriptor', error)
                raise

        def _encode(self, value: Any, cap: int) -> bytes:
            self.checkpoint()
            data = json.dumps(value, sort_keys=True, separators=(',', ':'), allow_nan=False).encode()
            self.checkpoint()
            if len(data) > cap:
                raise Refusal('scientific encoded byte limit')
            return data

        def _read(self, path: str | Path, cap: int) -> bytes:
            self.checkpoint()
            data = read_bytes(path, cap)
            self.checkpoint()
            return data

        def _link(self, path: str) -> str:
            self.checkpoint()
            link = os.readlink(path)
            if len(os.fsencode(link)) > 4096:
                raise Refusal('scientific link limit')
            self.checkpoint()
            return link

        def _save(self, name: str, data: bytes) -> dict[str, Any]:
            self.checkpoint()
            receipt = dict(name=name, writer_close='not_opened', reader_close='not_opened')
            if name == 'scientific-descriptor-probe.json':
                self.outcome['persistence'] = receipt
            if len(data) > POLICY['text'] or retained_size(self.plan.retained) + len(data) > POLICY['total']:
                raise Refusal('scientific retained output limit')
            self.checkpoint()
            fd = None
            receipt['writer_close'] = 'unconfirmed'
            try:
                fd = os.open(self.plan.retained / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                self.checkpoint()
                offset = 0
                while offset < len(data):
                    self.checkpoint()
                    written = os.write(fd, data[offset:offset + 65536])
                    if written <= 0:
                        raise Refusal('scientific short write')
                    offset += written
            finally:
                if fd is not None:
                    try:
                        self.close_io(fd)
                        receipt['writer_close'] = 'returned'
                    except BaseException:
                        receipt['writer_close'] = 'failed'
                        raise
            self.checkpoint()
            receipt['reader_close'] = 'unconfirmed'
            received = self._read(self.plan.retained / name, len(data))
            receipt['reader_close'] = 'returned'
            if received != data:
                raise Refusal('scientific saved readback differs')
            received_file = asdict(_Blob(name, len(received), hashlib.sha256(received).hexdigest()))
            self.checkpoint()
            receipt['file'] = received_file
            return receipt

        def _reference(self, name: str, cap: int = POLICY['text']) -> bytes:
            data = self._read(self.plan.retained / name, cap)
            self.outcome['external_refs'][name] = asdict(_Blob(name, len(data), hashlib.sha256(data).hexdigest()))
            return data

        def _bindings(self) -> None:
            import yaml
            launch_raw = self._reference('launch.json', POLICY['metadata'])
            launch = json.loads(launch_raw)
            stage = json.loads(self._reference('inert-stage.json', POLICY['metadata']))
            origin = stage['origin']
            scripts = [Path(arg) for arg in launch['argv'] if arg.endswith('/builder/run_tests.py')]
            if len(scripts) != 1 or not scripts[0].is_absolute():
                raise Refusal('scientific source runner path')
            source = self._read(scripts[0].parent.parent / 'recipes/pydeface/fulltest.yaml', POLICY['metadata'])
            staged = self._read(launch['suite'], POLICY['metadata'])
            mapping = yaml.safe_load(source)
            helper = mapping['setup']['host_script'].encode()
            program = self._read(self.plan.work / '.pydeface-inert-r46/program.py', POLICY['metadata'])
            self.checkpoint()
            if (yaml.safe_load(staged) != mapping or helper.count(program) != 1
                    or stage['status'] != 'staged'
                    or origin['launch_receipt'] != asdict(_Blob('launch.json', len(launch_raw), hashlib.sha256(launch_raw).hexdigest()))
                    or origin['source_suite_sha256'] != launch['source_sha256']
                    or origin['staged_suite_sha256'] != launch['staged_sha256']
                    or origin['host_script_sha256'] != launch['helper_sha256']
                    or origin['program_sha256'] != hashlib.sha256(program).hexdigest()
                    or launch['source_sha256'] != hashlib.sha256(source).hexdigest()
                    or launch['staged_sha256'] != hashlib.sha256(staged).hexdigest()
                    or launch['helper_sha256'] != hashlib.sha256(helper).hexdigest()
                    or launch['work'] != str(self.plan.work) or launch['boot_id'] != self.plan.boot
                    or (launch['owner']['pid'], launch['owner']['ticks']) != (self.plan.owner.pid, self.plan.owner.ticks)):
                raise Refusal('scientific source binding changed')
            for relative, digest in launch['sources'].items():
                if hashlib.sha256(self._read(scripts[0].parent.parent / relative, POLICY['metadata'])).hexdigest() != digest:
                    raise Refusal('scientific protected source changed')
            self.outcome['source_bindings'] = dict(program_sha256=origin['program_sha256'],
                source_sha256=launch['source_sha256'], staged_sha256=launch['staged_sha256'],
                host_script_sha256=launch['helper_sha256'], sources=launch['sources'])
            selected_raw = self._reference('selected-trace.jsonl')
            rows, current, key = trace_records(self.trace, self.plan)
            before = json.loads(self._reference('before.json'))
            after = json.loads(self._reference('after.json'))
            timing = json.loads(self._reference('flirt.timing.json'))
            times = timing['times']
            if (key != self.trace_key or not current.startswith(selected_raw)
                    or parse_registration(rows, self.plan, self.trace.name) != self.selected
                    or before['selected'] != self.selected
                    or timing['stop']['outcome'] != 'requested' or timing['stop']['pre_stop'] is not None
                    or timing['stop']['terminal'] is None or timing['returncode'] not in (0, -signal.SIGINT)
                    or self.raw != self.plan.retained / 'flirt.data'
                    or timing['argv'][timing['argv'].index('-o') + 1] != str(self.raw)
                    or timing['argv'][timing['argv'].index('-p') + 1] != str(self.target.pid)
                    or not self.selected_started <= times['pre_spawn'] <= times['terminal_observed'] <= times['ended'] <= self.window.entered):
                raise Refusal('scientific stopped capture binding')
            raw_stat = self.raw.stat()
            if not stat.S_ISREG(raw_stat.st_mode) or not 0 < raw_stat.st_size <= POLICY['raw']:
                raise Refusal('scientific raw capture unavailable')
            for capture in (before, after):
                for role, owner in (('target', self.target), ('observer', self.observer), ('owner', self.plan.owner)):
                    fields = capture[role]['stat'].rsplit(')', 1)[1].split()
                    if int(fields[19]) != owner.ticks:
                        raise Refusal('scientific snapshot owner changed')
            self.outcome['stopped_capture'] = dict(raw=str(self.raw), stat=list(raw_stat)[:10],
                                                  selected=self.selected, trace_key=self.trace_key)

        def _fds(self) -> set[int]:
            names = os.listdir('/proc/self/fd')
            if len(names) > 128:
                raise Refusal('scientific FD inventory limit')
            present = set()
            for name in names:
                try:
                    os.fstat(int(name))
                    present.add(int(name))
                except OSError as error:
                    if error.errno != errno.EBADF:
                        raise
            return present

        def _support(self) -> ModuleType:
            import mmap
            import threading
            if (sys.implementation.name != 'cpython' or sys.version_info[:3] != (3, 10, 12)
                    or sys.platform != 'linux' or platform.machine() != 'x86_64'
                    or threading.current_thread() is not threading.main_thread()
                    or len(os.listdir('/proc/self/task')) != 1
                    or sys.gettrace() is not None or sys.getprofile() is not None):
                raise Refusal('scientific host implementation or thread unsupported')
            binaries = {'/proc/self/exe': 'a2f33a6e006989270f4340528eb61f8f97366e00a5d1b602ac8672ea44fc56ae',
                        mmap.__file__: '1d85a9fccb48eae9173b5fc8437daa05a62d221bf4b0066c0af332e1fb003c29'}
            for path, digest in binaries.items():
                if hashlib.sha256(self._read(path, POLICY['text'])).hexdigest() != digest:
                    raise Refusal('scientific interpreter or mmap implementation unsupported')
            page = os.sysconf('SC_PAGE_SIZE')
            if not 0 < page <= 65536 or page & (page - 1) or 1048576 % page or page != mmap.PAGESIZE:
                raise Refusal('scientific page size unsupported')
            self.outcome['support'] = dict(interpreter=sys.version, binaries=binaries, page_size=page,
                primary_url='https://raw.githubusercontent.com/python/cpython/v3.10.12/Modules/mmapmodule.c',
                primary_sha256='97c49eef8a717fc072224380d5a8d46a4ca05452c9e6d2478766b4db11bcf8fd',
                maximum_mmap_duplicates=1, kernel_close_returns='not exposed by mmap.close')
            return mmap

        def _member(self, name: str, path: str, owner: _Process) -> bytes:
            import base64
            start = time.monotonic()
            try:
                data = self._read(path, _SCIENTIFIC_MEMBERS[name])
                self.outcome['members'][name] = dict(owner=asdict(owner), started=start,
                    finished=time.monotonic(), size=len(data), sha256=hashlib.sha256(data).hexdigest(),
                    base64=base64.b64encode(data).decode('ascii'))
                return data
            except BaseException as error:
                self.outcome['members'][name] = dict(missing=type(error).__name__ + ': ' + str(error)[:128],
                                                    errno=getattr(error, 'errno', None))
                raise

        @staticmethod
        def _stat(value: os.stat_result) -> dict[str, int]:
            return asdict(_Stat(value.st_dev, value.st_ino, value.st_mode, value.st_size,
                                value.st_mtime_ns, value.st_ctime_ns))

        def _bracket(self, phase: str, borrowed: _BorrowedMismatch, collector: ObservedProcess) -> tuple[_Mapping, ...]:
            start = time.monotonic()
            root_before = self._stat(os.stat(f'/proc/{self.target.pid}/root'))
            verify_target(self.selected, self.plan, self.target, self.observer, self.trace, self.trace_key)
            self.checkpoint()
            bracket = dict(validation_interval=[start, time.monotonic()], owners={}, descriptors={})
            self.outcome['brackets'][phase] = bracket
            boot = self._read('/proc/sys/kernel/random/boot_id', 128).decode().strip()
            if boot != self.plan.boot or len(os.listdir('/proc/self/task')) != 1:
                raise Refusal('scientific boot or collector threads changed')
            for role, owner in (('collector', collector), ('target', self.target),
                                ('observer', self.observer), ('runner', self.plan.owner)):
                owner.check()
                process = _Process(owner.pid, owner.ticks, boot,
                    *(self._link(f'/proc/{owner.pid}/ns/{ns}') for ns in ('pid', 'mnt', 'user')))
                pidfd_info = self._read(f'/proc/self/fdinfo/{owner.pidfd}', 8192)
                if (self._link(f'/proc/self/fd/{owner.pidfd}') != 'anon_inode:[pidfd]'
                        or not re.search(rb'^Pid:\s+' + str(owner.pid).encode() + rb'\s*$', pidfd_info, re.M)):
                    raise Refusal('scientific pidfd owner mismatch')
                self._member(f'{role}.stat.{phase}', f'/proc/{owner.pid}/stat', process)
                bracket['owners'][role] = dict(identity=asdict(process), pidfd=owner.pidfd,
                                               pidfd_live=not readable(owner.pidfd))
                if role in ('collector', 'target'):
                    data = self._member(f'{role}.maps.{phase}', f'/proc/{owner.pid}/maps', process)
                    if role == 'target':
                        if data != borrowed.original_record['maps'].encode():
                            raise Refusal('scientific target maps changed')
                        target_maps = _parse_busy_maps(data)
                        bracket['target_rows'] = [asdict(row) for row in target_maps
                                                 if row.name == EXE and 'x' in row.permissions]
                        inodes = {row['inode'] for row in bracket['target_rows']}
                        if any((row.name.startswith(EXE + ' ') or row.inode in inodes) and row.name != EXE
                               for row in target_maps):
                            raise Refusal('scientific target source alias or deleted path')
                    else:
                        collector_rows = _parse_busy_maps(data)
                    if phase != 'live':
                        try:
                            self._member(f'{role}.mountinfo.{phase}', f'/proc/{owner.pid}/mountinfo', process)
                        except OSError:
                            pass
                if process != _Process(owner.pid, owner.ticks, boot,
                        *(self._link(f'/proc/{owner.pid}/ns/{ns}') for ns in ('pid', 'mnt', 'user'))):
                    raise Refusal('scientific namespace changed within bracket')
                owner.check()
            collector_identity = _Process(**bracket['owners']['collector']['identity'])
            for role, fd in (('file', borrowed.file_fd), ('root', borrowed.root_fd)):
                data = self._member(f'{role}.fdinfo.{phase}', f'/proc/{collector.pid}/fdinfo/{fd}', collector_identity)
                values = dict(line.split(':', 1) for line in data.decode().splitlines())
                receipt = dict(number=fd, owner=asdict(collector_identity), stat=self._stat(os.fstat(fd)),
                    link=self._link(f'/proc/{collector.pid}/fd/{fd}'),
                    fdinfo={key: values[key].strip() for key in ('pos', 'flags', 'mnt_id', 'ino')})
                bracket['descriptors'][role] = receipt
            root = bracket['descriptors']['root']
            current_root = self._stat(os.stat(f'/proc/{self.target.pid}/root'))
            bracket['target_root'] = dict(stat=current_root, link=self._link(f'/proc/{self.target.pid}/root'))
            if (current_root != root_before or current_root != root['stat']
                    or bracket['target_root']['link'] != root['link'] or not stat.S_ISDIR(current_root['mode'])
                    or bracket['descriptors']['file']['stat'] != self._stat(borrowed.source_stat)
                    or bracket['descriptors']['file']['link'] != EXE):
                raise Refusal('scientific borrowed source or target root changed')
            if phase != 'before':
                previous = self.outcome['brackets']['before']
                if any(bracket[key] != previous[key] for key in ('owners', 'descriptors', 'target_root', 'target_rows')):
                    raise Refusal('scientific owner, descriptor, root or namespace changed')
            self.checkpoint()
            return collector_rows

        def _mounts(self) -> None:
            import base64
            associations = []
            for phase in ('before', 'final_held'):
                bracket = self.outcome['brackets'][phase]
                for role in ('file', 'root'):
                    mount = bracket['descriptors'][role]['fdinfo']['mnt_id']
                    candidates = {}
                    for owner in ('collector', 'target'):
                        member = self.outcome['members'][f'{owner}.mountinfo.{phase}']
                        candidates[owner] = ([line for line in base64.b64decode(member['base64']).decode().splitlines()
                                              if line.split(' ', 1)[0] == mount] if 'base64' in member else None)
                    own = candidates['collector']
                    associations.append(dict(phase=phase, descriptor=role, mnt_id=mount,
                        collector_rows=own, target_candidates=candidates['target'],
                        kind='collector_namespace_row' if own is not None and len(own) == 1 else 'ambiguous_or_unavailable',
                        target_context='separate owner; root and namespace provenance in bracket', backing_identity=False))
            self.outcome['mount_associations'] = associations

        def refuse(self, borrowed: _BorrowedMismatch, primary: Refusal) -> NoReturn:
            global _scientific_active
            entered = time.monotonic()
            if self.primary is not None:
                raise self.primary
            self.primary = primary
            mapping = None
            self_pidfd = None
            acquisition = None
            handlers = {}
            activated = False
            pending = False
            cleanup = self.outcome['cleanup']
            try:
                self.window = _reserve_probe_window(selected_started=self.selected_started,
                    lifetime_started=self.plan.started, now=entered)
                self.outcome['window'] = dict(asdict(self.window), selected_started=self.selected_started,
                                              lifetime_started=self.plan.started)
                self.deadline = self.window.observe_by
                if (borrowed.target is not self.target or borrowed.original_record['path'] != EXE
                        or borrowed.original_record['mirror'] is None
                        or (self.target.pid, self.target.ticks) != (self.selected['pid'], self.selected['ticks'])
                        or (self.observer.pid, self.observer.ticks) != (self.selected['observer_pid'], self.selected['observer_ticks'])
                        or len({os.getpid(), self.target.pid, self.observer.pid, self.plan.owner.pid}) != 4
                        or _scientific_active is not None):
                    raise Refusal('scientific scope owner mismatch')
                import threading
                if threading.current_thread() is not threading.main_thread() or len(os.listdir('/proc/self/task')) != 1:
                    raise Refusal('scientific main single thread required')
                watched = (signal.SIGALRM, signal.SIGINT, signal.SIGTERM)
                timers = [signal.getitimer(timer) for timer in
                          (signal.ITIMER_REAL, signal.ITIMER_VIRTUAL, signal.ITIMER_PROF)]
                blocked = signal.pthread_sigmask(signal.SIG_BLOCK, set())
                pending_signals = signal.sigpending()
                self.outcome['runtime_preconditions'] = dict(timers=timers, blocked_signals=sorted(blocked),
                    pending_signals=sorted(pending_signals), task_ids=os.listdir('/proc/self/task'),
                    main_thread=True, trace_absent=sys.gettrace() is None, profile_absent=sys.getprofile() is None)
                if (any(timer != (0.0, 0.0) for timer in timers)
                        or set(watched) & (pending_signals | blocked)
                        or any(callable(signal.getsignal(sig)) and sig not in watched
                               for sig in signal.valid_signals())
                        or signal.getsignal(signal.SIGINT) not in (signal.SIG_DFL, signal.SIG_IGN, signal.default_int_handler)
                        or signal.getsignal(signal.SIGTERM) not in (signal.SIG_DFL, signal.SIG_IGN)):
                    raise Refusal('scientific inherited signal or timer unsupported')
                def cancelled(signum: int, frame: FrameType | None) -> None:
                    self.cancelled = signum
                for sig in watched:
                    handlers[sig] = signal.getsignal(sig)
                    signal.signal(sig, cancelled)
                _scientific_active = self
                activated = True
                signal.setitimer(signal.ITIMER_REAL, max(.000001, self.deadline - time.monotonic()))
                original = self._encode(borrowed.original_record, POLICY['text'])
                names = ('mapped-object-refusal.json', 'scientific-descriptor-probe-start.json', 'scientific-descriptor-probe.json')
                if any(os.path.lexists(self.plan.retained / name) for name in names):
                    raise Refusal('scientific evidence already exists')
                full_reservation = retained_size(self.plan.retained) + len(original) + 4096 + 4 * 1024**2 <= POLICY['total']
                self.outcome['original_refusal'] = self._save(names[0], original)
                if not full_reservation:
                    raise Refusal('scientific evidence reservation unavailable')
                self._bindings()
                mapper = self._support()
                page = self.outcome['support']['page_size']
                info = os.fstat(borrowed.file_fd)
                rounded = ((info.st_size + page - 1) // page) * page
                if (self._stat(info) != self._stat(borrowed.source_stat) or not stat.S_ISREG(info.st_mode)
                        or not 0 < info.st_size <= rounded <= 1048576):
                    raise Refusal('scientific mapping source size or identity')
                baseline_fds = self._fds()
                soft, _ = resource.getrlimit(resource.RLIMIT_NOFILE)
                if soft != resource.RLIM_INFINITY and len(baseline_fds) + 4 > soft:
                    raise Refusal('scientific descriptor headroom')
                self.outcome['baseline_fds'] = sorted(baseline_fds)
                start_record = dict(state='terminal_pending', progress='unconfirmed_without_terminal',
                    direct_cleanup='unconfirmed_without_terminal', window=self.outcome['window'],
                    collector_pid=os.getpid(), target_pid=self.target.pid, target_ticks=self.target.ticks,
                    file_fd=borrowed.file_fd, root_fd=borrowed.root_fd,
                    original_refusal=self.outcome['original_refusal']['file'],
                    source_bindings=self.outcome['source_bindings'], **_SCIENTIFIC_FLAGS)
                self.outcome['pending'] = self._save(names[1], self._encode(start_record, 4096))
                pending = True
                self.checkpoint()
                acquisition = 'collector pidfd'
                self_pidfd = os.pidfd_open(os.getpid())
                acquisition = None
                cleanup['acquired'].append('collector pidfd')
                collector = ObservedProcess(os.getpid(), process_stat(os.getpid())['ticks'], self_pidfd)
                before = self._bracket('before', borrowed, collector)
                target_rows = tuple(_Mapping(**dict(row, device=tuple(row['device'])))
                    for row in self.outcome['brackets']['before']['target_rows'])
                if not target_rows or len({(r.device, r.inode) for r in target_rows}) != 1:
                    raise Refusal('scientific target segments ambiguous')
                def focused(row: _Mapping) -> bool:
                    return (row.name == EXE or row.name.startswith(EXE + ' ')
                            or row.inode in {info.st_ino, target_rows[0].inode})
                if any(focused(row) for row in before):
                    raise Refusal('scientific collector already maps source or alias')
                call = dict(file_fd=borrowed.file_fd, root_fd=borrowed.root_fd, collector_pid=os.getpid(),
                            requested_length=info.st_size, rounded_length=rounded, page_size=page,
                            offset=0, flags='MAP_PRIVATE', protection='PROT_READ|PROT_EXEC', started=time.monotonic())
                self.outcome['measurement'] = dict(kind='partial', call=call)
                acquisition = 'mapping and implementation duplicate'
                mapping = mapper.mmap(borrowed.file_fd, info.st_size, flags=mapper.MAP_PRIVATE,
                                      prot=mapper.PROT_READ | mapper.PROT_EXEC, offset=0)
                acquisition = None
                cleanup['acquired'].append('mapping and implementation duplicate')
                call['finished'] = time.monotonic()
                self.checkpoint()
                added = self._fds() - baseline_fds - {self_pidfd}
                if len(added) != 1 or self._stat(os.fstat(next(iter(added)))) != self._stat(info):
                    raise Refusal('scientific mmap duplicate count or identity')
                call['implementation_duplicate'] = next(iter(added))
                live = self._bracket('live', borrowed, collector)
                candidates = [row for row in live if focused(row)]
                if (len(candidates) != 1 or candidates[0].name != EXE
                        or candidates[0].permissions != 'r-xp' or candidates[0].offset != 0
                        or candidates[0].end - candidates[0].start != rounded
                        or candidates[0].start % page
                        or any(row.start < candidates[0].end and row.end > candidates[0].start for row in before)):
                    raise Refusal('scientific new mapping is ambiguous, split or coalesced')
                focused_row = candidates[0]
                final = self._bracket('final_held', borrowed, collector)
                if [row for row in final if focused(row)] != candidates:
                    raise Refusal('scientific final-held mapping changed')
                self.outcome['measurement'].update(kind='compared_current_mappings',
                    collector_row=asdict(focused_row), descriptor_pair=[[os.major(info.st_dev), os.minor(info.st_dev)], info.st_ino],
                    target_pair=[target_rows[0].device, target_rows[0].inode],
                    collector_pair=[focused_row.device, focused_row.inode],
                    relation=_compare_current_segments(target_rows=target_rows, collector_row=focused_row,
                                                        file_size=info.st_size, page_size=page),
                    page_tail='coverage only', historical_identity=False, mapped_byte_equality=False)
                self._mounts()
                self.checkpoint()
                self.outcome['evidence'] = 'complete' if all('base64' in row for row in self.outcome['members'].values()) else 'partial'
            except BaseException as error:
                self.outcome['measurement']['reason'] = type(error).__name__ + ': ' + str(error)[:192]
                self.record_owner_failure('observation', error)
            finally:
                if acquisition is not None or self.io_acquisition is not None:
                    cleanup.update(state='unconfirmed', uncertain_acquisition=acquisition or self.io_acquisition)
                if activated:
                    self.phase = 'cleanup'
                    self.deadline = self.window.cleanup_by
                    try:
                        signal.setitimer(signal.ITIMER_REAL, max(.000001, self.deadline - time.monotonic()))
                    except BaseException as error:
                        cleanup['state'] = 'unconfirmed'
                        self.record_owner_failure('cleanup timer', error)
                cleanup['started'] = time.monotonic()
                for label, resource_value in (('mapping', mapping), ('collector pidfd', self_pidfd)):
                    if resource_value is None:
                        continue
                    try:
                        self.checkpoint()
                        if label == 'mapping':
                            resource_value.close()
                            cleanup['mapping_api_closed'] = resource_value.closed
                            # CPython discards the underlying close and munmap return codes.
                            cleanup['state'] = 'unconfirmed'
                            cleanup['kernel_close_returns'] = 'not exposed by mmap.close'
                        else:
                            os.close(resource_value)
                        cleanup['returned_closes'].append(label)
                        self.checkpoint()
                    except BaseException as error:
                        cleanup['state'] = 'unconfirmed'
                        self.record_owner_failure(label, error)
                cleanup.update(finished=time.monotonic(), transient_close_returns=self.io_closes)
                if cleanup['state'] == 'not_needed' and cleanup['acquired']:
                    cleanup['state'] = 'direct_complete'
                if activated:
                    self.phase = 'evidence'
                    self.deadline = self.window.finish_by
                    try:
                        signal.setitimer(signal.ITIMER_REAL, max(.000001, self.deadline - time.monotonic()))
                        if pending:
                            terminal = {key: value for key, value in self.outcome.items() if key != 'persistence'}
                            metadata = dict(terminal, members={name: dict(row, base64='') if 'base64' in row else row
                                for name, row in terminal['members'].items()})
                            self._encode(metadata, 262144)
                            maximum = sum(4 * ((cap + 2) // 3) for cap in _SCIENTIFIC_MEMBERS.values()) + 262144
                            self._save('scientific-descriptor-probe.json', self._encode(terminal, maximum))
                    except BaseException as error:
                        self.record_owner_failure('terminal persistence', error)
                    finally:
                        _scientific_active = None
                for sig, handler in handlers.items():
                    try:
                        if sig == signal.SIGALRM:
                            signal.setitimer(signal.ITIMER_REAL, 0)
                        signal.signal(sig, handler)
                    except BaseException as error:
                        self.record_owner_failure('signal restoration', error)
                raise self.primary

        def terminal_facts(self) -> Mapping[str, Any]:
            result = dict(measurement=self.outcome['measurement']['kind'],
                relation=self.outcome['measurement'].get('relation'), evidence=self.outcome['evidence'],
                cleanup=self.outcome['cleanup']['state'], persistence=self.outcome['persistence'],
                original_refusal=self.outcome.get('original_refusal', {}).get('file', {'missing': 'not saved'}),
                pending=self.outcome.get('pending', {}).get('file', {'missing': 'not saved'}),
                owner_failures=self.outcome['owner_failures'],
                owner_failures_truncated=self.outcome.get('owner_failures_truncated', False),
                scientific_disposition='refused', decode_permitted=False, **_SCIENTIFIC_FLAGS)
            if len(json.dumps(result).encode()) > 2048:
                result['owner_failures'] = [dict(owner=item['owner'], type=item['type']) for item in result['owner_failures']]
                result['owner_failures_truncated'] = True
            if len(json.dumps(result).encode()) > 2048:
                raise Refusal('scientific summary byte limit')
            return result


    def _stage_inert_mmap(plan: RunPlan) -> None:
        plan.owner.check()
        if time.monotonic() >= plan.started + POLICY['bootstrap']:
            raise Refusal('bootstrap deadline before inert staging')
        slot = plan.work / '.pydeface-inert-r46'
        created = []
        claimed = False
        sealed = False
        result = {}
        try:
            import yaml
            launch_raw = read_bytes(plan.retained / 'launch.json')
            launch = json.loads(launch_raw)
            args = launch['argv']
            scripts = [Path(item) for item in args if item.endswith('/builder/run_tests.py')]
            if len(scripts) != 1 or not scripts[0].is_absolute():
                raise Refusal('inert launch script binding')
            source = read_bytes(scripts[0].parent.parent / 'recipes/pydeface/fulltest.yaml')
            staged = read_bytes(Path(launch['suite']))
            source_mapping = yaml.safe_load(source)
            if yaml.safe_load(staged) != source_mapping:
                raise Refusal('inert staged suite differs')
            helper = source_mapping['setup']['host_script'].encode()
            setup = source_mapping['setup']['script'].encode()
            digests = dict(source_sha256=hashlib.sha256(source).hexdigest(),
                           staged_sha256=hashlib.sha256(staged).hexdigest(),
                           helper_sha256=hashlib.sha256(helper).hexdigest())
            if any(launch[key] != value for key, value in digests.items()):
                raise Refusal('inert launch digest changed')
            if (launch['work'] != str(plan.work) or launch['boot_id'] != plan.boot
                    or launch['owner']['pid'] != plan.owner.pid
                    or launch['owner']['ticks'] != plan.owner.ticks
                    or args != argv(plan.owner.pid)):
                raise Refusal('inert launch context changed')
            boot = read_bytes('/proc/sys/kernel/random/boot_id', 128).decode().strip()
            runner_before = process_stat(plan.owner.pid)
            runner = _Process(plan.owner.pid, plan.owner.ticks, boot,
                              os.readlink(f'/proc/{plan.owner.pid}/ns/pid'),
                              os.readlink(f'/proc/{plan.owner.pid}/ns/mnt'),
                              os.readlink(f'/proc/{plan.owner.pid}/ns/user'))
            if (boot != plan.boot or runner_before['ticks'] != plan.owner.ticks
                    or process_stat(plan.owner.pid)['ticks'] != plan.owner.ticks):
                raise Refusal('inert runner identity changed')
            marker = b"<<'NATIVE_PROFILE_PY'\n"
            ending = b'\nNATIVE_PROFILE_PY\n'
            if helper.count(marker) != 1 or helper.count(ending) != 1:
                raise Refusal('inert program extraction ambiguous')
            program = helper.split(marker, 1)[1].split(ending, 1)[0] + b'\n'
            if not program or len(program) > POLICY['metadata']:
                raise Refusal('inert program length')
            origin = _Origin(plan.work, plan.t1w, digests['source_sha256'],
                             digests['staged_sha256'], hashlib.sha256(setup).hexdigest(),
                             digests['helper_sha256'], hashlib.sha256(program).hexdigest(),
                             _Blob('launch.json', len(launch_raw), hashlib.sha256(launch_raw).hexdigest()),
                             runner, os.urandom(16).hex())
            origin_data = dict(origin=asdict(origin), launch=launch,
                               launch_bytes_hex=launch_raw.hex(),
                               image_context=dict(path=launch['container'],
                                                  stat=list(Path(launch['container']).stat())[:10]),
                               staged_at=time.monotonic())
            origin_raw = json.dumps(origin_data, sort_keys=True, default=str).encode()
            if len(origin_raw) > POLICY['metadata']:
                raise Refusal('inert origin length')
            slot.mkdir(mode=0o700)
            claimed = True
            blobs = []
            for name, data in (('program.py', program), ('origin.json', origin_raw)):
                if time.monotonic() >= plan.started + POLICY['bootstrap']:
                    raise Refusal('inert staging exhausted bootstrap')
                fd = os.open(slot / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                created.append(slot / name)
                try:
                    if os.write(fd, data) != len(data):
                        raise Refusal('inert staging short write')
                finally:
                    os.close(fd)
                blobs.append(_Blob(name, len(data), hashlib.sha256(data).hexdigest()))
            seal = json.dumps(dict(capsule_id=origin.capsule_id, files=[asdict(blob) for blob in blobs],
                                   setup_script_sha256=origin.setup_script_sha256), sort_keys=True).encode()
            fd = os.open(slot / 'seal.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
            created.append(slot / 'seal.json')
            try:
                if os.write(fd, seal) != len(seal):
                    raise Refusal('inert seal short write')
            finally:
                os.close(fd)
            sealed = True
            result = dict(status='staged', origin=asdict(origin),
                          files=[asdict(blob) for blob in blobs + [
                              _Blob('seal.json', len(seal), hashlib.sha256(seal).hexdigest())]])
        except Exception as error:
            result = dict(status='unavailable', operation='optional_inert_staging',
                          reason=type(error).__name__ + ': ' + str(error)[:512],
                          errno=getattr(error, 'errno', None), claimed=claimed, sealed=sealed)
        finally:
            if claimed and not sealed:
                failures = []
                for path in reversed(created):
                    try:
                        path.unlink()
                    except OSError as error:
                        failures.append(dict(name=path.name, errno=error.errno, reason=str(error)[:256]))
                try:
                    slot.rmdir()
                except OSError as error:
                    failures.append(dict(name=slot.name, errno=error.errno, reason=str(error)[:256]))
                result['cleanup_failures'] = failures
        plan.owner.check()
        if time.monotonic() >= plan.started + POLICY['bootstrap']:
            raise Refusal('bootstrap deadline after inert staging')
        save(plan, 'inert-stage.json', json.dumps(result, sort_keys=True, default=str).encode())


    def _run_inert_mmap(work: Path, entry_deadline: float) -> None:
        if not math.isfinite(entry_deadline) or time.monotonic() >= entry_deadline:
            raise Refusal('inert entry deadline before controller')
        slot = work / '.pydeface-inert-r46'
        directory_fd = os.open(slot, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
        inputs = {}
        try:
            for name in ('origin.json', 'seal.json'):
                fd = os.open(name, os.O_RDONLY | os.O_NONBLOCK | os.O_NOFOLLOW, dir_fd=directory_fd)
                try:
                    before = os.fstat(fd)
                    if not stat.S_ISREG(before.st_mode) or not 0 < before.st_size <= POLICY['metadata']:
                        raise Refusal('inert controller input size or type')
                    deadline = min(entry_deadline, time.monotonic() + POLICY['read'])
                    data = bytearray()
                    while True:
                        if time.monotonic() >= deadline:
                            raise Refusal('inert controller input deadline')
                        block = os.read(fd, min(65536, POLICY['metadata'] + 1 - len(data)))
                        if not block:
                            break
                        data.extend(block)
                        if len(data) > POLICY['metadata']:
                            raise Refusal('inert controller input cap')
                    after = os.fstat(fd)
                    if (before.st_mode != after.st_mode or len(data) != after.st_size
                            or file_identity(fd) != (before.st_dev, before.st_ino, before.st_size,
                                                     before.st_mtime_ns, before.st_ctime_ns)):
                        raise Refusal('inert controller input changed')
                    inputs[name] = bytes(data)
                finally:
                    os.close(fd)
        finally:
            os.close(directory_fd)
        seal = json.loads(inputs['seal.json'])
        document = json.loads(inputs['origin.json'])
        raw_origin = document['origin']
        records = {item['name']: item for item in seal['files']}
        if (set(records) != {'program.py', 'origin.json'} or len(seal['files']) != 2
                or records['origin.json']['sha256'] != hashlib.sha256(inputs['origin.json']).hexdigest()
                or records['origin.json']['size'] != len(inputs['origin.json'])
                or records['program.py']['sha256'] != raw_origin['program_sha256']
                or seal['capsule_id'] != raw_origin['capsule_id']
                or seal['setup_script_sha256'] != raw_origin['setup_script_sha256']):
            raise Refusal('inert controller origin mismatch')
        origin = _Origin(Path(raw_origin['work']), Path(raw_origin['t1w']),
                         raw_origin['source_suite_sha256'], raw_origin['staged_suite_sha256'],
                         raw_origin['setup_script_sha256'], raw_origin['host_script_sha256'],
                         raw_origin['program_sha256'], _Blob(**raw_origin['launch_receipt']),
                         _Process(**raw_origin['runner']), raw_origin['capsule_id'])
        if (origin.work != work or origin.runner.boot_id !=
                read_bytes('/proc/sys/kernel/random/boot_id', 128).decode().strip()):
            raise Refusal('inert controller work or boot mismatch')
        if time.monotonic() >= entry_deadline:
            raise Refusal('inert entry deadline before detach')
        detach(set())
        controller = slot / 'controller'
        try:
            controller.mkdir(mode=0o700)
        except FileExistsError:
            return
        child_pid = None
        wait_status = None
        stopped_for = 'normal'
        failure = None
        child_deadline = min(time.monotonic() + 10, entry_deadline - 3)
        controller_pid = os.getpid()
        inherited_mask = signal.pthread_sigmask(signal.SIG_BLOCK, {signal.SIGTERM, signal.SIGINT})
        try:
            signal.signal(signal.SIGTERM, lambda *_: (_ for _ in ()).throw(InterruptedError('controller cancelled')))
            signal.signal(signal.SIGINT, lambda *_: (_ for _ in ()).throw(InterruptedError('controller cancelled')))
            try:
                if time.monotonic() >= child_deadline:
                    raise Refusal('inert entry has no observation budget')
                child_pid = os.fork()
                if child_pid == 0:
                    parent_arm(controller_pid)
                    signal.signal(signal.SIGTERM, signal.SIG_DFL)
                    signal.signal(signal.SIGINT, signal.SIG_DFL)
                    signal.pthread_sigmask(signal.SIG_SETMASK, inherited_mask)
                    child_started = time.monotonic()
                    observation = _observe_inert_mmap(origin, slot / 'observations', child_deadline)
                    terminal = json.dumps(asdict(_Read(observation, child_started, time.monotonic())),
                                          sort_keys=True, default=str).encode()
                    if len(terminal) > POLICY['text'] or time.monotonic() >= child_deadline:
                        raise Refusal('inert terminal cap or deadline')
                    fd = os.open(slot / 'observations' / 'terminal.json',
                                 os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                    try:
                        if os.write(fd, terminal) != len(terminal):
                            raise Refusal('inert terminal short write')
                    finally:
                        os.close(fd)
                    if time.monotonic() >= child_deadline:
                        raise Refusal('inert terminal deadline')
                    os._exit(0)
            finally:
                if os.getpid() != controller_pid:
                    os._exit(92)
            assert child_pid > 0
            signal.pthread_sigmask(signal.SIG_SETMASK, inherited_mask)
            while time.monotonic() < child_deadline:
                wait_mask = signal.pthread_sigmask(signal.SIG_BLOCK, {signal.SIGTERM, signal.SIGINT})
                try:
                    pid, status = os.waitpid(child_pid, os.WNOHANG)
                    if pid:
                        wait_status = status
                        break
                finally:
                    signal.pthread_sigmask(signal.SIG_SETMASK, wait_mask)
                time.sleep(min(.01, max(0, child_deadline - time.monotonic())))
            if wait_status is None:
                stopped_for = 'deadline'
        except InterruptedError as error:
            stopped_for = 'cancellation'
            failure = str(error)
        except Exception as error:
            stopped_for = 'failure'
            failure = type(error).__name__ + ': ' + str(error)[:512]
        finally:
            try:
                signal.signal(signal.SIGTERM, signal.SIG_DFL)
                signal.signal(signal.SIGINT, signal.SIG_DFL)
                if child_pid is not None and child_pid > 0 and wait_status is None:
                    for sig, reserve in ((signal.SIGTERM, 2), (signal.SIGKILL, 1)):
                        if wait_status is not None or time.monotonic() >= entry_deadline:
                            break
                        OwnedChild(child_pid).signal(sig)
                        until = min(time.monotonic() + 1, entry_deadline - reserve)
                        while time.monotonic() < until:
                            pid, status = os.waitpid(child_pid, os.WNOHANG)
                            if pid:
                                wait_status = status
                                break
                            time.sleep(min(.01, max(0, until - time.monotonic())))
            finally:
                signal.pthread_sigmask(signal.SIG_SETMASK, inherited_mask)
        if time.monotonic() >= entry_deadline:
            return
        collection_deadline = min(time.monotonic() + 1, entry_deadline)
        cleanup = (_Missing('fork', failure or 'child not started', None, 'unavailable') if child_pid is None else
                   _CleanupUnconfirmed(child_pid, 'owned child not reaped within entry deadline') if wait_status is None else
                   _Reaped(child_pid, wait_status, stopped_for))
        actual = []
        omitted = []
        terminal = None
        closes = None
        consumed = 0
        if isinstance(cleanup, _Reaped):
            try:
                directory_fd = os.open(slot / 'observations', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
            except OSError as error:
                omitted.append(_Omitted('observations', str(error)[:512], None, None))
            else:
                try:
                    names = os.listdir(directory_fd)
                    if len(names) > 128:
                        raise Refusal('inert observation file count')
                    for name in sorted(names):
                        if time.monotonic() >= collection_deadline:
                            return
                        size = None
                        digest = None
                        try:
                            if not re.fullmatch(r'[a-zA-Z0-9_.-]{1,160}', name):
                                raise Refusal('inert observation filename')
                            fd = os.open(name, os.O_RDONLY | os.O_NONBLOCK | os.O_NOFOLLOW, dir_fd=directory_fd)
                            try:
                                before = os.fstat(fd)
                                size = before.st_size
                                if not stat.S_ISREG(before.st_mode) or size > POLICY['text']:
                                    raise Refusal('inert observation size or type')
                                consumed += size
                                if consumed > POLICY['total']:
                                    raise Refusal('inert observation aggregate cap')
                                data = bytearray()
                                while True:
                                    if time.monotonic() >= collection_deadline:
                                        raise Refusal('inert collection deadline')
                                    block = os.read(fd, min(65536, POLICY['text'] + 1 - len(data)))
                                    if not block:
                                        break
                                    data.extend(block)
                                    if len(data) > POLICY['text']:
                                        raise Refusal('inert observation cap')
                                if (len(data) != before.st_size or file_identity(fd) !=
                                        (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns)):
                                    raise Refusal('inert observation changed')
                                digest = hashlib.sha256(data).hexdigest()
                            finally:
                                os.close(fd)
                            actual.append(_Blob('observations/' + name, len(data), digest))
                            if name.endswith('.json'):
                                value = json.loads(data)
                                if name == 'terminal.json':
                                    terminal = value
                                elif name == 'cleanup.json':
                                    closes = value
                        except Exception as error:
                            omitted.append(_Omitted('observations/' + name,
                                                    type(error).__name__ + ': ' + str(error)[:256], size, digest))
                finally:
                    os.close(directory_fd)
        child = _Missing('terminal', 'no validated normal terminal evidence', None, 'unavailable')
        envelope = asdict(_Envelope(child, cleanup, tuple(actual), tuple(omitted)))
        status = 'partial_collection'
        try:
            if (not isinstance(cleanup, _Reaped) or cleanup.raw_wait_status != 0 or stopped_for != 'normal'
                    or omitted or not isinstance(terminal, dict)
                    or set(terminal) != {'value', 'started', 'finished'}
                    or not math.isfinite(terminal['started']) or not math.isfinite(terminal['finished'])
                    or not 0 <= terminal['started'] <= terminal['finished'] < child_deadline
                    or terminal['value']['origin'] != raw_origin
                    or terminal['value']['claim'] != 'new_inert_mapping_only'
                    or closes is None or closes.get('complete') is not True or closes.get('failures') != []):
                raise Refusal('inert terminal or cleanup incomplete')
            indexed = {item.name.removeprefix('observations/'): asdict(item) for item in actual}
            pending = [terminal['value'][name] for name in ('focus', 'inventory', 'topology')]
            while pending:
                value = pending.pop()
                if isinstance(value, dict):
                    if set(value) == {'name', 'size', 'sha256'}:
                        item = indexed.get(value['name'])
                        if item is None or (item['size'], item['sha256']) != (value['size'], value['sha256']):
                            raise Refusal('inert terminal references unavailable or changed bytes')
                    else:
                        pending.extend(value.values())
                elif isinstance(value, list):
                    pending.extend(value)
                if time.monotonic() >= collection_deadline:
                    raise Refusal('inert terminal validation deadline')
            envelope['child'] = terminal
            if (terminal['value']['focus']['kind'] in ('observed_identity_equality', 'observed_identity_mismatch')
                    and terminal['value']['inventory']['kind'] in ('inventory_returned', 'inventory_refused')):
                status = 'complete_observation'
        except (KeyError, TypeError, ValueError, Refusal) as error:
            envelope['child'] = asdict(_Missing('terminal', str(error)[:512], None, 'unavailable'))
        envelope.update(status=status, capsule_id=origin.capsule_id, failure=failure,
                        child_deadline=child_deadline, entry_deadline=entry_deadline,
                        collection_deadline=collection_deadline,
                        collected_at=time.monotonic())
        if time.monotonic() >= collection_deadline:
            return
        data = json.dumps(envelope, sort_keys=True).encode()
        if len(data) > POLICY['text']:
            raise Refusal('inert envelope cap')
        fd = os.open(controller / 'envelope.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
        try:
            if time.monotonic() >= collection_deadline or os.write(fd, data) != len(data):
                raise Refusal('inert envelope deadline or short write')
        finally:
            os.close(fd)
        if not isinstance(cleanup, _Reaped) or time.monotonic() >= collection_deadline:
            return
        sealed = json.dumps(dict(capsule_id=origin.capsule_id, status=status,
                                 origin_sha256=hashlib.sha256(inputs['origin.json']).hexdigest(),
                                 program_sha256=origin.program_sha256,
                                 envelope=asdict(_Blob('envelope.json', len(data), hashlib.sha256(data).hexdigest())),
                                 sealed_at=time.monotonic(), entry_deadline=entry_deadline), sort_keys=True).encode()
        fd = os.open(controller / 'seal.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
        try:
            if time.monotonic() >= collection_deadline or os.write(fd, sealed) != len(sealed):
                raise Refusal('inert controller seal deadline or short write')
        finally:
            os.close(fd)


    def _observe_probe_descriptor(
        fd: int, role: _DescriptorRole, owner: _Process, plan: RunPlan,
    ) -> _Descriptor:
        _diagnostic_check(plan)
        started = time.monotonic()
        value = os.fstat(fd)
        observed = _Read(_Stat(value.st_dev, value.st_ino, value.st_mode, value.st_size,
                               value.st_mtime_ns, value.st_ctime_ns), started, time.monotonic())
        label = f'fd-{role}-{fd}-{time.monotonic_ns()}'
        started = time.monotonic()
        try:
            data = read_bytes(f'/proc/{owner.pid}/fdinfo/{fd}', 8192)
            finished = time.monotonic()
            _diagnostic_check(plan)
            name = label + '.txt'
            save(plan, name, data)
            fdinfo = _Read(_Blob(name, len(data), hashlib.sha256(data).hexdigest()), started, finished)
        except (OSError, Refusal) as error:
            fdinfo = _Missing('fdinfo', str(error)[:512], getattr(error, 'errno', None), 'unavailable')
            data = b''
        _diagnostic_check(plan)
        started = time.monotonic()
        try:
            link = os.readlink(f'/proc/{owner.pid}/fd/{fd}')
            if len(os.fsencode(link)) > 4096:
                raise Refusal('descriptor link byte limit')
            link = _Read(link, started, time.monotonic())
        except OSError as error:
            link = _Missing('proc_fd_link', str(error)[:512], error.errno, 'unavailable')
        _diagnostic_check(plan)
        started = time.monotonic()
        try:
            namespace_before = os.readlink(f'/proc/{owner.pid}/ns/mnt')
            mountinfo = read_bytes(f'/proc/{owner.pid}/mountinfo', 256 * 1024)
            finished = time.monotonic()
            if os.readlink(f'/proc/{owner.pid}/ns/mnt') != namespace_before:
                raise Refusal('descriptor mount namespace changed')
            match = re.search(rb'^mnt_id:\s+(\d+)\s*$', data, re.M)
            mount_id = int(match[1]) if match else None
            rows = [line.decode() for line in mountinfo.splitlines()
                    if mount_id is not None and line.split(b' ', 1)[0] == str(mount_id).encode()]
            _diagnostic_check(plan)
            save(plan, label + '-mountinfo.txt', mountinfo)
            mounts = dict(owner=asdict(owner), mount_namespace=namespace_before,
                          started=started, finished=finished, mnt_id=mount_id, matching_rows=rows,
                          raw=asdict(_Blob(label + '-mountinfo.txt', len(mountinfo),
                                           hashlib.sha256(mountinfo).hexdigest())))
        except (OSError, Refusal) as error:
            mounts = asdict(_Missing('descriptor_mountinfo', str(error)[:512],
                                      getattr(error, 'errno', None), 'unavailable'))
        _diagnostic_check(plan)
        save(plan, label + '-mount.json', mounts)
        return _Descriptor(owner, role, fd, observed, fdinfo, link,
                           _Missing('fstatfs', 'native ABI not verified', None, 'deferred'))


    def _save_inert_prerequisite(
        origin: _Origin, evidence: Path, observation_deadline: float,
    ) -> None:
        import base64
        from types import ModuleType

        if not math.isfinite(observation_deadline):
            raise ValueError('nonfinite prerequisite deadline')

        def check(deadline: float = observation_deadline) -> float:
            now = time.monotonic()
            if now >= deadline:
                raise TimeoutError('inert prerequisite deadline')
            return now

        def close_owned(fd: int, deadline: float) -> None:
            if sys.exc_info()[1] is not None:
                try:
                    os.close(fd)
                except BaseException:
                    pass  # Keep the active failure, especially cancellation, primary.
                return
            try:
                check(deadline)
            finally:
                active = sys.exc_info()[1]
                try:
                    os.close(fd)
                except BaseException:
                    if active is None:
                        raise
            check(deadline)

        def failure(error: Exception, operation: str, deadline: float) -> dict[str, Any]:
            check(deadline)
            if isinstance(error, (InterruptedError, TimeoutError)) or (
                    isinstance(error, OSError)
                    and error.errno in (errno.EINTR, errno.ETIMEDOUT)):
                raise error
            error_type = type(error).__name__
            if (len(error_type) > 1024
                    or len(error_type.encode('utf-8', 'surrogatepass')) > 1024):
                raise ValueError('prerequisite exception type cap')
            number = error.errno if isinstance(error, OSError) else None
            detail = (os.strerror(number) if type(number) is int
                      else 'metadata acquisition failed')
            raw = detail[:128].encode('utf-8', 'surrogatepass')
            truncated = len(detail) > 128 or len(raw) > 128
            detail = raw[:128].decode('utf-8', 'ignore')
            check(deadline)
            return dict(state='error', operation=operation, error_type=error_type,
                        errno=number,
                        detail=detail, detail_truncated=truncated)

        def malformed(operation: str, detail: str) -> dict[str, Any]:
            if (len(detail) > 1024
                    or len(detail.encode('utf-8', 'surrogatepass')) > 1024):
                raise ValueError('prerequisite malformed detail cap')
            return dict(state='malformed', operation=operation, detail=detail)

        def over_cap(operation: str, limit: int, size: int, lower: bool) -> dict[str, Any]:
            return dict(state='over_cap', operation=operation, limit_bytes=limit,
                        observed_bytes=size, size_is_lower_bound=lower)

        def value_record(value: Any, operation: str, form: str, cap: int,
                         nullable: bool) -> dict[str, Any]:
            if value is None and nullable:
                return dict(state='value', value=None)
            if form in ('text', 'filesystem'):
                if not isinstance(value, str):
                    return malformed(operation, 'expected string')
                if len(value) > cap:
                    return over_cap(operation, cap, len(value), True)
                raw = value.encode('utf-8', 'surrogatepass')
                check()
                if len(raw) > cap:
                    return over_cap(operation, cap, len(raw), False)
                if form == 'filesystem':
                    value = dict(encoding='filesystem-bytes-base64',
                                 base64=base64.b64encode(
                                     os.fsencode(value)).decode('ascii'))
            elif form == 'integer':
                if type(value) is not int or not 0 <= value < 2 ** 64:
                    return malformed(operation, 'expected nonnegative bounded integer')
            elif form == 'boolean':
                if type(value) is not bool:
                    return malformed(operation, 'expected boolean')
            elif form == 'version':
                if (not isinstance(value, tuple) or len(value) != 5
                        or any(type(value[i]) is not int or not 0 <= value[i] < 2 ** 31
                               for i in (0, 1, 2, 4))
                        or not isinstance(value[3], str)):
                    return malformed(operation, 'expected implementation version tuple')
                level = value_record(value[3], operation, 'text', 1024, False)
                if level['state'] != 'value':
                    return level
                value = list(value)
            elif form == 'stat':
                value = dict(device=value.st_dev, inode=value.st_ino, mode=value.st_mode,
                             size=value.st_size, mtime_ns=value.st_mtime_ns,
                             ctime_ns=value.st_ctime_ns)
                if any(type(item) is not int or not -(2 ** 63) <= item < 2 ** 64
                       for item in value.values()):
                    return malformed(operation, 'expected bounded stat integers')
            elif form == 'export':
                return dict(state='present', callable=callable(value))
            return dict(state='value', value=value)

        def observe(operation: str, acquire: Callable[[], Any], form: str = 'text',
                    cap: int = 1024, nullable: bool = False) -> dict[str, Any]:
            started = check()
            try:
                value = acquire()
                check()
            except AttributeError:
                check()
                result = dict(state='absent', operation=operation)
            except KeyError as error:
                check()
                result = (dict(state='absent', operation=operation)
                          if operation.startswith('environment_')
                          else failure(error, operation, observation_deadline))
            except OSError as error:
                result = failure(error, operation, observation_deadline)
            except (ValueError, TypeError) as error:
                result = failure(error, operation, observation_deadline)
            else:
                try:
                    result = value_record(value, operation, form, cap, nullable)
                except (AttributeError, ValueError, TypeError) as error:
                    check()
                    result = malformed(operation, type(error).__name__)
            result.update(started=started, finished=check())
            if form == 'export' and result['state'] == 'absent':
                result.pop('operation')
            return result

        def read_proc(path: str, cap: int, operation: str) -> dict[str, Any]:
            started = check()
            deadline = min(observation_deadline, started + POLICY['read'])
            fd = None
            try:
                try:
                    check(deadline)
                    fd = os.open(path, os.O_RDONLY | os.O_NONBLOCK
                                 | os.O_NOFOLLOW | os.O_CLOEXEC)
                    check(deadline)
                    raw = bytearray()
                    while len(raw) <= cap:
                        check(deadline)
                        block = os.read(fd, cap + 1 - len(raw))
                        check(deadline)
                        if not block:
                            break
                        raw.extend(block)
                    if len(raw) > cap:
                        result = over_cap(operation, cap, len(raw), True)
                    elif path == '/proc/self/stat':
                        prefix, fields = bytes(raw).rsplit(b')', 1)
                        fields = fields.split()
                        pid = int(prefix.split(b' (', 1)[0])
                        ticks = int(fields[19])
                        if (pid != os.getpid() or ticks < 0 or ticks >= 2 ** 64
                                or len(fields[0]) != 1):
                            raise ValueError('malformed self stat')
                        result = dict(state='value', value=ticks)
                    else:
                        boot = bytes(raw).decode('ascii').strip()
                        if not re.fullmatch(
                                r'[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}', boot):
                            raise ValueError('malformed boot id')
                        result = dict(state='value', value=boot)
                    check(deadline)
                except OSError as error:
                    result = failure(error, operation, deadline)
                except (ValueError, IndexError) as error:
                    check(deadline)
                    result = malformed(operation, type(error).__name__)
            finally:
                if fd is not None:
                    close_owned(fd, deadline)
            result.update(started=started, finished=check(deadline))
            return result

        def module_metadata(name: str) -> tuple[dict[str, Any], dict[str, Any]]:
            started = check()
            keys = ('name', 'file', 'spec_origin', 'spec_has_location', 'loader_module',
                    'loader_qualname', 'name_listed_in_sys_builtin_module_names')
            try:
                module = os if name == 'os' else sys.modules['posix']
            except KeyError as error:
                export = failure(error, 'module_lookup', observation_deadline)
                finished = check()
                export.update(started=started, finished=finished)
                return (dict(loaded=False, **{
                    key: dict(state='absent', operation='module_lookup',
                              started=started, finished=finished)
                    for key in keys}), export)
            check()
            if not isinstance(module, ModuleType):
                kind = type(module)
                detail = ('observed non-module type ' + kind.__module__[:40]
                          + '.' + kind.__qualname__[:40])
                truncated = len(kind.__module__) > 40 or len(kind.__qualname__) > 40
                while len(detail.encode('utf-8', 'surrogatepass')) > 128:
                    detail = detail[:-1]
                    truncated = True
                finished = check()
                fields = {key: dict(state='malformed', operation='module_lookup',
                                    detail=detail,
                                    started=started, finished=finished) for key in keys}
                export = dict(state='error', operation='module_lookup',
                              error_type=None, errno=None,
                              detail=detail, detail_truncated=truncated,
                              started=started, finished=finished)
                return dict(loaded=False, **fields), export

            def loader_identity(attribute: str) -> str | None:
                loader = module.__spec__.loader
                if loader is None:
                    return None
                return getattr(
                    loader if isinstance(loader, type) else type(loader), attribute)

            provenance = dict(
                loaded=True,
                name=observe('module_name', lambda: module.__name__),
                file=observe('module_file', lambda: module.__file__, cap=2048),
                spec_origin=observe('module_spec_origin', lambda: module.__spec__.origin,
                                    cap=2048, nullable=True),
                spec_has_location=observe('module_spec_has_location',
                                          lambda: module.__spec__.has_location, 'boolean'),
                loader_module=observe('module_loader_module',
                                      lambda: loader_identity('__module__'), nullable=True),
                loader_qualname=observe('module_loader_qualname',
                                        lambda: loader_identity('__qualname__'),
                                        nullable=True),
                name_listed_in_sys_builtin_module_names=observe(
                    'builtin_module_names',
                    lambda: name in sys.builtin_module_names, 'boolean'))
            export = observe('pidfd_open_lookup',
                             lambda: getattr(module, 'pidfd_open'), 'export')
            return provenance, export

        started = check()
        started_wall = time.time_ns()
        binding = dict(capsule_id=origin.capsule_id, program_sha256=origin.program_sha256,
                       source_suite_sha256=origin.source_suite_sha256,
                       staged_suite_sha256=origin.staged_suite_sha256,
                       host_script_sha256=origin.host_script_sha256,
                       setup_script_sha256=origin.setup_script_sha256)
        for key, value in binding.items():
            length = 32 if key == 'capsule_id' else 64
            if (not isinstance(value, str) or len(value) != length
                    or not re.fullmatch(r'[0-9a-f]+', value)):
                raise ValueError('invalid prerequisite origin binding')
        launch = origin.launch_receipt
        if (launch.name != 'launch.json' or type(launch.size) is not int
                or not 0 < launch.size <= POLICY['metadata']
                or not isinstance(launch.sha256, str) or len(launch.sha256) != 64
                or not re.fullmatch(r'[0-9a-f]+', launch.sha256)):
            raise ValueError('invalid prerequisite launch binding')
        binding['launch_receipt'] = dict(name=launch.name, size=launch.size,
                                         sha256=launch.sha256)
        check()
        python = dict(
            executable=observe('sys_executable', lambda: sys.executable, cap=4096),
            version=observe('sys_version', lambda: sys.version, cap=4096),
            implementation_name=observe('implementation_name',
                                        lambda: sys.implementation.name),
            implementation_version=observe('implementation_version',
                                           lambda: sys.implementation.version, 'version'),
            implementation_cache_tag=observe('implementation_cache_tag',
                                             lambda: sys.implementation.cache_tag,
                                             nullable=True))
        executable = dict(
            proc_self_exe_readlink=observe('proc_self_exe_readlink',
                                          lambda: os.readlink('/proc/self/exe'),
                                          'filesystem', 4096),
            proc_self_exe_stat=observe('proc_self_exe_stat',
                                      lambda: os.stat('/proc/self/exe'), 'stat'))
        os_provenance, os_export = module_metadata('os')
        posix_provenance, posix_export = module_metadata('posix')
        self_metadata = dict(
            claim='unguarded_self_metadata',
            pid=observe('self_pid', os.getpid, 'integer'),
            start_ticks=read_proc('/proc/self/stat', 8192, 'self_start_ticks'),
            boot_id=read_proc('/proc/sys/kernel/random/boot_id', 128, 'boot_id'),
            pid_namespace=observe('pid_namespace',
                                  lambda: os.readlink('/proc/self/ns/pid'),
                                  'filesystem', 256),
            mount_namespace=observe('mount_namespace',
                                    lambda: os.readlink('/proc/self/ns/mnt'),
                                    'filesystem', 256),
            user_namespace=observe('user_namespace',
                                   lambda: os.readlink('/proc/self/ns/user'),
                                   'filesystem', 256))
        kernel_release = observe('kernel_release', lambda: os.uname().release, cap=512)
        environment = {name: observe('environment_' + name,
                                     lambda: os.environ[name], 'filesystem')
                       for name in ('PATH', 'PYTHONHOME', 'PYTHONPATH',
                                    'PYTHONNOUSERSITE', 'PYTHONSAFEPATH')}
        flags = {name: observe('flag_' + name, lambda: getattr(sys.flags, name),
                              'boolean' if name == 'safe_path' else 'integer')
