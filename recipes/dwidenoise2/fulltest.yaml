name: dwidenoise2
version: 1.0.0
default_timeout: 120

tests:
  - name: dwidenoise2 help
    description: Verify the container runtime smoke test for this tool.
    command: |
      dwidenoise2 -help

  - name: dwi2noise help
    description: Verify the container runtime smoke test for this tool.
    command: |
      dwi2noise -help

  - name: bundled MRtrix3 helper help
    description: Verify the container runtime smoke test for this tool.
    command: |
      mrconvert -help

  - name: bundled noise estimation schedules
    description: Verify the release's default runtime schedules were installed.
    command: |
      test -s /opt/mrtrix3/share/mrtrix3/dwidenoise2/default.txt
      test -s /opt/mrtrix3/share/mrtrix3/dwi2noise/default.txt
      echo "bundled schedules available"
    expected_output_contains: "bundled schedules available"
