name: fiji
version: 20261112-1517

copyright:
  - license: GPL-2.0-or-later
    url: https://github.com/fiji/fiji/blob/master/LICENSES

architectures:
  - x86_64

auto_update:
  method: webpage
  url: https://downloads.imagej.net/fiji/archive/stable/
  version_regex: 'href="(?P<version>[0-9]{8}-[0-9]{4})/"'

structured_readme:
  description: >-
    Fiji (Fiji Is Just ImageJ) is an open-source image processing package based
    on ImageJ2, bundling Bio-Formats, BigDataViewer, and scientific microscopy
    plugins for 2D/3D visualization, segmentation, registration, and analysis.
  example: |
    # Launch the Fiji GUI
    fiji

    # Run a headless ImageJ macro
    fiji --headless --ij2 --run my_macro.ijm
  documentation: https://imagej.net/software/fiji/
  citation: |-
    Schindelin, J., Arganda-Carreras, I., Frise, E., Kaynig, V., Longair, M.,
    Pietzsch, T., Preibisch, S., Rueden, C., Saalfeld, S., Schmid, B.,
    Tinevez, J.-Y., White, D. J., Hartenstein, V., Eliceiri, K., Tomancak, P.,
    & Cardona, A. (2012). Fiji: an open-source platform for biological-image
    analysis. Nature Methods, 9(7), 676-682. https://doi.org/10.1038/nmeth.2019

files:
  - name: fiji_archive
    url: https://downloads.imagej.net/fiji/archive/stable/{{ context.version }}/fiji-stable-linux64-jdk.zip
  - name: fiji-wrapper
    executable: true
    contents: |-
      #!/usr/bin/env bash
      set -euo pipefail
      prefs_root="${XDG_CONFIG_HOME:-${TMPDIR:-/tmp}/fiji-$(id -u)}/fiji-java-prefs"
      mkdir -p "${prefs_root}"
      export JAVA_TOOL_OPTIONS="-Djava.util.prefs.userRoot=${prefs_root} ${JAVA_TOOL_OPTIONS:-}"
      if [ -x /opt/Fiji.app/fiji-linux-x64 ]; then
        exec /opt/Fiji.app/fiji-linux-x64 "$@"
      elif [ -x /opt/Fiji.app/ImageJ-linux64 ]; then
        exec /opt/Fiji.app/ImageJ-linux64 "$@"
      elif [ -x /opt/Fiji/fiji-linux-x64 ]; then
        exec /opt/Fiji/fiji-linux-x64 "$@"
      else
        echo "Fiji launcher binary not found under /opt" >&2
        exit 1
      fi

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
    - install:
        - ca-certificates
        - fontconfig
        - libasound2t64
        - libfreetype6
        - libgl1
        - libglib2.0-0
        - libglu1-mesa
        - libgtk-3-0
        - libx11-6
        - libxext6
        - libxi6
        - libxrandr2
        - libxrender1
        - libxtst6
        - unzip
    - workdir: /opt
    - run:
        - unzip -q {{ get_file("fiji_archive") }} -d /opt
        - chmod -R a+rX /opt/Fiji*
        - install -m 755 {{ get_file("fiji-wrapper") }} /usr/local/bin/fiji
        - ln -sf /usr/local/bin/fiji /usr/local/bin/ImageJ

deploy:
  path: []
  bins:
    - fiji
    - ImageJ

gui_apps:
  - name: "Fiji"
    exec: "fiji"

domains:
  - microscopy

categories:
  - visualization
  - image segmentation

icon: data:image/png;base64,
