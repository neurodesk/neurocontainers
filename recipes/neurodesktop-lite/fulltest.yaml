# neurodesktop-lite container test suite
# Tests for neurodesktop-lite 20260428 - native Glass LXDE desktop with
# on-demand JupyterLab, CVMFS-backed NeuroDesk tooling, and workflow utilities.

name: neurodesktop-lite
version: "20260428"
default_timeout: 120

test_data:
  output_dir: test_output

env_setup: |
  export JUPYTER_TOKEN="${JUPYTER_TOKEN:-}"
  export JUPYTER_PASSWORD="${JUPYTER_PASSWORD:-}"
  export NEURODESKTOP_CVMFS_STARTUP_MODE="${NEURODESKTOP_CVMFS_STARTUP_MODE:-lazy}"
  export NEURODESKTOP_SLURM_STARTUP_MODE="${NEURODESKTOP_SLURM_STARTUP_MODE:-lazy}"

setup:
  script: |
    #!/usr/bin/env bash
    set -euo pipefail
    mkdir -p "${output_dir}"

tests:
  # ==========================================================================
  # LAUNCHERS AND CORE ENTRYPOINTS
  # ==========================================================================
  - name: Neurodesktop launchers are installed
    description: Verify the public Neurodesktop launcher commands are on PATH
    command: |
      bash -lc '
        set -euo pipefail
        command -v start-neurodesktop-jupyterlab
        command -v neurodesktop-start-jupyter
        test -f /etc/systemd/system/neurodesktop-jupyter.service
        ! command -v start-neurodesktop-guacamole
        echo neurodesktop-launchers-ok
      '
    expected_output_contains: "neurodesktop-launchers-ok"

  - name: Core runtime commands are available
    description: Verify Jupyter and native desktop commands exist without remote-desktop servers
    command: |
      bash -lc '
        set -euo pipefail
        command -v jupyter
        command -v code-server
        command -v apptainer
        command -v virgl_test_server
        test -x /usr/lib/xorg/Xorg
        test -f /etc/systemd/system/neurodesktop-virgl.service
        grep -Fq "ConditionPathExists=/dev/dri/renderD128" /etc/systemd/system/neurodesktop-virgl.service
        grep -Fq -- "virgl_test_server --multi-clients" /etc/systemd/system/neurodesktop-virgl.service
        grep -Fq -- "--socket-path /tmp/.virgl_test" /etc/systemd/system/neurodesktop-virgl.service
        test ! -e /etc/systemd/system/glass.target.wants/neurodesktop-virgl.service
        test -x /usr/local/sbin/neurodesktop-start-virgl
        test -x /usr/local/libexec/neurodesktop-container-runtime
        test -L /usr/local/bin/apptainer
        test -L /usr/local/bin/singularity
        ! command -v guacd
        ! command -v Xvnc
        ! command -v vncserver
        ! command -v xrdp
        echo core-runtime-ok
      '
    expected_output_contains: "core-runtime-ok"

  - name: Desktop terminals initialize Lmod
    description: Verify a non-login interactive Bash shell exposes module and ml
    command: |
      bash --noprofile --norc -ic '
        set -eo pipefail
        source /etc/bash.bashrc
        type module
        type ml
        ml --help >/dev/null
        echo lmod-terminal-ok
      '
    expected_output_contains: "lmod-terminal-ok"

  - name: App container overlay is ready for terminal tools
    description: Verify sourcing the desktop environment creates its private writable overlay
    command: |
      bash -c '
        set -eo pipefail
        runtime="$(mktemp -d)"
        trap '"'"'rm -rf "$runtime"'"'"' EXIT
        XDG_RUNTIME_DIR="$runtime"
        printf "processor : 0\ncpu MHz : 2400.000\n" > "$runtime/cpuinfo"
        NEURODESKTOP_CPUINFO_COMPAT_FILE="$runtime/cpuinfo"
        source /opt/neurodesktop/environment_variables.sh
        test -d "$NEURODESKTOP_APPTAINER_OVERLAY"
        test "$(stat -c %a "$NEURODESKTOP_APPTAINER_OVERLAY")" = 700
        test -d "$MCR_CACHE_ROOT"
        test "$APPTAINERENV_MCR_CACHE_ROOT" = "$MCR_CACHE_ROOT"
        test "$SINGULARITYENV_MCR_CACHE_ROOT" = "$MCR_CACHE_ROOT"
        case "$neurodesk_singularity_opts" in
          *"$NEURODESKTOP_APPTAINER_OVERLAY"*) ;;
          *) exit 1 ;;
        esac
        case "$neurodesk_singularity_opts" in
          *"$runtime/cpuinfo:/proc/cpuinfo:ro"*) ;;
          *) exit 1 ;;
        esac
        echo app-overlay-ready
      '
    expected_output_contains: "app-overlay-ready"

  - name: GPU acceleration is scoped by the image manifest
    description: Verify the master switch and exact container allowlist control VirGL injection
    command: |
      bash -c '
        set -eo pipefail
        runtime="$(mktemp -d)"
        trap '"'"'rm -rf "$runtime"'"'"' EXIT
        manifest="$runtime/manifest.tsv"
        printf "mrtrix3\t3.0.8\n" > "$manifest"
        real_runtime="$runtime/real-runtime"
        cat > "$real_runtime" <<'"'"'EOF'"'"'
      #!/bin/sh
      printf "driver=%s\n" "${APPTAINERENV_GALLIUM_DRIVER:-}"
      printf "socket=%s\n" "${APPTAINERENV_VTEST_SOCKET_NAME:-}"
      printf "gl=%s\n" "${APPTAINERENV_MESA_GL_VERSION_OVERRIDE:-}"
      printf "glsl=%s\n" "${APPTAINERENV_MESA_GLSL_VERSION_OVERRIDE:-}"
      EOF
        chmod +x "$real_runtime"
        starter="$runtime/start-virgl"
        cat > "$starter" <<'"'"'EOF'"'"'
      #!/bin/sh
      python3 -c '"'"'import socket,sys; s=socket.socket(socket.AF_UNIX); s.bind(sys.argv[1]); s.close()'"'"' "$NEURODESKTOP_VTEST_SOCKET"
      EOF
        chmod +x "$starter"
        wrapper=/usr/local/bin/apptainer
        common="NEURODESKTOP_APPTAINER_REAL=$real_runtime NEURODESKTOP_GPU_MANIFEST=$manifest NEURODESKTOP_VIRGL_STARTER=$starter NEURODESKTOP_VTEST_SOCKET=$runtime/vtest"

        disabled="$(env $common "$wrapper" exec mrtrix3_3.0.8_20260107.simg true)"
        ! printf "%s\n" "$disabled" | grep -q "driver=virpipe"
        test ! -e "$runtime/vtest"

        unlisted="$(env $common NEURODESKTOP_GPU_ACCELERATION=1 "$wrapper" exec blender_5.0.1_20260701.simg true)"
        ! printf "%s\n" "$unlisted" | grep -q "driver=virpipe"
        test ! -e "$runtime/vtest"

        accelerated="$(env $common NEURODESKTOP_GPU_ACCELERATION=1 "$wrapper" exec mrtrix3_3.0.8_20260107.simg true)"
        printf "%s\n" "$accelerated" | grep -Fq "driver=virpipe"
        printf "%s\n" "$accelerated" | grep -Fq "socket=$runtime/vtest"
        printf "%s\n" "$accelerated" | grep -Fq "gl=4.1"
        printf "%s\n" "$accelerated" | grep -Fq "glsl=410"

        mismatch="$(env $common NEURODESKTOP_GPU_ACCELERATION=1 "$wrapper" exec mrtrix3_3.0.80_20260107.simg true)"
        ! printf "%s\n" "$mismatch" | grep -q "driver=virpipe"
        echo gpu-manifest-ready
      '
    expected_output_contains: "gpu-manifest-ready"

  - name: MATLAB CPU information compatibility
    description: Verify ARM processor records gain the frequency field required by amd64 MATLAB Runtime
    command: |
      bash -lc '
        set -euo pipefail
        runtime="$(mktemp -d)"
        trap '"'"'rm -rf "$runtime"'"'"' EXIT
        printf "processor : 0\nmodel name : Apple M\n\nprocessor : 1\nmodel name : Apple M\n" > "$runtime/source"
        NEURODESKTOP_CPUINFO_SOURCE="$runtime/source" \
        NEURODESKTOP_CPUINFO_OUTPUT="$runtime/output" \
        NEURODESKTOP_CPUINFO_SKIP_MOUNT=1 \
          /usr/local/sbin/neurodesktop-cpuinfo-compat
        test "$(grep -Ec '"'"'^cpu MHz[[:space:]]*:'"'"' "$runtime/output")" = 2
        test "$(grep -Ec '"'"'^processor[[:space:]]*:'"'"' "$runtime/output")" = 2
        echo matlab-cpuinfo-ready
      '
    expected_output_contains: "matlab-cpuinfo-ready"

  - name: Neurodesktop version environment
    description: Verify the image exposes the recipe version
    command: bash -lc 'echo "NEURODESKTOP_VERSION=${NEURODESKTOP_VERSION:-missing}"'
    expected_output_contains: "NEURODESKTOP_VERSION=20260428"

  - name: Launcher scripts are executable
    description: Verify installed launcher and startup scripts have execute bits
    command: |
      bash -lc '
        set -euo pipefail
        paths=( \
          /usr/local/bin/start-neurodesktop-jupyterlab \
          /usr/local/bin/neurodesktop-start-jupyter \
          /usr/local/sbin/neurodesktop-glass-prepare \
          /usr/local/sbin/neurodesktop-cpuinfo-compat \
          /opt/neurodesktop/jupyterlab_startup.sh \
          /opt/neurodesktop/deferred_startup.sh \
          /opt/neurodesktop/nested_container_runtime.sh \
          /opt/neurodesktop/environment_variables.sh
        )
        for path in "${paths[@]}"; do
          test -x "$path"
          echo "executable:$path"
        done
        echo launcher-scripts-executable
      '
    expected_output_contains: "launcher-scripts-executable"

  # ==========================================================================
  # JUPYTERLAB AND WEBAPP CONFIGURATION
  # ==========================================================================
  - name: JupyterLab version check
    description: Verify JupyterLab and Jupyter Server are installed
    command: |
      bash -lc '
        set -euo pipefail
        echo "lab=$(jupyter lab --version)"
        echo "server=$(jupyter server --version)"
      '
    expected_output_contains:
      - "lab="
      - "server="

  - name: Jupyter config files are installed
    description: Verify generated Jupyter config and Neurodesktop assets exist
    command: |
      bash -lc '
        set -euo pipefail
        test -r /etc/jupyter/jupyter_notebook_config.py
        test -r /etc/jupyter/jupyter_server_config.py
        test -r /opt/neurodesktop/jupyter_notebook_config.py.template
        test -r /opt/neurodesktop/webapps.json
        test -r /opt/neurodesktop/webapp_wrapper/webapp_wrapper.py
        test -r /opt/neurodesk_brain_logo.svg
        echo "jupyter-config-ok"
      '
    expected_output_contains: "jupyter-config-ok"

  - name: Webapps JSON is valid
    description: Verify Neurodesktop webapp launcher metadata parses as JSON
    command: |
      python3 - <<'PY'
      import json
      from pathlib import Path
      path = Path("/opt/neurodesktop/webapps.json")
      payload = json.loads(path.read_text())
      assert isinstance(payload, dict), type(payload)
      assert payload, "webapps.json is empty"
      print("webapps-json-ok", len(payload))
      PY
    expected_output_contains: "webapps-json-ok"

  - name: JupyterLab launcher starts
    description: Start JupyterLab briefly and verify it reaches the ready state
    timeout: 90
    command: |
      bash -lc '
        set -euo pipefail
        tmp_home="$(mktemp -d)"
        port="$(python3 - <<'"'"'PY'"'"'
      import socket
      s = socket.socket()
      s.bind(("127.0.0.1", 0))
      print(s.getsockname()[1])
      s.close()
      PY
      )"
        log="${output_dir}/jupyter-smoke.log"
        HOME="$tmp_home" \
        NEURODESK_WEBAPP_PORT="$port" \
        JUPYTER_TOKEN= \
        JUPYTER_PASSWORD= \
          start-neurodesktop-jupyterlab >"$log" 2>&1 &
        pid=$!
        cleanup() {
          kill "$pid" >/dev/null 2>&1 || true
          wait "$pid" >/dev/null 2>&1 || true
          rm -rf "$tmp_home"
        }
        trap cleanup EXIT
        deadline=$((SECONDS + 60))
        while [ "$SECONDS" -lt "$deadline" ]; do
          if curl -fsS "http://127.0.0.1:${port}/api/status" >"${output_dir}/jupyter-status.json"; then
            cat "${output_dir}/jupyter-status.json"
            echo "jupyter-launcher-ok"
            exit 0
          fi
          if grep -q "Jupyter Server .* is running at:" "$log"; then
            tail -40 "$log"
            echo "jupyter-launcher-ok"
            exit 0
          fi
          if ! kill -0 "$pid" >/dev/null 2>&1; then
            echo "Jupyter launcher exited early"
            tail -80 "$log" || true
            exit 1
          fi
          sleep 1
        done
        echo "Jupyter launcher did not become ready"
        tail -120 "$log" || true
        exit 1
      '
    expected_output_contains: "jupyter-launcher-ok"

  # ==========================================================================
  # DESKTOP AND STORAGE CONFIGURATION
  # ==========================================================================
  - name: Native desktop integration is installed
    description: Verify Glass desktop integration and remote-desktop exclusions
    command: |
      bash -lc '
        set -euo pipefail
        test -r /etc/systemd/system/neurodesktop-glass.service
        test -r /etc/systemd/system/neurodesktop-jupyter.service
        test -x /opt/jovyan_defaults/Desktop/jupyterlab.desktop
        test ! -e /etc/guacamole
        test ! -e /usr/local/tomcat
        ! grep -q /opt/neurodesktop/guacamole.sh /etc/jupyter/jupyter_notebook_config.py
        echo desktop-integration-ok
      '
    expected_output_contains: "desktop-integration-ok"

  - name: Neurodesktop storage directory exists
    description: Verify the persistent storage mount point exists
    command: |
      bash -lc '
        set -euo pipefail
        test -d /neurodesktop-storage
        echo "neurodesktop-storage-ok"
      '
    expected_output_contains: "neurodesktop-storage-ok"

  - name: Remote desktop credentials are absent
    description: Verify obsolete Guacamole and VNC state is not installed
    command: |
      bash -lc '
        set -euo pipefail
        test ! -e /opt/neurodesktop/init_secrets.sh
        test ! -e /opt/jovyan_defaults/.vnc
        echo desktop-credentials-ok
      '
    expected_output_contains: "desktop-credentials-ok"

  # ==========================================================================
  # CVMFS AND NEUROCOMMAND INTEGRATION
  # ==========================================================================
  - name: CVMFS runtime packages and config are present
    description: Verify CVMFS client, autofs, and Neurodesk repo config remain installed
    command: |
      bash -lc '
        set -euo pipefail
        dpkg-query -W cvmfs autofs uuid-dev >/dev/null
        command -v cvmfs_config
        test -r /etc/cvmfs/default.local
        test -r /etc/cvmfs/keys/ardc.edu.au/neurodesk.ardc.edu.au.pub
        ls /etc/cvmfs/config.d/neurodesk.ardc.edu.au.conf* >/dev/null
        grep -q "CVMFS_HTTP_PROXY" /etc/cvmfs/default.local
        echo "cvmfs-runtime-ok"
      '
    expected_output_contains: "cvmfs-runtime-ok"

  - name: Neurocommand installation is present
    description: Verify neurocommand and Neurodesk module setup files exist
    command: |
      bash -lc '
        set -euo pipefail
        test -d /neurocommand
        test -L /neurocommand/local/containers
        test -r /usr/share/module.sh
        test -x /usr/share/lmod/lmod/libexec/lmod
        echo "neurocommand-ok"
      '
    expected_output_contains: "neurocommand-ok"

  - name: CVMFS repository is usable when mounted
    description: Verify mounted CVMFS contains Neurodesk modules and containers when available
    command: |
      bash -lc '
        set -euo pipefail
        if [ "${CVMFS_DISABLE:-false}" = "true" ] || [ "${CVMFS_DISABLE:-false}" = "1" ]; then
          echo "cvmfs-skipped-disabled"
          exit 0
        fi
        if [ ! -d /cvmfs/neurodesk.ardc.edu.au ]; then
          echo "cvmfs-skipped-not-mounted"
          exit 0
        fi
        test -d /cvmfs/neurodesk.ardc.edu.au/neurodesk-modules
        test -d /cvmfs/neurodesk.ardc.edu.au/containers
        echo "cvmfs-mounted-ok"
      '
    expected_output_contains: "cvmfs-"

  # ==========================================================================
  # WORKFLOW AND DEVELOPMENT TOOLS
  # ==========================================================================
  - name: Code server version check
    description: Verify code-server is installed and runnable
    command: code-server --version 2>&1 | sed -n '1,3p'
    expected_output_contains: "Code"

  - name: Apptainer version check
    description: Verify Apptainer is installed in the desktop image
    command: apptainer --version
    expected_output_contains: "apptainer version"

  - name: Nextflow launcher is installed
    description: Verify the Nextflow launcher is installed without requiring network bootstrap
    command: |
      bash -lc '
        set -euo pipefail
        command -v nextflow
        test -x "$(command -v nextflow)"
        head -1 "$(command -v nextflow)" | grep -q "bash"
        echo "nextflow-launcher-ok"
      '
    expected_output_contains: "nextflow-launcher-ok"

  - name: nf-test version check
    description: Verify nf-test wrapper is installed and runnable
    timeout: 180
    command: nf-test version 2>&1
    expected_output_contains: "nf-test 0.9.5"

  - name: Python workflow packages are installed
    description: Verify key Python workflow/Jupyter packages are installed
    command: |
      python3 - <<'PY'
      import importlib.util

      packages = [
          "datalad",
          "nipype",
          "snakemake",
          "jupyter_server_proxy",
          "jupyterlmod",
          "notebook_intelligence",
      ]
      missing = [name for name in packages if importlib.util.find_spec(name) is None]
      assert not missing, missing
      print("python-workflow-packages-ok")
      PY
    expected_output_contains: "python-workflow-packages-ok"

  - name: Notebook PDF export works
    description: Verify bundled TinyTeX supports nbconvert PDF export
    timeout: 180
    command: |
      bash -lc '
        set -euo pipefail
        notebook="${output_dir}/neurodesktop_pdf_smoke.ipynb"
        NOTEBOOK_PATH="$notebook" python3 - <<'"'"'PY'"'"'
      import json
      import os

      notebook_payload = {
          "cells": [
              {
                  "cell_type": "markdown",
                  "id": "neurodesktop-pdf-markdown",
                  "metadata": {},
                  "source": ["# Neurodesktop PDF export\n", "Fulltest smoke notebook.\n"],
              },
              {
                  "cell_type": "code",
                  "id": "neurodesktop-pdf-code",
                  "execution_count": None,
                  "metadata": {},
                  "outputs": [],
                  "source": ["print(42)\n"],
              },
          ],
          "metadata": {
              "kernelspec": {
                  "display_name": "Python 3",
                  "language": "python",
                  "name": "python3",
              },
              "language_info": {
                  "name": "python",
                  "version": "3",
              },
          },
          "nbformat": 4,
          "nbformat_minor": 5,
      }
      with open(os.environ["NOTEBOOK_PATH"], "w", encoding="utf-8") as fp:
          json.dump(notebook_payload, fp)
      PY
        command -v xelatex
        jupyter nbconvert --to pdf "$notebook" --output neurodesktop_pdf_smoke --output-dir "${output_dir}"
        echo "nbconvert-pdf-ok"
      '
    expected_output_contains: "nbconvert-pdf-ok"
    validate:
      - output_exists: ${output_dir}/neurodesktop_pdf_smoke.pdf

  - name: Build-only toolchain was removed
    description: Verify broad build-only metapackage is not retained
    command: |
      bash -lc '
        set -euo pipefail
        status="$(dpkg-query -W -f='"'"'${db:Status-Abbrev}'"'"' build-essential 2>/dev/null || true)"
        if [ "$status" = ii ]; then
          echo "build-essential should have been removed"
          exit 1
        fi
        echo "build-toolchain-removed"
      '
    expected_output_contains: "build-toolchain-removed"
