name: mne
version: 1.13.2

copyright:
  - license: BSD-3-Clause
    url: https://github.com/mne-tools/mne-bids-pipeline/blob/main/LICENSE.txt
architectures:
  - x86_64
  - aarch64

variables:
  mne_version: "1.13.2"
  vscode_version: "1.143.0"
  pipeline_commit: "e2a34cf44ab8d2df3646aaedc93de6c042e1b00a"
  miniconda_version: py311_25.5.1-0
  vscode_arch:
    try:
      - value: x64
        condition: arch == "x86_64"
      - value: arm64
        condition: arch == "aarch64"

auto_update:
  method: sources
  container_version: mne
  sources:
    - id: mne
      method: github_release
      repo: mne-tools/mne-python
      target:
        variable: mne_version
        fulltest_variable: mne_version
    - id: vscode
      method: webpage
      url: https://update.code.visualstudio.com/api/update/linux-x64/stable/latest
      version_regex: '"productVersion":\s*"(?P<version>\d+(?:\.\d+)+)"'
      target:
        variable: vscode_version
        fulltest_variable: vscode_version
    - id: bids_pipeline
      method: github_commit
      repo: mne-tools/mne-bids-pipeline
      ref: main
      target:
        variable: pipeline_commit

build:
  kind: neurodocker

  base-image: ubuntu:20.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive

    - install:
        - midori
        - xdg-utils
        - python3-pyqt5
        - unzip
        - git
        - apt-transport-https
        - ca-certificates
        - coreutils
        - curl
        - gnome-keyring
        - gnupg
        - libnotify4
        - wget
        - libnss3
        - libxkbfile1
        - libsecret-1-0
        - libgtk-3-0
        - libxss1
        - libgbm1
        - libxshmfence1
        - libasound2
        - libglu1-mesa
        - libgl1-mesa-dri
        - mesa-utils
        - xvfb
        - xauth
        - libgl1-mesa-glx
        - libosmesa6

    - template:
        name: miniconda
        version: "{{ context.miniconda_version }}"
        install_path: /opt/miniconda-latest
        env_name: mne-{{ context.version }}
        env_exists: "false"
        conda_install: mne={{ context.mne_version }} python=3.13

    - run:
        - cp {{ get_file("download") }} vscode.deb
        - apt install ./vscode.deb
        - rm -rf ./vscode.deb

    - run:
        - code --extensions-dir=/opt/vscode-extensions --user-data-dir=/opt/vscode-data --install-extension ms-python.python
        - code --extensions-dir=/opt/vscode-extensions --user-data-dir=/opt/vscode-data --install-extension ms-python.vscode-pylance
        - code --extensions-dir=/opt/vscode-extensions --user-data-dir=/opt/vscode-data --install-extension ms-toolsai.jupyter
        - code --extensions-dir=/opt/vscode-extensions --user-data-dir=/opt/vscode-data --install-extension ms-toolsai.jupyter-keymap
        - code --extensions-dir=/opt/vscode-extensions --user-data-dir=/opt/vscode-data --install-extension ms-toolsai.jupyter-renderers

    - environment:
        DONT_PROMPT_WSL_INSTALL: "1"

    - workdir: /opt/

    - run:
        - tar xz -f {{ get_file("main_tar_gz") }}
        - mv /opt/mne-bids-pipeline-{{ context.pipeline_commit }} /opt/mne-bids-pipeline-main

    - run:
        - chmod a+rwx /opt/mne-bids-pipeline-main -R

    - copy: code /usr/local/sbin/

    - run:
        - chmod a+x /usr/local/sbin/code
        - chmod a+rwx /opt/vscode-extensions -R

    - environment:
        RUNLEVEL: "3"
        XDG_RUNTIME_DIR: ~/.vscode

    - environment:
        LD_PRELOAD: /opt/miniconda-latest/envs/mne-{{ context.version }}/lib/libgomp.so.1:/usr/lib/aarch64-linux-gnu/libglapi.so.0
      condition: arch == "aarch64"

    - user: neuro

deploy:
  bins:
    - code

readme: |-
  ----------------------------------
  ## mne/{{ context.version }} ##
  Python MNE environment with VScode

  Example:
  ```
  code
  ```
  Or:
  ```
  source /opt/miniconda-latest/etc/profile.d/conda.sh
  conda activate mne-{{ context.version }}
  ```

  More documentation can be found here: https://mne.tools/stable/index.html
  To cite MNE Python see here: https://mne.tools/stable/overview/cite.html


  To run applications outside of this container: ml mne/{{ context.version }}
  Note the use of the module system does not currently interface with MNE and conda environments in this container
  ----------------------------------

files:
  - name: main_tar_gz
    url: https://github.com/mne-tools/mne-bids-pipeline/archive/{{ context.pipeline_commit }}.tar.gz
  - name: download
    url: https://update.code.visualstudio.com/{{ context.vscode_version }}/linux-deb-{{ context.vscode_arch }}/stable
  - name: code
    contents: |-
      #!/usr/bin/env sh
      set -eu
      mne_vscode_data="${XDG_CONFIG_HOME:-${TMPDIR:-/tmp}}/mne-vscode-$(id -u)"
      mkdir -p "$mne_vscode_data"
      exec /usr/bin/code --extensions-dir=/opt/vscode-extensions --user-data-dir="$mne_vscode_data" "$@"

categories:
  - "electrophysiology"
icon: data:image/png;base64,
