name: b0mapromeo
version: 1.1.0
tests:
  - name: launcher version
    description: Check the deployed command and container version.
    command: b0mapromeo --version
    expected_output_contains: "b0mapromeo ${version}"
  - name: synthetic B0 reconstruction
    description: Reconstruct a known signed B0 field with real ROMEO and verify DICOM parsing, MRD geometry and Hz scaling.
    timeout: 600
    command: python3 /opt/b0mapromeo/smoke_test.py
    expected_output_contains: "Synthetic DICOM/MRD ROMEO B0 smoke test passed"
  - name: calibrated absolute shim settings
    description: Exercise the installed Shimming Toolbox optimizer, current constraints and MRD image comments.
    command: python3 /opt/b0mapromeo/test_b0mapromeo_shim.py
    expected_output_contains: "Calibrated absolute shim tests passed"
