name: rstudio
version: 2026.10.1

copyright:
  - license: AGPL-3.0
    url: https://spdx.org/licenses/AGPL-3.0.html

architectures:
  - x86_64

variables:
  upstream_tag: "v2026.10.1+239"
  # R from CRAN's jammy-cran40 apt repository, pinned to one exact build.
  r_version: "4.6.2-1.2204.0"
  # Posit Package Manager CRAN snapshot that every CRAN package comes from.
  # It advances together with R and RStudio, so packages always match the R
  # they were tested with.
  cran_snapshot: "2026-10-31"
  mricrotome_commit: "27aa2cd1025a063fdb07cec7f555f498428400da"
  rminc_commit: "01866cb94ff08679a47cae83a808352f6a25dc77"

auto_update:
  method: sources
  container_version: rstudio
  sources:
    - id: rstudio
      method: github_tags
      repo: rstudio/rstudio
      version_regex: 'v(?P<version>\d{4}\.\d{2}\.\d+)\+\d+'
      target:
        variable: upstream_tag
        value: tag
    - id: r
      method: apt
      package: r-base-core
      urls:
        - https://cloud.r-project.org/bin/linux/ubuntu/jammy-cran40/Packages.gz
      target:
        variable: r_version
        fulltest_variable: r_version
    - id: cran_snapshot
      method: webpage
      url: https://packagemanager.posit.co/__api__/repos/cran/transaction-dates
      version_regex: '"alias":"(?P<version>[0-9-]+)"'
      version_scheme: date
      dependency: true
      target:
        variable: cran_snapshot
    - id: mricrotome
      method: github_commit
      repo: Mouse-Imaging-Centre/MRIcrotome
      ref: HEAD
      dependency: true
      target:
        variable: mricrotome_commit
    - id: rminc
      method: github_commit
      repo: Mouse-Imaging-Centre/RMINC
      ref: HEAD
      dependency: true
      target:
        variable: rminc_commit

build:
  kind: neurodocker

  base-image: ubuntu:22.04
  pkg-manager: apt

  directives:
    - workdir: /opt

    - install:
        - locales
        - software-properties-common

    - environment:
        DEBIAN_FRONTEND: noninteractive
        LANGUAGE: en_AU.UTF-8
        LC_ALL: en_AU.UTF-8

    - run:
        - locale-gen en_AU.UTF-8

    # Ubuntu 22.04 ships R 4.1.2, which current CRAN packages no longer
    # support (readxl and gargle require R >= 4.2). Install the pinned R
    # from CRAN's jammy-cran40 repository instead.
    - run:
        - install -m 0644 {{ get_file("cran_ubuntu_key") }} /etc/apt/trusted.gpg.d/cran_ubuntu_key.asc
        - echo "deb https://cloud.r-project.org/bin/linux/ubuntu jammy-cran40/" > /etc/apt/sources.list.d/cran.list

    - install:
        - wget
        - ubuntu-desktop
        - vim
        - software-properties-common
        - git
        - cmake
        - mesa-utils
        - sudo
        - build-essential
        - psmisc
        - python3-pip
        - python3-pyqt5
        - pyqt5-dev
        - python3-tk
        - python3-pandas
        - python3-fire
        - dirmngr
        - gnupg
        - apt-transport-https
        - ca-certificates
        - software-properties-common
        - "r-base={{ context.r_version }}"
        - "r-base-core={{ context.r_version }}"
        - "r-recommended={{ context.r_version }}"
        - gdebi-core
        - libssl-dev
        - libexpat1-dev
        - curl
        - libxml2-dev
        - libcurl4-openssl-dev
        - libuv1-dev
        - libharfbuzz-dev
        - libfribidi-dev
        - libclang-dev
        - libpq5
        - libfftw3-dev
        - gpg-agent
        - libgfortran-9-dev
        - libblas-dev
        - libblas64-dev
        - liblapack-dev
        - gfortran
        - libudunits2-dev
        - r-cran-ncdf4
        - libgdal-dev
        - libproj-dev
        - libgeos-dev
        - libudunits2-dev
        - libnode-dev
        - libcairo2-dev
        - libnetcdf-dev

    - workdir: /opt

    - run:
        - cp {{ get_file("rstudio_2023_12_1_402_amd64_deb") }} rstudio-2023.12.1-402-amd64.deb

    - run:
        - gdebi -q -n /opt/rstudio-2023.12.1-402-amd64.deb

    - run:
        - rm -rf rstudio-2023.12.1-402-amd64.deb

    # Install RStudio Server (web version)
    - run:
        - cp {{ get_file("rstudio_server_2023_12_1_402_amd64_deb") }} rstudio-server-2023.12.1-402-amd64.deb
        - gdebi -q -n /opt/rstudio-server-2023.12.1-402-amd64.deb
        - rm -rf rstudio-server-2023.12.1-402-amd64.deb

    - copy: dependencies.R /opt

    - run:
        - Rscript /opt/dependencies.R

    # Add RStudio lib dir to linker search path (for libffmpeg.so)
    - run:
        - echo '/usr/lib/rstudio' > /etc/ld.so.conf.d/rstudio.conf
        - ldconfig

    # Create RStudio Server config for single-user containerized mode
    # (placed after R dependencies so config tweaks don't invalidate R package cache)
    - run:
        - mkdir -p /etc/rstudio
        - echo 'www-port=8787' > /etc/rstudio/rserver.conf
        - echo 'www-address=0.0.0.0' >> /etc/rstudio/rserver.conf
        - echo 'auth-none=1' >> /etc/rstudio/rserver.conf
        - echo 'auth-minimum-user-id=0' >> /etc/rstudio/rserver.conf
        - echo 'server-user=root' >> /etc/rstudio/rserver.conf

    # Copy RStudio Server launcher script
    - copy: rstudio-server-start /usr/local/bin/rstudio-server-start
    - run:
        - chmod +x /usr/local/bin/rstudio-server-start

    - environment:
        LD_LIBRARY_PATH: "/usr/local/cuda/lib64/stubs:/usr/local/cuda/lib64/:/usr/local/cuda/lib:"
        PATH: /usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:~/.local/bin:/usr/local/cuda/bin

deploy:
  bins:
    - rstudio
    - rstudio-server-start
  webapp:
    title: "RStudio Server"
    icon: "icon.svg"
    startup_command: "rstudio-server-start"
    startup_timeout: 120
    description: "RStudio IDE for R - web-based version"
    port: 8787

readme: |-
  ----------------------------------
  ## rstudio/{{ context.version }} ##
  RStudio is an integrated development environment (IDE) for R. It includes a console, syntax-highlighting editor that supports direct code execution, as well as tools for plotting, history, debugging and workspace management.

  This container includes both RStudio Desktop (GUI) and RStudio Server (web-based).

  Example:
  ```
  rstudio          # Launch desktop version
  Rscript          # Run R scripts
  ```

  RStudio Server is also available as a web application in Neurodesktop.

  More documentation can be found here: https://www.rstudio.com/

  ----------------------------------

files:
  - name: cran_ubuntu_key
    url: "https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc"

  - name: rstudio_2023_12_1_402_amd64_deb
    url: "https://download1.rstudio.org/electron/jammy/amd64/rstudio-{{ context.upstream_tag[1:] | replace('+', '-') }}-amd64.deb"

  - name: rstudio_server_2023_12_1_402_amd64_deb
    url: "https://download2.rstudio.org/server/jammy/amd64/rstudio-server-{{ context.upstream_tag[1:] | replace('+', '-') }}-amd64.deb"
  - name: rstudio-server-start
    contents: |
      #!/bin/bash
      # RStudio Server startup script for containerized single-user mode
      # Works in both root and non-root contexts (e.g., Singularity/Apptainer)

      # Ensure USER is set - transparent-singularity runs with --cleanenv which
      # strips environment variables. RStudio's auth-none handler needs USER to
      # determine which user to auto-authenticate as.
      export USER=${USER:-$(whoami)}

      # Use /tmp for all runtime directories to avoid permission issues
      # when running in containers without root access, and to avoid
      # EOVERFLOW errors on CVMFS (large inode numbers cause issues with
      # RStudio's SQLite database when stored on CVMFS filesystem)
      DATA_DIR="/tmp/rstudio-server-data"
      PID_FILE="/tmp/rstudio-server.pid"
      DB_CONF="/tmp/rstudio-db.conf"

      mkdir -p "$DATA_DIR" 

      # Create database config to store SQLite database in /tmp
      # This avoids EOVERFLOW errors when running from CVMFS
      cat > "$DB_CONF" << EOF
      provider=sqlite
      directory=$DATA_DIR
      EOF

      # Start RStudio Server in foreground mode with temp directories
      # Use current user since default 'rstudio-server' user doesn't exist in container
      # Note: --auth-none=1 must be on command line (not just config file) to work
      # reliably when running through Singularity with --cleanenv
      exec /usr/lib/rstudio-server/bin/rserver \
          --www-port="${NEURODESK_WEBAPP_PORT:-8787}" \
          --server-daemonize=0 \
          --server-user="$(whoami)" \
          --server-data-dir="$DATA_DIR" \
          --server-pid-file="$PID_FILE" \
          --database-config-file="$DB_CONF" \
          --auth-none=1

  - name: dependencies.R
    contents: |-
      # Install every package from the pinned CRAN snapshot. The user agent
      # names the R version so Posit Package Manager serves Linux binaries.
      options(
        repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/jammy/{{ context.cran_snapshot }}"),
        HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(),
          paste(getRversion(), R.version$platform, R.version$arch, R.version$os)),
        timeout = 1800,
        Ncpus = max(1L, parallel::detectCores() - 1L)
      )
      cran <- c("remotes", "devtools", "ProbBayes", "bayesplot", "brms", "rstan",
        "Rcpp", "reticulate", "fastICA", "forge", "rmarkdown", "plotly", "shiny",
        "tidyverse", "RColorBrewer", "paletteer", "ggpubr", "ggthemes", "RcppCNPy",
        "R.matlab", "car")
      install.packages(cran)
      install.packages(c("caret", "BayesFactor"), dependencies = TRUE)
      github <- c(
        MRIcrotome = "Mouse-Imaging-Centre/MRIcrotome@{{ context.mricrotome_commit }}",
        RMINC = "Mouse-Imaging-Centre/RMINC@{{ context.rminc_commit }}"
      )
      # rbokeh is not installed: upstream archived it, and its pryr dependency
      # left CRAN in 2026 and no longer compiles against R 4.6.
      for (repo in github) remotes::install_github(repo, upgrade = "never")
      # install.packages() only warns when a package fails, so check explicitly.
      wanted <- c(cran, "caret", "BayesFactor", names(github))
      missing <- wanted[!vapply(wanted, requireNamespace, logical(1), quietly = TRUE)]
      if (length(missing)) stop("R packages failed to install: ", paste(missing, collapse = ", "))

domains:
  - neuroimaging
categories:
  - "statistics"
icon: data:image/png;base64,

gui_apps:
  - name: "rstudioGUI"
    exec: "rstudio"
