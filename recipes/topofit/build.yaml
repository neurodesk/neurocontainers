name: topofit
version: "0.4.0"

copyright:
  - license: GPL-3.0-only
    url: https://github.com/simnibs/brainnet/blob/v{{ context.brainnet_version }}/LICENSE
  - license: GPL-3.0-only
    url: https://github.com/simnibs/brainsynth/blob/v{{ context.brainsynth_version }}/LICENSE
  - license: GPL-3.0-only
    url: https://github.com/simnibs/cortech/blob/v{{ context.cortech_version }}/LICENSE

architectures:
  - x86_64

variables:
  brainnet_version: "0.2"
  brainsynth_version: "0.1"
  cortech_version: "0.1"
  brainnet_wheel_url: "https://github.com/simnibs/brainnet/releases/download/v{{ context.brainnet_version }}/brainnet-{{ context.brainnet_version }}-py3-none-any.whl"
  brainsynth_wheel_url: "https://github.com/simnibs/brainsynth/releases/download/v{{ context.brainsynth_version }}/brainsynth-{{ context.brainsynth_version }}-py3-none-any.whl"
  cortech_wheel_url: "https://github.com/simnibs/cortech/releases/download/v{{ context.cortech_version }}/cortech-{{ context.cortech_version }}-cp311-cp311-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl"

build:
  kind: neurodocker
  base-image: pytorch/pytorch:2.6.0-cuda11.8-cudnn9-runtime
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        NVIDIA_DISABLE_REQUIRE: "true"
        TOPOFIT_OPENRECON_WORKSPACE: /tmp/share/topofit

    - install:
        - bzip2
        - ca-certificates
        - git
        - python3
        - python3-pip

    - include: macros/openrecon/neurodocker.yaml

    - run:
        - python3 -m pip install --no-cache-dir "numpy==2.1.3" "scipy==1.15.1" "nibabel==5.3.2" "numba==0.61.0" "pytorch-ignite==0.5.2" "tqdm==4.67.1"
        - python3 -m pip install --no-cache-dir --no-deps {{ get_file("cortech_wheel") }} {{ get_file("brainsynth_wheel") }} {{ get_file("brainnet_wheel") }}
        - python3 -c "import brainnet, brainsynth, cortech, torch; print('BrainNet imports with torch', torch.__version__)"
        - python3 -c "from importlib.resources import files; assert files('brainnet').joinpath('resources/models/topofit/t1w_1mm_state.pt').is_file()"

    - run:
        - install -m 0644 {{ get_file("topofit_core.py") }} /opt/code/python-ismrmrd-server/topofit_core.py
        - install -m 0644 {{ get_file("topofit_geometry.py") }} /opt/code/python-ismrmrd-server/topofit_geometry.py
        - install -m 0755 {{ get_file("topofit.py") }} /opt/code/python-ismrmrd-server/topofit.py
        - install -m 0755 {{ get_file("topofit-openrecon") }} /usr/local/bin/topofit-openrecon
        - install -m 0644 {{ get_file("test_topofit_core.py") }} /opt/code/python-ismrmrd-server/test_topofit_core.py
        - install -m 0644 {{ get_file("test_topofit_geometry.py") }} /opt/code/python-ismrmrd-server/test_topofit_geometry.py
        - install -m 0644 {{ get_file("test_topofit_openrecon.py") }} /opt/code/python-ismrmrd-server/test_topofit_openrecon.py
        - install -m 0644 {{ get_file("OpenReconLabel.json") }} /opt/code/python-ismrmrd-server/OpenReconLabel.json
        - install -m 0644 {{ get_file("OpenReconREADME.md") }} /opt/code/python-ismrmrd-server/OpenReconREADME.md
        - mkdir -p /tmp/share/topofit
        - chmod 1777 /tmp/share /tmp/share/topofit

    - workdir: /opt

deploy:
  bins:
    - brainnet
    - topofit-openrecon

categories:
  - structural imaging
  - shape analysis
  - machine learning

files:
  - name: brainnet_wheel
    url: "{{ context.brainnet_wheel_url }}"
  - name: brainsynth_wheel
    url: "{{ context.brainsynth_wheel_url }}"
  - name: cortech_wheel
    url: "{{ context.cortech_wheel_url }}"
  - name: topofit_core.py
    filename: topofit_core.py
  - name: topofit_geometry.py
    filename: topofit_geometry.py
  - name: topofit.py
    filename: topofit.py
  - name: topofit-openrecon
    filename: topofit-openrecon
  - name: test_topofit_core.py
    filename: test_topofit_core.py
  - name: test_topofit_geometry.py
    filename: test_topofit_geometry.py
  - name: test_topofit_openrecon.py
    filename: test_topofit_openrecon.py
  - name: OpenReconLabel.json
    filename: OpenReconLabel.json
  - name: OpenReconREADME.md
    filename: OpenReconREADME.md

readme: |-
  ----------------------------------
  ## topofit/{{ context.version }} ##

  This container packages BrainNet TopoFit {{ context.brainnet_version }} for fast
  cortical surface reconstruction. It predicts bilateral white and pial
  surfaces plus spherical registration without running a full FreeSurfer
  `recon-all` workflow.

  Run it on a NIfTI MPRAGE:
  ```bash
  topofit-openrecon mprage.nii.gz output --device cuda
  ```

  The output directory contains FreeSurfer geometry files, a source-grid QC
  overlay, and a JSON manifest. The same workflow is available through the
  included OpenRecon image-to-image adapter for inline scanner testing.

  Add `--find-flat-patches` to find one planar pial candidate per hemisphere,
  draw its patch and outward normal, and record the geometry in the manifest.
  Add `--find-sulcal-middepth` to classify concave pial regions by mean
  curvature and write the intersecting middle-cortical-depth voxels as a
  source-grid label image.
  `--overlay-thickness 0` produces the thinnest projected surface trace.

  The OpenRecon output is research-only. It does not emit actionable slice
  prescription coordinates and is marked as not motion-cleared.

  More information: https://github.com/simnibs/brainnet

  To run applications outside this container: ml topofit/{{ context.version }}

