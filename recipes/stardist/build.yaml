name: stardist
version: 0.9.2

description: Star-convex polygon and polyhedron nuclear and cellular instance segmentation (CPU TensorFlow/Keras backend, code-only without baked pretrained weights) for histopathology and fluorescence dermatology microscopy.

copyright:
  - license: BSD-3-Clause
    name: StarDist license
    url: https://github.com/stardist/stardist/blob/{{ context.upstream_version }}/LICENSE.txt
  - license: Apache-2.0
    name: TensorFlow license
    url: https://github.com/tensorflow/tensorflow/blob/v{{ context.tensorflow_version }}/LICENSE
  - license: Apache-2.0
    name: FlatBuffers license
    url: https://github.com/google/flatbuffers/blob/v{{ context.flatbuffers_version }}/LICENSE
  - license: BSD-2-Clause
    name: libaec license (bundled in h5py)
    url: https://github.com/Deutsches-Klimarechenzentrum/libaec/blob/v1.1.3/LICENSE.txt

architectures:
  - x86_64

variables:
  upstream_version: "0.9.2"
  tensorflow_version: "2.21.0"
  flatbuffers_version: "25.12.19"
  # Pinned to tensorflow-cpu 2.21.0's h5py<3.15.0,>=3.11.0 ceiling (bundles libaec v1.1.3).
  h5py_version: "3.14.0"

auto_update:
  method: sources
  container_version: stardist
  sources:
    - id: stardist
      method: pypi
      package: stardist
      target:
        variable: upstream_version
        fulltest_variable: upstream_version
    - id: tensorflow_cpu
      method: pypi
      package: tensorflow-cpu
      dependency: true
      target:
        variable: tensorflow_version
    - id: flatbuffers
      method: pypi
      package: flatbuffers
      dependency: true
      target:
        variable: flatbuffers_version
    - id: h5py
      method: pypi
      package: h5py
      version_regex: '^(?P<version>3\.1[1-4]\.[0-9]+)$'
      dependency: true
      target:
        variable: h5py_version

build:
  kind: neurodocker

  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        MPLBACKEND: Agg
        PIP_NO_CACHE_DIR: "1"
        TF_CPP_MIN_LOG_LEVEL: "2"
        CUDA_VISIBLE_DEVICES: ""
        PATH: /opt/stardist/wrappers:/opt/stardist/bin:$PATH

    - install:
        - ca-certificates
        - libgfortran5
        - libgomp1
        - libquadmath0
        - patchelf
        - python3
        - python3-pip
        - python3-venv

    - run:
        # Install CPU-only TensorFlow + StarDist in an isolated venv (numba >=0.68
        # requires NumPy 2.x, newer than Ubuntu 24.04's NumPy 1.26 APT stack) and
        # relink any bundled GNU runtime libs against Ubuntu system libraries.
        - python3 -m venv /opt/stardist
        - >-
          /opt/stardist/bin/python -m pip install --no-cache-dir
          "tensorflow-cpu=={{ context.tensorflow_version }}"
          "flatbuffers=={{ context.flatbuffers_version }}"
          "h5py=={{ context.h5py_version }}"
          "stardist=={{ context.upstream_version }}"
        - /opt/stardist/bin/python -m pip check
        # Relink any bundled GNU runtime libs against Ubuntu system libraries.
        - >-
          for f in $(find /opt/stardist/lib/python*/site-packages -name '*.so*' 2>/dev/null); do
          for need in $(patchelf --print-needed "$f" 2>/dev/null | grep -E '^lib(gomp|gfortran|quadmath)-' || true); do
          case "$need" in
          libgomp-*) target=libgomp.so.1 ;;
          libgfortran-*) target=libgfortran.so.5 ;;
          libquadmath-*) target=libquadmath.so.0 ;;
          *) continue ;;
          esac;
          patchelf --replace-needed "$need" "$target" "$f";
          done;
          done
          && find /opt/stardist/lib/python*/site-packages -type f \( -name 'libgomp*.so*' -o -name 'libgfortran*.so*' -o -name 'libquadmath*.so*' \) -delete
        - /opt/stardist/bin/python {{ get_file("install_runtime_hook") }}
        - >-
          /opt/stardist/bin/python -c "import importlib.metadata as md, pathlib, csbdeep, numpy, scipy, skimage, stardist, tensorflow;
          assert md.version('stardist') == '{{ context.upstream_version }}', md.version('stardist');
          bad_libs = [str(p) for p in pathlib.Path('/opt/stardist').rglob('*.so*') if p.name.startswith(('libquadmath', 'libgfortran', 'libgomp'))];
          assert not bad_libs, bad_libs;
          bad_pkgs = [d.metadata.get('Name', '') for d in md.distributions() if (d.metadata.get('Name') or '').lower().startswith(('nvidia-', 'cuda-'))];
          assert not bad_pkgs, bad_pkgs"
        - mkdir -p /opt/stardist/wrappers /opt/stardist/share/licenses
        - install -m 0755 {{ get_file("stardist_launcher") }} /opt/stardist/wrappers/_stardist_launcher.py
        - >-
          for cmd in stardist-predict2d stardist-predict3d; do
          test -x "/opt/stardist/bin/$cmd";
          ln -sf _stardist_launcher.py "/opt/stardist/wrappers/$cmd";
          done
        - install -m 0644 {{ get_file("stardist_license") }} /opt/stardist/share/licenses/STARDIST-LICENSE.txt
        - install -m 0644 {{ get_file("tensorflow_license") }} /opt/stardist/share/licenses/TENSORFLOW-LICENSE.txt
        - install -m 0644 {{ get_file("flatbuffers_license") }} /opt/stardist/share/licenses/FLATBUFFERS-LICENSE.txt
        - install -m 0644 {{ get_file("libaec_license") }} /opt/stardist/share/licenses/LIBAEC-LICENSE.txt
        - printf '%s\n' '#!/usr/bin/env bash' 'set -e' 'if [ -z "${USER:-}" ]; then export USER="$(whoami 2>/dev/null || echo "uid$(id -u)")"; fi' 'if [ -n "${1:-}" ]; then exec "$@"; else exec /usr/bin/env bash; fi' > /neurodocker/startup.sh && chmod 0755 /neurodocker/startup.sh
        - chmod -R a+rX /opt/stardist
        - rm -rf /root/.cache/pip

files:
  - name: stardist_license
    url: https://raw.githubusercontent.com/stardist/stardist/{{ context.upstream_version }}/LICENSE.txt
  - name: tensorflow_license
    url: https://raw.githubusercontent.com/tensorflow/tensorflow/v{{ context.tensorflow_version }}/LICENSE
  - name: flatbuffers_license
    url: https://raw.githubusercontent.com/google/flatbuffers/v{{ context.flatbuffers_version }}/LICENSE
  - name: libaec_license
    url: https://raw.githubusercontent.com/Deutsches-Klimarechenzentrum/libaec/v1.1.3/LICENSE.txt
  - name: install_runtime_hook
    contents: |
      from __future__ import annotations

      import pathlib
      import textwrap

      matches = sorted(pathlib.Path("/opt/stardist/lib").glob("python*/site-packages"))
      assert len(matches) == 1, matches
      site_packages = matches[0]
      (site_packages / "_stardist_runtime.py").write_text(
          textwrap.dedent(
              '''\
              """Container runtime defaults for StarDist/Keras/Numba caches, PID 1 signals, and unlisted UIDs."""

              from __future__ import annotations

              import atexit
              import errno
              import getpass
              import os
              import shutil
              import signal
              import tempfile
              from pathlib import Path

              _CACHE_ROOT: Path | None = None
              _CACHE_OWNER_PID: int | None = None
              _CLEANUP_REGISTERED = False


              def is_writable_dir(path_str: str | None) -> bool:
                  if not path_str:
                      return False
                  blocked = {signal.SIGINT, signal.SIGTERM, signal.SIGHUP}
                  prev_mask = signal.pthread_sigmask(signal.SIG_BLOCK, blocked)
                  try:
                      os.makedirs(path_str, exist_ok=True)
                      if hasattr(os, "O_TMPFILE"):
                          try:
                              fd = os.open(path_str, os.O_TMPFILE | os.O_RDWR, 0o600)
                              os.close(fd)
                              return True
                          except OSError as exc:
                              if exc.errno not in (errno.EOPNOTSUPP, errno.EISDIR, errno.EINVAL, errno.ENOSYS):
                                  return False
                      fd, probe = tempfile.mkstemp(prefix=".stardist-write-check-", dir=path_str)
                      try:
                          os.close(fd)
                      finally:
                          os.unlink(probe)
                      return True
                  except OSError:
                      return False
                  finally:
                      signal.pthread_sigmask(signal.SIG_SETMASK, prev_mask)


              def _cleanup_cache() -> None:
                  if _CACHE_ROOT is not None and _CACHE_OWNER_PID == os.getpid():
                      shutil.rmtree(_CACHE_ROOT, ignore_errors=True)


              def _signal_cleanup(signum: int, _frame: object) -> None:
                  _cleanup_cache()
                  if os.getpid() == 1:
                      os._exit(128 + signum)
                  signal.signal(signum, signal.SIG_DFL)
                  os.kill(os.getpid(), signum)


              def _install_signal_handlers() -> None:
                  try:
                      for sig in (signal.SIGTERM, signal.SIGHUP):
                          if signal.getsignal(sig) == signal.SIG_DFL:
                              signal.signal(sig, _signal_cleanup)
                  except ValueError:
                      pass


              def _private_subdir(sub: str) -> Path:
                  global _CACHE_ROOT, _CACHE_OWNER_PID, _CLEANUP_REGISTERED
                  if _CACHE_ROOT is None or _CACHE_OWNER_PID != os.getpid():
                      blocked = {signal.SIGINT, signal.SIGTERM, signal.SIGHUP}
                      prev_mask = signal.pthread_sigmask(signal.SIG_BLOCK, blocked)
                      try:
                          _CACHE_ROOT = Path(tempfile.mkdtemp(prefix="stardist-cache."))
                          _CACHE_OWNER_PID = os.getpid()
                          if not _CLEANUP_REGISTERED:
                              atexit.register(_cleanup_cache)
                              _CLEANUP_REGISTERED = True
                          _install_signal_handlers()
                      finally:
                          signal.pthread_sigmask(signal.SIG_SETMASK, prev_mask)
                  subdir = _CACHE_ROOT / sub
                  subdir.mkdir(mode=0o700, exist_ok=True)
                  return subdir


              def ensure_runtime_env() -> None:
                  try:
                      getpass.getuser()
                  except Exception:
                      os.environ["USER"] = f"uid{os.getuid()}"

                  for key, sub in (
                      ("KERAS_HOME", "keras"),
                      ("NUMBA_CACHE_DIR", "numba"),
                      ("MPLCONFIGDIR", "mpl"),
                      ("XDG_CACHE_HOME", "cache"),
                      ("XDG_CONFIG_HOME", "config"),
                  ):
                      if not is_writable_dir(os.environ.get(key)):
                          os.environ[key] = str(_private_subdir(sub))

                  if not os.environ.get("HOME"):
                      os.environ["HOME"] = str(_private_subdir("home"))

                  if os.getpid() == 1:
                      _install_signal_handlers()
              '''
          ),
          encoding="utf-8",
      )
      (site_packages / "zzz_stardist_runtime.pth").write_text(
          "import _stardist_runtime; _stardist_runtime.ensure_runtime_env()\n",
          encoding="utf-8",
      )
  - name: stardist_launcher
    contents: |
      #!/usr/bin/python3
      from __future__ import annotations

      import errno
      import getpass
      import os
      import shutil
      import signal
      import subprocess
      import sys
      import tempfile

      ALLOWED_BINS = {
          "stardist-predict2d",
          "stardist-predict3d",
      }
      ENV_SUBDIRS = (
          ("KERAS_HOME", "keras"),
          ("NUMBA_CACHE_DIR", "numba"),
          ("MPLCONFIGDIR", "mpl"),
          ("XDG_CACHE_HOME", "cache"),
          ("XDG_CONFIG_HOME", "config"),
      )


      def _is_writable_dir(path_str: str | None) -> bool:
          if not path_str:
              return False
          blocked = {signal.SIGINT, signal.SIGTERM, signal.SIGHUP}
          prev_mask = signal.pthread_sigmask(signal.SIG_BLOCK, blocked)
          try:
              os.makedirs(path_str, exist_ok=True)
              if hasattr(os, "O_TMPFILE"):
                  try:
                      fd = os.open(path_str, os.O_TMPFILE | os.O_RDWR, 0o600)
                      os.close(fd)
                      return True
                  except OSError as exc:
                      if exc.errno not in (errno.EOPNOTSUPP, errno.EISDIR, errno.EINVAL, errno.ENOSYS):
                          return False
              fd, probe = tempfile.mkstemp(prefix=".stardist-write-check-", dir=path_str)
              try:
                  os.close(fd)
              finally:
                  os.unlink(probe)
              return True
          except OSError:
              return False
          finally:
              signal.pthread_sigmask(signal.SIG_SETMASK, prev_mask)


      def main() -> int:
          prog = os.path.basename(sys.argv[0])
          if prog not in ALLOWED_BINS:
              prog = "stardist-predict2d"
          cmd = [f"/opt/stardist/bin/{prog}", *sys.argv[1:]]
          env = os.environ.copy()
          try:
              getpass.getuser()
          except Exception:
              env["USER"] = f"uid{os.getuid()}"

          tmp_root: str | None = None
          proc: subprocess.Popen[bytes] | None = None
          received_signal: int | None = None
          pending_signal: int | None = None
          pending_tstp = False
          tty_fd: int | None = None
          orig_pgrp: int | None = None
          handed_tty = False

          def set_tty_pgrp(pgrp: int) -> bool:
              if tty_fd is None:
                  return False
              prev = signal.signal(signal.SIGTTOU, signal.SIG_IGN)
              try:
                  os.tcsetpgrp(tty_fd, pgrp)
                  return True
              except OSError:
                  return False
              finally:
                  signal.signal(signal.SIGTTOU, prev)

          def owns_tty() -> bool:
              if tty_fd is None or orig_pgrp is None:
                  return False
              try:
                  return os.tcgetpgrp(tty_fd) == orig_pgrp
              except OSError:
                  return False

          def child_owns_tty() -> bool:
              if tty_fd is None or proc is None:
                  return False
              try:
                  return os.tcgetpgrp(tty_fd) == proc.pid
              except OSError:
                  return False

          def hand_tty_to_child() -> None:
              nonlocal handed_tty
              if proc is None or tty_fd is None or not owns_tty():
                  return
              if set_tty_pgrp(proc.pid):
                  handed_tty = True

          def reclaim_tty() -> None:
              nonlocal handed_tty
              if handed_tty and tty_fd is not None and orig_pgrp is not None:
                  if child_owns_tty():
                      set_tty_pgrp(orig_pgrp)
                  handed_tty = False

          def forward(signum: int) -> None:
              if proc is not None and proc.returncode is None:
                  try:
                      os.killpg(proc.pid, signum)
                      if signum in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP):
                          os.killpg(proc.pid, signal.SIGCONT)
                  except ProcessLookupError:
                      pass

          def handle_signal(signum: int, _frame: object) -> None:
              nonlocal received_signal, pending_signal
              received_signal = signum
              if proc is None:
                  pending_signal = signum
              else:
                  forward(signum)

          def handle_cont(_signum: int, _frame: object) -> None:
              if proc is not None and proc.returncode is None and received_signal is None:
                  hand_tty_to_child()

          def handle_tstp(_signum: int, _frame: object) -> None:
              nonlocal pending_tstp
              if proc is None:
                  pending_tstp = True
              elif proc.returncode is None:
                  try:
                      os.killpg(proc.pid, signal.SIGTSTP)
                  except ProcessLookupError:
                      pass

          def stop_self(stop_sig: int) -> None:
              prev_tstp = signal.signal(signal.SIGTSTP, signal.SIG_DFL)
              try:
                  os.kill(os.getpid(), stop_sig)
              finally:
                  signal.signal(signal.SIGTSTP, prev_tstp)

          try:
              for sig in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP):
                  if signal.getsignal(sig) != signal.SIG_IGN:
                      signal.signal(sig, handle_signal)
              signal.signal(signal.SIGCONT, handle_cont)
              signal.signal(signal.SIGTSTP, handle_tstp)
              if received_signal is not None:
                  return 128 + received_signal

              missing = [item for item in ENV_SUBDIRS if not _is_writable_dir(env.get(item[0]))]
              if not env.get("HOME"):
                  missing.append(("HOME", "home"))
              if received_signal is not None:
                  return 128 + received_signal
              if not missing:
                  os.execve(cmd[0], cmd, env)

              tmp_root = tempfile.mkdtemp(prefix="stardist.")
              for key, subdir in missing:
                  path = os.path.join(tmp_root, subdir)
                  os.mkdir(path, 0o700)
                  env[key] = path
              if received_signal is not None:
                  return 128 + received_signal

              try:
                  tty_fd = os.open("/dev/tty", os.O_RDWR | os.O_NOCTTY | os.O_CLOEXEC)
                  os.tcgetpgrp(tty_fd)
                  orig_pgrp = os.getpgrp()
              except OSError:
                  if tty_fd is not None:
                      try:
                          os.close(tty_fd)
                      except OSError:
                          pass
                  tty_fd = None

              proc = subprocess.Popen(cmd, env=env, process_group=0)
              if received_signal is None and owns_tty():
                  hand_tty_to_child()
                  if handed_tty:
                      try:
                          os.killpg(proc.pid, signal.SIGCONT)
                      except ProcessLookupError:
                          pass

              sig_to_replay, pending_signal = pending_signal, None
              if sig_to_replay is not None:
                  forward(sig_to_replay)
              elif pending_tstp:
                  pending_tstp = False
                  try:
                      os.killpg(proc.pid, signal.SIGTSTP)
                  except ProcessLookupError:
                      pass

              rc = 0
              while True:
                  try:
                      _, status = os.waitpid(proc.pid, os.WUNTRACED)
                  except InterruptedError:
                      continue
                  except ChildProcessError:
                      break
                  if os.WIFSTOPPED(status):
                      stop_sig = os.WSTOPSIG(status)
                      if received_signal is not None:
                          try:
                              os.killpg(proc.pid, signal.SIGCONT)
                          except ProcessLookupError:
                              pass
                          continue
                      if stop_sig in (signal.SIGTTIN, signal.SIGTTOU) and (
                          owns_tty() or child_owns_tty()
                      ):
                          hand_tty_to_child()
                          try:
                              os.killpg(proc.pid, signal.SIGCONT)
                          except ProcessLookupError:
                              pass
                          continue
                      reclaim_tty()
                      stop_self(stop_sig)
                      if received_signal is not None:
                          try:
                              os.killpg(proc.pid, signal.SIGCONT)
                          except ProcessLookupError:
                              pass
                          continue
                      hand_tty_to_child()
                      try:
                          os.killpg(proc.pid, signal.SIGCONT)
                      except ProcessLookupError:
                          pass
                      continue
                  if os.WIFSIGNALED(status):
                      rc = -os.WTERMSIG(status)
                  elif os.WIFEXITED(status):
                      rc = os.WEXITSTATUS(status)
                  else:
                      continue
                  proc.returncode = rc
                  break
              if received_signal is not None:
                  return 128 + received_signal
              return 128 - rc if rc < 0 else rc
          finally:
              reclaim_tty()
              if tty_fd is not None:
                  try:
                      os.close(tty_fd)
                  except OSError:
                      pass
              if tmp_root is not None:
                  shutil.rmtree(tmp_root, ignore_errors=True)


      if __name__ == "__main__":
          raise SystemExit(main())

deploy:
  bins:
    - stardist-predict2d
    - stardist-predict3d

domains:
  - microscopy
  - dermatology

categories:
  - "digital pathology"
  - "image segmentation"
  - "machine learning"
  - "optical imaging"

readme: |-
  ----------------------------------
  ## stardist/{{ context.version }} ##

  StarDist (CPU-only TensorFlow/Keras build, code-only without baked pretrained
  weights) performs star-convex polygon (2D) and polyhedron (3D) instance
  segmentation of nuclei and cells in H&E histopathology and fluorescence
  dermatology microscopy.

  ### Included CLI & Python Environment
  ```
  stardist-predict2d      Run 2D StarDist prediction on an input image
  stardist-predict3d      Run 3D StarDist prediction on an input volume
  /opt/stardist/bin/python  Python environment with stardist {{ context.upstream_version }} and TensorFlow CPU
  ```

  ### Example
  ```
  ml stardist/{{ context.version }}
  stardist-predict2d --help
  /opt/stardist/bin/python -c "import stardist; print(stardist.__version__)"
  ```

  Documentation: https://github.com/stardist/stardist
  License texts (`STARDIST-LICENSE.txt`, `TENSORFLOW-LICENSE.txt`,
  `FLATBUFFERS-LICENSE.txt`, `LIBAEC-LICENSE.txt`) are installed under
  `/opt/stardist/share/licenses/`.
  ----------------------------------

