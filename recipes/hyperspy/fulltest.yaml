name: hyperspy
version: "2.6.0"
upstream_version: "2.6.0"
rosettasciio_version: "0.16.0"

tests:
  - name: hyperspy-info wrapper available on PATH
    description: Verify the deployed hyperspy-info wrapper resolves on PATH.
    command: command -v hyperspy-info
    expected_output_contains: "/opt/hyperspy/wrappers/hyperspy-info"

  - name: package versions match recipe, system APT libs used, and zero bundled GNU/MPL libs
    description: Verify hyperspy and rosettasciio versions match, pip check passes, numpy/scipy/h5py/matplotlib/skimage come from Ubuntu APT, and zero bundled libquadmath/libgfortran/libgomp/libzmq exist under /opt/hyperspy.
    command: |
      set -e
      /opt/hyperspy/bin/python -m pip check
      /opt/hyperspy/bin/python - <<'PY'
      import importlib.metadata as md
      import pathlib
      import h5py
      import hyperspy
      import matplotlib
      import numpy
      import rsciio
      import scipy
      import skimage

      assert md.version("hyperspy") == "${upstream_version}", md.version("hyperspy")
      assert md.version("rosettasciio") == "${rosettasciio_version}", md.version("rosettasciio")
      for mod in (numpy, scipy, h5py, matplotlib, skimage):
          assert mod.__file__.startswith("/usr/lib/python3/dist-packages/"), mod.__file__
      bad_libs = [
          str(p)
          for p in pathlib.Path("/opt/hyperspy").rglob("*.so*")
          if p.name.startswith(("libquadmath", "libgfortran", "libgomp", "libzmq"))
      ]
      assert not bad_libs, bad_libs
      print(f"hyperspy={md.version('hyperspy')} rosettasciio={md.version('rosettasciio')}")
      PY
    expected_output_contains: "hyperspy=${upstream_version}"

  - name: GPL-3.0-or-later license notices and RosettaSciIO corresponding source installed
    description: Verify HyperSpy and RosettaSciIO GPL-3.0-or-later license files and matching RosettaSciIO source archive are installed.
    command: |
      set -e
      test -s /opt/hyperspy/share/licenses/HYPERSPY-COPYING.txt
      grep -q "GNU GENERAL PUBLIC LICENSE" /opt/hyperspy/share/licenses/HYPERSPY-COPYING.txt
      test -s /opt/hyperspy/share/licenses/ROSETTASCIIO-COPYING.txt
      test -s /opt/hyperspy/share/licenses/GPL-3.0.txt
      test -s /opt/hyperspy/share/licenses/GPL-SOURCE-NOTICE.txt
      test -s /opt/hyperspy/share/src/rosettasciio-${rosettasciio_version}.tar.gz
      echo "license ok"
    expected_output_contains: "license ok"

  - name: wrapper isolates process-group signals, cleans up on SIGHUP, and preserves piped and PTY stdin
    description: Verify the installed hyperspy-info wrapper handles SIGINT/SIGHUP cleanup, noexec /tmp, and foreground PTY stdin cleanly.
    command: |
      set -e
      /usr/bin/python3 - <<'PY'
      import fcntl, os, pty, select, signal, subprocess, sys, tempfile, termios, time

      src = open("/opt/hyperspy/wrappers/hyperspy-info").read()
      py = sys.executable

      def make_wrapper(path, stub_path):
          patched = src.replace(
              'cmd = ["/opt/hyperspy/bin/hyperspy-info", *sys.argv[1:]]',
              f'cmd = [{py!r}, {stub_path!r}, *sys.argv[1:]]',
          )
          assert patched != src
          open(path, "w").write(patched)

      def run_in_pty(argv, env, on_ready=None, send_bytes=None):
          master, slave = pty.openpty()
          def preexec():
              os.setsid()
              fcntl.ioctl(slave, termios.TIOCSCTTY, 0)
          p = subprocess.Popen(argv, env=env, stdin=slave, stdout=slave, stderr=slave, preexec_fn=preexec, close_fds=True)
          os.close(slave)
          if on_ready:
              on_ready()
          if send_bytes:
              os.write(master, send_bytes)
          out = bytearray()
          deadline = time.time() + 6.0
          while time.time() < deadline:
              r, _, _ = select.select([master], [], [], 0.1)
              if r:
                  try:
                      chunk = os.read(master, 4096)
                      if not chunk:
                          break
                      out += chunk
                  except OSError:
                      break
              if p.poll() is not None and not r:
                  break
          rc = p.wait(timeout=5)
          os.close(master)
          return rc, out.decode("utf-8", "replace")

      with tempfile.TemporaryDirectory() as td:
          stub = os.path.join(td, "stub.py")
          open(stub, "w").write(
              "import os, signal, sys, time\n"
              "if sys.argv[1] == 'stdin':\n"
              "    print('GOT:' + sys.stdin.readline().strip(), flush=True)\n"
              "    raise SystemExit(0)\n"
              "log, ready = sys.argv[2], sys.argv[3]\n"
              "seen = []\n"
              "def h(sig, _):\n"
              "    seen.append(sig)\n"
              "    open(log, 'a').write(f'{sig}\\n')\n"
              "signal.signal(signal.SIGINT, h)\n"
              "signal.signal(signal.SIGHUP, h)\n"
              "open(ready, 'w').write(os.environ.get('XDG_CACHE_HOME', '') + '\\n')\n"
              "deadline = time.time() + 5.0\n"
              "while not seen and time.time() < deadline:\n"
              "    time.sleep(0.02)\n"
              "time.sleep(0.25)\n"
              "raise SystemExit(128 + seen[0] if seen else 0)\n"
          )
          wrapper = os.path.join(td, "wrapper.py")
          make_wrapper(wrapper, stub)

          env = os.environ.copy()
          for k in ("MPLCONFIGDIR", "XDG_CACHE_HOME", "XDG_CONFIG_HOME"):
              env.pop(k, None)

          r = subprocess.run([py, wrapper, "stdin"], input="hyperspy-pipe\n", capture_output=True, text=True, env=env, timeout=10)
          assert r.returncode == 0 and r.stdout.strip() == "GOT:hyperspy-pipe", (r.returncode, r.stdout, r.stderr)

          rc, out = run_in_pty([py, wrapper, "stdin"], env=env, send_bytes=b"hyperspy-pty\n")
          assert rc == 0 and "GOT:hyperspy-pty" in out, (rc, out)

          log_hup, ready_hup = os.path.join(td, "hup.log"), os.path.join(td, "hup.ready")
          p_hup = subprocess.Popen([py, wrapper, "sig", log_hup, ready_hup], env=env, start_new_session=True)
          dl = time.time() + 5.0
          while not os.path.exists(ready_hup) and time.time() < dl:
              time.sleep(0.02)
          assert os.path.exists(ready_hup), "hup stub did not become ready"
          scratch_dir = open(ready_hup).read().strip()
          assert scratch_dir and os.path.isdir(scratch_dir), scratch_dir
          os.kill(p_hup.pid, signal.SIGHUP)
          rc_hup = p_hup.wait(timeout=10)
          sigs_hup = [int(x) for x in open(log_hup).read().splitlines() if x.strip()]
          assert rc_hup == 128 + signal.SIGHUP.value and sigs_hup == [signal.SIGHUP.value], (rc_hup, sigs_hup)
          assert not os.path.exists(os.path.dirname(scratch_dir)), scratch_dir

          stub_nohup = os.path.join(td, "stub_nohup.py")
          open(stub_nohup, "w").write(
              "import os, signal, sys, time\n"
              "ready, go = sys.argv[1], sys.argv[2]\n"
              "assert signal.getsignal(signal.SIGHUP) == signal.SIG_IGN, signal.getsignal(signal.SIGHUP)\n"
              "open(ready, 'w').write('ready\\n')\n"
              "dl = time.time() + 5.0\n"
              "while not os.path.exists(go) and time.time() < dl:\n"
              "    time.sleep(0.02)\n"
              "assert os.path.exists(go), 'go file not seen'\n"
          )
          wrapper_nohup = os.path.join(td, "wrapper_nohup.py")
          make_wrapper(wrapper_nohup, stub_nohup)
          ready_nh, go_nh = os.path.join(td, "nh.ready"), os.path.join(td, "nh.go")
          p_nh = subprocess.Popen(["nohup", py, wrapper_nohup, ready_nh, go_nh], env=env, start_new_session=True, stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          dl = time.time() + 5.0
          while not os.path.exists(ready_nh) and time.time() < dl:
              time.sleep(0.02)
          assert os.path.exists(ready_nh), f"nohup stub not ready: {p_nh.stderr.read().decode()}"
          os.killpg(p_nh.pid, signal.SIGHUP)
          time.sleep(0.1)
          open(go_nh, "w").write("go\n")
          rc_nh = p_nh.wait(timeout=10)
          err_nh = p_nh.stderr.read().decode()
          assert rc_nh == 0, (rc_nh, err_nh)
      print("wrapper signal and stdin ok")
      PY
    expected_output_contains: "wrapper signal and stdin ok"

  - name: offline Signal1D SVD decomposition, HDF5 .hspy round-trip, and hyperspy-info CLI
    description: Create a synthetic skin Raman/reflectance Signal1D cube, run SVD decomposition, save/load .hspy via RosettaSciIO, and inspect with hyperspy-info under read-only/unset HOME and unwritable cache paths.
    command: |
      set -e
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      env -u HOME -u USER -u LOGNAME \
        MPLCONFIGDIR=/sys/unwritable-mpl XDG_CACHE_HOME=/sys/unwritable-cache XDG_CONFIG_HOME=/sys/unwritable-cfg \
        /opt/hyperspy/bin/python - "$tmpdir" <<'PY'
      import os
      import sys
      import numpy as np
      import hyperspy.api as hs

      td = sys.argv[1]
      rng = np.random.default_rng(13)
      x = np.linspace(600.0, 1800.0, 64)
      peak1 = np.exp(-0.5 * ((x - 1003.0) / 25.0) ** 2)
      peak2 = np.exp(-0.5 * ((x - 1445.0) / 35.0) ** 2)
      data = np.empty((8, 8, 64), dtype=np.float32)
      for i in range(8):
          for j in range(8):
              w1 = 0.8 if i < 4 else 0.3
              w2 = 0.2 if i < 4 else 0.9
              data[i, j] = w1 * peak1 + w2 * peak2 + rng.normal(0.0, 0.01, size=64)

      s = hs.signals.Signal1D(data)
      s.axes_manager[-1].name = "Raman shift"
      s.axes_manager[-1].units = "cm^-1"
      s.decomposition(algorithm="SVD")
      ev = s.get_explained_variance_ratio().data
      assert float(ev[:2].sum()) > 0.9, float(ev[:2].sum())

      out_hspy = os.path.join(td, "skin_raman.hspy")
      s.save(out_hspy, overwrite=True)
      reloaded = hs.load(out_hspy)
      assert reloaded.data.shape == (8, 8, 64)
      assert np.allclose(reloaded.data, data, atol=1e-5)
      print(f"hyperspy svd ok var2={float(ev[:2].sum()):.3f}")
      PY

      env -u HOME -u USER -u LOGNAME -u MPLCONFIGDIR -u XDG_CACHE_HOME -u XDG_CONFIG_HOME \
        hyperspy-info --version | grep -q "hyperspy ${upstream_version}"
      HOME=/sys MPLCONFIGDIR=/sys/unwritable-mpl XDG_CACHE_HOME=/sys/unwritable-cache \
        hyperspy-info "$tmpdir/skin_raman.hspy" | grep -q '"Raman shift"'
      echo "hyperspy offline workflow ok"
    expected_output_contains: "hyperspy offline workflow ok"

  - name: runtime hook preserves cache across fork and cleans up on SIGTERM/SIGHUP (including PID 1)
    description: Verify direct /opt/hyperspy/bin/python keeps parent cache across os.fork()+sys.exit(0), cleans up on SIGTERM/SIGHUP, and exits cleanly under the PID 1 signal path.
    command: |
      set -e
      /usr/bin/python3 - <<'PY'
      import os, pathlib, signal, subprocess, tempfile

      py = "/opt/hyperspy/bin/python"
      with tempfile.TemporaryDirectory() as td:
          env = {"PATH": os.environ["PATH"], "TMPDIR": td}

          fork_code = (
              "import os, sys, _hyperspy_runtime as rt\n"
              "root = rt._CACHE_ROOT\n"
              "assert root is not None and root.is_dir(), root\n"
              "pid = os.fork()\n"
              "if pid == 0:\n"
              "    sys.exit(0)\n"
              "_, st = os.waitpid(pid, 0)\n"
              "assert os.WIFEXITED(st) and os.WEXITSTATUS(st) == 0, st\n"
              "assert root.is_dir(), root\n"
              "print(root)\n"
          )
          r = subprocess.run([py, "-c", fork_code], env=env, capture_output=True, text=True, timeout=30)
          assert r.returncode == 0, (r.returncode, r.stdout, r.stderr)
          assert not pathlib.Path(r.stdout.strip()).exists(), r.stdout

          for sig in (signal.SIGTERM, signal.SIGHUP):
              sp = subprocess.Popen(
                  [py, "-c", "import time, _hyperspy_runtime as rt; print(rt._CACHE_ROOT, flush=True); time.sleep(30)"],
                  env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              cdir = sp.stdout.readline().strip()
              assert cdir and os.path.isdir(cdir), cdir
              os.kill(sp.pid, sig)
              rc = sp.wait(timeout=10)
              assert rc == -sig.value, (sig, rc, sp.stderr.read())
              assert not os.path.exists(cdir), cdir

              pid1_code = (
                  "import os, time, _hyperspy_runtime as rt\n"
                  "rt._CACHE_OWNER_PID = 1\n"
                  "os.getpid = lambda: 1\n"
                  "print(rt._CACHE_ROOT, flush=True)\n"
                  "time.sleep(30)\n"
              )
              sp1 = subprocess.Popen(
                  [py, "-c", pid1_code],
                  env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              cdir1 = sp1.stdout.readline().strip()
              assert cdir1 and os.path.isdir(cdir1), cdir1
              os.kill(sp1.pid, sig)
              rc1 = sp1.wait(timeout=10)
              assert rc1 == 128 + sig.value, (sig, rc1, sp1.stderr.read())
              assert not os.path.exists(cdir1), cdir1
          assert os.listdir(td) == [], os.listdir(td)
      print("runtime hook signal and fork ok")
      PY
    expected_output_contains: "runtime hook signal and fork ok"
