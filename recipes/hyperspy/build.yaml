name: hyperspy
version: "2.6.0"

description: Multi-dimensional hyperspectral and spectroscopic data analysis for Raman, reflectance, and fluorescence optical skin imaging.

copyright:
  - license: GPL-3.0-or-later
    name: HyperSpy license
    url: https://github.com/hyperspy/hyperspy/blob/v{{ context.upstream_version }}/COPYING.txt
  - license: GPL-3.0-or-later
    name: RosettaSciIO license
    url: https://github.com/hyperspy/rosettasciio/blob/v{{ context.rosettasciio_version }}/COPYING.txt

architectures:
  - x86_64
  - aarch64

variables:
  upstream_version: "2.6.0"
  # Coordinated GPL-3.0-or-later native extension pin (rsciio/bruker/unbcf_fast)
  # paired with its matching PyPI sdist SHA-256 corresponding source archive.
  rosettasciio_version: "0.16.0"
  rosettasciio_source_sha256: "b59356c851e9c7e8eae026e004121851ad35af735f77fc0ee6d04132f5080ff3"

auto_update:
  method: sources
  container_version: hyperspy
  sources:
    - id: hyperspy
      method: pypi
      package: hyperspy
      target:
        variable: upstream_version
        fulltest_variable: upstream_version
    - id: rosettasciio
      method: pypi
      package: rosettasciio
      dependency: true
      target:
        variable: rosettasciio_version
        fulltest_variable: rosettasciio_version
    - id: rosettasciio_source_digest
      method: http_digest
      url: https://files.pythonhosted.org/packages/source/r/rosettasciio/rosettasciio-{{ context.rosettasciio_version }}.tar.gz
      dependency: true
      target:
        variable: rosettasciio_source_sha256

build:
  kind: neurodocker

  base-image: ubuntu:26.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        MPLBACKEND: Agg
        PIP_NO_CACHE_DIR: "1"
        PATH: /opt/hyperspy/wrappers:/opt/hyperspy/bin:$PATH

    - install:
        - ca-certificates
        - python3
        - python3-h5py
        - python3-matplotlib
        - python3-numpy
        - python3-pil
        - python3-pip
        - python3-scipy
        - python3-skimage
        - python3-venv

    - run:
        # Inherit Ubuntu 26.04 system numpy/scipy/h5py/matplotlib/skimage so no
        # PyPI bundled GNU runtime libraries (libquadmath/libgfortran/libgomp) ship.
        - python3 -m venv --system-site-packages /opt/hyperspy
        - /opt/hyperspy/bin/python -m pip install --no-cache-dir "hyperspy=={{ context.upstream_version }}" "rosettasciio=={{ context.rosettasciio_version }}"
        - /opt/hyperspy/bin/python -m pip check
        - /opt/hyperspy/bin/python {{ get_file("install_runtime_hook") }}
        - >-
          /opt/hyperspy/bin/python -c "import pathlib, h5py, hyperspy, matplotlib, numpy, rsciio, scipy, skimage;
          assert all(m.__file__.startswith('/usr/lib/python3/dist-packages/') for m in (numpy, scipy, h5py, matplotlib, skimage));
          bad_libs = [str(p) for p in pathlib.Path('/opt/hyperspy').rglob('*.so*') if p.name.startswith(('libquadmath', 'libgfortran', 'libgomp', 'libzmq'))];
          assert not bad_libs, bad_libs"
        - mkdir -p /opt/hyperspy/wrappers /opt/hyperspy/share/licenses /opt/hyperspy/share/src
        - install -m 0755 {{ get_file("hyperspy_info_cli") }} /opt/hyperspy/bin/hyperspy-info
        - install -m 0755 {{ get_file("hyperspy_info_wrapper") }} /opt/hyperspy/wrappers/hyperspy-info
        - install -m 0644 {{ get_file("hyperspy_license") }} /opt/hyperspy/share/licenses/HYPERSPY-COPYING.txt
        - install -m 0644 {{ get_file("rosettasciio_license") }} /opt/hyperspy/share/licenses/ROSETTASCIIO-COPYING.txt
        - install -m 0644 /usr/share/common-licenses/GPL-3 /opt/hyperspy/share/licenses/GPL-3.0.txt
        - install -m 0644 {{ get_file("rosettasciio_source") }} /opt/hyperspy/share/src/rosettasciio-{{ context.rosettasciio_version }}.tar.gz
        - install -m 0644 {{ get_file("gpl_source_notice") }} /opt/hyperspy/share/licenses/GPL-SOURCE-NOTICE.txt
        - chmod -R a+rX /opt/hyperspy
        - rm -rf /root/.cache/pip

files:
  - name: hyperspy_license
    url: https://raw.githubusercontent.com/hyperspy/hyperspy/v{{ context.upstream_version }}/COPYING.txt
  - name: rosettasciio_license
    url: https://raw.githubusercontent.com/hyperspy/rosettasciio/v{{ context.rosettasciio_version }}/COPYING.txt
  - name: rosettasciio_source
    url: https://files.pythonhosted.org/packages/source/r/rosettasciio/rosettasciio-{{ context.rosettasciio_version }}.tar.gz
    sha256: "{{ context.rosettasciio_source_sha256 }}"
  - name: gpl_source_notice
    contents: |
      HyperSpy {{ context.upstream_version }} Container — License & Source Notice
      ===========================================================================
      HyperSpy {{ context.upstream_version }} (GPL-3.0-or-later) is pure Python;
      its complete source code is installed directly under
      /opt/hyperspy/lib/python*/site-packages/hyperspy/.
      Container modification notice (GPL-3.0 section 5a): hyperspy/defaults_parser.py
      was patched during container build to resolve config_path via
      _hyperspy_runtime.resolve_hyperspy_config_dir() (honoring HYPERSPY_CONFIG_DIR
      and XDG_CONFIG_HOME with a private temporary fallback) so HyperSpy runs when
      /home is read-only or unavailable.

      RosettaSciIO {{ context.rosettasciio_version }} (GPL-3.0-or-later) includes
      the compiled Cython extension rsciio/bruker/unbcf_fast. Its exact matching
      corresponding source tarball is bundled inside this image at:
        /opt/hyperspy/share/src/rosettasciio-{{ context.rosettasciio_version }}.tar.gz

      License texts are installed under /opt/hyperspy/share/licenses/.
  - name: install_runtime_hook
    contents: |
      from __future__ import annotations

      import pathlib
      import textwrap

      matches = sorted(pathlib.Path("/opt/hyperspy/lib").glob("python*/site-packages"))
      assert len(matches) == 1, matches
      site_packages = matches[0]
      (site_packages / "_hyperspy_runtime.py").write_text(
          textwrap.dedent(
              '''\
              """Container runtime defaults for HyperSpy caches and unlisted UIDs."""

              from __future__ import annotations

              import atexit
              import errno
              import getpass
              import os
              import shutil
              import signal
              import tempfile
              from pathlib import Path

              _CACHE_ROOT: Path | None = None
              _CACHE_OWNER_PID: int | None = None
              _CLEANUP_REGISTERED = False


              def is_writable_dir(path_str: str | None) -> bool:
                  if not path_str:
                      return False
                  blocked = {signal.SIGINT, signal.SIGTERM, signal.SIGHUP}
                  prev_mask = signal.pthread_sigmask(signal.SIG_BLOCK, blocked)
                  try:
                      os.makedirs(path_str, exist_ok=True)
                      if hasattr(os, "O_TMPFILE"):
                          try:
                              fd = os.open(path_str, os.O_TMPFILE | os.O_RDWR, 0o600)
                              os.close(fd)
                              return True
                          except OSError as exc:
                              if exc.errno not in (errno.EOPNOTSUPP, errno.EISDIR, errno.EINVAL, errno.ENOSYS):
                                  return False
                      fd, probe = tempfile.mkstemp(prefix=".hyperspy-write-check-", dir=path_str)
                      try:
                          os.close(fd)
                      finally:
                          os.unlink(probe)
                      return True
                  except OSError:
                      return False
                  finally:
                      signal.pthread_sigmask(signal.SIG_SETMASK, prev_mask)


              def _cleanup_cache() -> None:
                  if _CACHE_ROOT is not None and _CACHE_OWNER_PID == os.getpid():
                      shutil.rmtree(_CACHE_ROOT, ignore_errors=True)


              def _signal_cleanup(signum: int, _frame: object) -> None:
                  _cleanup_cache()
                  if os.getpid() == 1:
                      os._exit(128 + signum)
                  signal.signal(signum, signal.SIG_DFL)
                  os.kill(os.getpid(), signum)


              def _install_signal_handlers() -> None:
                  try:
                      for sig in (signal.SIGTERM, signal.SIGHUP):
                          if signal.getsignal(sig) == signal.SIG_DFL:
                              signal.signal(sig, _signal_cleanup)
                  except ValueError:
                      pass


              def _private_subdir(sub: str) -> Path:
                  global _CACHE_ROOT, _CACHE_OWNER_PID, _CLEANUP_REGISTERED
                  if _CACHE_ROOT is None or _CACHE_OWNER_PID != os.getpid():
                      blocked = {signal.SIGINT, signal.SIGTERM, signal.SIGHUP}
                      prev_mask = signal.pthread_sigmask(signal.SIG_BLOCK, blocked)
                      try:
                          _CACHE_ROOT = Path(tempfile.mkdtemp(prefix="hyperspy-cache."))
                          _CACHE_OWNER_PID = os.getpid()
                          if not _CLEANUP_REGISTERED:
                              atexit.register(_cleanup_cache)
                              _CLEANUP_REGISTERED = True
                          _install_signal_handlers()
                      finally:
                          signal.pthread_sigmask(signal.SIG_SETMASK, prev_mask)
                  subdir = _CACHE_ROOT / sub
                  subdir.mkdir(mode=0o700, exist_ok=True)
                  return subdir


              def ensure_runtime_env() -> None:
                  try:
                      getpass.getuser()
                  except Exception:
                      os.environ["USER"] = f"uid{os.getuid()}"

                  for key, sub in (
                      ("MPLCONFIGDIR", "mpl"),
                      ("XDG_CACHE_HOME", "cache"),
                      ("XDG_CONFIG_HOME", "config"),
                  ):
                      if not is_writable_dir(os.environ.get(key)):
                          os.environ[key] = str(_private_subdir(sub))

                  if not os.environ.get("HOME"):
                      os.environ["HOME"] = str(_private_subdir("home"))

                  if os.getpid() == 1:
                      _install_signal_handlers()


              def resolve_hyperspy_config_dir() -> Path:
                  ensure_runtime_env()
                  env_cfg = os.environ.get("HYPERSPY_CONFIG_DIR")
                  if is_writable_dir(env_cfg):
                      assert env_cfg is not None
                      return Path(env_cfg)
                  xdg_cfg = os.environ.get("XDG_CONFIG_HOME")
                  if xdg_cfg:
                      candidate = Path(xdg_cfg) / "hyperspy"
                      if is_writable_dir(str(candidate)):
                          return candidate
                  return _private_subdir("hyperspy-config")


              ensure_runtime_env()
              '''
          ),
          encoding="utf-8",
      )
      (site_packages / "_hyperspy_runtime.pth").write_text(
          "import _hyperspy_runtime\n",
          encoding="utf-8",
      )

      defaults_py = site_packages / "hyperspy" / "defaults_parser.py"
      src = defaults_py.read_text(encoding="utf-8")
      old = 'config_path = Path("~/.hyperspy").expanduser()'
      assert src.count(old) == 1, f"Expected unique config_path line in {defaults_py}"
      replacement = (
          "# Modified by NeuroContainers (2026) to avoid writing to read-only /home\n"
          "import _hyperspy_runtime\n"
          "config_path = _hyperspy_runtime.resolve_hyperspy_config_dir()"
      )
      defaults_py.write_text(src.replace(old, replacement, 1), encoding="utf-8")
  - name: hyperspy_info_cli
    executable: true
    contents: |
      #!/opt/hyperspy/bin/python
      """Inspect HyperSpy-readable multidimensional signal files (.hspy/.hdf5/.tif)."""

      from __future__ import annotations

      import argparse
      import json

      import hyperspy
      import hyperspy.api as hs


      def main(argv: list[str] | None = None) -> int:
          parser = argparse.ArgumentParser(
              prog="hyperspy-info",
              description="Inspect HyperSpy signal files and emit JSON axis/shape metadata.",
          )
          parser.add_argument("--version", action="version", version=f"hyperspy {hyperspy.__version__}")
          parser.add_argument("path", help="Path to a HyperSpy-supported signal file (.hspy, .hdf5, .tif, ...)")
          args = parser.parse_args(argv)

          loaded = hs.load(args.path)
          signals = loaded if isinstance(loaded, list) else [loaded]
          summary = []
          for sig in signals:
              axes = [
                  {
                      "name": str(ax.name),
                      "size": int(ax.size),
                      "units": str(ax.units),
                      "navigate": bool(ax.navigate),
                  }
                  for ax in sig.axes_manager._axes
              ]
              summary.append(
                  {
                      "signal_type": sig.metadata.Signal.signal_type or sig.__class__.__name__,
                      "shape": list(sig.data.shape),
                      "dtype": str(sig.data.dtype),
                      "axes": axes,
                  }
              )
          print(json.dumps({"hyperspy_version": hyperspy.__version__, "signals": summary}, indent=2))
          return 0


      if __name__ == "__main__":
          raise SystemExit(main())
  - name: hyperspy_info_wrapper
    executable: true
    contents: |
      #!/usr/bin/python3
      """Run hyperspy-info CLI with private non-/home cache paths and POSIX job control."""

      from __future__ import annotations

      import errno
      import getpass
      import os
      import shutil
      import signal
      import subprocess
      import sys
      import tempfile


      ENV_SUBDIRS = (
          ("MPLCONFIGDIR", "mpl"),
          ("XDG_CACHE_HOME", "cache"),
          ("XDG_CONFIG_HOME", "config"),
      )


      def _is_writable_dir(path_str: str | None) -> bool:
          if not path_str:
              return False
          blocked = {signal.SIGINT, signal.SIGTERM, signal.SIGHUP}
          prev_mask = signal.pthread_sigmask(signal.SIG_BLOCK, blocked)
          try:
              os.makedirs(path_str, exist_ok=True)
              if hasattr(os, "O_TMPFILE"):
                  try:
                      fd = os.open(path_str, os.O_TMPFILE | os.O_RDWR, 0o600)
                      os.close(fd)
                      return True
                  except OSError as exc:
                      if exc.errno not in (errno.EOPNOTSUPP, errno.EISDIR, errno.EINVAL, errno.ENOSYS):
                          return False
              fd, probe = tempfile.mkstemp(prefix=".hyperspy-write-check-", dir=path_str)
              try:
                  os.close(fd)
              finally:
                  os.unlink(probe)
              return True
          except OSError:
              return False
          finally:
              signal.pthread_sigmask(signal.SIG_SETMASK, prev_mask)


      def main() -> int:
          cmd = ["/opt/hyperspy/bin/hyperspy-info", *sys.argv[1:]]
          env = os.environ.copy()
          try:
              getpass.getuser()
          except Exception:
              env["USER"] = f"uid{os.getuid()}"
          missing = [item for item in ENV_SUBDIRS if not _is_writable_dir(env.get(item[0]))]
          if not env.get("HOME"):
              missing.append(("HOME", "home"))
          if not missing:
              os.execve(cmd[0], cmd, env)

          tmp_root: str | None = None
          proc: subprocess.Popen[bytes] | None = None
          received_signal: int | None = None
          pending_signal: int | None = None
          pending_tstp = False
          tty_fd: int | None = None
          orig_pgrp: int | None = None
          handed_tty = False

          def set_tty_pgrp(pgrp: int) -> bool:
              if tty_fd is None:
                  return False
              prev = signal.signal(signal.SIGTTOU, signal.SIG_IGN)
              try:
                  os.tcsetpgrp(tty_fd, pgrp)
                  return True
              except OSError:
                  return False
              finally:
                  signal.signal(signal.SIGTTOU, prev)

          def owns_tty() -> bool:
              if tty_fd is None or orig_pgrp is None:
                  return False
              try:
                  return os.tcgetpgrp(tty_fd) == orig_pgrp
              except OSError:
                  return False

          def child_owns_tty() -> bool:
              if tty_fd is None or proc is None:
                  return False
              try:
                  return os.tcgetpgrp(tty_fd) == proc.pid
              except OSError:
                  return False

          def hand_tty_to_child() -> None:
              nonlocal handed_tty
              if proc is None or tty_fd is None or not owns_tty():
                  return
              if set_tty_pgrp(proc.pid):
                  handed_tty = True

          def reclaim_tty() -> None:
              nonlocal handed_tty
              if handed_tty and tty_fd is not None and orig_pgrp is not None:
                  if child_owns_tty():
                      set_tty_pgrp(orig_pgrp)
                  handed_tty = False

          def forward(signum: int) -> None:
              if proc is not None and proc.returncode is None:
                  try:
                      os.killpg(proc.pid, signum)
                      if signum in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP):
                          os.killpg(proc.pid, signal.SIGCONT)
                  except ProcessLookupError:
                      pass

          def handle_signal(signum: int, _frame: object) -> None:
              nonlocal received_signal, pending_signal
              received_signal = signum
              if proc is None:
                  pending_signal = signum
              else:
                  forward(signum)

          def handle_cont(_signum: int, _frame: object) -> None:
              if proc is not None and proc.returncode is None and received_signal is None:
                  hand_tty_to_child()

          def handle_tstp(_signum: int, _frame: object) -> None:
              nonlocal pending_tstp
              if proc is None:
                  pending_tstp = True
              elif proc.returncode is None:
                  try:
                      os.killpg(proc.pid, signal.SIGTSTP)
                  except ProcessLookupError:
                      pass

          def stop_self(stop_sig: int) -> None:
              prev_tstp = signal.signal(signal.SIGTSTP, signal.SIG_DFL)
              try:
                  os.kill(os.getpid(), stop_sig)
              finally:
                  signal.signal(signal.SIGTSTP, prev_tstp)

          try:
              for sig in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP):
                  if signal.getsignal(sig) != signal.SIG_IGN:
                      signal.signal(sig, handle_signal)
              signal.signal(signal.SIGCONT, handle_cont)
              signal.signal(signal.SIGTSTP, handle_tstp)
              if received_signal is not None:
                  return 128 + received_signal

              tmp_root = tempfile.mkdtemp(prefix="hyperspy.")
              for key, subdir in missing:
                  path = os.path.join(tmp_root, subdir)
                  os.mkdir(path, 0o700)
                  env[key] = path
              if received_signal is not None:
                  return 128 + received_signal

              try:
                  tty_fd = os.open("/dev/tty", os.O_RDWR | os.O_NOCTTY | os.O_CLOEXEC)
                  os.tcgetpgrp(tty_fd)
                  orig_pgrp = os.getpgrp()
              except OSError:
                  if tty_fd is not None:
                      try:
                          os.close(tty_fd)
                      except OSError:
                          pass
                  tty_fd = None

              proc = subprocess.Popen(cmd, env=env, process_group=0)
              if received_signal is None and owns_tty():
                  hand_tty_to_child()
                  if handed_tty:
                      try:
                          os.killpg(proc.pid, signal.SIGCONT)
                      except ProcessLookupError:
                          pass

              sig_to_replay, pending_signal = pending_signal, None
              if sig_to_replay is not None:
                  forward(sig_to_replay)
              elif pending_tstp:
                  pending_tstp = False
                  try:
                      os.killpg(proc.pid, signal.SIGTSTP)
                  except ProcessLookupError:
                      pass

              rc = 0
              while True:
                  try:
                      _, status = os.waitpid(proc.pid, os.WUNTRACED)
                  except InterruptedError:
                      continue
                  except ChildProcessError:
                      break
                  if os.WIFSTOPPED(status):
                      stop_sig = os.WSTOPSIG(status)
                      if received_signal is not None:
                          try:
                              os.killpg(proc.pid, signal.SIGCONT)
                          except ProcessLookupError:
                              pass
                          continue
                      if stop_sig in (signal.SIGTTIN, signal.SIGTTOU) and (
                          owns_tty() or child_owns_tty()
                      ):
                          hand_tty_to_child()
                          try:
                              os.killpg(proc.pid, signal.SIGCONT)
                          except ProcessLookupError:
                              pass
                          continue
                      reclaim_tty()
                      stop_self(stop_sig)
                      if received_signal is not None:
                          try:
                              os.killpg(proc.pid, signal.SIGCONT)
                          except ProcessLookupError:
                              pass
                          continue
                      hand_tty_to_child()
                      try:
                          os.killpg(proc.pid, signal.SIGCONT)
                      except ProcessLookupError:
                          pass
                      continue
                  if os.WIFSIGNALED(status):
                      rc = -os.WTERMSIG(status)
                  elif os.WIFEXITED(status):
                      rc = os.WEXITSTATUS(status)
                  else:
                      continue
                  proc.returncode = rc
                  break
              if received_signal is not None:
                  return 128 + received_signal
              return 128 - rc if rc < 0 else rc
          finally:
              reclaim_tty()
              if tty_fd is not None:
                  try:
                      os.close(tty_fd)
                  except OSError:
                      pass
              if tmp_root is not None:
                  shutil.rmtree(tmp_root, ignore_errors=True)


      if __name__ == "__main__":
          raise SystemExit(main())

deploy:
  bins:
    - hyperspy-info

domains:
  - microscopy
  - dermatology

categories:
  - "optical imaging"
  - "spectroscopy"
  - "quantitative imaging"

readme: |-
  ----------------------------------
  ## hyperspy/{{ context.version }} ##

  HyperSpy is an open-source Python library for multi-dimensional spectroscopic
  and hyperspectral data analysis (decomposition, blind source separation,
  curve fitting, and HDF5/TIFF I/O via RosettaSciIO {{ context.rosettasciio_version }})
  — suited for Raman, reflectance, and fluorescence optical skin imaging.

  ### Included CLI Tool
  ```
  hyperspy-info    Inspect HyperSpy-readable multidimensional signal files as JSON
  ```

  ### Example
  ```
  ml hyperspy/{{ context.version }}
  hyperspy-info skin_raman.hspy
  ```

  Documentation: https://hyperspy.org/hyperspy-doc/current/index.html
  License texts (`HYPERSPY-COPYING.txt`, `ROSETTASCIIO-COPYING.txt`,
  `GPL-3.0.txt`, `GPL-SOURCE-NOTICE.txt`) are installed under
  `/opt/hyperspy/share/licenses/`, and the matching RosettaSciIO corresponding
  source archive is bundled under `/opt/hyperspy/share/src/`.
  ----------------------------------

icon: data:image/png;base64,
