name: shim-toolbox
version: 1.5.0
architectures:
  - x86_64
copyright:
  - license: GPL-3.0-only
    url: https://github.com/shimming-toolbox/shimming-toolbox/blob/master/LICENSE
  - license: MIT
    url: https://github.com/neurodesk/neurocontainers/blob/main/LICENSE
variables:
  openrecon_ismrmrd_version: 1.14.2
  openrecon_siemens_commit: 055eefc09dfa77fbf11fff85979dea9ef2879ba5
  openrecon_python_tools_commit: 17fe6fbf1bb645112e2ad0023eb4f42afb36421e
  openrecon_server_commit: 33362f2139701fbf5ea855808a325eb59b7db2ae
  base_image_digest: sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
  openrecon_ubuntu_version: '24.04'
  shimmingtoolbox_commit: 0afbd9e133df1eeca8deecdf37875825462dd43b
  numpy_version: 2.2.6
  scipy_version: 1.15.3
  nibabel_version: 5.4.2
  shimmingtoolbox_version: '1.5'
auto_update:
  method: sources
  container_version:
    variable: shimmingtoolbox_version
  local:
    - macros/openrecon
    - macros/openrecon_i2i
    - macros/b0_shimming
  sources:
    - id: shimmingtoolbox
      method: github_commit
      repo: shimming-toolbox/shimming-toolbox
      ref: master
      target:
        variable: shimmingtoolbox_commit
        variables:
          shimmingtoolbox_version: version
      version_file: shimming-toolbox/shimmingtoolbox/version.txt
    - id: base_image
      dependency: true
      method: oci_digest
      image: ubuntu
      tag: '24.04'
      target:
        variable: base_image_digest
    - id: openrecon_ismrmrd
      dependency: true
      method: github_release
      repo: ismrmrd/ismrmrd
      target:
        variable: openrecon_ismrmrd_version
        value: version
    - id: openrecon_siemens
      dependency: true
      method: github_commit
      repo: ismrmrd/siemens_to_ismrmrd
      ref: HEAD
      target:
        variable: openrecon_siemens_commit
    - id: openrecon_python_tools
      dependency: true
      method: github_commit
      repo: ismrmrd/ismrmrd-python-tools
      ref: HEAD
      target:
        variable: openrecon_python_tools_commit
    - id: openrecon_server
      dependency: true
      method: github_commit
      repo: astewartau/python-ismrmrd-server
      ref: fix/ismrmrd-compatibility
      target:
        variable: openrecon_server_commit
    - id: numpy
      method: pypi
      package: numpy
      dependency: true
      target:
        variable: numpy_version
    - id: scipy
      method: pypi
      package: scipy
      dependency: true
      target:
        variable: scipy_version
    - id: nibabel
      method: pypi
      package: nibabel
      dependency: true
      target:
        variable: nibabel_version
build:
  kind: neurodocker
  base-image: ubuntu:24.04@{{ context.base_image_digest }}
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        SHIM_TOOLBOX_VERSION: '{{ context.version }}'
    - install: bzip2 ca-certificates git build-essential python3-pip python-is-python3
    - include: macros/openrecon/neurodocker.yaml
    - include: macros/openrecon_i2i/helpers.yaml
    - run:
        - python3 -m pip install --break-system-packages --no-cache-dir numpy=={{ context.numpy_version }} scipy=={{ context.scipy_version }} nibabel=={{ context.nibabel_version }}
    - run:
        - mkdir -p /opt/shimming-toolbox
        - tar -xzf {{ get_file("shimmingtoolbox_archive") }} --strip-components=1 -C /opt/shimming-toolbox
        - rm /opt/shimming-toolbox/shimming-toolbox/requirements_st-pinned.txt
        - python3 -m pip install --break-system-packages --no-cache-dir /opt/shimming-toolbox/shimming-toolbox numpy=={{ context.numpy_version }} scipy=={{ context.scipy_version }} nibabel=={{ context.nibabel_version }} pydicom==3.0.1
        - python3 -m pip check
    - include: macros/b0_shimming/helpers.yaml
    - run:
        - mkdir -p /opt/shim_toolbox /tmp/share/b0maps
        - chmod 1777 /tmp/share /tmp/share/b0maps
        - cp {{ get_file("shim_toolbox.py") }} /opt/code/python-ismrmrd-server/shim_toolbox.py
        - cp {{ get_file("OpenReconLabel.json") }} /opt/code/python-ismrmrd-server/OpenReconLabel.json
        - cp {{ get_file("OpenReconREADME.md") }} /opt/shim_toolbox/OpenReconREADME.md
        - cp {{ get_file("test_shim_toolbox.py") }} /opt/shim_toolbox/test_shim_toolbox.py
        - install -m 0755 {{ get_file("shim_toolbox") }} /usr/local/bin/shim_toolbox
    - environment:
        PYTHONPATH: /opt/code/python-ismrmrd-server:/opt/b0-shimming
deploy:
  bins:
    - shim_toolbox
    - st_b0shim
    - st_create_coil_profiles
    - st_mask
files:
  - name: shimmingtoolbox_archive
    url: https://github.com/shimming-toolbox/shimming-toolbox/archive/{{ context.shimmingtoolbox_commit }}.tar.gz
  - name: shim_toolbox.py
    filename: shim_toolbox.py
  - name: shim_toolbox
    filename: shim_toolbox
  - name: OpenReconLabel.json
    filename: OpenReconLabel.json
  - name: OpenReconREADME.md
    filename: OpenReconREADME.md
  - name: test_shim_toolbox.py
    filename: test_shim_toolbox.py
categories:
  - quantitative imaging
  - image reconstruction
  - phase processing
readme: 'Resample a saved B0 field map into a target scan and estimate absolute Cima.X shims with Shimming Toolbox.


  Run the ISMRMRD server with config shim_toolbox. Both containers require the same host share mounted at /tmp/share. Select the source B0MapId and provide the field-map acquisition baseline, verified limits, and HFS isocentre when those were not saved by b0mapromeo. See /opt/shim_toolbox/OpenReconREADME.md.

  '
icon: data:image/svg+xml;base64,
