name: frisgokspace
version: 0.1.0

tests:
  - name: deployed launcher
    command: frisgokspace --version
    expected_output_contains: "${version}"
  - name: server CLI
    command: frisgokspace --help
    expected_output_contains: "Example server for MRD streaming format"
  - name: runtime version
    command: printenv FRISGOKSPACE_VERSION
    expected_output_contains: "${version}"
  - name: numerical and real MRD TCP contracts
    command: python /opt/code/python-ismrmrd-server/smoke_frisgokspace.py
    expected_output_contains: "FRISGO numerical and MRD transport smoke tests passed"
