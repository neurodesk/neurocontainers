name: xcpd
version: 26.2.0
default_timeout: 120
tests:
  - name: XCP-D version
    command: xcp_d --version
    expected_output_contains: "XCP-D v${version}"

  - name: XCP-D help
    command: xcp_d --help
    expected_output_contains: --mode

  - name: Python dependencies
    command: python3 -c "import nibabel; import nilearn; import pandas; import templateflow"

  - name: ANTs registration
    command: antsRegistration --version
    expected_output_contains: "ANTs Version"

  - name: AFNI processing commands
    description: Check the AFNI subset shipped by XCP-D and its shared libraries.
    command: |
      set -euo pipefail
      for tool in 3dDespike 3dReHo 3dFWHMx; do
        executable=$(command -v "$tool")
        libraries=$(ldd "$executable")
        printf '%s\n' "$libraries"
        if grep -q 'not found' <<< "$libraries"; then
          exit 1
        fi
        "$tool" -help
      done

  - name: BIDS validator
    command: bids-validator --version

  - name: Connectome Workbench
    command: wb_command -version
    expected_output_contains: "Connectome Workbench"

  - name: Bundled templates and atlases
    description: Runtime resources must be available without the image home directory.
    command: |
      python3 - <<'PY'
      import os
      from pathlib import Path
      from bids import BIDSLayout
      from templateflow import api
      from xcp_d import config

      root = Path(os.environ["TEMPLATEFLOW_HOME"])
      assert root == Path("/opt/xcp-d/templateflow")
      assert config.execution.templateflow_home == root
      template = root / "tpl-MNI152NLin6Asym/tpl-MNI152NLin6Asym_res-01_T1w.nii.gz"
      assert template.is_file() and template.stat().st_size > 0
      assert api.get("MNI152NLin6Asym", resolution=1, desc=None, suffix="T1w") == template
      for atlas in ("AtlasPack", "XCPDAtlases"):
          dataset = Path("/opt/xcp-d/atlases") / atlas
          layout = BIDSLayout(dataset, validate=False)
          assert layout.get(extension=[".nii.gz", ".dlabel.nii"]), atlas
      PY
