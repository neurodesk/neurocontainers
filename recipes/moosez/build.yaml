name: moosez
version: "3.2.2"

copyright:
  - license: Apache-2.0
    url: https://github.com/ENHANCE-PET/MOOSE/blob/main/LICENSE

architectures:
  - x86_64
  - aarch64

auto_update:
  method: pypi
  package: moosez

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        MPLBACKEND: Agg
        PYTHONNOUSERSITE: "1"
        PATH: /opt/moosez/bin:/opt/moosez/venv/bin:$PATH

    - install:
        - ca-certificates
        - fonts-dejavu-core
        - libgl1
        - libglib2.0-0t64
        - libgomp1
        - python3
        - python3-pip
        - python3-venv

    - run:
        - mkdir -p /opt/moosez/bin /opt/moosez/share/licenses
        - python3 -m venv /opt/moosez/venv
        - /opt/moosez/venv/bin/python -m pip install --no-cache-dir --upgrade pip setuptools wheel
        - /opt/moosez/venv/bin/python -m pip install --no-cache-dir "moosez=={{ context.version }}"
        # Pre-install MOOSE custom nnU-Net v2 trainers into site-packages at build time
        # so runtime execution on read-only Apptainer images does not attempt writes.
        - /opt/moosez/venv/bin/python -c "from moosez.nnUNet_custom_trainer.utility import add_custom_trainers_to_local_nnunetv2; msg = add_custom_trainers_to_local_nnunetv2(); print(msg); assert 'Custom trainer added to' in msg or 'already installed' in msg, msg"
        - /opt/moosez/venv/bin/python -c "from nnunetv2.training.nnUNetTrainer.variants.MOOSE_custom_trainers import nnUNetTrainer_2000_epochs_DA5NoMirroring; print('Verified trainer:', nnUNetTrainer_2000_epochs_DA5NoMirroring.__name__)"
        # Redirect MODELS_DIRECTORY_PATH away from read-only site-packages to MOOSEZ_MODELS_DIR
        # (falling back to a per-UID private /tmp/moosez-<uid>/models/nnunet_trained_models).
        - SYSMOD="$(/opt/moosez/venv/bin/python -c 'import pathlib, moosez.system as s; print(pathlib.Path(s.__file__))')"
        - test -f "${SYSMOD}"
        - cat {{ get_file("models_dir_override.py") }} >> "${SYSMOD}"
        # Install .pth startup hook so direct Python API callers also avoid writing to $HOME
        # (Ubuntu 24.04 ships /usr/lib/python3.12/sitecustomize.py which shadows venv sitecustomize.py).
        - SITEPKG="$(/opt/moosez/venv/bin/python -c 'import site; print(site.getsitepackages()[0])')"
        - install -m 0644 {{ get_file("_moosez_runtime_cache.py") }} "${SITEPKG}/_moosez_runtime_cache.py"
        - printf 'import _moosez_runtime_cache\n' > "${SITEPKG}/_moosez_runtime_cache.pth"
        - chmod 0644 "${SITEPKG}/_moosez_runtime_cache.pth"
        # Install upstream Apache-2.0 license notice from installed wheel metadata.
        - /opt/moosez/venv/bin/python -c "import importlib.metadata as md, shutil; dist = md.distribution('moosez'); src = dist.locate_file('moosez-' + dist.version + '.dist-info/licenses/LICENSE'); shutil.copyfile(src, '/opt/moosez/share/licenses/LICENSE.txt')"
        - test -s /opt/moosez/share/licenses/LICENSE.txt
        # Install CLI launcher wrapper with per-UID private writable cache defaults.
        - install -m 0755 {{ get_file("launch.py") }} /opt/moosez/launch.py
        - ln -sf /opt/moosez/launch.py /opt/moosez/bin/moosez
        - chmod -R a+rX /opt/moosez
        - rm -rf /root/.cache/pip /tmp/moosez-*

    - workdir: /opt

files:
  - name: launch.py
    filename: launch.py

  - name: models_dir_override.py
    contents: |

      # Appended by NeuroContainers recipe so MODELS_DIRECTORY_PATH resolves to a
      # writable directory on read-only Apptainer images instead of site-packages.
      def _neurocontainers_resolve_models_dir() -> str:
          import stat as _stat
          from pathlib import Path as _Path

          override = os.environ.get("MOOSEZ_MODELS_DIR", "").strip()
          if override:
              base = os.path.abspath(override)
              base_name = os.path.basename(base)
              parent_name = os.path.basename(os.path.dirname(base))
              if base_name == "nnunet_trained_models" and parent_name == "models":
                  return base
              if os.path.isdir(base):
                  try:
                      if any(
                          entry.startswith("Dataset")
                          and os.path.isdir(os.path.join(base, entry))
                          for entry in os.listdir(base)
                      ):
                          return base
                  except OSError:
                      pass
              if base_name == "models":
                  return os.path.join(base, "nnunet_trained_models")
              return os.path.join(base, "models", "nnunet_trained_models")

          cache = _Path(f"/tmp/moosez-{os.geteuid()}")
          try:
              cache.mkdir(mode=0o700)
          except FileExistsError:
              pass
          info = cache.lstat()
          if (
              not _stat.S_ISDIR(info.st_mode)
              or info.st_uid != os.geteuid()
              or _stat.S_IMODE(info.st_mode) != 0o700
          ):
              raise SystemExit(
                  f"Unsafe cache directory: {cache}. "
                  "Set MOOSEZ_MODELS_DIR to a private writable directory."
              )
          return str(cache / "models" / "nnunet_trained_models")


      MODELS_DIRECTORY_PATH: str = _neurocontainers_resolve_models_dir()

  - name: _moosez_runtime_cache.py
    contents: |
      """Ensure matplotlib, XDG, and PyTorch caches avoid unwritable $HOME paths."""
      import os
      import stat
      from pathlib import Path


      def _configure_runtime_caches() -> None:
          targets = (
              ("MPLCONFIGDIR", "mpl"),
              ("XDG_CACHE_HOME", "xdg"),
              ("TORCH_HOME", "torch"),
          )
          missing = [(var, sub) for var, sub in targets if not os.environ.get(var)]
          if not missing:
              return
          cache = Path(f"/tmp/moosez-{os.geteuid()}")
          try:
              cache.mkdir(mode=0o700)
          except FileExistsError:
              pass
          info = cache.lstat()
          if (
              not stat.S_ISDIR(info.st_mode)
              or info.st_uid != os.geteuid()
              or stat.S_IMODE(info.st_mode) != 0o700
          ):
              return
          for var, sub in missing:
              os.environ[var] = str(cache / sub)


      _configure_runtime_caches()

deploy:
  bins:
    - moosez

domains:
  - neuroimaging

categories:
  - molecular imaging
  - preclinical imaging
  - image segmentation
  - machine learning

structured_readme:
  description: >-
    MOOSE (Multi-Organ Objective Segmentation, moosez) is an nnU-Net v2 deep
    learning segmentation suite from the ENHANCE-PET initiative providing both
    clinical whole-body PET/CT/MR segmentation models and preclinical CT
    leg-muscle and preclinical multi-organ MR segmentation models.
  example: |-
    # Download models to a persistent directory and run segmentation
    export MOOSEZ_MODELS_DIR=/path/to/persistent/moosez_models
    moosez -md clin_ct_organs
    moosez -d /path/to/subjects_dir -m clin_ct_organs
  documentation: |-
    This container installs `moosez` {{ context.version }} with PyTorch,
    nnU-Net v2, SimpleITK, nibabel, and dcm2niix in `/opt/moosez/venv`, with
    MOOSE's custom nnU-Net trainers pre-installed at build time for read-only
    container compatibility.

    Model weights are not baked into the image and are downloaded on demand.
    By default, models and runtime caches are stored in a private per-user
    directory `/tmp/moosez-<uid>`. Set `MOOSEZ_MODELS_DIR` to a writable
    persistent directory to retain downloaded models across runs, or pre-fetch
    models with `moosez -md <model_name> -md-out <directory>`.

    Upstream documentation: https://github.com/ENHANCE-PET/MOOSE
  citation: >-
    Shiyam Sundar, L. K., Yu, J., Muzik, O., Kulterer, O., Fueger, B. J.,
    Kifjak, D., Nakuz, T., Shin, H. M., Sima, A. K., Kitzmantl, D., Badawi,
    R. D., Nardo, L., Cherry, S. R., Spencer, B. A., Hacker, M., & Beyer, T.
    (2022). Fully-automated, semantic segmentation of whole-body 18F-FDG
    PET/CT images based on data-centric artificial intelligence. Journal of
    Nuclear Medicine. https://doi.org/10.2967/jnumed.122.264063

readme: |
  ## moosez/{{ context.version }}

  MOOSE (Multi-Organ Objective Segmentation, `moosez`) is an nnU-Net v2
  segmentation tool from the ENHANCE-PET initiative supporting automated
  multi-organ segmentation across clinical and preclinical imaging datasets.

  ### Available Model Families

  - **Clinical whole-body PET/CT/MR models**: CT organ, lung, rib, muscle,
    vertebrae, peripheral bone, cardiac, digestive, body-composition, dental,
    face, PUMA, and ALPACA models (e.g., `clin_ct_organs`, `clin_ct_body`,
    `clin_ct_lungs`, `clin_ct_cardiac`, `clin_ct_body_composition`,
    `clin_ct_fast_organs`), FDG-PET brain and face models (`clin_pt_fdg_brain_v1`,
    `clin_pt_fdg_face`), and clinical MR models (`clin_mr_FVM`).
  - **Preclinical imaging models**: preclinical CT leg-muscle segmentation
    (`preclin_ct_legs`: right and left leg muscles) and preclinical whole-body
    multi-organ MR segmentation (`preclin_mr_all`: 21 anatomical structures
    including brain, liver, kidneys, heart, lungs, spleen, bladder, stomach,
    pancreas, thyroid, aorta, adipose depots, and muscles).

  ### Model Storage & Read-Only Containers

  Model weights are not baked into this image and are downloaded on demand.
  Because Apptainer/Singularity images are read-only and `$HOME` is not
  assumed to be writable, this container redirects model storage and runtime
  caches (`MPLCONFIGDIR`, `XDG_CACHE_HOME`, `TORCH_HOME`) to a private
  per-user directory `/tmp/moosez-<uid>` by default.

  To keep downloaded model weights across sessions, set `MOOSEZ_MODELS_DIR` to
  a writable persistent directory:

  ```bash
  export MOOSEZ_MODELS_DIR=/path/to/persistent/moosez_models
  moosez -md clin_ct_organs
  moosez -d /path/to/subjects_dir -m clin_ct_organs
  ```

  Preclinical example:

  ```bash
  export MOOSEZ_MODELS_DIR=/path/to/persistent/moosez_models
  moosez -d /path/to/preclinical_subjects -m preclin_mr_all
  ```

  ### Documentation & Licensing

  - Code license: Apache-2.0 (`/opt/moosez/share/licenses/LICENSE.txt`)
  - Upstream repository: https://github.com/ENHANCE-PET/MOOSE
  - Documentation: https://moosez.rtfd.io/

icon: "data:image/png;base64,"
