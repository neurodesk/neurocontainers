name: plantseg
version: 2.2.0

copyright:
  - license: MIT
    url: https://github.com/kreshuklab/panseg/blob/{{ context.version }}/LICENSE

architectures:
  - x86_64

auto_update:
  method: webpage
  url: https://api.anaconda.org/package/conda-forge/panseg
  version_regex: '"latest_version"\s*:\s*"(?P<version>[0-9]+\.[0-9]+\.[0-9]+)"'

structured_readme:
  description: >-
    PlantSeg (renamed upstream to PanSeg as of v2.0) is an open-source deep
    learning pipeline and napari-based GUI for 2D and 3D instance segmentation
    of densely packed cells and nuclei in microscopy volumes. Both `plantseg`
    (with legacy `--gui` compatibility) and `panseg` commands are provided.
  example: |
    # Launch the PlantSeg / PanSeg napari GUI
    plantseg --gui
    # or equivalently:
    panseg --napari

    # Run a headless workflow from a YAML configuration file
    plantseg --config workflow.yaml
  documentation: https://kreshuklab.github.io/panseg/
  citation: |-
    Wolny, A., Cerrone, L., Vijayan, A., Tofanelli, R., Barro, A. V., Louveaux,
    M., Wenzl, C., Strauss, S., Wilson-Sánchez, D., Lymbouridou, R., Steigleder,
    S. S., Pape, C., Bailoni, A., Duran-Nebreda, S., Bassel, G. W., Lohmann,
    J. U., Tsiantis, M., Hamprecht, F. A., Schneitz, K., Maizel, A., & Kreshuk,
    A. (2020). Accurate and versatile 3D segmentation of plant tissues at
    cellular resolution. eLife, 9, e57613. https://doi.org/10.7554/eLife.57613

files:
  - name: plantseg-wrapper
    executable: true
    contents: |-
      #!/usr/bin/env bash
      set -euo pipefail

      cache_root="${PLANTSEG_CACHE_DIR:-${TMPDIR:-/tmp}/plantseg-$(id -u)}"
      export XDG_CACHE_HOME="${XDG_CACHE_HOME:-${cache_root}/cache}"
      export XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-${cache_root}/config}"
      export XDG_DATA_HOME="${XDG_DATA_HOME:-${cache_root}/data}"
      export BIOIMAGEIO_CACHE_PATH="${BIOIMAGEIO_CACHE_PATH:-${cache_root}/bioimageio}"
      export TORCH_HOME="${TORCH_HOME:-${cache_root}/torch}"
      export HF_HOME="${HF_HOME:-${cache_root}/huggingface}"
      export MPLCONFIGDIR="${MPLCONFIGDIR:-${cache_root}/matplotlib}"
      export NUMBA_CACHE_DIR="${NUMBA_CACHE_DIR:-${cache_root}/numba}"

      mkdir -p \
        "${XDG_CACHE_HOME}" \
        "${XDG_CONFIG_HOME}" \
        "${XDG_DATA_HOME}" \
        "${BIOIMAGEIO_CACHE_PATH}" \
        "${TORCH_HOME}" \
        "${HF_HOME}" \
        "${MPLCONFIGDIR}" \
        "${NUMBA_CACHE_DIR}"

      if [ -z "${HOME:-}" ] || [ ! -d "${HOME}" ] || [ ! -w "${HOME}" ]; then
        export HOME="${cache_root}"
      fi

      launcher="$(basename "$0")"
      if [ "${launcher}" = "plantseg-gui" ]; then
        exec /opt/miniconda/envs/plantseg/bin/panseg --napari "$@"
      fi

      # Translate legacy PlantSeg v1 --gui flag to PanSeg v2 --napari
      args=()
      for arg in "$@"; do
        if [ "${arg}" = "--gui" ]; then
          args+=(--napari)
        else
          args+=("${arg}")
        fi
      done
      exec /opt/miniconda/envs/plantseg/bin/panseg "${args[@]}"

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        CONDA_OVERRIDE_CUDA: "12.9"
        PATH: /usr/local/bin:/opt/miniconda/envs/plantseg/bin:/opt/miniconda/bin:$PATH
    - install:
        - ca-certificates
        - fonts-dejavu-core
        - libdbus-1-3
        - libegl1
        - libfontconfig1
        - libfreetype6
        - libgl1
        - libgl1-mesa-dri
        - libglib2.0-0
        - libglu1-mesa
        - libice6
        - libopengl0
        - libsm6
        - libx11-6
        - libx11-xcb1
        - libxcb-cursor0
        - libxcb-glx0
        - libxcb-icccm4
        - libxcb-image0
        - libxcb-keysyms1
        - libxcb-randr0
        - libxcb-render-util0
        - libxcb-render0
        - libxcb-shape0
        - libxcb-shm0
        - libxcb-sync1
        - libxcb-util1
        - libxcb-xfixes0
        - libxcb-xinerama0
        - libxcb-xkb1
        - libxcb1
        - libxext6
        - libxi6
        - libxkbcommon-x11-0
        - libxkbcommon0
        - libxrandr2
        - libxrender1
        - libxtst6
        - xauth
        - xvfb
    - template:
        name: miniconda
        version: py312_25.5.1-0
        install_path: /opt/miniconda
        env_name: plantseg
        env_exists: "false"
        mamba: "true"
        conda_opts: "--override-channels -c conda-forge"
        conda_install: >-
          python=3.13 panseg=={{ context.version }} pytorch=*=cuda129*
    - run:
        - install -m 0755 {{ get_file("plantseg-wrapper") }} /usr/local/bin/plantseg
        - ln -sf plantseg /usr/local/bin/panseg
        - ln -sf plantseg /usr/local/bin/plantseg-gui

deploy:
  path: []
  bins:
    - plantseg
    - panseg
    - plantseg-gui

gui_apps:
  - name: "PlantSeg (PanSeg)"
    exec: "plantseg-gui"

domains:
  - microscopy

categories:
  - image segmentation
  - machine learning
  - visualization

icon: data:image/png;base64,
