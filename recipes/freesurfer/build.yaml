name: freesurfer53
version: "5.3.0"
 
copyright:
  - license: LicenseRef-FreeSurfer
    url: https://surfer.nmr.mgh.harvard.edu/fswiki/FreeSurferSoftwareLicense
 
architectures:
  - x86_64
 
build:
  kind: neurodocker
  base-image: ubuntu:14.04
  pkg-manager: apt
  add-default-template: false
  add-tzdata: false
 
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
 
    # trusty is EOL: its Release files are long past Valid-Until, so apt refuses
    # them without this override. The archives themselves are still served from
    # archive.ubuntu.com (old-releases.ubuntu.com does NOT carry trusty).
    - run:
        - echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until
 
    - install:
        - bc
        - binutils
        - csh
        - libgl1-mesa-glx
        - libglib2.0-0
        - libglu1-mesa
        - libgomp1
        - libice6
        - libjpeg62
        - libsm6
        - libx11-6
        - libxext6
        - libxmu6
        - libxrender1
        - libxss1
        - libxt6
        - perl
        - psmisc
        - tar
        - tcsh
        - unzip
        - xterm
 
    - run:
        - mkdir -p /opt
        - tar -xzf {{ get_file("freesurfer_tar") }} -C /opt
        - mv /opt/freesurfer /opt/freesurfer-{{ context.version }}
 
    - copy:
        - license.txt
        - /opt/freesurfer-{{ context.version }}/license.txt
 
    - environment:
        FMRI_ANALYSIS_DIR: /opt/freesurfer-{{ context.version }}/fsfast
        FREESURFER_HOME: /opt/freesurfer-{{ context.version }}
        FSFAST_HOME: /opt/freesurfer-{{ context.version }}/fsfast
        FSF_OUTPUT_FORMAT: nii.gz
        FS_LICENSE: /opt/freesurfer-{{ context.version }}/license.txt
        FUNCTIONALS_DIR: /opt/freesurfer-{{ context.version }}/sessions
        LOCAL_DIR: /opt/freesurfer-{{ context.version }}/local
        MINC_BIN_DIR: /opt/freesurfer-{{ context.version }}/mni/bin
        MINC_LIB_DIR: /opt/freesurfer-{{ context.version }}/mni/lib
        MNI_DATAPATH: /opt/freesurfer-{{ context.version }}/mni/data
        MNI_DIR: /opt/freesurfer-{{ context.version }}/mni
        MNI_PERL5LIB: /opt/freesurfer-{{ context.version }}/mni/share/perl5
        OS: Linux
        PATH: $PATH:/opt/freesurfer-{{ context.version }}/bin:/opt/freesurfer-{{ context.version }}/fsfast/bin:/opt/freesurfer-{{ context.version }}/tktools:/opt/freesurfer-{{ context.version }}/mni/bin
        PERL5LIB: /opt/freesurfer-{{ context.version }}/mni/share/perl5
        SUBJECTS_DIR: /opt/freesurfer-{{ context.version }}/subjects
        TERM: xterm
 
    # Actually invoke the binaries: `test -x` passes even when a shared library
    # is missing, which is the failure mode these old CentOS 6 builds hit.
    - run:
        - test -s "$FS_LICENSE"
        - mri_convert --version
        - mris_convert --version
        - recon-all --version
        - freeview --help > /dev/null
 
deploy:
  path:
    - /opt/freesurfer-{{ context.version }}/bin/
    - /opt/freesurfer-{{ context.version }}/fsfast/bin/
  bins:
    - freeview
    - mri_convert
    - mris_convert
    - recon-all
 
readme: |-
  ----------------------------------
  ## freesurfer53/{{ context.version }} ##
 
  FreeSurfer 5.3.0 using the official CentOS 6 x86_64 distribution
  in an Ubuntu 14.04 container.
 
  Example:
  ```
  mkdir -p ~/freesurfer_output
  export SUBJECTS_DIR=~/freesurfer_output
  export SINGULARITYENV_SUBJECTS_DIR=$SUBJECTS_DIR
  recon-all -subject subjectname -i invol1.nii.gz -all
  ```
 
  Documentation:
  https://surfer.nmr.mgh.harvard.edu/fswiki/recon-all
 
  License:
  https://surfer.nmr.mgh.harvard.edu/fswiki/FreeSurferSoftwareLicense
  ----------------------------------
 
files:
  - name: freesurfer_tar
    url: https://surfer.nmr.mgh.harvard.edu/pub/dist/freesurfer/{{ context.version }}/freesurfer-Linux-centos6_x86_64-stable-pub-v{{ context.version }}.tar.gz
 
  - name: license.txt
    contents: |-
      s.bollmann@uq.edu.au
      53024
       *CgH0liqb0e9g
       FSVt2Z862iDJk
 
categories:
  - image segmentation
  - structural imaging
 
icon: data:image/svg+xml;base64,
