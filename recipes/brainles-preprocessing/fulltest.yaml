name: brainles-preprocessing
version: "0.6.14"
upstream_version: "0.6.14"

niftyreg_version: "1.5.77"
antspyx_version: "0.5.4"
arm_torch_version: "2.13.0"
env_setup: |
  set -euo pipefail
  export OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 MKL_NUM_THREADS=2 ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS=2

tests:
  - name: package imports
    command: python -c "import brainles_preprocessing; print('import ok')"
    expected_output_contains: "import ok"

  - name: reports the packaged version
    command: python -c "import importlib.metadata as md; print(md.version('brainles-preprocessing'))"
    expected_output_contains: "${upstream_version}"

  - name: the preprocessor entry points import
    command: python -c "from brainles_preprocessing.preprocessor import Preprocessor, AtlasCentricPreprocessor; print('preprocessors ok')"
    expected_output_contains: "preprocessors ok"

  - name: the preprocessor console script runs
    description: >-
      Up to 0.6.10, cli.py annotated output_dir as `str | Path`. Typer cannot
      build a parameter from a union type and raises at import, so every
      invocation failed -- including --help. Upstream fixed it in 0.6.13. The
      previous test only ran `command -v preprocessor`, which passes on a
      script that cannot start, so the broken CLI shipped and was exported.
    command: env NO_COLOR=1 TERM=dumb COLUMNS=200 preprocessor --help
    expected_output_contains: "output_dir"

  - name: the hd-bet console script runs
    description: >-
      As shipped, brainles_hd_bet 0.0.11's hd_bet.py imports maybe_mkdir_p
      from brainles_hd_bet.utils, which does not define it, so every
      invocation of the exported hd-bet command failed on ImportError --
      --help included. The recipe appends the missing one-line helper. Same
      lesson as the preprocessor script: `command -v` passes on a script that
      cannot start. The -mode/-device/-tta flags asserted here are also the
      only supported CPU brain-extraction route, since `preprocessor` cannot
      configure its extractor.
    command: env NO_COLOR=1 TERM=dumb COLUMNS=200 hd-bet --help
    expected_output_contains: "-mode"

  - name: the preprocessor atlas default is not a label
    description: >-
      input_atlas defaulted to the string "SRI24 BraTS atlas", which is a name,
      not a path, and the body only guards with `if input_atlas is not None` --
      so the default was passed through as atlas_image_path and registration
      failed on a missing file. None lets it fall through to the bundled atlas.
    command: |
      python -c "
      import inspect
      from brainles_preprocessing import cli
      print('input_atlas default:', repr(inspect.signature(cli.main).parameters['input_atlas'].default))
      "
    expected_output_contains: "input_atlas default: None"

  - name: the SRI24 atlas is bundled
    description: >-
      Atlases are fetched into a directory inside the installed package, which
      is read-only at run time, so without baking them the first atlas
      registration fails with Errno 30. This is also the only SRI24 template in
      the stack, and petu and gliomoda reject anything not on that grid.
    command: |
      python -c "
      import pathlib, brainles_preprocessing as m
      d = pathlib.Path(m.__file__).parent / 'registration' / 'atlases'
      # rglob: the files live in a version-stamped subfolder, which is
      # what upstream's resolver globs for
      names = sorted(p.name for p in d.rglob('*.nii*')) if d.is_dir() else []
      print('atlases', names)
      "
    expected_output_contains: "brats_sri24.nii"

  - name: the atlas resolves without touching the network
    description: >-
      Proves the baked copy is actually the one upstream finds, rather than a
      file that happens to sit nearby.
    command: |
      python -c "
      from brainles_preprocessing.utils.zenodo import fetch_atlases
      from brainles_preprocessing.constants import Atlas
      p = fetch_atlases() / Atlas.BRATS_SRI24.value
      print('resolved', p.is_file(), p.name)
      "
    expected_output_contains: "resolved True brats_sri24.nii"

  - name: the SynthStrip weights are bundled
    description: Same read-only problem as the atlases; SynthStrip is one of the brain extractors.
    command: |
      python -c "
      import pathlib, brainles_preprocessing as m
      d = pathlib.Path(m.__file__).parent / 'brain_extraction' / 'weights'
      n = len(list(d.rglob('*.pt'))) if d.is_dir() else 0
      print('synthstrip-weights', 'ok' if n else 'MISSING', n)
      "
    expected_output_contains: "synthstrip-weights ok"

  - name: SynthStrip extracts a brain on CPU
    description: >-
      The weights are baked and the extra is installed, but upstream's
      extract() defaulted to device="cuda" and raised RuntimeError on a
      CPU-only node -- which is what Neurodesk mostly runs -- from
      model.to(device), before any work happened. Importing the class and
      counting .pt files both pass against a container where SynthStrip can
      never run, so this runs it. No device argument is passed on purpose:
      that is the assertion, since the patched default is what turns a
      guaranteed crash into a working call. A crude head-like phantom is
      enough; what is being checked is that inference runs and returns a
      non-empty binary mask, not that the mask is anatomically right.
    command: |
      python -c "
      import numpy as np, nibabel as nib, tempfile, pathlib
      from brainles_preprocessing.brain_extraction.synthstrip import SynthStripExtractor
      d = pathlib.Path(tempfile.mkdtemp())
      g = np.mgrid[:96, :96, :96].astype(float)
      r = np.sqrt(((g - 48) ** 2).sum(0))
      vol = np.where(r < 34, 800.0, 0.0) + np.where((r >= 34) & (r < 40), 300.0, 0.0)
      nib.save(nib.Nifti1Image(vol.astype(np.float32), np.eye(4)), d / 'in.nii.gz')
      SynthStripExtractor().extract(
          input_image_path=str(d / 'in.nii.gz'),
          masked_image_path=str(d / 'brain.nii.gz'),
          brain_mask_path=str(d / 'mask.nii.gz'),
          num_threads=2,
      )
      m = np.asanyarray(nib.load(d / 'mask.nii.gz').dataobj)
      assert (m > 0).sum() > 0, 'empty mask'
      assert set(np.unique(m)) <= {0, 1}, np.unique(m)
      print('synthstrip-cpu-run ok', int((m > 0).sum()), 'voxels')
      "
    expected_output_contains: "synthstrip-cpu-run ok"
    # Model load plus inference does not fit the suite's default 120 s budget,
    # and a timeout kill is indistinguishable from a real failure in the report
    # the runner produces. Under a minute against the candidate SIF on a quiet
    # node, and 2 m 51 s reproducing it on a contended laptop with the same
    # package versions -- so this is slack for a loaded runner, not the
    # expected cost. Both runs segmented the same 176784 voxels.
    timeout: 600

  - name: the SynthStrip extractor imports
    description: >-
      The weights were baked but brain_extraction/synthstrip.py imports
      nipreps.synthstrip, which lives behind the package's `synthstrip` extra
      and was not installed -- so the extractor could not be constructed and
      the baked weights were dead payload. The recipe installs the extra.
    command: python -c "from brainles_preprocessing.brain_extraction.synthstrip import SynthStripExtractor; print('synthstrip extractor ok')"
    expected_output_contains: "synthstrip extractor ok"

  - name: runs outside HOME
    description: $HOME does not exist at container runtime.
    command: env HOME=/nonexistent python -c "import brainles_preprocessing; print('no-home ok')"
    expected_output_contains: "no-home ok"

  - name: HD-BET weights are bundled
    description: >-
      HDBetExtractor is the only brain extractor this package has, and
      brainles_hd_bet writes its weights into its own package directory, which
      is read-only at run time. Without them the brain-extraction stage fails
      and the container cannot produce the skull-stripped input its atlas
      registration exists to consume.
    command: |
      python -c "
      import pathlib
      from brainles_hd_bet.utils import folder_with_parameter_files as d
      folds = sorted(p.name for p in pathlib.Path(d).glob('*.model'))
      print('hd-bet-folds', len(folds), folds)
      "
    expected_output_contains: "hd-bet-folds 5"

  - name: brain extraction is configurable from the CLI
    description: >-
      As shipped, the CLI passed no brain_extractor, so the preprocessor
      substituted HDBetExtractor's own defaults -- mode="accurate", device=0,
      do_tta=True, which is 40 forward passes. On a CPU-only node a measured
      run reached brain extraction in 157 s and produced no mask in the
      following 1643 s, while hd-bet at mode=fast/device=cpu/no-tta did the
      same extraction in 934 s: the advertised one-shot command could not ask
      for what the image's other command does in 15 minutes. Checked against
      click's parsed option set rather than the rendered help, which typer
      lays out as a rich table and truncates at whatever width it guessed, and
      the forwarding is exercised because a flag that parses and changes
      nothing is the defect this replaced.
    command: |
      python -c "
      import typer, typer.main
      from brainles_preprocessing.brain_extraction.hd_bet import HDBetExtractor
      from brainles_preprocessing.cli import app, _ProfiledHDBetExtractor as E

      cmd = typer.main.get_command(app)
      opts = {o for p in cmd.params for o in p.opts + p.secondary_opts}
      wanted = ('--bet-mode', '--bet-device', '--bet-tta', '--no-bet-tta')
      missing = [f for f in wanted if f not in opts]
      assert not missing, 'missing %s, have %s' % (missing, sorted(opts))

      seen = {}
      HDBetExtractor.extract = lambda self, *a, **k: seen.update(k)

      # The CPU profile has to arrive at HD-BET intact.
      E(mode='fast', device='cpu', do_tta=False).extract()
      assert seen == {'mode': 'fast', 'device': 'cpu', 'do_tta': False}, seen

      # And upstream's GPU defaults must be untouched, so a GPU run behaves as
      # it did before. device is an int because net.cuda('0') raises.
      seen.clear()
      E().extract()
      assert seen == {'mode': 'accurate', 'device': 0, 'do_tta': True}, seen

      # A bad value is a usage error up front, not an exception 157 s into the
      # run, which is where upstream checks the mode and never checks device.
      for bad in ({'mode': 'fst'}, {'device': 'cuda'}):
          try:
              E(**bad)
          except typer.BadParameter:
              pass
          else:
              raise AssertionError('accepted %r' % bad)
      print('bet-profile-configurable')
      "
    expected_output_contains: "bet-profile-configurable"

  - name: the brain extractor imports
    description: Guards the path from brainles_preprocessing through to brainles_hd_bet.
    command: python -c "from brainles_preprocessing.brain_extraction import HDBetExtractor; print('hdbet extractor ok')"
    expected_output_contains: "hdbet extractor ok"

  - name: Native dependency closure and actual CPU tensor operation
    command: |
      python -m pip check
      python - <<'PYTHON'
      import importlib.metadata as md
      import platform
      import struct
      from pathlib import Path
      import brainles_preprocessing
      import torch
      assert md.version('brainles-preprocessing')=='${upstream_version}'
      root=Path(brainles_preprocessing.__file__).parent/'registration'/'niftyreg'/'niftyreg_scripts'
      expected=183 if platform.machine()=='aarch64' else 62
      for name in ['reg_aladin','reg_resample']:
          path=root/name
          with path.open('rb') as f: header=f.read(20)
          assert header[:4]==b'\x7fELF' and header[5]==1
          assert struct.unpack('<H',header[18:20])[0]==expected,(name,header)
          if expected==183:
              assert path.is_symlink() and path.resolve()==Path('/opt/brainles-niftyreg-${niftyreg_version}/bin')/name
      if expected==183:
          assert md.version('antspyx')=='${antspyx_version}'
          assert md.version('torch').split('+')[0]=='${arm_torch_version}'
          assert torch.version.cuda is None
      x=torch.arange(15,dtype=torch.float32).reshape(3,5)
      assert torch.equal(x@x.T,torch.tensor([[30,80,130],[80,255,430],[130,430,730]],dtype=torch.float32))
      print('Exact BrainLesion version, native registration executables and CPU tensor operation verified')
      PYTHON
    timeout: 120
    expected_output_contains: Exact BrainLesion version, native registration executables and CPU tensor operation verified
    expected_exit_code: 0

  - name: Both actual native registration backends
    command: |
      python - <<'PYTHON'
      import hashlib
      import os
      import tempfile
      from pathlib import Path
      import numpy as np
      import nibabel as nib
      from brainles_preprocessing.registration.ANTs.ANTs import ANTsRegistrator
      from brainles_preprocessing.registration.niftyreg.niftyreg import NiftyRegRegistrator

      os.environ['ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS'] = '2'
      with tempfile.TemporaryDirectory(prefix='brainles-registration-') as scratch:
          d = Path(scratch)
          grid = np.mgrid[:96, :96, :96].astype(np.float64)
          data = np.zeros((96,96,96), dtype=np.float64)
          for amplitude, centre, widths in [(100,(35,43,49),(8,11,10)),(65,(62,55,38),(7,9,8)),(40,(47,30,65),(6,8,7))]:
              delta = (grid - np.asarray(centre)[:,None,None,None]) / np.asarray(widths)[:,None,None,None]
              data += amplitude * np.exp(-0.5 * (delta**2).sum(0))
          data = data.astype(np.float32)
          affine = np.diag([1.5,2.0,2.5,1.0]); affine[:3,3] = [-71.25,-95,-118.75]
          source = d/'asymmetric.nii.gz'; nib.save(nib.Nifti1Image(data,affine),source)
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          backends = [('ANTs',ANTsRegistrator(registration_params={'type_of_transform':'Translation','aff_metric':'meansquares','aff_random_sampling_rate':1,'random_seed':7,'aff_iterations':(100,50,10),'aff_shrink_factors':(4,2,1),'aff_smoothing_sigmas':(2,1,0)}),'.mat','nearestNeighbor'),('NiftyReg',NiftyRegRegistrator(),'.txt','0')]
          for name,backend,extension,interpolator in backends:
              registered=d/(name+'-registered.nii.gz'); matrix=d/(name+extension); log=d/(name+'-registration.log')
              backend.register(fixed_image_path=str(source),moving_image_path=str(source),transformed_image_path=str(registered),matrix_path=str(matrix),log_file_path=str(log))
              assert matrix.is_file() and matrix.stat().st_size>0, (name,log.read_text() if log.exists() else 'missing log')
              assert registered.is_file(), (name,log.read_text() if log.exists() else 'missing log')
              output=d/(name+'-nearest.nii.gz')
              backend.transform(fixed_image_path=str(source),moving_image_path=str(source),transformed_image_path=str(output),matrix_path=str(matrix),log_file_path=str(d/(name+'-transform.log')),interpolator=interpolator)
              assert output.is_file(), (name,list(d.iterdir()))
              image=nib.load(output); result=np.asanyarray(image.dataobj)
              assert np.isfinite(result).all() and np.count_nonzero(result)>0
              np.testing.assert_array_equal(result,data)
              np.testing.assert_allclose(image.affine,affine,rtol=0,atol=4*np.finfo(np.float32).eps*np.max(np.abs(affine)))
              np.testing.assert_array_equal(image.header.get_zooms(),(1.5,2,2.5))
              assert hashlib.sha256(source.read_bytes()).hexdigest()==digest
              if name=='NiftyReg':
                  learned=np.loadtxt(matrix);assert learned.shape==(4,4) and np.isfinite(learned).all()
                  inverse=d/'inverse.txt';backend._invert_affine_transform(matrix,inverse)
                  composed=d/'composed.txt';backend._compose_affine_transforms([matrix,inverse],composed)
                  np.testing.assert_allclose(np.loadtxt(composed),np.eye(4),rtol=0,atol=1e-10)
              print(name,'actual registration and nearest-neighbour transformation preserved every884736 voxel and physical geometry',flush=True)
      print('Both native registration backends completed their real public registration and transform operations')
      PYTHON
    timeout: 600
    expected_output_contains: Both native registration backends completed their real public registration and transform operations
    expected_exit_code: 0

  - name: HD-BET CPU inference inside the read-only SIF
    command: |
      python - <<'PYTHON'
      import hashlib
      import os
      import subprocess
      import tempfile
      from pathlib import Path
      import numpy as np
      import SimpleITK as sitk
      from brainles_hd_bet.utils import folder_with_parameter_files

      def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
      models=sorted(Path(folder_with_parameter_files).glob('*.model'))
      assert len(models)==5
      before={p.name:sha(p) for p in models}
      with tempfile.TemporaryDirectory(prefix='brainles-hdbet-') as scratch:
          d=Path(scratch);rng=np.random.RandomState(0)
          volume=rng.normal(0,10,(64,64,64)).astype(np.float32)
          zz,yy,xx=np.mgrid[:64,:64,:64];sphere=((zz-32)**2+(yy-32)**2+(xx-32)**2)<=20**2
          volume[sphere]+=100
          original=sitk.GetImageFromArray(volume);original.SetSpacing((1.5,1.5,1.5))
          original.SetOrigin((-47.25,-47.25,-47.25))
          source=d/'input.nii.gz';sitk.WriteImage(original,str(source));digest=sha(source)
          output=d/'brain.nii.gz';mask_path=d/'brain_mask.nii.gz'
          subprocess.run(['hd-bet','-i',str(source),'-o',str(output),'-mode','fast','-device','cpu','-tta','0'],check=True,timeout=1500)
          assert output.is_file() and mask_path.is_file()
          mask_image=sitk.ReadImage(str(mask_path));out_image=sitk.ReadImage(str(output))
          mask=sitk.GetArrayFromImage(mask_image);out=sitk.GetArrayFromImage(out_image)
          assert mask.shape==volume.shape and out.shape==volume.shape
          assert set(np.unique(mask))=={0,1} and 0<mask.sum()<mask.size
          assert np.isfinite(out).all()
          np.testing.assert_array_equal(out,volume*mask)
          for image in [mask_image,out_image]:
              assert image.GetSpacing()==original.GetSpacing()
              assert image.GetOrigin()==original.GetOrigin()
              assert image.GetDirection()==original.GetDirection()
          assert sha(source)==digest
          assert {p.name:sha(p) for p in models}==before
          print('Actual HD-BET CPU inference produced a nontrivial binary mask and every262144 masked voxel with unchanged physical geometry, input and all5 checkpoints')
      PYTHON
    timeout: 1800
    expected_output_contains: Actual HD-BET CPU inference produced a nontrivial binary mask and every262144 masked voxel with
      unchanged physical geometry, input and all5 checkpoints
    expected_exit_code: 0
