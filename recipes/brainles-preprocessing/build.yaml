  - name: install_native_niftyreg.py
    contents: |
      import importlib.util
      import shutil
      from pathlib import Path
      root=Path(importlib.util.find_spec('brainles_preprocessing').origin).parent/'registration'/'niftyreg'/'niftyreg_scripts'
      prefix=Path('/opt/brainles-niftyreg-{{ context.niftyreg_version }}')
      for name in ['reg_aladin','reg_resample']:
          target=root/name
          target.unlink()
          target.symlink_to(prefix/'bin'/name)
      # The unused x86 SDK must not remain falsely presented as an ARM installation.
      for sdk in root.glob('niftyreg_*'):
          if sdk.is_dir(): shutil.rmtree(sdk)
      (root/'niftyreg_{{ context.niftyreg_version }}').symlink_to(prefix,target_is_directory=True)
      print('BrainLesion NiftyReg backend points to the native released SDK')
  - name: install_hdbet_models.py
    contents: |
      import shutil
      import sys
      from pathlib import Path
      from brainles_hd_bet.utils import folder_with_parameter_files

      destination = Path(folder_with_parameter_files)
      destination.mkdir(parents=True, exist_ok=True)
      for fold, source in enumerate(sys.argv[1:]):
          shutil.copyfile(source, destination / (str(fold) + ".model"))
