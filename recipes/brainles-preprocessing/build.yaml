build:
  kind: neurodocker
  base-image: "{{ context.base_image }}"
  pkg-manager: apt

  directives:
    - install:
        - git
        - wget
        - ca-certificates
        - unzip
        - libgomp1

    - condition: arch == "aarch64"
      install:
        - build-essential
        - cmake
        - libjpeg-dev
        - libpng-dev
        - libstdc++6
        - libtiff-dev
        - zlib1g-dev
    - condition: arch == "aarch64"
      run:
        - git clone --branch v{{ context.niftyreg_version }} --depth 1 https://github.com/KCL-BMEIS/niftyreg.git /tmp/brainles-niftyreg-source
        - cmake -S /tmp/brainles-niftyreg-source -B /tmp/brainles-niftyreg-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/brainles-niftyreg-{{ context.niftyreg_version }} -DUSE_SSE=OFF -DUSE_CUDA=OFF -DUSE_OPENCL=OFF
        - cmake --build /tmp/brainles-niftyreg-build --parallel 2
        - cmake --install /tmp/brainles-niftyreg-build
        - rm -rf /tmp/brainles-niftyreg-source /tmp/brainles-niftyreg-build

    - template:
        name: miniconda
        version: py311_24.9.2-0
        conda_install: "python=3.11.10 pip=24.2"
        env_name: brainles
        env_exists: "false"

    - condition: arch == "aarch64"
      run:
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python -m pip install --no-cache-dir "torch=={{ context.arm_torch_version }}" --index-url https://download.pytorch.org/whl/cpu
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python -m pip install --no-cache-dir --no-binary=antspyx "antspyx=={{ context.antspyx_version }}"
        - ln -sf /usr/lib/aarch64-linux-gnu/libstdc++.so.6 /opt/miniconda-py311_24.9.2-0/envs/brainles/lib/libstdc++.so.6

    - run:
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python -m pip install --no-cache-dir brainles-preprocessing=={{ context.upstream_version }}
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python -c "import brainles_preprocessing; print('brainles-preprocessing OK')"

    - run:
        # SynthStrip is one of the two brain extractors this package exposes and
        # its weights are baked in below, but it lives behind an optional extra:
        # brain_extraction/synthstrip.py imports nipreps.synthstrip, so without
        # this SynthStripExtractor could not be imported and the baked weights
        # were dead payload.
        #
        # nitransforms is pinned because it is what forces the version choice:
        # 25.x requires numpy>=2.0 while brainles-preprocessing requires
        # numpy<2.0, so an unpinned resolve either backtracks a long way or
        # lands on an unsatisfiable pair. 24.1.x accepts numpy>=1.21.
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python -m pip install --no-cache-dir "nitransforms>=24.1,<25" "nipreps-synthstrip>=0.0.1,<0.0.2"
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python -c "from brainles_preprocessing.brain_extraction.synthstrip import SynthStripExtractor; print('synthstrip extractor ok')"

    - condition: arch == "aarch64"
      run:
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python {{ get_file("install_native_niftyreg.py") }}
    - run:
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python -m pip check

    - run:
        # The `preprocessor` console script fails on every invocation as
        # shipped. See the patch.
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python {{ get_file("fix_preprocessor_cli") }}
        # `hd-bet` has the same disease: hd_bet.py imports maybe_mkdir_p from
        # brainles_hd_bet.utils, which never defines it, so the script dies on
        # ImportError before parsing an argument. See the patch.
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python {{ get_file("fix_hdbet_cli") }}
        # SynthStrip -- the other bundled extractor, whose extra this recipe
        # installs and whose weights it bakes -- defaulted to device="cuda" and
        # raised RuntimeError on a CPU-only node before doing any work. See the
        # patch: only the unspecified case changes.
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python {{ get_file("fix_synthstrip_device") }}
        # Fail the build rather than ship a command that cannot start. This is
        # the check that was missing: the recipe exported the script and the
        # test only looked for it on PATH, which passes on a broken script.
        # Gate EVERY deployed console script, not just the one that was
        # reported broken first.
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/preprocessor --help > /dev/null && echo "preprocessor --help ok"
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/hd-bet --help > /dev/null && echo "hd-bet --help ok"
        # The brain-extraction flags have to reach HD-BET, not merely parse: a
        # flag that parses and changes nothing is the hours-per-volume default
        # it was added to escape. Asked of click's parsed option set rather
        # than of --help, which typer renders as a rich table and truncates at
        # whatever width it guesses.
        - >-
          /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python -c "import typer; from brainles_preprocessing import cli; c=typer.main.get_command(cli.app); n=set(); [n.update(p.opts+p.secondary_opts) for p in c.params]; need={'--bet-mode','--bet-device','--bet-tta','--no-bet-tta'}; assert need <= n, 'missing '+str(sorted(need-n)); print('bet profile selectable')"
        - >-
          /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python -c "from brainles_preprocessing.brain_extraction.hd_bet import HDBetExtractor; from brainles_preprocessing.cli import _ProfiledHDBetExtractor as E; seen={}; HDBetExtractor.extract=lambda self,*a,**k: seen.update(k); E(mode='fast',device='cpu',do_tta=False).extract(); assert seen=={'mode':'fast','device':'cpu','do_tta':False}, seen; seen.clear(); E().extract(); assert seen=={'mode':'accurate','device':0,'do_tta':True}, seen; print('bet profile reaches hd-bet')"
        # SynthStrip must pick a device rather than assume one. Asserted on the
        # resolution alone so the build does not pay for model load twice --
        # the fulltest runs a real CPU extraction with no device argument. Both
        # branches are checked, so the GPU behaviour this must not change is
        # covered on a runner that has no GPU.
        - >-
          /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python -c "import inspect, torch; from brainles_preprocessing.brain_extraction.synthstrip import SynthStripExtractor as S; assert inspect.signature(S.extract).parameters['device'].default is None, 'device default not patched'; torch.cuda.is_available=lambda: False; assert S._resolve_device(None)==torch.device('cpu'), S._resolve_device(None); torch.cuda.is_available=lambda: True; assert S._resolve_device(None)==torch.device('cuda'), S._resolve_device(None); assert S._resolve_device('cpu')==torch.device('cpu'); assert S._resolve_device(torch.device('cuda:1'))==torch.device('cuda:1'); print('synthstrip picks a device')"

    - run:
        # python itself is deliberately not exported (see deploy), so give the
        # library a named interpreter rather than no route in at all.
        - install -m 0755 {{ get_file("preprocessing_python_helper") }} /usr/local/bin/brainles-preprocessing-python
        - brainles-preprocessing-python -c "import brainles_preprocessing; print('wrapper ok')"

    - run:
        # Bake the atlases and SynthStrip weights into the image.
        #
        # Without this the container cannot do the one job it exists for. Both
        # are fetched on demand into directories inside the installed package
        # (registration/atlases and brain_extraction/weights), which are on the
        # read-only squashfs at run time, so the first atlas registration fails.
        # There is also no other source: no container in the stack ships an
        # SRI24 template, so a user asked to produce atlas-space input for petu
        # or gliomoda had no supported route to one.
        #
        # Fetched per file rather than through upstream's fetch_atlases(), which
        # requests Zenodo's files-archive endpoint. That endpoint is unreliable
        # for these records, and the per-file API is what actually works. Adds
        # about 120 MB.
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python {{ get_file("bake_atlases.py") }}
        # HD-BET weights too. HDBetExtractor is the only brain extractor this
        # package has, and brainles_hd_bet writes its weights into its own
        # package directory, so without this the brain-extraction stage fails
        # the same way -- which would leave the container unable to produce the
        # skull-stripped input its atlas registration is for.
        #
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python {{ get_file("install_hdbet_models.py") }} {{ get_file("hdbet_0_model") }} {{ get_file("hdbet_1_model") }} {{ get_file("hdbet_2_model") }} {{ get_file("hdbet_3_model") }} {{ get_file("hdbet_4_model") }}
        - >-
          /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python -c "import pathlib; from brainles_hd_bet.utils import folder_with_parameter_files as d; f=sorted(pathlib.Path(d).glob('*.model')); assert len(f)==5, [x.name for x in f]; print('hd-bet folds:', [x.name for x in f])"
        # Fail the build rather than ship an image that cannot register.
        # Assert through upstream's own resolver, not by looking for files: the
        # files must sit in the version-stamped folder ZenodoRecord globs for,
        # or fetch_atlases() ignores them and tries to download at run time.
        - >-
          /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python -c "from brainles_preprocessing.utils.zenodo import fetch_atlases; from brainles_preprocessing.constants import Atlas; p=fetch_atlases()/Atlas.BRATS_SRI24.value; assert p.is_file(), p; print('atlases resolve to', p)"
        - >-
          /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python -c "from brainles_preprocessing.utils.zenodo import fetch_synthstrip; p=fetch_synthstrip(); assert p.is_dir() and any(p.iterdir()), p; print('synthstrip resolves to', p)"

    - run:
        # The --help gates prove the console scripts start; N2 was a command
        # that starts and cannot finish. This is the next rung: one synthetic
        # volume through the exported hd-bet command at the CPU profile the
        # README recommends, loading the baked fold-0 weights and producing a
        # real mask. Runs after the bake directive because it needs them.
        #
        # The cost was measured before this was added, because HD-BET pads
        # every input to its 128^3 training patch (config.py: val_min_size =
        # INPUT_PATCH_SIZE), so no input is cheaper than one full-size forward
        # pass: ~40 s of CPU and ~5.6 GB peak RSS for the whole command. Both
        # fit the x86_64 build runner, which already builds this multi-GB
        # image. See the script's docstring for the reproducibility argument.
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python {{ get_file("hdbet_gate.py") }} make /tmp/hdbet_gate.nii.gz
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/hd-bet -i /tmp/hdbet_gate.nii.gz -o /tmp/hdbet_gate_bet.nii.gz -mode fast -device cpu -tta 0
        - /opt/miniconda-py311_24.9.2-0/envs/brainles/bin/python {{ get_file("hdbet_gate.py") }} check /tmp/hdbet_gate_bet_mask.nii.gz
