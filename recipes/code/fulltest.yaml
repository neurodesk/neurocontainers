  # ==========================================================================
  # COMPREHENSIVE WORKFLOW TEST
  # ==========================================================================
  - name: Complete analysis pipeline
    description: Run a complete neuroimaging analysis pipeline
    command: |
      python -c "
      import nibabel as nib
      import numpy as np
      import pandas as pd
      from scipy import ndimage
      import matplotlib
      matplotlib.use('Agg')
      import matplotlib.pyplot as plt

      # Load data
      bold = nib.load('${bold}')
      bold_data = bold.get_fdata()

      # 1. Calculate temporal mean
      tmean = np.mean(bold_data, axis=3)

      # 2. Create brain mask (simple threshold)
      threshold = np.percentile(tmean, 30)
      mask = tmean > threshold

      # 3. Calculate tSNR within mask
      tstd = np.std(bold_data, axis=3)
      tstd[tstd == 0] = np.nan
      tsnr = tmean / tstd
      tsnr[~mask] = 0

      # 4. Extract global signal
      masked_data = bold_data * mask[..., np.newaxis]
      global_signal = np.mean(masked_data, axis=(0, 1, 2))

      # 5. Save results
      nib.save(nib.Nifti1Image(tmean.astype(np.float32), bold.affine),
               '${output_dir}/pipeline_tmean.nii.gz')
      nib.save(nib.Nifti1Image(mask.astype(np.float32), bold.affine),
               '${output_dir}/pipeline_mask.nii.gz')
      nib.save(nib.Nifti1Image(tsnr.astype(np.float32), bold.affine),
               '${output_dir}/pipeline_tsnr.nii.gz')

      # 6. Save timeseries
      pd.DataFrame({'volume': range(len(global_signal)), 'signal': global_signal}).to_csv(
          '${output_dir}/pipeline_global_signal.csv', index=False)

      # 7. Create summary plot
      fig, axes = plt.subplots(2, 2, figsize=(12, 10))
      axes[0, 0].imshow(tmean[:, :, tmean.shape[2]//2].T, cmap='gray', origin='lower')
      axes[0, 0].set_title('Temporal Mean')
      axes[0, 1].imshow(mask[:, :, mask.shape[2]//2].T, cmap='gray', origin='lower')
      axes[0, 1].set_title('Brain Mask')
      axes[1, 0].imshow(tsnr[:, :, tsnr.shape[2]//2].T, cmap='hot', origin='lower')
      axes[1, 0].set_title('tSNR')
      axes[1, 1].plot(global_signal)
      axes[1, 1].set_title('Global Signal')
      axes[1, 1].set_xlabel('Volume')
      plt.tight_layout()
      plt.savefig('${output_dir}/pipeline_summary.png', dpi=100)
      plt.close()

      print('Pipeline complete')
      print('Files created: tmean, mask, tsnr, global_signal, summary plot')
      "
    expected_output_contains: "Pipeline complete"
    validate:
      - output_exists: ${output_dir}/pipeline_tmean.nii.gz
      - output_exists: ${output_dir}/pipeline_mask.nii.gz
      - output_exists: ${output_dir}/pipeline_tsnr.nii.gz
      - output_exists: ${output_dir}/pipeline_global_signal.csv
      - output_exists: ${output_dir}/pipeline_summary.png

  - name: Execute a real native Jupyter kernel
    description: Execute a Python notebook through the installed kernel, independently verify analytical least-squares coefficients
      and every HDF5 voxel written by that kernel
    command: |
      python - <<'PYTHON'
      import json
      import os
      from pathlib import Path
      import sys
      import tempfile
      import nbformat
      from nbclient import NotebookClient
      import numpy as np

      with tempfile.TemporaryDirectory(dir=Path('${output_dir}').resolve()) as directory:
          root=Path(directory)
          notebook=nbformat.v4.new_notebook(cells=[nbformat.v4.new_code_cell("""
      import json,sys,platform
      from pathlib import Path
      import numpy as np
      import h5py
      x=np.array([-2,-1,0,1,2],dtype=np.float64)
      y=2+3*x
      coefficients=np.linalg.lstsq(np.column_stack([np.ones(5),x]),y,rcond=None)[0]
      data=np.arange(9*11*13,dtype=np.float32).reshape((9,11,13))
      with h5py.File('kernel-data.h5','w') as stream:stream['image']=data
      Path('kernel-result.json').write_text(json.dumps({'python':sys.version_info[:2],'machine':platform.machine(),'coefficients':coefficients.tolist(),'sum':int(data.sum())}))
      print('Native Jupyter kernel executed the analytical fit and HDF5 operation')
      """)])
          client=NotebookClient(notebook,timeout=120,kernel_name='python3',resources={'metadata':{'path':str(root)}})
          executed=client.execute()
          assert executed.cells[0].execution_count==1
          assert not any(output.output_type=='error' for output in executed.cells[0].outputs)
          import platform,h5py
          result=json.loads((root/'kernel-result.json').read_text())
          assert result['python']==[3,11] and result['machine']==platform.machine()
          np.testing.assert_allclose(result['coefficients'],[2,3],rtol=0,atol=64*np.finfo(np.float64).eps)
          expected=np.arange(9*11*13,dtype=np.float32).reshape((9,11,13))
          assert result['sum']==int(expected.sum())
          with h5py.File(root/'kernel-data.h5','r') as stream:np.testing.assert_array_equal(stream['image'][:],expected)
          print('Real native Python Jupyter kernel recovered the exact analytical coefficients and every1287 HDF5 image voxel')
      PYTHON
    timeout: 180
    expected_exit_code: 0
    expected_output_contains: Real native Python Jupyter kernel recovered the exact analytical coefficients and every1287 HDF5
      image voxel
  - name: Render the real VSCode editor document
    description: Launch the actual installed editor under native Xvfb, require the named document window and a nonblank rendered
      image, preserve source bytes and clean up the private process group
    command: |
      env -u HOME xvfb-run -a python - <<'PYTHON'
      import hashlib
      import os
      from pathlib import Path
      import signal
      import subprocess
      import tempfile
      import time
      from PIL import Image

      with tempfile.TemporaryDirectory(prefix='code-gui-',dir='/tmp') as directory:
          root=Path(directory);home=root/'home';home.mkdir();runtime=root/'runtime';runtime.mkdir(mode=0o700)
          assert len(os.fsencode(str(runtime)))<50, 'Keep editor Unix sockets below the Linux107-byte pathname limit'
          source=root/'neurocontainers-proof.py';source.write_text('values = [1, 2, 3, 4, 5]\nassert sum(values) == 15\nprint("Native ARM and x86 editor proof")\n')
          original=hashlib.sha256(source.read_bytes()).hexdigest()
          env=os.environ.copy();env.update(HOME=str(home),XDG_RUNTIME_DIR=str(runtime),XDG_CACHE_HOME=str(home/'.cache'),XDG_CONFIG_HOME=str(home/'.config'))
          log_path=root/'editor.log'
          with log_path.open('wb') as log:
              process=subprocess.Popen(['/usr/local/sbin/code','--verbose','--user-data-dir='+str(root/'profile'),'--disable-gpu','--skip-welcome','--skip-release-notes','--new-window','--wait',str(source)],env=env,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
              try:
                  deadline=time.monotonic()+90
                  while True:
                      assert process.poll() is None,('Code CLI early exit',process.returncode,log_path.read_text(errors='replace'))
                      found=subprocess.run(['xdotool','search','--onlyvisible','--name','neurocontainers-proof.py'],capture_output=True,text=True)
                      if found.returncode==0 and found.stdout.strip():break
                      assert time.monotonic()<deadline,log_path.read_text(errors='replace')
                      time.sleep(0.5)
                  window=found.stdout.splitlines()[0]
                  title=subprocess.check_output(['xdotool','getwindowname',window],text=True)
                  assert 'neurocontainers-proof.py' in title and 'Visual Studio Code' in title,title
                  # Wait for the editor renderer to paint the mapped document window.
                  time.sleep(2)
                  screenshot=root/'editor.png'
                  subprocess.run(['import','-window',window,str(screenshot)],check=True,timeout=30)
                  with Image.open(screenshot) as image:
                      assert image.width>=400 and image.height>=300
                      assert len(set(image.convert('RGB').resize((256,256)).getdata()))>32
                  assert process.poll() is None
                  assert hashlib.sha256(source.read_bytes()).hexdigest()==original
                  print('Actual native VSCode mapped and rendered the named Python document with unchanged file bytes')
              except BaseException:
                  print(log_path.read_text(errors='replace'))
                  raise
              finally:
                  if process.poll() is None:
                      os.killpg(process.pid,signal.SIGTERM)
                      try:process.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid,signal.SIGKILL);process.wait(timeout=10)
      PYTHON
    timeout: 150
    expected_exit_code: 0
    expected_output_contains: Actual native VSCode mapped and rendered the named Python document with unchanged file bytes
  - name: Build and execute a native nested Singularity SIF
    description: Use the packaged SingularityCE to build a local native rootfs/SquashFS SIF, then actually execute its exact
      marker/CPU architecture in userns/contain/cleanenv; no registry or emulation. Separate PID/IPC namespaces are not claimed.
    command: |
      set -euo pipefail
      task_dir=$(mktemp -d "${output_dir}/nested.XXXXXX")
      rootfs="$task_dir/rootfs"
      mkdir -p "$rootfs"/{etc,proc,sys,dev,tmp,var/tmp,root}
      # Copy native executables and their resolved shared libraries. This uses
      # the tested image itself and cannot accidentally fetch another image.
      for executable in /bin/sh "$(command -v uname)"; do
        cp -L --parents "$executable" "$rootfs"
        ldd "$executable" > "$task_dir/ldd.txt"
        awk '/=> \// {print $3} /^[[:space:]]*\// {print $1}' "$task_dir/ldd.txt" > "$task_dir/libraries.txt"
        test -s "$task_dir/libraries.txt"
        while IFS= read -r library; do
          test -f "$library"
          cp -L --parents "$library" "$rootfs"
        done < "$task_dir/libraries.txt"
      done
      printf 'nested native execution\n' > "$rootfs/etc/neurocontainers-nested"
      # Outer Apptainer binds must not be propagated to the nested runtime.
      unset APPTAINER_BIND APPTAINER_BINDPATH SINGULARITY_BIND SINGULARITY_BINDPATH
      export SINGULARITY_CACHEDIR="$task_dir/cache"
      export SINGULARITY_TMPDIR="$task_dir/tmp"
      mkdir -p "$SINGULARITY_CACHEDIR" "$SINGULARITY_TMPDIR"
      singularity build --disable-cache "$task_dir/nested.sif" "$rootfs"
      test -s "$task_dir/nested.sif"
      singularity sif list "$task_dir/nested.sif" > "$task_dir/sif-list.txt"
      grep -q 'FS (Squashfs' "$task_dir/sif-list.txt"
      # Separate PID namespaces require unmasked /proc on the host runner.
      singularity exec --userns --contain --no-home --cleanenv --pwd / "$task_dir/nested.sif" /bin/sh -c \
        'IFS= read -r marker < /etc/neurocontainers-nested; printf "%s\n" "$marker"; uname -m' > "$task_dir/actual.txt"
      printf 'nested native execution\n%s\n' "$(uname -m)" > "$task_dir/expected.txt"
      cmp "$task_dir/expected.txt" "$task_dir/actual.txt"
      echo 'Native nested SIF construction and execution verified'
    timeout: 300
    expected_exit_code: 0
    expected_output_contains: Native nested SIF construction and execution verified

