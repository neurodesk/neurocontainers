name: pymol
version: 3.1.0

copyright:
  - license: other-open
    name: PyMOL Open-Source License (Schrodinger, Inc.)
    url: https://github.com/schrodinger/pymol-open-source/blob/master/LICENSE

architectures:
  - x86_64
  - aarch64

structured_readme:
  description: >-
    Open-Source PyMOL is a molecular and volumetric 3D visualization system
    widely used for structural biology, cryo-EM density maps (MRC/CCP4),
    protein structures (PDB/mmCIF), and publication-quality ray-traced figures.
  example: |
    # Launch the PyMOL GUI
    pymol

    # Run PyMOL headlessly to inspect a structure or render a script
    pymol -c -q -d "print(cmd.get_version()); quit"
  documentation: https://pymolwiki.org/
  citation: |-
    The PyMOL Molecular Graphics System, Version 3.1.0, Open-Source build,
    Schrödinger, LLC. https://github.com/schrodinger/pymol-open-source

auto_update:
  method: webpage
  url: https://api.anaconda.org/package/conda-forge/pymol-open-source
  version_regex: '"latest_version"\s*:\s*"(?P<version>[0-9]+\.[0-9]+\.[0-9]+)"'

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
    - install:
        - fontconfig
        - libegl1
        - libgl1
        - libglib2.0-0
        - libglu1-mesa
        - libglx-mesa0
        - libx11-6
        - libxkbcommon-x11-0
        - libxrender1
        - libxcb-cursor0
        - libxcb-icccm4
        - libxcb-image0
        - libxcb-keysyms1
        - libxcb-randr0
        - libxcb-render-util0
        - libxcb-shape0
        - libxcb-xinerama0
        - libxcb-xkb1
    - template:
        name: miniconda
        version: py312_25.5.1-0
        install_path: /opt/miniconda
        env_name: pymol
        env_exists: "false"
        conda_install: python=3.11 pymol-open-source=={{ context.version }} pyqt
    - environment:
        PATH: /opt/miniconda/envs/pymol/bin:/opt/miniconda/bin:$PATH

deploy:
  path: []
  bins:
    - pymol

gui_apps:
  - name: "PyMOL"
    exec: "pymol"

domains:
  - microscopy

categories:
  - visualization
  - molecular biology
  - cryo EM

icon: data:image/png;base64,
