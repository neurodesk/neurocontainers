name: skan
version: 0.13.1
architectures:
  - x86_64
  - aarch64
structured_readme:
  description: >-
    Skeleton analysis in Python. skan measures the branches and junctions of
    skeletonised 2D and 3D images, such as vessel, neurite or fibre networks.
  example: |
    python - <<'PY'
    import numpy as np
    from skimage.morphology import skeletonize
    from skan import Skeleton, summarize

    image = np.zeros((64, 64), dtype=bool)
    image[32, 8:56] = True
    image[8:56, 32] = True

    skeleton = Skeleton(skeletonize(image), spacing=1.0)
    branches = summarize(skeleton, separator="-")
    print(branches[["branch-distance", "branch-type"]])
    PY
  documentation: https://skeleton-analysis.org/stable/
  citation: |-
    Nunez-Iglesias J, Blanch AJ, Looker O, Dixon MW, Tilley L. (2018)
    A new Python library to analyse skeleton images confirms malaria parasite
    remodelling of the red blood cell membrane skeleton. PeerJ 6:e4312.
    https://doi.org/10.7717/peerj.4312
auto_update:
  method: pypi
  package: skan

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - template:
        name: miniconda
        version: py312_25.5.1-0
        install_path: /opt/miniconda
        pip_install: skan=={{ context.version }}
    - deploy:
        path: []
        bins:
          - python
categories:
  - shape analysis
icon: data:image/png;base64,

readme: |-
  ----------------------------------
  ## skan/{{ context.version }} ##

  Skeleton analysis in Python. skan measures the branches and junctions of
  skeletonised 2D and 3D images, such as vessel, neurite or fibre networks:
  branch lengths, branch types, tortuosity and the underlying pixel graph.
  https://skeleton-analysis.org/stable/

  This container provides the skan Python library together with scikit-image,
  NumPy, SciPy, pandas and Numba. The napari plugin is not included.

  Example:
  ```
  python - <<'PY'
  import numpy as np
  from skimage.morphology import skeletonize
  from skan import Skeleton, summarize

  image = np.zeros((64, 64), dtype=bool)
  image[32, 8:56] = True
  image[8:56, 32] = True

  skeleton = Skeleton(skeletonize(image), spacing=1.0)
  branches = summarize(skeleton, separator="-")
  print(branches[["branch-distance", "branch-type"]])
  PY
  ```

  More documentation can be found here: https://skeleton-analysis.org/stable/

  Citation:
  ```
  Nunez-Iglesias J, Blanch AJ, Looker O, Dixon MW, Tilley L. (2018)
  A new Python library to analyse skeleton images confirms malaria parasite
  remodelling of the red blood cell membrane skeleton. PeerJ 6:e4312.
  https://doi.org/10.7717/peerj.4312
  ```

  To run container outside of this environment: ml skan/{{ context.version }}

