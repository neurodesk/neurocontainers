  - name: ANTsPy image processing and PNG round trip
    command: |
      python - <<'PYTHON'
      import tempfile
      from pathlib import Path
      import ants
      import numpy as np

      pixels = (np.indices((16, 16)).sum(axis=0) % 8).astype("uint8")
      image = ants.from_numpy(pixels)
      with tempfile.TemporaryDirectory() as directory:
          path = str(Path(directory) / "image.png")
          ants.image_write(image, path)
          restored = ants.image_read(path)
          np.testing.assert_array_equal(restored.numpy(), pixels)
      smoothed = ants.smooth_image(image.clone("float"), sigma=1)
      assert np.isfinite(smoothed.numpy()).all()
      assert np.ptp(smoothed.numpy()) > 0
      print("ANTsPy image processing and PNG round trip succeeded")
      PYTHON
    expected_output_contains: "ANTsPy image processing and PNG round trip succeeded"
