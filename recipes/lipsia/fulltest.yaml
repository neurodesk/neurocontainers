- name: LIPSIA exact threshold and mask processing
  description: Execute released native tools on a known3D float image and assert every output voxel and input checksum
  command: |
    set -eu
    "${output_dir}/voxel-check" create "${output_dir}/known.v"
    sha256sum "${output_dir}/known.v" > "${output_dir}/input.sha256"
    env -u HOME vbinarize -in "${output_dir}/known.v" -out "${output_dir}/mask.v" -min -2 -max 3
    env -u HOME vapplymask -in "${output_dir}/known.v" -out "${output_dir}/masked.v" -mask "${output_dir}/mask.v"
    "${output_dir}/voxel-check" mask "${output_dir}/mask.v"
    "${output_dir}/voxel-check" masked "${output_dir}/masked.v"
    "${output_dir}/voxel-check" original "${output_dir}/known.v"
    sha256sum -c "${output_dir}/input.sha256"
    echo 'Native LIPSIA threshold and mask results verified'
  expected_output_contains: Native LIPSIA threshold and mask results verified
  expected_exit_code: 0

- name: LIPSIA native executable architectures
  description: Confirm the processing tools and file converter use the declared native ELF architecture
  command: |
    set -eu
    case "$(uname -m)" in
      aarch64) machine=AArch64 ;;
      x86_64) machine='Advanced Micro Devices X86-64' ;;
      *) exit 1 ;;
    esac
    for tool in vbinarize vapplymask vnifti; do
      header=$(readelf -h "$(command -v "$tool")")
      printf '%s\n' "$header" | grep -F ELF64
      printf '%s\n' "$header" | grep -F "$machine"
    done
    echo 'Native LIPSIA ELF architectures verified'
  expected_output_contains: Native LIPSIA ELF architectures verified
  expected_exit_code: 0
