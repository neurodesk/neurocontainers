name: lipsia
version: 4.1.1
default_timeout: 60
test_data:
  output_dir: test_output/lipsia

setup:
  script: |
    set -eu
    mkdir -p "${output_dir}"
    cat > "${output_dir}/voxel-check.c" <<'C'
    #include <assert.h>
    #include <stdio.h>
    #include <string.h>
    #include <viaio/Vlib.h>
    #include <viaio/VImage.h>

    int main(int argc, char **argv) {
        FILE *stream;
        VImage image, *images;
        VAttrList attributes;
        int band, row, column, index = 0;
        assert(argc == 3);
        if (strcmp(argv[1], "create") == 0) {
            image = VCreateImage(3, 4, 5, VFloatRepn);
            assert(image != NULL);
            for (band = 0; band < 3; band++)
                for (row = 0; row < 4; row++)
                    for (column = 0; column < 5; column++)
                        VSetPixel(image, band, row, column, index++ - 30);
            stream = fopen(argv[2], "wb");
            assert(stream != NULL);
            attributes = VCreateAttrList();
            assert(VWriteImages(stream, attributes, 1, &image));
            assert(fclose(stream) == 0);
            return 0;
        }
        stream = fopen(argv[2], "rb");
        assert(stream != NULL);
        assert(VReadImages(stream, &attributes, &images) == 1);
        assert(fclose(stream) == 0);
        image = images[0];
        assert(VImageNBands(image) == 3);
        assert(VImageNRows(image) == 4);
        assert(VImageNColumns(image) == 5);
        assert(VPixelRepn(image) == (strcmp(argv[1], "mask") == 0 ? VBitRepn : VFloatRepn));
        for (band = 0; band < 3; band++)
            for (row = 0; row < 4; row++)
                for (column = 0; column < 5; column++) {
                    double value = index++ - 30;
                    int selected = value >= -2 && value <= 3;
                    double expected = strcmp(argv[1], "mask") == 0 ? selected :
                        strcmp(argv[1], "masked") == 0 ? (selected ? value : 0) : value;
                    assert(VGetPixel(image, band, row, column) == expected);
                }
        assert(index == 60);
        printf("Verified all60 %s voxels and dimensions\n", argv[1]);
        return 0;
    }
    C
    cc -std=c99 -Wall -Wextra -Werror -I/opt/lipsia/include "${output_dir}/voxel-check.c" -L/opt/lipsia/lib -Wl,-rpath,/opt/lipsia/lib -lviaio3.0 -lm -lz -o "${output_dir}/voxel-check"

