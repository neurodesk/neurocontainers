name: cellprofiler
version: 4.2.8.1

copyright:
  - license: BSD-3-Clause
    url: https://github.com/CellProfiler/CellProfiler/blob/master/LICENSE

architectures:
  - x86_64

structured_readme:
  description: >-
    CellProfiler is an open-source application for quantitative high-throughput
    microscopy image analysis, providing both an interactive GUI pipeline
    builder and headless batch execution via Bio-Formats.
  example: |
    # Launch the CellProfiler GUI
    cellprofiler

    # Run a CellProfiler pipeline headlessly
    cellprofiler -c -r -p pipeline.cppipe -i input_images/ -o output/
  documentation: https://cellprofiler.org/manuals
  citation: |-
    Stirling, D. R., Swain-Bowden, M. J., Lucas, A. M., Carpenter, A. E.,
    Cimini, B. A., & Goodman, A. (2021). CellProfiler 4: improvements in speed,
    utility and usability. BMC Bioinformatics, 22, 433.
    https://doi.org/10.1186/s12859-021-04344-9

auto_update:
  method: pypi
  package: cellprofiler

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        JAVA_HOME: /opt/miniconda/envs/cellprofiler/lib/jvm
        JDK_HOME: /opt/miniconda/envs/cellprofiler/lib/jvm
    - install:
        - build-essential
        - default-libmysqlclient-dev
        - fontconfig
        - libgl1
        - libglib2.0-0
        - libglu1-mesa
        - libgtk-3-0
        - libjpeg-turbo8
        - libnotify4
        - libpng16-16t64
        - libsdl2-2.0-0
        - libsm6
        - libtiff6
        - libxext6
        - libxi6
        - libxrender1
        - libxtst6
        - libxxf86vm1
        - pkg-config
    - template:
        name: miniconda
        version: py312_25.5.1-0
        install_path: /opt/miniconda
        env_name: cellprofiler
        env_exists: "false"
        conda_install: >-
          python=3.9 pip openjdk=11 wxpython=4.2.1 cython numpy=1.23.5 scipy=1.9.0
          scikit-image=0.18.3 h5py=3.6.0 pillow matplotlib mahotas pyzmq=22.3.0
        pip_install: cellprofiler=={{ context.version }}
    - environment:
        PATH: /opt/miniconda/envs/cellprofiler/bin:/opt/miniconda/bin:$PATH

deploy:
  path: []
  bins:
    - cellprofiler

gui_apps:
  - name: "CellProfiler"
    exec: "cellprofiler"

domains:
  - microscopy

categories:
  - visualization
  - image segmentation
  - workflows

icon: data:image/png;base64,
