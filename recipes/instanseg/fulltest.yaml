name: instanseg
version: 0.1.2
upstream_version: "0.1.2"

tests:
  - name: instanseg-inference wrapper available on PATH
    description: Verify the deployed instanseg-inference wrapper resolves on PATH.
    command: command -v instanseg-inference
    expected_output_contains: "/opt/instanseg/wrappers/instanseg-inference"

  - name: package versions match recipe, CPU PyTorch is installed, and pip check passes
    description: Verify instanseg-torch matches upstream_version, CPU PyTorch is installed without NVIDIA CUDA wheels, and pip check passes.
    command: |
      set -e
      /opt/instanseg/bin/python -m pip check
      /opt/instanseg/bin/python - <<'PY'
      import importlib.metadata as md
      assert md.version("instanseg-torch") == "${upstream_version}", md.version("instanseg-torch")
      torch_ver = md.version("torch")
      assert "+cpu" in torch_ver, torch_ver
      bad = [d.metadata["Name"] for d in md.distributions() if d.metadata["Name"].lower().startswith(("nvidia-", "cuda-"))]
      assert not bad, bad
      print(f"instanseg-torch={md.version('instanseg-torch')} torch={torch_ver}")
      PY
    expected_output_contains: "instanseg-torch=${upstream_version}"

  - name: license notices and LGPL corresponding source installed
    description: Verify InstanSeg Apache-2.0, fastremap LGPL-3.0 + GPL-3.0 notices, and fastremap corresponding source archive are installed.
    command: |
      set -e
      test -s /opt/instanseg/share/licenses/INSTANSEG-LICENSE.txt
      grep -q "Apache License" /opt/instanseg/share/licenses/INSTANSEG-LICENSE.txt
      test -s /opt/instanseg/share/licenses/FASTREMAP-LGPL-3.0.txt
      grep -q "GNU LESSER GENERAL PUBLIC LICENSE" /opt/instanseg/share/licenses/FASTREMAP-LGPL-3.0.txt
      test -s /opt/instanseg/share/licenses/GPL-3.0.txt
      test -s /opt/instanseg/share/src/fastremap-1.21.0.tar.gz
      echo "license ok"
    expected_output_contains: "license ok"

  - name: wrapper isolates process-group SIGINT and preserves piped and PTY stdin
    description: Verify the installed instanseg-inference wrapper delivers one SIGINT on non-TTY and PTY interrupts and preserves both piped and foreground PTY stdin without SIGTTIN.
    command: |
      set -e
      /opt/instanseg/bin/python - <<'PY'
      import fcntl, os, pty, select, signal, subprocess, tempfile, termios, time

      src = open("/opt/instanseg/wrappers/instanseg-inference").read()

      def run_in_pty(argv, env, on_ready=None, send_bytes=None):
          master, slave = pty.openpty()
          def preexec():
              os.setsid()
              fcntl.ioctl(slave, termios.TIOCSCTTY, 0)
          p = subprocess.Popen(argv, env=env, stdin=slave, stdout=slave, stderr=slave, preexec_fn=preexec, close_fds=True)
          os.close(slave)
          if on_ready:
              on_ready()
          if send_bytes:
              os.write(master, send_bytes)
          out = bytearray()
          deadline = time.time() + 6.0
          while time.time() < deadline:
              r, _, _ = select.select([master], [], [], 0.1)
              if r:
                  try:
                      chunk = os.read(master, 4096)
                      if not chunk:
                          break
                      out += chunk
                  except OSError:
                      break
              if p.poll() is not None and not r:
                  break
          rc = p.wait(timeout=5)
          os.close(master)
          return rc, out.decode("utf-8", "replace")

      with tempfile.TemporaryDirectory() as td:
          stub = os.path.join(td, "stub.py")
          open(stub, "w").write(
              "#!/opt/instanseg/bin/python\n"
              "import signal, sys, time\n"
              "if sys.argv[1] == 'stdin':\n"
              "    print('GOT:' + sys.stdin.readline().strip(), flush=True)\n"
              "    raise SystemExit(0)\n"
              "log, ready = sys.argv[2], sys.argv[3]\n"
              "seen = []\n"
              "def h(sig, _):\n"
              "    seen.append(sig)\n"
              "    open(log, 'a').write(f'{sig}\\n')\n"
              "signal.signal(signal.SIGINT, h)\n"
              "open(ready, 'w').write('ready\\n')\n"
              "deadline = time.time() + 5.0\n"
              "while not seen and time.time() < deadline:\n"
              "    time.sleep(0.02)\n"
              "time.sleep(0.25)\n"
              "raise SystemExit(128 + seen[0] if seen else 0)\n"
          )
          os.chmod(stub, 0o755)
          wrapper = os.path.join(td, "wrapper.py")
          open(wrapper, "w").write(src.replace("/opt/instanseg/bin/inference", stub))
          os.chmod(wrapper, 0o755)

          env = os.environ.copy()
          for k in ("INSTANSEG_BIOIMAGEIO_PATH", "INSTANSEG_TORCHSCRIPT_PATH", "INSTANSEG_MODEL_PATH", "TORCH_HOME", "MPLCONFIGDIR", "XDG_CACHE_HOME"):
              env.pop(k, None)

          # 1. Piped stdin passthrough
          r = subprocess.run([wrapper, "stdin"], input="instanseg-pipe\n", capture_output=True, text=True, env=env, timeout=10)
          assert r.returncode == 0 and r.stdout.strip() == "GOT:instanseg-pipe", (r.returncode, r.stdout, r.stderr)

          # 2. Interactive foreground PTY stdin read (must not stop with SIGTTIN)
          rc, out = run_in_pty([wrapper, "stdin"], env=env, send_bytes=b"instanseg-pty\n")
          assert rc == 0 and "GOT:instanseg-pty" in out, (rc, out)

          # 3. Interactive foreground PTY Ctrl-C delivers one SIGINT
          log_pty, ready_pty = os.path.join(td, "pty.log"), os.path.join(td, "pty.ready")
          def wait_ready():
              dl = time.time() + 5.0
              while not os.path.exists(ready_pty) and time.time() < dl:
                  time.sleep(0.02)
              assert os.path.exists(ready_pty), "pty stub did not become ready"
          rc, out = run_in_pty([wrapper, "sig", log_pty, ready_pty], env=env, on_ready=wait_ready, send_bytes=b"\x03")
          sigs_pty = [int(x) for x in open(log_pty).read().splitlines() if x.strip()]
          assert rc == 130 and sigs_pty == [signal.SIGINT.value], (rc, sigs_pty, out)

          # 4. Non-TTY process-group SIGINT delivers one SIGINT
          log, ready = os.path.join(td, "sig.log"), os.path.join(td, "sig.ready")
          p = subprocess.Popen([wrapper, "sig", log, ready], env=env, start_new_session=True)
          deadline = time.time() + 5.0
          while not os.path.exists(ready) and time.time() < deadline:
              time.sleep(0.02)
          assert os.path.exists(ready), "stub did not become ready"
          os.killpg(p.pid, signal.SIGINT)
          rc = p.wait(timeout=10)
          sigs = [int(x) for x in open(log).read().splitlines() if x.strip()]
          assert rc == 130 and sigs == [signal.SIGINT.value], (rc, sigs)

          # 5. Interactive Bash Ctrl-Z returns shell prompt and fg resumes child
          ready_z = os.path.join(td, "tstp.ready")
          stub_z = os.path.join(td, "stub_z.py")
          open(stub_z, "w").write(
              "#!/opt/instanseg/bin/python\n"
              "import sys\n"
              "open(sys.argv[1], 'w').write('ready\\n')\n"
              "print('RESUMED:' + sys.stdin.readline().strip(), flush=True)\n"
          )
          os.chmod(stub_z, 0o755)
          wrapper_z = os.path.join(td, "wrapper_z.py")
          open(wrapper_z, "w").write(src.replace("/opt/instanseg/bin/inference", stub_z))
          os.chmod(wrapper_z, 0o755)
          master, slave = pty.openpty()
          def preexec_bash():
              os.setsid()
              fcntl.ioctl(slave, termios.TIOCSCTTY, 0)
          benv = env.copy()
          benv["PS1"] = "BP> "
          bash = subprocess.Popen(["bash", "--norc", "--noprofile", "-i"], stdin=slave, stdout=slave, stderr=slave, preexec_fn=preexec_bash, close_fds=True, env=benv)
          os.close(slave)
          pty_buf = [""]
          def read_until(marker):
              dl = time.time() + 5.0
              while True:
                  idx = pty_buf[0].find(marker)
                  if idx != -1:
                      end = idx + len(marker)
                      out = pty_buf[0][:end]
                      pty_buf[0] = pty_buf[0][end:]
                      return out
                  if time.time() >= dl:
                      raise AssertionError(f"Timed out waiting for {marker!r}: {pty_buf[0]!r}")
                  r, _, _ = select.select([master], [], [], 0.05)
                  if r:
                      try:
                          chunk = os.read(master, 4096)
                          if not chunk:
                              raise AssertionError(f"EOF waiting for {marker!r}: {pty_buf[0]!r}")
                          pty_buf[0] += chunk.decode("utf-8", "replace")
                      except OSError:
                          raise AssertionError(f"OSError waiting for {marker!r}: {pty_buf[0]!r}")
          read_until("BP> ")
          os.write(master, f"{wrapper_z} {ready_z}\n".encode())
          dl = time.time() + 5.0
          while not os.path.exists(ready_z) and time.time() < dl:
              time.sleep(0.02)
          assert os.path.exists(ready_z), "tstp stub did not start"
          time.sleep(0.1)
          os.write(master, b"\x1a")
          read_until("BP> ")
          os.write(master, b"bg\n")
          read_until("BP> ")
          time.sleep(0.15)
          os.write(master, b"echo BASH_KEEPS_TTY\n")
          out_bg = read_until("BASH_KEEPS_TTY")
          assert "RESUMED:echo" not in out_bg, out_bg
          read_until("BP> ")
          os.write(master, b"fg\n")
          time.sleep(0.15)
          os.write(master, b"after-fg\n")
          read_until("RESUMED:after-fg")
          read_until("BP> ")
          # 6. Background launch (&) followed by fg hands TTY to child cleanly
          ready_bg = os.path.join(td, "bg.ready")
          os.write(master, f"{wrapper_z} {ready_bg} &\n".encode())
          dl = time.time() + 5.0
          while not os.path.exists(ready_bg) and time.time() < dl:
              time.sleep(0.02)
          assert os.path.exists(ready_bg), "bg stub did not start"
          time.sleep(0.15)
          os.write(master, b"echo BG_LAUNCH_OK\n")
          out_bgl = read_until("BG_LAUNCH_OK")
          assert "RESUMED:echo" not in out_bgl, out_bgl
          read_until("BP> ")
          os.write(master, b"fg\n")
          time.sleep(0.15)
          os.write(master, b"from-bg-to-fg\n")
          read_until("RESUMED:from-bg-to-fg")
          read_until("BP> ")
          # 7. Running background child (no TTY I/O) -> fg -> Ctrl-Z stops child too
          stub_bg = os.path.join(td, "stub_bg.py")
          open(stub_bg, "w").write(
              "#!/opt/instanseg/bin/python\n"
              "import os, sys, time\n"
              "if sys.argv[1] == 'tick':\n"
              "    open(sys.argv[2], 'w').write(str(os.getpid()))\n"
              "    for i in range(60):\n"
              "        open(sys.argv[3], 'w').write(str(i))\n"
              "        time.sleep(0.05)\n"
              "else:\n"
              "    open(sys.argv[2], 'w').write('ready\\n')\n"
              "    time.sleep(0.3)\n"
              "    print('TOSTOP_OK', flush=True)\n"
          )
          os.chmod(stub_bg, 0o755)
          wrapper_bg = os.path.join(td, "wrapper_bg.py")
          open(wrapper_bg, "w").write(src.replace("/opt/instanseg/bin/inference", stub_bg))
          os.chmod(wrapper_bg, 0o755)
          pidf, tickf = os.path.join(td, "c.pid"), os.path.join(td, "c.tick")
          os.write(master, f"{wrapper_bg} tick {pidf} {tickf} &\n".encode())
          dl = time.time() + 5.0
          while not os.path.exists(pidf) and time.time() < dl:
              time.sleep(0.02)
          cpid = int(open(pidf).read().strip())
          read_until("BP> ")
          os.write(master, b"fg\n")
          time.sleep(0.15)
          os.write(master, b"\x1a")
          read_until("BP> ")
          time.sleep(0.1)
          st = open(f"/proc/{cpid}/stat").read().rsplit(")", 1)[1].split()[0]
          assert st == "T", f"running child not stopped on fg + Ctrl-Z: {st}"
          os.write(master, b"fg\n")
          time.sleep(0.1)
          os.write(master, b"\x03")
          read_until("BP> ")
          # 8. stty tostop + bg with </dev/null stops cleanly on SIGTTOU and fg completes write
          ready_ts = os.path.join(td, "ts.ready")
          os.write(master, b"stty tostop\n")
          read_until("BP> ")
          os.write(master, f"{wrapper_bg} write {ready_ts} </dev/null\n".encode())
          dl = time.time() + 5.0
          while not os.path.exists(ready_ts) and time.time() < dl:
              time.sleep(0.02)
          os.write(master, b"\x1a")
          read_until("BP> ")
          os.write(master, b"bg\n")
          read_until("BP> ")
          time.sleep(0.5)
          os.write(master, b"jobs\n")
          jout = read_until("BP> ")
          assert "Stopped" in jout and "TOSTOP_OK" not in jout, jout
          os.write(master, b"fg\n")
          read_until("TOSTOP_OK")
          read_until("BP> ")
          os.write(master, b"exit\n")
          bash.wait(timeout=5)
          os.close(master)
      print("wrapper signal and stdin ok")
      PY
    expected_output_contains: "wrapper signal and stdin ok"

  - name: instanseg-inference CLI help works with read-only HOME
    description: Verify instanseg-inference starts cleanly when HOME is read-only and cache vars are unset.
    command: |
      set -e
      env -u INSTANSEG_BIOIMAGEIO_PATH -u INSTANSEG_TORCHSCRIPT_PATH -u INSTANSEG_MODEL_PATH -u TORCH_HOME -u MPLCONFIGDIR -u XDG_CACHE_HOME \
        HOME=/sys instanseg-inference --help
    expected_output_contains: "--model_folder"

  - name: offline instanseg-inference CLI smoke test
    description: Run instanseg-inference end-to-end with a local synthetic TorchScript model on an RGB brightfield-like patch offline under read-only HOME.
    command: |
      set -e
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      mkdir -p "$tmpdir/models/dummy_model" "$tmpdir/images"
      cat > "$tmpdir/make_dummy.py" <<'PY'
      import sys
      import numpy as np
      import tifffile
      import torch
      import torch.nn as nn

      class DummySeg(nn.Module):
          def __init__(self):
              super().__init__()
              self.pixel_size: float = 0.5
              self.cells_and_nuclei: bool = False
          def forward(self, x: torch.Tensor, target_segmentation: torch.Tensor) -> torch.Tensor:
              b, _, h, w = x.shape
              out = torch.zeros((b, 1, h, w), dtype=torch.int32, device=x.device)
              out[:, :, 16:48, 16:48] = 1
              return out

      torch.jit.script(DummySeg()).save(sys.argv[1])
      tifffile.imwrite(sys.argv[2], np.full((64, 64, 3), 180, dtype=np.uint8))
      PY
      MPLCONFIGDIR="$tmpdir/mpl" /opt/instanseg/bin/python "$tmpdir/make_dummy.py" \
        "$tmpdir/models/dummy_model/instanseg.pt" "$tmpdir/images/patch.tif"
      env -u INSTANSEG_TORCHSCRIPT_PATH -u INSTANSEG_MODEL_PATH -u TORCH_HOME -u MPLCONFIGDIR -u XDG_CACHE_HOME \
        INSTANSEG_BIOIMAGEIO_PATH="$tmpdir/models" \
        HOME=/sys \
        instanseg-inference --image_path "$tmpdir/images" --model_folder dummy_model --device cpu --pixel_size 0.5
      MPLCONFIGDIR="$tmpdir/mpl" /opt/instanseg/bin/python -c "
      import glob, sys, tifffile
      preds = sorted(glob.glob(sys.argv[1] + '/*prediction.tiff'))
      assert preds, 'no prediction TIFF written'
      lbl = tifffile.imread(preds[0])
      assert lbl.shape[-2:] == (64, 64), lbl.shape
      assert int(lbl.max()) == 1, int(lbl.max())
      print('instanseg offline ok:', tuple(lbl.shape), int(lbl.max()))
      " "$tmpdir/images"
    expected_output_contains: "instanseg offline ok:"
