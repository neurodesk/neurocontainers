# dicompare container test suite
# Tests for dicompare - MRI protocol validation webapp
#
# dicompare is a web-based tool for validating DICOM files against
# community-defined MRI acquisition protocols. It runs as a static
# web server on port 3001 and uses Pyodide (Python in WebAssembly)
# for DICOM processing in the browser.
#
# Test data: ds000001/sub-01 (OpenNeuro Balloon Analog Risk-taking Task)
#   - T1w: 160x192x192, 1x1.33x1.33mm (3D structural)
#   - BOLD: 64x64x33x300, 3.125x3.125x4mm, TR=2s (4D functional)

name: dicompare
version: 0.15.3

required_files:
  - dataset: ds000001
    files:
      - sub-01/anat/sub-01_T1w.nii.gz
      - sub-01/func/sub-01_task-balloonanalogrisktask_run-01_bold.nii.gz

test_data:
  t1w: ds000001/sub-01/anat/sub-01_T1w.nii.gz
  bold: ds000001/sub-01/func/sub-01_task-balloonanalogrisktask_run-01_bold.nii.gz
  output_dir: test_output

setup:
  script: |
    #!/usr/bin/env bash
    set -e
    mkdir -p test_output
    cat > test_output/check-http.cjs <<'JS'
    const assert = require('node:assert/strict');
    const fs = require('node:fs');
    const net = require('node:net');
    const { spawn } = require('node:child_process');
    const { setTimeout: sleep } = require('node:timers/promises');

    async function main() {
      const root = '/opt/dicompare/dist';
      const mode = process.argv[2];
      const reservation = net.createServer();
      await new Promise((resolve, reject) => {
        reservation.once('error', reject);
        reservation.listen(0, '127.0.0.1', resolve);
      });
      const port = reservation.address().port;
      await new Promise((resolve, reject) => reservation.close(error => error ? reject(error) : resolve()));
      const child = spawn('dicompare', ['start'], {
        env: { ...process.env, NEURODESK_WEBAPP_PORT: String(port) },
        detached: true,
        stdio: ['ignore', 'pipe', 'pipe'],
      });
      let logs = '';
      let ended = false;
      let spawnError;
      child.stdout.on('data', data => { logs += data; });
      child.stderr.on('data', data => { logs += data; });
      child.once('error', error => { spawnError = error; });
      const exited = new Promise(resolve => child.once('exit', () => { ended = true; resolve(); }));
      const base = `http://127.0.0.1:${port}`;
      const index = fs.readFileSync(root + '/index.html');
      async function exactFile(urlPath, diskPath = urlPath) {
        const response = await fetch(base + urlPath, { signal: AbortSignal.timeout(3000) });
        assert.equal(response.status, 200, urlPath);
        const body = Buffer.from(await response.arrayBuffer());
        assert.deepEqual(body, fs.readFileSync(root + diskPath), `Wrong HTTP bytes for ${urlPath}`);
        assert(body.length > 0, `Empty HTTP response for ${urlPath}`);
        return { body, type: response.headers.get('content-type') || '' };
      }
      try {
        let ready = false;
        let lastError;
        const deadline = Date.now() + 8000;
        while (Date.now() < deadline) {
          if (spawnError) throw spawnError;
          assert(!ended, `Deployed launcher exited before readiness: ${logs}`);
          try {
            const result = await exactFile('/', '/index.html');
            assert.match(result.type, /text\/html/);
            ready = true;
            break;
          } catch (error) {
            lastError = error;
            await sleep(100);
          }
        }
        assert(ready, `Deployed server failed readiness: ${lastError}\n${logs}`);
        if (mode === 'start' || mode === 'index') {
          const result = await exactFile('/', '/index.html');
          assert.match(result.body.toString(), /<!doctype html>/i);
        } else if (mode === 'favicon') {
          const result = await exactFile('/favicon.ico');
          assert.notDeepEqual(result.body, index, 'Favicon incorrectly returned SPA HTML');
        } else if (mode === 'manifest') {
          JSON.parse((await exactFile('/manifest.json')).body.toString());
        } else if (mode === 'schemas') {
          const entries = JSON.parse((await exactFile('/schemas/index.json')).body.toString());
          assert(Array.isArray(entries) && entries.length > 0);
          for (const entry of entries) {
            assert(entry.startsWith('/schemas/') && !entry.includes('..'), entry);
            JSON.parse((await exactFile(entry)).body.toString());
          }
        } else if (mode === 'functions') {
          const entries = JSON.parse((await exactFile('/validation-functions/index.json')).body.toString());
          assert(Array.isArray(entries) && entries.includes('echo_count.json'));
          for (const entry of entries) {
            assert(entry.endsWith('.json') && !entry.includes('/') && !entry.includes('..'), entry);
            const definition = JSON.parse((await exactFile('/validation-functions/' + entry)).body.toString());
            assert(typeof definition.implementation === 'string' && definition.implementation.trim(), entry);
          }
        } else if (mode === 'spa') {
          await exactFile('/fixture-routing/nonexistent/path', '/index.html');
        } else if (mode === 'bundle') {
          const references = [...index.toString().matchAll(/\b(?:src|href)="([^"]+)"/g)]
            .map(match => match[1]).filter(value => !/^(?:https?:|data:|#)/.test(value));
          assert(references.some(value => /\.js(?:\?|$)/.test(value)), 'No application JavaScript');
          assert(references.some(value => /\.css(?:\?|$)/.test(value)), 'No application CSS');
          for (const reference of references) {
            const resource = new URL(reference, base + '/').pathname;
            const result = await exactFile(resource);
            assert.notDeepEqual(result.body, index, `Asset returned SPA HTML: ${resource}`);
            if (resource.endsWith('.js')) assert.match(result.type, /javascript/);
            if (resource.endsWith('.css')) assert.match(result.type, /text\/css/);
          }
          const workers = fs.readdirSync(root + '/assets').filter(name => /pyodide.*\.js$/.test(name));
          assert(workers.length > 0, 'No built Pyodide worker');
          for (const worker of workers) {
            const result = await exactFile('/assets/' + worker);
            assert.match(result.type, /javascript/);
            assert.notDeepEqual(result.body, index, 'Worker incorrectly returned SPA HTML');
          }
        } else {
          throw new Error(`Unknown HTTP check ${mode}`);
        }
        assert(!ended, `Deployed launcher exited during requests: ${logs}`);
        console.log(`Verified deployed Dicompare HTTP: ${mode}`);
      } finally {
        if (child.pid) {
          // Only this test's detached process group is owned by this test.
          try { process.kill(-child.pid, 'SIGTERM'); }
          catch (error) { if (error.code !== 'ESRCH') throw error; }
          if (!ended) {
            let timer;
            try {
              await Promise.race([exited, new Promise((resolve, reject) => {
                timer = setTimeout(() => {
                  try { process.kill(-child.pid, 'SIGKILL'); }
                  catch (error) { if (error.code !== 'ESRCH') reject(error); }
                  resolve();
                }, 2000);
              })]);
              await exited;
            } finally { clearTimeout(timer); }
          }
        }
      }
    }
    main().catch(error => { console.error(error); process.exitCode = 1; });
    JS

tests:
  # ==========================================================================
  # BASIC CONTAINER VERIFICATION
  # ==========================================================================
  - name: Container executable check
    description: Verify the container can be executed
    command: echo "Container accessible"
    expected_exit_code: 0

  - name: dicompare command exists
    description: Verify dicompare binary is available in PATH
    command: which dicompare
    expected_output_contains: "/usr/local/bin/dicompare"

  - name: dicompare usage message
    description: Check dicompare displays usage information
    command: dicompare
    expected_output_contains: "MRI protocol validation tool"

  - name: dicompare start command recognized
    description: Verify start subcommand is documented
    command: dicompare
    expected_output_contains: "dicompare start"

  # ==========================================================================
  # NODE.JS ENVIRONMENT VERIFICATION
  # ==========================================================================
  - name: Node.js installed
    description: Verify Node.js is available
    command: which node
    expected_output_contains: "/usr/bin/node"

  - name: Node.js version check
    description: Verify Node.js version 20.x is installed
    command: node --version
    expected_output_contains: "v20"

  - name: npm installed
    description: Verify npm is available
    command: which npm
    expected_output_contains: "/usr/bin/npm"

  - name: npm version check
    description: Verify npm is functional
    command: npm --version
    expected_exit_code: 0

  # ==========================================================================
  # SERVE STATIC FILE SERVER VERIFICATION
  # ==========================================================================
  - name: serve installed
    description: Verify serve static file server is available
    command: which serve
    expected_output_contains: "/usr/bin/serve"

  - name: serve version check
    description: Verify serve version
    command: serve --version
    expected_output_contains: "14"

  - name: serve help available
    description: Verify serve help works
    command: serve --help
    expected_output_contains: "Static file serving"

  - name: serve supports single-page mode
    description: Check serve has -s/--single option
    command: serve --help
    expected_output_contains: "--single"

  - name: serve supports port option
    description: Check serve has -p option for port
    command: serve --help
    expected_output_contains: "-p"

  - name: serve supports listen option
    description: Check serve has -l/--listen option
    command: serve --help
    expected_output_contains: "--listen"

  # ==========================================================================
  # WEBAPP STRUCTURE VERIFICATION
  # ==========================================================================
  - name: webapp directory exists
    description: Verify /opt/dicompare directory exists
    command: "bash -lc 'ls -d /opt/dicompare'"
    expected_output_contains: "/opt/dicompare"

  - name: dist directory exists
    description: Verify built webapp exists
    command: "bash -lc 'ls -d /opt/dicompare/dist'"
    expected_output_contains: "/opt/dicompare/dist"

  - name: start.sh exists
    description: Verify startup script exists
    command: "bash -lc 'ls /opt/dicompare/start.sh'"
    expected_output_contains: "start.sh"

  - name: start.sh is executable
    description: Verify startup script has execute permissions
    command: bash -lc 'test -x /opt/dicompare/start.sh && echo "executable"'
    expected_output_contains: "executable"

  - name: start.sh contains serve command
    description: Verify startup script runs serve
    command: "bash -lc 'cat /opt/dicompare/start.sh'"
    expected_output_contains: "serve -s dist -l ${NEURODESK_WEBAPP_PORT:-3001}"

  # ==========================================================================
  # INDEX.HTML VERIFICATION
  # ==========================================================================
  - name: index.html exists
    description: Verify main HTML file exists
    command: "bash -lc 'ls /opt/dicompare/dist/index.html'"
    expected_output_contains: "index.html"

  - name: index.html has content
    description: Verify index.html is not empty
    command: bash -lc 'test -s /opt/dicompare/dist/index.html && echo "has content"'
    expected_output_contains: "has content"

  - name: index.html is valid HTML
    description: Check for basic HTML structure
    command: "bash -lc 'cat /opt/dicompare/dist/index.html | head -20'"
    expected_output_contains: "<!DOCTYPE html>"

  - name: index.html includes app root
    description: Verify React mount point exists
    command: "bash -lc 'cat /opt/dicompare/dist/index.html'"
    expected_output_contains: "<div id=\"root\""

  # ==========================================================================
  # STATIC ASSETS VERIFICATION
  # ==========================================================================
  - name: assets directory exists
    description: Verify assets directory is present
    command: "bash -lc 'ls -d /opt/dicompare/dist/assets'"
    expected_output_contains: "/opt/dicompare/dist/assets"

  - name: JavaScript bundle exists
    description: Verify main JS bundle is present
    command: bash -lc 'ls /opt/dicompare/dist/assets/*.js | head -1'
    expected_exit_code: 0

  - name: CSS bundle exists
    description: Verify main CSS bundle is present
    command: bash -lc 'ls /opt/dicompare/dist/assets/*.css | head -1'
    expected_exit_code: 0

  - name: favicon exists
    description: Verify favicon is present
    command: "bash -lc 'ls /opt/dicompare/dist/favicon.ico'"
    expected_output_contains: "favicon.ico"

  - name: manifest.json exists
    description: Verify PWA manifest is present
    command: "bash -lc 'ls /opt/dicompare/dist/manifest.json'"
    expected_output_contains: "manifest.json"

  - name: manifest.json is valid JSON
    description: Verify manifest.json can be parsed
    command: "bash -lc 'cat /opt/dicompare/dist/manifest.json | python3 -c \"import sys,json; json.load(sys.stdin); print('\"'\"'valid'\"'\"')\"'"
    expected_output_contains: "valid"

  - name: robots.txt exists
    description: Verify robots.txt is present
    command: "bash -lc 'ls /opt/dicompare/dist/robots.txt'"
    expected_output_contains: "robots.txt"

  - name: logo images exist
    description: Verify logo images are present
    command: bash -lc 'ls /opt/dicompare/dist/logo*.png | wc -l'
    expected_output_contains: "2"

  - name: hero images exist
    description: Verify hero images are present
    command: bash -lc 'ls /opt/dicompare/dist/hero*.png | wc -l'
    expected_output_contains: "2"

  # ==========================================================================
  # PYODIDE WEB WORKER VERIFICATION
  # ==========================================================================
  - name: Pyodide worker exists
    description: Verify Pyodide web worker is bundled
    command: bash -lc 'ls /opt/dicompare/dist/assets/pyodide.worker*.js | head -1'
    expected_exit_code: 0

  - name: Pyodide worker has content
    description: Verify Pyodide worker is not empty
    command: |
      bash -lc 'ls -s /opt/dicompare/dist/assets/pyodide.worker*.js | awk '\''{print ($1 > 0 ? "has content" : "empty")}'\'''
    expected_output_contains: "has content"

  # ==========================================================================
  # SCHEMA FILES VERIFICATION
  # ==========================================================================
  - name: schemas directory exists
    description: Verify schemas directory is present
    command: "bash -lc 'ls -d /opt/dicompare/dist/schemas'"
    expected_output_contains: "/opt/dicompare/dist/schemas"

  - name: schemas index.json exists
    description: Verify schema index file is present
    command: "bash -lc 'ls /opt/dicompare/dist/schemas/index.json'"
    expected_output_contains: "index.json"

  - name: schemas index.json is valid JSON
    description: Verify schema index can be parsed
    command: "bash -lc 'cat /opt/dicompare/dist/schemas/index.json | python3 -c \"import sys,json; json.load(sys.stdin); print('\"'\"'valid'\"'\"')\"'"
    expected_output_contains: "valid"

  - name: MS CMSC Guidelines schema exists
    description: Verify MS CMSC Guidelines schema is present
    command: "bash -lc 'ls /opt/dicompare/dist/schemas/MS_CMSC_Guidelines_v1.0.json'"
    expected_output_contains: "MS_CMSC_Guidelines"

  - name: MS CMSC Guidelines schema is valid JSON
    description: Verify MS CMSC Guidelines schema can be parsed
    command: "bash -lc 'cat /opt/dicompare/dist/schemas/MS_CMSC_Guidelines_v1.0.json | python3 -c \"import sys,json; json.load(sys.stdin); print('\"'\"'valid'\"'\"')\"'"
    expected_output_contains: "valid"

  - name: ASL Clinical Guidelines schema exists
    description: Verify ASL Clinical Guidelines schema is present
    command: "bash -lc 'ls /opt/dicompare/dist/schemas/ASL_Clinical_Guidelines_v1.0.json'"
    expected_output_contains: "ASL_Clinical_Guidelines"

  - name: ASL Clinical Guidelines schema is valid JSON
    description: Verify ASL Clinical Guidelines schema can be parsed
    command: "bash -lc 'cat /opt/dicompare/dist/schemas/ASL_Clinical_Guidelines_v1.0.json | python3 -c \"import sys,json; json.load(sys.stdin); print('\"'\"'valid'\"'\"')\"'"
    expected_output_contains: "valid"

  - name: QSM Consensus Guidelines schema exists
    description: Verify QSM Consensus Guidelines schema is present
    command: "bash -lc 'ls /opt/dicompare/dist/schemas/QSM_Consensus_Guidelines_v1.0.json'"
    expected_output_contains: "QSM_Consensus_Guidelines"

  - name: QSM Consensus Guidelines schema is valid JSON
    description: Verify QSM Consensus Guidelines schema can be parsed
    command: "bash -lc 'cat /opt/dicompare/dist/schemas/QSM_Consensus_Guidelines_v1.0.json | python3 -c \"import sys,json; json.load(sys.stdin); print('\"'\"'valid'\"'\"')\"'"
    expected_output_contains: "valid"

  - name: MY-RADS Myeloma schema exists
    description: Verify MY-RADS Myeloma schema is present
    command: "bash -lc 'ls /opt/dicompare/dist/schemas/MY-RADS_Myeloma_v1.0.json'"
    expected_output_contains: "MY-RADS_Myeloma"

  - name: UK Biobank schema exists
    description: Verify UK Biobank schema is present
    command: "bash -lc 'ls /opt/dicompare/dist/schemas/UK_Biobank_v1.0.json'"
    expected_output_contains: "UK_Biobank"

  - name: UK Biobank schema is valid JSON
    description: Verify UK Biobank schema can be parsed
    command: "bash -lc 'cat /opt/dicompare/dist/schemas/UK_Biobank_v1.0.json | python3 -c \"import sys,json; json.load(sys.stdin); print('\"'\"'valid'\"'\"')\"'"
    expected_output_contains: "valid"

  - name: UMMS Ping schema exists
    description: Verify UMMS Ping schema is present
    command: "bash -lc 'ls /opt/dicompare/dist/schemas/UMMS_Ping_v1.0.json'"
    expected_output_contains: "UMMS_Ping"

  - name: Generic Spine schema exists
    description: Verify Generic Spine schema is present
    command: "bash -lc 'ls /opt/dicompare/dist/schemas/Generic_Spine_v1.0.json'"
    expected_output_contains: "Generic_Spine"

  - name: HCP schema exists
    description: Verify HCP schema is present
    command: "bash -lc 'ls /opt/dicompare/dist/schemas/hcp_schema.json'"
    expected_output_contains: "hcp_schema"

  - name: HCP schema is valid JSON
    description: Verify HCP schema can be parsed
    command: "bash -lc 'cat /opt/dicompare/dist/schemas/hcp_schema.json | python3 -c \"import sys,json; json.load(sys.stdin); print('\"'\"'valid'\"'\"')\"'"
    expected_output_contains: "valid"

  - name: ABCD schema exists
    description: Verify ABCD schema is present
    command: "bash -lc 'ls /opt/dicompare/dist/schemas/abcd_schema_cleaned.json'"
    expected_output_contains: "abcd_schema"

  - name: ABCD schema is valid JSON
    description: Verify ABCD schema can be parsed
    command: "bash -lc 'cat /opt/dicompare/dist/schemas/abcd_schema_cleaned.json | python3 -c \"import sys,json; json.load(sys.stdin); print('\"'\"'valid'\"'\"')\"'"
    expected_output_contains: "valid"

  - name: All indexed schemas are bundled and valid JSON
    description: Verify every schema offered by the application is present and parses.
    command: |
      node <<'JS'
      const assert = require('node:assert/strict');
      const fs = require('node:fs');
      const root = '/opt/dicompare/dist';
      const index = JSON.parse(fs.readFileSync(root + '/schemas/index.json', 'utf8'));
      assert(index.length > 0, 'Schema index is empty');
      for (const entry of index) {
        assert(entry.startsWith('/schemas/'), entry);
        JSON.parse(fs.readFileSync(root + entry, 'utf8'));
      }
      console.log('All indexed schemas parsed');
      JS
    expected_output_contains: "All indexed schemas parsed"

  # ==========================================================================
  # VALIDATION FUNCTIONS VERIFICATION
  # ==========================================================================
  - name: validation-functions directory exists
    description: Verify validation-functions directory is present
    command: "bash -lc 'ls -d /opt/dicompare/dist/validation-functions'"
    expected_output_contains: "/opt/dicompare/dist/validation-functions"

  - name: Indexed validation functions are bundled
    description: Verify every function advertised by the application is present and contains a Python implementation.
    command: |
      node <<'JS'
      const assert = require('node:assert/strict');
      const fs = require('node:fs');
      const root = '/opt/dicompare/dist/validation-functions';
      const names = JSON.parse(fs.readFileSync(root + '/index.json', 'utf8'));
      assert(Array.isArray(names) && names.length > 0, 'Validation index is empty');
      for (const name of names) {
        const definition = JSON.parse(fs.readFileSync(root + '/' + name, 'utf8'));
        assert(typeof definition.implementation === 'string' && definition.implementation.trim(), name);
      }
      console.log('All indexed validation functions are bundled');
      JS
    expected_output_contains: "All indexed validation functions are bundled"

  - name: uniform_echo_spacing function exists
    description: Verify uniform echo spacing validation function is present
    command: "bash -lc 'ls /opt/dicompare/dist/validation-functions/uniform_echo_spacing.json'"
    expected_output_contains: "uniform_echo_spacing"

  - name: Bundled validation functions are valid JSON
    description: Verify the application has parseable validation-function definitions.
    command: |
      node <<'JS'
      const assert = require('node:assert/strict');
      const fs = require('node:fs');
      const root = '/opt/dicompare/dist/validation-functions';
      const files = fs.readdirSync(root).filter(name => name.endsWith('.json'));
      assert(files.length > 0, 'No validation functions are bundled');
      for (const name of files) JSON.parse(fs.readFileSync(root + '/' + name, 'utf8'));
      console.log('All validation functions parsed');
      JS
    expected_output_contains: "All validation functions parsed"

  # ==========================================================================
  # README AND LAUNCHER VERIFICATION
  # ==========================================================================
  - name: README.md exists
    description: Verify README.md is present in container
    command: ls /opt/dicompare/README.md
    expected_output_contains: "README.md"

  - name: README.md has content
    description: Verify README.md describes dicompare
    command: cat /opt/dicompare/README.md
    expected_output_contains: "dicompare"

  - name: launcher supports start subcommand
    description: Verify the installed launcher routes the start subcommand
    command: cat /usr/local/bin/dicompare
    expected_output_contains: "start)"

  - name: launcher prints usage text
    description: Verify the installed launcher contains the documented usage text
    command: cat /usr/local/bin/dicompare
    expected_output_contains: "Usage: dicompare start"

  - name: startup script uses configured webapp port
    description: Verify the startup script honors the Neurodesk webapp port override
    command: cat /opt/dicompare/start.sh
    expected_output_contains: 'NEURODESK_WEBAPP_PORT:-3001'

  - name: startup script serves built dist directory
    description: Verify the startup script serves the built frontend directory
    command: cat /opt/dicompare/start.sh
    expected_output_contains: "serve -s dist -l"

  # ==========================================================================
  # WEB SERVER STARTUP AND PORT BINDING TESTS
  # ==========================================================================
  - name: Web server can start
    description: Start the deployed launcher on a private port and require exact real index bytes
    command: node ${output_dir}/check-http.cjs start
    expected_output_contains: "Verified deployed Dicompare HTTP: start"
    expected_exit_code: 0
    timeout: 30

  - name: Web server serves index.html
    description: Require successful HTML response and byte equality with the built application
    command: node ${output_dir}/check-http.cjs index
    expected_output_contains: "Verified deployed Dicompare HTTP: index"
    expected_exit_code: 0
    timeout: 30

  - name: Web server serves favicon
    description: Require the real favicon bytes instead of an SPA fallback
    command: node ${output_dir}/check-http.cjs favicon
    expected_output_contains: "Verified deployed Dicompare HTTP: favicon"
    expected_exit_code: 0
    timeout: 30

  - name: Web server serves manifest.json
    description: Require exact manifest bytes and valid JSON
    command: node ${output_dir}/check-http.cjs manifest
    expected_output_contains: "Verified deployed Dicompare HTTP: manifest"
    expected_exit_code: 0
    timeout: 30

  - name: Web server serves schema files
    description: Fetch and parse every advertised schema with exact bundled-file byte equality
    command: node ${output_dir}/check-http.cjs schemas
    expected_output_contains: "Verified deployed Dicompare HTTP: schemas"
    expected_exit_code: 0
    timeout: 30

  - name: Web server serves validation functions
    description: Fetch every advertised Python validation definition with exact bytes and a nonempty implementation
    command: node ${output_dir}/check-http.cjs functions
    expected_output_contains: "Verified deployed Dicompare HTTP: functions"
    expected_exit_code: 0
    timeout: 30

  - name: Web server single page mode works
    description: Require an unknown application route to return the exact built index
    command: node ${output_dir}/check-http.cjs spa
    expected_output_contains: "Verified deployed Dicompare HTTP: spa"
    expected_exit_code: 0
    timeout: 30

  # ==========================================================================
  # SCHEMA CONTENT VALIDATION
  # ==========================================================================
  - name: HCP schema has series definitions
    description: Verify HCP schema contains acquisitions definitions
    command: "bash -lc 'cat /opt/dicompare/dist/schemas/hcp_schema.json | python3 -c \"import sys,json; d=json.load(sys.stdin); print('\"'\"'acquisitions'\"'\"' if '\"'\"'acquisitions'\"'\"' in d else '\"'\"'missing'\"'\"')\"'"
    expected_output_contains: "acquisitions"

  - name: ABCD schema has series definitions
    description: Verify ABCD schema contains acquisitions definitions
