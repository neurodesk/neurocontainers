# cosmomvpa container test suite
# Tests for cosmomvpa v1.1.0 - CoSMoMVPA toolbox for GNU Octave
#
# Tests focus on the packaged Octave runtime and the installed CoSMoMVPA
# toolbox entrypoints that the image actually exposes.

name: cosmomvpa
version: "1.1.0"

setup:
  script: |
    #!/usr/bin/env bash
    set -e
    mkdir -p test_output/cosmomvpa

tests:
  - name: octave on PATH
    description: Verify Octave is available in the image
    command: command -v octave
    expected_output_contains: "/usr/bin/octave"

  - name: octave version
    description: Verify Octave starts successfully
    command: octave --version | head -1
    expected_output_contains: "GNU Octave"

  - name: CoSMoMVPA tree exists
    description: Verify the CoSMoMVPA source tree was installed
    command: ls -d /opt/cosmomvpa-1.1.0/CoSMoMVPA
    expected_output_contains: "/opt/cosmomvpa-1.1.0/CoSMoMVPA"

  - name: cosmo_wtf resolves
    description: Verify Octave can resolve the main CoSMoMVPA diagnostic function
    command: octave --no-gui --eval "addpath(genpath('/opt/cosmomvpa-1.1.0/CoSMoMVPA')); which cosmo_wtf"
    expected_output_contains: "cosmo_wtf.m"

  - name: cosmo_wtf runs
    description: Verify the CoSMoMVPA diagnostic function executes
    command: octave --no-gui --eval "addpath(genpath('/opt/cosmomvpa-1.1.0/CoSMoMVPA')); cosmo_wtf();"
    expected_output_contains: "warning: Using cosmo_config"

  - name: Exact held-out LDA classification
    description: Verify real classification and training-only normalization across four balanced folds.
    command: |
      set -e
      work="$(mktemp -d "$(pwd)/test_output/cosmomvpa/classification.XXXXXX")"
      cat > "$work/classification.m" <<'OCTAVE'
      addpath(genpath('/opt/cosmomvpa-1.1.0/CoSMoMVPA'));
      ds.samples = [-10.3; 9.7; -10.1; 9.9; -9.9; 10.1; -9.7; 10.3];
      ds.sa.targets = repmat([1; 2], 4, 1);
      ds.sa.chunks = kron((1:4)', ones(2, 1));
      partitions = cosmo_nfold_partitioner(ds);
      assert(numel(partitions.train_indices) == 4);
      assert(numel(partitions.test_indices) == 4);
      for fold = 1:4
          train = partitions.train_indices{fold};
          test = partitions.test_indices{fold};
          assert(numel(train) == 6 && numel(test) == 2);
          assert(isempty(intersect(train, test)));
          assert(all(ds.sa.chunks(test) == fold));
          assert(all(ds.sa.chunks(train) ~= fold));
      end
      for normalize = 0:1
          opt = struct();
          if normalize
              opt.normalization = 'zscore';
          end
          [predictions, accuracy] = cosmo_crossvalidate(ds, @cosmo_classify_lda, partitions, opt);
          assert(isequal(size(predictions), [8, 4]));
          assert(all(accuracy(:) == 1));
          assert(all(sum(isfinite(predictions), 2) == 1));
          for fold = 1:4
              mask = ds.sa.chunks == fold;
              assert(isequal(predictions(mask, fold), ds.sa.targets(mask)));
              assert(all(isnan(predictions(~mask, fold))));
          end
      end
      fprintf('Exact LDA predictions verified for all four held-out chunks, raw and zscore\n');
      OCTAVE
      octave --no-gui --quiet "$work/classification.m"
    expected_output_contains: "Exact LDA predictions verified for all four held-out chunks, raw and zscore"
    timeout: 120

cleanup:
  script: |
    #!/usr/bin/env bash
    echo "Test outputs preserved in test_output/cosmomvpa/"
