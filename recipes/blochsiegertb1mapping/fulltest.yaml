  command: |
    python3 - <<'PY'
    import json
    from pathlib import Path

    label = json.loads(
        Path("/opt/code/python-ismrmrd-server/OpenReconLabel.json").read_text()
    )
    parameters = {item["id"]: item for item in label["parameters"]}
    assert "sendb1" not in parameters
    assert "sendb0" not in parameters
    assert "sendmask" not in parameters
    for parameter_id, label_text in (
        ("applymask", "Apply Mask"),
        ("applyfilter", "Apply Filter"),
    ):
        parameter = parameters[parameter_id]
        assert parameter["label"]["en"] == label_text
        assert parameter["type"] == "boolean"
        assert parameter["default"] is False
    delta_te = parameters["deltatems"]
    assert delta_te["label"]["en"] == "Delta TE"
    assert delta_te["type"] == "double"
    assert delta_te["default"] == 1.0
    assert delta_te["unit"]["en"] == "ms"
    assert "abstxrefamp" not in parameters
    ref_amplitude = parameters["refamplitude"]
    assert ref_amplitude["label"]["en"] == "Ref Amplitude"
    assert ref_amplitude["type"] == "double"
    assert ref_amplitude["default"] == 301.0
    assert ref_amplitude["minimum"] == 0
    assert ref_amplitude["maximum"] == 2000
    assert ref_amplitude["unit"]["en"] == "V"
    for parameter_id in ("predummy", "postdummy"):
        dummy = parameters[parameter_id]
        assert dummy["type"] == "int"
        assert dummy["default"] == 2
        assert dummy["minimum"] == 0
        assert dummy["maximum"] == 10
        assert dummy["unit"]["en"] == "TRs"
    print("Delta TE OpenRecon parameter is packaged")
