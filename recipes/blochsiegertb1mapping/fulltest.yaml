name: blochsiegertb1mapping
version: 1.0.41
default_timeout: 120
tests:
- name: Bloch-Siegert OpenRecon workflow unit smoke test
  description: Verify the container runtime smoke test for this tool.
  command: |
    python3 - <<'PY'
    import importlib.util
    import math
    import sys
    from pathlib import Path

    import ismrmrd
    import numpy as np

    wrapper_path = Path("/opt/code/python-ismrmrd-server/blochsiegertb1mapping.py")
    if not wrapper_path.exists():
        wrapper_path = Path("blochsiegertb1mapping.py")
    spec = importlib.util.spec_from_file_location("blochsiegertb1mapping", wrapper_path)
    module = importlib.util.module_from_spec(spec)
    sys.modules["blochsiegertb1mapping"] = module
    spec.loader.exec_module(module)

    def first(value):
        return value[0] if isinstance(value, list) else value

    def raw_phase(radians):
        return (float(radians) + math.pi) * module.PHASE_WRAP / (2.0 * math.pi)

    def make_image(
        frame_index,
        kind,
        value,
        slice_index=0,
        series_name="bss_source",
        series_uid="1.2.826.0.1.3680043.10.543.1",
    ):
        data = np.full((1, 1, 8, 8), value, dtype=np.float32)
        if kind == "magnitude":
            data[:, :, 2:6, 2:6] += 100.0 + frame_index
        image = ismrmrd.Image.from_array(data, transpose=False)
        header = image.getHead()
        header.image_type = (
            ismrmrd.IMTYPE_MAGNITUDE if kind == "magnitude" else ismrmrd.IMTYPE_PHASE
        )
        header.image_series_index = 1 if kind == "magnitude" else 2
        header.image_index = frame_index + 1
        header.slice = slice_index
        header.position = (0.0, 0.0, float(slice_index * 5.0))
        header.slice_dir = (0.0, 0.0, 1.0)
        header.field_of_view = (8.0, 8.0, 5.0)
        image.setHead(header)

        meta = ismrmrd.Meta()
        meta["DataRole"] = "Image"
        meta["SeriesDescription"] = series_name
        meta["SequenceDescription"] = series_name
        meta["ProtocolName"] = series_name
        meta["SeriesNumberRangeNameUID"] = f"{series_name}_{kind}"
        meta["SeriesInstanceUID"] = f"{series_uid}.{1 if kind == 'magnitude' else 2}"
        meta["SOPInstanceUID"] = f"{series_uid}.{1 if kind == 'magnitude' else 2}.{frame_index + 1}"
        meta["ComplexImageComponent"] = "MAGNITUDE" if kind == "magnitude" else "PHASE"
        meta["ImageType"] = (
            "ORIGINAL\\PRIMARY\\M" if kind == "magnitude" else "ORIGINAL\\PRIMARY\\P"
        )
        meta["RescaleSlope"] = "2"
        meta["RescaleIntercept"] = "-4096"
        image.attribute_string = meta.serialize()
        return image

    def make_dataset(phase_radians, series_name="bss_source"):
        magnitude = [
            make_image(index, "magnitude", 10.0 + index, series_name=series_name)
            for index in range(len(phase_radians))
        ]
        phase = [
            make_image(index, "phase", raw_phase(radian), series_name=series_name)
            for index, radian in enumerate(phase_radians)
        ]
        return magnitude + phase

    # The first two pre-reference frames are deliberately different: B0 must
    # use only frame 3, while BSp must depend only on A and B.
    one_tx_phase = [
        0.4, -0.2, 0.1,
        0.1, 0.2, -0.2, 0.4,
        0.1, 0.3, 0.5,
        -0.6,
    ]
    one_tx_images = make_dataset(one_tx_phase)
    settings = module._settings_from_config({"parameters": {}})
    assert settings["deltatems"] == 1.0
    assert settings["applymask"] is False
    assert settings["applyfilter"] is False
    assert module.FILTER_POLYNOMIAL_ORDER_BY_TX == {1: 10, 8: 10}
    assert "sendb1" not in settings
    assert "sendb0" not in settings
    assert "sendmask" not in settings
    one_tx = module.compute_bloch_siegert_maps(one_tx_images, settings)
    assert one_tx["nframe"] == 11
    assert one_tx["ntx"] == 1
    assert one_tx["slice_count"] == 1
    assert one_tx["b1"].shape == (1, 1, 8, 8)
    assert one_tx["bsp"].shape == (1, 1, 8, 8)
    assert one_tx["phsc"].shape == (1, 1, 8, 8)
    assert one_tx["b0"].shape == (1, 8, 8)
    assert np.allclose(one_tx["bsp"][0, 0, 3, 3], 0.3, atol=1e-5)
    expected_b1 = (
        math.sqrt(0.3 / (0.044 * 12.0 / 6.0))
        * 301.0
        / 200.0
    )
    assert np.allclose(one_tx["b1"][0, 0, 3, 3], expected_b1, atol=1e-5)
    wider_pulse = module.compute_bloch_siegert_maps(
        one_tx_images,
        module._settings_from_config({"parameters": {"bspulsewidthms": 24.0}}),
    )
    assert np.allclose(
        wider_pulse["b1"][0, 0, 3, 3],
        expected_b1 / math.sqrt(2.0),
        atol=1e-5,
    )
    assert np.allclose(one_tx["phsc"][0, 0, 3, 3], -0.6, atol=1e-5)
    assert np.allclose(
        one_tx["b0"][0, 3, 3],
        0.2 * 1000.0 / (2.0 * math.pi),
        atol=1e-5,
    )
    assert np.allclose(
        11.74 * settings["refamplitude"] / one_tx["b1"][0, 0, 3, 3],
        11.74 * 301.0 / expected_b1,
        atol=1e-5,
    )
    half_ms_b0 = module.compute_bloch_siegert_maps(
        one_tx_images,
        module._settings_from_config({"parameters": {"deltatems": 0.5}}),
    )
    assert np.allclose(
        half_ms_b0["b0"][0, 3, 3],
        0.2 * 1000.0 / (2.0 * math.pi * 0.5),
        atol=1e-5,
    )
    try:
        module.compute_bloch_siegert_maps(
            one_tx_images,
            module._settings_from_config({"parameters": {"deltatems": 0.0}}),
        )
    except ValueError as error:
        assert "deltatems must be positive" in str(error)
    else:
        raise AssertionError("zero Delta TE must be rejected")
    assert np.allclose(one_tx["bsp"][0, 0, 0, 0], 0.0, atol=1e-5)
    assert np.allclose(one_tx["b1"][0, 0, 0, 0], 0.0, atol=1e-5)
    assert np.allclose(one_tx["phsc"][0, 0, 0, 0], -0.6, atol=1e-5)
    assert np.allclose(
        one_tx["b0"][0, 0, 0],
        0.0,
        atol=1e-5,
    )
    assert one_tx["phase_mask"].shape == (1, 8, 8)
    assert one_tx["mask_for_magnitude"].shape == (1, 8, 8)
    assert np.array_equal(one_tx["mask"], one_tx["mask_for_magnitude"])
    assert int(one_tx["mask_for_magnitude"][0, 3, 3]) == 1
    assert int(one_tx["mask_for_magnitude"][0, 0, 0]) == 0

    # phaseMask uses the first PreDummy+1 frames and every C/D frame.
    stability_phase = np.zeros((5, 1, 5, 5), dtype=np.float32)
    stability_phase[:, :, :, 0] = np.asarray(
        [0.0, math.pi / 2.0, -math.pi / 2.0, math.pi, -math.pi],
        dtype=np.float32,
    )[:, None, None]
    phase_mask, phase_std = module._phase_stability_mask(
        np.exp(1j * stability_phase),
        pre_dummy=2,
        phase_c_indices=np.asarray([3]),
        phase_d_indices=np.asarray([4]),
    )
    assert bool(phase_mask[0, 2, 0]) is False
    assert float(phase_std[0, 2, 0]) >= 30.0
    assert bool(phase_mask[0, 2, 2]) is True

    # MaskForMagnitude follows the MATLAB MBSS1 threshold with 2 * std.
    magnitude_values = np.asarray([[0.0, 1.0], [2.0, 10.0]], dtype=np.float32)
    magnitude_stack = np.repeat(magnitude_values[None, None, :, :], 4, axis=0)
    magnitude_mask = module._bloch_siegert_magnitude_mask(magnitude_stack, ntx=1)
    assert bool(magnitude_mask[0, 1, 0]) is False
    assert bool(magnitude_mask[0, 1, 1]) is True

    z_grid, y_grid, x_grid = np.meshgrid(
        module._normalized_filter_axis(4),
        module._normalized_filter_axis(5),
        module._normalized_filter_axis(6),
        indexing="ij",
    )
    polynomial_volume = 1.0 + 0.2 * x_grid - 0.3 * y_grid + 0.4 * z_grid
    trusted_mask = np.ones(polynomial_volume.shape, dtype=bool)
    trusted_mask[1:3, 2, 2:4] = False
    for replace_entire_volume in (False, True):
        extrapolated = module._extrapolate_phase_volume(
            polynomial_volume,
            trusted_mask,
            polynomial_order=1,
            zero_non_positive=False,
            apply_to_entire_volume=replace_entire_volume,
            smooth_sigma=0.0,
        )
        assert np.allclose(extrapolated, polynomial_volume, atol=1e-5)
    assert len(module._polynomial_exponents(8)) == 165
    try:
        module._extrapolate_phase_volume(
            polynomial_volume,
            np.zeros(polynomial_volume.shape, dtype=bool),
            polynomial_order=1,
        )
    except ValueError as error:
        assert "No trusted voxels" in str(error)
    else:
        raise AssertionError("filtering without trusted voxels must fail")

    original_extrapolator = module._extrapolate_phase_volume
    extrapolation_modes = []
    def recording_extrapolator(
        volume,
        mask,
        polynomial_order,
        zero_non_positive,
        apply_to_entire_volume,
        smooth_sigma,
    ):
        extrapolation_modes.append(apply_to_entire_volume)
        return np.asarray(volume, dtype=np.float32)
    module._extrapolate_phase_volume = recording_extrapolator
    try:
        test_bsp = np.ones((1, 1, 3, 3), dtype=np.float32)
        test_b0 = np.ones((1, 3, 3), dtype=np.float32)
        test_mask = np.ones((1, 3, 3), dtype=bool)
        module._filter_bloch_siegert_maps(
            test_bsp, test_b0, test_mask, test_mask, False
        )
        assert extrapolation_modes == [False, False]
        extrapolation_modes.clear()
        module._filter_bloch_siegert_maps(
            test_bsp, test_b0, test_mask, test_mask, True
        )
        assert extrapolation_modes == [True, False]
    finally:
        module._extrapolate_phase_volume = original_extrapolator

    hole_2d = np.ones((5, 5), dtype=bool)
    hole_2d[2, 2] = False
    hole_2d[0, 0] = False
    filled_2d = module._fill_holes_2d_or_3d(hole_2d)
    assert bool(filled_2d[2, 2]) is True
    assert bool(filled_2d[0, 0]) is False
    hole_3d = np.ones((5, 5, 5), dtype=bool)
    hole_3d[2, 2, 2] = False
    hole_3d[0, 0, 0] = False
    filled_3d = module._fill_holes_2d_or_3d(hole_3d)
    assert bool(filled_3d[2, 2, 2]) is True
    assert bool(filled_3d[0, 0, 0]) is False
    through_plane_tunnel = np.ones((5, 5, 5), dtype=bool)
    through_plane_tunnel[:, 2, 2] = False
    filled_tunnel = module._fill_holes_2d_or_3d(through_plane_tunnel)
    assert np.all(filled_tunnel[:, 2, 2])

    shorter_dummy_phase = [
        0.4, 0.1,
        0.1, 0.2, -0.2, 0.4,
        0.2, 0.4,
        -0.6,
    ]
    shorter_dummy_settings = module._settings_from_config(
        {"parameters": {"predummy": 1, "postdummy": 1}}
    )
    assert shorter_dummy_settings["predummy"] == 1
    assert shorter_dummy_settings["postdummy"] == 1
    shorter_dummy = module.compute_bloch_siegert_maps(
        make_dataset(shorter_dummy_phase),
        shorter_dummy_settings,
    )
    assert shorter_dummy["nframe"] == 9
    assert shorter_dummy["ntx"] == 1
    assert np.allclose(
        shorter_dummy["bsp"][0, 0, 3, 3],
        0.3,
        atol=1e-5,
    )
    assert np.allclose(
        shorter_dummy["phsc"][0, 0, 3, 3],
        -0.6,
        atol=1e-5,
    )
    assert np.allclose(
        shorter_dummy["b0"][0, 3, 3],
        0.2 * 1000.0 / (2.0 * math.pi),
        atol=1e-5,
    )

    longer_dummy_phase = [
        0.4, -0.2, 0.0, 0.2,
        0.1, 0.2, -0.2, 0.4,
        0.0, 0.2, 0.4, 0.6,
        -0.6,
    ]
    longer_dummy_settings = module._settings_from_config(
        {"parameters": {"predummy": 3, "postdummy": 3}}
    )
    assert longer_dummy_settings["predummy"] == 3
    assert longer_dummy_settings["postdummy"] == 3
    longer_dummy = module.compute_bloch_siegert_maps(
        make_dataset(longer_dummy_phase),
        longer_dummy_settings,
    )
    assert longer_dummy["nframe"] == 13
    assert longer_dummy["ntx"] == 1
    assert np.allclose(
        longer_dummy["bsp"][0, 0, 3, 3],
        0.3,
        atol=1e-5,
    )
    assert np.allclose(
        longer_dummy["phsc"][0, 0, 3, 3],
        -0.6,
        atol=1e-5,
    )
    assert np.allclose(
        longer_dummy["b0"][0, 3, 3],
        0.2 * 1000.0 / (2.0 * math.pi),
        atol=1e-5,
    )

    zero_dummy_phase = [
        0.1,
        0.1, 0.2, -0.2, 0.4,
        0.3,
        -0.6,
    ]
    zero_dummy_settings = module._settings_from_config(
        {"parameters": {"predummy": 0, "postdummy": 0}}
    )
    zero_dummy = module.compute_bloch_siegert_maps(
        make_dataset(zero_dummy_phase),
        zero_dummy_settings,
    )
    assert zero_dummy["nframe"] == 7
    assert zero_dummy["ntx"] == 1
    assert np.allclose(zero_dummy["bsp"][0, 0, 3, 3], 0.3, atol=1e-5)
    assert np.allclose(zero_dummy["phsc"][0, 0, 3, 3], -0.6, atol=1e-5)
    assert np.allclose(
        zero_dummy["b0"][0, 3, 3],
        0.2 * 1000.0 / (2.0 * math.pi),
        atol=1e-5,
    )

    ten_pre_dummy_phase = [
        0.4, -0.2,
        *([0.1] * 9),
        0.1, 0.2, -0.2, 0.4,
        0.1, 0.3, 0.5,
        -0.6,
    ]
    ten_pre_dummy_settings = module._settings_from_config(
        {"parameters": {"predummy": 10, "postdummy": 2}}
    )
    ten_pre_dummy = module.compute_bloch_siegert_maps(
        make_dataset(ten_pre_dummy_phase),
        ten_pre_dummy_settings,
    )
    assert ten_pre_dummy["nframe"] == 19
    assert ten_pre_dummy["ntx"] == 1
    assert np.allclose(ten_pre_dummy["bsp"][0, 0, 3, 3], 0.3, atol=1e-5)
    assert np.allclose(ten_pre_dummy["phsc"][0, 0, 3, 3], -0.6, atol=1e-5)
    assert np.allclose(
        ten_pre_dummy["b0"][0, 3, 3],
        0.2 * 1000.0 / (2.0 * math.pi),
        atol=1e-5,
    )

    small_negative_phase = list(one_tx_phase)
    small_negative_phase[5] = 0.2
    small_negative = module.compute_bloch_siegert_maps(
        make_dataset(small_negative_phase),
        settings,
    )
    assert np.allclose(small_negative["bsp"][0, 0, 3, 3], -0.1, atol=1e-5)
    assert np.allclose(small_negative["b1"][0, 0, 3, 3], 0.0, atol=1e-5)

    retained_negative_phase = list(one_tx_phase)
    retained_negative_phase[5] = 0.6
    retained_negative = module.compute_bloch_siegert_maps(
        make_dataset(retained_negative_phase),
        settings,
    )
    assert np.allclose(retained_negative["bsp"][0, 0, 3, 3], -0.5, atol=1e-5)
    assert np.allclose(retained_negative["b1"][0, 0, 3, 3], 0.0, atol=1e-5)

    wrapped_negative_phase = list(one_tx_phase)
    wrapped_negative_phase[5] = 2.0
    wrapped_negative = module.compute_bloch_siegert_maps(
        make_dataset(wrapped_negative_phase),
        settings,
    )
    assert np.allclose(
        wrapped_negative["bsp"][0, 0, 3, 3],
        2.0 * math.pi - 1.9,
        atol=1e-5,
    )

    converted_dicom_like_images = []
    for image in one_tx_images:
        copied = ismrmrd.Image.from_array(np.asarray(image.data).copy(), transpose=False)
        header = image.getHead()
        header.image_type = ismrmrd.IMTYPE_MAGNITUDE
        copied.setHead(header)
        copied.attribute_string = image.attribute_string
        converted_dicom_like_images.append(copied)
    fallback_magnitude, fallback_phase = module._split_magnitude_phase_images(
        converted_dicom_like_images
    )
    assert len(fallback_magnitude) == 11
    assert len(fallback_phase) == 11
    fallback_result = module.compute_bloch_siegert_maps(
        converted_dicom_like_images,
        settings,
    )
    assert np.allclose(fallback_result["b1"], one_tx["b1"], atol=1e-5)

    volume_frame_images = []
    for image in one_tx_images:
        base = np.asarray(image.data)[0, 0]
        volume_data = np.stack([base, base + 1.0, base + 2.0], axis=0)
        copied = ismrmrd.Image.from_array(volume_data, transpose=False)
        source_header = image.getHead()
        header = copied.getHead()
        header.image_type = source_header.image_type
        header.image_series_index = source_header.image_series_index
        header.image_index = source_header.image_index
        header.slice = source_header.slice
        header.position = source_header.position
        header.slice_dir = source_header.slice_dir
        header.field_of_view = (8.0, 8.0, 12.0)
        copied.setHead(header)
        copied.attribute_string = image.attribute_string
        volume_frame_images.append(copied)
    volume_result = module.compute_bloch_siegert_maps(volume_frame_images, settings)
    assert volume_result["b1"].shape == (1, 3, 8, 8)
    assert volume_result["b0"].shape == (3, 8, 8)
    volume_result["b1"][0, 0, :, :] = 1.0
    volume_result["b1"][0, 1, :, :] = 2.0
    volume_result["b1"][0, 2, :, :] = 5.0
    volume_outputs = module.build_output_images(volume_result, settings, volume_frame_images)
    assert np.asarray(volume_outputs[0].data).shape == (1, 3, 8, 8)
    assert list(volume_outputs[0].getHead().matrix_size) == [8, 8, 3]
    volume_b1_pixels = np.asarray(volume_outputs[0].data)[0]
    assert int(np.min(volume_b1_pixels)) == 0
    assert int(np.max(volume_b1_pixels)) == 4095
    assert int(volume_b1_pixels[0, 0, 0]) == 0
    assert int(volume_b1_pixels[1, 0, 0]) == round(4095.0 / 4.0)
    assert int(volume_b1_pixels[2, 0, 0]) == 4095
    volume_b1_meta = ismrmrd.Meta.deserialize(volume_outputs[0].attribute_string)
    assert float(first(volume_b1_meta.get("BlochSiegertDisplayInputMin"))) == 1.0
    assert float(first(volume_b1_meta.get("BlochSiegertDisplayInputMax"))) == 5.0
    assert np.isclose(
        float(first(volume_b1_meta.get("RescaleSlope"))),
        4.0 / 4095.0,
    )
    assert float(first(volume_b1_meta.get("RescaleIntercept"))) == 1.0
    assert float(first(volume_b1_meta.get("WindowCenter"))) == 3.0
    assert float(first(volume_b1_meta.get("WindowWidth"))) == 4.0
    module._validate_output_images(volume_outputs, volume_frame_images)

    display_one_tx = dict(one_tx)
    display_one_tx["b1"] = one_tx["b1"].copy()
    display_one_tx["b1"][0, 0, 0, 0] = 0.0
    display_one_tx["b1"][0, 0, 7, 7] = 8.0
    display_one_tx["bsp"] = one_tx["bsp"].copy()
    display_one_tx["bsp"][0, 0, 0, 0] = 0.0
    display_one_tx["bsp"][0, 0, 3, 3] = -0.1
    display_one_tx["bsp"][0, 0, 7, 7] = math.pi
    display_one_tx["phsc"] = one_tx["phsc"].copy()
    display_one_tx["phsc"][0, 0, 0, 0] = -1.0
    display_one_tx["phsc"][0, 0, 7, 7] = 1.0
    display_one_tx["b0"] = one_tx["b0"].copy()
    display_one_tx["b0"][0, 0, 0] = -100.0
    display_one_tx["b0"][0, 7, 7] = 100.0
    outputs = module.build_output_images(
        display_one_tx,
        settings,
        one_tx_images,
    )
    assert [int(image.image_series_index) for image in outputs] == [
        101, 120, 140, 160, 170, 180, 181,
    ]
    ref_amplitude_output = [
        image for image in outputs if int(image.image_series_index) == 170
    ][0]
    ref_amplitude_meta = ismrmrd.Meta.deserialize(ref_amplitude_output.attribute_string)
    assert first(ref_amplitude_meta.get("BlochSiegertOutput")) == (
        "BlochSiegertReferenceAmplitude"
    )
    ref_amplitude_slope = float(first(ref_amplitude_meta.get("RescaleSlope")))
    ref_amplitude_intercept = float(first(ref_amplitude_meta.get("RescaleIntercept")))
    ref_amplitude_restored = (
        np.asarray(ref_amplitude_output.data, dtype=np.float64)
        * ref_amplitude_slope
        + ref_amplitude_intercept
    )
    assert np.isclose(
        ref_amplitude_restored[0, 0, 3, 3],
        11.74 * 301.0 / expected_b1,
        atol=ref_amplitude_slope / 2.0,
    )
    custom_ref_outputs = module.build_output_images(
        one_tx,
        dict(settings, refamplitude=100.0, applymask=True),
        one_tx_images,
    )
    custom_ref_output = [
        image for image in custom_ref_outputs
        if int(image.image_series_index) == 170
    ][0]
    custom_ref_meta = ismrmrd.Meta.deserialize(custom_ref_output.attribute_string)
    custom_ref_slope = float(first(custom_ref_meta.get("RescaleSlope")))
    custom_ref_intercept = float(first(custom_ref_meta.get("RescaleIntercept")))
    custom_ref_restored = (
        np.asarray(custom_ref_output.data, dtype=np.float64)
        * custom_ref_slope
        + custom_ref_intercept
    )
    assert np.isclose(
        custom_ref_restored[0, 0, 3, 3],
        11.74 * 100.0 / expected_b1,
        atol=custom_ref_slope / 2.0,
    )
    assert np.isclose(
        custom_ref_restored[0, 0, 0, 0],
        0.0,
        atol=abs(custom_ref_slope) / 2.0,
    )
    b1_processing = [image for image in outputs if int(image.image_series_index) == 180]
    b0_processing = [image for image in outputs if int(image.image_series_index) == 181]
    assert len(b1_processing) == 1
    assert len(b0_processing) == 1
    assert np.asarray(b1_processing[0].data).shape == (1, 1, 1024, 1024)
    assert np.asarray(b0_processing[0].data).shape == (1, 1, 1024, 1024)
    assert int(b1_processing[0].getHead().image_index) == 1
    assert int(b0_processing[0].getHead().image_index) == 1
    module._validate_output_images(outputs, one_tx_images)
    for image in outputs:
        pixels = np.asarray(image.data)
        assert pixels.dtype == np.uint16
        assert int(np.min(pixels)) == 0
        assert int(np.max(pixels)) == 4095
        meta = ismrmrd.Meta.deserialize(image.attribute_string)
        assert first(meta.get("BlochSiegertDisplayMin")) == "0"
        assert first(meta.get("BlochSiegertDisplayMax")) == "4095"
        assert first(meta.get("RescaleSlope")) != "2"
        assert first(meta.get("RescaleIntercept")) != "-4096"

    b1_pixels = np.asarray(outputs[0].data)
    assert b1_pixels.dtype == np.uint16
    assert int(b1_pixels[0, 0, 3, 3]) == round(expected_b1 * 4095.0 / 8.0)
    assert int(np.min(b1_pixels)) == 0
    assert int(np.max(b1_pixels)) == 4095
    first_meta = ismrmrd.Meta.deserialize(outputs[0].attribute_string)
    assert first(first_meta.get("SeriesDescription")) == "bss_source-b1"
    assert first(first_meta.get("BlochSiegertOutput")) == "BlochSiegertB1Map"
    assert first(first_meta.get("BlochSiegertUnits")) == "uT"
    assert int(first(first_meta.get("Keep_image_geometry"))) == 0
    assert first(first_meta.get("SequenceDescriptionAdditional")) == "openrecon"
    assert first(first_meta.get("IceMiniHead")) is None
    assert first(first_meta.get("ImageTypeValue3")) is None
    assert np.isclose(
        float(first(first_meta.get("BlochSiegertDisplayScale"))),
        4095.0 / 8.0,
    )
    assert first(first_meta.get("BlochSiegertDisplayInputMin")) == "0"
    assert first(first_meta.get("BlochSiegertDisplayInputMax")) == "8"
    assert first(first_meta.get("BlochSiegertDisplayMin")) == "0"
    assert first(first_meta.get("BlochSiegertDisplayMax")) == "4095"
    b1_rescale_slope = float(first(first_meta.get("RescaleSlope")))
    assert np.isclose(b1_rescale_slope, 8.0 / 4095.0)
    assert first(first_meta.get("RescaleIntercept")) == "0"
    b1_formula = first(first_meta.get("BlochSiegertDisplayFormula"))
    assert b1_formula == (
        f"uT = display * {module._format_display_number(8.0 / 4095.0)} + 0"
    )
    assert first(first_meta.get("ImageComments")) == (
        f"bss_source-b1; scanner display uint16 0-4095; {b1_formula}"
    )
    assert first(first_meta.get("ImageComment")) == first(first_meta.get("ImageComments"))
    assert float(first(first_meta.get("WindowCenter"))) == 4.0
    assert float(first(first_meta.get("WindowWidth"))) == 8.0
    restored_b1 = b1_pixels.astype(np.float64) * b1_rescale_slope
    assert np.isclose(
        restored_b1[0, 0, 3, 3],
        expected_b1,
        atol=b1_rescale_slope / 2.0,
    )
    phase_meta = ismrmrd.Meta.deserialize(outputs[2].attribute_string)
    assert first(phase_meta.get("BlochSiegertOutput")) == "BlochSiegertTransmitPhase"
    assert first(phase_meta.get("BlochSiegertUnits")) == "degrees"
    assert first(phase_meta.get("BlochSiegertDisplayConversion")) == "radians to degrees"
    assert "scanner display uint16 0-4095" in first(phase_meta.get("ImageComments"))
    assert first(phase_meta.get("ImageComment")) == first(phase_meta.get("ImageComments"))

    expected_ranges = [
        (outputs[1], math.degrees(-0.1), 180.0, math.degrees(-0.1)),
        (outputs[2], math.degrees(-1.0), math.degrees(1.0), math.degrees(-0.6)),
        (outputs[3], -100.0, 100.0, float(one_tx["b0"][0, 3, 3])),
    ]
    for image, physical_min, physical_max, expected_value in expected_ranges:
        meta = ismrmrd.Meta.deserialize(image.attribute_string)
        slope = float(first(meta.get("RescaleSlope")))
        intercept = float(first(meta.get("RescaleIntercept")))
        assert np.isclose(slope, (physical_max - physical_min) / 4095.0)
        assert np.isclose(intercept, physical_min)
        restored = np.asarray(image.data, dtype=np.float64) * slope + intercept
        assert np.isclose(
            restored[0, 0, 3, 3],
            expected_value,
            atol=slope / 2.0,
        )

    masked_one_tx = dict(display_one_tx)
    masked_one_tx["mask_for_magnitude"] = np.ones((1, 8, 8), dtype=np.uint16)
    masked_one_tx["mask_for_magnitude"][0, 3, 3] = 0
    masked_outputs = module.build_output_images(
        masked_one_tx,
        dict(settings, applymask=True),
        one_tx_images,
    )
    for image in masked_outputs:
        if int(image.image_series_index) >= 180:
            continue
        meta = ismrmrd.Meta.deserialize(image.attribute_string)
        slope = float(first(meta.get("RescaleSlope")))
        intercept = float(first(meta.get("RescaleIntercept")))
        restored = np.asarray(image.data, dtype=np.float64) * slope + intercept
        assert np.isclose(restored[0, 0, 3, 3], 0.0, atol=abs(slope) / 2.0)

    eight_tx_phase = [0.1] * 46
    for tx_index in range(8):
        eight_tx_phase[3 + 4 * tx_index] = 0.1
        eight_tx_phase[4 + 4 * tx_index] = 0.2
        eight_tx_phase[5 + 4 * tx_index] = -0.2 - 0.01 * tx_index
        eight_tx_phase[6 + 4 * tx_index] = 0.4
    eight_tx_phsc = [-0.8 + 0.1 * tx_index for tx_index in range(8)]
    eight_tx_phase[35:38] = [0.3, 0.3, 0.3]
    eight_tx_phase[38:46] = eight_tx_phsc
    eight_tx_images = make_dataset(eight_tx_phase, series_name="bss_8tx")
    eight_tx = module.compute_bloch_siegert_maps(eight_tx_images, settings)
    mandatory_outputs = module.build_output_images(
        eight_tx,
        {"sendb1": True, "sendbsp": False, "sendphsc": False, "sendb0": False},
        eight_tx_images,
    )
    assert len(mandatory_outputs) == 18
    assert [int(image.image_series_index) for image in mandatory_outputs] == [
        *range(101, 109), 160, *([180] * 8), 181,
    ]
    assert first(
        ismrmrd.Meta.deserialize(mandatory_outputs[9].attribute_string).get(
            "NumberInSeries"
        )
    ) == "8"
    assert first(
        ismrmrd.Meta.deserialize(mandatory_outputs[7].attribute_string).get(
            "SeriesDescription"
        )
    ) == "bss_8tx-b1-tx08"
    assert first(
        ismrmrd.Meta.deserialize(mandatory_outputs[8].attribute_string).get(
            "SeriesDescription"
        )
    ) == "bss_8tx-b0"
    module._validate_output_images(mandatory_outputs, eight_tx_images)

    forty_slice_phase = list(eight_tx_phase)
    forty_slice_magnitude = []
    forty_slice_phase_images = []
    for slice_index in range(40):
        for frame_index, phase_radian in enumerate(forty_slice_phase):
            forty_slice_magnitude.append(
                make_image(
                    frame_index,
                    "magnitude",
                    10.0 + frame_index,
                    slice_index=slice_index,
                    series_name="bss_8tx_40_slice",
                )
            )
            forty_slice_phase_images.append(
                make_image(
                    frame_index,
                    "phase",
                    raw_phase(phase_radian),
                    slice_index=slice_index,
                    series_name="bss_8tx_40_slice",
                )
            )
    forty_slice_images = forty_slice_magnitude + forty_slice_phase_images
    forty_slice = module.compute_bloch_siegert_maps(forty_slice_images, settings)
    assert forty_slice["slice_count"] == 40
    assert forty_slice["nframe"] == 46
    assert forty_slice["ntx"] == 8
    assert forty_slice["b1"].shape == (8, 40, 8, 8)
    forty_slice_mandatory = module.build_output_images(
        forty_slice,
        {"sendb1": True, "sendbsp": False, "sendphsc": False, "sendb0": False},
        forty_slice_images,
    )
    assert len(forty_slice_mandatory) == 18
    forty_slice_maps = forty_slice_mandatory[:9]
    assert all(
        np.asarray(image.data).shape == (1, 40, 8, 8)
        for image in forty_slice_maps
    )
    assert all(
        list(image.getHead().matrix_size) == [8, 8, 40]
        for image in forty_slice_maps
    )
    assert all(
        np.asarray(image.data).shape == (1, 1, 1024, 1024)
        for image in forty_slice_mandatory[9:]
    )
    module._validate_output_images(forty_slice_mandatory, forty_slice_images)

    class FakeConnection:
        def __init__(self, items):
            self.items = iter(items)
            self.sent_images = []
            self.logging = []
            self.closed = False

        def __iter__(self):
            return self

        def __next__(self):
            return next(self.items)

        def send_image(self, images_to_send):
            self.sent_images.append(list(images_to_send))

        def send_logging(self, level, message):
            self.logging.append((level, message))

        def send_close(self):
            self.closed = True

    connection = FakeConnection(one_tx_images + [None])
    module.process(connection, {"parameters": {"sendmask": True}}, None)
    sent = [image for batch in connection.sent_images for image in batch]
    assert connection.logging == []
    assert connection.closed is True
    assert [int(image.image_series_index) for image in sent] == [
        101, 120, 140, 160, 170, 180, 181,
    ]

    optional_outputs_disabled_connection = FakeConnection(one_tx_images + [None])
    module.process(
        optional_outputs_disabled_connection,
        {
            "parameters": {
                "sendb1": False,
                "sendbsp": False,
                "sendphsc": False,
                "sendb0": False,
                "sendmask": False,
            }
        },
        None,
    )
    mandatory_sent = [
        image
        for batch in optional_outputs_disabled_connection.sent_images
        for image in batch
    ]
    assert [int(image.image_series_index) for image in mandatory_sent] == [
        101, 160, 170, 180, 181,
    ]
    assert optional_outputs_disabled_connection.closed is True

    print("Bloch-Siegert OpenRecon workflow tests passed")
