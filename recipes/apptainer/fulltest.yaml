# Apptainer CLI, local SIF construction and native nested execution.
# No network downloads or elevated privileges are needed by the fixture.

name: apptainer
version: 1.5.3

setup:
  script: |
    #!/usr/bin/env bash
    set -e
    mkdir -p test_output/apptainer

tests:
  - name: apptainer version
    description: Verify the main apptainer binary runs and reports the packaged version
    command: apptainer --version
    expected_output_contains: "apptainer version ${version}"

  - name: singularity alias version
    description: Verify the backward-compatible singularity alias is available
    command: singularity --version
    expected_output_contains: "apptainer version ${version}"

  - name: apptainer help
    description: Verify the top-level help output is available
    command: apptainer --help
    expected_output_contains: "Available Commands"

  - name: apptainer exec help
    description: Verify the exec subcommand help is available
    command: apptainer exec --help
    expected_output_contains: "Run a command within a container"

  - name: apptainer build help
    description: Verify the build subcommand help is available
    command: apptainer build --help
    expected_output_contains: "Build an Apptainer image"


  - name: build and execute a native nested SIF
    description: Pack a minimal local rootfs and verify its marker and CPU architecture through nested unprivileged execution
    command: |
      set -euo pipefail
      task_dir=$(mktemp -d "${output_dir}/nested.XXXXXX")
      rootfs="$task_dir/rootfs"
      mkdir -p "$rootfs"/{etc,proc,sys,dev,tmp,var/tmp,root}
      # Copy native executables and their resolved shared libraries. This uses
      # the tested image itself and cannot accidentally fetch another image.
      for executable in /bin/sh "$(command -v uname)"; do
        cp -L --parents "$executable" "$rootfs"
        ldd "$executable" > "$task_dir/ldd.txt"
        awk '/=> \// {print $3} /^[[:space:]]*\// {print $1}' "$task_dir/ldd.txt" > "$task_dir/libraries.txt"
        test -s "$task_dir/libraries.txt"
        while IFS= read -r library; do
          test -f "$library"
          cp -L --parents "$library" "$rootfs"
        done < "$task_dir/libraries.txt"
      done
      printf 'nested native execution\n' > "$rootfs/etc/neurocontainers-nested"
      # Outer Apptainer binds must not be propagated to the nested runtime.
      unset APPTAINER_BIND APPTAINER_BINDPATH SINGULARITY_BIND SINGULARITY_BINDPATH
      export APPTAINER_CACHEDIR="$task_dir/cache"
      export APPTAINER_TMPDIR="$task_dir/tmp"
      mkdir -p "$APPTAINER_CACHEDIR" "$APPTAINER_TMPDIR"
      apptainer build --disable-cache --mksquashfs-args '-processors 2' "$task_dir/nested.sif" "$rootfs"
      test -s "$task_dir/nested.sif"
      apptainer sif list "$task_dir/nested.sif" > "$task_dir/sif-list.txt"
      grep -q 'FS (Squashfs' "$task_dir/sif-list.txt"
      apptainer exec --userns --containall --no-home --cleanenv --pwd / "$task_dir/nested.sif" /bin/sh -c \
        'IFS= read -r marker < /etc/neurocontainers-nested; printf "%s\n" "$marker"; uname -m' > "$task_dir/actual.txt"
      printf 'nested native execution\n%s\n' "$(uname -m)" > "$task_dir/expected.txt"
      cmp "$task_dir/expected.txt" "$task_dir/actual.txt"
      echo 'Native nested SIF construction and execution verified'
    expected_output_contains: Native nested SIF construction and execution verified
    timeout: 300

cleanup:
  script: |
    #!/usr/bin/env bash
    echo "Test outputs preserved in test_output/apptainer/"
