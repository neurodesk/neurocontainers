# surfice container test suite
#
# Surf Ice is an OpenGL surface renderer, so the meaningful runtime contract is
# that it opens a GL context on an X display and draws a mesh. The render tests
# start the GUI under Xvfb, load the bundled MNI152 mesh and grab the X screen:
# gl.savebmp is not used because the GTK build reads back a blank frame under
# Mesa even when the window renders correctly.
#
# The 16-bit display test covers surfice 1.0.20210730, which crashed with
# EAccessViolation when no 24-bit framebuffer config was available.

name: surfice
version: 1.0.20211006

test_data:
  sample_mesh: /opt/Surf_Ice/sample/mni152_2009.mz3
  output_dir: test_output

setup:
  script: |
    #!/usr/bin/env bash
    set -e
    mkdir -p ${output_dir}
    cat > ${output_dir}/render_check.sh <<'SCRIPT'
    #!/usr/bin/env bash
    # usage: render_check.sh BINARY DEPTH MESH SHOTDIR
    # Starts BINARY on a DEPTH-bit Xvfb display, loads MESH, and passes once the
    # screen shows enough mesh-coloured (pinkish) pixels.
    bin=$1 depth=$2 mesh=$3 shotdir=$4
    mkdir -p "$shotdir"
    # surfice writes preferences under $HOME; keep them out of the host home.
    HOME=$(mktemp -d)
    export HOME
    xvfb-run -a -s "-screen 0 1600x1200x${depth}" bash -s "$bin" "$mesh" "$shotdir/${bin}_${depth}" <<'INNER'
    bin=$1 mesh=$2 shot=$3
    "$bin" -S "import gl
    gl.meshload('$mesh')" >"$shot.log" 2>&1 &
    pid=$!
    n=0
    for _ in $(seq 1 30); do
      sleep 2
      if ! kill -0 "$pid" 2>/dev/null; then
        echo "$bin exited before rendering"; cat "$shot.log"; exit 1
      fi
      import -window root "$shot.png" 2>/dev/null || continue
      n=$(convert "$shot.png" -scale 25% -fx 'r > 0.6 && r - g > 0.06 && r - b > 0.04' \
        -format '%[fx:round(mean * w * h)]' info:)
      if [ "$n" -gt 2000 ]; then
        kill "$pid"; echo "$bin rendered mesh"; exit 0
      fi
    done
    kill "$pid"
    echo "$bin rendered no mesh (${n} mesh pixels)"; cat "$shot.log"; exit 1
    INNER
    SCRIPT
    chmod +x ${output_dir}/render_check.sh

tests:
  - name: Launchers on PATH
    description: The GUI menu entry runs surfice; the module exposes surfice_qt5.
    command: command -v surfice surfice_qt5
    expected_output_contains: /opt/Surf_Ice/surfice_qt5

  - name: GTK launcher renders a mesh on a 24-bit display
    description: The binary the desktop menu launches opens a GL context and draws the sample mesh.
    command: ${output_dir}/render_check.sh surfice 24 ${sample_mesh} ${output_dir}
    expected_output_contains: surfice rendered mesh
    timeout: 120

  - name: GTK launcher renders a mesh on a 16-bit display
    description: Without a 24-bit framebuffer config surfice must still render instead of crashing.
    command: ${output_dir}/render_check.sh surfice 16 ${sample_mesh} ${output_dir}
    expected_output_contains: surfice rendered mesh
    timeout: 120

  - name: Qt5 launcher renders a mesh on a 24-bit display
    description: The module binary opens a GL context and draws the sample mesh.
    command: ${output_dir}/render_check.sh surfice_qt5 24 ${sample_mesh} ${output_dir}
    expected_output_contains: surfice_qt5 rendered mesh
    timeout: 120
