name: rclone
version: 1.76.0

copyright:
  - license: MIT
    url: https://github.com/rclone/rclone/blob/v{{ context.version }}/COPYING

architectures:
  - x86_64
  - aarch64

variables:
  upstream_version: "1.76.0"
  rclone_arch:
    try:
      - value: amd64
        condition: arch == "x86_64"
      - value: arm64
        condition: arch == "aarch64"

auto_update:
  method: sources
  container_version: rclone_x86_64
  sources:
    - id: rclone_x86_64
      method: github_release_asset
      repo: rclone/rclone
      asset: rclone-v{version}-linux-amd64.zip
      target:
        file: rclone_archive_x86_64
        variables:
          upstream_version: version
    - id: rclone_aarch64
      method: github_release_asset
      repo: rclone/rclone
      asset: rclone-v{version}-linux-arm64.zip
      target:
        file: rclone_archive_aarch64

structured_readme:
  description: >-
    rclone is a command-line program to manage, synchronize, and transfer files
    across cloud and object storage providers (S3, WebDAV, SFTP, Google Drive,
    Nextcloud/ownCloud, Swift, and more), with an optional web GUI (`rclone rcd --rc-web-gui`).
    When running without a writable home directory, point `RCLONE_CONFIG` or
    `--config` to a writable path for storing remote credentials.
  example: |
    # Show rclone version and supported backends
    rclone version

    # Configure and copy files using an explicit writable config path
    export RCLONE_CONFIG="${TMPDIR:-/tmp}/rclone.conf"
    rclone copy /path/to/source remote:bucket/dest
  documentation: https://rclone.org/docs/

files:
  - name: rclone_archive_x86_64
    condition: arch == "x86_64"
    url: https://github.com/rclone/rclone/releases/download/v1.76.0/rclone-v1.76.0-linux-amd64.zip
    sha256: b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7
  - name: rclone_archive_aarch64
    condition: arch == "aarch64"
    url: https://github.com/rclone/rclone/releases/download/v1.76.0/rclone-v1.76.0-linux-arm64.zip
    sha256: ee169016675e23a69d77240565133ff7dbc9b33d16fa8f7053d4af39f1eaeb78

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
    - install:
        - ca-certificates
        - unzip
    - condition: arch == "x86_64"
      run:
        - tmpdir="$(mktemp -d)"
        - unzip -q {{ get_file("rclone_archive_x86_64") }} -d "${tmpdir}"
        - pkgdir="${tmpdir}/rclone-v{{ context.upstream_version }}-linux-{{ context.rclone_arch }}"
        - install -m 0755 "${pkgdir}/rclone" /usr/local/bin/rclone
        - install -d -m 0755 /usr/share/doc/rclone /usr/local/share/man/man1
        - install -m 0644 "${pkgdir}/README.txt" /usr/share/doc/rclone/README.txt
        - install -m 0644 "${pkgdir}/rclone.1" /usr/local/share/man/man1/rclone.1
        - rm -rf "${tmpdir}"
    - condition: arch == "aarch64"
      run:
        - tmpdir="$(mktemp -d)"
        - unzip -q {{ get_file("rclone_archive_aarch64") }} -d "${tmpdir}"
        - pkgdir="${tmpdir}/rclone-v{{ context.upstream_version }}-linux-{{ context.rclone_arch }}"
        - install -m 0755 "${pkgdir}/rclone" /usr/local/bin/rclone
        - install -d -m 0755 /usr/share/doc/rclone /usr/local/share/man/man1
        - install -m 0644 "${pkgdir}/README.txt" /usr/share/doc/rclone/README.txt
        - install -m 0644 "${pkgdir}/rclone.1" /usr/local/share/man/man1/rclone.1
        - rm -rf "${tmpdir}"

deploy:
  path: []
  bins:
    - rclone

domains:
  - microscopy
  - neuroimaging

categories:
  - data organisation
  - workflows

icon: data:image/png;base64,
