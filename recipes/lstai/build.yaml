variables:
  upstream_version: 1.1.0
  upstream_tag: v1.1.0
  hdbet_version: '1.1'

name: lstai
version: 1.2.0.post1
copyright:
  - license: MIT
    url: https://github.com/CompImg/LST-AI/blob/main/LICENSE
architectures:
  - x86_64
auto_update:
  method: sources
  sources:
    - id: upstream
      method: github_release_asset
      repo: CompImg/LST-AI
      asset: lst_data.zip
      version_regex: 'v(?P<version>\d+\.\d+\.\d+)'
      target:
        file: lst_data_zip
        variables:
          upstream_version: version
          upstream_tag: tag
    # LST 1.x calls HD-BET's v1 CLI and uses its five original model folds.
    - id: hdbet
      method: pypi
      package: hd-bet
      version_regex: '(?P<version>1\.\d+(?:\.\d+)?)'
      target:
        variable: hdbet_version
        fulltest_variable: hdbet_version
    - id: dcm2niix
      method: github_release_asset
      repo: rordenlab/dcm2niix
      asset: dcm2niix_lnx.zip
      target:
        file: dcm2niix_lnx_zip

build:
  kind: neurodocker
  base-image: ubuntu:22.04
  pkg-manager: apt
  directives:
    - install: ca-certificates git python3 python3-venv unzip libgomp1
    - run:
        - python3 -m venv /opt/venv
    - environment:
        PATH: /opt/venv/bin:/opt/lstai/LST_AI/binaries:/opt/dcm2niix:${PATH}
    - run:
        - git clone --depth 1 --branch {{ context.upstream_tag }} https://github.com/CompImg/LST-AI.git /opt/lstai
        - pip install --no-cache-dir --timeout 300 torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
        - pip install --no-cache-dir --timeout 300 'numpy<1.24.4' tensorflow==2.13.1 'hd-bet=={{ context.hdbet_version }}' -e /opt/lstai
        - pip check
    - run:
        - mkdir -p /opt/hd-bet_params
        - cp {{ get_file("0_model") }} /opt/hd-bet_params/0.model
        - cp {{ get_file("1_model") }} /opt/hd-bet_params/1.model
        - cp {{ get_file("2_model") }} /opt/hd-bet_params/2.model
        - cp {{ get_file("3_model") }} /opt/hd-bet_params/3.model
        - cp {{ get_file("4_model") }} /opt/hd-bet_params/4.model
        - python {{ get_file("configure_hdbet.py") }}
        - unzip {{ get_file("lst_data_zip") }} -d /opt/lstai/LST_AI
        - chmod a+x /opt/lstai/LST_AI/binaries/greedy
        - cp {{ get_file("lst") }} /opt/venv/bin/lst
        - chmod a+x /opt/venv/bin/lst
        - unzip {{ get_file("dcm2niix_lnx_zip") }} -d /opt/dcm2niix
        - chmod a+x /opt/dcm2niix/dcm2niix
    - test:
        name: Simple Deploy Bins/Path Test
        builtin: test_deploy.sh

deploy:
  path:
    - /opt/venv/bin
    - /opt/lstai/LST_AI/binaries
    - /opt/dcm2niix
  bins:
    - lst
    - hd-bet

files:
  - name: lst
    filename: lst
  - name: configure_hdbet.py
    filename: configure_hdbet.py
  - name: lst_data_zip
    url: https://github.com/CompImg/LST-AI/releases/download/v1.1.0/lst_data.zip
    sha256: c2409747ee6c3cb474c004d77812227a276e7ee4caa0648984a30d9cf5bd3ee3
  - name: dcm2niix_lnx_zip
    url: https://github.com/rordenlab/dcm2niix/releases/download/v1.0.20240202/dcm2niix_lnx.zip
    sha256: 269debc463857a999a9b48f677218dae287b58f5300f161d7fad284116a6321b
  - name: 0_model
    url: https://zenodo.org/record/2540695/files/0.model?download=1
    sha256: 6f75233753c4750672815e2b7a86db754995ae44b8f1cd77bccfc37becd2d83c
  - name: 1_model
    url: https://zenodo.org/record/2540695/files/1.model?download=1
    sha256: 5fcd430c271bb5e13ea8d44f3d303b2dfafa4d0845c1aec6c5a7375f6d727189
  - name: 2_model
    url: https://zenodo.org/record/2540695/files/2.model?download=1
    sha256: 558ede4acb35537585219ece9c6b4b627dd3c019c6865daed0dfc80781dd94e9
  - name: 3_model
    url: https://zenodo.org/record/2540695/files/3.model?download=1
    sha256: 57bf67a58c9e925b13d5b9ae6d6bb648deaf759f6d0af2ccad67651d7a2a93db
  - name: 4_model
    url: https://zenodo.org/record/2540695/files/4.model?download=1
    sha256: 567689e4dff87debe357b30e4414c412485207657d1e99c33bf0bf587d28bf32

categories:
  - image segmentation
  - machine learning
icon: data:image/png;base64,
readme: |-
  ----------------------------------
  ## lstai/{{ context.version }} ##

  LST-AI {{ context.upstream_version }}: A deep learning ensemble for accurate MS lesion segmentation.
  This CPU build includes the release-matched atlas and pretrained models for offline inference.

  Example:
  ```
  ml lstai/{{ context.version }}
  lst --help
  ```

  More documentation can be found here: https://github.com/CompImg/LST-AI

  Citation:
  ```
  Wiltgen T, McGinnis J, Schlaeger S, Kofler F, Voon C, Berthele A, Bischl D, Grundl L, Will N, Metz M, et al. (2024) LST-AI: A deep learning ensemble for accurate MS lesion segmentation. NeuroImage: Clinical. doi:10.1016/j.nicl.2024.103611

  Isensee F, Schell M, Tursunova I, Brugnara G, Bonekamp D, Neuberger U, Wick A, Schlemmer HP, Heiland S, Wick W, Bendszus M, Maier-Hein KH, Kickingereder P. (2019) Automated brain extraction of multi-sequence MRI using artificial neural networks. Hum Brain Mapp. 1-13. doi:10.1002/hbm.24750
  ```

  To run container outside of this environment: ml lstai/{{ context.version }}

  ----------------------------------
