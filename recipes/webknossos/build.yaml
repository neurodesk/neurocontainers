name: webknossos
version: 5.1.0

copyright:
  - license: AGPL-3.0-only
    url: https://github.com/scalableminds/webknossos-libs/blob/master/LICENSE

architectures:
  - x86_64

structured_readme:
  description: >-
    WEBKNOSSOS Python library and CLI for converting, streaming, and analyzing
    large 3D microscopy and connectomics datasets (WKW, OME-Zarr, N5, TIFF,
    CZI, MRC, Imaris) and working with annotations and skeletons from local
    storage or a remote WEBKNOSSOS server.
  example: |
    # Show available WEBKNOSSOS CLI subcommands
    webknossos --help

    # Convert a TIFF stack into a WEBKNOSSOS (WKW) dataset
    webknossos convert input_tiffs/ output_dataset/ --voxel-size 11,11,28

    # Stream or inspect a dataset programmatically using the container's Python
    /opt/miniconda/bin/python - <<'PY'
    from importlib.metadata import version
    import webknossos as wk
    print(version("webknossos"), wk.Dataset)
    PY
  documentation: https://docs.webknossos.org/webknossos-py/
  citation: |-
    Boergens, K. M., Berning, M., Bocklisch, T., Bräunlein, D., Drawitsch, F.,
    Frohnhofen, J., Herold, T., Otto, P., Rzepka, N., Werkmeister, T., Werner,
    D., Wiese, G., Wissler, H., & Helmstaedter, M. (2017). webKnossos: efficient
    online 3D data annotation for connectomics. Nature Methods, 14(7), 691-694.
    https://doi.org/10.1038/nmeth.4331

auto_update:
  method: pypi
  package: webknossos

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
    - template:
        name: miniconda
        version: py312_25.5.1-0
        install_path: /opt/miniconda
        pip_install: >-
          webknossos[tifffile,imagecodecs,mrcfile,czi,ims,fastremap,numba,s3,gcs]=={{ context.version }}

deploy:
  path: []
  bins:
    - webknossos

domains:
  - microscopy

categories:
  - visualization
  - data organisation

icon: data:image/png;base64,
