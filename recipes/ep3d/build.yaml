name: ep3d
version: 1.0.0
copyright:
  - license: GPL-3.0-only
    url: https://github.com/QSMxT/QSMxT/blob/main/LICENSE
  - name: ep3d-highres-preprocessing (no license file upstream; packaged with the author's permission)
    url: https://github.com/mrphysics-bonn/ep3d-highres-preprocessing
  - license: BSD-2-Clause
    url: https://github.com/rordenlab/niimath/blob/master/LICENSE
  - license: Apache-2.0
    url: https://github.com/ANTsX/ANTsPy/blob/master/LICENSE
architectures:
  - x86_64
variables:
  qsmxt_base_digest: "sha256:33df6b2a0d9e1d14520af35c112cdafc77a624ddf8fcc67403a1da9e998233cb"
auto_update:
  method: sources
  container_version: false
  local:
    - macros/ep3d
  sources:
    - id: qsmxt_base
      method: oci_digest
      image: ghcr.io/neurodesk/qsmxt_10.0.0
      tag: latest
      target:
        variable: qsmxt_base_digest
build:
  kind: neurodocker
  base-image: ghcr.io/neurodesk/qsmxt_10.0.0@{{ context.qsmxt_base_digest }}
  pkg-manager: apt
  add-default-template: false
  directives:
    - environment:
        PYTHONPATH: /opt/code/python-ismrmrd-server
        OPENRECON_SOFTWARE_VERSION: '{{ context.version }}'
        OPENRECON_CONTAINER_VERSION: '{{ context.version }}'
    - include: macros/ep3d/helpers.yaml
    - run:
        - install -m 644 {{ get_file("ep3d.py") }} /opt/code/python-ismrmrd-server/ep3d.py
        - install -m 644 {{ get_file("OpenReconLabel.json") }} /opt/code/python-ismrmrd-server/OpenReconLabel.json
        - install -m 644 {{ get_file("OpenReconREADME.md") }} /opt/code/python-ismrmrd-server/OpenReconREADME.md
        - mkdir -p /opt/ep3d /tmp/share/ep3d
        - install -m 644 {{ get_file("verify_runtime.py") }} /opt/ep3d/verify_runtime.py
        - chmod 1777 /tmp/share /tmp/share/ep3d
deploy:
  bins:
    - ep3d-preprocess
    - python
    - siemens_to_ismrmrd
files:
  - name: ep3d.py
    filename: ep3d.py
  - name: verify_runtime.py
    filename: verify_runtime.py
  - name: OpenReconLabel.json
    filename: OpenReconLabel.json
  - name: OpenReconREADME.md
    filename: OpenReconREADME.md
categories:
  - image reconstruction
  - phase processing
readme: |
  ## ep3d/{{ context.version }}

  3D EPI post-processing from the NeuroContainers QSMxT 10.0.0 image.
  Motion correct, phase match, and complex average repeated single-echo magnitude
  and phase volumes. Optional ANTs NLM denoising is off by default.

  OpenRecon config `ep3d` returns corrected magnitude and wrapped phase in two
  series per selected input pair. It preserves the first repetition's geometry
  and phase reference. It does not run QSM reconstruction or return originals.
  The QSMxT tools and models remain installed in the inherited image.

  The QSMxT base is pinned by digest. Automatic updates track rebuilds of the
  QSMxT 10.0.0 image, including its installed OpenRecon and preprocessing stack.
  Both apps install the shared preprocessing modules from macros/ep3d.
  Changes to that macro rebuild both apps.
  See OpenReconREADME.md for input requirements, scanner parameters, and scaling.

  For a 4D NIfTI magnitude and radian-phase pair:

  ```bash
  ep3d-preprocess magnitude.nii.gz phase.nii.gz output output.json --n-procs 4
  ```

  Add `--denoise` for NLM denoising. The outputs are float32
  `output/average_magnitude.nii` and `output/average_phase.nii`.
icon: data:image/png;base64,
