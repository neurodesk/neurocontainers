name: prostatefiducialseg
version: "8.0.1"
upstream_commit: "27a604a2e76787d9c7c49352fd603c2110c3e1b8"
tests:
- name: prediction launcher
  command: predict3.py --help
  expected_output_contains: seedseg-v2.json
- name: installed SeedSeg source
  command: git -C /opt/seedseg rev-parse HEAD
  expected_output_contains: ${upstream_commit}
- name: model files match their description
  command: |
    python - <<'PY'
    import hashlib, json, pathlib
    root = pathlib.Path('/opt/models')
    meta = json.loads((root / 'seedseg-v2.json').read_text())
    for fold, files in meta['folds'].items():
        e = files['fp32']
        data = (root / e['file']).read_bytes()
        assert len(data) == e['bytes'] and hashlib.sha256(data).hexdigest() == e['sha256'], e['file']
    print(f"{len(meta['folds'])} SeedSeg folds verified")
    PY
  expected_output_contains: 5 SeedSeg folds verified
- name: one-fold inference on a small volume
  description: Run fold 0 without mirroring on an odd-sized random volume and check the outputs.
  command: |
    python - <<'PY'
    import json, pathlib, subprocess, tempfile
    import nibabel as nib
    import numpy as np
    with tempfile.TemporaryDirectory() as directory:
        root = pathlib.Path(directory)
        source = root / 'input.nii.gz'
        data = np.random.default_rng(7).normal(100, 20, (29, 30, 31)).astype(np.float32)
        affine = np.diag([1.2, 1.3, 1.4, 1.])
        nib.save(nib.Nifti1Image(data, affine), source)
        subprocess.run(['predict3.py', '-i', str(source), '-o', str(root), '--folds', '0',
                        '--no-n4', '--device', 'cpu', '--threads', '2'], check=True)
        prob = nib.load(root / 'marker_prob.nii.gz')
        assert prob.shape == data.shape
        np.testing.assert_allclose(prob.affine, affine)
        p = prob.get_fdata()
        assert np.isfinite(p).all() and p.min() >= 0 and p.max() <= 1
        markers = nib.load(root / 'top3_markers.nii.gz')
        assert markers.shape == data.shape and np.isin(markers.get_fdata(), [0, 1, 2, 3]).all()
        det = json.loads((root / 'detections.json').read_text())
        assert det['k'] == 3 and det['count_flag'] == (det['n_candidates'] < 3)
        print('SeedSeg produced valid outputs')
    PY
  expected_output_contains: SeedSeg produced valid outputs
