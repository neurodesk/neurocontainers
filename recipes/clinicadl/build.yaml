name: clinicadl
version: "2.1.0"
architectures:
  - x86_64
variables:
  clinicadl_version: 2.0.0
  clinica_version: "0.11.3"
  setuptools_version: "84.0.0"
  freesurfer_version: "7.4.1"
  traits_version: "7.1.0"
structured_readme:
  description: |-
    Framework for the reproducible processing of neuroimaging data with deep learning methods
    ClinicaDL is the deep learning extension of Clinica, a Python library to process neuroimaging data in BIDS format.
  example: |-
    ml clinicadl
    python -c 'from clinicadl.train import Trainer; print(Trainer)'
  documentation: https://clinicadl.readthedocs.io/en/stable/
  citation: |-
    Thibeau-Sutre, E., Díaz, M., Hassanaly, R., Routier, A., Dormont, D., Colliot, O., Burgos, N.: ‘ClinicaDL: an open-source deep learning software for reproducible neuroimaging processing‘, 2021.
    Routier, A., Burgos, N., Díaz, M., Bacci, M., Bottani, S., El-Rifai O., Fontanella, S., Gori, P., Guillon, J., Guyot, A., Hassanaly, R., Jacquemont, T., Lu, P., Marcoux, A., Moreau, T., Samper-González, J., Teichmann, M., Thibeau-Sutre, E., Vaillant G., Wen, J., Wild, A., Habert, M.-O., Durrleman, S., and Colliot, O.: ‘Clinica: An Open Source Software Platform for Reproducible Clinical Neuroscience Studies’, 2021. doi:10.3389/fninf.2021.689675
auto_update:
  method: sources
  container_version: clinicadl
  sources:
    - id: clinicadl
      method: pypi
      package: clinicadl
      target:
        variable: clinicadl_version
        fulltest_variable: clinicadl_version
    - id: clinica
      method: pypi
      package: clinica
      target:
        variable: clinica_version
        fulltest_variable: clinica_version
    - id: setuptools
      method: pypi
      package: setuptools
      target:
        variable: setuptools_version
        fulltest_variable: setuptools_version
    - id: traits
      method: pypi
      package: traits
      target:
        variable: traits_version
        fulltest_variable: traits_version

    - id: freesurfer
      method: github_tags
      repo: freesurfer/freesurfer
      version_regex: '^v?(?P<version>7\.4\.\d+)$'
      target:
        variable: freesurfer_version
        fulltest_variable: freesurfer_version

files:
  - name: freesurfer_archive
    url: https://surfer.nmr.mgh.harvard.edu/pub/dist/freesurfer/{{ context.freesurfer_version }}/freesurfer-linux-centos7_x86_64-{{ context.freesurfer_version }}.tar.gz
    retry: 5

build:
  kind: neurodocker
  base-image: ubuntu:22.04
  pkg-manager: apt
  directives:
    - template:
        name: miniconda
        version: py310_25.5.1-0
        install_path: /opt/miniconda
        conda_install: python=3.10 pip
    - run:
        - conda create -y -n clinicadlEnv python=3.10 pip
        - conda run -n clinicadlEnv pip install --no-cache-dir clinicadl=={{ context.clinicadl_version }}
        - conda create -y -n clinicaEnv python=3.10 pip
        - conda run -n clinicaEnv pip install --no-cache-dir clinica=={{ context.clinica_version }} setuptools=={{ context.setuptools_version }} traits=={{ context.traits_version }}
        - conda clean --all --yes
    - template:
        name: fsl
        version: 6.0.7.16
    - template:
        name: spm12
        version: r7771
    - template:
        name: freesurfer
        version: "{{ context.freesurfer_version }}"
        archive: '{{ get_file("freesurfer_archive") }}'
    - template:
        name: ants
        version: 2.4.3
    - template:
        name: mrtrix3
        version: 3.0.4
        libtiff_package: libtiff5
    - template:
        name: dcm2niix
        version: latest
    - deploy:
        path:
          - /opt/miniconda/envs/clinicadlEnv/bin
        bins:
          - clinica
    - environment:
        PATH: /opt/miniconda/envs/clinicadlEnv/bin:/opt/miniconda/envs/clinicaEnv/bin:$PATH
    - test:
        name: testScript
        script: |-
          #!/bin/bash
          clinica --version
          python -c 'from clinicadl.train import Trainer; print(Trainer)'
          fslmaths --version
          recon-all --version
icon: data:image/png;base64,
readme: |-
  ----------------------------------
  ## clinicadl/{{ context.version }} ##

  Framework for the reproducible processing of neuroimaging data with deep learning methods
  ClinicaDL is the deep learning extension of Clinica, a Python library to process neuroimaging data in BIDS format.

  Example:
  ```
  ml clinicadl
  python -c 'from clinicadl.train import Trainer; print(Trainer)'
  ```

  ClinicaDL 2 uses a Python API. The clinicadl command and its subcommands were
  removed upstream; rewrite 1.x CLI workflows using the Python API.
  The python command runs the ClinicaDL environment. The clinica preprocessing
  command uses a separate environment with its own dependencies.

  More documentation can be found here: https://clinicadl.readthedocs.io/en/stable/

  Citation:
  ```
  Thibeau-Sutre, E., Díaz, M., Hassanaly, R., Routier, A., Dormont, D., Colliot, O., Burgos, N.: ‘ClinicaDL: an open-source deep learning software for reproducible neuroimaging processing‘, 2021.
  Routier, A., Burgos, N., Díaz, M., Bacci, M., Bottani, S., El-Rifai O., Fontanella, S., Gori, P., Guillon, J., Guyot, A., Hassanaly, R., Jacquemont, T., Lu, P., Marcoux, A., Moreau, T., Samper-González, J., Teichmann, M., Thibeau-Sutre, E., Vaillant G., Wen, J., Wild, A., Habert, M.-O., Durrleman, S., and Colliot, O.: ‘Clinica: An Open Source Software Platform for Reproducible Clinical Neuroscience Studies’, 2021. doi:10.3389/fninf.2021.689675
  ```

  To run container outside of this environment: ml clinicadl/{{ context.version }}

  ----------------------------------
categories:
  - workflows
