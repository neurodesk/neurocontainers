name: lazyslide
version: 0.13.0
upstream_version: "0.13.0"

tests:
  - name: lazyslide-info wrapper available on PATH and runs cleanly
    description: Verify the deployed lazyslide-info wrapper resolves on PATH and prints the installed LazySlide version.
    command: |
      set -e
      command -v lazyslide-info
      env -u HOME -u USER -u LOGNAME lazyslide-info
    expected_output_contains: "lazyslide ${upstream_version}"

  - name: package version matches recipe, zero bundled GNU/FFmpeg/CUDA libs or weights
    description: Verify lazyslide matches upstream_version, pip check passes, and zero bundled GNU runtime, FFmpeg, CUDA packages, or baked model weights ship.
    command: |
      set -e
      /opt/lazyslide/bin/python -m pip check
      /opt/lazyslide/bin/python - <<'PY'
      import importlib.metadata as md
      import pathlib
      import cv2
      import lazyslide
      import openslide
      import spatialdata
      import torch
      import torchvision
      import wsidata

      assert md.version("lazyslide") == "${upstream_version}", md.version("lazyslide")
      bad_libs = [
          str(p)
          for p in pathlib.Path("/opt/lazyslide").rglob("*.so*")
          if p.name.startswith(("libquadmath", "libgfortran", "libgomp", "libgeos", "libgdal", "libavcodec", "libavformat", "libavutil", "libswscale", "libswresample"))
      ]
      assert not bad_libs, bad_libs
      bad_pkgs = [
          d.metadata.get("Name", "")
          for d in md.distributions()
          if (d.metadata.get("Name") or "").lower().startswith(("nvidia-", "cuda-"))
      ]
      assert not bad_pkgs, bad_pkgs
      weights = [
          str(p)
          for p in pathlib.Path("/opt/lazyslide").rglob("*")
          if p.is_file() and p.suffix.lower() in (".pth", ".pt", ".ckpt", ".onnx", ".safetensors", ".bin") and p.stat().st_size > 1_000_000
      ]
      assert not weights, weights
      print(f"lazyslide={md.version('lazyslide')} cv2={cv2.__version__} torch={torch.__version__}")
      PY
    expected_output_contains: "lazyslide=${upstream_version}"

  - name: license notices and OpenSlide LGPL-2.1 source archives installed
    description: Verify LazySlide MIT, OpenCV Apache-2.0, OpenSlide LGPL-2.1 notices, and corresponding OpenSlide source tarballs are installed.
    command: |
      set -e
      test -s /opt/lazyslide/share/licenses/LAZYSLIDE-LICENSE.txt
      grep -q "MIT License" /opt/lazyslide/share/licenses/LAZYSLIDE-LICENSE.txt
      test -s /opt/lazyslide/share/licenses/OPENCV-LICENSE.txt
      grep -q "Apache License" /opt/lazyslide/share/licenses/OPENCV-LICENSE.txt
      test -s /opt/lazyslide/share/licenses/OPENSLIDE-PYTHON-COPYING.LESSER
      test -s /opt/lazyslide/share/licenses/openslide-bin/COPYING.LESSER
      ls /opt/lazyslide/share/src/openslide-bin-*.tar.gz >/dev/null
      ls /opt/lazyslide/share/src/openslide_python-*.tar.gz >/dev/null
      echo "licenses and sources ok"
    expected_output_contains: "licenses and sources ok"

  - name: wrapper isolates process-group signals, cleans up on SIGHUP, and preserves piped and PTY stdin
    description: Verify the installed lazyslide-info wrapper handles SIGHUP cleanup, noexec /tmp, and foreground PTY stdin cleanly.
    command: |
      set -e
      /usr/bin/python3 - <<'PY'
      import fcntl, os, pty, select, signal, subprocess, sys, tempfile, termios, time

      src = open("/opt/lazyslide/wrappers/lazyslide-info").read()
      py = sys.executable

      def make_wrapper(path, stub_path):
          patched = src.replace(
              'cmd = ["/opt/lazyslide/bin/lazyslide-info", *sys.argv[1:]]',
              f'cmd = [{py!r}, {stub_path!r}, *sys.argv[1:]]',
          )
          assert patched != src
          open(path, "w").write(patched)

      def run_in_pty(argv, env, send_bytes=None):
          master, slave = pty.openpty()
          def preexec():
              os.setsid()
              fcntl.ioctl(slave, termios.TIOCSCTTY, 0)
          p = subprocess.Popen(argv, env=env, stdin=slave, stdout=slave, stderr=slave, preexec_fn=preexec, close_fds=True)
          os.close(slave)
          if send_bytes:
              os.write(master, send_bytes)
          out = bytearray()
          deadline = time.time() + 6.0
          while time.time() < deadline:
              r, _, _ = select.select([master], [], [], 0.1)
              if r:
                  try:
                      chunk = os.read(master, 4096)
                      if not chunk:
                          break
                      out += chunk
                  except OSError:
                      break
              if p.poll() is not None and not r:
                  break
          rc = p.wait(timeout=5)
          os.close(master)
          return rc, out.decode("utf-8", "replace")

      with tempfile.TemporaryDirectory() as td:
          stub = os.path.join(td, "stub.py")
          open(stub, "w").write(
              "import os, signal, sys, time\n"
              "if sys.argv[1] == 'stdin':\n"
              "    print('GOT:' + sys.stdin.readline().strip(), flush=True)\n"
              "    raise SystemExit(0)\n"
              "log, ready = sys.argv[2], sys.argv[3]\n"
              "seen = []\n"
              "def h(sig, _):\n"
              "    seen.append(sig)\n"
              "    open(log, 'a').write(f'{sig}\\n')\n"
              "signal.signal(signal.SIGINT, h)\n"
              "signal.signal(signal.SIGHUP, h)\n"
              "open(ready, 'w').write(os.environ.get('HF_HOME', '') + '\\n')\n"
              "deadline = time.time() + 5.0\n"
              "while not seen and time.time() < deadline:\n"
              "    time.sleep(0.02)\n"
              "time.sleep(0.25)\n"
              "raise SystemExit(128 + seen[0] if seen else 0)\n"
          )
          wrapper = os.path.join(td, "wrapper.py")
          make_wrapper(wrapper, stub)

          env = os.environ.copy()
          for k in ("TORCH_HOME", "TORCHINDUCTOR_CACHE_DIR", "HF_HOME", "NUMBA_CACHE_DIR", "MPLCONFIGDIR", "XDG_CACHE_HOME", "XDG_CONFIG_HOME"):
              env.pop(k, None)

          r = subprocess.run([py, wrapper, "stdin"], input="lazyslide-pipe\n", capture_output=True, text=True, env=env, timeout=10)
          assert r.returncode == 0 and r.stdout.strip() == "GOT:lazyslide-pipe", (r.returncode, r.stdout, r.stderr)

          rc, out = run_in_pty([py, wrapper, "stdin"], env=env, send_bytes=b"lazyslide-pty\n")
          assert rc == 0 and "GOT:lazyslide-pty" in out, (rc, out)

          log_hup, ready_hup = os.path.join(td, "hup.log"), os.path.join(td, "hup.ready")
          p_hup = subprocess.Popen([py, wrapper, "sig", log_hup, ready_hup], env=env, start_new_session=True)
          dl = time.time() + 5.0
          while not os.path.exists(ready_hup) and time.time() < dl:
              time.sleep(0.02)
          assert os.path.exists(ready_hup), "hup stub did not become ready"
          scratch_dir = open(ready_hup).read().strip()
          assert scratch_dir and os.path.isdir(scratch_dir), scratch_dir
          os.kill(p_hup.pid, signal.SIGHUP)
          rc_hup = p_hup.wait(timeout=10)
          sigs_hup = [int(x) for x in open(log_hup).read().splitlines() if x.strip()]
          assert rc_hup == 128 + signal.SIGHUP.value and sigs_hup == [signal.SIGHUP.value], (rc_hup, sigs_hup)
          assert not os.path.exists(os.path.dirname(scratch_dir)), scratch_dir

          stub_nohup = os.path.join(td, "stub_nohup.py")
          open(stub_nohup, "w").write(
              "import os, signal, sys, time\n"
              "ready, go = sys.argv[1], sys.argv[2]\n"
              "assert signal.getsignal(signal.SIGHUP) == signal.SIG_IGN, signal.getsignal(signal.SIGHUP)\n"
              "open(ready, 'w').write('ready\\n')\n"
              "dl = time.time() + 5.0\n"
              "while not os.path.exists(go) and time.time() < dl:\n"
              "    time.sleep(0.02)\n"
              "assert os.path.exists(go), 'go file not seen'\n"
          )
          wrapper_nohup = os.path.join(td, "wrapper_nohup.py")
          make_wrapper(wrapper_nohup, stub_nohup)
          ready_nh, go_nh = os.path.join(td, "nh.ready"), os.path.join(td, "nh.go")
          p_nh = subprocess.Popen(["nohup", py, wrapper_nohup, ready_nh, go_nh], env=env, start_new_session=True, stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          dl = time.time() + 5.0
          while not os.path.exists(ready_nh) and time.time() < dl:
              time.sleep(0.02)
          assert os.path.exists(ready_nh), f"nohup stub not ready: {p_nh.stderr.read().decode()}"
          os.killpg(p_nh.pid, signal.SIGHUP)
          time.sleep(0.1)
          open(go_nh, "w").write("go\n")
          rc_nh = p_nh.wait(timeout=10)
          err_nh = p_nh.stderr.read().decode()
          assert rc_nh == 0, (rc_nh, err_nh)
      print("wrapper signal and stdin ok")
      PY
    expected_output_contains: "wrapper signal and stdin ok"

  - name: offline synthetic WSI tissue detection and tiling pipeline
    description: Synthesize a tiled RGB pyramidal TIFF slide with two H&E-like tissue islands, open via wsidata/openslide, and run lazyslide tissue segmentation and tiling under unset/read-only HOME.
    command: |
      set -e
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      env -u HOME -u USER -u LOGNAME -u TORCH_HOME -u TORCHINDUCTOR_CACHE_DIR -u HF_HOME -u NUMBA_CACHE_DIR -u MPLCONFIGDIR -u XDG_CACHE_HOME -u XDG_CONFIG_HOME         /opt/lazyslide/bin/python - "$tmpdir" <<'PY'
      import os
      import sys
      import numpy as np
      import tifffile
      import wsidata
      import lazyslide as zs

      td = sys.argv[1]
      # Synthesize a 1024x1024 white slide background with two H&E-like pink/purple tissue islands
      img = np.full((1024, 1024, 3), 245, dtype=np.uint8)
      yy, xx = np.mgrid[:1024, :1024]
      m1 = ((yy - 320) ** 2 + (xx - 320) ** 2) <= 180 ** 2
      m2 = ((yy - 700) ** 2 + (xx - 700) ** 2) <= 160 ** 2
      img[m1] = [195, 115, 165]
      img[m2] = [175, 95, 155]
      # Add fine nuclear hematoxylin stippling
      rng = np.random.default_rng(42)
      dots = (m1 | m2) & (rng.random((1024, 1024)) < 0.08)
      img[dots] = [80, 50, 120]

      slide_path = os.path.join(td, "synthetic_skin.tif")
      tifffile.imwrite(
          slide_path,
          img,
          tile=(256, 256),
          photometric="rgb",
          resolution=(10000.0 / 0.5, 10000.0 / 0.5),
          resolutionunit="CENTIMETER",
      )

      wsi = wsidata.open_wsi(slide_path, reader="openslide")
      zs.pp.find_tissues(wsi, min_tissue_area=0.01)
      n_tissues = len(wsi["tissues"])
      assert n_tissues >= 2, n_tissues
      zs.pp.tile_tissues(wsi, tile_px=128, mpp=0.5)
      n_tiles = len(wsi["tiles"])
      assert n_tiles >= 4, n_tiles
      print(f"lazyslide wsi ok tissues={n_tissues} tiles={n_tiles}")
      PY
    expected_output_contains: "lazyslide wsi ok"

  - name: runtime hook preserves cache across fork and cleans up on SIGTERM/SIGHUP (including PID 1)
    description: Verify direct /opt/lazyslide/bin/python keeps parent cache across os.fork()+sys.exit(0), cleans up on SIGTERM/SIGHUP, and exits cleanly under the PID 1 signal path.
    command: |
      set -e
      /usr/bin/python3 - <<'PY'
      import os, pathlib, signal, subprocess, tempfile

      py = "/opt/lazyslide/bin/python"
      with tempfile.TemporaryDirectory() as td:
          env = {"PATH": os.environ["PATH"], "TMPDIR": td}

          fork_code = (
              "import os, sys, _lazyslide_runtime as rt\n"
              "root = rt._CACHE_ROOT\n"
              "assert root is not None and root.is_dir(), root\n"
              "pid = os.fork()\n"
              "if pid == 0:\n"
              "    sys.exit(0)\n"
              "_, st = os.waitpid(pid, 0)\n"
              "assert os.WIFEXITED(st) and os.WEXITSTATUS(st) == 0, st\n"
              "assert root.is_dir(), root\n"
              "print(root)\n"
          )
          r = subprocess.run([py, "-c", fork_code], env=env, capture_output=True, text=True, timeout=30)
          assert r.returncode == 0, (r.returncode, r.stdout, r.stderr)
          assert not pathlib.Path(r.stdout.strip()).exists(), r.stdout

          for sig in (signal.SIGTERM, signal.SIGHUP):
              sp = subprocess.Popen(
                  [py, "-c", "import time, _lazyslide_runtime as rt; print(rt._CACHE_ROOT, flush=True); time.sleep(30)"],
                  env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              cdir = sp.stdout.readline().strip()
              assert cdir and os.path.isdir(cdir), cdir
              os.kill(sp.pid, sig)
              rc = sp.wait(timeout=10)
              assert rc == -sig.value, (sig, rc, sp.stderr.read())
              assert not os.path.exists(cdir), cdir

              pid1_code = (
                  "import os, time, _lazyslide_runtime as rt\n"
                  "rt._CACHE_OWNER_PID = 1\n"
                  "os.getpid = lambda: 1\n"
                  "print(rt._CACHE_ROOT, flush=True)\n"
                  "time.sleep(30)\n"
              )
              sp1 = subprocess.Popen(
                  [py, "-c", pid1_code],
                  env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              cdir1 = sp1.stdout.readline().strip()
              assert cdir1 and os.path.isdir(cdir1), cdir1
              os.kill(sp1.pid, sig)
              rc1 = sp1.wait(timeout=10)
              assert rc1 == 128 + sig.value, (sig, rc1, sp1.stderr.read())
              assert not os.path.exists(cdir1), cdir1
          assert os.listdir(td) == [], os.listdir(td)
      print("runtime hook signal and fork ok")
      PY
    expected_output_contains: "runtime hook signal and fork ok"
