readme: |
  Quantiphyse is a volumetric medical-image viewer and analysis application.
  This recipe includes its ASL and Fabber plugins, OXASL Python extensions,
  and a minimal FSL backend with ASL models, image utilities, BET and FLIRT.

  Start the graphical application with quantiphyse. A display is required.
  Use quantiphyse-python for Python scripts in the same environment.
  Headless batch scripts run with quantiphyse --batch /path/to/script.yaml.

  Quantiphyse: {{ context.quantiphyse_version }}
  ASL plugin: {{ context.quantiphyse_asl_version }}
  Fabber plugin: {{ context.quantiphyse_fabber_version }}

  The smoke test checks plugin discovery, label/control subtraction, a small
  ASL model fit and the GUI's ASL controls under Xvfb. These checks do not
  validate clinical accuracy. This is not a complete FSL installation: standard
  space templates, FAST, FNIRT and MCFLIRT are not bundled. OXASL workflows
  that require those tools need a full FSL environment and separate validation.
  The minimal backend uses an explicit artifact/checksum lock. Refresh the
  whole lock together when changing backend versions, then repeat model and
  GUI tests. Dependency source checks verify the pinned FSL artifacts.

  OXASL_ENABLE is not included: its Oxford academic licence forbids
  redistribution, and oxasl treats it as optional. oxasl_mp is built from the
  Apache-2.0 upstream commit because the only PyPI release (2.0.1) predates
  the relicensing and lacks the run() entrypoint that oxasl 0.2.3 calls.

  The bundled pyfab 0.3.6 has a Python 3.10 compatibility patch that moves
  Sequence lookups to collections.abc. The smoke test exercises the model
  parameter-evaluation path that requires it.

  Quantiphyse and its plugins are Apache-2.0. FSL components have separate
  terms, including restrictions on commercial use. See the upstream licenses
  and /opt/licenses/quantiphyse before use or redistribution.
  Upstream: https://quantiphyse.readthedocs.io/en/latest/asl/asl.html
icon: data:image/png;base64,
