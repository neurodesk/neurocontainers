build:
  kind: neurodocker
  base-image: ubuntu:22.04
  pkg-manager: apt
  directives:
  - environment:
      DEBIAN_FRONTEND: noninteractive
      FSLDIR: /opt/fsl
      FABBERDIR: /opt/fsl
      FSLOUTPUTTYPE: NIFTI_GZ
      PATH: /opt/quantiphyse/bin:/opt/fsl/bin:$PATH
  - install:
    - python3
    - python3-pip
    - python3-venv
    - python3-dev
    - build-essential
    - ca-certificates
    - bzip2
    - patch
    - libgl1
    - libfontconfig1
    - libglib2.0-0
    - libxcb-xinerama0
    - libxkbcommon-x11-0
    - xvfb
    - xauth
    - libxcb-icccm4
    - libxcb-image0
    - libxcb-util1
    - libxcb-keysyms1
    - libxcb-render-util0
    - libxcb-render0
    - libxcb-shape0
    - libdbus-1-3
  - run:
    - mkdir -p /opt/quantiphyse /opt/licenses/quantiphyse /tmp/quantiphyse
    - tar -xjf {{ get_file("micromamba") }} -C /tmp bin/micromamba
    - MAMBA_ROOT_PREFIX=/tmp/mamba /tmp/bin/micromamba create -y -p /opt/fsl --file {{ get_file("fsl-explicit") }}
    - python3 -m venv /opt/quantiphyse
    - /opt/quantiphyse/bin/pip install --no-cache-dir pip=={{ context.pip_version }} setuptools=={{ context.setuptools_version
      }} wheel=={{ context.wheel_version }} Cython=={{ context.cython_version }} numpy=={{ context.numpy_version }}
    - /opt/quantiphyse/bin/pip install --no-cache-dir -r {{ get_file("requirements") }}
    - cp {{ get_file("quantiphyse_archive") }} /tmp/quantiphyse/quantiphyse.tar.gz
    - /opt/quantiphyse/bin/pip install --no-deps --no-cache-dir /tmp/quantiphyse/quantiphyse.tar.gz
    - tar -xOf /tmp/quantiphyse/quantiphyse.tar.gz quantiphyse-{{ context.quantiphyse_version }}/LICENSE > /opt/licenses/quantiphyse/quantiphyse-LICENSE
    - cp {{ get_file("quantiphyse_asl_archive") }} /tmp/quantiphyse/quantiphyse-asl.tar.gz
    - mkdir /tmp/quantiphyse/quantiphyse-asl && tar -xzf /tmp/quantiphyse/quantiphyse-asl.tar.gz -C /tmp/quantiphyse/quantiphyse-asl --strip-components=1
    - sed -i '/^oxasl_enable$/d' /tmp/quantiphyse/quantiphyse-asl/requirements.txt /tmp/quantiphyse/quantiphyse-asl/quantiphyse_asl.egg-info/requires.txt
    - /opt/quantiphyse/bin/pip install --no-deps --no-cache-dir /tmp/quantiphyse/quantiphyse-asl
    - mkdir /tmp/quantiphyse/oxasl_mp && tar -xzf {{ get_file("oxasl_mp_archive") }} -C /tmp/quantiphyse/oxasl_mp --strip-components=1
    - echo "__version__ = '2.0.1.post6'" > /tmp/quantiphyse/oxasl_mp/oxasl_mp/_version.py
    - /opt/quantiphyse/bin/pip install --no-deps --no-cache-dir /tmp/quantiphyse/oxasl_mp
    - cp /tmp/quantiphyse/oxasl_mp/LICENSE /opt/licenses/quantiphyse/oxasl_mp-LICENSE
    - tar -xOf /tmp/quantiphyse/quantiphyse-asl.tar.gz quantiphyse-asl-{{ context.quantiphyse_asl_version }}/LICENSE > /opt/licenses/quantiphyse/quantiphyse-asl-LICENSE
    - cp {{ get_file("quantiphyse_fabber_archive") }} /tmp/quantiphyse/quantiphyse-fabber.tar.gz
    - /opt/quantiphyse/bin/pip install --no-deps --no-cache-dir /tmp/quantiphyse/quantiphyse-fabber.tar.gz
    - tar -xOf /tmp/quantiphyse/quantiphyse-fabber.tar.gz quantiphyse-fabber-{{ context.quantiphyse_fabber_version }}/LICENSE
      > /opt/licenses/quantiphyse/quantiphyse-fabber-LICENSE
    - cd /opt/quantiphyse/lib/python3.10/site-packages && patch -p0 < {{ get_file("pyfab-python310.patch") }}
    - /opt/quantiphyse/bin/pip check
    - rm -rf /tmp/quantiphyse /tmp/bin /tmp/mamba
  - run:
    - install -m 0755 {{ get_file("quantiphyse-python") }} /usr/local/bin/quantiphyse-python
    - ln -s /opt/quantiphyse/bin/quantiphyse /usr/local/bin/quantiphyse
    - install -m 0644 {{ get_file("smoke_test.py") }} /opt/quantiphyse/smoke_test.py
    - mkdir -p /usr/share/applications /usr/share/icons/hicolor/75x75/apps
    - install -m 0644 {{ get_file("quantiphyse.desktop") }} /usr/share/applications/quantiphyse.desktop
    - install -m 0644 {{ get_file("quantiphyse.png") }} /usr/share/icons/hicolor/75x75/apps/quantiphyse.png
deploy:
  bins:
  - quantiphyse
  - quantiphyse-python
