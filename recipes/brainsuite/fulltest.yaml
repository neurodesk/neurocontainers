name: brainsuite
version: 23a
brainsuite_version: 23a

tests:
  - name: BrainSuite bias correction GUI libraries resolve
    script: |
      set -eu
      launcher="$(command -v gui_bias_correct)"
      test -x "$launcher"
      dependencies="$(ldd "$launcher")"
      printf '%s\n' "$dependencies"
      printf '%s\n' "$dependencies" | grep 'libmwlaunchermain.so => /'
      if printf '%s\n' "$dependencies" | grep -q 'not found'; then
        exit 1
      fi

  - name: BrainSuite BIDS App runner is available
    script: |
      set -eu
      command -v run.py
      test -x /BrainSuite/run.py
      run.py --help 2>&1 | grep "BrainSuite${brainsuite_version} BIDS-App"

  - name: BrainSuite tool directories are present
    script: |
      set -eu
      test -n "${BrainSuiteVersion:?}"
      test -d "/opt/BrainSuite${BrainSuiteVersion}/bin"
      test -d "/opt/BrainSuite${BrainSuiteVersion}/svreg/bin"
      test -d "/opt/BrainSuite${BrainSuiteVersion}/bdp"
      test -d "/opt/BrainSuite${BrainSuiteVersion}/bfp"

  - name: BrainSuite BFP runtime entrypoint is present
    script: |
      set -eu
      test -n "${BrainSuiteVersion:?}"
      test -s "/opt/BrainSuite${BrainSuiteVersion}/bfp/bfp.sh"
