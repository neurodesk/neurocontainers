name: phasorpy
version: 0.13.0
upstream_version: "0.13"

tests:
  - name: phasorpy wrapper available on PATH
    description: Verify the deployed phasorpy wrapper resolves on PATH.
    command: command -v phasorpy
    expected_output_contains: "/opt/phasorpy/wrappers/phasorpy"

  - name: package version matches recipe, system APT scientific libs used, and zero bundled GNU/MPL libs
    description: Verify phasorpy matches upstream_version, pip check passes, numpy/scipy/sklearn/matplotlib come from Ubuntu APT, and zero bundled libquadmath/libgfortran/libgomp/libzmq exist under /opt/phasorpy.
    command: |
      set -e
      /opt/phasorpy/bin/python -m pip check
      /opt/phasorpy/bin/python - <<'PY'
      import importlib.metadata as md
      import pathlib
      import matplotlib
      import numpy
      import phasorpy
      import scipy
      import sklearn

      assert md.version("phasorpy") == "${upstream_version}", md.version("phasorpy")
      for mod in (numpy, scipy, sklearn, matplotlib):
          assert mod.__file__.startswith("/usr/lib/python3/dist-packages/"), mod.__file__
      bad_libs = [
          str(p)
          for p in pathlib.Path("/opt/phasorpy").rglob("*.so*")
          if p.name.startswith(("libquadmath", "libgfortran", "libgomp", "libzmq"))
      ]
      assert not bad_libs, bad_libs
      print(f"phasorpy={md.version('phasorpy')} numpy={numpy.__version__} scipy={scipy.__version__}")
      PY
    expected_output_contains: "phasorpy=${upstream_version}"

  - name: license notice installed
    description: Verify PhasorPy MIT license file is installed.
    command: |
      set -e
      test -s /opt/phasorpy/share/licenses/PHASORPY-LICENSE.txt
      grep -q "MIT License" /opt/phasorpy/share/licenses/PHASORPY-LICENSE.txt
      echo "license ok"
    expected_output_contains: "license ok"

  - name: wrapper isolates process-group signals, cleans up on SIGHUP, and preserves piped and PTY stdin
    description: Verify the installed phasorpy wrapper handles SIGINT/SIGHUP cleanup, noexec /tmp, and foreground/background PTY job control cleanly.
    command: |
      set -e
      /usr/bin/python3 - <<'PY'
      import fcntl, os, pty, select, signal, subprocess, sys, tempfile, termios, time

      src = open("/opt/phasorpy/wrappers/phasorpy").read()
      py = sys.executable

      def make_wrapper(path, stub_path):
          patched = src.replace(
              'cmd = ["/opt/phasorpy/bin/phasorpy", *sys.argv[1:]]',
              f'cmd = [{py!r}, {stub_path!r}, *sys.argv[1:]]',
          )
          assert patched != src
          open(path, "w").write(patched)

      def run_in_pty(argv, env, on_ready=None, send_bytes=None):
          master, slave = pty.openpty()
          def preexec():
              os.setsid()
              fcntl.ioctl(slave, termios.TIOCSCTTY, 0)
          p = subprocess.Popen(argv, env=env, stdin=slave, stdout=slave, stderr=slave, preexec_fn=preexec, close_fds=True)
          os.close(slave)
          if on_ready:
              on_ready()
          if send_bytes:
              os.write(master, send_bytes)
          out = bytearray()
          deadline = time.time() + 6.0
          while time.time() < deadline:
              r, _, _ = select.select([master], [], [], 0.1)
              if r:
                  try:
                      chunk = os.read(master, 4096)
                      if not chunk:
                          break
                      out += chunk
                  except OSError:
                      break
              if p.poll() is not None and not r:
                  break
          rc = p.wait(timeout=5)
          os.close(master)
          return rc, out.decode("utf-8", "replace")

      with tempfile.TemporaryDirectory() as td:
          stub = os.path.join(td, "stub.py")
          open(stub, "w").write(
              "import os, signal, sys, time\n"
              "if sys.argv[1] == 'stdin':\n"
              "    print('GOT:' + sys.stdin.readline().strip(), flush=True)\n"
              "    raise SystemExit(0)\n"
              "log, ready = sys.argv[2], sys.argv[3]\n"
              "seen = []\n"
              "def h(sig, _):\n"
              "    seen.append(sig)\n"
              "    open(log, 'a').write(f'{sig}\\n')\n"
              "signal.signal(signal.SIGINT, h)\n"
              "signal.signal(signal.SIGHUP, h)\n"
              "open(ready, 'w').write(os.environ.get('PHASORPY_DATA_DIR', '') + '\\n')\n"
              "deadline = time.time() + 5.0\n"
              "while not seen and time.time() < deadline:\n"
              "    time.sleep(0.02)\n"
              "time.sleep(0.25)\n"
              "raise SystemExit(128 + seen[0] if seen else 0)\n"
          )
          wrapper = os.path.join(td, "wrapper.py")
          make_wrapper(wrapper, stub)

          env = os.environ.copy()
          for k in ("MPLCONFIGDIR", "XDG_CACHE_HOME", "XDG_CONFIG_HOME", "PHASORPY_DATA_DIR"):
              env.pop(k, None)

          r = subprocess.run([py, wrapper, "stdin"], input="phasor-pipe\n", capture_output=True, text=True, env=env, timeout=10)
          assert r.returncode == 0 and r.stdout.strip() == "GOT:phasor-pipe", (r.returncode, r.stdout, r.stderr)

          rc, out = run_in_pty([py, wrapper, "stdin"], env=env, send_bytes=b"phasor-pty\n")
          assert rc == 0 and "GOT:phasor-pty" in out, (rc, out)

          log_pty, ready_pty = os.path.join(td, "pty.log"), os.path.join(td, "pty.ready")
          def wait_ready():
              dl = time.time() + 5.0
              while not os.path.exists(ready_pty) and time.time() < dl:
                  time.sleep(0.02)
              assert os.path.exists(ready_pty), "pty stub did not become ready"
          rc, out = run_in_pty([py, wrapper, "sig", log_pty, ready_pty], env=env, on_ready=wait_ready, send_bytes=b"\x03")
          sigs_pty = [int(x) for x in open(log_pty).read().splitlines() if x.strip()]
          assert rc == 130 and sigs_pty == [signal.SIGINT.value], (rc, sigs_pty, out)

          log_hup, ready_hup = os.path.join(td, "hup.log"), os.path.join(td, "hup.ready")
          p_hup = subprocess.Popen([py, wrapper, "sig", log_hup, ready_hup], env=env, start_new_session=True)
          dl = time.time() + 5.0
          while not os.path.exists(ready_hup) and time.time() < dl:
              time.sleep(0.02)
          assert os.path.exists(ready_hup), "hup stub did not become ready"
          scratch_dir = open(ready_hup).read().strip()
          assert scratch_dir and os.path.isdir(scratch_dir), scratch_dir
          os.kill(p_hup.pid, signal.SIGHUP)
          rc_hup = p_hup.wait(timeout=10)
          sigs_hup = [int(x) for x in open(log_hup).read().splitlines() if x.strip()]
          assert rc_hup == 128 + signal.SIGHUP.value and sigs_hup == [signal.SIGHUP.value], (rc_hup, sigs_hup)
          assert not os.path.exists(os.path.dirname(scratch_dir)), scratch_dir

          stub_nohup = os.path.join(td, "stub_nohup.py")
          open(stub_nohup, "w").write(
              "import os, signal, sys, time\n"
              "ready, go = sys.argv[1], sys.argv[2]\n"
              "assert signal.getsignal(signal.SIGHUP) == signal.SIG_IGN, signal.getsignal(signal.SIGHUP)\n"
              "open(ready, 'w').write('ready\\n')\n"
              "dl = time.time() + 5.0\n"
              "while not os.path.exists(go) and time.time() < dl:\n"
              "    time.sleep(0.02)\n"
              "assert os.path.exists(go), 'go file not seen'\n"
          )
          wrapper_nohup = os.path.join(td, "wrapper_nohup.py")
          make_wrapper(wrapper_nohup, stub_nohup)
          ready_nh, go_nh = os.path.join(td, "nh.ready"), os.path.join(td, "nh.go")
          p_nh = subprocess.Popen(["nohup", py, wrapper_nohup, ready_nh, go_nh], env=env, start_new_session=True, stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          dl = time.time() + 5.0
          while not os.path.exists(ready_nh) and time.time() < dl:
              time.sleep(0.02)
          assert os.path.exists(ready_nh), f"nohup stub not ready: {p_nh.stderr.read().decode()}"
          os.killpg(p_nh.pid, signal.SIGHUP)
          time.sleep(0.1)
          open(go_nh, "w").write("go\n")
          rc_nh = p_nh.wait(timeout=10)
          err_nh = p_nh.stderr.read().decode()
          assert rc_nh == 0, (rc_nh, err_nh)
      print("wrapper signal and stdin ok")
      PY
    expected_output_contains: "wrapper signal and stdin ok"

  - name: phasorpy CLI works under read-only or unset HOME and unwritable cache paths
    description: Verify phasorpy versions CLI runs cleanly when HOME/USER are unset or cache variables point to unwritable paths.
    command: |
      set -e
      env -u HOME -u USER -u LOGNAME -u MPLCONFIGDIR -u XDG_CACHE_HOME -u XDG_CONFIG_HOME -u PHASORPY_DATA_DIR \
        phasorpy versions
      HOME=/sys PHASORPY_DATA_DIR=/sys/unwritable-data XDG_CACHE_HOME=/sys/unwritable-cache \
        phasorpy --help | grep -q "versions"
    expected_output_contains: "phasorpy"

  - name: offline FLIM phasor computation, lifetime estimation, and OME-TIFF round-trip
    description: Synthesize a multi-exponential fluorescence decay cube (skin NADH/FAD lifetimes), compute phasor coordinates and apparent lifetimes, and round-trip through OME-TIFF offline.
    command: |
      set -e
      tmpdir="$(mktemp -d)"
      trap 'rm -rf "$tmpdir"' EXIT
      env -u HOME -u USER -u LOGNAME -u MPLCONFIGDIR -u XDG_CACHE_HOME -u XDG_CONFIG_HOME -u PHASORPY_DATA_DIR \
        /opt/phasorpy/bin/python - "$tmpdir" <<'PY'
      import os
      import sys
      import numpy as np
      from phasorpy.io import phasor_from_ometiff, phasor_to_ometiff
      from phasorpy.lifetime import phasor_to_apparent_lifetime
      from phasorpy.phasor import phasor_from_signal

      td = sys.argv[1]
      # 80 MHz laser repetition rate (12.5 ns period), 64 time bins, 16x16 FLIM tile
      freq_mhz = 80.0
      t = np.linspace(0.0, 12.5, 64, endpoint=False)
      decay_short = np.exp(-t / 0.4)   # free NADH (~0.4 ns)
      decay_long = np.exp(-t / 2.5)    # protein-bound NADH (~2.5 ns)
      signal = np.empty((64, 16, 16), dtype=np.float64)
      signal[:, :8, :] = decay_short[:, None, None]
      signal[:, 8:, :] = decay_long[:, None, None]

      mean, real, imag = phasor_from_signal(signal, axis=0)
      assert mean.shape == (16, 16) and real.shape == (16, 16) and imag.shape == (16, 16)
      tau_phase, tau_mod = phasor_to_apparent_lifetime(real, imag, frequency=freq_mhz)
      assert 0.25 < float(tau_phase[:8, :].mean()) < 0.65, float(tau_phase[:8, :].mean())
      assert 2.0 < float(tau_phase[8:, :].mean()) < 3.0, float(tau_phase[8:, :].mean())

      ome_path = os.path.join(td, "skin_flim.ome.tif")
      phasor_to_ometiff(ome_path, mean, real, imag, frequency=freq_mhz)
      mean2, real2, imag2, attrs = phasor_from_ometiff(ome_path)
      assert np.allclose(real, real2, atol=1e-5)
      assert np.allclose(imag, imag2, atol=1e-5)
      assert abs(attrs["frequency"] - freq_mhz) < 1e-6
      print(
          f"phasorpy flim ok tau_short={tau_phase[:8,:].mean():.2f}ns "
          f"tau_long={tau_phase[8:,:].mean():.2f}ns"
      )
      PY
    expected_output_contains: "phasorpy flim ok"

  - name: runtime hook preserves cache across fork and cleans up on SIGTERM/SIGHUP (including PID 1)
    description: Verify direct /opt/phasorpy/bin/python keeps parent cache across os.fork()+sys.exit(0), cleans up on SIGTERM/SIGHUP, and exits cleanly under the PID 1 signal path.
    command: |
      set -e
      /usr/bin/python3 - <<'PY'
      import os, pathlib, signal, subprocess, tempfile

      py = "/opt/phasorpy/bin/python"
      with tempfile.TemporaryDirectory() as td:
          env = {"PATH": os.environ["PATH"], "TMPDIR": td}

          fork_code = (
              "import os, sys, _phasorpy_runtime as rt\n"
              "root = rt._CACHE_ROOT\n"
              "assert root is not None and root.is_dir(), root\n"
              "pid = os.fork()\n"
              "if pid == 0:\n"
              "    sys.exit(0)\n"
              "_, st = os.waitpid(pid, 0)\n"
              "assert os.WIFEXITED(st) and os.WEXITSTATUS(st) == 0, st\n"
              "assert root.is_dir(), root\n"
              "print(root)\n"
          )
          r = subprocess.run([py, "-c", fork_code], env=env, capture_output=True, text=True, timeout=30)
          assert r.returncode == 0, (r.returncode, r.stdout, r.stderr)
          assert not pathlib.Path(r.stdout.strip()).exists(), r.stdout

          for sig in (signal.SIGTERM, signal.SIGHUP):
              sp = subprocess.Popen(
                  [py, "-c", "import time, _phasorpy_runtime as rt; print(rt._CACHE_ROOT, flush=True); time.sleep(30)"],
                  env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              cdir = sp.stdout.readline().strip()
              assert cdir and os.path.isdir(cdir), cdir
              os.kill(sp.pid, sig)
              rc = sp.wait(timeout=10)
              assert rc == -sig.value, (sig, rc, sp.stderr.read())
              assert not os.path.exists(cdir), cdir

              pid1_code = (
                  "import os, time, _phasorpy_runtime as rt\n"
                  "rt._CACHE_OWNER_PID = 1\n"
                  "os.getpid = lambda: 1\n"
                  "print(rt._CACHE_ROOT, flush=True)\n"
                  "time.sleep(30)\n"
              )
              sp1 = subprocess.Popen(
                  [py, "-c", pid1_code],
                  env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              cdir1 = sp1.stdout.readline().strip()
              assert cdir1 and os.path.isdir(cdir1), cdir1
              os.kill(sp1.pid, sig)
              rc1 = sp1.wait(timeout=10)
              assert rc1 == 128 + sig.value, (sig, rc1, sp1.stderr.read())
              assert not os.path.exists(cdir1), cdir1
          assert os.listdir(td) == [], os.listdir(td)
      print("runtime hook signal and fork ok")
      PY
    expected_output_contains: "runtime hook signal and fork ok"
