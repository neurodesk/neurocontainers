name: phasorpy
version: 0.13.0

description: Phasor-space analysis of fluorescence lifetime imaging microscopy (FLIM) and hyperspectral optical skin imaging data.

copyright:
  - license: MIT
    name: PhasorPy license
    url: https://github.com/phasorpy/phasorpy/blob/v{{ context.upstream_version }}/LICENSE.txt

architectures:
  - x86_64
  - aarch64

variables:
  upstream_version: "0.13"

auto_update:
  method: sources
  container_version: phasorpy
  sources:
    - id: phasorpy
      method: pypi
      package: phasorpy
      target:
        variable: upstream_version
        fulltest_variable: upstream_version

build:
  kind: neurodocker

  base-image: ubuntu:26.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        MPLBACKEND: Agg
        PIP_NO_CACHE_DIR: "1"
        PATH: /opt/phasorpy/wrappers:/opt/phasorpy/bin:$PATH

    - install:
        - ca-certificates
        - libgomp1
        - patchelf
        - python3
        - python3-matplotlib
        - python3-numpy
        - python3-pil
        - python3-pip
        - python3-scipy
        - python3-sklearn
        - python3-venv

    - run:
        # Inherit Ubuntu 26.04 system numpy/scipy/sklearn/matplotlib so we avoid
        # shipping bundled PyPI GNU runtime libs (libquadmath/libgfortran/libgomp).
        - python3 -m venv --system-site-packages /opt/phasorpy
        - /opt/phasorpy/bin/python -m pip install --no-cache-dir "phasorpy=={{ context.upstream_version }}"
        - /opt/phasorpy/bin/python -m pip check
        # Link phasorpy's OpenMP Cython extension against Ubuntu's system libgomp1
        # instead of shipping a bundled wheel copy of libgomp.
        - >-
          for f in $(find /opt/phasorpy/lib/python*/site-packages/phasorpy -name '*.so*' 2>/dev/null); do
          for need in $(patchelf --print-needed "$f" 2>/dev/null | grep '^libgomp-' || true); do
          patchelf --replace-needed "$need" libgomp.so.1 "$f";
          done;
          done
          && rm -rf /opt/phasorpy/lib/python*/site-packages/phasorpy.libs
        # Install startup .pth hook so direct Python imports get writable cache dirs
        # and unlisted-UID USER fallback without touching /home.
        - /opt/phasorpy/bin/python {{ get_file("install_runtime_hook") }}
        # Guard: system APT scientific libs, zero bundled GNU/MPL libs, OpenMP works.
        - >-
          /opt/phasorpy/bin/python -c "import pathlib, matplotlib, numpy, phasorpy, scipy, sklearn;
          from phasorpy.phasor import phasor_from_signal;
          assert all(m.__file__.startswith('/usr/lib/python3/dist-packages/') for m in (numpy, scipy, sklearn, matplotlib));
          bad_libs = [str(p) for p in pathlib.Path('/opt/phasorpy').rglob('*.so*') if p.name.startswith(('libquadmath', 'libgfortran', 'libgomp', 'libzmq'))];
          assert not bad_libs, bad_libs;
          t = numpy.linspace(0.0, 12.5, 64, endpoint=False);
          mean, real, imag = phasor_from_signal(numpy.exp(-t / 2.5));
          assert float(mean) > 0 and 0.0 < float(real) < 1.0 and 0.0 < float(imag) < 1.0"
        - mkdir -p /opt/phasorpy/wrappers /opt/phasorpy/share/licenses
        - install -m 0755 {{ get_file("phasorpy_wrapper") }} /opt/phasorpy/wrappers/phasorpy
        - install -m 0644 {{ get_file("phasorpy_license") }} /opt/phasorpy/share/licenses/PHASORPY-LICENSE.txt
        - chmod -R a+rX /opt/phasorpy
        - rm -rf /root/.cache/pip

files:
  - name: phasorpy_license
    url: https://raw.githubusercontent.com/phasorpy/phasorpy/v{{ context.upstream_version }}/LICENSE.txt
  - name: install_runtime_hook
    contents: |
      from __future__ import annotations

      import pathlib
      import textwrap

      matches = sorted(pathlib.Path("/opt/phasorpy/lib").glob("python*/site-packages"))
      assert len(matches) == 1, matches
      site_packages = matches[0]
      (site_packages / "_phasorpy_runtime.py").write_text(
          textwrap.dedent(
              '''\
              """Container runtime defaults for PhasorPy caches and unlisted UIDs."""

              from __future__ import annotations

              import atexit
              import errno
              import getpass
              import os
              import shutil
              import signal
              import tempfile
              from pathlib import Path

              _CACHE_ROOT: Path | None = None
              _CACHE_OWNER_PID: int | None = None
              _CLEANUP_REGISTERED = False


              def is_writable_dir(path_str: str | None) -> bool:
                  if not path_str:
                      return False
                  blocked = {signal.SIGINT, signal.SIGTERM, signal.SIGHUP}
                  prev_mask = signal.pthread_sigmask(signal.SIG_BLOCK, blocked)
                  try:
                      os.makedirs(path_str, exist_ok=True)
                      if hasattr(os, "O_TMPFILE"):
                          try:
                              fd = os.open(path_str, os.O_TMPFILE | os.O_RDWR, 0o600)
                              os.close(fd)
                              return True
                          except OSError as exc:
                              if exc.errno not in (errno.EOPNOTSUPP, errno.EISDIR, errno.EINVAL, errno.ENOSYS):
                                  return False
                      fd, probe = tempfile.mkstemp(prefix=".phasorpy-write-check-", dir=path_str)
                      try:
                          os.close(fd)
                      finally:
                          os.unlink(probe)
                      return True
                  except OSError:
                      return False
                  finally:
                      signal.pthread_sigmask(signal.SIG_SETMASK, prev_mask)


              def _cleanup_cache() -> None:
                  if _CACHE_ROOT is not None and _CACHE_OWNER_PID == os.getpid():
                      shutil.rmtree(_CACHE_ROOT, ignore_errors=True)


              def _signal_cleanup(signum: int, _frame: object) -> None:
                  _cleanup_cache()
                  if os.getpid() == 1:
                      os._exit(128 + signum)
                  signal.signal(signum, signal.SIG_DFL)
                  os.kill(os.getpid(), signum)


              def _install_signal_handlers() -> None:
                  try:
                      for sig in (signal.SIGTERM, signal.SIGHUP):
                          if signal.getsignal(sig) == signal.SIG_DFL:
                              signal.signal(sig, _signal_cleanup)
                  except ValueError:
                      pass


              def _private_subdir(sub: str) -> Path:
                  global _CACHE_ROOT, _CACHE_OWNER_PID, _CLEANUP_REGISTERED
                  if _CACHE_ROOT is None or _CACHE_OWNER_PID != os.getpid():
                      blocked = {signal.SIGINT, signal.SIGTERM, signal.SIGHUP}
                      prev_mask = signal.pthread_sigmask(signal.SIG_BLOCK, blocked)
                      try:
                          _CACHE_ROOT = Path(tempfile.mkdtemp(prefix="phasorpy-cache."))
                          _CACHE_OWNER_PID = os.getpid()
                          if not _CLEANUP_REGISTERED:
                              atexit.register(_cleanup_cache)
                              _CLEANUP_REGISTERED = True
                          _install_signal_handlers()
                      finally:
                          signal.pthread_sigmask(signal.SIG_SETMASK, prev_mask)
                  subdir = _CACHE_ROOT / sub
                  subdir.mkdir(mode=0o700, exist_ok=True)
                  return subdir


              def ensure_runtime_env() -> None:
                  try:
                      getpass.getuser()
                  except Exception:
                      os.environ["USER"] = f"uid{os.getuid()}"

                  for key, sub in (
                      ("MPLCONFIGDIR", "mpl"),
                      ("XDG_CACHE_HOME", "cache"),
                      ("XDG_CONFIG_HOME", "config"),
                      ("PHASORPY_DATA_DIR", "data"),
                  ):
                      if not is_writable_dir(os.environ.get(key)):
                          os.environ[key] = str(_private_subdir(sub))

                  if not os.environ.get("HOME"):
                      os.environ["HOME"] = str(_private_subdir("home"))

                  if os.getpid() == 1:
                      _install_signal_handlers()


              ensure_runtime_env()
              '''
          ),
          encoding="utf-8",
      )
      (site_packages / "_phasorpy_runtime.pth").write_text(
          "import _phasorpy_runtime\n",
          encoding="utf-8",
      )
  - name: phasorpy_wrapper
    executable: true
    contents: |
      #!/usr/bin/python3
      """Run PhasorPy CLI with private non-/home cache paths and POSIX job control."""

      from __future__ import annotations

      import errno
      import getpass
      import os
      import shutil
      import signal
      import subprocess
      import sys
      import tempfile


      ENV_SUBDIRS = (
          ("MPLCONFIGDIR", "mpl"),
          ("XDG_CACHE_HOME", "cache"),
          ("XDG_CONFIG_HOME", "config"),
          ("PHASORPY_DATA_DIR", "data"),
      )


      def _is_writable_dir(path_str: str | None) -> bool:
          if not path_str:
              return False
          blocked = {signal.SIGINT, signal.SIGTERM, signal.SIGHUP}
          prev_mask = signal.pthread_sigmask(signal.SIG_BLOCK, blocked)
          try:
              os.makedirs(path_str, exist_ok=True)
              if hasattr(os, "O_TMPFILE"):
                  try:
                      fd = os.open(path_str, os.O_TMPFILE | os.O_RDWR, 0o600)
                      os.close(fd)
                      return True
                  except OSError as exc:
                      if exc.errno not in (errno.EOPNOTSUPP, errno.EISDIR, errno.EINVAL, errno.ENOSYS):
                          return False
              fd, probe = tempfile.mkstemp(prefix=".phasorpy-write-check-", dir=path_str)
              try:
                  os.close(fd)
              finally:
                  os.unlink(probe)
              return True
          except OSError:
              return False
          finally:
              signal.pthread_sigmask(signal.SIG_SETMASK, prev_mask)


      def main() -> int:
          cmd = ["/opt/phasorpy/bin/phasorpy", *sys.argv[1:]]
          env = os.environ.copy()
          try:
              getpass.getuser()
          except Exception:
              env["USER"] = f"uid{os.getuid()}"
          missing = [item for item in ENV_SUBDIRS if not _is_writable_dir(env.get(item[0]))]
          if not env.get("HOME"):
              missing.append(("HOME", "home"))
          if not missing:
              os.execve(cmd[0], cmd, env)

          tmp_root: str | None = None
          proc: subprocess.Popen[bytes] | None = None
          received_signal: int | None = None
          pending_signal: int | None = None
          pending_tstp = False
          tty_fd: int | None = None
          orig_pgrp: int | None = None
          handed_tty = False

          def set_tty_pgrp(pgrp: int) -> bool:
              if tty_fd is None:
                  return False
              prev = signal.signal(signal.SIGTTOU, signal.SIG_IGN)
              try:
                  os.tcsetpgrp(tty_fd, pgrp)
                  return True
              except OSError:
                  return False
              finally:
                  signal.signal(signal.SIGTTOU, prev)

          def owns_tty() -> bool:
              if tty_fd is None or orig_pgrp is None:
                  return False
              try:
                  return os.tcgetpgrp(tty_fd) == orig_pgrp
              except OSError:
                  return False

          def child_owns_tty() -> bool:
              if tty_fd is None or proc is None:
                  return False
              try:
                  return os.tcgetpgrp(tty_fd) == proc.pid
              except OSError:
                  return False

          def hand_tty_to_child() -> None:
              nonlocal handed_tty
              if proc is None or tty_fd is None or not owns_tty():
                  return
              if set_tty_pgrp(proc.pid):
                  handed_tty = True

          def reclaim_tty() -> None:
              nonlocal handed_tty
              if handed_tty and tty_fd is not None and orig_pgrp is not None:
                  if child_owns_tty():
                      set_tty_pgrp(orig_pgrp)
                  handed_tty = False

          def forward(signum: int) -> None:
              if proc is not None and proc.returncode is None:
                  try:
                      os.killpg(proc.pid, signum)
                      if signum in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP):
                          os.killpg(proc.pid, signal.SIGCONT)
                  except ProcessLookupError:
                      pass

          def handle_signal(signum: int, _frame: object) -> None:
              nonlocal received_signal, pending_signal
              received_signal = signum
              if proc is None:
                  pending_signal = signum
              else:
                  forward(signum)

          def handle_cont(_signum: int, _frame: object) -> None:
              if proc is not None and proc.returncode is None and received_signal is None:
                  hand_tty_to_child()

          def handle_tstp(_signum: int, _frame: object) -> None:
              nonlocal pending_tstp
              if proc is None:
                  pending_tstp = True
              elif proc.returncode is None:
                  try:
                      os.killpg(proc.pid, signal.SIGTSTP)
                  except ProcessLookupError:
                      pass

          def stop_self(stop_sig: int) -> None:
              prev_tstp = signal.signal(signal.SIGTSTP, signal.SIG_DFL)
              try:
                  os.kill(os.getpid(), stop_sig)
              finally:
                  signal.signal(signal.SIGTSTP, prev_tstp)

          try:
              for sig in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP):
                  if signal.getsignal(sig) != signal.SIG_IGN:
                      signal.signal(sig, handle_signal)
              signal.signal(signal.SIGCONT, handle_cont)
              signal.signal(signal.SIGTSTP, handle_tstp)
              if received_signal is not None:
                  return 128 + received_signal

              tmp_root = tempfile.mkdtemp(prefix="phasorpy.")
              for key, subdir in missing:
                  path = os.path.join(tmp_root, subdir)
                  os.mkdir(path, 0o700)
                  env[key] = path
              if received_signal is not None:
                  return 128 + received_signal

              try:
                  tty_fd = os.open("/dev/tty", os.O_RDWR | os.O_NOCTTY | os.O_CLOEXEC)
                  os.tcgetpgrp(tty_fd)
                  orig_pgrp = os.getpgrp()
              except OSError:
                  if tty_fd is not None:
                      try:
                          os.close(tty_fd)
                      except OSError:
                          pass
                  tty_fd = None

              proc = subprocess.Popen(cmd, env=env, process_group=0)
              if received_signal is None and owns_tty():
                  hand_tty_to_child()
                  if handed_tty:
                      try:
                          os.killpg(proc.pid, signal.SIGCONT)
                      except ProcessLookupError:
                          pass

              sig_to_replay, pending_signal = pending_signal, None
              if sig_to_replay is not None:
                  forward(sig_to_replay)
              elif pending_tstp:
                  pending_tstp = False
                  try:
                      os.killpg(proc.pid, signal.SIGTSTP)
                  except ProcessLookupError:
                      pass

              rc = 0
              while True:
                  try:
                      _, status = os.waitpid(proc.pid, os.WUNTRACED)
                  except InterruptedError:
                      continue
                  except ChildProcessError:
                      break
                  if os.WIFSTOPPED(status):
                      stop_sig = os.WSTOPSIG(status)
                      if received_signal is not None:
                          try:
                              os.killpg(proc.pid, signal.SIGCONT)
                          except ProcessLookupError:
                              pass
                          continue
                      if stop_sig in (signal.SIGTTIN, signal.SIGTTOU) and (
                          owns_tty() or child_owns_tty()
                      ):
                          hand_tty_to_child()
                          try:
                              os.killpg(proc.pid, signal.SIGCONT)
                          except ProcessLookupError:
                              pass
                          continue
                      reclaim_tty()
                      stop_self(stop_sig)
                      if received_signal is not None:
                          try:
                              os.killpg(proc.pid, signal.SIGCONT)
                          except ProcessLookupError:
                              pass
                          continue
                      hand_tty_to_child()
                      try:
                          os.killpg(proc.pid, signal.SIGCONT)
                      except ProcessLookupError:
                          pass
                      continue
                  if os.WIFSIGNALED(status):
                      rc = -os.WTERMSIG(status)
                  elif os.WIFEXITED(status):
                      rc = os.WEXITSTATUS(status)
                  else:
                      continue
                  proc.returncode = rc
                  break
              if received_signal is not None:
                  return 128 + received_signal
              return 128 - rc if rc < 0 else rc
          finally:
              reclaim_tty()
              if tty_fd is not None:
                  try:
                      os.close(tty_fd)
                  except OSError:
                      pass
              if tmp_root is not None:
                  shutil.rmtree(tmp_root, ignore_errors=True)


      if __name__ == "__main__":
          raise SystemExit(main())

deploy:
  bins:
    - phasorpy

domains:
  - microscopy
  - dermatology

categories:
  - "optical imaging"
  - "quantitative imaging"
  - "spectroscopy"

readme: |-
  ----------------------------------
  ## phasorpy/{{ context.version }} ##

  PhasorPy is an open-source Python library and CLI for phasor-space analysis
  of fluorescence lifetime imaging microscopy (FLIM) and hyperspectral
  fluorescence data — useful for multiphoton and NADH/FAD autofluorescence skin
  imaging.

  ### Included CLI Tool
  ```
  phasorpy    PhasorPy CLI (versions, fetch, ...)
  ```

  ### Example
  ```
  ml phasorpy/{{ context.version }}
  phasorpy versions
  # Or inside the container shell:
  /opt/phasorpy/bin/python -c "import phasorpy; print(phasorpy.__version__)"
  ```

  Documentation: https://www.phasorpy.org/docs/stable/
  License text is installed at `/opt/phasorpy/share/licenses/PHASORPY-LICENSE.txt`.
  ----------------------------------

