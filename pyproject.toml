[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurocontainers"
version = "0.1.0"
description = "Neurocontainers YAML Build System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1.6",
    "pyyaml>=6.0.2",
    "attrs>=23.0.0",
    "jsonschema>=4.23.0",
    "packaging>=24.2",
    "requests>=2.32.0",
    "urllib3>=1.26",
    "rich>=13.0",
]

[project.optional-dependencies]
boutiques = ["boutiques==0.5.33"]
dev = [
    "pytest==9.0.3",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "codespell==2.4.3",
    "nibabel==5.4.2",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These direct-script entrypoints add the repository to sys.path before imports.
"tools/generate_apps_json.py" = ["E402"]
"tools/migrate_container_versions.py" = ["E402"]
"tools/one_pr_release.py" = ["E402"]
"tools/sync_openrecon.py" = ["E402"]
"tools/verify_container_versions.py" = ["E402"]
"workflows/full_container_test.py" = ["E402"]
"workflows/migrate_source_policies.py" = ["E402"]
"workflows/verify_binary_updates.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
files = ["builder/ir.py", "builder/variants.py", "builder/shared_inputs.py"]
follow_imports = "silent"
ignore_missing_imports = true

[tool.setuptools]
packages = ["builder", "workflows"]

[tool.setuptools.package-data]
builder = ["templates/*.yaml"]

[tool.uv]
package = true

[project.scripts]
sf-boutiques = "builder.boutiques:main"
builder = "builder.cli:main"
sf-generate = "builder.cli:sf_generate_main"
sf-build = "builder.cli:sf_build_main"
sf-login = "builder.cli:sf_login_main"
sf-test = "builder.cli:sf_test_main"
sf-test-remote = "builder.cli:sf_test_remote_main"
sf-init = "builder.cli:sf_init_main"
sf-make = "builder.cli:sf_make_main"
sf-cache = "builder.cli:sf_cache_main"
